# Allure 结果增强配置文件
# 放置在 allure-results 目录下，用于自定义报告

# ========================================
# 环境分类 (Environments)
# ========================================
[BROWSER]
value = Chromium
url = https://playwright.dev

[PLATFORM]
value = Windows 11

[REGGIE_BASE_URL]
value = http://localhost:8080

[REGGIE_API_URL]
value = http://localhost:8080/backend

[TEST_START_TIME]
value = 2026-07-16T10:00:00+08:00

# ========================================
# 测试结果分类 (Categories)
# ========================================
[Product defect]
name = 产品缺陷
messageRegex = .*

[Test defect]
name = 测试缺陷
messageRegex = .*

[Test failure]
name = 测试失败
messageRegex = .*

[Infrastructure problem]
name = 基础设施问题
messageRegex = .*
