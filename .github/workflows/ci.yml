name: CI

# 最小质量门禁：每次 push / PR 在 JDK 8 + Redis 环境下跑全量 mvn test。
# 守护 P0 鉴权切面修复（AuthAspectClassLevelTest / AuthAspectMethodLevelTest）不回归，
# 并让其余单元测试在合并前被拦截。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 测试 profile (application-test.yml) 连接 localhost:6379 的 Redis，
    # 部分 @SpringBootTest 会真实访问 Redis，故起一个服务容器。
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      # ubuntu-latest 自带 Maven 3.9.x；用 -ntp 收敛日志噪声。
      # 项目禁止 JDK 9+（animal-sniffer + enforcer 双保险），必须用 JDK 8。
      - name: Run tests
        run: mvn -B -ntp test
