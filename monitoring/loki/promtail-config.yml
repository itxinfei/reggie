server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: reggie-takeout
    static_configs:
      - targets:
          - localhost
        labels:
          job: reggie-takeout
          environment: production
          __path__: /app/logs/*.log
    relabel_configs:
      - source_labels: [__filename__]
        regex: /app/logs/reggie-(.*)\.log
        target_label: log_type
        replacement: ${1}
