global:
  scrape_interval: 15s # 每15秒采集一次
  evaluation_interval: 15s # 每15秒评估一次告警规则

# 告警规则文件
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# 采集配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 瑞吉外卖应用监控
  - job_name: "reggie-takeout"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "reggie-takeout"
          environment: "production"
    scrape_interval: 10s
    scrape_timeout: 5s
