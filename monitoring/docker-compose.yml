  #     - elasticsearch
  #   profiles:
  #     - elk

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  elasticsearch-data:
    driver: local
  kibana-data:
    driver: local

networks:
  monitoring:
    driver: bridge
