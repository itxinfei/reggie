version: '3.8'

services:
  # Elasticsearch 日志存储
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: reggie-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - monitoring
    restart: unless-stopped
    profiles:
      - elk

  # Logstash 日志处理
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: reggie-logstash
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - ELASTIC_PASSWORD=changeme
    ports:
      - "5044:5044"
      - "9600:9600"  # Logstash monitoring
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - elasticsearch
    profiles:
      - elk

  # Filebeat 日志采集
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: reggie-filebeat
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/containers:/var/log/containers:ro
      - ./logs:/app/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    environment:
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=changeme
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - elasticsearch
    profiles:
      - elk

  # Kibana 日志可视化
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: reggie-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana-data:/usr/share/kibana/data
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - elasticsearch
    profiles:
      - elk

volumes:
  elasticsearch-data:
    driver: local
  filebeat-data:
    driver: local
  kibana-data:
    driver: local
