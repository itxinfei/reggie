input {
  beats {
    port => 5044
  }
}

filter {
  if [service] == "reggie-takeout" {
    # 解析 Spring Boot 日志格式
    grok {
      match => {
        "message" => "^%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{DATA:logger} : %{GREEDYDATA:log_message}"
      }
    }

    # 解析 JSON 字段（如果存在）
    json {
      source => "log_message"
      target => "json_fields"
      skip_on_invalid_json => true
    }

    # 解析异常信息
    grok {
      match => { "log_message" => "Exception: %{DATA:exception_class}" }
    }

    # 添加标签
    mutate {
      add_field => {
        "service" => "reggie-takeout"
      }
    }

    # 解析堆栈跟踪
    multiline {
      pattern => '^\s+at '
      what => "previous"
      negate => false
    }

    # 添加 geoip 信息（如果需要）
    # geoip {
    #   source => "client_ip"
    #   target => "geoip"
    # }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "reggie-takeout-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    # 如果不需要认证，注释掉上面两行，添加下面一行
    # hosts => ["elasticsearch:9200"]
  }
}
