<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    #food-app .dialog-form .uploadImg .el-form-item__label::before {
      content: '*';
      color: #F56C6C;
      margin-right: 4px;
    }
    #food-app .dialog-form .el-form--inline .el-form-item__content {
      width: 293px;
    }
    #food-app .dialog-form .el-input { width: 293px; }
    #food-app .dialog-form .address .el-form-item__content { width: 100% !important; }
    #food-app .dialog-form .flavorBox { width: 100%; }
    #food-app .dialog-form .flavorBox .addBut {
      background: #ffc200; display: inline-block; padding: 0 20px;
      border-radius: 4px; line-height: 40px; cursor: pointer;
      color: #333; font-weight: 500;
    }
    #food-app .dialog-form .flavorBox .flavor {
      border: 1px solid #dfe2e8; border-radius: 3px; padding: 15px; background: #fafafb;
    }
    #food-app .dialog-form .flavorBox .flavor .title { color: #606168; }
    #food-app .dialog-form .flavorBox .flavor .cont .items { display: flex; margin: 10px 0; }
    #food-app .dialog-form .flavorBox .flavor .cont .items .itTit { width: 150px; margin-right: 15px; }
    #food-app .dialog-form .flavorBox .flavor .cont .items .itTit input { width: 100%; line-height: 40px; border-radius: 3px; padding: 0 10px; }
    #food-app .dialog-form .flavorBox .flavor .cont .items .labItems {
      flex: 1; display: flex; flex-wrap: wrap; border-radius: 3px;
      min-height: 39px; border: 1px solid #d8dde3; background: #fff; padding: 0 5px;
    }
    #food-app .dialog-form .flavorBox .flavor .cont .items .labItems span {
      display: inline-block; color: #f19c59; margin: 5px; line-height: 26px;
      height: 26px; padding: 0 10px; background: #fdf4eb; border-radius: 3px; border: 1px solid #fae2cd;
    }
    #food-app .dialog-form .flavorBox .flavor .cont .items .labItems span i { cursor: pointer; font-style: normal; }
    #food-app .dialog-form .flavorBox .flavor .cont .items .labItems .inputBox {
      display: inline-block; width: 100%; height: 36px; line-height: 36px; overflow: hidden;
    }
    #food-app .dialog-form .flavorBox .flavor .cont .items .delFlavor {
      display: inline-block; padding: 0 10px; color: #f19c59; cursor: pointer;
    }
    #food-app .selectInput { position: relative; width: 100%; min-width: 100px; }
    #food-app .selectInput .flavorSelect {
      position: absolute; width: 100%; padding: 0 10px; border-radius: 3px;
      border: 1px solid #FF903D; line-height: 30px; text-align: center;
      background: #fff; top: 50px; z-index: 99;
    }
    #food-app .selectInput .flavorSelect .items {
      cursor: pointer; display: inline-block; width: 100%;
      line-height: 35px; border-bottom: 1px solid #f4f4f4; color: #666;
    }
    #food-app .dialog-form .avatar-uploader .el-upload {
      border: 1px dashed #d9d9d9; border-radius: 6px; cursor: pointer; position: relative; overflow: hidden;
    }
    #food-app .dialog-form .avatar-uploader .el-upload:hover { border-color: #409eff; }
    #food-app .dialog-form .avatar-uploader-icon { font-size: 28px; color: #8c939d; width: 120px; height: 100px; line-height: 100px; text-align: center; }
    #food-app .dialog-form .avatar { width: 120px; height: 100px; display: block; }
  </style>
</head>
<body>
   <div class="dashboard-container" id="food-app">
    <div class="container">
      <div class="tableBar">
        <el-input
          v-model="input"
          placeholder="请输入菜品名称"
          style="width: 250px"
          clearable
          @keyup.enter.native="handleQuery"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="init"
          ></i>
        </el-input>
        <div class="tableLab">
          <span class="span-btn delBut non" @click="deleteHandle('批量', null)">批量删除</span>
          <span class="span-btn blueBug non" @click="statusHandle('1')">批量启售</span>
          <span style="border:none; color: #E6A23C;" class="span-btn non" @click="statusHandle('0')">批量停售</span>
          <el-button
            type="primary"
            @click="addFoodtype('add')"
          >
            + 新建菜品
          </el-button>
        </div>
      </div>
      <el-table
        :data="tableData"
        stripe
        class="tableBox"
        @selection-change="handleSelectionChange"
      >
        <el-table-column
          type="selection"
          width="25"
        ></el-table-column>
        <el-table-column
          prop="name"
          label="菜品名称"
        ></el-table-column>
        <el-table-column prop="image" label="图片" align="center">
          <template slot-scope="{ row }">
            <el-image style="width: auto; height: 40px; border:none;cursor: pointer;" 
            :src="getImage(row.image)" 
            :preview-src-list="[ `/common/download?name=${row.image}` ]" >
            <div slot="error" class="image-slot">
              <img src="./../../images/noImg.png"  style="width: auto; height: 40px; border:none;" >
            </div>  
          </el-image>
          </template>
        </el-table-column>
        <el-table-column
          prop="categoryName"
          label="菜品分类"
        ></el-table-column>
        <el-table-column label="售价">
          <template slot-scope="scope">
            <span style="margin-right: 10px;">￥{{ scope.row.price/100 }}</span>
          </template>
        </el-table-column>
        <el-table-column label="售卖状态">
          <template slot-scope="scope">
            <span style="margin-right: 10px;">{{ scope.row.status == '0' ? '停售' : '启售' }}</span>
          </template>
        </el-table-column>
        <el-table-column
          prop="updateTime"
          label="最后操作时间"
        >
        </el-table-column>
        <el-table-column
          label="操作"
          width="160"
          align="center"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="addFoodtype(scope.row.id)"
            >
              修改
            </el-button>
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="statusHandle(scope.row)"
            >
              {{ scope.row.status == '0' ? '启售' : '停售' }}
            </el-button>
            <el-button
              type="text"
              size="small"
              class="delBut non"
              @click="deleteHandle('单删', scope.row.id)"
            >
              删除
            </el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <!-- 添加/编辑菜品弹窗 -->
    <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="700px" top="10vh" :before-close="handleDialogClose">
      <div class="dialog-form">
        <el-form ref="dialogForm" :model="formData" :rules="formRules" :inline="true" label-width="120px">
          <div>
            <el-form-item label="菜品名称:" prop="name">
              <el-input v-model="formData.name" placeholder="请填写菜品名称" maxlength="20"></el-input>
            </el-form-item>
            <el-form-item label="菜品分类:" prop="categoryId">
              <el-select v-model="formData.categoryId" placeholder="请选择菜品分类">
                <el-option v-for="(item,index) in dishList" :key="index" :label="item.name" :value="item.id"></el-option>
              </el-select>
            </el-form-item>
          </div>
          <div>
            <el-form-item label="菜品价格:" prop="price">
              <el-input v-model="formData.price" placeholder="请设置菜品价格"></el-input>
            </el-form-item>
          </div>
          <el-form-item label="口味做法配置:">
            <el-form-item>
              <div class="flavorBox">
                <span v-if="dishFlavors.length == 0" class="addBut" @click="addFlavore">+ 添加口味</span>
                <div v-if="dishFlavors.length != 0" class="flavor">
                  <div class="title">
                    <span>口味名（3个字内）</span><span>口味标签（输入标签回车添加）</span>
                  </div>
                  <div class="cont">
                    <div v-for="(item, index) in dishFlavors" :key="index" class="items">
                      <div class="itTit">
                        <div class="selectInput">
                          <div>
                            <el-input v-model="item.name" type="text" style="width: 100%" placeholder="请输入口味" @focus="selectFlavor(true,index)" @blur="outSelect(false,index)" @input="inputHandle(index)"></el-input>
                          </div>
                          <div v-show="item.showOption" class="flavorSelect">
                            <span v-for="(it, ind) in dishFlavorsData" :key="ind" class="items" @click="checkOption(it,ind,index)">{{ it.name }}</span>
                            <span v-if="dishFlavorsData == []" class="none">无数据</span>
                          </div>
                        </div>
                      </div>
                      <div class="labItems" style="display: flex">
                        <span v-for="(it, ind) in item.value" :key="ind">{{ it }} <i @click="delFlavorLabel(index, ind)">X</i></span>
                        <div class="inputBox" :style="inputStyle" contenteditable="true" @focus="flavorPosition(index)" @keydown.enter="(val)=>keyDownHandle(val,index)"></div>
                      </div>
                      <span class="delFlavor delBut non" @click="delFlavor(index)">删除</span>
                    </div>
                  </div>
                  <div class="addBut" @click="addFlavore">添加口味</div>
                </div>
              </div>
            </el-form-item>
          </el-form-item>
          <div>
            <el-form-item label="菜品图片:" prop="region" class="uploadImg">
              <el-upload class="avatar-uploader" action="/common/upload" :show-file-list="false" :on-success="handleAvatarSuccess" :on-change="onChange" ref="upload">
                <img v-if="imageUrl" :src="imageUrl" class="avatar"></img>
                <i v-else class="el-icon-plus avatar-uploader-icon"></i>
              </el-upload>
            </el-form-item>
          </div>
          <div class="address">
            <el-form-item label="菜品描述:">
              <el-input v-model="formData.description" type="textarea" :rows="3" placeholder="菜品描述，最长200字" maxlength="200"></el-input>
            </el-form-item>
          </div>
        </el-form>
      </div>
      <span slot="footer">
        <el-button @click="dialogVisible = false">取 消</el-button>
        <el-button type="primary" @click="handleDialogSubmit">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../js/validate.js"></script>
    <script src="../../js/index.js"></script>
    <script src="../../api/food.js"></script>
    <script>
      new Vue({
        el: '#food-app',
        data() {
          return {
             input: '',
             counts: 0,
             page: 1,
             pageSize: 10,
             tableData : [],
             dishState : '',
             checkList: [],
             dialogVisible: false,
             dialogTitle: '',
             editId: '',
             imageUrl: '',
             dishList: [],
             dishFlavorsData: [],
             dishFlavors: [],
             flavorIndex: 0,
             inputStyle: {'flex':1},
             formData: {
               name: '', id: '', price: '', image: '',
               description: '', status: true, categoryId: ''
             }
          }
        },
        computed: {
          formRules() {
            return {
              name: [{'required': true, 'message': '请填写菜品名称', 'trigger': 'blur'}],
              categoryId: [{'required': true, 'message': '请选择菜品分类', 'trigger': 'change'}],
              price: [{
                'required': true,
                validator: (rules, value, callback) => {
                  if (!value) { callback(new Error('请填写菜品价格')) }
                  else {
                    const reg = /^\d+(\.\d{0,2})?$/
                    if (reg.test(value)) {
                      if (value < 10000) callback()
                      else callback(new Error('菜品价格小于10000'))
                    } else {
                      callback(new Error('菜品价格格式只能为数字,且最多保留两位小数'))
                    }
                  }
                },
                'trigger': 'blur'
              }]
            }
          }
        },
        created() {
          this.init()
          this.getDishList()
          this.getFlavorListHand()
        },
        mounted() {
        },
        methods: {
          async init () {
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input ? this.input : undefined
            }
            await getDishPage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          getImage (image) {
            return `/common/download?name=${image}`
          },
          handleQuery() {
            this.page = 1;
            this.init();
          },
          // 添加
          addFoodtype (st) {
            this.editId = st === 'add' ? '' : st
            this.dialogTitle = st === 'add' ? '添加菜品' : '修改菜品'
            if (st === 'add') {
              this.imageUrl = ''
              this.dishFlavors = []
              this.formData = { name: '', id: '', price: '', image: '', description: '', status: true, categoryId: '' }
            } else {
              queryDishById(st).then(res => {
                if (String(res.code) === '1') {
                  this.formData = { ...res.data }
                  this.formData.price = String(res.data.price / 100)
                  this.formData.status = res.data.status == '1'
                  this.dishFlavors = res.data.flavors && res.data.flavors.map(obj => ({ ...obj, value: JSON.parse(obj.value), showOption: false }))
                  this.imageUrl = `/common/download?name=${res.data.image}`
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              })
            }
            this.dialogVisible = true
            this.$nextTick(() => {
              if (this.$refs.dialogForm) this.$refs.dialogForm.clearValidate()
            })
          },
          handleDialogSubmit () {
            this.$refs.dialogForm.validate(valid => {
              if (valid) {
                if (!this.imageUrl) { return this.$message.error('请上传菜品图片') }
                let params = { ...this.formData }
                params.status = 1
                params.price *= 100
                params.categoryId = this.formData.categoryId
                params.flavors = this.dishFlavors.map(obj => ({ ...obj, value: JSON.stringify(obj.value) }))
                if (this.editId) {
                  delete params.updateTime
                  editDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品修改成功！')
                      this.dialogVisible = false
                      this.handleQuery()
                    } else { this.$message.error(res.msg || '操作失败') }
                  }).catch(err => { this.$message.error('请求出错了：' + err) })
                } else {
                  delete params.id
                  addDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品添加成功！')
                      this.dialogVisible = false
                      this.handleQuery()
                    } else { this.$message.error(res.msg || '操作失败') }
                  }).catch(err => { this.$message.error('请求出错了：' + err) })
                }
              }
            })
          },
          handleDialogClose () { this.dialogVisible = false },
          handleAvatarSuccess (response) {
            if (response.code === 0 && response.msg === '未登录') { window.top.location.href = '/backend/page/login/login.html' }
            else { this.imageUrl = `/common/download?name=${response.data}`; this.formData.image = response.data }
          },
          onChange (file) {
            if (file) {
              const suffix = file.name.split('.')[1]
              const size = file.size / 1024 / 1024 < 2
              if (['png','jpeg','jpg'].indexOf(suffix) < 0) { this.$message.error('上传图片只支持 png、jpeg、jpg 格式！'); this.$refs.upload.clearFiles(); return false }
              if (!size) { this.$message.error('上传文件大小不能超过 2MB!'); return false }
              return file
            }
          },
          addFlavore () { this.dishFlavors.push({'name': '', 'value': [], showOption: false}) },
          delFlavor (ind) { this.dishFlavors.splice(ind, 1) },
          delFlavorLabel (index, ind) { this.dishFlavors[index].value.splice(ind, 1) },
          flavorPosition (index) { this.flavorIndex = index },
          keyDownHandle (val, index) {
            if (event) { event.cancelBubble = true; event.preventDefault(); event.stopPropagation() }
            if (val.target.innerText.trim() != '') { this.dishFlavors[index].value.push(val.target.innerText); val.target.innerText = '' }
          },
          getDishList () {
            getCategoryList({'type': 1}).then(res => {
              if (res.code === 1) { this.dishList = res.data }
              else { this.$message.error(res.msg || '操作失败') }
            })
          },
          getFlavorListHand () {
            this.dishFlavorsData = [
              {'name':'甜味','value':['无糖','少糖','半糖','多糖','全糖']},
              {'name':'温度','value':['热饮','常温','去冰','少冰','多冰']},
              {'name':'忌口','value':['不要葱','不要蒜','不要香菜','不要辣']},
              {'name':'辣度','value':['不辣','微辣','中辣','重辣']}
            ]
          },
          selectFlavor (st, index) {
            const obj = JSON.parse(JSON.stringify(this.dishFlavors[index]))
            obj.showOption = st; this.dishFlavors.splice(index, 1, obj)
          },
          outSelect (st, index) {
            const _this = this
            setTimeout(() => {
              const obj = JSON.parse(JSON.stringify(_this.dishFlavors[index]))
              obj.showOption = st; _this.dishFlavors.splice(index, 1, obj)
            }, 200)
          },
          inputHandle (val, index) {},
          checkOption (val, ind, index) { this.selectHandle(val.name, index, ind); this.dishFlavors[index].name = val.name },
          selectHandle (val, key, ind) {
            const arrDate = [...this.dishFlavors]
            arrDate[key] = JSON.parse(JSON.stringify(this.dishFlavorsData[ind]))
            this.dishFlavors = arrDate
          },

          // 删除
          deleteHandle (type, id) {
            if (type === '批量' && id === null) {
              if (this.checkList.length === 0) {
                return this.$message.error('请选择删除对象')
              }
            }
            this.$confirm('确认删除该菜品, 是否继续?', '确定删除', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
            }).then(() => {
              deleteDish(type === '批量' ? this.checkList.join(',') : id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求出错了：' + err)
              })
            })
          },

          //状态更改
          statusHandle (row) {
            let params = {}
            if (typeof row === 'string' ) {
              if (this.checkList.length === 0) {
                this.$message.error('批量操作，请先勾选操作菜品！')
                return false
              }
              params.id = this.checkList.join(',')
              params.status = row
            } else {
              params.id = row.id
              params.status = row.status ? '0' : '1'
            }
            this.dishState = params
            this.$confirm('确认更改该菜品状态?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
            }).then(() => {
              // 起售停售---批量起售停售接口
              dishStatusByStatus(this.dishState).then(res => {
                if (res.code === 1) {
                  this.$message.success('菜品状态已经更改成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                  this.$message.error('请求出错了：' + err)
              })
            })
          },

          // 全部操作
          handleSelectionChange (val){
            let checkArr = []
            val.forEach((n) => {
              checkArr.push(n.id)
            })
            this.checkList = checkArr
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
