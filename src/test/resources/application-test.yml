# 测试环境配置：连接本地 MySQL 开发库 reggie（开发 / 测试共用单库）。
# 测试数据与演示数据通过「租户 + 命名空间」隔离，绝不互相清删：
#  - 演示数据挂在租户 1（页面默认展示），测试永不触碰；
#  - 自动化测试数据挂在租户 999（TenantTestExecutionListener 全局注入），
#    全局字典表用 test: / test_ 前缀（见 TestDatabaseCleaner）。
# 本环境不做整库 DROP / 重建；cleaner 只清测试租户 999 与 test 命名空间，测试可反复执行。
server:
  port: 8080
spring:
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/reggie?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
reggie:
  payment:
    # 测试环境一律走 mock 渠道（工厂首行直接返回 mock Bean，不触数据库/网络），
    # 不依赖 application.yml 的默认值，保证支付相关测试零回归
    mock-mode: true
