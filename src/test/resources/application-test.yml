# 测试环境配置：连接本地 MySQL 独立测试库 reggie_test。
# 【一次性沙盒】reggie_test 由 TestDbProvisioner 在测试上下文刷新前自动管理：
# 结构指纹（全部 schema*.sql）变化时自动 DROP+CREATE 重建全量表结构，平时复用。
# 因此：新加表/列只需改 schema*.sql，本库永远不需要手动执行迁移。
# 红线不变：与开发库 reggie 隔离是刻意的——测试代码含大量 DELETE FROM 清库动作，
# 指向 reggie 会清空页面展示的业务数据；本库数据是一次性的，可随时丢弃重建。
server:
  port: 8080
spring:
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/reggie_test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
reggie:
  payment:
    # 测试环境一律走 mock 渠道（工厂首行直接返回 mock Bean，不触数据库/网络），
    # 不依赖 application.yml 的默认值，保证支付相关测试零回归
    mock-mode: true
