# 测试环境配置：连接本地 MySQL 独立测试库 reggie_test（一次性初始化见 AGENTS.md「测试库」）。
# 与开发库 reggie 隔离：reggie 内的真实业务种子数据（user id 1-25 等）会与
# 测试硬编码主键/空表断言冲突，导致 148 个用例间歇性失败。
# 红线：schema*.sql 含 DROP TABLE 会重建表、清空数据，严禁把这里指向公网/生产数据库。
server:
  port: 8080
spring:
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/reggie_test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
reggie:
  payment:
    # 测试环境一律走 mock 渠道（工厂首行直接返回 mock Bean，不触数据库/网络），
    # 不依赖 application.yml 的默认值，保证支付相关测试零回归
    mock-mode: true
