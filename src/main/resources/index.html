<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>瑞吉外卖 · 系统入口</title>
<style>
  :root{
    --brand:#ffc200;
    --text-primary:#1f2937;
    --text-secondary:#4b5563;
    --text-muted:#9ca3af;
    --bg:#f5f6fa;
    --surface:#ffffff;
    --border:#e5e7eb;
    --radius-md:8px;
    --radius-lg:12px;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
    --shadow-md:0 4px 12px rgba(0,0,0,0.12);
    --space-4:16px;
    --space-6:24px;
    --transition:0.2s cubic-bezier(0.4,0,0.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text-primary);background:var(--bg);line-height:1.5}
  .wrapper{max-width:720px;margin:0 auto;padding:80px var(--space-4)}
  .header{text-align:center;margin-bottom:56px}
  .logo{font-size:48px;margin-bottom:16px}
  .title{font-size:24px;font-weight:600;margin-bottom:8px;color:var(--text-primary)}
  .subtitle{font-size:14px;color:var(--text-muted)}
  .cards{display:flex;flex-direction:column;gap:var(--space-6)}
  .card{display:flex;align-items:center;padding:24px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border);text-decoration:none;transition:all var(--transition);cursor:pointer}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--brand)}
  .card-icon{flex-shrink:0;width:56px;height:56px;border-radius:var(--radius-md);background:var(--brand);color:#1a1a1a;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:20px}
  .card-body{flex:1;min-width:0}
  .card-title{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
  .card-desc{font-size:13px;color:var(--text-secondary);margin-bottom:6px}
  .card-url{font-size:12px;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .card-arrow{flex-shrink:0;color:var(--text-muted);font-size:20px;margin-left:16px;transition:color var(--transition),transform var(--transition)}
  .card:hover .card-arrow{color:var(--brand);transform:translateX(4px)}
  .footer{text-align:center;margin-top:48px;font-size:12px;color:var(--text-muted)}
  @media (max-width:640px){
    .wrapper{padding:48px var(--space-4)}
    .header{margin-bottom:36px}
    .logo{font-size:36px}
    .title{font-size:20px}
    .card{padding:20px}
    .card-icon{width:48px;height:48px;margin-right:16px}
  }
</style>
</head>
<body>
<div class="wrapper">
  <header class="header">
    <div class="logo">🍜</div>
    <h1 class="title">瑞吉外卖</h1>
    <p class="subtitle">请选择访问入口</p>
  </header>

  <div class="cards">
    <a class="card" href="/backend/index.html" role="link">
      <div class="card-icon">管</div>
      <div class="card-body">
        <div class="card-title">管理后台</div>
        <div class="card-desc">员工管理 · 订单管理 · 菜品管理 · 数据统计</div>
        <div class="card-url">/backend/index.html</div>
      </div>
      <span class="card-arrow">→</span>
    </a>

    <a class="card" href="/front/index.html" role="link">
      <div class="card-icon">用</div>
      <div class="card-body">
        <div class="card-title">用户端</div>
        <div class="card-desc">点餐下单 · 个人中心 · 外卖配送 · 堂食取号</div>
        <div class="card-url">/front/index.html</div>
      </div>
      <span class="card-arrow">→</span>
    </a>
  </div>

  <div class="footer">Reggie Takeout · Spring Boot 2.4 + Vue2 + Vant</div>
</div>
</body>
</html>
