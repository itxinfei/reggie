<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的发票 - 瑞吉外卖</title>
  <link rel="icon" href="./../images/favico.ico">
  <script src="./../js/base.js?v=20260917"></script>
  <link rel="stylesheet" href="../styles/vant.min.css"/>
  <link rel="stylesheet" href="../styles/index.css?v=20260922" />
  <link rel="stylesheet" href="../styles/skeleton.css?v=20260922" />
  <link rel="stylesheet" href="../styles/my-invoice.css?v=20260921" />
  <!-- 加载 remixicon 图标库 -->
  <link rel="stylesheet" href="../../backend/plugins/remixicon/remixicon.css" />
  <script src="./../js/icon-fallback.js?v=20260917"></script>
</head>
<body class="scrollable-page">
  <div id="invoice-list-app">
    <!-- 修改点：骨架屏替代 loading 遮罩 -->
    <div v-if="loading" class="skeleton-container">
      <!-- 发票卡片骨架 -->
      <div class="skeleton-inv-card" v-for="i in 3" :key="'si'+i">
        <div class="skeleton-inv-header">
          <div class="skeleton-line skeleton-w50"></div>
          <div class="skeleton-tag"></div>
        </div>
        <div class="skeleton-inv-row">
          <div class="skeleton-line skeleton-w30"></div>
          <div class="skeleton-line skeleton-w40"></div>
        </div>
        <div class="skeleton-inv-row">
          <div class="skeleton-line skeleton-w30"></div>
          <div class="skeleton-line skeleton-w50"></div>
        </div>
        <div class="skeleton-inv-row">
          <div class="skeleton-line skeleton-w30"></div>
          <div class="skeleton-line skeleton-w40"></div>
        </div>
      </div>
    </div>

    <div class="divHead">
      <div class="divTitle">
        <i class="ri-arrow-left-s-line" @click="goBack"></i>我的发票
      </div>
    </div>

    <!-- 发票记录列表 -->
    <!-- 修改点：van-pull-refresh 包裹列表实现下拉刷新 -->
    <van-pull-refresh v-model="refreshing" @refresh="onRefresh" success-text="刷新成功">
    <div class="inv-list" v-if="records.length > 0">
      <div v-for="item in records" :key="item.id" class="inv-card" @click="goInvoice(item)">
        <div class="card-head">
          <span class="title-name">{{ item.title || '未填写抬头' }}</span>
          <van-tag :style="'background:' + stateColor(item.status) + '; color:' + stateTextColor(item.status) + '; border:none;'" size="medium">{{ statusText(item.status) }}</van-tag>
        </div>
        <div class="row">
          <span class="label">订单号</span>
          <span class="mono">{{ item.orderNo || '--' }}</span>
        </div>
        <div class="row">
          <span class="label">申请时间</span>
          <span>{{ fmtTime(item.applyTime) }}</span>
        </div>
        <div class="row">
          <span class="label">开票金额</span>
          <span class="price">￥{{ Number(item.amount || 0).toFixed(2) }}</span>
        </div>
      </div>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" v-else-if="!loading">
      <i class="ri-file-text-line"></i>
      <p class="empty-text">暂无发票记录</p>
    </div>
    </van-pull-refresh>

    <!-- 分页 -->
    <van-pagination
        v-if="total > pageSize"
        v-model="page"
        :total-items="total"
        :items-per-page="pageSize"
        @change="onPageChange"
        class="pagination-wrap"
    ></van-pagination>
  </div>

  <script src="../../backend/plugins/vue/vue.js"></script>
  <script src="./../js/vant.min.js"></script>
  <script src="../../backend/plugins/axios/axios.min.js"></script>
  <script src="./../js/request.js?v=20260917"></script>
  <script src="./../api/main.js?v=20260917"></script>
  <script src="./../js/common.js?v=20260917"></script>
  <script src="./../api/invoice.js?v=20260917"></script>
  <script>
    new Vue({
      el: '#invoice-list-app',
      data: function() {
        return {
          loading: false,
          refreshing: false,
          records: [],
          total: 0,
          page: 1,
          pageSize: 10
        }
      },
      created: function() {
        // 未登录前置拦截：重定向登录页并携带回跳地址
        if (!sessionStorage.getItem('userPhone')) {
          window.location.href = '/front/page/login.html?redirect='
            + encodeURIComponent(window.location.pathname + window.location.search);
          return
        }
        this.loadData()
      },
      methods: {
        // 修改点：下拉刷新（refreshing 由 loadData.finally 复位）
        onRefresh: function(){
          this.page = 1
          this.loadData()
        },
        loadData: function() {
          var self = this
          this.loading = true
          invoiceMyPageApi({ page: this.page, pageSize: this.pageSize }).then(function(res) {
            if (res.code === 1) {
              self.records = (res.data && res.data.records) || []
              self.total = (res.data && res.data.total) || 0
            } else {
              vant.Toast.fail(res.msg || '加载发票记录失败')
            }
          }).catch(function(err) {
            if (err.message !== 'NOTLOGIN') vant.Toast.fail('加载发票记录失败')
          }).finally(function() {
            self.loading = false
            // 修改点：下拉刷新与实际加载同步
            self.refreshing = false
          })
        },
        onPageChange: function(p) {
          this.page = p
          this.loadData()
          // 修改点(2026-09-18)：换页后回到列表顶部，否则视口停留在底部分页器，看不到新页首条
          window.scrollTo(0, 0)
        },
        // 状态文案
        statusText: function(s) {
          if (s == 0) return '待申请'
          if (s == 1) return '已申请，待开具'
          if (s == 2) return '已开具'
          if (s == 3) return '已作废'
          return '未知'
        },
        // Vant 2 van-tag 合法类型：default/primary/success/danger/warning
        // 修改点：stateColor 优先使用品牌令牌语义色（令牌绿/红由全局 --van-* 变量统一），Vant 内置色作为兜底
        // 修改点(2026-09-15)：状态底色改用设计令牌（替代硬编码 rgba），与全站状态色体系统一
        stateColor: function(s) {
          if (s == 1) return 'var(--color-primary-tint)' // 待开具：品牌金浅底
          if (s == 2) return 'var(--color-success-bg)'  // 已开具：成功绿浅底
          return 'var(--bg-input)'                        // 待申请/已作废：中性灰
        },
        tagType: function(s) {
          if (s == 1) return 'default'
          if (s == 2) return 'default'
          return 'default'
        },
        // 状态文字色：1 警告黄 / 2 成功绿 / 其余中性灰
        stateTextColor: function(s) {
          if (s == 1) return 'var(--color-warning)'
          if (s == 2) return 'var(--color-success)'
          return 'var(--color-text-hint)'
        },
        // 时间格式化（兼容后端 LocalDateTime 的 ISO 带 T 格式）
        fmtTime: function(val) {
          if (!val) return '-'
          var s = String(val)
          return s.indexOf('T') > -1 ? s.replace('T', ' ').substring(0, 19) : s
        },
        // 跳转到对应订单的发票详情（携带订单号/金额，供开发票页回显）
        goInvoice: function(item) {
          var qs = 'orderId=' + encodeURIComponent(item.orderId || '')
              + '&orderNo=' + encodeURIComponent(item.orderNo || '')
              + '&amount=' + encodeURIComponent(item.amount != null ? item.amount : '')
          window.requestAnimationFrame(function() {
            window.location.href = '/front/page/invoice.html?' + qs
          })
        },
        goBack: function() {
          if (window.history.length > 1) {
            history.go(-1)
          } else {
            window.location.href = '/front/page/user.html'
          }
        }
      }
    })
  </script>
</body>
</html>
