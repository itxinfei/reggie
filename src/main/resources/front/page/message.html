<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>消息中心 - 瑞吉外卖</title>
    <link rel="icon" href="./../images/favico.ico">
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <!-- 修改点：提取内联样式到独立CSS文件 -->
    <link rel="stylesheet" href="./../styles/message.css" />
</head>
<body>
    <div id="messageApp" class="app">
        <div class="divHead">
            <div class="divTitle">
                <i class="icon-back-arrow" @click="goBack"></i>消息中心
            </div>
        </div>

        <div class="divContent">
            <!-- 消息列表 -->
            <div v-for="msg in messages" :key="msg.id"
                 :class="['msg-card', msg.status === 1 ? 'unread' : 'read']"
                 @click="openDetail(msg)">
                <div v-if="msg.status === 1" class="unread-dot"></div>
                <div v-else class="read-badge">已读</div>
                <div class="msg-header">
                    <span class="msg-title">{{ msg.title || '系统消息' }}</span>
                    <span :class="['msg-tag', pushTypeClass(msg.pushType)]">{{ pushTypeName(msg.pushType) }}</span>
                </div>
                <div class="msg-content">{{ msg.content }}</div>
                <div class="msg-time">{{ formatTime(msg.createTime) }}</div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" v-if="messages.length === 0 && !loading">
                <img src="./../images/noImg.png" />
                <p>暂无消息</p>
            </div>

            <!-- 加载更多 -->
            <div class="load-more" v-if="hasMore && messages.length > 0" @click="loadMore">
                {{ loading ? '加载中...' : '加载更多' }}
            </div>
        </div>

        <!-- 消息详情弹窗 -->
        <div class="detail-overlay" :class="{show: detail.show}" @click.self="closeDetail()">
            <div class="detail-card">
                <div class="detail-title">{{ detail.title }}</div>
                <div class="detail-content">{{ detail.content }}</div>
                <div class="detail-time">{{ formatTime(detail.createTime) }}</div>
                <button class="detail-close" @click="closeDetail()">关闭</button>
            </div>
        </div>
    </div>

    <script src="../../backend/plugins/vue/vue.js"></script>
    <script src="./../js/vant.min.js"></script>
    <script src="./../js/base.js"></script>
    <script src="../../backend/plugins/axios/axios.min.js"></script>
    <script src="./../js/request.js"></script>
    <script src="./../api/recommend.js"></script>
    <script src="./../js/common.js"></script>
    <script>
        // 修改点：用户消息中心页面 - 允许用户查看、阅读营销消息
        new Vue({
            el: '#messageApp',
            data: function() {
                return {
                    messages: [],
                    page: 1,
                    pageSize: 15,
                    loading: false,
                    hasMore: true,
                    detail: {
                        show: false,
                        title: '',
                        content: '',
                        createTime: ''
                    }
                };
            },
            created: function() {
                this.loadMessages();
                // 修改点：注册 ESC 键监听，支持关闭消息详情弹窗
                this._handleEscKey = function(e) {
                    if ((e.key === 'Escape' || e.key === 'Esc') && this.detail.show) {
                        this.closeDetail();
                    }
                }.bind(this);
                document.addEventListener('keydown', this._handleEscKey);
            },
            beforeDestroy: function() {
                // 修改点：移除 ESC 键监听
                if (this._handleEscKey) {
                    document.removeEventListener('keydown', this._handleEscKey);
                }
            },
            methods: {
                goBack: function() {
                    history.go(-1);
                },

                loadMessages: function() {
                    var self = this;
                    if (self.loading) return;
                    self.loading = true;

                    recommendApi.getUserMessages(self.page, self.pageSize).then(function(res) {
                        if (res && res.code === 1 && res.data) {
                            var records = res.data.records || [];
                            if (self.page === 1) {
                                self.messages = records;
                            } else {
                                self.messages = self.messages.concat(records);
                            }
                            self.hasMore = records.length >= self.pageSize;
                        }
                    }).catch(function(err) {
                        console.error('加载消息失败:', err);
                    }).finally(function() {
                        self.loading = false;
                    });
                },

                loadMore: function() {
                    this.page++;
                    this.loadMessages();
                },

                // 修改点：点击消息打开详情，同时标记为已读
                openDetail: function(msg) {
                    this.detail.title = msg.title || '系统消息';
                    this.detail.content = msg.content || '';
                    this.detail.createTime = msg.createTime;
                    this.detail.show = true;

                    // 修改点：未读消息自动标记为已读
                    if (msg.status === 1) {
                        var self = this;
                        recommendApi.markMessageRead(msg.id).then(function(res) {
                            if (res && res.code === 1) {
                                msg.status = 2;
                            }
                        }).catch(function(err) {
                            console.error('标记已读失败:', err);
                        });
                    }
                },

                closeDetail: function() {
                    this.detail.show = false;
                },

                pushTypeName: function(type) {
                    var map = { 1: '弹窗', 2: '通知', 3: '短信', 4: '优惠券' };
                    return map[type] || '其他';
                },

                pushTypeClass: function(type) {
                    var map = { 1: 'tag-popup', 2: 'tag-notification', 3: 'tag-sms', 4: 'tag-coupon' };
                    return map[type] || '';
                },

                formatTime: function(dateStr) {
                    if (!dateStr) return '';
                    var d = new Date(dateStr);
                    var now = new Date();
                    var pad = function(n) { return String(n).padStart(2, '0'); };

                    var dateStr2 = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
                    var todayStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());

                    var time = pad(d.getHours()) + ':' + pad(d.getMinutes());
                    if (dateStr2 === todayStr) {
                        return '今天 ' + time;
                    }
                    var yesterday = new Date(now.getTime() - 86400000);
                    var yesterdayStr = yesterday.getFullYear() + '-' + pad(yesterday.getMonth()+1) + '-' + pad(yesterday.getDate());
                    if (dateStr2 === yesterdayStr) {
                        return '昨天 ' + time;
                    }
                    return dateStr2 + ' ' + time;
                }
            }
        });
    </script>
</body>
</html>
