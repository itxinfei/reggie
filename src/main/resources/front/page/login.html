<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
        <title>登录 - 瑞吉外卖</title>
        <link rel="icon" href="./../images/favico.ico">
        <script src="./../js/base.js"></script>
        <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css" />
        <link rel="stylesheet" href="../styles/vant.min.css"/>
        <link rel="stylesheet" href="../../backend/styles/icon/iconfont.css" />
        <link rel="stylesheet" href="../styles/index.css" />
        <link rel="stylesheet" href="./../styles/login.css" />
    </head>
    <body class="login-page">
        <div id="login" v-loading="loading">
            <!-- 品牌区 - 美团风格：食物主题插画 -->
            <div class="brandArea">
                <div class="brandIcon">
                    <svg viewBox="0 0 72 72" width="72" height="72">
                        <!-- 碗体 -->
                        <ellipse cx="36" cy="38" rx="28" ry="22" fill="#FFC200"/>
                        <ellipse cx="36" cy="38" rx="28" ry="22" fill="url(#bowlGrad)"/>
                        <!-- 碗口 -->
                        <rect x="8" y="16" width="56" height="4" rx="2" fill="#FFB300"/>
                        <!-- 米饭 -->
                        <ellipse cx="36" cy="18" rx="24" ry="8" fill="#FFF8E1"/>
                        <ellipse cx="30" cy="16" rx="10" ry="5" fill="#FFFFFF" opacity="0.6"/>
                        <ellipse cx="42" cy="15" rx="8" ry="4" fill="#FFFFFF" opacity="0.4"/>
                        <!-- 热气 -->
                        <path d="M22 10 Q24 4 22 -2" fill="none" stroke="#FFE082" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
                            <animate attributeName="d" values="M22 10 Q24 4 22 -2;M22 10 Q20 4 22 -2;M22 10 Q24 4 22 -2" dur="2s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
                        </path>
                        <path d="M36 6 Q38 -1 36 -8" fill="none" stroke="#FFE082" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
                            <animate attributeName="d" values="M36 6 Q38 -1 36 -8;M36 6 Q34 -1 36 -8;M36 6 Q38 -1 36 -8" dur="2.5s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
                        </path>
                        <path d="M50 12 Q52 5 50 -2" fill="none" stroke="#FFE082" stroke-width="2" stroke-linecap="round" opacity="0.5">
                            <animate attributeName="d" values="M50 12 Q52 5 50 -2;M50 12 Q48 5 50 -2;M50 12 Q52 5 50 -2" dur="3s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
                        </path>
                        <!-- 碗底阴影 -->
                        <ellipse cx="36" cy="58" rx="22" ry="4" fill="rgba(0,0,0,0.08)"/>
                        <defs>
                            <radialGradient id="bowlGrad" cx="30%" cy="30%">
                                <stop offset="0%" stop-color="#FFE082" stop-opacity="0.5"/>
                                <stop offset="100%" stop-color="transparent"/>
                            </radialGradient>
                        </defs>
                    </svg>
                </div>
                <div class="brandName">瑞吉外卖</div>
                <div class="brandSlogan">美味生活，即刻送达</div>
            </div>

            <!-- 表单卡片 -->
            <div class="divContainer">
                <div class="inputItem">
                    <el-input placeholder="请输入手机号码" v-model="form.phone" maxlength="11">
                        <i slot="prefix" class="inputIcon iconfont icon-user"></i>
                    </el-input>
                </div>
                <div class="divSplit"></div>
                <div class="inputItem codeItem">
                    <el-input placeholder="请输入验证码" v-model="form.code" maxlength="6">
                        <i slot="prefix" class="inputIcon iconfont icon-lock"></i>
                    </el-input>
                    <span class="codeBtn"
                          @click='getCode'
                          :class="{codeDisabled: countdown > 0}">
                        {{ countdown > 0 ? countdown + 's后重发' : '获取验证码' }}
                    </span>
                </div>
            </div>

            <!-- 错误提示 -->
            <div class="divMsg" v-if="msgFlag">手机号输入不正确，请重新输入</div>

            <!-- 登录按钮 -->
            <!-- 修改点：增加协议勾选校验 -->
            <el-button
                :class="['btnLogin', canLogin ? 'btnActive' : 'btnDisabled']"
                @click="btnLogin"
                :disabled="!canLogin"
                :loading="loading">
                登录
            </el-button>

            <!-- 修改点：协议勾选框 + 查看全文链接 -->
            <div class="agreementRow">
                <label class="agreementCheckbox" @click="toggleAgreement">
                    <span class="checkIcon" :class="{checked: agreed}">
                        <i v-if="agreed" class="el-icon-check"></i>
                    </span>
                </label>
                <span class="agreementText">
                    已阅读并同意
                    <span class="agreementLink" @click="showAgreement('user')">《用户协议》</span>
                    和
                    <span class="agreementLink" @click="showAgreement('privacy')">《隐私政策》</span>
                </span>
            </div>

            <!-- 修改点：用户协议弹窗 -->
            <el-dialog
                :visible.sync="dialogVisible"
                :title="dialogTitle"
                width="90%"
                :close-on-click-modal="false"
                custom-class="agreementDialog"
                center>
                <div class="agreementContent">
                    <h3 v-if="dialogType === 'user'">瑞吉外卖用户服务协议</h3>
                    <h3 v-else>瑞吉外卖隐私政策</h3>
                    <p class="updateDate">更新日期：2026年07月01日</p>
                    <p class="updateDate">生效日期：2026年07月01日</p>

                    <template v-if="dialogType === 'user'">
                        <div class="policySection">
                            <h4>一、总则</h4>
                            <p>1.1 欢迎使用瑞吉外卖平台（以下简称"本平台"）。本协议是您与瑞吉外卖平台之间关于使用本平台服务所订立的协议。</p>
                            <p>1.2 您在使用本平台服务前，请务必仔细阅读并充分理解本协议各条款内容。当您勾选"已阅读并同意"并完成登录后，即视为您已阅读并同意接受本协议的全部内容。</p>
                            <p>1.3 本平台有权根据需要不时修订本协议，修订后的协议将通过平台公告的方式通知您。若您不同意修订内容，应立即停止使用本平台服务。</p>
                        </div>
                        <div class="policySection">
                            <h4>二、服务内容</h4>
                            <p>2.1 本平台通过互联网为您提供在线点餐、外卖配送及相关信息服务。</p>
                            <p>2.2 您理解并同意，本平台仅提供信息撮合服务，实际餐饮服务由入驻商家提供，配送服务由合作配送员完成。</p>
                            <p>2.3 本平台保留随时变更、中断或终止部分或全部服务的权利，且无需事先通知。</p>
                        </div>
                        <div class="policySection">
                            <h4>三、用户账号</h4>
                            <p>3.1 您通过手机号码注册并使用本平台，您应当对使用该手机号所进行的一切行为负责。</p>
                            <p>3.2 您应妥善保管验证码等登录凭证，不得将其提供给任何第三方使用。因您保管不善导致的任何损失由您自行承担。</p>
                            <p>3.3 如发现任何未经授权使用您账号的情况，应立即通知本平台。</p>
                        </div>
                        <div class="policySection">
                            <h4>四、用户行为规范</h4>
                            <p>4.1 您在使用本平台服务时应遵守国家法律法规，不得利用本平台从事违法违规活动。</p>
                            <p>4.2 您不得以任何方式干扰本平台的正常运营，包括但不限于：利用技术手段恶意下单、刷单、发起虚假投诉等。</p>
                            <p>4.3 对于违反上述规定的用户，本平台有权采取警告、限制功能、暂停或终止服务等措施。</p>
                        </div>
                        <div class="policySection">
                            <h4>五、订单与支付</h4>
                            <p>5.1 您在本平台下单后，订单即告成立。商家接单前您可以取消订单，商家接单后取消规则以订单页面提示为准。</p>
                            <p>5.2 本平台支持多种支付方式，您选择支付方式后应按照页面提示完成支付。</p>
                            <p>5.3 如因商品缺货、商家休业等原因导致订单无法履行，本平台将及时通知您并协助退款。</p>
                        </div>
                        <div class="policySection">
                            <h4>六、免责声明</h4>
                            <p>6.1 本平台不对因不可抗力、系统维护、网络故障等原因造成的服务中断承担责任。</p>
                            <p>6.2 本平台不对商家提供的餐品质量、配送时效等做任何明示或默示的保证。</p>
                        </div>
                        <div class="policySection">
                            <h4>七、其他</h4>
                            <p>7.1 本协议的解释、效力及争议解决，均适用中华人民共和国法律。</p>
                            <p>7.2 如本协议任何条款被认定为无效或不可执行，不影响其余条款的效力。</p>
                            <p>7.3 如您对本协议有任何疑问，请联系客服：400-8820-888。</p>
                        </div>
                    </template>

                    <template v-else>
                        <div class="policySection">
                            <h4>一、信息收集</h4>
                            <p>1.1 为向您提供优质的外卖服务，我们会在您使用本平台时收集以下信息：</p>
                            <p>（1）账号信息：手机号码、账号ID，用于注册登录与身份识别；</p>
                            <p>（2）位置信息：收货地址及大致位置，用于配送服务；</p>
                            <p>（3）订单信息：点餐记录、支付信息，用于订单履约与售后服务；</p>
                            <p>（4）设备信息：设备型号、操作系统版本、IP地址，用于保障账户安全。</p>
                        </div>
                        <div class="policySection">
                            <h4>二、信息使用</h4>
                            <p>2.1 我们收集的信息将用于以下用途：</p>
                            <p>（1）为您提供点餐、支付、配送等核心服务；</p>
                            <p>（2）优化服务质量，包括个性化推荐与用户体验改进；</p>
                            <p>（3）保障交易安全，防范欺诈与风险控制；</p>
                            <p>（4）根据法律法规要求进行合规处理。</p>
                            <p>2.2 我们不会将您的个人信息出售或共享给第三方，但以下情形除外：您明确同意、法律法规要求、为完成配送服务需要将地址提供给配送员。</p>
                        </div>
                        <div class="policySection">
                            <h4>三、信息存储与保护</h4>
                            <p>3.1 您的个人信息存储于中国境内，我们采取加密传输、访问控制、数据备份等措施保障信息安全。</p>
                            <p>3.2 我们仅在实现服务目的所必需的最短期限内保留您的个人信息，法律法规另有规定的除外。</p>
                            <p>3.3 如发生个人信息安全事件，我们将依法及时告知您并采取补救措施。</p>
                        </div>
                        <div class="policySection">
                            <h4>四、您的权利</h4>
                            <p>4.1 您有权查阅、更正、删除您的个人信息。您可以在App内"个人中心"自行管理，或联系客服协助处理。</p>
                            <p>4.2 您有权撤回已同意的授权，撤回后我们将停止处理相应的个人信息。</p>
                            <p>4.3 您有权注销账号，注销后您的个人信息将被删除或匿名化处理。</p>
                        </div>
                        <div class="policySection">
                            <h4>五、Cookie及同类技术</h4>
                            <p>5.1 我们使用Cookie和本地存储技术来提升您的使用体验，如记住登录状态、保存搜索历史等。</p>
                            <p>5.2 您可以通过浏览器设置管理或禁用Cookie，但这可能影响部分功能的使用。</p>
                        </div>
                        <div class="policySection">
                            <h4>六、未成年人保护</h4>
                            <p>6.1 本平台主要面向成年人。未满18周岁的用户应在监护人指导下使用本平台。</p>
                            <p>6.2 如我们发现无意中收集了未成年人的个人信息，将及时删除。</p>
                        </div>
                        <div class="policySection">
                            <h4>七、政策更新</h4>
                            <p>7.1 我们可能会适时更新本隐私政策。重大变更将通过平台公告或弹窗方式通知您。</p>
                            <p>7.2 如您对本隐私政策有任何疑问，请联系客服：400-8820-888。</p>
                        </div>
                    </template>
                </div>
                <span slot="footer" class="dialog-footer">
                    <el-button type="primary" @click="dialogVisible = false" class="dialogConfirmBtn">我知道了</el-button>
                </span>
            </el-dialog>
        </div>

        <script src="../../backend/plugins/vue/vue.js"></script>
        <script src="../../backend/plugins/element-ui/index.js"></script>
        <script src="./../js/vant.min.js"></script>
        <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="./../js/request.js"></script>
        <script src="./../api/login.js"></script>
        <script>
        new Vue({
            el:"#login",
            data(){
                return {
                    form:{
                        phone:'',
                        code:''
                    },
                    msgFlag:false,
                    loading:false,
                    countdown:0,
                    countdownTimer:null,
                    // 修改点：新增协议勾选状态
                    agreed: false,
                    // 修改点：新增协议弹窗相关数据
                    dialogVisible: false,
                    dialogTitle: '',
                    dialogType: '' // 'user' | 'privacy'
                }
            },
            computed:{
                // 修改点：登录按钮可用条件：手机号+验证码+同意协议
                canLogin(){
                    return this.form.phone && this.form.code && this.agreed
                }
            },
            created(){},
            mounted(){
                // 修改点：自动聚焦手机号输入框
                this.$nextTick(() => {
                    const inputs = document.querySelectorAll('#login .el-input__inner')
                    if(inputs.length > 0) inputs[0].focus()
                })
            },
            beforeDestroy(){
                if(this.countdownTimer){
                    clearInterval(this.countdownTimer);
                    this.countdownTimer = null;
                }
            },
            methods:{
                // 修改点：等待API响应后再倒计时，避免请求失败仍倒计时
                async getCode(){
                    this.form.code = ''
                    const regex = /^1[3-9]\d{9}$/;
                    if (!regex.test(this.form.phone)) {
                        this.msgFlag = true
                        return
                    }
                    this.msgFlag = false
                    if (this.countdown > 0) return;
                    try {
                        const res = await sendMsgApi({phone: this.form.phone})
                        if(res.code === 1){
                            this.countdown = 60;
                            this.countdownTimer = setInterval(() => {
                                this.countdown--;
                                if (this.countdown <= 0) {
                                    clearInterval(this.countdownTimer);
                                    this.countdownTimer = null;
                                }
                            }, 1000);
                        } else {
                            this.$notify({ type:'warning', message: res.msg || '验证码发送失败'});
                        }
                    } catch(e) {
                        this.$notify({ type:'warning', message:'网络异常，请稍后再试'});
                    }
                },
                // 修改点：完善登录逻辑 — 错误提示、存储用户完整信息、加载态
                async btnLogin(){
                    if(!this.form.phone){
                        this.$notify({ type:'warning', message:'请输入手机号码'});
                        return
                    }
                    if(!this.form.code){
                        this.$notify({ type:'warning', message:'请输入验证码'});
                        return
                    }
                    // 修改点：增加协议同意校验
                    if(!this.agreed){
                        this.$notify({ type:'warning', message:'请先阅读并同意用户协议与隐私政策'});
                        return
                    }
                    if(this.loading) return;
                    this.loading = true
                    try {
                        const res = await loginApi(this.form)
                        if(res.code === 1){
                            // 修改点：存储用户信息，用于首页和个人中心数据展示
                            // 无条件覆盖全部字段，防止旧数据残留
                            sessionStorage.setItem("userPhone", this.form.phone)
                            if(res.data){
                                sessionStorage.setItem("userId", res.data.id || '')
                                sessionStorage.setItem("userAvatar", res.data.avatar || '')
                                sessionStorage.setItem("userName", res.data.name || '')
                            }
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/index.html'
                            })
                        }else{
                            this.$notify({ type:'warning', message:res.msg || '登录失败'});
                        }
                    } catch(e) {
                        this.$notify({ type:'warning', message:'网络异常，请稍后再试'});
                    } finally {
                        this.loading = false
                    }
                },
                // 修改点：切换协议勾选状态
                toggleAgreement(){
                    this.agreed = !this.agreed
                },
                // 修改点：打开协议弹窗
                showAgreement(type){
                    this.dialogType = type
                    this.dialogTitle = type === 'user' ? '用户协议' : '隐私政策'
                    this.dialogVisible = true
                }
            }
        })
    </script>
</body>
</html>
