<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI智能点餐助手</title>
    <link rel="stylesheet" href="../../plugins/vant/index.css">
    <link rel="stylesheet" href="../../styles/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        .ai-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        /* 顶部栏 */
        .ai-header {
            background: linear-gradient(135deg, #FF6B35 0%, #f7931e 100%);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
        }
        .ai-header .title { font-size: 18px; font-weight: 600; }
        .ai-header .close-btn { font-size: 24px; cursor: pointer; padding: 4px; }
        .ai-header .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 快捷提示 */
        .quick-tips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
        .quick-tip {
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid #FF6B35;
            color: #FF6B35;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .quick-tip:active { background: #FF6B35; color: #fff; }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-msg.assistant { align-self: flex-start; }
        .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .chat-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-msg.assistant .chat-avatar { background: #FFF0E6; }
        .chat-msg.user .chat-avatar { background: #FF6B35; color: #fff; }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .chat-msg.assistant .chat-bubble {
            background: #f5f5f5;
            border-top-left-radius: 4px;
        }
        .chat-msg.user .chat-bubble {
            background: #FF6B35;
            color: #fff;
            border-top-right-radius: 4px;
        }

        /* 推荐菜品卡片 */
        .dish-recommendations {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .dish-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #eee;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .dish-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .dish-card img {
            width: 60px; height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .dish-card .dish-info { flex: 1; }
        .dish-card .dish-name { font-size: 14px; font-weight: 500; color: #333; }
        .dish-card .dish-reason { font-size: 11px; color: #999; margin-top: 2px; }
        .dish-card .dish-price { font-size: 14px; color: #FF6B35; font-weight: 600; margin-top: 4px; }
        .dish-card .add-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #FF6B35;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #ccc;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        /* 输入区 */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid #eee;
            background: #fff;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #FF6B35; }
        .input-area .send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B35, #f7931e);
            color: #fff;
            border: none;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="ai-app" class="ai-container">
        <!-- 顶部 -->
        <div class="ai-header">
            <div>
                <span class="status-dot"></span>
                <span class="title">AI 智能点餐助手</span>
            </div>
            <span class="close-btn" @click="close">✕</span>
        </div>

        <!-- 快捷提示 -->
        <div class="quick-tips">
            <span class="quick-tip" v-for="tip in quickTips" :key="tip" @click="sendQuickTip(tip)">
                {{ tip }}
            </span>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area" ref="chatArea">
            <!-- 欢迎消息 -->
            <div class="chat-msg assistant">
                <div class="chat-avatar">🤖</div>
                <div class="chat-bubble">
                    你好！我是小吉 🤗<br>
                    告诉我你想吃什么，我来帮你推荐最合适的菜品！<br><br>
                    你可以试试说：<br>
                    · "我想吃辣的，2个人"<br>
                    · "有没有清淡一点的菜"<br>
                    · "帮我推荐100以内的套餐"
                </div>
            </div>

            <!-- 对话消息 -->
            <template v-for="(msg, idx) in messages">
                <div :class="'chat-msg ' + msg.role" :key="idx">
                    <div class="chat-avatar">{{ msg.role === 'assistant' ? '🤖' : '👤' }}</div>
                    <div>
                        <div class="chat-bubble" v-html="formatContent(msg.content)"></div>
                        <!-- 推荐菜品 -->
                        <div class="dish-recommendations" v-if="msg.dishes && msg.dishes.length > 0">
                            <div class="dish-card" v-for="dish in msg.dishes" :key="dish.dishId" @click="addToCart(dish)">
                                <img :src="dish.image || '../../images/default-dish.png'" :alt="dish.name" @error="imgError">
                                <div class="dish-info">
                                    <div class="dish-name">{{ dish.name }}</div>
                                    <div class="dish-reason" v-if="dish.reason">{{ dish.reason }}</div>
                                    <div class="dish-price">¥{{ dish.price }}</div>
                                </div>
                                <button class="add-btn" @click.stop="addToCart(dish)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 加载中 -->
            <div class="chat-msg assistant" v-if="loading">
                <div class="chat-avatar">🤖</div>
                <div class="chat-bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <input
                type="text"
                v-model="inputText"
                placeholder="告诉小吉你想吃什么..."
                @keyup.enter="sendMessage"
                :disabled="loading"
            >
            <button class="send-btn" @click="sendMessage" :disabled="!inputText.trim() || loading">
                ➤
            </button>
        </div>
    </div>

    <script src="../../plugins/vue.min.js"></script>
    <script src="../../plugins/vant.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../api/ai.js"></script>
    <script>
        new Vue({
            el: '#ai-app',
            data: {
                inputText: '',
                loading: false,
                messages: [],
                quickTips: [
                    '我想吃辣的',
                    '推荐清淡的菜',
                    '2个人，预算100',
                    '有什么招牌菜',
                    '适合小孩吃的',
                    '帮我搭配一个套餐'
                ]
            },
            methods: {
                sendMessage: function() {
                    var text = this.inputText.trim();
                    if (!text || this.loading) return;

                    // 添加用户消息
                    this.messages.push({ role: 'user', content: text });
                    this.inputText = '';
                    this.loading = true;
                    this.scrollToBottom();

                    var self = this;
                    aiApi.orderAssistant(text, null).then(function(res) {
                        var data = res.data || res;
                        var assistantMsg = {
                            role: 'assistant',
                            content: data.content || '抱歉，我没理解您的意思，换个说法试试？',
                            dishes: data.dishes || []
                        };
                        self.messages.push(assistantMsg);
                    }).catch(function() {
                        self.messages.push({
                            role: 'assistant',
                            content: '抱歉，AI服务暂时不可用，请稍后再试。'
                        });
                    }).finally(function() {
                        self.loading = false;
                        self.$nextTick(function() { self.scrollToBottom(); });
                    });
                },

                sendQuickTip: function(tip) {
                    this.inputText = tip;
                    this.sendMessage();
                },

                addToCart: function(dish) {
                    // 调用已有的购物车添加逻辑
                    if (window.addDishToCart) {
                        window.addDishToCart(dish);
                    }
                    alert('已添加「' + dish.name + '」到购物车');
                },

                formatContent: function(content) {
                    if (!content) return '';
                    return content.replace(/\n/g, '<br>');
                },

                scrollToBottom: function() {
                    var el = this.$refs.chatArea;
                    if (el) {
                        this.$nextTick(function() {
                            el.scrollTop = el.scrollHeight;
                        });
                    }
                },

                imgError: function(e) {
                    e.target.src = '../../images/default-dish.png';
                },

                close: function() {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = '../index.html';
                    }
                }
            },
            mounted: function() {
                this.scrollToBottom();
            }
        });
    </script>
</body>
</html>
