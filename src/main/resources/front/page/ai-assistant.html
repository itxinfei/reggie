<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI智能点餐助手</title>
    <!-- 修改点：添加 base.js，确保 rem 基准正确计算 -->
    <script src="../js/base.js"></script>
    <link rel="stylesheet" href="../styles/vant.min.css">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/remixicon-fallback.css">
    <link rel="stylesheet" href="../styles/ai-assistant.css">
    <link rel="stylesheet" href="../styles/ai-assistant-dark.css">
</head>
<body>
    <div id="ai-app" class="ai-container" :class="{ 'dark-mode': darkModeEnabled }">
        <!-- 顶部栏 -->
        <div class="ai-header">
            <div class="header-left">
                <span class="status-dot" :class="{ offline: !isOnline }"></span>
                <span class="title">AI 智能点餐助手</span>
            </div>
            <div class="header-actions">
                <span class="header-btn" @click="toggleDarkMode" title="暗色模式"><i class="ri-moon-line" aria-hidden="true"></i></span>
                <span class="header-btn" @click="toggleSidebar" title="对话历史"><i class="ri-menu-line" aria-hidden="true"></i></span>
                <span class="header-btn" @click="close" title="关闭"><i class="ri-close-line" aria-hidden="true"></i></span>
            </div>
        </div>

        <!-- 网络状态提示条 -->
        <div class="network-banner" :class="{ visible: !isOnline }">
            <span><i class="ri-alert-line" aria-hidden="true"></i> 当前处于离线状态，请检查网络连接</span>
        </div>

        <!-- 对话管理侧边栏 -->
        <div class="sidebar-overlay" :class="{active: sidebarOpen}" @click="toggleSidebar"></div>
        <div class="conversation-sidebar" :class="{active: sidebarOpen}">
            <div class="sidebar-header">
                <h3><i class="ri-chat-1-line" aria-hidden="true"></i> 对话历史</h3>
                <button class="new-chat-btn" @click="newConversation">+ 新对话</button>
            </div>
            <div class="sidebar-list">
                <div v-if="sidebarLoading" class="sidebar-loading">加载中...</div>
                <div v-else-if="conversations.length === 0" class="empty-sidebar">
                    <div class="empty-icon"><i class="ri-chat-1-line" aria-hidden="true"></i></div>
                    <p>暂无对话记录</p>
                </div>
                <div v-for="conv in conversations" :key="conv.id"
                     :class="['sidebar-item', {active: currentConversationId === conv.id}]"
                     @click="switchConversation(conv.id)">
                    <div class="conv-title">{{ conv.title || '新对话' }}</div>
                    <div class="conv-time">{{ conv.timeText || '' }}</div>
                    <span class="conv-delete" @click.stop="deleteConversation(conv.id)" title="删除"><i class="ri-delete-bin-6-line" aria-hidden="true"></i></span>
                </div>
            </div>
            <div class="sidebar-footer" v-if="conversations.length > 0">
                <button class="clear-all-btn" @click="clearAllConversations"><i class="ri-delete-bin-6-line" aria-hidden="true"></i> 清空全部对话</button>
            </div>
        </div>

        <!-- 场景切换标签 -->
        <div class="scene-tabs">
            <span v-for="scene in scenes"
                  :class="['scene-tab', { active: currentScene === scene.value }]"
                  @click="switchScene(scene.value)">
                <i :class="scene.icon" aria-hidden="true"></i> {{ scene.label }}
            </span>
        </div>

        <!-- 快捷提示 -->
        <div class="quick-tips" v-if="messages.length <= 1">
            <span v-for="tag in userProfileTags" :key="tag"
                  class="quick-tip profile-tag"
                  @click="sendQuickTip(tag)">
                {{ tag }}
            </span>
            <span class="quick-tip" v-for="tip in currentQuickTips" :key="tip"
                  @click="sendQuickTip(tip)">
                {{ tip }}
            </span>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area" ref="chatArea">
            <!-- 骨架屏（消息少时显示） -->
            <template v-if="messages.length === 0 && loading">
                <div class="skeleton-row">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-bubble skeleton-b1"></div>
                </div>
                <div class="skeleton-row">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-bubble skeleton-b2"></div>
                </div>
                <div class="skeleton-row skeleton-reverse">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-bubble skeleton-b3"></div>
                </div>
            </template>

            <!-- 欢迎消息 -->
            <div class="chat-msg assistant" v-if="messages.length === 0">
                <div class="chat-avatar"><i class="ri-robot-line" aria-hidden="true"></i></div>
                <div class="chat-bubble">
                    <template v-if="currentScene === 'dish_desc'">
                        你好！我是小吉，美食文案专家 <i class="ri-pencil-ruler-2-line" aria-hidden="true"></i><br><br>
                        输入菜名，我帮你写出让人流口水的美食描述！<br><br>
                        <i class="ri-lightbulb-line tip-icon" aria-hidden="true"></i> <b>试试输入：</b><br>
                        · "红烧肉"<br>
                        · "清蒸鲈鱼"<br>
                        · "麻辣香锅"
                    </template>
                    <template v-else-if="currentScene === 'marketing'">
                        你好！我是小吉，营销策略顾问 <i class="ri-megaphone-line" aria-hidden="true"></i><br><br>
                        告诉我你的需求，我帮你写活动文案和促销方案！<br><br>
                        <i class="ri-lightbulb-line tip-icon" aria-hidden="true"></i> <b>试试这样说：</b><br>
                        · "帮我写一个满减活动文案"<br>
                        · "新店开业的促销方案"<br>
                        · "会员日专属优惠文案"
                    </template>
                    <template v-else>
                        你好！我是小吉，你的智能点餐助手 <i class="ri-emotion-line" aria-hidden="true"></i><br><br>
                        告诉我你想吃什么，我来帮你推荐最合适的菜品！<br><br>
                        <i class="ri-lightbulb-line tip-icon" aria-hidden="true"></i> <b>试试这样说：</b><br>
                        · "我想吃辣的，2个人"<br>
                        · "有没有清淡一点的菜"<br>
                        · "帮我推荐100以内的套餐"
                    </template>
                </div>
            </div>

            <!-- 对话消息 -->
            <template v-for="(msg, idx) in messages">
                <div :class="'chat-msg ' + msg.role" :key="msg.id || idx"
                     @contextmenu.prevent="showMsgMenu($event, msg)"
                     @longpress="showMsgMenu($event, msg)">
                    <div class="chat-avatar" v-html="msg.role === 'assistant' ? '<i class=\'ri-robot-line\'></i>' : (userInfo && userAvatar ? userAvatar : '<i class=\'ri-user-line\'></i>')"></div>
                    <div class="msg-body">
                        <div class="chat-bubble" :class="{'streaming-cursor': msg.streaming}">
                            <!-- 安全渲染 -->
                            <template v-if="msg.role === 'assistant'">
                                <span v-for="(part, pIdx) in msg.renderedParts" :key="pIdx">
                                    <span v-if="part.type === 'text'" class="msg-line">{{ part.text }}</span>
                                    <span v-else-if="part.type === 'bold'" class="msg-bold">{{ part.text }}</span>
                                    <span v-else-if="part.type === 'list'" class="msg-list">
                                        <ul>
                                            <li v-for="(item, i) in part.items" :key="i">{{ item }}</li>
                                        </ul>
                                    </span>
                                    <span v-else-if="part.type === 'highlight'" class="msg-highlight">{{ part.text }}</span>
                                </span>
                            </template>
                            <template v-else>
                                {{ msg.content }}
                            </template>
                        </div>
                        <!-- 复制按钮 -->
                        <div class="msg-actions" v-if="!msg.streaming">
                            <button class="copy-btn" @click="copyMessage(msg)" :title="msg.copied ? '已复制' : '复制'">
                                <span v-if="msg.copied"><i class="ri-check-line" aria-hidden="true"></i></span>
                                <span v-else><i class="ri-copy-line" aria-hidden="true"></i></span>
                            </button>
                        </div>
                        <!-- 推荐菜品卡片 -->
                        <div class="dish-recommendations" v-if="msg.dishes && msg.dishes.length > 0">
                            <div class="dish-card" v-for="dish in msg.dishes" :key="dish.dishId" @click="addToCart(dish)">
                                <img :src="dish.image || '/front/images/noImg.png'" :alt="dish.name" @error="imgError">
                                <div class="dish-info">
                                    <div class="dish-name">{{ dish.name }}</div>
                                    <div class="dish-reason" v-if="dish.reason">{{ dish.reason }}</div>
                                    <div class="dish-price">¥{{ (dish.price ? Number(dish.price).toFixed(2) : '0.00') }}</div>
                                </div>
                                <button class="add-btn" @click.stop="addToCart(dish)">+</button>
                            </div>
                        </div>
                        <!-- 反馈按钮 -->
                        <div class="feedback-bar" v-if="msg.role === 'assistant' && msg.showFeedback && !msg.streaming">
                            <button :class="['feedback-btn', msg.feedback === 'good' ? 'active-good' : '']"
                                    @click="sendFeedback(msg, 'good')"><i class="ri-thumb-up-line" aria-hidden="true"></i> 有用</button>
                            <button :class="['feedback-btn', msg.feedback === 'bad' ? 'active-bad' : '']"
                                    @click="sendFeedback(msg, 'bad')"><i class="ri-thumb-down-line" aria-hidden="true"></i> 没用</button>
                        </div>
                        <!-- 错误重试 -->
                        <div class="retry-bar" v-if="msg.role === 'assistant' && msg.error">
                            <button class="retry-btn" @click="retryMessage(msg)"><i class="ri-refresh-line" aria-hidden="true"></i> 重新生成</button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 加载中 -->
            <div class="chat-msg assistant" v-if="loading && !hasStreamingMessage">
                <div class="chat-avatar"><i class="ri-robot-line" aria-hidden="true"></i></div>
                <div class="chat-bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <button class="voice-btn" :class="{'recording': isRecording}" @click="toggleVoice" title="语音输入">
                <i class="ri-mic-line" aria-hidden="true"></i>
            </button>
            <textarea
                ref="inputArea"
                v-model="inputText"
                :placeholder="inputPlaceholder"
                @keydown.enter.exact.prevent="sendMessage"
                @input="autoResizeInput"
                :disabled="loading"
                rows="1"
                class="input-textarea"
            ></textarea>
            <button class="send-btn" @click="sendMessage" :disabled="!inputText.trim() || loading">
                <i class="ri-send-plane-fill" aria-hidden="true"></i>
            </button>
        </div>

        <!-- 消息操作菜单 -->
        <div class="msg-context-menu" :class="{visible: menuVisible}"
             :style="{top: menuY + 'px', left: menuX + 'px'}"
             v-if="menuTarget">
            <div class="menu-item" @click="copyMenuTarget"><i class="ri-copy-line" aria-hidden="true"></i> 复制</div>
            <div class="menu-item" @click="deleteMenuTarget" v-if="menuTarget.role === 'user'"><i class="ri-delete-bin-6-line" aria-hidden="true"></i> 删除</div>
            <div class="menu-item menu-cancel" @click="menuVisible = false">取消</div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- 修改点：改为相对路径，与其他C端页面（order/user）保持一致。
         绝对路径 /backend/... 在子路径部署时会失效，且在 file:// 下无法解析。 -->
    <script src="../../backend/plugins/vue/vue.js"></script>
    <script src="../../backend/plugins/axios/axios.min.js"></script>
    <script src="../js/vant.min.js"></script>
    <script src="../js/request.js"></script>
    <script src="../api/ai.js"></script>
    <script>
    (function() {
        'use strict';

        // ==================== 工具函数 ====================
        function safeFormatContent(content) {
            if (!content) return [];
            if (typeof content !== 'string') return [{ type: 'text', text: String(content) }];
            var parts = [];
            var lines = content.split('\n');
            for (var li = 0; li < lines.length; li++) {
                var line = lines[li];
                if (li > 0) parts.push({ type: 'text', text: '\n' });
                var boldRegex = /\*\*(.*?)\*\*/g;
                var lastIndex = 0;
                var match;
                while ((match = boldRegex.exec(line)) !== null) {
                    if (match.index > lastIndex) parts.push({ type: 'text', text: line.substring(lastIndex, match.index) });
                    parts.push({ type: 'bold', text: match[1] });
                    lastIndex = match.index + match[0].length;
                }
                if (lastIndex < line.length) parts.push({ type: 'text', text: line.substring(lastIndex) });
                if ((line.trim().startsWith('- ') || line.trim().startsWith('· ')) && parts.length > 0) {
                    var listItems = [];
                    listItems.push(line.trim().replace(/^[-·]\s*/, ''));
                    for (var ni = li + 1; ni < lines.length; ni++) {
                        var nextLine = lines[ni].trim();
                        if (nextLine.startsWith('- ') || nextLine.startsWith('· ')) listItems.push(nextLine.replace(/^[-·]\s*/, ''));
                        else break;
                    }
                    parts.push({ type: 'list', items: listItems });
                    li += listItems.length - 1;
                    continue;
                }
            }
            if (parts.length === 0) return [{ type: 'text', text: content }];
            var merged = [];
            for (var i = 0; i < parts.length; i++) {
                if (i > 0 && parts[i].type === 'text' && merged[merged.length - 1].type === 'text') {
                    merged[merged.length - 1].text += parts[i].text;
                } else {
                    merged.push(parts[i]);
                }
            }
            return merged;
        }

        function formatTime(timestamp) {
            var now = new Date();
            var date = new Date(timestamp);
            var diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 172800000) return '昨天';
            return (date.getMonth() + 1) + '月' + date.getDate() + '日';
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(function() {
                    fallbackCopy(text);
                });
            }
            fallbackCopy(text);
            return Promise.resolve();
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
        }

        // ==================== Vue App ====================
        new Vue({
            el: '#ai-app',
            data: {
                inputText: '',
                loading: false,
                messages: [],
                currentScene: 'order_assistant',
                scenes: [
                    { label: '点餐推荐', icon: 'ri-restaurant-2-line', value: 'order_assistant' },
                    { label: '菜品描述', icon: 'ri-pencil-ruler-2-line', value: 'dish_desc' },
                    { label: '营销文案', icon: 'ri-megaphone-line', value: 'marketing' }
                ],
                quickTipsMap: {
                    order_assistant: ['我想吃辣的', '推荐清淡的菜', '2个人，预算100', '有什么招牌菜', '适合小孩吃的', '帮我搭配一个套餐'],
                    dish_desc: ['红烧肉', '麻辣香锅', '清蒸鲈鱼', '宫保鸡丁'],
                    marketing: ['满减活动文案', '新店开业促销', '会员日专属优惠', '节假日活动方案']
                },
                sidebarOpen: false,
                sidebarLoading: false,
                conversations: [],
                currentConversationId: null,
                currentRequestId: 0,
                isRecording: false,
                recognition: null,
                userInfo: null,
                userAvatar: '',
                cartData: [],
                userProfileTags: [],
                inputPlaceholder: '告诉小吉你想吃什么...',
                // 新增：网络状态
                isOnline: navigator.onLine !== false,
                // 新增：暗色模式
                darkModeEnabled: false,
                // 新增：消息操作菜单
                menuVisible: false,
                menuX: 0,
                menuY: 0,
                menuTarget: null
            },
            computed: {
                currentQuickTips: function() {
                    return this.quickTipsMap[this.currentScene] || [];
                },
                hasStreamingMessage: function() {
                    var self = this;
                    return self.messages.some(function(m) { return m.role === 'assistant' && m.streaming === true; });
                }
            },
            created: function() {
                this.loadUserInfo();
                this.loadConversations();
                this.loadUserProfileTags();
                this.loadDarkModePreference();
                if (this.conversations.length === 0) {
                    this.newConversation(true);
                } else {
                    this.switchConversation(this.conversations[0].id);
                }
                if (this.userInfo) {
                    this.syncConversationsFromBackend();
                }
                // 监听网络变化
                var self = this;
                window.addEventListener('online', function() { self.isOnline = true; });
                window.addEventListener('offline', function() { self.isOnline = false; });
            },
            mounted: function() {
                this.initVoice();
                this.scrollToBottom();
                this._handleEscKey = function(e) {
                    if ((e.key === 'Escape' || e.key === 'Esc') && this.sidebarOpen) {
                        this.toggleSidebar(false);
                    }
                    if (e.key === 'Escape' && this.menuVisible) {
                        this.menuVisible = false;
                    }
                }.bind(this);
                document.addEventListener('keydown', this._handleEscKey);
                // 点击其他地方关闭菜单
                document.addEventListener('click', function() { this.menuVisible = false; }.bind(this));
                // 侧边栏手势
                this.initSwipeGesture();
            },
            beforeDestroy: function() {
                if (this._handleEscKey) document.removeEventListener('keydown', this._handleEscKey);
            },
            methods: {
                // ==================== 网络检测 ====================
                checkNetwork: function() {
                    if (!this.isOnline) {
                        vant.Notify({ type: 'warning', message: '当前处于离线状态，请检查网络', duration: 3000 });
                        return false;
                    }
                    return true;
                },

                // ==================== 暗色模式 ====================
                loadDarkModePreference: function() {
                    try {
                        var saved = localStorage.getItem('ai_dark_mode');
                        if (saved === 'true') {
                            this.darkModeEnabled = true;
                        } else if (saved === 'false') {
                            this.darkModeEnabled = false;
                        } else {
                            // 跟随系统
                            this.darkModeEnabled = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        }
                    } catch(e) {}
                },
                toggleDarkMode: function() {
                    this.darkModeEnabled = !this.darkModeEnabled;
                    try { localStorage.setItem('ai_dark_mode', this.darkModeEnabled.toString()); } catch(e) {}
                },

                // ==================== 侧边栏手势 ====================
                initSwipeGesture: function() {
                    var startX = 0, startY = 0, moving = false;
                    var self = this;
                    var sidebar = document.querySelector('.conversation-sidebar');
                    if (!sidebar) return;
                    sidebar.addEventListener('touchstart', function(e) {
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        moving = false;
                    }, { passive: true });
                    sidebar.addEventListener('touchmove', function(e) {
                        var dx = e.touches[0].clientX - startX;
                        var dy = Math.abs(e.touches[0].clientY - startY);
                        if (dy > 10) return; // 垂直滚动优先
                        if (Math.abs(dx) > 10) moving = true;
                        if (moving && dx > 0 && self.sidebarOpen) {
                            sidebar.style.transform = 'translateX(' + (-sidebar.offsetWidth + dx) + 'px)';
                        }
                    }, { passive: true });
                    sidebar.addEventListener('touchend', function() {
                        if (moving) {
                            var sidebarEl = document.querySelector('.conversation-sidebar');
                            if (sidebarEl) sidebarEl.style.transform = '';
                            if (self.sidebarOpen) self.toggleSidebar(false);
                        }
                    });
                    // 左边缘滑动唤出
                    var overlay = document.querySelector('.sidebar-overlay');
                    if (overlay) {
                        overlay.addEventListener('touchstart', function(e) {
                            startX = e.touches[0].clientX;
                            startY = e.touches[0].clientY;
                            moving = false;
                        }, { passive: true });
                        overlay.addEventListener('touchmove', function(e) {
                            var dx = e.touches[0].clientX - startX;
                            if (dx > 30 && !self.sidebarOpen) {
                                self.toggleSidebar(true);
                            }
                        }, { passive: true });
                    }
                },

                // ==================== 消息操作菜单 ====================
                showMsgMenu: function(e, msg) {
                    // 只在非移动端通过右键触发
                    if (e.type === 'contextmenu' && e.button !== 2) return;
                    // 移动端长按
                    if (e.type === 'longpress') {
                        e.preventDefault();
                    }
                    this.menuTarget = msg;
                    this.menuVisible = true;
                    var x = e.clientX || (e.touches && e.touches[0].clientX) || 100;
                    var y = e.clientY || (e.touches && e.touches[0].clientY) || 100;
                    this.menuX = Math.min(x, window.innerWidth - 160);
                    this.menuY = Math.min(y, window.innerHeight - 120);
                },
                copyMenuTarget: function() {
                    if (this.menuTarget) {
                        this.copyMessage(this.menuTarget);
                    }
                    this.menuVisible = false;
                },
                deleteMenuTarget: function() {
                    if (this.menuTarget) {
                        var idx = this.messages.indexOf(this.menuTarget);
                        if (idx >= 0) {
                            this.messages.splice(idx, 1);
                            this.saveConversations();
                        }
                    }
                    this.menuVisible = false;
                },

                // ==================== 消息复制 ====================
                copyMessage: function(msg) {
                    var text = '';
                    if (msg.role === 'assistant') {
                        text = msg.content || '';
                    } else {
                        text = msg.content || '';
                    }
                    if (!text) return;
                    copyText(text).then(function() {
                        msg.copied = true;
                        vant.Notify({ type: 'success', message: '已复制到剪贴板', duration: 1500 });
                        setTimeout(function() { if (msg) msg.copied = false; }, 2000);
                    });
                },

                // ==================== 输入框自适应高度 ====================
                autoResizeInput: function() {
                    var el = this.$refs.inputArea;
                    if (!el) return;
                    el.style.height = 'auto';
                    var newHeight = Math.min(el.scrollHeight, 120);
                    el.style.height = newHeight + 'px';
                },

                // ==================== 对话管理 ====================
                newConversation: function(silent) {
                    var conv = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        title: '',
                        messages: [],
                        scene: this.currentScene,
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                        timeText: '刚刚'
                    };
                    this.conversations.unshift(conv);
                    this.currentConversationId = conv.id;
                    this.messages = [];
                    if (!silent) {
                        this.saveConversations();
                        this.toggleSidebar(false);
                    }
                },
                switchConversation: function(id) {
                    if (this.loading) return;
                    var conv = this.conversations.find(function(c) { return c.id === id; });
                    if (!conv) return;
                    this.currentConversationId = id;
                    this.messages = conv.messages || [];
                    this.toggleSidebar(false);
                    this.$nextTick(function() { this.scrollToBottom(); }.bind(this));
                },
                deleteConversation: function(id) {
                    var self = this;
                    vant.Dialog.confirm({
                        title: '删除对话',
                        message: '确定要删除这个对话吗？此操作不可恢复。'
                    }).then(function() {
                        self.conversations = self.conversations.filter(function(c) { return c.id !== id; });
                        if (self.currentConversationId === id) {
                            if (self.conversations.length > 0) {
                                self.switchConversation(self.conversations[0].id);
                            } else {
                                self.newConversation(true);
                            }
                        }
                        self.saveConversations();
                    }).catch(function() {});
                },
                toggleSidebar: function(force) {
                    if (typeof force === 'boolean') {
                        this.sidebarOpen = force;
                    } else {
                        this.sidebarOpen = !this.sidebarOpen;
                    }
                },
                saveConversations: function() {
                    try {
                        var currentConv = this.getCurrentConversation();
                        if (currentConv) {
                            currentConv.messages = this.messages.slice(0, 100);
                            currentConv.updatedAt = Date.now();
                            currentConv.timeText = formatTime(Date.now());
                            if (this.messages.length > 0) {
                                var firstUserMsg = this.messages.find(function(m) { return m.role === 'user'; });
                                if (firstUserMsg) {
                                    currentConv.title = firstUserMsg.content.substring(0, 30);
                                }
                            }
                        }
                        localStorage.setItem('ai_conversations', JSON.stringify(this.conversations.slice(0, 50)));
                    } catch (e) { console.warn('保存对话失败:', e); }
                },
                loadConversations: function() {
                    try {
                        var raw = localStorage.getItem('ai_conversations');
                        if (raw) {
                            var data = JSON.parse(raw);
                            if (Array.isArray(data)) {
                                var self = this;
                                this.conversations = data.slice(0, 50).map(function(c) {
                                    c.timeText = formatTime(c.updatedAt || c.createdAt || Date.now());
                                    return c;
                                });
                            }
                        }
                    } catch (e) { this.conversations = []; }
                },
                getCurrentConversation: function() {
                    return this.conversations.find(function(c) { return c.id === this.currentConversationId; }.bind(this));
                },
                syncConversationsFromBackend: function() {
                    var self = this;
                    if (typeof aiApi === 'undefined' || !aiApi.getConversations) return;
                    aiApi.getConversations(1, 50).then(function(res) {
                        var data = res.data || res;
                        var backendList = (data && data.code === 1) ? data.data : data;
                        if (!Array.isArray(backendList) || backendList.length === 0) return;
                        backendList.forEach(function(backendConv) {
                            var localIdx = -1;
                            for (var i = 0; i < self.conversations.length; i++) {
                                if (self.conversations[i].id === backendConv.conversationId) { localIdx = i; break; }
                            }
                            var conv = {
                                id: backendConv.conversationId,
                                title: backendConv.title || '对话',
                                scene: backendConv.scene || 'order_assistant',
                                messages: [],
                                createdAt: backendConv.createTime ? new Date(backendConv.createTime).getTime() : Date.now(),
                                updatedAt: backendConv.updateTime ? new Date(backendConv.updateTime).getTime() : Date.now(),
                                timeText: formatTime(backendConv.updateTime || backendConv.createTime || Date.now()),
                                messageCount: backendConv.messageCount || 0
                            };
                            if (localIdx >= 0) {
                                conv.messages = self.conversations[localIdx].messages || [];
                                self.conversations.splice(localIdx, 1, conv);
                            } else {
                                self.conversations.push(conv);
                            }
                        });
                        self.conversations.sort(function(a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
                        self.saveConversations();
                    }).catch(function() {});
                },
                clearAllConversations: function() {
                    var self = this;
                    vant.Dialog.confirm({
                        title: '清空对话',
                        message: '确定要清空全部对话记录吗？此操作不可恢复。'
                    }).then(function() {
                        self.conversations = [];
                        self.currentConversationId = null;
                        self.messages = [];
                        localStorage.removeItem('ai_conversations');
                        self.newConversation(true);
                    }).catch(function() {});
                },
                switchScene: function(scene) {
                    if (this.currentScene === scene) return;
                    this.currentScene = scene;
                    this.saveConversations();
                    this.newConversation(true);
                    this.inputPlaceholder = this.getScenePlaceholder(scene);
                },
                getScenePlaceholder: function(scene) {
                    var map = {
                        order_assistant: '告诉小吉你想吃什么...',
                        dish_desc: '输入菜名，AI帮你写美食描述...',
                        marketing: '输入营销需求，例：满减活动文案...'
                    };
                    return map[scene] || '输入消息...';
                },

                // ==================== 用户上下文 ====================
                loadUserInfo: function() {
                    try {
                        var userInfo = sessionStorage.getItem('userInfo') || localStorage.getItem('userInfo');
                        if (userInfo) {
                            this.userInfo = JSON.parse(userInfo);
                            this.userAvatar = this.userInfo.avatar || '';
                        }
                        var name = sessionStorage.getItem('userName');
                        if (name) { this.userInfo = this.userInfo || {}; this.userInfo.name = name; }
                        var avatar = sessionStorage.getItem('userAvatar');
                        if (avatar) this.userAvatar = avatar;
                    } catch (e) {}
                },
                loadUserProfileTags: function() {
                    var self = this;
                    try {
                        var cached = localStorage.getItem('ai_profile_tags');
                        if (cached) { try { self.userProfileTags = JSON.parse(cached); } catch(e) {} }
                        if (!self.userInfo) return;
                        if (typeof aiApi !== 'undefined' && aiApi.getProfileSummary) {
                            aiApi.getProfileSummary().then(function(res) {
                                var data = res.data || res;
                                var result = (data && data.code === 1) ? data.data : data;
                                if (result && result.tags && result.tags.length > 0) {
                                    self.userProfileTags = result.tags.slice(0, 5);
                                    try { localStorage.setItem('ai_profile_tags', JSON.stringify(self.userProfileTags)); } catch(e) {}
                                }
                            }).catch(function() {});
                        }
                    } catch (e) {}
                },
                loadCartContext: function() {
                    var self = this;
                    try {
                        var cartData = sessionStorage.getItem('cartData');
                        if (cartData) self.cartData = JSON.parse(cartData);
                    } catch (e) {}
                },
                buildContext: function() {
                    var context = {};
                    if (this.userInfo) {
                        context.user = { name: this.userInfo.name || '', phone: this.maskPhone(this.userInfo.phone || '') };
                    }
                    if (this.cartData && this.cartData.length > 0) {
                        context.cart = {
                            itemCount: this.cartData.length,
                            totalAmount: this.cartData.reduce(function(sum, item) { return sum + (item.number || 0); }, 0),
                            items: this.cartData.slice(0, 5).map(function(item) { return { name: item.name, quantity: item.number }; })
                        };
                    }
                    return context;
                },
                maskPhone: function(phone) {
                    if (!phone || phone.length !== 11) return phone || '';
                    return phone.substring(0, 3) + '****' + phone.substring(7);
                },

                // ==================== 消息发送 ====================
                sendMessage: function() {
                    var text = this.inputText.trim();
                    if (!text || this.loading) return;
                    // 网络检测
                    if (!this.checkNetwork()) return;

                    this.loadCartContext();
                    this.currentRequestId++;
                    var requestId = this.currentRequestId;

                    var userMsg = {
                        id: Date.now(), role: 'user', content: text,
                        timestamp: Date.now(), copied: false
                    };
                    var assistantMsg = {
                        id: Date.now() + 1, role: 'assistant',
                        content: '', renderedParts: [], streaming: true,
                        showFeedback: false, feedback: null, error: false,
                        retryData: null, timestamp: Date.now(), copied: false,
                        dishes: []
                    };

                    this.messages.push(userMsg);
                    this.messages.push(assistantMsg);
                    this.inputText = '';
                    // 重置输入框高度
                    var el = this.$refs.inputArea;
                    if (el) el.style.height = 'auto';
                    this.loading = true;
                    this.scrollToBottom();

                    var self = this;
                    var apiCall;
                    if (this.currentScene === 'order_assistant') {
                        apiCall = aiApi.orderAssistant(text, this.getUserId(), this.currentConversationId);
                    } else {
                        apiCall = aiApi.chat(text, this.currentScene, this.currentConversationId);
                    }

                    apiCall.then(function(res) {
                        if (requestId !== self.currentRequestId) return;
                        var data = res.data || res;
                        var responseData = (data && data.code === 1) ? data.data : data;
                        assistantMsg.content = (responseData && responseData.content)
                            ? responseData.content
                            : '抱歉，我没理解您的意思，换个说法试试？';
                        assistantMsg.streaming = false;
                        assistantMsg.showFeedback = true;
                        assistantMsg.renderedParts = safeFormatContent(assistantMsg.content);
                        assistantMsg.dishes = (self.currentScene === 'order_assistant' && responseData && responseData.dishes)
                            ? responseData.dishes : [];
                        var meta = (responseData && responseData.data) || {};
                        if (meta.conversationId && !self.currentConversationId) {
                            self.currentConversationId = meta.conversationId;
                        }
                        self.scrollToBottom();
                        self.saveConversations();
                    }).catch(function(err) {
                        if (requestId !== self.currentRequestId) return;
                        assistantMsg.content = '抱歉，请求失败，请重试。';
                        assistantMsg.streaming = false;
                        assistantMsg.error = true;
                        assistantMsg.retryData = { message: text, requestId: requestId };
                        assistantMsg.renderedParts = [{ type: 'text', text: assistantMsg.content }];
                        self.scrollToBottom();
                    }).finally(function() {
                        if (requestId === self.currentRequestId) self.loading = false;
                    });
                },
                retryMessage: function(msg) {
                    if (msg.retryData) {
                        var idx = this.messages.indexOf(msg);
                        if (idx > 0) this.messages.splice(idx - 1, 2);
                        this.inputText = msg.retryData.message;
                        this.sendMessage();
                    }
                },
                sendQuickTip: function(tip) {
                    this.inputText = tip;
                    this.sendMessage();
                },

                // ==================== 推荐菜品 ====================
                addToCart: function(dish) {
                    var imgUrl = dish.image || '';
                    if (!imgUrl && dish.imageUrl) imgUrl = dish.imageUrl;
                    var dishId = dish.dishId || dish.id || 0;
                    var price = dish.price ? parseFloat(Number(dish.price).toFixed(2)) : 0;
                    if (window.addDishToCart) {
                        window.addDishToCart({ id: dishId, name: dish.name, price: price, image: imgUrl, flavors: [] });
                    } else {
                        vant.Notify({ type: 'success', message: '已添加「' + dish.name + '」到购物车' });
                    }
                },

                // ==================== 反馈 ====================
                sendFeedback: function(msg, type) {
                    msg.feedback = type;
                    var self = this;
                    try {
                        if (typeof aiApi !== 'undefined' && aiApi.recordFeedback) {
                            aiApi.recordFeedback({
                                messageId: msg.id, feedbackType: type, scene: self.currentScene
                            }).catch(function() {});
                        }
                    } catch (e) {}
                    this.saveConversations();
                },

                // ==================== 语音输入 ====================
                initVoice: function() {
                    var self = this;
                    try {
                        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                        if (!SR) return;
                        this.recognition = new SR();
                        this.recognition.lang = 'zh-CN';
                        this.recognition.interimResults = false;
                        this.recognition.maxAlternatives = 1;
                        this.recognition.onresult = function(event) {
                            self.inputText = event.results[0][0].transcript;
                            self.isRecording = false;
                        };
                        this.recognition.onerror = function(event) {
                            self.isRecording = false;
                            if (event.error === 'not-allowed') vant.Notify({ type: 'warning', message: '请允许麦克风权限' });
                        };
                        this.recognition.onend = function() { self.isRecording = false; };
                    } catch (e) { console.warn('语音初始化失败:', e); }
                },
                toggleVoice: function() {
                    if (!this.recognition) {
                        vant.Notify({ type: 'warning', message: '您的浏览器不支持语音输入' });
                        return;
                    }
                    if (this.isRecording) {
                        this.recognition.stop();
                        this.isRecording = false;
                    } else {
                        this.recognition.start();
                        this.isRecording = true;
                        vant.Notify({ type: 'success', message: '请说话...', duration: 2000 });
                    }
                },

                // ==================== 工具方法 ====================
                getUserId: function() {
                    if (this.userInfo && this.userInfo.id) return this.userInfo.id;
                    var userId = sessionStorage.getItem('userId');
                    return userId ? parseInt(userId) : null;
                },
                scrollToBottom: function() {
                    var self = this;
                    this.$nextTick(function() {
                        var el = self.$refs.chatArea;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                },
                imgError: function(e) {
                    if (e.target.src.indexOf('/front/images/noImg.png') >= 0) return;
                    e.target.src = '/front/images/noImg.png';
                },
                close: function() {
                    this.saveConversations();
                    window.location.replace('/front/index.html');
                }
            }
        });
    })();
    </script>
</body>
</html>
