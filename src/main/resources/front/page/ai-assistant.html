<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI智能点餐助手</title>
    <!-- 修改点：修正静态资源路径（../../plugins/ → ../styles/, /front/ 目录实际位置） -->
    <link rel="stylesheet" href="../styles/vant.min.css">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/ai-assistant.css">
</head>
<body>
    <div id="ai-app" class="ai-container">
        <!-- 顶部栏 -->
        <div class="ai-header">
            <div class="header-left">
                <span class="status-dot"></span>
                <span class="title">AI 智能点餐助手</span>
            </div>
            <div class="header-actions">
                <span class="header-btn" @click="toggleSidebar" title="对话历史">☰</span>
                <span class="header-btn" @click="close" title="关闭">✕</span>
            </div>
        </div>

        <!-- 对话管理侧边栏 -->
        <div class="sidebar-overlay" :class="{active: sidebarOpen}" @click="toggleSidebar"></div>
        <div class="conversation-sidebar" :class="{active: sidebarOpen}">
            <div class="sidebar-header">
                <h3>💬 对话历史</h3>
                <button class="new-chat-btn" @click="newConversation">+ 新对话</button>
            </div>
            <div class="sidebar-list">
                <!-- 修改点：加载中 -->
                <div v-if="sidebarLoading" class="sidebar-loading">加载中...</div>
                <div v-else-if="conversations.length === 0" class="empty-sidebar">
                    <div class="empty-icon">💬</div>
                    <p>暂无对话记录</p>
                </div>
                <div v-for="conv in conversations" :key="conv.id"
                     :class="['sidebar-item', {active: currentConversationId === conv.id}]"
                     @click="switchConversation(conv.id)">
                    <div class="conv-title">{{ conv.title || '新对话' }}</div>
                    <div class="conv-time">{{ conv.timeText || '' }}</div>
                    <span class="conv-delete" @click.stop="deleteConversation(conv.id)" title="删除">🗑️</span>
                </div>
            </div>
            <!-- 修改点：清空全部按钮 -->
            <div class="sidebar-footer" v-if="conversations.length > 0">
                <button class="clear-all-btn" @click="clearAllConversations">🗑️ 清空全部对话</button>
            </div>
        </div>

        <!-- 修改点：场景切换标签 -->
        <div class="scene-tabs">
            <span v-for="scene in scenes"
                  :class="['scene-tab', { active: currentScene === scene.value }]"
                  @click="switchScene(scene.value)">
                {{ scene.label }}
            </span>
        </div>

        <!-- 修改点：按场景动态快捷提示 -->
        <div class="quick-tips" v-if="messages.length <= 1">
            <!-- 用户画像标签（基于历史偏好，仅点餐场景显示） -->
            <span v-for="tag in userProfileTags" :key="tag"
                  class="quick-tip profile-tag"
                  @click="sendQuickTip(tag)">
                {{ tag }}
            </span>
            <!-- 场景快捷提示 -->
            <span class="quick-tip" v-for="tip in currentQuickTips" :key="tip"
                  @click="sendQuickTip(tip)">
                {{ tip }}
            </span>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area" ref="chatArea">
            <!-- 修改点：按场景显示不同欢迎消息 -->
            <div class="chat-msg assistant" v-if="messages.length === 0">
                <div class="chat-avatar">🤖</div>
                <div class="chat-bubble">
                    <template v-if="currentScene === 'dish_desc'">
                        你好！我是小吉，美食文案专家 📝<br><br>
                        输入菜名，我帮你写出让人流口水的美食描述！<br><br>
                        💡 <b>试试输入：</b><br>
                        · "红烧肉"<br>
                        · "清蒸鲈鱼"<br>
                        · "麻辣香锅"
                    </template>
                    <template v-else-if="currentScene === 'marketing'">
                        你好！我是小吉，营销策略顾问 📢<br><br>
                        告诉我你的需求，我帮你写活动文案和促销方案！<br><br>
                        💡 <b>试试这样说：</b><br>
                        · "帮我写一个满减活动文案"<br>
                        · "新店开业的促销方案"<br>
                        · "会员日专属优惠文案"
                    </template>
                    <template v-else>
                        你好！我是小吉，你的智能点餐助手 🤗<br><br>
                        告诉我你想吃什么，我来帮你推荐最合适的菜品！<br><br>
                        💡 <b>试试这样说：</b><br>
                        · "我想吃辣的，2个人"<br>
                        · "有没有清淡一点的菜"<br>
                        · "帮我推荐100以内的套餐"
                    </template>
                </div>
            </div>

            <!-- 对话消息 -->
            <template v-for="(msg, idx) in messages">
                <div :class="'chat-msg ' + msg.role" :key="msg.id || idx">
                    <div class="chat-avatar">{{ msg.role === 'assistant' ? '🤖' : '👤' }}</div>
                    <div class="msg-body">
                        <div class="chat-bubble" :class="{'streaming-cursor': msg.streaming}">
                            <!-- 安全渲染：仅支持有限格式，杜绝 XSS -->
                            <template v-if="msg.role === 'assistant'">
                                <span v-for="(part, pIdx) in msg.renderedParts" :key="pIdx">
                                    <span v-if="part.type === 'text'" class="msg-line">{{ part.text }}</span>
                                    <span v-else-if="part.type === 'bold'" class="msg-bold">{{ part.text }}</span>
                                    <span v-else-if="part.type === 'list'" class="msg-list">
                                        <ul>
                                            <li v-for="(item, i) in part.items" :key="i">{{ item }}</li>
                                        </ul>
                                    </span>
                                    <span v-else-if="part.type === 'highlight'" class="msg-highlight">{{ part.text }}</span>
                                </span>
                            </template>
                            <template v-else>
                                {{ msg.content }}
                            </template>
                        </div>
                        <!-- 推荐菜品卡片 -->
                        <div class="dish-recommendations" v-if="msg.dishes && msg.dishes.length > 0">
                            <div class="dish-card" v-for="dish in msg.dishes" :key="dish.dishId" @click="addToCart(dish)">
                                <img :src="dish.image || '/front/images/noImg.png'" :alt="dish.name" @error="imgError">
                                <div class="dish-info">
                                    <div class="dish-name">{{ dish.name }}</div>
                                    <div class="dish-reason" v-if="dish.reason">{{ dish.reason }}</div>
                                    <div class="dish-price">¥{{ (dish.price ? (dish.price / 100).toFixed(2) : '0.00') }}</div>
                                </div>
                                <button class="add-btn" @click.stop="addToCart(dish)">+</button>
                            </div>
                        </div>
                        <!-- 反馈按钮 -->
                        <div class="feedback-bar" v-if="msg.role === 'assistant' && msg.showFeedback && !msg.streaming">
                            <button :class="['feedback-btn', msg.feedback === 'good' ? 'active-good' : '']"
                                    @click="sendFeedback(msg, 'good')">👍 有用</button>
                            <button :class="['feedback-btn', msg.feedback === 'bad' ? 'active-bad' : '']"
                                    @click="sendFeedback(msg, 'bad')">👎 没用</button>
                        </div>
                        <!-- 错误重试 -->
                        <div class="retry-bar" v-if="msg.role === 'assistant' && msg.error">
                            <button class="retry-btn" @click="retryMessage(msg)">🔄 重新生成</button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 加载中 -- 修改点：修复双头像bug，streaming消息与loading指示器互斥 -->
            <div class="chat-msg assistant" v-if="loading && !hasStreamingMessage">
                <div class="chat-avatar">🤖</div>
                <div class="chat-bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <button class="voice-btn" :class="{'recording': isRecording}" @click="toggleVoice" title="语音输入">
                🎤
            </button>
            <input
                type="text"
                v-model="inputText"
                :placeholder="inputPlaceholder"
                @keyup.enter="sendMessage"
                :disabled="loading"
            >
            <button class="send-btn" @click="sendMessage" :disabled="!inputText.trim() || loading">
                ➤
            </button>
        </div>
    </div>

    <!-- 修改点：修正JS资源路径，Vue/axios在backend/plugins下，Vant在front/js下 -->
    <script src="/backend/plugins/vue/vue.js"></script>
    <script src="/backend/plugins/axios/axios.min.js"></script>
    <script src="../js/vant.min.js"></script>
    <script src="../js/request.js"></script>
    <script src="../api/ai.js"></script>
    <script>
    (function() {
        'use strict';

        // ==================== 工具函数 ====================

        /** 安全的内容格式化 - 仅支持白名单标签，杜绝 XSS */
        function safeFormatContent(content) {
            if (!content) return [];
            if (typeof content !== 'string') return [{ type: 'text', text: String(content) }];

            var parts = [];
            var remaining = content;

            // 按行分割处理
            var lines = remaining.split('\n');
            for (var li = 0; li < lines.length; li++) {
                var line = lines[li];

                if (li > 0) {
                    parts.push({ type: 'text', text: '\n' });
                }

                // 处理加粗文本 **text**
                var boldRegex = /\*\*(.*?)\*\*/g;
                var lastIndex = 0;
                var match;

                while ((match = boldRegex.exec(line)) !== null) {
                    // 加粗前的普通文本
                    if (match.index > lastIndex) {
                        parts.push({ type: 'text', text: line.substring(lastIndex, match.index) });
                    }
                    parts.push({ type: 'bold', text: match[1] });
                    lastIndex = match.index + match[0].length;
                }
                // 剩余文本
                if (lastIndex < line.length) {
                    parts.push({ type: 'text', text: line.substring(lastIndex) });
                }

                // 处理列表项 - 行首为 "- " 或 "· "
                if ((line.trim().startsWith('- ') || line.trim().startsWith('· ')) && parts.length > 0) {
                    // 收集连续列表项
                    var listItems = [];
                    listItems.push(line.trim().replace(/^[-·]\s*/, ''));
                    // 查找后续连续列表项
                    for (var ni = li + 1; ni < lines.length; ni++) {
                        var nextLine = lines[ni].trim();
                        if (nextLine.startsWith('- ') || nextLine.startsWith('· ')) {
                            listItems.push(nextLine.replace(/^[-·]\s*/, ''));
                        } else {
                            break;
                        }
                    }
                    parts.push({ type: 'list', items: listItems });
                    li += listItems.length - 1;
                    continue;
                }
            }

            // 如果没有特殊格式，直接返回纯文本
            if (parts.length === 0) {
                return [{ type: 'text', text: content }];
            }

            // 合并相邻的 text 类型
            var merged = [];
            for (var i = 0; i < parts.length; i++) {
                if (i > 0 && parts[i].type === 'text' && merged[merged.length - 1].type === 'text') {
                    merged[merged.length - 1].text += parts[i].text;
                } else {
                    merged.push(parts[i]);
                }
            }

            return merged;
        }

        /** 格式化时间 */
        function formatTime(timestamp) {
            var now = new Date();
            var date = new Date(timestamp);
            var diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 172800000) return '昨天';
            var month = (date.getMonth() + 1);
            var day = date.getDate();
            return month + '月' + day + '日';
        }

        // ==================== Vue 应用 ====================
        new Vue({
            el: '#ai-app',
            data: {
                inputText: '',
                loading: false,
                messages: [],
                // 修改点：按场景动态快捷提示
                quickTips: [],
                // 修改点：场景切换
                currentScene: 'order_assistant',
                scenes: [
                    { label: '🍽️ 点餐推荐', value: 'order_assistant' },
                    { label: '📝 菜品描述', value: 'dish_desc' },
                    { label: '📢 营销文案', value: 'marketing' }
                ],
                // 修改点：按场景的快捷提示配置
                quickTipsMap: {
                    order_assistant: [
                        '我想吃辣的', '推荐清淡的菜',
                        '2个人，预算100', '有什么招牌菜',
                        '适合小孩吃的', '帮我搭配一个套餐'
                    ],
                    dish_desc: [
                        '红烧肉', '麻辣香锅',
                        '清蒸鲈鱼', '宫保鸡丁'
                    ],
                    marketing: [
                        '满减活动文案', '新店开业促销',
                        '会员日专属优惠', '节假日活动方案'
                    ]
                },
                // 对话管理
                sidebarOpen: false,
                sidebarLoading: false,
                conversations: [],
                currentConversationId: null,
                // 请求控制
                currentRequestId: 0,
                // 语音
                isRecording: false,
                recognition: null,
                // 用户上下文
                userInfo: null,
                cartData: [],
                // 用户画像标签（基于历史偏好动态生成）
                userProfileTags: [],
                // 输入占位
                inputPlaceholder: '告诉小吉你想吃什么...'
            },

            computed: {
                // 修改点：根据当前场景计算快捷提示
                currentQuickTips: function() {
                    return this.quickTipsMap[this.currentScene] || [];
                },
                // 修改点：检测是否已有流式消息，避免与loading指示器的chat-avatar重复
                hasStreamingMessage: function() {
                    var self = this;
                    return self.messages.some(function(m) {
                        return m.role === 'assistant' && m.streaming === true;
                    });
                }
            },

            created: function() {
                this.loadUserInfo();
                // 修改点：先加载本地缓存，再异步从后端同步
                this.loadConversations();
                this.loadUserProfileTags();
                // 如果有本地对话直接加载
                if (this.conversations.length === 0) {
                    this.newConversation(true);
                } else {
                    this.switchConversation(this.conversations[0].id);
                }
                // 修改点：仅登录用户异步后端同步（未登录时API调用会触发request.js拦截器跳转登录页）
                if (this.userInfo) {
                    this.syncConversationsFromBackend();
                }
            },

            mounted: function() {
                this.initVoice();
                this.scrollToBottom();
                // 注册 ESC 键监听，支持关闭侧边栏
                this._handleEscKey = function(e) {
                    if ((e.key === 'Escape' || e.key === 'Esc') && this.sidebarOpen) {
                        this.toggleSidebar(false);
                    }
                }.bind(this);
                document.addEventListener('keydown', this._handleEscKey);
            },

            beforeDestroy: function() {
                // 移除 ESC 键监听
                if (this._handleEscKey) {
                    document.removeEventListener('keydown', this._handleEscKey);
                }
            },

            methods: {
                // ==================== 对话管理 ====================

                /** 创建新对话 */
                newConversation: function(silent) {
                    var conv = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        title: '',
                        messages: [],
                        scene: this.currentScene,
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                        timeText: '刚刚'    // 修改点：初始化 timeText
                    };
                    this.conversations.unshift(conv);
                    this.currentConversationId = conv.id;
                    this.messages = [];
                    if (!silent) {
                        this.saveConversations();
                        this.toggleSidebar(false);
                    }
                },

                /** 切换对话 */
                switchConversation: function(id) {
                    if (this.loading) return;
                    var conv = this.conversations.find(function(c) { return c.id === id; });
                    if (!conv) return;
                    this.currentConversationId = id;
                    this.messages = conv.messages || [];
                    this.toggleSidebar(false);
                    this.$nextTick(function() { this.scrollToBottom(); }.bind(this));
                },

                /** 删除对话 */
                deleteConversation: function(id) {
                    var self = this;
                    vant.Dialog.confirm({
                        title: '删除对话',
                        message: '确定要删除这个对话吗？此操作不可恢复。'
                    }).then(function() {
                        self.conversations = self.conversations.filter(function(c) { return c.id !== id; });
                        if (self.currentConversationId === id) {
                            if (self.conversations.length > 0) {
                                self.switchConversation(self.conversations[0].id);
                            } else {
                                self.newConversation(true);
                            }
                        }
                        self.saveConversations();
                    }).catch(function() {});
                },

                /** 切换侧边栏 */
                toggleSidebar: function(force) {
                    if (typeof force === 'boolean') {
                        this.sidebarOpen = force;
                    } else {
                        this.sidebarOpen = !this.sidebarOpen;
                    }
                },

                /** 保存对话到 localStorage */
                saveConversations: function() {
                    try {
                        var currentConv = this.getCurrentConversation();
                        if (currentConv) {
                            currentConv.messages = this.messages.slice(0, 100);
                            currentConv.updatedAt = Date.now();
                            currentConv.timeText = formatTime(Date.now());  // 修改点：更新 timeText
                            if (this.messages.length > 0) {
                                var firstUserMsg = this.messages.find(function(m) { return m.role === 'user'; });
                                if (firstUserMsg) {
                                    currentConv.title = firstUserMsg.content.substring(0, 30);
                                }
                            }
                        }
                        localStorage.setItem('ai_conversations', JSON.stringify(this.conversations.slice(0, 50)));
                    } catch (e) {
                        console.warn('保存对话失败:', e);
                    }
                },

                /** 从 localStorage 加载对话 */
                loadConversations: function() {
                    try {
                        var raw = localStorage.getItem('ai_conversations');
                        if (raw) {
                            var data = JSON.parse(raw);
                            if (Array.isArray(data)) {
                                // 修改点：为每个对话计算 timeText
                                var self = this;
                                this.conversations = data.slice(0, 50).map(function(c) {
                                    c.timeText = formatTime(c.updatedAt || c.createdAt || Date.now());
                                    return c;
                                });
                            }
                        }
                    } catch (e) {
                        this.conversations = [];
                    }
                },

                /** 获取当前对话对象 */
                getCurrentConversation: function() {
                    return this.conversations.find(function(c) { return c.id === this.currentConversationId; }.bind(this));
                },

                // 修改点：从后端 API 同步对话列表（不阻塞，静默更新）
                syncConversationsFromBackend: function() {
                    var self = this;
                    if (typeof aiApi === 'undefined' || !aiApi.getConversations) return;
                    aiApi.getConversations(1, 50).then(function(res) {
                        var data = res.data || res;
                        // 后端返回 R<T> 包装：code=1 时取 data
                        var backendList = (data && data.code === 1) ? data.data : data;
                        if (!Array.isArray(backendList) || backendList.length === 0) return;
                        // 合并后端数据到本地（以后端为主，但不覆盖本地未保存的消息）
                        backendList.forEach(function(backendConv) {
                            var localIdx = -1;
                            for (var i = 0; i < self.conversations.length; i++) {
                                if (self.conversations[i].id === backendConv.conversationId) {
                                    localIdx = i;
                                    break;
                                }
                            }
                            var conv = {
                                id: backendConv.conversationId,
                                title: backendConv.title || '对话',
                                scene: backendConv.scene || 'order_assistant',
                                messages: [],
                                createdAt: backendConv.createTime ? new Date(backendConv.createTime).getTime() : Date.now(),
                                updatedAt: backendConv.updateTime ? new Date(backendConv.updateTime).getTime() : Date.now(),
                                timeText: formatTime(backendConv.updateTime || backendConv.createTime || Date.now()),
                                messageCount: backendConv.messageCount || 0
                            };
                            if (localIdx >= 0) {
                                // 保留本地消息数据
                                conv.messages = self.conversations[localIdx].messages || [];
                                self.conversations.splice(localIdx, 1, conv);
                            } else {
                                self.conversations.push(conv);
                            }
                        });
                        // 按更新时间排序
                        self.conversations.sort(function(a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
                        self.saveConversations();
                    }).catch(function() {
                        // 后端不可用时静默忽略，使用本地缓存
                    });
                },

                // 修改点：清空全部对话
                clearAllConversations: function() {
                    var self = this;
                    vant.Dialog.confirm({
                        title: '清空对话',
                        message: '确定要清空全部对话记录吗？此操作不可恢复。'
                    }).then(function() {
                        self.conversations = [];
                        self.currentConversationId = null;
                        self.messages = [];
                        localStorage.removeItem('ai_conversations');
                        self.newConversation(true);
                    }).catch(function() {});
                },

                // 修改点：场景切换
                switchScene: function(scene) {
                    if (this.currentScene === scene) return;
                    this.currentScene = scene;
                    // 切换场景时创建新对话
                    this.saveConversations();
                    this.newConversation(true);
                    this.inputPlaceholder = this.getScenePlaceholder(scene);
                },

                // 修改点：获取场景提示语
                getScenePlaceholder: function(scene) {
                    var map = {
                        order_assistant: '告诉小吉你想吃什么...',
                        dish_desc: '输入菜名，AI帮你写美食描述...',
                        marketing: '输入营销需求，例：满减活动文案...'
                    };
                    return map[scene] || '输入消息...';
                },

                // ==================== 用户上下文 ====================

                /** 加载用户信息 */
                loadUserInfo: function() {
                    try {
                        var userInfo = sessionStorage.getItem('userInfo') || localStorage.getItem('userInfo');
                        if (userInfo) {
                            this.userInfo = JSON.parse(userInfo);
                        }
                    } catch (e) { }
                },

                /** 加载用户画像标签（基于历史偏好） */
                loadUserProfileTags: function() {
                    var self = this;
                    try {
                        // 优先从 localStorage 读取缓存的画像
                        var cached = localStorage.getItem('ai_profile_tags');
                        if (cached) {
                            try {
                                self.userProfileTags = JSON.parse(cached);
                            } catch(e) {}
                        }
                        // 修改点：仅登录用户异步从后端获取（未登录时API调用会触发拦截器跳转登录页）
                        if (!self.userInfo) return;
                        // 异步从后端获取最新画像摘要
                        if (typeof aiApi !== 'undefined' && aiApi.getProfileSummary) {
                            aiApi.getProfileSummary().then(function(res) {
                                var data = res.data || res;
                                var result = (data && data.code === 1) ? data.data : data;
                                if (result && result.tags && result.tags.length > 0) {
                                    self.userProfileTags = result.tags.slice(0, 5);
                                    try {
                                        localStorage.setItem('ai_profile_tags', JSON.stringify(self.userProfileTags));
                                    } catch(e) {}
                                }
                            }).catch(function() {
                                // 修改点：后端不可用时静默忽略，使用缓存
                            });
                        }
                    } catch (e) { }
                },

                /** 加载购物车数据（用于上下文） */
                loadCartContext: function() {
                    var self = this;
                    try {
                        var cartData = sessionStorage.getItem('cartData');
                        if (cartData) {
                            self.cartData = JSON.parse(cartData);
                        }
                    } catch (e) { }
                },

                /** 构建上下文信息 */
                buildContext: function() {
                    var context = {};
                    if (this.userInfo) {
                        context.user = {
                            name: this.userInfo.name || '',
                            phone: this.maskPhone(this.userInfo.phone || '')
                        };
                    }
                    if (this.cartData && this.cartData.length > 0) {
                        context.cart = {
                            itemCount: this.cartData.length,
                            totalAmount: this.cartData.reduce(function(sum, item) {
                                return sum + (item.number || 0);
                            }, 0),
                            items: this.cartData.slice(0, 5).map(function(item) {
                                return { name: item.name, quantity: item.number };
                            })
                        };
                    }
                    return context;
                },

                /** 手机号脱敏 */
                maskPhone: function(phone) {
                    if (!phone || phone.length !== 11) return phone || '';
                    return phone.substring(0, 3) + '****' + phone.substring(7);
                },

                // ==================== 消息发送 ====================

                sendMessage: function() {
                    var text = this.inputText.trim();
                    if (!text || this.loading) return;

                    // 加载购物车上下文
                    this.loadCartContext();

                    // 取消之前的请求
                    this.currentRequestId++;

                    var requestId = this.currentRequestId;
                    var userMsg = {
                        id: Date.now(),
                        role: 'user',
                        content: text,
                        timestamp: Date.now()
                    };

                    // 创建助手消息占位
                    var assistantMsg = {
                        id: Date.now() + 1,
                        role: 'assistant',
                        content: '',
                        renderedParts: [],
                        streaming: true,
                        showFeedback: false,
                        feedback: null,
                        error: false,
                        retryData: null,
                        timestamp: Date.now()
                    };

                    this.messages.push(userMsg);
                    this.messages.push(assistantMsg);
                    this.inputText = '';
                    this.loading = true;
                    this.scrollToBottom();

                    var self = this;
                    var conversationId = self.currentConversationId;
                    var userId = self.getUserId();
                    var scene = self.currentScene;

                    // 修改点：根据场景选择不同的 API
                    var apiCall;
                    if (scene === 'order_assistant') {
                        apiCall = aiApi.orderAssistant(text, userId, conversationId);
                    } else {
                        // dish_desc / marketing 使用通用 chat 接口
                        apiCall = aiApi.chat(text, scene, conversationId);
                    }

                    apiCall.then(function(res) {
                        // 检查是否是最新请求
                        if (requestId !== self.currentRequestId) return;

                        var data = res.data || res;
                        // 解析 R<T> 包装：code=1 时取 data
                        var responseData = (data && data.code === 1) ? data.data : data;
                        assistantMsg.content = (responseData && responseData.content)
                            ? responseData.content
                            : '抱歉，我没理解您的意思，换个说法试试？';
                        assistantMsg.streaming = false;
                        assistantMsg.showFeedback = true;
                        assistantMsg.renderedParts = safeFormatContent(assistantMsg.content);
                        // 修改点：仅点餐场景显示菜品卡片
                        assistantMsg.dishes = (scene === 'order_assistant' && responseData && responseData.dishes)
                            ? responseData.dishes : [];

                        // 修改点：处理后端返回的 conversationId（自动创建的对话）
                        var meta = (responseData && responseData.data) || {};
                        if (meta.conversationId && !self.currentConversationId) {
                            self.currentConversationId = meta.conversationId;
                        }

                        self.scrollToBottom();
                        self.saveConversations();
                    }).catch(function(err) {
                        if (requestId !== self.currentRequestId) return;
                        assistantMsg.content = '抱歉，请求失败，请重试。';
                        assistantMsg.streaming = false;
                        assistantMsg.error = true;
                        assistantMsg.retryData = { message: text, requestId: requestId };
                        assistantMsg.renderedParts = [{ type: 'text', text: assistantMsg.content }];
                        self.scrollToBottom();
                    }).finally(function() {
                        if (requestId === self.currentRequestId) {
                            self.loading = false;
                        }
                    });
                },

                /** 重新生成 */
                retryMessage: function(msg) {
                    if (msg.retryData) {
                        // 移除错误消息和之前的用户消息
                        var idx = this.messages.indexOf(msg);
                        if (idx > 0) {
                            this.messages.splice(idx - 1, 2);
                        }
                        // 重新发送
                        this.inputText = msg.retryData.message;
                        this.sendMessage();
                    }
                },

                /** 发送快捷提示 */
                sendQuickTip: function(tip) {
                    this.inputText = tip;
                    this.sendMessage();
                },

                // ==================== 推荐菜品操作 ====================

                // 修改点：加入购物车——修复图片路径和菜品ID映射
                addToCart: function(dish) {
                    // 修改点：统一处理图片路径
                    var imgUrl = dish.image || '';
                    if (!imgUrl && dish.imageUrl) imgUrl = dish.imageUrl;
                    // 修改点：如果菜品ID缺省则降级处理
                    var dishId = dish.dishId || dish.id || 0;
                    // 修改点：dish.price 单位是分，需转换为元
                    var price = dish.price ? parseFloat((dish.price / 100).toFixed(2)) : 0;
                    if (window.addDishToCart) {
                        window.addDishToCart({
                            id: dishId,
                            name: dish.name,
                            price: price,
                            image: imgUrl,
                            flavors: []
                        });
                    } else {
                        vant.Notify({ type: 'success', message: '已添加「' + dish.name + '」到购物车' });
                    }
                },

                // ==================== 反馈 ====================

                sendFeedback: function(msg, type) {
                    msg.feedback = type;
                    // 向后端发送反馈（静默处理，不阻塞UI）
                    var self = this;
                    try {
                        // 修改点：使用正确的 API 调用和参数
                        if (typeof aiApi !== 'undefined' && aiApi.recordFeedback) {
                            aiApi.recordFeedback({
                                messageId: msg.id,
                                feedbackType: type,
                                scene: self.currentScene
                            }).catch(function() {});
                        }
                    } catch (e) { }
                    this.saveConversations();
                },

                // ==================== 语音输入 ====================

                initVoice: function() {
                    var self = this;
                    try {
                        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        if (!SpeechRecognition) return;

                        this.recognition = new SpeechRecognition();
                        this.recognition.lang = 'zh-CN';
                        this.recognition.interimResults = false;
                        this.recognition.maxAlternatives = 1;

                        this.recognition.onresult = function(event) {
                            var transcript = event.results[0][0].transcript;
                            self.inputText = transcript;
                            self.isRecording = false;
                        };

                        this.recognition.onerror = function(event) {
                            console.warn('语音识别错误:', event.error);
                            self.isRecording = false;
                            if (event.error === 'not-allowed') {
                                vant.Notify({ type: 'warning', message: '请允许麦克风权限' });
                            }
                        };

                        this.recognition.onend = function() {
                            self.isRecording = false;
                        };
                    } catch (e) {
                        console.warn('语音初始化失败:', e);
                    }
                },

                toggleVoice: function() {
                    if (!this.recognition) {
                        vant.Notify({ type: 'warning', message: '您的浏览器不支持语音输入' });
                        return;
                    }
                    if (this.isRecording) {
                        this.recognition.stop();
                        this.isRecording = false;
                    } else {
                        this.recognition.start();
                        this.isRecording = true;
                        vant.Notify({ type: 'success', message: '请说话...', duration: 2000 });
                    }
                },

                // ==================== 工具方法 ====================

                /** 获取用户ID */
                getUserId: function() {
                    if (this.userInfo && this.userInfo.id) return this.userInfo.id;
                    var userId = sessionStorage.getItem('userId');
                    return userId ? parseInt(userId) : null;
                },

                /** 滚动到底部 */
                scrollToBottom: function() {
                    var self = this;
                    this.$nextTick(function() {
                        var el = self.$refs.chatArea;
                        if (el) {
                            el.scrollTop = el.scrollHeight;
                        }
                    });
                },

                /* 修改点：修复死循环——加载失败时改用绝对路径兜底，并防重入 */
                imgError: function(e) {
                    // 如果已经指向兜底图片，不再重复替换（防止死循环）
                    if (e.target.src.indexOf('/front/images/noImg.png') >= 0) return;
                    e.target.src = '/front/images/noImg.png';
                },

                // 修改点：始终直接导航回首页，不依赖不可靠的 history.back()
                close: function() {
                    this.saveConversations();
                    // 使用 replace 避免 AI 助手页面留在浏览器后退栈中
                    // 修改点：绝对路径而非相对路径，index.html 实际在 /front/ 根目录
                    window.location.replace('/front/index.html');
                }
            }
        });
    })();
    </script>
</body>
