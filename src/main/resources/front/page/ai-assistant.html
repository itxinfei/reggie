                loadCartContext: function() {
                    var self = this;
                    try {
                        // 从购物车接口拉取最新数据（sessionStorage 里的 cartData 可能过期，导致 AI 上下文把空车当有货）
                        $axios({ url: '/shopping-cart/list', method: 'get' })
                            .then(function(res) {
                                if (res && res.code === 1 && Array.isArray(res.data)) {
                                    self.cartData = res.data;
                                    try { sessionStorage.setItem('cartData', JSON.stringify(res.data)); } catch (e) {}
                                }
                            })
                            .catch(function(e) { console.warn('[ai-assistant.html] 刷新购物车上下文失败:', e); });
                    } catch (e) { console.warn('[ai-assistant.html] 加载购物车上下文异常:', e); }
                },
                // 默认地址仅在登录态下预取（未登录调用会被拦截器重定向到登录页）
                loadAddressContext: function() {
                    var self = this;
                    try {
                        if (!sessionStorage.getItem('userId')) return;
                        $axios({ url: '/address-book/default', method: 'get' })
                            .then(function(res) {
                                if (res && res.code === 1 && res.data) self.addressData = res.data;
                            })
                            .catch(function() { /* 无默认地址属正常情况，静默 */ });
                    } catch (e) { /* noop */ }
                },
                // 真实随请求提交的 context（购物车 + 地址摘要 + 脱敏用户信息）
                buildContext: function() {
                    var context = {};
                    if (this.userInfo) {
                        context.user = { name: this.userInfo.name || '', phone: this.maskPhone(this.userInfo.phone || '') };
                    }
                    if (this.cartData && this.cartData.length > 0) {
                        var totalNumber = this.cartData.reduce(function(sum, item) { return sum + (item.number || 0); }, 0);
                        context.cart = {
                            itemKinds: this.cartData.length,
                            totalNumber: totalNumber,
                            items: this.cartData.slice(0, 5).map(function(item) {
                                return { name: item.name, quantity: item.number };
                            })
                        };
                    }
                    if (this.addressData) {
                        var addr = this.addressData;
                        context.address = {
                            consignee: addr.consignee || '',
                            detail: ((addr.provinceCode ? '' : '') + (addr.district || '') + (addr.detail || '')).trim()
                        };
                    }
                    return context;
                },
                maskPhone: function(phone) {
                    if (!phone || phone.length !== 11) return phone || '';
                    return phone.substring(0, 3) + '****' + phone.substring(7);
                },

                // ==================== 消息发送（POST + SSE） ====================

                /**
                 * 发送消息。
                 * @param {string} [overrideText] 快捷问题/重试时外部传入文本
                 * @param {Array} [overrideAttachments] 重试时复用原消息附件 VO
                 */
                sendMessage: function(overrideText, overrideAttachments) {
                    if (this.loading) return;
                    var hasOverride = arguments.length > 0;
                    var text;
                    var views;
                    if (hasOverride) {
                        text = overrideText != null ? String(overrideText).trim() : '';
                        views = this.normalizeAttachments(overrideAttachments);
                    } else {
                        text = this.inputText.trim();
                        if (this.uploadingCount > 0) {
                            vant.Notify({ type: 'warning', message: '图片正在上传，请稍候', duration: 2000 });
                            return;
                        }
                        views = this.normalizeAttachments(this.readyAttachments);
                    }
                    // 纯图片消息允许无文本；超长拦截
                    if ((!text && !views.length) || this.inputText.length > 4000) return;
                    // 网络检测
                    if (!this.checkNetwork()) return;

                    // 后台静默刷新购物车（本轮使用已加载数据，下一轮生效）
                    this.loadCartContext();

                    var userMsg = window.AiChatCore.MessageFactory.createUserMessage(
                        text, { attachments: views.length ? views : null });
                    var aiMsg = window.AiChatCore.MessageFactory.createAssistantMessage();
                    this.messages.push(userMsg);
                    this.messages.push(aiMsg);

                    if (!hasOverride) {
                        this.clearPendingAttachments();
                        this.inputText = '';
                        this.resetInputHeight();
                    }
                    this.loading = true;
                    this.scrollToBottom();

                    this.runStream(userMsg, aiMsg, {
                        regenerate: false,
                        fallbackUsed: false,
                        text: text,
                        attachments: views
                    });
                },

                /** 规整附件参数：只保留含 attachmentId 的后端 VO 形态（防前端伪造字段） */
                normalizeAttachments: function(list) {
                    var out = [];
                    if (!list || !list.length) return out;
                    list.forEach(function(a) {
                        if (a && a.attachmentId) {
                            out.push({
                                attachmentId: a.attachmentId,
                                type: a.type || 'image',
                                mime: a.mime || '',
                                url: a.url,
                                width: a.width || null,
                                height: a.height || null,
                                fileSize: a.fileSize || null
                            });
                        }
                    });
                    return out;
                },

                /**
                 * 发起 POST 流式请求（AiChatCore.ChatClient 内部 fetch + ReadableStream）
                 */
                runStream: function(userMsg, aiMsg, opts) {
                    var self = this;
                    this.currentRequestId++;
                    var requestId = this.currentRequestId;
                    var conv = this.getCurrentConversation();
                    var serverCid = (conv && conv.serverBacked) ? conv.id : null;

                    var body = { scene: this.currentScene };
                    if (serverCid) body.conversationId = serverCid;
                    if (opts.regenerate) {
                        body.regenerate = true;
                    } else {
                        body.message = userMsg.content;
                        body.clientMsgId = userMsg.clientMsgId;
                        if (opts.attachments && opts.attachments.length) {
                            body.attachments = opts.attachments.map(function(a) {
                                return String(a.attachmentId);
                            });
                        }
                        var ctx = this.buildContext();
                        if (Object.keys(ctx).length > 0) body.context = ctx;
                    }

                    var client = new window.AiChatCore.ChatClient();
                    this.streamClient = client;
                    client.stream({
                        url: aiApi.streamUrl,
                        body: body,
                        onCapabilities: function(caps) {
                            if (requestId !== self.currentRequestId) return;
                            // SSE 实时能力优先于进页面时的 scene-config（商家刚改配置也能立即生效）
                            if (caps) self.capabilities = caps;
                        },
                        onToken: function(token) {
                            if (requestId !== self.currentRequestId) return;
                            aiMsg.content += token;
                            self.scheduleScroll();
                        },
                        onDishes: function(dishes) {
                            if (requestId !== self.currentRequestId) return;
                            aiMsg.dishes = dishes;
                        },
                        onTool: function(tool) {
                            // P4 经营数据工具调用状态：{name,label,status:running|done|error,summary}
                            if (requestId !== self.currentRequestId || !tool || !tool.name) return;
                            self.applyToolEvent(aiMsg, tool);
                        },
                        onDone: function(data) {
                            if (requestId !== self.currentRequestId) return;
                            if (data.messageId) aiMsg.dbMessageId = data.messageId;
                            if (data.conversationId) self.bindServerConversation(conv, data.conversationId);
                            self.finishTurn(aiMsg, { stopped: data.stopped === true });
                        },
                        onAbort: function() {
                            if (requestId !== self.currentRequestId) return;
                            // 用户主动停止：保留已生成片段（服务端同步以 stopped 落库）
                            self.finishTurn(aiMsg, { stopped: true });
                        },
                        onError: function(message, info) {
                            if (requestId !== self.currentRequestId) return;
                            info = info || {};
                            if (info.notLogin) {
                                aiMsg.streaming = false;
                                self.loading = false;
                                self.streamClient = null;
                                redirectToLogin();
                                return;
                            }
                            // 网络失败且尚无内容：自动降级一次非流式接口
                            if (!opts.regenerate && !opts.fallbackUsed && info.network && !aiMsg.content) {
                                opts.fallbackUsed = true;
                                self.fallbackNonStream(userMsg, aiMsg, serverCid, opts.attachments);
                                return;
                            }
                            aiMsg.streaming = false;
                            aiMsg.error = true;
                            aiMsg.retryData = opts.regenerate
                                ? { regenerate: true }
                                : {
                                    message: userMsg ? userMsg.content : '',
                                    attachments: opts.attachments || null
                                };
                            if (!aiMsg.content) aiMsg.content = message || '抱歉，请求失败，请重试。';
                            self.loading = false;
                            self.streamClient = null;
                            self.scrollToBottom();
                            self.saveConversations();
                        },
                        onComplete: function() {
                            // 服务端未发 done 即断流的兜底：有内容正常收尾，无内容标错显示重试
                            if (requestId !== self.currentRequestId) return;
                            if (aiMsg.streaming) {
                                self.finishTurn(aiMsg, { stopped: !aiMsg.content });
                            }
                        }
                    });
                },

                /** P4 工具事件按 name 合并到状态条（running→done/error 保留同一条） */
                applyToolEvent: function(aiMsg, tool) {
                    if (!aiMsg.tools) this.$set(aiMsg, 'tools', []);
                    var hit = null;
                    for (var i = 0; i < aiMsg.tools.length; i++) {
                        if (aiMsg.tools[i].name === tool.name) { hit = aiMsg.tools[i]; break; }
                    }
                    if (!hit) {
                        hit = { name: tool.name, label: tool.label || tool.name, status: tool.status, summary: tool.summary || '' };
                        aiMsg.tools.push(hit);
                    } else {
                        this.$set(hit, 'status', tool.status);
                        if (tool.label) this.$set(hit, 'label', tool.label);
                        if (tool.summary) this.$set(hit, 'summary', tool.summary);
                    }
                    this.scheduleScroll();
                },

                /** 工具状态 → RemixIcon 类名 */
                toolStatusIcon: function(status) {
                    if (status === 'done') return 'ri-checkbox-circle-line';
                    if (status === 'error') return 'ri-error-warning-line';
                    return 'ri-loader-4-line ai-tool-spin';
                },

                /** 流式不可用时的非流式降级（点餐走 order-assistant，其余走通用 chat；附件随降级通道透传） */
                fallbackNonStream: function(userMsg, aiMsg, serverCid, attachments) {
                    var self = this;
                    var text = userMsg.content;
                    var attachmentIds = [];
                    (attachments || []).forEach(function(a) {
                        if (a && a.attachmentId) attachmentIds.push(String(a.attachmentId));
                    });
                    var promise = (this.currentScene === 'order_assistant')
                        ? aiApi.orderAssistant(text, null, serverCid, attachmentIds)
                        : aiApi.chat(text, this.currentScene, serverCid, attachmentIds);
                    promise.then(function(res) {
                        var payload = (res && res.code === 1) ? res.data : null;
                        if (!payload) { throw new Error((res && res.msg) || '服务异常'); }
                        aiMsg.content = payload.content || '抱歉，我没理解您的意思，换个说法试试？';
                        aiMsg.dishes = (self.currentScene === 'order_assistant' && payload.dishes) ? payload.dishes : [];
                        var meta = payload.data || {};
                        var conv = self.getCurrentConversation();
                        if (meta.conversationId) self.bindServerConversation(conv, meta.conversationId);
                        self.finishTurn(aiMsg, { stopped: false });
                    }).catch(function(e) {
                        console.warn('[ai-assistant] 非流式降级失败:', e);
                        aiMsg.content = '抱歉，请求失败，请重试。';
                        aiMsg.streaming = false;
                        aiMsg.error = true;
                        aiMsg.retryData = { message: text, attachments: attachments || null };
                        self.loading = false;
                        self.streamClient = null;
                        self.scrollToBottom();
                        self.saveConversations();
                    });
                },

                /** 用户点击停止 */
                stopGenerate: function() {
                    if (this.streamClient) {
                        try { this.streamClient.stop(); } catch (e) { /* noop */ }
                    }
                },

                // ==================== 图片附件（P2 视觉多模态） ====================

                /** 点击图片按钮：无视觉能力给明确提示，否则打开文件选择 */
                pickImage: function() {
                    if (this.loading) return;
                    if (!this.visionEnabled) {
                        vant.Notify({ type: 'warning', message: '当前 AI 模型不支持图片', duration: 2000 });
                        return;
                    }
                    if (this.pendingAttachments.length >= 3) {
                        vant.Notify({ type: 'warning', message: '每条消息最多发送 3 张图片', duration: 2000 });
                        return;
                    }
                    var input = this.$refs.imageInput;
                    if (input) { input.value = ''; input.click(); }
                },

                /** 文件选择回调（多选，逐张校验+压缩+上传） */
                onImagePicked: function(e) {
                    var files = e.target && e.target.files;
                    if (files && files.length) this.addImageFiles(files);
                },

                /** textarea 粘贴图片（截图/复制图片直接粘贴） */
                onPasteImage: function(e) {
                    if (!this.visionEnabled || !e.clipboardData) return;
                    var items = e.clipboardData.items;
                    if (!items) return;
                    var imageFiles = [];
                    for (var i = 0; i < items.length; i++) {
                        if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
                            var f = items[i].getAsFile();
                            if (f) imageFiles.push(f);
                        }
                    }
                    if (imageFiles.length) {
                        e.preventDefault();
                        this.addImageFiles(imageFiles);
                    }
                },

                /**
                 * 批量加入图片：数量控制 → 本地预览占位 → 压缩上传 → 成功合并后端权威 VO。
                 * 上传期间不阻断继续输入；发送按钮等待全部上传完成。
                 */
                addImageFiles: function(fileList) {
                    var self = this;
                    var uploader = window.AiChatCore.AttachmentUploader;
                    var files = Array.prototype.slice.call(fileList);
                    files.forEach(function(file) {
                        if (self.pendingAttachments.length >= uploader.MAX_IMAGES) {
                            vant.Notify({ type: 'warning', message: '每条消息最多发送 ' + uploader.MAX_IMAGES + ' 张图片', duration: 2000 });
                            return;
                        }
                        var check = uploader.validateFile(file);
                        if (!check.ok) {
                            vant.Notify({ type: 'warning', message: check.message, duration: 2500 });
                            return;
                        }
                        var item = {
                            uid: window.AiChatCore.genId('att'),
                            localUrl: window.URL ? window.URL.createObjectURL(file) : '',
                            url: '',
                            uploading: true
                        };
                        self.pendingAttachments.push(item);
                        uploader.upload(file, self.currentScene).then(function(vo) {
                            // 合并后端权威 VO，保留本地预览地址直到消息发出
                            Object.keys(vo).forEach(function(k) {
                                self.$set(item, k, vo[k]);
                            });
                            self.$set(item, 'uploading', false);
                        }).catch(function(err) {
                            if (err && err.notLogin) {
                                redirectToLogin();
                                return;
                            }
                            vant.Notify({ type: 'danger', message: (err && err.message) || '图片上传失败', duration: 2500 });
                            self.removePendingItem(item);
                        });
                    });
                },

                removePendingImage: function(idx) {
                    var item = this.pendingAttachments[idx];
                    this.pendingAttachments.splice(idx, 1);
                    this.revokeLocalUrl(item);
                },

                /** 上传失败按对象移除（索引可能已变化） */
                removePendingItem: function(item) {
                    var idx = this.pendingAttachments.indexOf(item);
                    if (idx >= 0) this.pendingAttachments.splice(idx, 1);
                    this.revokeLocalUrl(item);
                },

                /** 发送/切换会话时清空全部待发图片并释放本地预览 URL */
                clearPendingAttachments: function() {
                    if (this.pendingAttachments && this.pendingAttachments.length) {
                        this.pendingAttachments.forEach(this.revokeLocalUrl);
                    }
                    this.pendingAttachments = [];
                },

                revokeLocalUrl: function(item) {
                    if (item && item.localUrl && window.URL) {
                        try { window.URL.revokeObjectURL(item.localUrl); } catch (e) { /* noop */ }
                    }
                },

                /** 点击聊天图片：自建 lightbox 放大（鉴权图同域带 cookie，可直接显示） */
                openImagePreview: function(e, url) {
                    e.preventDefault();
                    this.previewImageUrl = url;
                },

                closeImagePreview: function() {
                    this.previewImageUrl = '';
                },

                /** 统一收尾 AI 占位消息 */
                finishTurn: function(aiMsg, opts) {
                    opts = opts || {};
                    aiMsg.streaming = false;
                    aiMsg.stopped = !!opts.stopped;
                    this.loading = false;
                    this.streamClient = null;
                    var conv = this.getCurrentConversation();
                    if (conv) {
                        conv.updatedAt = Date.now();
                        conv.timeText = formatTime(Date.now());
                    }
                    this.scrollToBottom();
                    this.saveConversations();
                },

                // ==================== 重试 / 重生成 / 复制 ====================
                /** 错误气泡重试：原文重发或重新生成 */
                retryMessage: function(msg) {
                    if (!msg.retryData) return;
                    var idx = this.messages.indexOf(msg);
                    if (msg.retryData.regenerate) {
                        if (idx >= 0) this.messages.splice(idx, 1);
                        var aiMsg = window.AiChatCore.MessageFactory.createAssistantMessage();
                        this.messages.push(aiMsg);
                        this.loading = true;
                        this.scrollToBottom();
                        this.runStream(null, aiMsg, { regenerate: true, fallbackUsed: false });
                        return;
                    }
                    var text = msg.retryData.message;
                    var views = this.normalizeAttachments(msg.retryData.attachments);
                    // 删除失败 AI 消息与其用户消息，用原文/原图重新发送（新 clientMsgId 走幂等）
                    if (idx > 0) this.messages.splice(idx - 1, 2);
                    this.sendMessage(text || '', views);
                },
                canRegenerate: function(msg) {
                    if (this.loading) return false;
                    var conv = this.getCurrentConversation();
                    if (!conv || !conv.serverBacked) return false;
                    return this.messages[this.messages.length - 1] === msg
                        && msg.role === 'assistant' && !!msg.content;
                },
                /** 重新生成最后一条回复（服务端重放最后一条用户消息） */
                regenerateMessage: function(msg) {
                    if (this.loading || !this.canRegenerate(msg)) return;
                    var idx = this.messages.indexOf(msg);
                    this.messages.splice(idx, 1);
                    var aiMsg = window.AiChatCore.MessageFactory.createAssistantMessage();
                    this.messages.push(aiMsg);
                    this.loading = true;
                    this.scrollToBottom();
                    this.runStream(null, aiMsg, { regenerate: true, fallbackUsed: false });
                },
                sendQuickTip: function(tip) {
                    if (this.loading) return;
                    // 参数式发送，避免带上输入区里尚未发送的图片
                    this.sendMessage(tip);
                },

                // ==================== 推荐菜品 ====================
                addToCart: function(dish) {
                    var dishId = dish.dishId || dish.id || 0;
                    if (!dishId) {
                        vant.Notify({ type: 'warning', message: '菜品信息不完整' });
                        return;
                    }
                    if (!sessionStorage.getItem('userId')) {
                        vant.Dialog.confirm({
                            title: '未登录',
                            message: '请先登录后再添加购物车',
                            confirmButtonText: '去登录'
                        }).then(function() {
                            window.location.href = '/front/page/login.html';
                        }).catch(function(e) { console.warn('[ai-assistant.html] 用户取消登录跳转:', e); });
                        return;
                    }
                    // 真实加购：AI 推荐仅提供菜品（dishId），userId/价格由服务端从登录态与菜品表绑定，防篡改
                    var payload = {
                        dishId: dishId,
                        name: dish.name,
                        image: dish.image || '',
                        amount: dish.price ? Number(dish.price) : 0,
                        number: 1
                    };
                    $axios({ url: '/shopping-cart/add', method: 'post', data: payload })
                        .then(function(res) {
                            if (res && res.code === 1) {
                                // 成功提示可点击直达结算页，补齐 AI 加购后的转化出口
                                var cartNotify = vant.Notify({
                                    type: 'success',
                                    message: '已添加「' + dish.name + '」到购物车，点击去结算',
                                    duration: 2500,
                                    onClick: function() {
                                        cartNotify.close();
                                        window.location.href = '/front/page/add-order.html';
                                    }
                                });
                            } else {
                                vant.Notify({ type: 'warning', message: (res && res.msg) || '添加失败' });
                            }
                        })
                        .catch(function(e) {
                            console.warn('[ai-assistant.html] 加购失败:', e);
                            vant.Notify({ type: 'danger', message: '加购失败，请稍后重试' });
                        });
                },

                // ==================== 反馈 ====================
                sendFeedback: function(msg, type) {
                    if (!msg.dbMessageId) return;
                    msg.feedback = type;
                    try {
                        if (typeof aiApi !== 'undefined' && aiApi.recordFeedback) {
                            aiApi.recordFeedback({
                                // 使用 done 事件回填的真实 messageId（原前端临时 id 后端无法关联）
                                messageId: msg.dbMessageId,
                                // 后端校验只接受 positive/negative（UI 本地状态用 good/bad）
                                feedbackType: type === 'good' ? 'positive' : 'negative',
                                scene: this.currentScene
                            }).catch(function(e) { console.warn('[ai-assistant] recordFeedback 失败:', e); });
                        }
                    } catch (e) { console.warn('[ai-assistant] recordFeedback 异常:', e); }
                    this.saveConversations();
                },

                // ==================== 语音输入 ====================
                initVoice: function() {
                    var self = this;
                    try {
                        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                        if (!SR) return;
                        this.recognition = new SR();
                        this.recognition.lang = 'zh-CN';
                        this.recognition.interimResults = false;
                        this.recognition.maxAlternatives = 1;
                        this.recognition.onresult = function(event) {
                            self.inputText = event.results[0][0].transcript;
                            self.isRecording = false;
                        };
                        this.recognition.onerror = function(event) {
                            self.isRecording = false;
                            if (event.error === 'not-allowed') vant.Notify({ type: 'warning', message: '请允许麦克风权限' });
                        };
                        this.recognition.onend = function() { self.isRecording = false; };
                    } catch (e) { console.warn('语音初始化失败:', e); }
                },
                toggleVoice: function() {
                    if (!this.recognition) {
                        vant.Notify({ type: 'warning', message: '您的浏览器不支持语音输入' });
                        return;
                    }
                    if (this.isRecording) {
                        try { this.recognition.stop(); } catch (e) { console.warn('语音停止异常:', e); }
                        this.isRecording = false;
                    } else {
                        // start() 为异步且可能抛 InvalidStateError（连点/上一次未结束），try-catch 防卡态
                        try {
                            this.recognition.start();
                            this.isRecording = true;
                            vant.Notify({ type: 'success', message: '请说话...', duration: 2000 });
                        } catch (e) {
                            console.warn('语音启动异常:', e);
                            this.isRecording = false;
                            vant.Notify({ type: 'warning', message: '语音启动中，请稍候再试' });
                        }
                    }
                },

                // ==================== 工具方法 ====================
                scheduleScroll: function() {
                    var self = this;
                    if (this._scrollQueued) return;
                    this._scrollQueued = true;
                    var raf = window.requestAnimationFrame || function(cb) { return setTimeout(cb, 60); };
                    raf(function() {
                        self._scrollQueued = false;
                        self.scrollToBottom();
                    });
                },
                scrollToBottom: function() {
                    var self = this;
                    this.$nextTick(function() {
                        var el = self.$refs.chatArea;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                },
                imgError: function(e) {
                    if (e.target.src.indexOf('/front/images/noImg.png') >= 0) return;
                    e.target.src = '/front/images/noImg.png';
                },
                close: function() {
                    this.saveConversations();
                    window.location.replace('/front/index.html');
                }
            }
        });
    })();
    </script>
</body>
</html>
