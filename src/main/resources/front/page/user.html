<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>个人中心 - 瑞吉外卖</title>
    <link rel="icon" href="./../images/favico.ico">
    <!-- 引入样式  -->
    <link rel="stylesheet" href="../styles/index.css" />
    <!--引入vant样式-->
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <!--本页面内容的样式-->
    <link rel="stylesheet" href="./../styles/user.css" />
</head>
<body>
    <!-- 修改点：移除ElementUI v-loading，改用CSS加载遮罩 -->
    <div id="user" class="app" style="position:relative;">
        <div v-if="pageLoading" class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>
        <div class="divHead">
            <div class="divTitle">
                <i class="icon-back-arrow" @click="goBack"></i>个人中心
            </div>
            <div class="divUser">
                <img :src="userAvatar || './../images/headPage.png'"/>
                <div class="desc">
                    <!-- 修改点：动态性别图标 + 编辑入口 -->
                    <div class="divName">
                        {{ userName || '用户' }}
                        <img v-if="userGender === 1" src="./../images/women.png" class="gender-icon"/>
                        <img v-else-if="userGender === 0" src="./../images/man.png" class="gender-icon"/>
                    </div>
                    <!-- 修改点：手机号脱敏显示 138****1234 -->
                    <div class="divPhone">{{ maskedPhone }}</div>
                </div>
            </div>
        </div>
        <div class="divContent">
            <div class="divLinks">
                <div class="item" @click="toAddressPage">
                    <img src="./../images/locations.png"/>
                    <span>地址管理</span>
                    <i class="icon-arrow-right"></i>
                </div>
                <div class="divSplit"></div>
                <div class="item" @click="toMessagePage">
                    <img src="./../images/orders.png"/>
                    <span>消息中心</span>
                    <i class="icon-arrow-right"></i>
                </div>
                <div class="divSplit"></div>
                <div class="item" @click="toOrderPage">
                    <img src="./../images/orders.png"/>
                    <span>历史订单</span>
                    <i class="icon-arrow-right"></i>
                </div>
                <div class="divSplit"></div>
                <div class="item" @click="toEvaluationPage">
                    <img src="./../images/orders.png"/>
                    <span>我的评价</span>
                    <i class="icon-arrow-right"></i>
                </div>
            </div>
            <div class="divOrders" v-if="order[0]">
                <div class="title">最新订单</div>
                <div class="timeStatus">
                    <span>{{order[0].orderTime}}</span>
                    <span>{{getStatus(order[0].status)}}</span>
                </div>
                <div class="dishList">
                    <div v-for="(item,index) in order[0].orderDetails" :key="index" class="item">
                        <span>{{item.name}}</span>
                        <span>x{{item.number}}</span>
                    </div>
                </div>
                <div class="result">
                    <span>共{{order[0].sumNum}} 件商品,实付</span>
                    <span class="price">￥{{order[0].amount}}</span>
                </div>
                <!-- 修改点：按钮级loading状态，禁用时防止重复点击 -->
                <div class="btn" v-if="order[0].status === 4">
                    <div class="btnAgain"
                         :class="{ 'is-loading': addOrderLoading, 'is-disabled': addOrderLoading }"
                         @click="addOrderAgain">
                        {{ addOrderLoading ? '处理中...' : '再来一单' }}
                    </div>
                </div>
            </div>
            <!-- 修改点：退出登录按钮级loading -->
            <div class="quitLogin"
                 :class="{ 'is-loading': logoutLoading }"
                 @click="toPageLogin">
                {{ logoutLoading ? '退出中...' : '退出登录' }}
            </div>
        </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../backend/plugins/vue/vue.js"></script>
    <!-- 引入vant组件 -->
    <script src="./../js/vant.min.js"></script>    
    <!--不同屏幕尺寸根字体设置-->
    <script src="./../js/base.js"></script>
    <!-- 引入axios -->
    <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="./../js/request.js"></script>
        <script src="./../api/main.js"></script>
        <script src="./../js/common.js"></script>
        <script src="./../api/order.js"></script>
        <script src="./../api/login.js"></script>
    <script>
        new Vue({
            el:"#user",
            data(){
                return {
                    userPhone: '',
                    // 修改点：新增用户真实信息字段
                    userName: '',
                    userAvatar: '',
                    userGender: undefined, // 0=男, 1=女, undefined=未知
                    // 修改点：分离loading状态：页面/再来一单/退出登录
                    pageLoading: false,
                    addOrderLoading: false,
                    logoutLoading: false,
                    order:[{
                        orderTime:'',
                        status:undefined,
                        orderDetails:[{
                            name:'',
                            number:undefined,
                        }],
                        amount:undefined,
                        sumNum:0,
                    }],
                }
            },
            computed:{
                // 修改点：手机号脱敏显示 138****1234
                maskedPhone(){
                    const phone = this.userPhone
                    if(!phone || phone.length < 7) return phone || ''
                    return phone.substring(0, 3) + '****' + phone.substring(phone.length - 4)
                }
            },
            created(){
                this.userPhone = sessionStorage.getItem("userPhone") || ''
                this.loadData()
            },
            mounted(){},
            methods:{
                async loadData(){
                    this.pageLoading = true
                    try {
                        await Promise.all([
                            this.fetchUserInfo(),
                            this.getLatestOrder()
                        ])
                    } finally {
                        this.pageLoading = false
                    }
                },
                async fetchUserInfo(){
                    try {
                        const res = await getUserInfoApi()
                        if(res.code === 1 && res.data){
                            this.userName = res.data.name || ''
                            this.userAvatar = res.data.avatar || ''
                            this.userPhone = res.data.phone || this.userPhone
                            this.userGender = res.data.sex !== undefined ? res.data.sex : undefined
                            // 修改点：同步最新数据到sessionStorage
                            sessionStorage.setItem("userName", this.userName)
                            sessionStorage.setItem("userAvatar", this.userAvatar)
                            sessionStorage.setItem("userPhone", this.userPhone)
                        }
                    } catch(e) {
                        // 修改点：静默处理
                    }
                },
                goBack(){
                    history.go(-1)
                },
                getStatus(status){
                    return getStatus(status)
                },
                toAddressPage(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/address.html'
                    })  
                },
                toOrderPage(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/order.html'
                    })
                },
                toEvaluationPage(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/my-evaluations.html'
                    })
                },
                toMessagePage(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/message.html'
                    })
                },
                async getLatestOrder(){
                    const params = {
                        page:1,
                        pageSize:1
                    }
                    const res = await orderPagingApi(params)
                    if(res.code === 1){
                        this.order = res.data.records
                        if(this.order && this.order.length > 0 && this.order[0].orderDetails){
                            let number = 0
                            this.order[0].orderDetails.forEach(item=>{
                                number += item.number
                            })
                            this.order[0].sumNum = number
                        }
                    }else{
                        vant.Toast.fail(res.msg || '加载订单失败');
                    }
                },
                // 修改点：独立loading，不阻塞其他按钮
                async addOrderAgain(){
                    if(this.addOrderLoading) return;
                    this.addOrderLoading = true
                    try {
                        const res = await orderAgainApi({id:this.order[0].id})
                        if(res.code === 1){
                            await cartListApi({})
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/index.html'
                            })
                        }else{
                            vant.Toast.fail(res.msg || '再来一单失败');
                            this.addOrderLoading = false
                        }
                    } catch(e) {
                        this.addOrderLoading = false
                    }
                },
                // 修改点：独立loading，退出登录用Vant Dialog二次确认
                async toPageLogin(){
                    if(this.logoutLoading) return;
                    // 修改点：使用 Vant Dialog 二次确认
                    vant.Dialog.confirm({
                        title: '确认退出',
                        message: '退出登录后需要重新登录，确认退出吗？',
                        confirmButtonText: '确认退出',
                        confirmButtonColor: '#e94e3c',
                        cancelButtonText: '取消'
                    }).then(() => {
                        this.doLogout()
                    }).catch(() => {})
                },
                async doLogout(){
                    this.logoutLoading = true
                    try {
                        const res = await loginoutApi()
                        if(res.code === 1){
                            sessionStorage.removeItem("userPhone")
                            sessionStorage.removeItem("userId")
                            sessionStorage.removeItem("userName")
                            sessionStorage.removeItem("userAvatar")
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/page/login.html'
                            }) 
                        }else{
                            vant.Toast.fail(res.msg || '退出失败');
                            this.logoutLoading = false
                        }
                    } catch(e) {
                        this.logoutLoading = false
                    }
                }
            }
        })
    </script>
</body>
</html>
