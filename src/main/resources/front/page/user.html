<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>个人中心 - 瑞吉外卖</title>
    <link rel="icon" href="./../images/favico.ico">
    <!--element-ui的样式-->
    <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css" />
    <!-- 引入样式  -->
    <link rel="stylesheet" href="../styles/index.css" />
    <!--引入vant样式-->
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <!--本页面内容的样式-->
    <link rel="stylesheet" href="./../styles/user.css" />
</head>
<body>
    <div id="user" class="app" v-loading="loading">
        <div class="divHead">
            <div class="divTitle">
                <i class="el-icon-arrow-left" @click="goBack"></i>个人中心
            </div>
            <div class="divUser">
                <img :src="userAvatar || './../images/headPage.png'"/>
                <div class="desc">
                    <div class="divName">{{ userName || '用户' }} <img src="./../images/women.png"/></div>
                    <div class="divPhone">{{ userPhone }}</div>
                </div>
            </div>
        </div>
        <div class="divContent">
            <div class="divLinks">
                <div class="item" @click="toAddressPage">
                    <img src="./../images/locations.png"/>
                    <span>地址管理</span>
                    <i class="el-icon-arrow-right"></i>
                </div>
                <div class="divSplit"></div>
                <div class="item" @click="toOrderPage">
                    <img src="./../images/orders.png"/>
                    <span>历史订单</span>
                    <i class="el-icon-arrow-right"></i>
                </div>
            </div>
            <div class="divOrders" v-if="order[0]">
                <div class="title">最新订单</div>
                <div class="timeStatus">
                    <span>{{order[0].orderTime}}</span>
                    <span>{{getStatus(order[0].status)}}</span>
                    <!-- <span>正在派送</span> -->
                </div>
                <div class="dishList">
                    <div v-for="(item,index) in order[0].orderDetails" :key="index" class="item">
                        <span>{{item.name}}</span>
                        <span>x{{item.number}}</span>
                    </div>
                </div>
                <div class="result">
                    <span>共{{order[0].sumNum}} 件商品,实付</span>
                    <span class="price">￥{{order[0].amount}}</span>
                </div>
                <div class="btn" v-if="order[0].status === 4">
                    <div class="btnAgain" @click="addOrderAgain">再来一单</div>
                </div>
            </div>
            <div class="quitLogin" @click="toPageLogin">
                退出登录
            </div>
        </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../backend/plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../backend/plugins/element-ui/index.js"></script>
    <!-- 引入vant组件 -->
    <script src="./../js/vant.min.js"></script>    
    <!--不同屏幕尺寸根字体设置-->
    <script src="./../js/base.js"></script>
    <!-- 引入axios -->
    <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="./../js/request.js"></script>
        <script src="./../api/main.js"></script>
        <script src="./../js/common.js"></script>
        <script src="./../api/order.js"></script>
        <script src="./../api/login.js"></script>
    <script>
        new Vue({
            el:"#user",
            data(){
                return {
                    userPhone: '',
                    // 修改点：新增用户真实信息字段
                    userName: '',
                    userAvatar: '',
                    loading:false,
                    order:[{
                        orderTime:'',
                        status:undefined,
                        orderDetails:[{
                            name:'',
                            number:undefined,
                        }],
                        amount:undefined,
                        sumNum:0,
                    }],
                }
            },
            computed:{},
            created(){
                this.userPhone = sessionStorage.getItem("userPhone") || ''
                // 修改点：同时加载用户信息和最新订单
                this.loadData()
            },
            mounted(){},
            methods:{
                async loadData(){
                    this.loading = true
                    try {
                        await Promise.all([
                            this.fetchUserInfo(),
                            this.getLatestOrder()
                        ])
                    } finally {
                        this.loading = false
                    }
                },
                // 修改点：从后端获取真实用户信息
                async fetchUserInfo(){
                    try {
                        const res = await getUserInfoApi()
                        if(res.code === 1 && res.data){
                            this.userName = res.data.name || ''
                            this.userAvatar = res.data.avatar || ''
                            this.userPhone = res.data.phone || this.userPhone
                        }
                    } catch(e) {
                        // 修改点：静默处理，用户信息获取失败不影响页面
                    }
                },
                goBack(){
                    history.go(-1)
                },
                getStatus(status){
                    return getStatus(status)
                },
                toAddressPage(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/address.html'
                    })  
                },
                toOrderPage(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/order.html'
                    }) 
                },
                async getLatestOrder(){
                    const params = {
                        page:1,
                        pageSize:1
                    }
                    const res = await orderPagingApi(params)
                    if(res.code === 1){
                        this.order = res.data.records
                        if(this.order && this.order.length > 0 && this.order[0].orderDetails){
                            let number = 0
                            this.order[0].orderDetails.forEach(item=>{
                                number += item.number
                            })
                            this.order[0].sumNum = number
                        }
                    }else{
                        this.$notify({ type:'warning', message:res.msg});
                    }
                },
                async addOrderAgain(){
                    if(this.loading) return;
                    this.loading = true
                    try {
                        const res = await orderAgainApi({id:this.order[0].id})
                        if(res.code === 1){
                            // 修改点：先刷新购物车数据，确保首页立即显示正确数量
                            await cartListApi({})
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/index.html'
                            })
                        }else{
                            this.$notify({ type:'warning', message:res.msg});
                        }
                    } finally {
                        this.loading = false
                    }
                },
                async toPageLogin(){
                    // 修改点：防重复点击
                    if(this.loading) return;
                    this.loading = true
                    try {
                        const res = await loginoutApi()
                        if(res.code === 1){
                            // 修改点：清除所有登录态信息
                            sessionStorage.removeItem("userPhone")
                            sessionStorage.removeItem("userId")
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/page/login.html'
                            }) 
                        }else{
                            this.$notify({ type:'warning', message:res.msg});
                        }
                    } finally {
                        this.loading = false
                    }
                }
            }
        })
    </script>
</body>
</html>
