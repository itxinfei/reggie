<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>网络异常 - 瑞吉外卖</title>
        <link rel="icon" href="./../images/favico.ico">
        <!--不同屏幕尺寸根字体设置-->
        <script src="./../js/base.js?v=20260917"></script>
        <!-- 引入样式  -->
        <link rel="stylesheet" href="../styles/index.css?v=20260924" />
        <link rel="stylesheet" href="../styles/skeleton.css?v=20260922" />
        <!-- 修改点：补充加载 remixicon（no_wifi.png 位图 → ri-wifi-off-line 图标，随主题缩放不失真） -->
        <link rel="stylesheet" href="../../backend/plugins/remixicon/remixicon.css" />
        <script src="../js/icon-fallback.js?v=20260917"></script>
        <!--本页面内容的样式-->
        <link rel="stylesheet" href="./../styles/no-wifi.css?v=20260921" />
    </head>
    <body>
        <div id="no_wifi" class="app">
            <div class="divHead">
                <div class="divTitle">
                    <i class="ri-arrow-left-s-line" role="button" tabindex="0" aria-label="返回" @click="goBack" @keydown.enter="goBack"></i>网络异常
                </div>
            </div>
            <div class="divContent">
                <i class="ri-wifi-off-line wifi-icon" aria-hidden="true"></i>
                <div class="divDesc">网络连接异常</div>
                <!-- 修改点(2026-09-18)：副文案随探活状态切换；原 reload 静态页即使网络恢复也仍停在本页 -->
                <div class="divSub">{{ checking ? '正在检测网络…' : (netError ? '网络仍不可用，请检查网络后重试' : '点击重新检测，网络恢复后自动返回') }}</div>
                <div class="btnRefresh" :class="{btnDisabled:checking}" @click="toPagePrev">{{ checking ? '检测中…' : '重新检测' }}</div>
                <div class="btnHome" @click="goHome">回到首页</div>
            </div>
        </div>
            <!-- 开发环境版本，包含了有帮助的命令行警告 -->
            <script src="../../backend/plugins/vue/vue.js"></script>
            <!-- 引入axios -->
            <script src="../../backend/plugins/axios/axios.min.js"></script>
            <script src="./../js/request.js?v=20260917"></script>
            <script>
            new Vue({
                el:"#no_wifi",
                data(){
                    return {
                        // 修改点(2026-09-18)：探活状态。原 location.reload() 只重载本静态页，
                        // 不发起任何业务请求，网络恢复后用户仍被困在断网页。
                        checking: false,
                        netError: false
                    }
                },
                computed:{},
                methods:{
                    goBack(){
                        this.backOrHome()
                    },
                    // 有历史返回来源页，无历史（深链接直接进入）兜底回首页
                    backOrHome(){
                        if(history.length > 1){ history.go(-1) } else { this.goHome() }
                    },
                    goHome(){
                        location.href = '/front/index.html'
                    },
                    // 用原生 XHR 探活免登录的字典端点（绕开 request 拦截器，避免失败时再次跳本页/弹通知）。
                    // 只要拿到任意 HTTP 状态码（200/401 等）即说明网络与后端已恢复；断网时 status=0 或 onerror/超时。
                    toPagePrev(){
                        if(this.checking) return
                        var self = this
                        this.checking = true
                        this.netError = false
                        var finished = false
                        var xhr = new XMLHttpRequest()
                        function finish(ok){
                            if(finished) return
                            finished = true
                            self.checking = false
                            if(ok){ self.backOrHome() } else { self.netError = true }
                        }
                        xhr.open('GET', '/api/meta/enums?t=' + Date.now(), true)
                        xhr.timeout = 5000
                        xhr.onreadystatechange = function(){
                            if(xhr.readyState === 4){ finish(xhr.status !== 0) }
                        }
                        xhr.ontimeout = function(){ finish(false) }
                        xhr.onerror = function(){ finish(false) }
                        xhr.send()
                    }
                }
            })
            </script>
    </body>
</html>
