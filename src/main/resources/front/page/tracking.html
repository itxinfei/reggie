<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>配送追踪 - 瑞吉外卖</title>
    <link rel="icon" href="./../images/favico.ico">
    <script src="./../js/base.js"></script>
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <link rel="stylesheet" href="../styles/remixicon-fallback.css" />
    <style>
        .tracking-container {
            height: calc(100vh - var(--header-height));
            overflow-y: auto;
            background: var(--bg-page);
        }

        /* 订单信息卡片 */
        .order-info-card {
            margin: 10rem 12rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14rem var(--spacing-md);
            box-shadow: var(--shadow-card);
        }
        .order-info-card .info-row {
            display: flex;
            align-items: center;
            gap: 8rem;
            font-size: var(--font-size-md);
            color: var(--color-text-secondary);
            line-height: 22rem;
        }
        .order-info-card .info-row .ri-map-pin-line {
            color: var(--color-primary-dark);
            font-size: 16rem;
            flex-shrink: 0;
        }
        .order-info-card .dish-summary {
            margin-top: 10rem;
            padding-top: 10rem;
            border-top: 1px solid var(--bg-hover);
            font-size: var(--font-size-md);
            color: var(--color-text-secondary);
            line-height: 22rem;
        }

        /* 配送状态卡片 */
        .status-card {
            margin: 0 12rem 10rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 18rem var(--spacing-md);
            box-shadow: var(--shadow-card);
            text-align: center;
        }
        .status-card .status-icon {
            width: 56rem;
            height: 56rem;
            border-radius: 50%;
            background: var(--color-primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10rem;
        }
        .status-card .status-icon i {
            font-size: 28rem;
            color: var(--color-text-primary);
        }
        .status-card .status-text {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            line-height: 26rem;
        }
        .status-card .status-desc {
            font-size: var(--font-size-sm);
            color: var(--color-text-hint);
            line-height: 20rem;
            margin-top: 4rem;
        }

        /* 时间线 */
        .timeline-card {
            margin: 0 12rem 10rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16rem var(--spacing-md);
            box-shadow: var(--shadow-card);
        }
        .timeline-card .section-title {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--color-text-primary);
            line-height: 22rem;
            margin-bottom: 14rem;
        }
        .timeline-item {
            display: flex;
            position: relative;
            padding-bottom: 18rem;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        .timeline-dot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 24rem;
            flex-shrink: 0;
        }
        .timeline-dot {
            width: 12rem;
            height: 12rem;
            border-radius: 50%;
            background: var(--bg-hover);
            flex-shrink: 0;
            z-index: 1;
            transition: all var(--transition-fast);
        }
        /* 已完成步骤：金色圆点 */
        .timeline-item.done .timeline-dot {
            background: var(--color-primary);
        }
        /* 修改点：配送中当前步骤 → 金色圆点放大 + 柔和光环，与已完成 done 区分 */
        .timeline-item.active .timeline-dot {
            width: 14rem;
            height: 14rem;
            background: var(--color-primary);
            box-shadow: 0 0 0 4rem var(--color-primary-tint);
        }
        .timeline-line {
            width: 2rem;
            flex: 1;
            background: var(--bg-hover);
            margin-top: 4rem;
        }
        /* 修改点：仅已完成步骤的连接线为金色；active 步骤下方连接的是未完成步骤，保持灰色 */
        .timeline-item.done .timeline-line {
            background: var(--color-primary);
        }
        .timeline-item:last-child .timeline-line {
            display: none;
        }
        .timeline-content {
            flex: 1;
            padding-left: 10rem;
            padding-top: 0;
        }
        .timeline-title {
            font-size: var(--font-size-md);
            color: var(--color-text-secondary);
            line-height: 20rem;
        }
        /* 未开始步骤：弱化为提示灰 */
        .timeline-item:not(.done):not(.active) .timeline-title {
            color: var(--color-text-hint);
        }
        /* 修改点：配送中当前步骤标题用深色加粗（金色由圆点表达，白底金字对比度不足，改深色保证可读性） */
        .timeline-item.active .timeline-title {
            color: var(--color-text-primary);
            font-weight: 600;
        }
        .timeline-time {
            font-size: var(--font-size-sm);
            color: var(--color-text-hint);
            line-height: 18rem;
            margin-top: 2rem;
        }

        /* 骑手信息卡片 */
        .rider-card {
            margin: 0 12rem 10rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14rem var(--spacing-md);
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 12rem;
        }
        .rider-avatar {
            width: 48rem;
            height: 48rem;
            border-radius: 50%;
            background: var(--color-primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .rider-avatar i {
            font-size: 24rem;
            color: var(--color-text-primary);
        }
        .rider-info {
            flex: 1;
        }
        .rider-name {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--color-text-primary);
            line-height: 22rem;
        }
        .rider-status-text {
            font-size: var(--font-size-sm);
            color: var(--color-text-hint);
            line-height: 20rem;
            margin-top: 2rem;
        }
        .rider-actions {
            display: flex;
            gap: 10rem;
        }
        .rider-action-btn {
            width: 40rem;
            height: 40rem;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        .rider-action-btn:active {
            background: var(--bg-hover);
        }
        .rider-action-btn i {
            font-size: 18rem;
            color: var(--color-text-primary);
        }

        /* 平台信息 */
        .platform-card {
            margin: 0 12rem 10rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 12rem var(--spacing-md);
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 8rem;
            font-size: var(--font-size-sm);
            color: var(--color-text-hint);
        }
        .platform-tag {
            display: inline-block;
            padding: 2rem 10rem;
            border-radius: 4rem;
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--color-text-white);
        }
        .platform-tag.meituan {
            background: var(--platform-meituan);
        }
        .platform-tag.eleme {
            background: var(--platform-eleme);
        }
        .platform-tag.douyin {
            background: var(--platform-douyin);
        }

        /* 底部操作 */
        .bottom-actions {
            padding: 10rem 12rem;
            display: flex;
            gap: 10rem;
        }
        .bottom-actions .van-button {
            flex: 1;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60rem 0;
            color: var(--color-text-hint);
        }
        .empty-state i {
            font-size: 60rem;
            color: var(--color-text-disabled);
        }
        .empty-state p {
            margin-top: 12rem;
            font-size: var(--font-size-md);
        }
    </style>
</head>
<body>
    <div id="tracking" class="app">
        <div v-if="pageLoading" class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>

        <div class="divHead">
            <div class="divTitle">
                <i class="icon-back-arrow" @click="goBack"></i>配送追踪
            </div>
        </div>

        <div class="tracking-container" v-if="trackingData">
            <!-- 订单信息 -->
            <div class="order-info-card" v-if="trackingData">
                <div class="info-row">
                    <i class="ri-map-pin-line"></i>
                    <span>{{ trackingData.address || trackingData.userName }}</span>
                </div>
                <div class="dish-summary" v-if="trackingData.dishSummary">
                    {{ trackingData.dishSummary }}
                </div>
            </div>

            <!-- 平台标签 -->
            <div class="platform-card" v-if="trackingData && trackingData.platform">
                <span>配送平台：</span>
                <span class="platform-tag" :class="platformClass">{{ platformName }}</span>
                <span style="margin-left:auto;">{{ trackingData.platformOrderId }}</span>
            </div>

            <!-- 当前状态 -->
            <div class="status-card">
                <div class="status-icon">
                    <i :class="statusIcon"></i>
                </div>
                <div class="status-text">{{ statusText }}</div>
                <div class="status-desc">{{ statusDesc }}</div>
            </div>

            <!-- 配送时间线 -->
            <div class="timeline-card">
                <div class="section-title">配送进度</div>
                <div class="timeline-item"
                     v-for="(step, idx) in timelineSteps"
                     :key="step.status"
                     :class="[getStepClass(step.status), step.status === currentStatus ? 'active' : '']">
                    <div class="timeline-dot-wrap">
                        <div class="timeline-dot"></div>
                        <div class="timeline-line"></div>
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-title">{{ step.label }}</div>
                        <div class="timeline-time" v-if="isStepDone(step.status)">{{ updateTimeText }}</div>
                    </div>
                </div>
            </div>

            <!-- 骑手信息（仅存在真实骑手数据时展示，避免以顾客信息冒充骑手） -->
            <div class="rider-card" v-if="isDelivering && hasRiderInfo">
                <div class="rider-avatar">
                    <i class="ri-user-line"></i>
                </div>
                <div class="rider-info">
                    <div class="rider-name">{{ trackingData.riderName || '配送骑手' }}</div>
                    <div class="rider-status-text">{{ statusText }}</div>
                </div>
                <div class="rider-actions">
                    <div class="rider-action-btn" @click="callRider">
                        <i class="ri-phone-line"></i>
                    </div>
                </div>
            </div>

            <!-- 底部操作 -->
            <div class="bottom-actions" v-if="trackingData">
                <van-button
                    v-if="isDelivering && hasRiderInfo"
                    type="primary"
                    block
                    round
                    @click="callRider"
                >
                    <i class="ri-phone-line" style="margin-right:4rem;"></i>联系骑手
                </van-button>
                <van-button
                    v-else-if="isFinalStatus"
                    type="default"
                    block
                    round
                    @click="goToOrders"
                >
                    查看订单
                </van-button>
            </div>
        </div>

        <!-- 空状态 / 加载失败 -->
        <div class="empty-state" v-else-if="!pageLoading && !trackingData">
            <i class="ri-map-pin-time-line"></i>
            <p>暂无配送信息</p>
        </div>
    </div>

    <script src="../../backend/plugins/vue/vue.js"></script>
    <script src="./../js/vant.min.js"></script>
    <script src="../../backend/plugins/axios/axios.min.js"></script>
    <script src="./../js/request.js"></script>
    <script src="./../api/tracking.js"></script>
    <script>
        new Vue({
            el: '#tracking',
            data() {
                return {
                    pageLoading: false,
                    trackingData: null,
                    orderId: null
                };
            },
            computed: {
                platformName() {
                    if (!this.trackingData || !this.trackingData.platform) return '';
                    const map = { MEITUAN: '美团', ELEME: '饿了么', DOUYIN: '抖音' };
                    return map[this.trackingData.platform] || this.trackingData.platform;
                },
                platformClass() {
                    if (!this.trackingData || !this.trackingData.platform) return '';
                    const map = { MEITUAN: 'meituan', ELEME: 'eleme', DOUYIN: 'douyin' };
                    return map[this.trackingData.platform] || '';
                },
                statusText() {
                    if (!this.trackingData) return '';
                    const map = {
                        PENDING: '待接单',
                        ACCEPTED: '已接单',
                        PICKING: '取餐中',
                        DELIVERING: '配送中',
                        DELIVERED: '已送达',
                        CANCELLED: '已取消'
                    };
                    return map[this.trackingData.status] || '未知状态';
                },
                statusDesc() {
                    if (!this.trackingData) return '';
                    const map = {
                        PENDING: '商家正在确认订单',
                        ACCEPTED: '商家已接单，正在准备',
                        PICKING: '骑手正在取餐',
                        DELIVERING: '骑手正在配送',
                        DELIVERED: '订单已送达',
                        CANCELLED: '订单已取消'
                    };
                    return map[this.trackingData.status] || '';
                },
                statusIcon() {
                    if (!this.trackingData) return 'ri-map-pin-line';
                    const map = {
                        PENDING: 'ri-time-line',
                        ACCEPTED: 'ri-restaurant-line',
                        PICKING: 'ri-store-2-line',
                        DELIVERING: 'ri-motorbike-line',
                        DELIVERED: 'ri-check-line',
                        CANCELLED: 'ri-close-line'
                    };
                    return map[this.trackingData.status] || 'ri-map-pin-line';
                },
                timelineSteps() {
                    return [
                        { status: 'PENDING', label: '订单提交' },
                        { status: 'ACCEPTED', label: '商家已接单' },
                        { status: 'PICKING', label: '骑手取餐中' },
                        { status: 'DELIVERING', label: '骑手配送中' },
                        { status: 'DELIVERED', label: '已送达' }
                    ];
                },
                updateTimeText() {
                    if (!this.trackingData || !this.trackingData.updateTime) return '';
                    // 修改点：兼容"yyyy-MM-dd HH:mm:ss"空格分隔格式。
                    // iOS Safari 等把空格分隔字符串 new Date 解析为 Invalid Date，此前渲染出 "NaN:NaN"
                    // 注意：只能替换日期连字符 /-/，时间段的冒号必须保留（替换成斜杠会导致 Invalid Date）
                    const raw = String(this.trackingData.updateTime).replace(/-/g, '/');
                    const d = new Date(raw);
                    if (isNaN(d.getTime())) return '';
                    const pad = (n) => String(n).padStart(2, '0');
                    return pad(d.getHours()) + ':' + pad(d.getMinutes());
                },
                // 当前配送状态（供时间线区分 active 当前步骤）
                currentStatus() {
                    if (!this.trackingData) return '';
                    return this.trackingData.status || '';
                },
                hasRiderInfo() {
                    if (!this.trackingData) return false;
                    return !!(this.trackingData.riderName || this.trackingData.riderPhone);
                },
                isDelivering() {
                    if (!this.trackingData) return false;
                    return ['PENDING', 'ACCEPTED', 'PICKING', 'DELIVERING']
                        .includes(this.trackingData.status);
                },
                isFinalStatus() {
                    if (!this.trackingData) return false;
                    return ['DELIVERED', 'CANCELLED'].includes(this.trackingData.status);
                }
            },
            created() {
                this.orderId = this.getUrlParam('orderId');
                if (this.orderId) {
                    this.loadTracking();
                } else {
                    vant.Toast.fail('缺少订单信息');
                }
            },
            methods: {
                goBack() {
                    window.requestAnimationFrame(() => {
                        window.history.go(-1);
                    });
                },
                getUrlParam(name) {
                    const reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
                    const r = window.location.search.substr(1).match(reg);
                    if (r != null) return decodeURIComponent(r[2]);
                    return null;
                },
                async loadTracking() {
                    this.pageLoading = true;
                    try {
                        const res = await queryDeliveryTracking(this.orderId);
                        if (res.code === 1) {
                            this.trackingData = res.data;
                        } else {
                            vant.Toast.fail(res.msg || '加载配送信息失败');
                        }
                    } catch (e) {
                        vant.Toast.fail('网络异常，请稍后重试');
                    } finally {
                        this.pageLoading = false;
                    }
                },
                getStepClass(stepStatus) {
                    if (!this.trackingData || !this.trackingData.status) return '';
                    const order = ['PENDING', 'ACCEPTED', 'PICKING', 'DELIVERING', 'DELIVERED'];
                    const curIdx = order.indexOf(this.trackingData.status);
                    const stepIdx = order.indexOf(stepStatus);
                    if (curIdx < 0 || stepIdx < 0) return '';
                    if (stepIdx <= curIdx) {
                        // 已送达（终态）时让时间线全部置灰，避免误判为配送中
                        return 'done';
                    }
                    return '';
                },
                isStepDone(stepStatus) {
                    if (!this.trackingData || !this.trackingData.status) return false;
                    // 修改点：已送达/已取消（终态）视为全部步骤完成，不再用 timeline active 高亮
                    if (this.trackingData.status === 'DELIVERED' || this.trackingData.status === 'CANCELLED') {
                        return this.trackingData.status === 'DELIVERED';
                    }
                    const order = ['PENDING', 'ACCEPTED', 'PICKING', 'DELIVERING', 'DELIVERED'];
                    const curIdx = order.indexOf(this.trackingData.status);
                    const stepIdx = order.indexOf(stepStatus);
                    return curIdx >= 0 && stepIdx >= 0 && stepIdx <= curIdx;
                },
                callRider() {
                    if (this.trackingData && this.trackingData.riderPhone) {
                        window.location.href = 'tel:' + this.trackingData.riderPhone;
                    } else {
                        vant.Toast.info('暂无骑手联系方式');
                    }
                },
                goToOrders() {
                    sessionStorage.setItem('orderFromTracking', '1');
                    window.requestAnimationFrame(() => {
                        window.location.href = '/front/page/order.html';
                    });
                }
            }
        });
    </script>
</body>
</html>
