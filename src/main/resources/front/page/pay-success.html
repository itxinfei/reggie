<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
        <title>下单成功 - 瑞吉外卖</title>
        <link rel="icon" href="./../images/favico.ico">
        <!--不同屏幕尺寸根字体设置-->
        <script src="./../js/base.js"></script>
        <!-- 引入样式  -->
        <link rel="stylesheet" href="../styles/index.css" />
        <link rel="stylesheet" href="../styles/remixicon-fallback.css" />
        <!--本页面内容的样式-->
        <link rel="stylesheet" href="./../styles/pay-success.css" />
    </head>
    <body>
        <div id="pay_success" class="app">
            <div class="divHead">
                <div class="divTitle">
                    <i class="icon-back-arrow" @click="goBack"></i>
                    瑞吉外卖
                    <img src="./../images/home.png" @click="toMainPage"/>
                </div>
            </div>
            <div class="divContent">
                <img src="./../images/success.png"/>
                <div class="divSuccess">下单成功</div>
                <div class="divDesc">预计{{finishTime}}到达</div>
                <div class="divDesc1">后厨正在加紧制作中，请耐心等待~</div>
                <div class="divActions">
                    <div class="btnView" @click="toOrderPage">查看订单</div>
                    <div class="btnShare" @click="shareOrder">
                        <i class="ri-share-line"></i> 分享
                    </div>
                </div>
            </div>
        </div>
        <!-- 开发环境版本，包含了有帮助的命令行警告 -->
        <script src="../../backend/plugins/vue/vue.js"></script>
        <!-- 引入axios -->
        <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="./../js/request.js"></script>
        <script src="./../js/common.js"></script>
        <script>
        new Vue({
            el:"#pay_success",
            data(){
                return {
                    finishTime:''
                }
            },
            computed:{},
            created(){
                this.finishTime = getFinishTime()
            },
            methods:{
                goBack(){
                    window.requestAnimationFrame(()=>{
                        window.location.replace('/front/index.html')
                    })   
                },
                toOrderPage(){
                    // 修改点：设置标志位供order.html的goBack使用，替代不可靠的document.referrer
                    sessionStorage.setItem('orderFromPaySuccess', '1')
                    window.requestAnimationFrame(()=>{
                        window.location.replace('/front/page/order.html')
                    })  
                },
                toMainPage(){
                    window.requestAnimationFrame(()=>{
                        window.location.replace('/front/index.html')
                    })
                },
                shareOrder(){
                    const shareData = {
                        title: '我在瑞吉外卖下单了',
                        text: '美味生活，即刻送达！快来瑞吉外卖点餐吧～',
                        url: window.location.origin + '/front/index.html'
                    }
                    if(navigator.share){
                        navigator.share(shareData).catch(() => {})
                    } else {
                        const ta = document.createElement('textarea')
                        ta.value = shareData.url
                        document.body.appendChild(ta)
                        ta.select()
                        try {
                            document.execCommand('copy')
                            vant.Toast.success('链接已复制，快去分享吧')
                        } catch(e) {
                            vant.Toast.fail('分享失败，请手动复制链接')
                        }
                        document.body.removeChild(ta)
                    }
                }
            }
        })
        </script>
    </body>
</html>
