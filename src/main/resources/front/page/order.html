<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>历史订单 - 瑞吉外卖</title>
        <link rel="icon" href="./../images/favico.ico">
        <!--不同屏幕尺寸根字体设置-->
        <script src="./../js/base.js?v=20260917"></script>
        <!--引入vant样式-->
        <link rel="stylesheet" href="../styles/vant.min.css"/>
        <!-- 引入样式  -->
        <link rel="stylesheet" href="../styles/index.css?v=20260922" />
        <link rel="stylesheet" href="../styles/skeleton.css?v=20260922" />
        <!--本页面内容的样式-->
        <link rel="stylesheet" href="./../styles/order.css?v=20260922" />
        <!-- 全局底部 Tab 导航（点餐/订单/我的） -->
        <link rel="stylesheet" href="../styles/tabbar.css?v=20260917" />
        <!-- 修改点：加载 remixicon 图标库（复用 backend 真实字体，front/styles 下 404 占位已删） -->
        <link rel="stylesheet" href="../../backend/plugins/remixicon/remixicon.css" />
        <script src="./../js/icon-fallback.js?v=20260917"></script>
    </head>
    <body>
        <div id="order" class="app">
            <cend-shell title="历史订单" :show-back="true" :show-tabbar="true" :tab-active="activeTab">
            <!-- 修改点：美团风格状态Tab筛选栏 -->
            <div class="status-tabs">
                <div
                    v-for="tab in statusTabs"
                    :key="tab.value"
                    class="status-tab"
                    :class="{active: activeStatus === tab.value}"
                    @click="switchTab(tab.value)"
                >{{ tab.label }}</div>
            </div>
            <!-- 修改点(2026-09-17 UX)：首屏骨架屏移出列表 v-if 容器独立渲染——原放在 v-if="orderList.length > 0"
                 容器内部，首屏列表为空时整个容器不渲染，骨架屏永不出现（首屏白屏无任何反馈） -->
            <div v-if="firstLoading" class="has-tabbar" style="padding: 16rem 12rem;">
                <van-skeleton :row="5" title :avatar="true" />
            </div>
            <div class="divBody has-tabbar" v-if="!firstLoading && orderList.length > 0">
                <van-pull-refresh v-model="refreshing" @refresh="onRefresh" success-text="刷新成功">
                <van-list
                    v-model="loading"
                    :finished="finished"
                    finished-text="没有更多了"
                    @load="getList"
                    >
                    <van-cell v-for="order in orderList" :key="order.id" class="item" @click="openDetail(order)">
                        <!-- 卡片头部：订单号 + 时间 + 状态 -->
                        <div class="order-header">
                            <div class="order-meta">
                                <span class="order-no">订单号 {{order.number || order.id}}</span>
                                <span class="order-time">{{order.orderTime}}</span>
                            </div>
                            <span class="order-status" :class="getStatusClass(order.status)">{{getStatus(order.status)}}</span>
                        </div>
                        <!-- 配送中/待接单：迷你进度条 -->
                        <div class="order-progress" v-if="order.status === 2 || order.status === 3">
                            <div class="progress-step" :class="{done: order.status >= 2, active: order.status === 2}">已接单</div>
                            <div class="progress-line" :class="{done: order.status >= 3}"></div>
                            <div class="progress-step" :class="{done: order.status >= 3, active: order.status === 3}">配送中</div>
                            <div class="progress-line"></div>
                            <div class="progress-step">已送达</div>
                        </div>
                        <!-- 菜品列表：左侧缩略图 + 名称数量 + 右侧价格 -->
                        <div class="dish-list">
                            <div v-for="(item,dIdx) in (order.orderDetails || []).slice(0,3)" :key="dIdx" class="dish-item">
                                <img v-if="item.image || item.dishImage" :src="imgPath(item.image || item.dishImage)" loading="lazy" class="dish-img" :alt="item.name || '菜品图片'" @error="$event.target.src='./../images/noImg.png'"/>
                                <div v-else class="dish-img dish-img-placeholder"><i class="ri-restaurant-line"></i></div>
                                <div class="dish-info">
                                    <span class="dish-name">{{item.name}}</span>
                                    <span class="dish-qty">x{{item.number}}</span>
                                </div>
                                <span class="dish-price">￥{{Number(item.amount || 0).toFixed(2)}}</span>
                            </div>
                            <div v-if="(order.orderDetails || []).length > 3" class="dish-more">
                                等共{{order.orderDetails.length}}件商品
                            </div>
                        </div>
                        <!-- 合计行 -->
                        <div class="order-total">
                            <span>共{{order.sumNum}}件  实付</span>
                            <span class="price">￥{{ Number(order.amount || 0).toFixed(2) }}</span>
                        </div>
                        <!-- 操作按钮：对齐美团——主按钮2个 + 更多菜单 -->
                        <div class="order-actions" @click.stop>
                            <!-- 待付款 -->
                            <template v-if="order.status === 1">
                                <div class="act-btn act-outline" @click="cancelOrder(order)">取消订单</div>
                                <div class="act-btn act-primary" @click="goToPay(order)">去支付</div>
                            </template>
                            <!-- 待接单 -->
                            <template v-if="order.status === 2">
                                <div class="act-btn act-outline" @click="urgeOrder(order)">催单</div>
                                <div class="act-btn act-outline" v-if="order.platformOrderId" @click="viewTracking(order)">查看配送</div>
                            </template>
                            <!-- 配送中 -->
                            <template v-if="order.status === 3">
                                <div class="act-btn act-outline" @click="urgeOrder(order)">催单</div>
                                <div class="act-btn act-outline" v-if="order.platformOrderId" @click="viewTracking(order)">查看配送</div>
                                <div class="act-btn act-primary" @click="confirmReceipt(order)">确认收货</div>
                            </template>
                            <!-- 已完成 -->
                            <template v-if="order.status === 4">
                                <div class="act-btn act-outline" @click="applyRefund(order)">申请售后</div>
                                <div class="act-btn act-outline" @click="evaluateOrder(order)">去评价</div>
                                <div class="act-btn act-primary" @click="addOrderAgain(order)">再来一单</div>
                            </template>
                            <!-- 已取消/已退款 -->
                            <template v-if="order.status === 5 || order.status === 6">
                                <div class="act-btn act-outline" @click="addOrderAgain(order)">再来一单</div>
                            </template>
                        </div>
                    </van-cell>
                </van-list>
                </van-pull-refresh>
            </div>
            <!-- 修改点(2026-09-22)：空态改用 cend-empty 组件，统一文字+图标风格 -->
            <cend-empty
                v-else-if="!firstLoading"
                icon="ri-file-list-3-line"
                text="暂无订单"
                action-text="去逛逛"
                @action="goHome">
            </cend-empty>
            </cend-shell>
        </div>
        <!-- 开发环境版本，包含了有帮助的命令行警告 -->
        <script src="../../backend/plugins/vue/vue.js"></script>
        <!-- 引入vant组件 -->
        <script src="./../js/vant.min.js"></script>    
        <!-- 引入axios -->
        <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="./../js/request.js?v=20260917"></script>
        <script src="./../api/main.js?v=20260917"></script>
        <script src="./../js/common.js?v=20260917"></script>
        <script src="./../api/order.js?v=20260917"></script>
        <!-- C 端跨页面复用组件（必须在 new Vue 之前加载） -->
        <script src="./../js/components-cend.js?v=20260922"></script>
        <script>
        new Vue({
            el:"#order",
            data(){
                return {
                    paging:{
                        page:1,
                        pageSize:5
                    },
                    orderList:[],
                    loading:false,
                    finished:false,
                    refreshing:false, // 修改点：下拉刷新状态
                    firstLoading:true, // 修改点：首屏加载骨架屏
                    submitting:false, // 修改点：再来一单防重复提交
                    // 修改点：状态筛选
                    activeStatus: null, // null表示全部
                    // 修改点（重要 Bug 修复）：原「待派送=3、配送中=2」与后端 OrderStatus 完全相反
                    // （后端 2=待接单、3=配送中），导致点"待派送"筛出的实际是配送中订单。
                    // 现严格对齐后端：1=待付款 2=待接单 3=配送中 4=已完成 5=已取消 6=已退款
                    statusTabs: [
                        { label: '全部', value: null },
                        { label: '待付款', value: 1 },
                        { label: '待接单', value: 2 },
                        { label: '配送中', value: 3 },
                        { label: '已完成', value: 4 },
                        { label: '已取消', value: 5 },
                        { label: '已退款', value: 6 }
                    ],
                    // 修改点：底部 Tab 导航当前项（0=点餐 1=订单 2=我的）
                    activeTab: 1
                }
            },
            computed:{},
            created(){
                // 修改点：先加载后端枚举字典，使列表状态文案与后端保持一致
                // （字典加载失败时 getStatus 自动回退到 common.js 的兜底常量）
                var self = this
                if (typeof loadEnums === 'function') {
                    loadEnums(function(){ self.initData() })
                } else {
                    this.initData()
                }
            },
            mounted(){
                // 修改点(2026-09-17)：状态Tab滚动粘滞阴影
                var self = this
                this.$nextTick(function(){
                    var tabs = document.querySelector('#order .status-tabs')
                    var body = document.querySelector('#order .divBody')
                    if (tabs && body) {
                        body.addEventListener('scroll', function(){
                            if (body.scrollTop > 5) {
                                tabs.classList.add('is-scrolled')
                            } else {
                                tabs.classList.remove('is-scrolled')
                            }
                        }, { passive: true })
                    }
                })
            },
            methods:{
                // 修改点(2026-09-22)：goBack 已统一由 cend-shell 组件处理，页面不再重复定义
                goHome(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/index.html'
                    })
                },
                // 修改点(P2-1)：图片裸文件名需经 /common/download 访问，修历史订单缩略图 404
                imgPath(path){
                    if(!path) return ''
                    if(path.indexOf('http://') === 0 || path.indexOf('https://') === 0) return path
                    if(path.indexOf('/common/download') === 0) return path
                    return '/common/download?name=' + path
                },
                // 修改点(2026-09-22)：底部 Tab 切换已统一由 cend-shell 组件处理，页面不再重复定义
                initData(){
                    this.getList()
                },
                // 修改点：下拉刷新处理（await getList 后复位，避免固定延时与实际加载不同步）
                async onRefresh(){
                    this.paging.page = 1;
                    this.orderList = [];
                    this.finished = false;
                    try {
                        await this.getList()
                    } finally {
                        this.refreshing = false
                    }
                },
                // 修改点：切换Tab时重置分页并重新加载
                switchTab(status){
                    if(this.activeStatus === status) return;
                    this.activeStatus = status;
                    this.paging.page = 1;
                    this.orderList = [];
                    this.finished = false;
                    this.loading = true;
                    this.getList();
                },
                async getList(){
                    if(this.finished){
                        this.loading = false;
                        return
                    }
                    // 修改点：仅在有状态筛选时传递status参数
                    const params = { ...this.paging }
                    if(this.activeStatus !== null){
                        params.status = this.activeStatus
                    }
                    try {
                        const res = await orderPagingApi(params)
                        if(res.code === 1){
                            // 第一页时重置列表，防止重复累加
                            if(this.paging.page === 1){
                                this.orderList = []
                            }
                            let records = res.data.records
                            if(records && Array.isArray(records)){
                                records.forEach(item=>{
                                    let number = 0
                                    // 修改点：订单详情为 null/非数组时跳过，防止页面渲染时报错
                                    if(item.orderDetails && Array.isArray(item.orderDetails)){
                                        item.orderDetails.forEach(ele=>{
                                            number += ele.number
                                        })
                                    }
                                    item.sumNum = number
                                })
                                this.orderList.push(...records)
                            }
                            // 修改点(2026-09-15)：原 finished 判断依赖 res.data.pages，若后端未返回 pages（undefined）
                            // 则 finished 永远为 false → van-list 反复触发 @load → 同批订单被重复 push（主键重复 + 控制台告警）。
                            // 改为：本页无数据 或 页数耗尽即结束；pages 缺失时按「本页无数据」兜底，避免无限加载
                            var finishedPages = (typeof res.data.pages === 'number') ? res.data.pages : 1
                            if(records.length === 0 || this.paging.page >= finishedPages){
                                this.finished = true;
                            }
                            this.paging.page = this.paging.page + 1
                        }else{
                            vant.Toast.fail(res.msg || '加载订单失败');
                        }
                    } catch (err) {
                        // 异常兜底：网络错误/接口异常时给出提示，loading 由 finally 复位，避免永卡加载
                        console.error('加载订单列表失败:', err)
                        vant.Toast.fail('加载订单失败，请稍后重试');
                    } finally {
                        this.loading = false;
                        this.firstLoading = false;
                    }
                },
                getStatus(status){
                    return getStatus(status)
                },
                getStatusClass(status){
                    // 修改点(2026-09-14)：6 类状态各归各位（原 1/2 同为 pending、6 误归 cancel）
                    // 7已分账与4已完成同为成功终态，共用 completed 样式
                    var map = {1:'status-pending',2:'status-accepted',3:'status-shipped',4:'status-completed',5:'status-cancelled',6:'status-refunding',7:'status-completed'};
                    return map[status] || '';
                },
                async addOrderAgain(order){
                    if(this.submitting) return;
                    this.submitting = true
                    try {
                        const res = await orderAgainApi({id:order.id})
                        if(res.code === 1){
                            // 修改点：先刷新购物车数据，确保首页立即显示正确数量
                            await cartListApi({})
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/index.html'
                            })
                        }else{
                            vant.Toast.fail(res.msg || '再来一单失败');
                        }
                    } catch (e) {
                        console.error('再来一单失败:', e);
                        vant.Toast.fail('网络异常，请稍后重试');
                    } finally {
                        this.submitting = false
                    }
                },
                // 修改点：分享订单
                shareOrder(order){
                    const shareData = {
                        title: '我在瑞吉外卖的订单',
                        text: '我在瑞吉外卖点了一单，你也来试试吧！',
                        url: window.location.origin + '/front/index.html'
                    }
                    if(navigator.share){
                        navigator.share(shareData).catch((e) => { console.warn('[order.html] 分享订单失败:', e) })
                    } else {
                        const ta = document.createElement('textarea')
                        ta.value = shareData.url
                        document.body.appendChild(ta)
                        ta.select()
                        try {
                            document.execCommand('copy')
                            vant.Toast.success('链接已复制')
                        } catch(e) {
                            vant.Toast.fail('分享失败')
                        }
                        document.body.removeChild(ta)
                    }
                },
                // 修改点：点击订单卡进入订单详情页（完整明细、开票、评价等均在详情页）
                openDetail(order){
                    if(order && order.id){
                        window.requestAnimationFrame(()=>{
                            window.location.href = '/front/page/order-detail.html?id=' + order.id
                        })
                    }
                },
                // 修改点：评价订单
                evaluateOrder(order){
                    if(order && order.id){
                        window.requestAnimationFrame(()=>{
                            window.location.href = '/front/page/my-evaluations.html?orderId=' + order.id
                        })
                    }
                },
                // 修改点：配送追踪
                // 注意：/api/delivery/tracking/{orderId} 接收的是【平台订单号 platformOrderId】
                // （delivery_order 表主键是 platformOrderId，getByPlatformOrderId 查询）。
                // 本系统 Orders.number 是自增主键字符串，与平台订单号不同，直接传会导致"配送订单不存在"。
                viewTracking(order){
                    // 仅平台配送订单才有 platformOrderId；自配送/堂食无追踪，按钮已隐藏，此处兜底
                    var platformOrderId = order && order.platformOrderId;
                    if(platformOrderId){
                        window.requestAnimationFrame(()=>{
                            window.location.href = '/front/page/tracking.html?orderId=' + encodeURIComponent(platformOrderId)
                        })
                    } else {
                        vant.Toast.fail('该订单暂无配送追踪信息');
                    }
                },
                // 修改点：催单（待接单/配送中可用），按订单维度在飞防重，避免连点刷接口
                urgeOrder(order){
                    if(!order || !order.id) return
                    if(!this._urgeMap) this._urgeMap = {}
                    if(this._urgeMap[order.id]) return
                    this._urgeMap[order.id] = true
                    $axios({ url: '/api/urgency/customer/trigger/' + order.id, method: 'post' }).then((res) => {
                        if(res && res.code === 1){
                            var d = res.data || {}
                            if(d.remainCount !== undefined && d.remainCount !== null){
                                vant.Toast.success('已通知商家，今日还可催' + d.remainCount + '次')
                            }else{
                                vant.Toast.success('已通知商家，请耐心等待')
                            }
                        }else{
                            vant.Toast.fail((res && res.msg) || '催单失败，请稍后重试')
                        }
                    }).catch(() => {
                        vant.Toast.fail('网络异常，请稍后重试')
                    }).finally(() => {
                        this._urgeMap[order.id] = false
                    })
                },
                // 修改点：待付款订单去支付——跳结算页重新发起支付流程
                goToPay(order){
                    if(!order || !order.id) return
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/add-order.html?reorderId=' + order.id
                    })
                },
                // 修改点：取消订单
                cancelOrder(order){
                    if(this.submitting) return;
                    vant.Dialog.confirm({
                        title: '取消订单',
                        message: '确定要取消该订单吗？',
                        confirmButtonText: '确定',
                        cancelButtonText: '再看看'
                    }).then(async () => {
                        // 修改点：包裹try-catch，防止API异常导致res为undefined
                        this.submitting = true
                        try {
                            const res = await cancelOrderApi({ id: order.id, status: 5 })
                            if(res && res.code === 1){
                                // 刷新当前列表
                                this.paging.page = 1
                                this.orderList = []
                                this.finished = false
                                this.loading = true
                                this.getList()
                                vant.Toast.success('订单已取消');
                            }else{
                                vant.Toast.fail((res && res.msg) || '取消失败');
                            }
                        } catch(e) {
                            vant.Toast.fail('网络异常，请稍后重试');
                        } finally {
                            this.submitting = false
                        }
                    }).catch(() => {
                        // 用户点取消，什么都不做
                    })
                },
                // 修改点：用户确认收货（status=3 → 4）
                confirmReceipt(order){
                    if(this.submitting) return;
                    vant.Dialog.confirm({
                        title: '确认收货',
                        message: '确认已收到商品？确认后订单将完成。',
                        confirmButtonText: '确认收货',
                        cancelButtonText: '再等等'
                    }).then(async () => {
                        this.submitting = true
                        try {
                            const res = await confirmReceiptApi({ id: order.id })
                            if(res && res.code === 1){
                                vant.Toast.success('已确认收货');
                                this.paging.page = 1
                                this.orderList = []
                                this.finished = false
                                this.loading = true
                                this.getList()
                            }else{
                                vant.Toast.fail((res && res.msg) || '确认失败');
                            }
                        } catch(e) {
                            vant.Toast.fail('网络异常，请稍后重试');
                        } finally {
                            this.submitting = false
                        }
                    }).catch((e) => { console.warn('[order.html] 用户取消确认收货:', e) })
                },
                // 修改点：用户申请售后（status=4，整单退款申请，需填写原因）
                applyRefund(order){
                    if(this.submitting) return;
                    vant.Dialog.confirm({
                        title: '申请售后',
                        message: '确定要为此订单申请售后退款吗？提交后客服将尽快处理。',
                        confirmButtonText: '提交申请',
                        cancelButtonText: '取消'
                    }).then(() => {
                        vant.Dialog.prompt({
                            title: '退款原因',
                            message: '请简要描述退款原因（如商品质量问题、漏送、错送等）',
                            inputPlaceholder: '请输入退款原因',
                            inputValidator: (val) => {
                                if(!val || !val.trim()) return '退款原因不能为空';
                                if(val.trim().length > 200) return '退款原因不超过 200 字';
                                return true;
                            },
                            confirmButtonText: '提交',
                            cancelButtonText: '取消'
                        }).then(async (val) => {
                            this.submitting = true
                            try {
                                const reason = (val && val.trim) ? val.trim() : ('' + val).trim()
                                const res = await applyRefundApi({ id: order.id, reason: reason })
                                if(res && res.code === 1){
                                    const data = res.data || {}
                                    vant.Toast.success('售后申请已提交：' + (data.refundNo || ''))
                                    this.paging.page = 1
                                    this.orderList = []
                                    this.finished = false
                                    this.loading = true
                                    this.getList()
                                }else{
                                    vant.Toast.fail((res && res.msg) || '申请失败');
                                }
                            } catch(e) {
                                vant.Toast.fail('网络异常，请稍后重试');
                            } finally {
                                this.submitting = false
                            }
                        }).catch((e) => { console.warn('[order.html] 用户取消填写退款原因:', e) })
                    }).catch((e) => { console.warn('[order.html] 用户取消申请售后:', e) })
                },
            }
        })
        </script>
    </body>
</html>
