<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
        <title>历史订单 - 瑞吉外卖</title>
        <link rel="icon" href="./../images/favico.ico">
        <!--不同屏幕尺寸根字体设置-->
        <script src="./../js/base.js"></script>
        <!-- 引入样式  -->
        <link rel="stylesheet" href="../styles/index.css" />
        <!--引入vant样式-->
        <link rel="stylesheet" href="../styles/vant.min.css"/>
        <!--本页面内容的样式-->
        <link rel="stylesheet" href="./../styles/order.css" />
    </head>
    <body>
        <div id="order" class="app">
            <div class="divHead">
                <div class="divTitle">
                    <i class="icon-back-arrow" @click="goBack"></i>历史订单
                </div>
            </div>
            <!-- 修改点：美团风格状态Tab筛选栏 -->
            <div class="status-tabs">
                <div
                    v-for="tab in statusTabs"
                    :key="tab.value"
                    class="status-tab"
                    :class="{active: activeStatus === tab.value}"
                    @click="switchTab(tab.value)"
                >{{ tab.label }}</div>
            </div>
            <div class="divBody" v-if="orderList.length > 0">
                <van-list
                    v-model="loading"
                    :finished="finished"
                    finished-text="没有更多了"
                    @load="getList"
                    >
                    <van-cell v-for="order in orderList" :key="order.id" class="item">
                        <div class="timeStatus">
                            <span>{{order.orderTime}}</span>
                            <span>{{getStatus(order.status)}}</span>
                        </div>
                        <div class="dishList">
                            <div v-for="(item,dIdx) in order.orderDetails" :key="dIdx" class="item">
                                <span>{{item.name}}</span>
                                <span>x{{item.number}}</span>
                            </div>
                        </div>
                        <div class="result">
                            <span>共{{order.sumNum}} 件商品,实付</span><span class="price">￥{{ Number(order.amount).toFixed(2) }}</span>
                        </div>
                        <div class="btn" v-if="order.status === 1">
                            <div class="btnCancel" @click="cancelOrder(order)">取消订单</div>
                        </div>
                        <div class="btn" v-if="order.status === 2 || order.status === 3">
                            <div class="btnAgain" @click="viewTracking(order)">配送追踪</div>
                            <div v-if="order.status === 3" class="btnEval" @click="confirmReceipt(order)">确认收货</div>
                        </div>
                        <div class="btn" v-if="order.status === 4">
                            <div class="btnAgain" @click="addOrderAgain(order)">再来一单</div>
                            <!-- 修改点：已完成订单可申请开票（电子发票） -->
                            <div class="btnShare" @click="openInvoice(order)">开发票</div>
                            <div class="btnEval" @click="evaluateOrder(order)">评价</div>
                            <div class="btnShare" @click="shareOrder(order)">分享</div>
                            <div class="btnCancel" @click="applyRefund(order)">申请售后</div>
                        </div>
                    </van-cell>
                </van-list>
            </div>
            <!-- 修改点：空状态增加引导按钮 -->
            <div class="divNoData" v-else>
                <div class="divContainer">
                    <img src="./../images/no_order.png" alt="暂无订单"/>
                    <div>暂无订单</div>
                    <div class="goShopBtn" @click="goHome">去逛逛</div>
                </div>
            </div>
        </div>
        <!-- 开发环境版本，包含了有帮助的命令行警告 -->
        <script src="../../backend/plugins/vue/vue.js"></script>
        <!-- 引入vant组件 -->
        <script src="./../js/vant.min.js"></script>    
        <!-- 引入axios -->
        <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="./../js/request.js"></script>
        <script src="./../api/main.js"></script>
        <script src="./../js/common.js"></script>
        <script src="./../api/order.js"></script>
        <script>
        new Vue({
            el:"#order",
            data(){
                return {
                    paging:{
                        page:1,
                        pageSize:5
                    },
                    orderList:[],
                    loading:false,
                    finished:false,
                    submitting:false, // 修改点：再来一单防重复提交
                    // 修改点：状态筛选
                    activeStatus: null, // null表示全部
                    // 修改点（重要 Bug 修复）：原「待派送=3、配送中=2」与后端 OrderStatus 完全相反
                    // （后端 2=待接单、3=配送中），导致点"待派送"筛出的实际是配送中订单。
                    // 现严格对齐后端：1=待付款 2=待接单 3=配送中 4=已完成 5=已取消 6=已退款
                    statusTabs: [
                        { label: '全部', value: null },
                        { label: '待付款', value: 1 },
                        { label: '待接单', value: 2 },
                        { label: '配送中', value: 3 },
                        { label: '已完成', value: 4 },
                        { label: '已取消', value: 5 },
                        { label: '已退款', value: 6 }
                    ]
                }
            },
            computed:{},
            created(){
                // 修改点：先加载后端枚举字典，使列表状态文案与后端保持一致
                // （字典加载失败时 getStatus 自动回退到 common.js 的兜底常量）
                var self = this
                if (typeof loadEnums === 'function') {
                    loadEnums(function(){ self.initData() })
                } else {
                    this.initData()
                }
            },
            methods:{
                goBack(){
                    // 修改点：用sessionStorage标志替代不可靠的document.referrer判断
                    if(sessionStorage.getItem('orderFromPaySuccess')){
                        sessionStorage.removeItem('orderFromPaySuccess')
                        window.requestAnimationFrame(()=>{
                            window.location.href = '/front/index.html'
                        })   
                    }else{
                        history.go(-1)
                    }
                },
                goHome(){
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/index.html'
                    })
                },
                initData(){
                    this.getList()
                },
                // 修改点：切换Tab时重置分页并重新加载
                switchTab(status){
                    if(this.activeStatus === status) return;
                    this.activeStatus = status;
                    this.paging.page = 1;
                    this.orderList = [];
                    this.finished = false;
                    this.loading = true;
                    this.getList();
                },
                async getList(){
                    if(this.finished){
                        this.loading = false;
                        return
                    }
                    // 修改点：仅在有状态筛选时传递status参数
                    const params = { ...this.paging }
                    if(this.activeStatus !== null){
                        params.status = this.activeStatus
                    }
                    try {
                        const res = await orderPagingApi(params)
                        if(res.code === 1){
                            // 第一页时重置列表，防止重复累加
                            if(this.paging.page === 1){
                                this.orderList = []
                            }
                            let records = res.data.records
                            if(records && Array.isArray(records)){
                                records.forEach(item=>{
                                    let number = 0
                                    item.orderDetails.forEach(ele=>{
                                        number += ele.number
                                    })
                                    item.sumNum = number
                                })
                                this.orderList.push(...records)
                            }
                            if(this.paging.page >= res.data.pages){
                                this.finished = true;
                            }
                            this.paging.page = this.paging.page + 1
                        }else{
                            vant.Toast.fail(res.msg || '加载订单失败');
                        }
                    } catch (err) {
                        // 异常兜底：网络错误/接口异常时给出提示，loading 由 finally 复位，避免永卡加载
                        console.error('加载订单列表失败:', err)
                        vant.Toast.fail('加载订单失败，请稍后重试');
                    } finally {
                        this.loading = false;
                    }
                },
                getStatus(status){
                    return getStatus(status)
                },
                async addOrderAgain(order){
                    if(this.submitting) return;
                    this.submitting = true
                    try {
                        const res = await orderAgainApi({id:order.id})
                        if(res.code === 1){
                            // 修改点：先刷新购物车数据，确保首页立即显示正确数量
                            await cartListApi({})
                            window.requestAnimationFrame(()=>{
                                window.location.href = '/front/index.html'
                            })
                        }else{
                            vant.Toast.fail(res.msg || '再来一单失败');
                        }
                    } finally {
                        this.submitting = false
                    }
                },
                // 修改点：分享订单
                shareOrder(order){
                    const shareData = {
                        title: '我在瑞吉外卖的订单',
                        text: '我在瑞吉外卖点了一单，你也来试试吧！',
                        url: window.location.origin + '/front/index.html'
                    }
                    if(navigator.share){
                        navigator.share(shareData).catch((e) => { console.warn('[order.html] 分享订单失败:', e) })
                    } else {
                        const ta = document.createElement('textarea')
                        ta.value = shareData.url
                        document.body.appendChild(ta)
                        ta.select()
                        try {
                            document.execCommand('copy')
                            vant.Toast.success('链接已复制')
                        } catch(e) {
                            vant.Toast.fail('分享失败')
                        }
                        document.body.removeChild(ta)
                    }
                },
                // 修改点：申请开票（已完成订单 → 发票页）
                openInvoice(order){
                    if(!order || !order.id) return
                    var amount = order.amount !== undefined && order.amount !== null ? order.amount : ''
                    var orderNo = order.orderNo || ''
                    window.requestAnimationFrame(()=>{
                        window.location.href = '/front/page/invoice.html?orderId=' + order.id + '&orderNo=' + encodeURIComponent(orderNo) + '&amount=' + amount
                    })
                },
                // 修改点：评价订单
                evaluateOrder(order){
                    if(order && order.id){
                        window.requestAnimationFrame(()=>{
                            window.location.href = '/front/page/my-evaluations.html?orderId=' + order.id
                        })
                    }
                },
                // 修改点：配送追踪
                viewTracking(order){
                    if(order && order.number){
                        window.requestAnimationFrame(()=>{
                            window.location.href = '/front/page/tracking.html?orderId=' + order.number
                        })
                    }
                },
                // 修改点：取消订单
                cancelOrder(order){
                    if(this.submitting) return;
                    vant.Dialog.confirm({
                        title: '取消订单',
                        message: '确定要取消该订单吗？',
                        confirmButtonText: '确定',
                        cancelButtonText: '再看看'
                    }).then(async () => {
                        // 修改点：包裹try-catch，防止API异常导致res为undefined
                        this.submitting = true
                        try {
                            const res = await cancelOrderApi({ id: order.id, status: 5 })
                            if(res && res.code === 1){
                                // 刷新当前列表
                                this.paging.page = 1
                                this.orderList = []
                                this.finished = false
                                this.loading = true
                                this.getList()
                                vant.Toast.success('订单已取消');
                            }else{
                                vant.Toast.fail((res && res.msg) || '取消失败');
                            }
                        } catch(e) {
                            vant.Toast.fail('网络异常，请稍后重试');
                        } finally {
                            this.submitting = false
                        }
                    }).catch(() => {
                        // 用户点取消，什么都不做
                    })
                },
                // 修改点：用户确认收货（status=3 → 4）
                confirmReceipt(order){
                    if(this.submitting) return;
                    vant.Dialog.confirm({
                        title: '确认收货',
                        message: '确认已收到商品？确认后订单将完成。',
                        confirmButtonText: '确认收货',
                        cancelButtonText: '再等等'
                    }).then(async () => {
                        this.submitting = true
                        try {
                            const res = await confirmReceiptApi({ id: order.id })
                            if(res && res.code === 1){
                                vant.Toast.success('已确认收货');
                                this.paging.page = 1
                                this.orderList = []
                                this.finished = false
                                this.loading = true
                                this.getList()
                            }else{
                                vant.Toast.fail((res && res.msg) || '确认失败');
                            }
                        } catch(e) {
                            vant.Toast.fail('网络异常，请稍后重试');
                        } finally {
                            this.submitting = false
                        }
                    }).catch((e) => { console.warn('[order.html] 用户取消确认收货:', e) })
                },
                // 修改点：用户申请售后（status=4，整单退款申请，需填写原因）
                applyRefund(order){
                    if(this.submitting) return;
                    vant.Dialog.confirm({
                        title: '申请售后',
                        message: '确定要为此订单申请售后退款吗？提交后客服将尽快处理。',
                        confirmButtonText: '提交申请',
                        cancelButtonText: '取消'
                    }).then(() => {
                        vant.Dialog.prompt({
                            title: '退款原因',
                            message: '请简要描述退款原因（如商品质量问题、漏送、错送等）',
                            inputPlaceholder: '请输入退款原因',
                            inputValidator: (val) => {
                                if(!val || !val.trim()) return '退款原因不能为空';
                                if(val.trim().length > 200) return '退款原因不超过 200 字';
                                return true;
                            },
                            confirmButtonText: '提交',
                            cancelButtonText: '取消'
                        }).then(async (val) => {
                            this.submitting = true
                            try {
                                const reason = (val && val.trim) ? val.trim() : ('' + val).trim()
                                const res = await applyRefundApi({ id: order.id, reason: reason })
                                if(res && res.code === 1){
                                    const data = res.data || {}
                                    vant.Toast.success('售后申请已提交：' + (data.refundNo || ''))
                                    this.paging.page = 1
                                    this.orderList = []
                                    this.finished = false
                                    this.loading = true
                                    this.getList()
                                }else{
                                    vant.Toast.fail((res && res.msg) || '申请失败');
                                }
                            } catch(e) {
                                vant.Toast.fail('网络异常，请稍后重试');
                            } finally {
                                this.submitting = false
                            }
                        }).catch((e) => { console.warn('[order.html] 用户取消填写退款原因:', e) })
                    }).catch((e) => { console.warn('[order.html] 用户取消申请售后:', e) })
                },
            }
        })
        </script>
    </body>
</html>
