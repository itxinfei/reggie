<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的评价</title>
  <link rel="stylesheet" href="/front/styles/vant.min.css">
  <link rel="stylesheet" href="/shared/styles/tokens.css?v=20260930b">
  <link rel="stylesheet" href="/backend/plugins/remixicon/remixicon.css">
  <link rel="stylesheet" href="/rider/css/rider.css?v=20260930e">
  <style>
    .eval-summary {
      display: flex; align-items: center; gap: 14px;
      margin: 14px; padding: 18px; border-radius: 14px;
      background: linear-gradient(135deg, var(--color-primary, #ffc200), var(--color-primary-dark, #ff9a00)); color: var(--color-primary-text);
    }
    .eval-score { font-size: 34px; font-weight: 700; line-height: 1; }
    .eval-meta { font-size: 13px; opacity: 0.92; }
    .eval-section-title { padding: 14px 14px 6px; font-size: 13px; color: var(--color-text-secondary, #666666); }
    .eval-item { margin: 0 14px 10px; padding: 12px; border-radius: 12px; background: var(--bg-card, #fff); box-shadow: var(--shadow-sm); }
    .eval-head { display: flex; align-items: center; justify-content: space-between; }
    .eval-user { font-size: 14px; color: var(--color-text-primary, #333333); font-weight: 600; }
    .eval-time { font-size: 12px; color: var(--color-text-secondary, #666666); }
    .eval-content { margin-top: 6px; font-size: 13px; color: var(--color-text-primary, #333333); }
    .eval-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
    .eval-tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; background: rgba(255,154,0,0.12); color: var(--color-primary-text); }
    .eval-reply { margin-top: 6px; padding: 8px; border-radius: 8px; background: var(--bg-hover, #f5f5f5); font-size: 12px; color: var(--color-text-secondary, #666666); }
  </style>
</head>
<body>
  <div id="app">
    <van-nav-bar title="我的评价" left-text="返回" left-arrow @click-left="goBack"></van-nav-bar>

    <div class="eval-summary">
      <div class="eval-score">{{ stats.avg != null ? stats.avg : '0.0' }}</div>
      <div class="eval-meta">
        <van-rate :value="Number(stats.avg || 0)" :size="16" disabled allow-half></van-rate>
        <div style="margin-top:6px;">共 {{ stats.cnt != null ? stats.cnt : 0 }} 条评价</div>
      </div>
    </div>

    <div class="eval-section-title">收到的评价</div>
    <van-pull-refresh v-model="refreshing" @refresh="load" success-text="刷新成功">
      <div v-if="list.length">
        <div class="eval-item" v-for="e in list" :key="e.id">
          <div class="eval-head">
            <span class="eval-user">{{ e.anonymous === 1 ? '匿名用户' : (e.userName || '顾客') }}</span>
            <van-rate :value="e.starRating" :size="14" disabled></van-rate>
          </div>
          <div class="eval-time">{{ RiderUtil.formatTime(e.createTime) }}</div>
          <div class="eval-content" v-if="e.content">{{ e.content }}</div>
          <div class="eval-tags" v-if="e.tagsParsed && e.tagsParsed.length">
            <span class="eval-tag" v-for="t in e.tagsParsed" :key="t">{{ t }}</span>
          </div>
          <div class="eval-reply" v-if="e.replyContent">商家回复：{{ e.replyContent }}</div>
        </div>
      </div>
      <div class="rider-empty" v-else>{{ refreshing ? '加载中…' : '暂无评价' }}</div>
    </van-pull-refresh>
  </div>

  <script src="/backend/plugins/vue/vue.js"></script>
  <script src="/backend/plugins/axios/axios.min.js"></script>
  <script src="/front/js/vant.min.js"></script>
  <script src="/rider/js/request.js?v=20260930"></script>
  <script src="/rider/js/api.js"></script>
  <script src="/rider/js/util.js?v=20260930"></script>
  <script>
    Vue.use(vant);
    new Vue({
      data: function () {
        return {
          riderId: null,
          stats: { avg: '0.0', cnt: 0 },
          list: [],
          refreshing: false
        };
      },
      created: function () {
        this.RiderUtil = window.RiderUtil;
      },
      mounted: function () {
        var vm = this;
        RiderApi.me().then(function (res) {
          vm.riderId = (res.data || {}).id;
          vm.load();
        }).catch(function () { /* 未登录已跳转 */ });
      },
      methods: {
        load: function () {
          var vm = this;
          if (!vm.riderId) { vm.refreshing = false; return; }
          vm.refreshing = true;
          RiderApi.riderEvaluationStats(vm.riderId).then(function (res) {
            var s = res.data || {};
            vm.stats = { avg: s.avg != null ? Number(s.avg).toFixed(1) : '0.0', cnt: s.cnt != null ? s.cnt : 0 };
          }).catch(function () { /* 忽略 */ });

          RiderApi.riderEvaluationReceived(1, 100).then(function (res) {
            var page = res.data || {};
            var records = page.records || [];
            for (var i = 0; i < records.length; i++) {
              var tags = records[i].tags;
              try { records[i].tagsParsed = tags ? JSON.parse(tags) : []; }
              catch (e) { records[i].tagsParsed = []; }
            }
            vm.list = records;
          }).catch(function () { /* 提示已统一 */ }).then(function () {
            vm.refreshing = false;
          });
        },
        goBack: function () {
          RiderUtil.back();
        }
      }
    }).$mount('#app');
  </script>
</body>
</html>
