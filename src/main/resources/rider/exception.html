<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的异常工单</title>
  <link rel="stylesheet" href="/front/styles/vant.min.css">
  <link rel="stylesheet" href="/shared/styles/tokens.css?v=20260930b">
  <link rel="stylesheet" href="/backend/plugins/remixicon/remixicon.css">
  <link rel="stylesheet" href="/rider/css/rider.css?v=20260930e">
  <style>
    .exc-item { margin: 10px 14px; padding: 12px; border-radius: 12px; background: var(--bg-card); box-shadow: var(--shadow-sm); }
    .exc-item-head { display: flex; align-items: center; justify-content: space-between; }
    .exc-item-type { font-size: var(--font-size-md); font-weight: 600; color: var(--color-text-primary); }
    .exc-item-time { font-size: var(--font-size-sm); color: var(--color-text-hint); }
    .exc-item-no { margin-top: 6px; font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .exc-item-desc { margin-top: 6px; font-size: var(--font-size-md); color: var(--color-text-primary); }
    .exc-item-note { margin-top: 6px; padding: 8px; border-radius: 8px; background: var(--bg-hover); font-size: var(--font-size-sm); color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div id="app">
    <main id="rider-main">
      <h1 class="sr-only">我的异常工单</h1>
    <van-nav-bar title="我的异常工单" left-text="返回" left-arrow @click-left="goBack"></van-nav-bar>

    <van-pull-refresh v-model="refreshing" @refresh="load" success-text="刷新成功">
      <div v-if="list.length">
        <div class="exc-item" v-for="e in list" :key="e.id">
          <div class="exc-item-head">
            <span class="exc-item-type">{{ typeText(e.exceptionType) }}</span>
            <van-tag :type="statusTagType(e.status)">{{ statusText(e.status) }}</van-tag>
          </div>
          <div class="exc-item-no">订单号：{{ e.orderNumber }}</div>
          <div class="exc-item-desc" v-if="e.description">{{ e.description }}</div>
          <div class="exc-item-time">{{ RiderUtil.formatTime(e.createTime) }}</div>
          <div class="exc-item-note" v-if="e.handleNote">处理意见：{{ e.handleNote }}</div>
        </div>
      </div>
      <div class="rider-empty" v-else>{{ refreshing ? '加载中…' : '暂无异常工单' }}</div>
    </van-pull-refresh>
  </main>
  </div>

  <script src="/backend/plugins/vue/vue.js"></script>
  <script src="/backend/plugins/axios/axios.min.js"></script>
  <script src="/front/js/vant.min.js"></script>
  <script src="/rider/js/request.js?v=20260930"></script>
  <script src="/rider/js/api.js"></script>
  <script src="/rider/js/util.js?v=20260930"></script>
  <script>
    Vue.use(vant);
    new Vue({
      data: function () {
        return { list: [], refreshing: false };
      },
      created: function () {
        this.RiderUtil = window.RiderUtil;
      },
      mounted: function () {
        this.load();
      },
      methods: {
        load: function () {
          var vm = this;
          vm.refreshing = true;
          RiderApi.myExceptions(1, 100).then(function (res) {
            var page = res.data || {};
            vm.list = page.records || [];
          }).catch(function () { /* 提示已统一 */ }).then(function () {
            vm.refreshing = false;
          });
        },
        typeText: function (t) {
          return RiderUtil.excTypeText(t);
        },
        statusText: function (s) {
          var map = { 0: '待处理', 1: '已处理', 2: '已转单', 3: '已关闭' };
          return map[s] || '未知';
        },
        statusTagType: function (s) {
          switch (s) {
            case 0: return 'warning';
            case 1: return 'success';
            case 2: return 'primary';
            default: return 'default';
          }
        },
        goBack: function () {
          RiderUtil.back();
        }
      }
    }).$mount('#app');
  </script>
</body>
</html>
