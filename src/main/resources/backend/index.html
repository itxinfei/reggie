<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瑞吉外卖管理端</title>
    <link rel="shortcut icon" href="favicon.ico">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="plugins/element-ui/index.css" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/icon/iconfont.css" />
    <style>
      .body{
        min-width: 1366px;
      }
      .app-main{
        height: calc(100% - 56px);
      }
      .app-main .divTmp{
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div class="app" id="app">
      <div :class="['app-wrapper', 'clearfix', { 'sidebar-collapsed': sidebarCollapsed }]">
        <!-- 侧边栏遮罩（移动端） -->
        <div class="sidebar-overlay" :class="{ visible: sidebarOpen }" @click="closeSidebar"></div>

        <!-- sidebar -->
        <div class="sidebar-container" :class="{ collapsed: sidebarCollapsed, 'mobile-open': sidebarOpen }">
          <div class="sidebar-logo" @click="goHome()">
            <div class="logo-icon">
              <img src="images/login/login-logo.png" alt="瑞吉外卖" style="width: 36px; height: 36px;" />
            </div>
            <div class="logo-text">
              <span class="logo-brand">瑞吉外卖</span>
              <span class="logo-sub">REGGIE TAKEOUT</span>
            </div>
          </div>

          <div class="sidebar-menu-wrap">
            <el-menu
              :default-active="defAct"
              :unique-opened="false"
              :collapse-transition="false"
              background-color="transparent"
              text-color="#9da3b5"
              active-text-color="#ffc200"
            >
              <div v-for="item in menuList" :key="item.id">
                <el-submenu :index="item.id" v-if="item.children && item.children.length>0">
                  <template slot="title">
                    <i class="iconfont" :class="item.icon"></i>
                    <span>{{item.name}}</span>
                  </template>
                  <el-menu-item
                    v-for="sub in item.children"
                    :index="sub.id"
                    :key="sub.id"
                    @click="menuHandle(sub,false)"
                    >
                    <i :class="[iconfont, sub.icon]"></i>
                    <span slot="title">{{sub.name}}</span>
                    </el-menu-item
                  >
                </el-submenu>
                <el-menu-item v-else :index="item.id" @click="menuHandle(item,false)">
                  <i class="iconfont" :class="item.icon"></i>
                  <span slot="title">{{item.name}}</span>
                </el-menu-item>
              </div>
            </el-menu>
          </div>

          <!-- 折叠切换按钮 -->
          <div class="sidebar-toggle-btn" @click="toggleSidebar" title="收起菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-container">
          <div class="topbar">
            <div class="topbar-left">
              <!-- 汉堡按钮（移动端/折叠切换） -->
              <button class="hamburger-btn" @click="toggleSidebar" title="展开菜单">
                <span></span><span></span><span></span>
              </button>
              <!-- 返回按钮 -->
              <button v-if="goBackFlag" class="back-btn" @click="goBack()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                返回
              </button>
              <!-- 页面标题 -->
              <h1 class="page-title">{{headTitle}}</h1>
            </div>
            <div class="topbar-right">
              <div class="user-info">
                <div class="user-avatar">{{ userInfo.name ? userInfo.name.charAt(0) : '管' }}</div>
                <span class="user-name">{{ userInfo.name }}</span>
              </div>
              <button class="logout-btn" @click="logout" title="退出登录">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="app-main" v-loading="loading">
            <div class="divTmp" v-show="loading"></div>
            <iframe
              id="cIframe"
              class="c_iframe"
              name="cIframe"
              :src="iframeUrl"
              width="100%"
              height="auto"
              frameborder="0"
              v-show="!loading"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="plugins/axios/axios.min.js"></script>
    <script src="js/request.js"></script>
    <script src="./api/login.js"></script>
    <script>

      new Vue({
        el: '#app',
        data() {
          return {
            defAct: '1',
            menuActived: '2',
            userInfo: {},
            sidebarCollapsed: false,
            sidebarOpen: false,
            menuList: [
              // {
              //   id: '1',
              //   name: '门店管理',
              //   children: [
                  {
                    id: '1',
                    name: '数据概览',
                    url: 'page/dashboard/overview.html',
                    icon: 'icon-combo'
                  },
                  {
                    id: '2',
                    name: '员工管理',
                    url: 'page/member/list.html',
                    icon: 'icon-member'
                  },
                  {
                    id: '3',
                    name: '分类管理',
                    url: 'page/category/list.html',
                    icon: 'icon-category'
                  },
                  {
                    id: '4',
                    name: '菜品管理',
                    url: 'page/food/list.html',
                    icon: 'icon-food'
                  },
                  {
                    id: '5',
                    name: '套餐管理',
                    url: 'page/combo/list.html',
                    icon: 'icon-combo'
                  },
                  {
                    id: '6',
                    name: '订单明细',
                    url: 'page/order/list.html',
                    icon: 'icon-order'
                  },
                  {
                    id: '7',
                    name: '打印管理',
                    url: 'page/printer/config-list.html',
                    icon: 'icon-order'
                  },
                  {
                    id: '8',
                    name: '支付管理',
                    url: 'page/payment/order-list.html',
                    icon: 'icon-lock'
                  },
                  {
                    id: '9',
                    name: '外卖平台',
                    url: 'page/delivery/order-list.html',
                    icon: 'icon-user'
                  },
                  {
                    id: '10',
                    name: '堂食管理',
                    url: 'page/dining/table-list.html',
                    icon: 'icon-food'
                  },
                  {
                    id: '11',
                    name: '进销存管理',
                    url: 'page/inventory/material-list.html',
                    icon: 'icon-category'
                  },
                  {
                    id: '12',
                    name: '会员营销',
                    url: 'page/member-center/member-list.html',
                    icon: 'icon-member'
                  },
                  {
                    id: '13',
                    name: '经营报表',
                    url: 'page/report/daily.html',
                    icon: 'icon-combo'
                  },
                  // 修改点：新增用户管理菜单，管理C端用户
                  {
                    id: '14',
                    name: '用户管理',
                    url: 'page/user/list.html',
                    icon: 'icon-user'
                  },
                  // 修改点：新增智能推荐和营销管理
                  {
                    id: '15',
                    name: '智能推荐',
                    url: 'page/recommend/overview.html',
                    icon: 'icon-combo'
                  },
                  {
                    id: '16',
                    name: '营销活动',
                    url: 'page/recommend/campaigns.html',
                    icon: 'icon-category'
                  },
                  // 修改点：新增多门店管理
                  {
                    id: '17',
                    name: '门店管理',
                    url: 'page/store/list.html',
                    icon: 'icon-food'
                  },
                  {
                    id: '18',
                    name: '总部控制台',
                    url: 'page/store/dashboard.html',
                    icon: 'icon-lock'
                  }
              //   ],
              // },
            ],
            iframeUrl: 'page/dashboard/overview.html',
            headTitle: '数据概览',
            goBackFlag: false,
            loading: true,
            timer: null
          }
        },
        computed: {},
        created() {
          const userInfo = window.localStorage.getItem('userInfo')
          if (userInfo) {
            this.userInfo = JSON.parse(userInfo)
          }
          this.closeLoading()
        },
        beforeDestroy() {
          this.timer = null
          clearTimeout(this.timer)
        },
        mounted() {
          window.menuHandle = this.menuHandle
        },
        methods: {
          logout() {
            logoutApi().then((res)=>{
              if(res.code === 1){
                localStorage.removeItem('userInfo')
                window.location.href = '/backend/page/login/login.html'
              }
            })
          },
          goHome() {
            const homeMenu = this.menuList.find(item => item.id === '1')
            if (homeMenu) {
              this.menuHandle(homeMenu, false)
            }
          },
          goBack() {
            // window.location.href = 'javascript:history.go(-1)'
            const menu = this.menuList.find(item=>item.id===this.menuActived)
            // this.goBackFlag = false
            // this.headTitle = menu.name
            this.menuHandle(menu,false)
          },
          menuHandle(item, goBackFlag) {
            this.loading = true
            this.menuActived = item.id
            this.iframeUrl = item.url
            this.headTitle = item.name
            this.goBackFlag = goBackFlag
            this.closeLoading()
          },
          closeLoading(){
            this.timer = null
            this.timer = setTimeout(()=>{
              this.loading = false
            },1000)
          },
          toggleSidebar() {
            // 移动端（≤767px）切换抽屉式展开/关闭
            if (window.innerWidth <= 767) {
              this.sidebarOpen = !this.sidebarOpen
              return
            }
            // 桌面端切换折叠/展开
            this.sidebarCollapsed = !this.sidebarCollapsed
          },
          closeSidebar() {
            this.sidebarOpen = false
          }
        }
      })
    </script>
  </body>
</html>
