<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瑞吉外卖管理端</title>
    <link rel="shortcut icon" href="favicon.ico">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="plugins/element-ui/index.css" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/icon/iconfont.css" />
    <style>
      .body{
        min-width: 1366px;
      }
      .app-main{
        height: calc(100% - 56px);
      }
      .app-main .divTmp{
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div class="app" id="app">
      <div :class="['app-wrapper', 'clearfix', { 'sidebar-collapsed': sidebarCollapsed }]">
        <!-- 侧边栏遮罩（移动端） -->
        <div class="sidebar-overlay" :class="{ visible: sidebarOpen }" @click="closeSidebar"></div>

        <!-- sidebar -->
        <div class="sidebar-container" :class="{ collapsed: sidebarCollapsed, 'mobile-open': sidebarOpen }">
          <div class="sidebar-logo" @click="goHome()">
            <div class="logo-icon">
              <img src="images/login/login-logo.png" alt="瑞吉外卖" style="width: 36px; height: 36px;" />
            </div>
            <div class="logo-text">
              <span class="logo-brand">瑞吉外卖</span>
              <span class="logo-sub">REGGIE TAKEOUT</span>
            </div>
          </div>

          <div class="sidebar-menu-wrap">
            <el-menu
              :default-active="defAct"
              :unique-opened="false"
              :collapse-transition="false"
              background-color="transparent"
              text-color="#9da3b5"
              active-text-color="#ffc200"
            >
              <div v-for="item in menuList" :key="item.id">
                <el-submenu :index="item.id" v-if="item.children && item.children.length>0">
                  <template slot="title">
                    <i class="iconfont" :class="item.icon"></i>
                    <span>{{item.name}}</span>
                  </template>
                  <el-menu-item
                    v-for="sub in item.children"
                    :index="sub.id"
                    :key="sub.id"
                    @click="menuHandle(sub,false)"
                    >
                    <i :class="['iconfont', sub.icon]"></i>
                    <span slot="title">{{sub.name}}</span>
                    </el-menu-item
                  >
                </el-submenu>
                <el-menu-item v-else :index="item.id" @click="menuHandle(item,false)">
                  <i class="iconfont" :class="item.icon"></i>
                  <span slot="title">{{item.name}}</span>
                </el-menu-item>
              </div>
            </el-menu>
          </div>

          <!-- 折叠切换按钮 -->
          <div class="sidebar-toggle-btn" @click="toggleSidebar" title="收起菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-container">
          <div class="topbar">
            <div class="topbar-left">
              <!-- 汉堡按钮（移动端/折叠切换） -->
              <button class="hamburger-btn" @click="toggleSidebar" title="展开菜单">
                <span></span><span></span><span></span>
              </button>
              <!-- 全局搜索 -->
              <div class="global-search">
                <el-input
                  v-model="searchKeyword"
                  placeholder="搜索菜单..."
                  size="small"
                  clearable
                  @focus="showSearchDropdown = true"
                  @input="filterSearch"
                  @keyup.enter.native="goToFirstResult"
                >
                  <i slot="prefix" class="el-input__icon el-icon-search"></i>
                </el-input>
                <div class="search-dropdown" v-show="showSearchDropdown && searchResults.length > 0">
                  <div
                    class="search-item"
                    v-for="item in searchResults"
                    :key="item.id"
                    @click="navigateToSearch(item)"
                  >
                    <i :class="['iconfont', item.icon]"></i>
                    <span class="search-item-name">{{ item.parentName }}</span>
                    <span class="search-item-child">{{ item.name }}</span>
                  </div>
                </div>
              </div>
              <!-- 返回按钮 -->
              <button v-if="goBackFlag" class="back-btn" @click="goBack()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                返回
              </button>
              <!-- 面包屑导航（同时作为页面标题，最后一级不再重复显示） -->
              <div class="breadcrumb" v-if="breadcrumbs.length > 0">
                <template v-for="(crumb, index) in breadcrumbs">
                  <span v-if="index > 0" class="crumb-sep">/</span>
                  <span :class="['crumb-item', { clickable: index < breadcrumbs.length - 1, 'crumb-current': index === breadcrumbs.length - 1 }]"
                        @click="index < breadcrumbs.length - 1 && navigateToBreadcrumb(index)">
                    {{ crumb }}
                  </span>
                </template>
              </div>
            </div>
            <div class="topbar-right">
              <div class="user-info">
                <div class="user-avatar">{{ userInfo.name ? userInfo.name.charAt(0) : '管' }}</div>
                <span class="user-name">{{ userInfo.name }}</span>
              </div>
              <button class="logout-btn" @click="logout" title="退出登录">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="app-main" v-loading="loading">
            <div class="divTmp" v-show="loading"></div>
            <iframe
              id="cIframe"
              class="c_iframe"
              name="cIframe"
              :src="iframeUrl"
              width="100%"
              height="auto"
              frameborder="0"
              v-show="!loading"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="plugins/axios/axios.min.js"></script>
    <script src="js/request.js"></script>
    <script src="./api/login.js"></script>
    <script>

      new Vue({
        el: '#app',
        data() {
          return {
            defAct: '1',
            menuActived: '1',
            userInfo: {},
            sidebarCollapsed: false,
            sidebarOpen: false,
            menuList: [
              { id: '1', name: '数据概览', url: 'page/dashboard/overview.html', icon: 'icon-category' },
              { id: '2', name: '商品管理', icon: 'icon-category', children: [
                { id: '2-1', name: '分类管理', url: 'page/category/list.html', icon: 'icon-category' },
                { id: '2-2', name: '菜品管理', url: 'page/food/list.html', icon: 'icon-food' },
                { id: '2-3', name: '套餐管理', url: 'page/combo/list.html', icon: 'icon-combo' },
              ]},
              { id: '3', name: '订单管理', icon: 'icon-order', children: [
                { id: '3-1', name: '订单明细', url: 'page/order/list.html', icon: 'icon-order' },
                { id: '3-2', name: '支付管理', url: 'page/payment/order-list.html', icon: 'icon-lock' },
                { id: '3-3', name: '打印配置', url: 'page/printer/config-list.html', icon: 'icon-category' },
                { id: '3-4', name: '打印日志', url: 'page/printer/log-list.html', icon: 'icon-combo' },
              ]},
              { id: '4', name: '外卖配送', icon: 'icon-order', children: [
                { id: '4-1', name: '配送订单', url: 'page/delivery/order-list.html', icon: 'icon-order' },
              ]},
              { id: '5', name: '堂食管理', icon: 'icon-food', children: [
                { id: '5-1', name: '桌台管理', url: 'page/dining/table-list.html', icon: 'icon-food' },
                { id: '5-2', name: '区域管理', url: 'page/dining/area-list.html', icon: 'icon-category' },
                { id: '5-3', name: '排队管理', url: 'page/dining/queue-list.html', icon: 'icon-member' },
                { id: '5-4', name: '预订管理', url: 'page/dining/reservation-list.html', icon: 'icon-order' },
              ]},
              { id: '6', name: '进销存', icon: 'icon-category', children: [
                { id: '6-1', name: '原料管理', url: 'page/inventory/material-list.html', icon: 'icon-category' },
                { id: '6-2', name: '库存盘点', url: 'page/inventory/stock-check.html', icon: 'icon-lock' },
                { id: '6-3', name: '库存流水', url: 'page/inventory/stock-record.html', icon: 'icon-order' },
                { id: '6-4', name: '采购管理', url: 'page/inventory/purchase-list.html', icon: 'icon-combo' },
                { id: '6-5', name: '供应商管理', url: 'page/inventory/supplier-list.html', icon: 'icon-user' },
              ]},
              { id: '7', name: '会员与用户', icon: 'icon-member', children: [
                { id: '7-1', name: '会员等级', url: 'page/member-center/level-list.html', icon: 'icon-member' },
                { id: '7-2', name: '积分管理', url: 'page/member-center/points-list.html', icon: 'icon-category' },
                { id: '7-3', name: '优惠券', url: 'page/member-center/coupon-list.html', icon: 'icon-order' },
                { id: '7-4', name: '充值记录', url: 'page/member-center/recharge-list.html', icon: 'icon-lock' },
                { id: '7-5', name: 'C端用户', url: 'page/user/list.html', icon: 'icon-user' },
              ]},
              { id: '8', name: '数据分析', icon: 'icon-category', children: [
                { id: '8-1', name: '经营报表', url: 'page/report/daily.html', icon: 'icon-order' },
                { id: '8-2', name: '菜品排行', url: 'page/report/dish-ranking.html', icon: 'icon-food' },
                { id: '8-3', name: '支付分析', url: 'page/report/payment-analysis.html', icon: 'icon-lock' },
                { id: '8-4', name: '时段分析', url: 'page/report/time-slot.html', icon: 'icon-category' },
                { id: '8-5', name: '评价管理', url: 'page/report/evaluation-list.html', icon: 'icon-member' },
              ]},
              { id: '9', name: '营销中心', icon: 'icon-category', children: [
                { id: '9-1', name: '智能推荐', url: 'page/recommend/overview.html', icon: 'icon-food' },
                { id: '9-2', name: '营销活动', url: 'page/recommend/campaigns.html', icon: 'icon-category' },
              ]},
              { id: '10', name: '门店管理', icon: 'icon-food', children: [
                { id: '10-1', name: '门店列表', url: 'page/store/list.html', icon: 'icon-food' },
                { id: '10-2', name: '总部控制台', url: 'page/store/dashboard.html', icon: 'icon-lock' },
              ]},
              { id: '11', name: '系统管理', icon: 'icon-category', children: [
                { id: '11-1', name: '员工管理', url: 'page/member/list.html', icon: 'icon-member' },
                { id: '11-2', name: '角色管理', url: 'page/sys/role-list.html', icon: 'icon-member' },
                { id: '11-3', name: '通知模板', url: 'page/sys/template-list.html', icon: 'icon-order' },
                { id: '11-4', name: '系统配置', url: 'page/sys/config-list.html', icon: 'icon-category' },
                { id: '11-5', name: '操作日志', url: 'page/sys/operation-log.html', icon: 'icon-category' },
              ]},
              { id: '12', name: 'AI助手', icon: 'icon-notice', children: [
                { id: '12-1', name: 'AI对话', url: 'page/ai/assistant.html', icon: 'icon-notice' },
                { id: '12-2', name: '模型配置', url: 'page/ai/provider-config.html', icon: 'icon-category' },
              ]},
            ],
            iframeUrl: 'page/dashboard/overview.html',
            headTitle: '数据概览',
            goBackFlag: false,
            loading: true,
            timer: null,
            navHistory: [],  // 导航历史栈，用于返回按钮
            searchKeyword: '',       // 全局搜索关键词
            showSearchDropdown: false, // 搜索下拉框
            searchResults: [],       // 搜索结果
            allMenuItems: []         // 扁平化菜单列表（搜索用）
          }
        },
        computed: {
          breadcrumbs() {
            const crumbs = ['首页']
            const currentItem = this.menuList.find(item =>
              item.children && item.children.some(sub => sub.id === this.menuActived)
            )
            if (currentItem && currentItem.children) {
              crumbs.push(currentItem.name)
              const subItem = currentItem.children.find(sub => sub.id === this.menuActived)
              if (subItem) {
                crumbs.push(subItem.name)
              }
            }
            return crumbs
          }
        },
        created() {
          const userInfo = window.localStorage.getItem('userInfo')
          if (userInfo) {
            this.userInfo = JSON.parse(userInfo)
          }
          this.closeLoading()
        },
        beforeDestroy() {
          this.timer = null
          clearTimeout(this.timer)
          document.removeEventListener('click', this.handleDocumentClick)
        },
        mounted() {
          window.menuHandle = this.menuHandle
          // 构建扁平化菜单索引（用于全局搜索）
          this.buildMenuIndex()
          // 点击外部关闭搜索下拉
          document.addEventListener('click', this.handleDocumentClick)
        },
        methods: {
          logout() {
            logoutApi().then((res)=>{
              if(res.code === 1){
                localStorage.removeItem('userInfo')
                window.location.href = '/backend/page/login/login.html'
              }
            })
          },
          goHome() {
            this.navHistory = []  // 回到首页清空历史
            const homeMenu = this.menuList.find(item => item.id === '1')
            if (homeMenu) {
              this.menuActived = homeMenu.id
              this.iframeUrl = homeMenu.url
              this.headTitle = homeMenu.name
              this.goBackFlag = false
            }
          },
          navigateToBreadcrumb(index) {
            // index 0 = 首页, index 1 = 父菜单, index 2 = 当前子页面
            if (index === 0) {
              this.goHome()
            } else if (index === 1) {
              const currentItem = this.menuList.find(item =>
                item.children && item.children.some(sub => sub.id === this.menuActived)
              )
              if (currentItem && currentItem.children && currentItem.children.length > 0) {
                const firstChild = currentItem.children[0]
                this.menuHandle(firstChild, false)
              }
            }
          },
          // ========== 全局搜索 ==========
          buildMenuIndex() {
            // 扁平化菜单列表，方便搜索
            this.allMenuItems = []
            this.menuList.forEach(parent => {
              if (parent.children && parent.children.length > 0) {
                parent.children.forEach(child => {
                  this.allMenuItems.push({
                    id: child.id,
                    name: child.name,
                    url: child.url,
                    icon: child.icon || parent.icon,
                    parentName: parent.name
                  })
                })
              } else if (parent.url) {
                this.allMenuItems.push({
                  id: parent.id,
                  name: parent.name,
                  url: parent.url,
                  icon: parent.icon,
                  parentName: ''
                })
              }
            })
          },
          filterSearch() {
            const keyword = this.searchKeyword.trim().toLowerCase()
            if (!keyword) {
              this.searchResults = []
              this.showSearchDropdown = false
              return
            }
            this.searchResults = this.allMenuItems.filter(item =>
              item.name.toLowerCase().includes(keyword) ||
              item.parentName.toLowerCase().includes(keyword)
            ).slice(0, 8)  // 最多显示 8 条
            this.showSearchDropdown = this.searchResults.length > 0
          },
          navigateToSearch(item) {
            this.showSearchDropdown = false
            this.searchKeyword = ''
            // 找到对应的菜单项并导航
            const menuItem = { id: item.id, name: item.name, url: item.url }
            this.menuHandle(menuItem, false)
          },
          goToFirstResult() {
            if (this.searchResults.length > 0) {
              this.navigateToSearch(this.searchResults[0])
            }
          },
          closeSearch() {
            this.showSearchDropdown = false
          },
          handleDocumentClick(e) {
            // 如果点击不在搜索组件内，关闭下拉
            const searchEl = document.querySelector('.global-search')
            if (searchEl && !searchEl.contains(e.target)) {
              this.showSearchDropdown = false
            }
          },
          goBack() {
            if (this.navHistory.length > 0) {
              const prev = this.navHistory.pop()
              this.loading = true
              this.menuActived = prev.id
              this.iframeUrl = prev.url
              this.headTitle = prev.name
              this.goBackFlag = this.navHistory.length > 0
              this.closeLoading()
            }
          },
          menuHandle(item, goBackFlag) {
            // 压入导航历史（当前页面）
            if (this.iframeUrl && this.menuActived) {
              this.navHistory.push({
                id: this.menuActived,
                name: this.headTitle,
                url: this.iframeUrl
              })
            }
            this.loading = true
            this.menuActived = item.id
            this.iframeUrl = item.url
            this.headTitle = item.name
            this.goBackFlag = this.navHistory.length > 0
            this.closeLoading()
          },
          closeLoading(){
            this.timer = null
            this.timer = setTimeout(()=>{
              this.loading = false
            },1000)
          },
          toggleSidebar() {
            // 移动端（≤767px）切换抽屉式展开/关闭
            if (window.innerWidth <= 767) {
              this.sidebarOpen = !this.sidebarOpen
              return
            }
            // 桌面端切换折叠/展开
            this.sidebarCollapsed = !this.sidebarCollapsed
          },
          closeSidebar() {
            this.sidebarOpen = false
          }
        }
      })
    </script>
  </body>
</html>
