<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瑞吉外卖管理端</title>
    <link rel="shortcut icon" href="favicon.ico">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="plugins/element-ui/index.css" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <!-- Remix Icon v4.6 — 2700+ 免费商用图标，替代原 iconfont（仅7个图标） -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
      .body{
        /* 修改点：移除 min-width: 1366px 强制宽度，避免窄屏下内部 iframe 内容被裁剪/横向溢出 */
        min-width: 1024px;
      }
      .app-main{
        height: calc(100% - 56px);
      }
      .app-main .divTmp{
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div class="app" id="app">
      <div :class="['app-wrapper', 'clearfix', { 'sidebar-collapsed': sidebarCollapsed }]">
        <!-- 侧边栏遮罩（移动端） -->
        <div class="sidebar-overlay" :class="{ visible: sidebarOpen }" @click="closeSidebar"></div>

        <!-- sidebar -->
        <div class="sidebar-container" :class="{ collapsed: sidebarCollapsed, 'mobile-open': sidebarOpen }">
          <div class="sidebar-logo" @click="goHome()">
            <div class="logo-icon">
              <img src="images/login/login-logo.png" alt="瑞吉外卖" style="width: 36px; height: 36px;" />
            </div>
            <div class="logo-text">
              <span class="logo-brand">瑞吉外卖</span>
              <span class="logo-sub">REGGIE TAKEOUT</span>
            </div>
          </div>

          <div class="sidebar-menu-wrap">
            <el-menu
              :default-active="defAct"
              :unique-opened="false"
              :collapse-transition="false"
              background-color="transparent"
              text-color="#9da3b5"
              active-text-color="#ffc200"
            >
              <div v-for="item in menuList" :key="item.id">
                <el-submenu :index="item.id" v-if="item.children && item.children.length>0">
                  <template slot="title">
                    <i :class="item.icon"></i>
                    <span>{{item.name}}</span>
                  </template>
                  <el-menu-item
                    v-for="sub in item.children"
                    :index="sub.id"
                    :key="sub.id"
                    @click="menuHandle(sub,false)"
                    >
                    <i :class="sub.icon"></i>
                    <span slot="title">{{sub.name}}</span>
                    </el-menu-item
                  >
                </el-submenu>
                <el-menu-item v-else :index="item.id" @click="menuHandle(item,false)">
                  <i :class="item.icon"></i>
                  <span slot="title">{{item.name}}</span>
                </el-menu-item>
              </div>
            </el-menu>
          </div>

          <!-- 折叠切换按钮 -->
          <div class="sidebar-toggle-btn" @click="toggleSidebar" title="收起菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-container">
          <div class="topbar">
            <div class="topbar-left">
              <!-- 汉堡按钮（移动端/折叠切换） -->
              <button class="hamburger-btn" @click="toggleSidebar" title="展开菜单">
                <span></span><span></span><span></span>
              </button>
              <!-- 返回按钮 -->
              <button v-if="goBackFlag" class="back-btn" @click="goBack()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                返回
              </button>
              <!-- 面包屑导航（同时作为页面标题，最后一级不再重复显示） -->
              <div class="breadcrumb" v-if="breadcrumbs.length > 0">
                <template v-for="(crumb, index) in breadcrumbs">
                  <span v-if="index > 0" class="crumb-sep">/</span>
                  <span :class="['crumb-item', { clickable: index < breadcrumbs.length - 1, 'crumb-current': index === breadcrumbs.length - 1 }]"
                        @click="index < breadcrumbs.length - 1 && navigateToBreadcrumb(index)">
                    {{ crumb }}
                  </span>
                </template>
              </div>
            </div>
            <div class="topbar-right">
              <div class="user-info">
                <div class="user-avatar">{{ userInfo.name ? userInfo.name.charAt(0) : '管' }}</div>
                <span class="user-name">{{ userInfo.name }}</span>
              </div>
              <button class="logout-btn" @click="logout" title="退出登录">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="app-main" v-loading="loading">
            <div class="divTmp" v-show="loading"></div>
            <!-- 修改点：移除 height="auto"（浏览器不识别），添加 scrolling="yes" 让 iframe 内部页面自行滚动；高度由 JS 控制为 window.innerHeight - 56（视口 - 顶栏） -->
            <iframe
              id="cIframe"
              class="c_iframe"
              name="cIframe"
              :src="iframeUrl"
              width="100%"
              scrolling="yes"
              frameborder="0"
              v-show="!loading"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="plugins/axios/axios.min.js"></script>
    <script src="js/request.js"></script>
    <script src="./api/login.js"></script>
    <script>

      new Vue({
        el: '#app',
        data() {
          return {
            defAct: '1',
            menuActived: '1',
            userInfo: {},
            sidebarCollapsed: false,
            sidebarOpen: false,
            menuList: [
              { id: '1', name: '数据概览', url: 'page/dashboard/overview.html', icon: 'ri-dashboard-line' },
              { id: '2', name: '商品管理', icon: 'ri-shopping-bag-3-line', children: [
                { id: '2-1', name: '分类管理', url: 'page/category/list.html', icon: 'ri-apps-2-line' },
                { id: '2-2', name: '菜品管理', url: 'page/food/list.html', icon: 'ri-restaurant-2-line' },
                { id: '2-3', name: '套餐管理', url: 'page/combo/list.html', icon: 'ri-stack-line' },
              ]},
              { id: '3', name: '订单管理', icon: 'ri-file-list-3-line', children: [
                { id: '3-1', name: '订单明细', url: 'page/order/list.html', icon: 'ri-file-list-3-line' },
                { id: '3-2', name: '支付管理', url: 'page/payment/order-list.html', icon: 'ri-money-dollar-circle-line' },
                { id: '3-3', name: '打印配置', url: 'page/printer/config-list.html', icon: 'ri-printer-line' },
                { id: '3-4', name: '打印日志', url: 'page/printer/log-list.html', icon: 'ri-file-history-line' },
              ]},
              { id: '4', name: '外卖配送', icon: 'ri-motorbike-line', children: [
                { id: '4-1', name: '配送订单', url: 'page/delivery/order-list.html', icon: 'ri-map-pin-line' },
              ]},
              { id: '5', name: '堂食管理', icon: 'ri-store-2-line', children: [
                { id: '5-1', name: '桌台管理', url: 'page/dining/table-list.html', icon: 'ri-layout-grid-line' },
                { id: '5-2', name: '区域管理', url: 'page/dining/area-list.html', icon: 'ri-map-pin-2-line' },
                { id: '5-3', name: '排队管理', url: 'page/dining/queue-list.html', icon: 'ri-ticket-line' },
                { id: '5-4', name: '预订管理', url: 'page/dining/reservation-list.html', icon: 'ri-calendar-check-line' },
              ]},
              { id: '6', name: '进销存', icon: 'ri-archive-line', children: [
                { id: '6-1', name: '原料管理', url: 'page/inventory/material-list.html', icon: 'ri-leaf-line' },
                { id: '6-2', name: '库存盘点', url: 'page/inventory/stock-check.html', icon: 'ri-check-double-line' },
                { id: '6-3', name: '库存流水', url: 'page/inventory/stock-record.html', icon: 'ri-route-line' },
                { id: '6-4', name: '采购管理', url: 'page/inventory/purchase-list.html', icon: 'ri-shopping-cart-2-line' },
                { id: '6-5', name: '供应商管理', url: 'page/inventory/supplier-list.html', icon: 'ri-truck-line' },
              ]},
              { id: '7', name: '会员与用户', icon: 'ri-group-line', children: [
                { id: '7-1', name: '会员等级', url: 'page/member-center/level-list.html', icon: 'ri-vip-crown-line' },
                { id: '7-2', name: '积分管理', url: 'page/member-center/points-list.html', icon: 'ri-coin-line' },
                { id: '7-3', name: '优惠券', url: 'page/member-center/coupon-list.html', icon: 'ri-coupon-line' },
                { id: '7-4', name: '充值记录', url: 'page/member-center/recharge-list.html', icon: 'ri-bank-card-line' },
                { id: '7-5', name: 'C端用户', url: 'page/user/list.html', icon: 'ri-user-3-line' },
              ]},
              { id: '8', name: '数据分析', icon: 'ri-bar-chart-line', children: [
                { id: '8-1', name: '经营报表', url: 'page/report/daily.html', icon: 'ri-line-chart-line' },
                { id: '8-2', name: '菜品排行', url: 'page/report/dish-ranking.html', icon: 'ri-trophy-line' },
                { id: '8-3', name: '支付分析', url: 'page/report/payment-analysis.html', icon: 'ri-funds-line' },
                { id: '8-4', name: '时段分析', url: 'page/report/time-slot.html', icon: 'ri-time-line' },
                { id: '8-5', name: '评价管理', url: 'page/report/evaluation-list.html', icon: 'ri-star-line' },
              ]},
              { id: '9', name: '营销中心', icon: 'ri-megaphone-line', children: [
                { id: '9-1', name: '智能推荐', url: 'page/recommend/overview.html', icon: 'ri-lightbulb-flash-line' },
                { id: '9-2', name: '营销活动', url: 'page/recommend/campaigns.html', icon: 'ri-flag-line' },
              ]},
              { id: '10', name: '门店管理', icon: 'ri-building-4-line', children: [
                { id: '10-1', name: '门店列表', url: 'page/store/list.html', icon: 'ri-store-line' },
                { id: '10-2', name: '总部控制台', url: 'page/store/dashboard.html', icon: 'ri-dashboard-3-line' },
              ]},
              { id: '11', name: '系统管理', icon: 'ri-settings-3-line', children: [
                { id: '11-1', name: '员工管理', url: 'page/member/list.html', icon: 'ri-user-settings-line' },
                { id: '11-2', name: '角色管理', url: 'page/sys/role-list.html', icon: 'ri-shield-user-line' },
                { id: '11-3', name: '通知模板', url: 'page/sys/template-list.html', icon: 'ri-message-2-line' },
                { id: '11-4', name: '系统配置', url: 'page/sys/config-list.html', icon: 'ri-tools-line' },
                { id: '11-5', name: '操作日志', url: 'page/sys/operation-log.html', icon: 'ri-file-list-2-line' },
              ]},
              { id: '12', name: 'AI助手', icon: 'ri-robot-3-line', children: [
                { id: '12-1', name: 'AI对话', url: 'page/ai/assistant.html', icon: 'ri-chat-3-line' },
                { id: '12-2', name: '模型配置', url: 'page/ai/provider-config.html', icon: 'ri-cpu-line' },
              ]},
            ],
            iframeUrl: 'page/dashboard/overview.html',
            headTitle: '数据概览',
            goBackFlag: false,
            loading: true,
            timer: null,
            navHistory: [],  // 导航历史栈，用于返回按钮
          }
        },
        computed: {
          breadcrumbs() {
            const crumbs = ['首页']
            const currentItem = this.menuList.find(item =>
              item.children && item.children.some(sub => sub.id === this.menuActived)
            )
            if (currentItem && currentItem.children) {
              crumbs.push(currentItem.name)
              const subItem = currentItem.children.find(sub => sub.id === this.menuActived)
              if (subItem) {
                crumbs.push(subItem.name)
              }
            }
            return crumbs
          }
        },
        created() {
          const userInfo = window.localStorage.getItem('userInfo')
          if (userInfo) {
            this.userInfo = JSON.parse(userInfo)
          }
          this.closeLoading()
        },
        mounted() {
          // 修改点：将菜单数据与处理方法暴露到全局，供 iframe 内页面通过 window.parent 调用
          window.menuList = this.menuList
          window.menuHandle = this.menuHandle
          // 修改点：监听窗口尺寸变化与 iframe 内容加载完成事件，动态调整 iframe 高度避免内容被裁剪
          this.initIframeAutoHeight()
        },
        methods: {
          logout() {
            logoutApi().then((res)=>{
              if(res.code === 1){
                localStorage.removeItem('userInfo')
                window.location.href = '/backend/page/login/login.html'
              }
            })
          },
          goHome() {
            this.navHistory = []  // 回到首页清空历史
            const homeMenu = this.menuList.find(item => item.id === '1')
            if (homeMenu) {
              this.menuActived = homeMenu.id
              this.iframeUrl = homeMenu.url
              this.headTitle = homeMenu.name
              this.goBackFlag = false
            }
          },
          navigateToBreadcrumb(index) {
            // index 0 = 首页, index 1 = 父菜单, index 2 = 当前子页面
            if (index === 0) {
              this.goHome()
            } else if (index === 1) {
              const currentItem = this.menuList.find(item =>
                item.children && item.children.some(sub => sub.id === this.menuActived)
              )
              if (currentItem && currentItem.children && currentItem.children.length > 0) {
                const firstChild = currentItem.children[0]
                this.menuHandle(firstChild, false)
              }
            }
          },
          goBack() {
            if (this.navHistory.length > 0) {
              const prev = this.navHistory.pop()
              this.loading = true
              this.menuActived = prev.id
              this.iframeUrl = prev.url
              this.headTitle = prev.name
              this.goBackFlag = this.navHistory.length > 0
              this.closeLoading()
            }
          },
          menuHandle(item, goBackFlag) {
            // 压入导航历史（当前页面）
            if (this.iframeUrl && this.menuActived) {
              this.navHistory.push({
                id: this.menuActived,
                name: this.headTitle,
                url: this.iframeUrl
              })
            }
            this.loading = true
            this.menuActived = item.id
            this.iframeUrl = item.url
            this.headTitle = item.name
            this.goBackFlag = this.navHistory.length > 0
            this.closeLoading()
          },
          closeLoading(){
            this.timer = null
            this.timer = setTimeout(()=>{
              this.loading = false
            },1000)
          },
          toggleSidebar() {
            // 移动端（≤767px）切换抽屉式展开/关闭
            if (window.innerWidth <= 767) {
              this.sidebarOpen = !this.sidebarOpen
              return
            }
            // 桌面端切换折叠/展开
            this.sidebarCollapsed = !this.sidebarCollapsed
          },
          closeSidebar() {
            this.sidebarOpen = false
          },
          // ========== iframe 高度自适应（修改点：iframe 高度 = 视口高 - 顶栏，由 iframe 自身滚动） ==========
          initIframeAutoHeight() {
            const iframe = document.getElementById('cIframe')
            if (!iframe) return
            // iframe 内容加载完成后调整高度
            iframe.addEventListener('load', () => {
              this.resizeIframe()
            })
            // 监听窗口大小变化，重新计算
            window.addEventListener('resize', () => {
              this.resizeIframe()
            })
            // 初始计算一次
            this.resizeIframe()
          },
          resizeIframe() {
            const iframe = document.getElementById('cIframe')
            if (!iframe) return
            // 修改点：iframe 高度固定为视口高 - 顶栏(56px)，内部页面自身 body 负责滚动
            // 不再取内容 scrollHeight（那会导致 iframe 撑高超高但被外层 overflow:hidden 裁剪）
            iframe.style.height = (window.innerHeight - 56) + 'px'
          }
        },
        beforeDestroy() {
          this.timer = null
          clearTimeout(this.timer)
        }
      })
    </script>
  </body>
</html>
