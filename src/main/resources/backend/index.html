<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瑞吉外卖管理端</title>
    <link rel="shortcut icon" href="favicon.ico">
    <!-- 引入样式 -->
    <!-- 修改点(2026-09-01)：移除 plugins/element-ui/index.css 官方样式表 ——
         与 common.css（→common-el.css，token 化副本）重复加载，统一由后者单源提供 -->
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/design-system.css" />
    <!-- Remix Icon v4.6 — 2700+ 免费商用图标，替代原 iconfont（仅7个图标） -->
    <link href="plugins/remixicon/remixicon.css" rel="stylesheet" />
    <style>
      .app-main{
        height: calc(100% - 56px);
      }
      .app-main .divTmp{
        width: 100%;
        height: 100%;
      }
      /* 修改点：顶栏面包屑直接内嵌，避免外部 CSS 缓存/未加载导致样式不生效 */
      .topbar .breadcrumb {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0;
        padding: 0;
        border: none;
        font-size: 14px;
        line-height: 1;
      }
      .topbar .crumb-item,
      .topbar .crumb-current {
        display: inline-flex;
        align-items: center;
        margin: 0;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1;
        transition: all 0.2s ease;
      }
      .topbar .crumb-item {
        color: var(--color-gray-500);
        cursor: default;
      }
      .topbar .crumb-item.clickable {
        cursor: pointer;
      }
      .topbar .crumb-item.clickable:hover {
        color: var(--color-warning-dark); /* #b45309 最接近 --color-warning-dark (#b88219)，语义均为深橙色文字 */
        background: var(--amber-100);
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }
      .topbar .crumb-current {
        color: var(--text-primary);
        font-weight: 600;
        background: var(--color-gray-100);
      }
      .topbar .crumb-sep {
        color: var(--color-gray-300);
        font-size: 12px;
        line-height: 1;
        user-select: none;
        margin: 0 2px;
      }
    </style>
  </head>

  <body>
    <div class="app" id="app">
      <div :class="['app-wrapper', 'clearfix', { 'sidebar-collapsed': sidebarCollapsed }]">
        <!-- 侧边栏遮罩（移动端） -->
        <div class="sidebar-overlay" :class="{ visible: sidebarOpen }" @click="closeSidebar"></div>

        <!-- sidebar -->
        <div class="sidebar-container" :class="{ collapsed: sidebarCollapsed, 'mobile-open': sidebarOpen }">
          <div class="sidebar-logo" @click="goHome()">
            <div class="logo-icon">
              <img src="images/login/login-logo.png" alt="瑞吉外卖" style="width: 36px; height: 36px;" />
            </div>
            <div class="logo-text">
              <span class="logo-brand">瑞吉外卖</span>
              <span class="logo-sub">REGGIE TAKEOUT</span>
            </div>
          </div>

          <div class="sidebar-menu-wrap">
            <el-menu
              :default-active="defAct"
              :unique-opened="false"
              :collapse-transition="false"
              background-color="transparent"
              :text-color="menuTextColor"
              :active-text-color="menuActiveColor"
            >
              <div v-for="item in menuList" :key="item.id">
                <el-submenu :index="item.id" v-if="item.children && item.children.length>0">
                  <template slot="title">
                    <i :class="item.icon"></i>
                    <span>{{item.name}}</span>
                  </template>
                  <el-menu-item
                    v-for="sub in item.children"
                    :index="sub.id"
                    :key="sub.id"
                    @click="menuHandle(sub,false)"
                    >
                    <i :class="sub.icon"></i>
                    <span slot="title">{{sub.name}}</span>
                    </el-menu-item
                  >
                </el-submenu>
                <el-menu-item v-else :index="item.id" @click="menuHandle(item,false)">
                  <i :class="item.icon"></i>
                  <span slot="title">{{item.name}}</span>
                </el-menu-item>
              </div>
            </el-menu>
          </div>

          <!-- 折叠切换按钮 -->
          <div class="sidebar-toggle-btn" @click="toggleSidebar" title="收起菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-container">
          <div class="topbar">
            <div class="topbar-left">
              <!-- 汉堡按钮（移动端/折叠切换） -->
              <button class="hamburger-btn" @click="toggleSidebar" title="展开菜单">
                <span></span><span></span><span></span>
              </button>
              <!-- 返回按钮 -->
              <button v-if="goBackFlag" class="back-btn" @click="goBack()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                返回
              </button>
              <!-- 面包屑导航（同时作为页面标题，最后一级不再重复显示） -->
              <div class="breadcrumb" v-if="breadcrumbs.length > 0">
                <template v-for="(crumb, index) in breadcrumbs">
                  <span v-if="index > 0" class="crumb-sep">/</span>
                  <span :class="['crumb-item', { clickable: index < breadcrumbs.length - 1, 'crumb-current': index === breadcrumbs.length - 1 }]"
                        @click="index < breadcrumbs.length - 1 && navigateToBreadcrumb(index)">
                    {{ crumb }}
                  </span>
                </template>
              </div>
            </div>
            <div class="topbar-right">
              <div class="user-info">
                <div class="user-avatar">{{ userInfo.name ? userInfo.name.charAt(0) : '管' }}</div>
                <span class="user-name">{{ userInfo.name }}</span>
              </div>
              <button class="logout-btn" @click="logout" title="退出登录">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="app-main" v-loading="loading">
            <div class="divTmp" v-show="loading"></div>
            <!-- 修改点：移除 height="auto"（浏览器不识别），添加 scrolling="yes" 让 iframe 内部页面自行滚动；高度由 JS 控制为 window.innerHeight - 56（视口 - 顶栏） -->
            <!-- 修改点：添加 sandbox 属性限制iframe权限，防止恶意页面执行敏感操作
                 allow-same-origin: 允许同域访问（因为iframe加载的是同域页面）
                 allow-scripts: 允许执行脚本（页面需要Vue等JS运行）
                 allow-forms: 允许提交表单
                 allow-popups: 允许弹出窗口（window.open）
                 allow-downloads: 允许下载文件（★必需，缺失则导出功能不可用★）
                   说明：iframe 一旦带 sandbox 属性，从该框架发起的下载会被浏览器阻止，
                   Chrome 控制台报 "Download was blocked because the frame initiating
                   it is sandboxed and does not have the 'allow-downloads' flag set."。
                   注意 allow-popups 只管 window.open 弹窗，管不了 <a download> /
                   createObjectURL 下载 —— 此前误以为它能覆盖下载，导致导出接口后端
                   已正常生成文件（日志可见"文件下载响应构建完成"）但浏览器就是不下载。
                 注意：不添加 allow-top-navigation，防止iframe内页面跳转顶层窗口绕过登录校验 -->
            <iframe
              id="cIframe"
              class="c_iframe"
              name="cIframe"
              :src="iframeUrl"
              width="100%"
              scrolling="yes"
              frameborder="0"
              sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads"
              v-show="!loading"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="plugins/axios/axios.min.js"></script>
    <script src="js/request.js"></script>
    <script src="js/components.js"></script>
    <script src="./api/login.js"></script>
    <script>

      new Vue({
        el: '#app',
        data() {
          return {

            sidebarCollapsed: false,

                { id: '3-2', name: '支付管理', url: 'page/payment/order-list.html', icon: 'ri-money-dollar-circle-line' },
                { id: '3-3', name: '收银台', url: 'page/cashier/index.html', icon: 'ri-money-cny-circle-line' },
                { id: '3-4', name: '收银日结', url: 'page/cashier/daily-settlement.html', icon: 'ri-calendar-check-line' },
                { id: '3-5', name: '配送订单', url: 'page/delivery/order-list.html', icon: 'ri-map-pin-line' },
                { id: '3-6', name: '配送范围', url: 'page/delivery/range-management.html', icon: 'ri-road-map-line' },
                { id: '3-7', name: '平台接入配置', url: 'page/platform/config.html', icon: 'ri-settings-3-line' },
                { id: '3-8', name: '平台订单', url: 'page/platform/order-list.html', icon: 'ri-list-check-2' },
                { id: '3-9', name: '商品映射', url: 'page/platform/dish-mapping.html', icon: 'ri-price-tag-3-line' },
                { id: '3-10', name: '打印终端', url: 'page/printer/terminal-list.html', icon: 'ri-printer-line' },
                { id: '3-11', name: '打印任务', url: 'page/printer/task-list.html', icon: 'ri-file-history-line' },
                { id: '3-12', name: '紧急催菜', url: 'page/urgency/urgency.html', icon: 'ri-alarm-warning-line' },
                { id: '3-13', name: '未接单监控', url: 'page/order/pending-monitor.html', icon: 'ri-radar-line' },
              ]},
              { id: '4', name: '堂食管理', icon: 'ri-store-2-line', children: [
                { id: '4-1', name: '桌台管理', url: 'page/dining/table-list.html', icon: 'ri-layout-grid-line' },

                { id: '4-4', name: '预订管理', url: 'page/dining/reservation-list.html', icon: 'ri-calendar-check-line' },
              ]},
              { id: '5', name: '进销存', icon: 'ri-archive-line', children: [

                { id: '5-3', name: '库存盘点', url: 'page/inventory/stock-check.html', icon: 'ri-check-double-line' },
                { id: '5-4', name: '库存流水', url: 'page/inventory/stock-record.html', icon: 'ri-route-line' },
                { id: '5-5', name: '采购管理', url: 'page/inventory/purchase-list.html', icon: 'ri-shopping-cart-2-line' },
                { id: '5-6', name: '供应商管理', url: 'page/inventory/supplier-list.html', icon: 'ri-truck-line' },
                { id: '5-7', name: '库存预警', url: 'page/inventory/material-warning.html', icon: 'ri-alert-line' },
              ]},
              { id: '6', name: '会员与用户', icon: 'ri-group-line', children: [
                { id: '6-1', name: '会员等级', url: 'page/member-center/level-list.html', icon: 'ri-vip-crown-line' },
                { id: '6-2', name: '会员列表', url: 'page/member-center/member-list.html', icon: 'ri-user-star-line' },
                { id: '6-3', name: '积分管理', url: 'page/member-center/points-list.html', icon: 'ri-coin-line' },
                { id: '6-4', name: '优惠券', url: 'page/member-center/coupon-list.html', icon: 'ri-coupon-line' },
                { id: '6-5', name: '充值记录', url: 'page/member-center/recharge-list.html', icon: 'ri-bank-card-line' },
                { id: '6-6', name: 'C端用户', url: 'page/user/list.html', icon: 'ri-user-3-line' },
                { id: '6-7', name: '会员挽留', url: 'page/retention/retention.html', icon: 'ri-heart-line' },
              ]},
              { id: '7', name: '经营分析', icon: 'ri-bar-chart-line', children: [

                { id: '7-3', name: '销售报表', url: 'page/report/sales-report.html', icon: 'ri-bar-chart-grouped-line' },
                { id: '7-4', name: '菜品排行', url: 'page/report/dish-ranking.html', icon: 'ri-trophy-line' },
                { id: '7-5', name: '支付分析', url: 'page/report/payment-analysis.html', icon: 'ri-wallet-line' },
                { id: '7-6', name: '时段分析', url: 'page/report/time-slot.html', icon: 'ri-time-line' },
                { id: '7-7', name: '评价管理', url: 'page/report/evaluation-list.html', icon: 'ri-star-line' },
                { id: '7-8', name: '智能推荐', url: 'page/recommend/overview.html', icon: 'ri-lightbulb-flash-line' },

                { id: '7-10', name: '菜品成本', url: 'page/cost/dish-cost.html', icon: 'ri-restaurant-line' },
                { id: '7-11', name: '提现管理', url: 'page/finance/withdrawal.html', icon: 'ri-bank-card-2-line' },
                { id: '7-12', name: '导出中心', url: 'page/export/index.html', icon: 'ri-file-download-line' },
                { id: '7-13', name: '发票管理', url: 'page/finance/invoice-list.html', icon: 'ri-receipt-line' },
              ]},
              { id: '8', name: '营销与门店', icon: 'ri-megaphone-line', children: [
                { id: '8-1', name: '营销活动', url: 'page/marketing/index.html', icon: 'ri-flag-line' },
                { id: '8-2', name: '加盟商', url: 'page/franchise/franchisee-list.html', icon: 'ri-user-star-line' },
                { id: '8-3', name: '加盟合同', url: 'page/franchise/contract-list.html', icon: 'ri-file-list-3-line' },
                { id: '8-4', name: '分账结算', url: 'page/franchise/settlement-list.html', icon: 'ri-bank-card-line' },
                { id: '8-5', name: '门店列表', url: 'page/store/list.html', icon: 'ri-store-line' },
                { id: '8-6', name: '总部控制台', url: 'page/store/dashboard.html', icon: 'ri-dashboard-3-line' },
              ]},
              { id: '9', name: '系统管理', icon: 'ri-settings-3-line', children: [
                { id: '9-1', name: '员工管理', url: 'page/member/list.html', icon: 'ri-user-settings-line' },
                { id: '9-2', name: '角色管理', url: 'page/sys/role-list.html', icon: 'ri-shield-user-line' },
                { id: '9-3', name: '通知模板', url: 'page/sys/template-list.html', icon: 'ri-message-2-line' },
                { id: '9-4', name: '系统配置', url: 'page/sys/config-list.html', icon: 'ri-tools-line' },
                { id: '9-5', name: '操作日志', url: 'page/sys/operation-log.html', icon: 'ri-file-list-2-line' },
                { id: '9-6', name: '地区管理', url: 'page/region/list.html', icon: 'ri-map-2-line' },
                { id: '9-7', name: '消息通知', url: 'page/notification/list.html', icon: 'ri-notification-3-line' },
                { id: '9-8', name: '客服管理', url: 'page/customer-service/list.html', icon: 'ri-customer-service-2-line' },
                { id: '9-9', name: '考勤管理', url: 'page/attendance/attendance.html', icon: 'ri-calendar-check-line' },
                { id: '9-10', name: '排班管理', url: 'page/schedule/schedule.html', icon: 'ri-calendar-2-line' },
                { id: '9-11', name: 'AI对话', url: 'page/ai/assistant.html', icon: 'ri-chat-3-line' },
                { id: '9-12', name: '模型配置', url: 'page/ai/provider-config.html', icon: 'ri-cpu-line' },
              ]},
            ],
            iframeUrl: 'page/dashboard/overview.html',
            headTitle: '数据概览',
            goBackFlag: false,
            loading: true,
            timer: null,
            navHistory: [],  // 导航历史栈，用于返回按钮
          }
        },
        computed: {
          breadcrumbs() {
            const crumbs = ['首页']
            const currentItem = this.menuList.find(item =>
              item.children && item.children.some(sub => sub.id === this.menuActived)
            )
            if (currentItem && currentItem.children) {
              crumbs.push(currentItem.name)
              const subItem = currentItem.children.find(sub => sub.id === this.menuActived)
              if (subItem) {
                crumbs.push(subItem.name)
              }
            }
            return crumbs
          }
        },
        created() {
          // 修改点(2026-08-12)：登录态预检——未登录直接整页跳转登录页，
          // 从根上避免「未登录直接打开 index.html 时右侧 iframe 嵌套出登录页」的问题
          const userInfo = window.localStorage.getItem('userInfo')
          if (!userInfo) {
            window.location.replace('/backend/page/login/login.html')
            return
          }
          this.userInfo = JSON.parse(userInfo)
          this.closeLoading()
        },
        mounted() {
          // 修改点：将菜单数据与处理方法暴露到全局，供 iframe 内页面通过 window.parent 调用
          window.menuList = this.menuList
          window.menuHandle = this.menuHandle
          // 修改点(2026-08-12)：监听子页面发来的未登录信号，统一由顶层窗口跳转登录页，
          // 防止登录页被嵌套在 iframe（数据区）内
          window.addEventListener('message', this.handleChildNotLogin)
          // 修改点：监听窗口尺寸变化与 iframe 内容加载完成事件，动态调整 iframe 高度避免内容被裁剪
          this.initIframeAutoHeight()
        },
        methods: {
          logout() {
            logoutApi().then((res)=>{
              if(res.code === 1){
                localStorage.removeItem('userInfo')
                window.location.href = '/backend/page/login/login.html'
              }
            })
          },
          // 修改点(2026-08-12)：接收子页面（iframe）发来的未登录信号，由顶层窗口统一跳转登录页
          handleChildNotLogin(event) {
            if (event && event.data && event.data.type === 'REGGIE_NOTLOGIN') {
              window.location.replace('/backend/page/login/login.html')
            }
          },
          goHome() {
            this.navHistory = []  // 回到首页清空历史
            const homeMenu = this.menuList.find(item => item.id === '1')
            if (homeMenu) {
              this.menuActived = homeMenu.id
              this.iframeUrl = homeMenu.url
              this.headTitle = homeMenu.name
              this.goBackFlag = false
            }
          },
          navigateToBreadcrumb(index) {
            // index 0 = 首页, index 1 = 父菜单, index 2 = 当前子页面
            if (index === 0) {
              this.goHome()
            } else if (index === 1) {
              const currentItem = this.menuList.find(item =>
                item.children && item.children.some(sub => sub.id === this.menuActived)
              )
              if (currentItem && currentItem.children && currentItem.children.length > 0) {
                // 修改点：定位当前活跃子项，而非总是跳 children[0]（如"菜品管理"→点父级不再跳到"分类管理"）
                const activeChild = currentItem.children.find(sub => sub.id === this.menuActived)
                                    || currentItem.children[0]
                this.menuHandle(activeChild, false)
              }
            }
          },
          goBack() {
            if (this.navHistory.length > 0) {
              const prev = this.navHistory.pop()
              this.loading = true
              this.menuActived = prev.id
              this.iframeUrl = prev.url
              this.headTitle = prev.name
              this.goBackFlag = this.navHistory.length > 0
              this.closeLoading()
            }
          },
          menuHandle(item, goBackFlag) {
            // 压入导航历史（当前页面）
            if (this.iframeUrl && this.menuActived) {
              this.navHistory.push({
                id: this.menuActived,
                name: this.headTitle,
                url: this.iframeUrl
              })
            }
            this.loading = true
            this.menuActived = item.id
            this.iframeUrl = item.url
            this.headTitle = item.name
            this.goBackFlag = this.navHistory.length > 0
            this.closeLoading()
          },
          closeLoading(){
            this.timer = null
            this.timer = setTimeout(()=>{
              this.loading = false
            },1000)
          },
          toggleSidebar() {
            // 移动端（≤767px）切换抽屉式展开/关闭
            if (window.innerWidth <= 767) {
              this.sidebarOpen = !this.sidebarOpen
              return
            }
            // 桌面端切换折叠/展开
            this.sidebarCollapsed = !this.sidebarCollapsed
          },
          closeSidebar() {
            this.sidebarOpen = false
          },
          // ========== iframe 高度自适应（修改点：iframe 高度 = 视口高 - 顶栏，由 iframe 自身滚动） ==========
          initIframeAutoHeight() {
            const iframe = document.getElementById('cIframe')
            if (!iframe) return
            // iframe 内容加载完成后调整高度
            iframe.addEventListener('load', () => {
              this.resizeIframe()
            })
            // 监听窗口大小变化，重新计算
            window.addEventListener('resize', () => {
              this.resizeIframe()
            })
            // 初始计算一次
            this.resizeIframe()
          },
          resizeIframe() {
            const iframe = document.getElementById('cIframe')
            if (!iframe) return
            // 修改点：iframe 高度固定为视口高 - 顶栏(56px)，内部页面自身 body 负责滚动
            // 不再取内容 scrollHeight（那会导致 iframe 撑高超高但被外层 overflow:hidden 裁剪）
            iframe.style.height = (window.innerHeight - 56) + 'px'
          }
        },
        beforeDestroy() {
          this.timer = null
          clearTimeout(this.timer)
        }
      })
    </script>
  </body>
</html>
