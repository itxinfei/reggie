<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订阅 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
</head>
<body>
<a href="#main-content" class="skip-link">跳转到主内容</a>
<div class="dashboard-container" id="billing-sub-app">
  <div class="container" id="main-content" role="main" aria-label="页面主要内容">
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title">订阅与权益</h1>
        <p class="ds-page-header__subtitle">查看当前套餐权益、订购/续费，续费将在现有到期时间上顺延，不浪费剩余天数</p>
      </div>
    </header>

    <!-- 当前权益 -->
    <el-card shadow="never" class="ds-card entitlement-card">
      <div slot="header" class="ent-header">
        <span class="ent-title">当前权益</span>
        <el-tag v-if="ent.active" type="success" size="medium">生效中 · {{ ent.planName || '—' }}</el-tag>
        <el-tag v-else type="danger" size="medium">未开通 / 已到期</el-tag>
      </div>
      <stat-cards :cards="entCards"></stat-cards>
      <div class="ent-meta" v-if="ent.active">
        <span>有效期：{{ ent.startTime || '—' }} 至 {{ ent.endTime || '—' }}</span>
      </div>
    </el-card>

    <!-- 订阅记录 -->
    <table-bar
      :search-items="searchConfig"
      :actions="barActions"
      @search="onSearch"
      @reset="onReset"
      @action="onAction"
    ></table-bar>

    <el-card shadow="never" class="ds-card">
      <crud-table
        v-if="loading || tableData.length > 0"
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="200"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-billingCycle="{ row }">
          <el-tag size="mini" :type="row.billingCycle === 2 ? 'success' : ''">{{ cycleText(row.billingCycle) }}</el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag size="mini" :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <template v-if="row.status === 0">
            <el-button size="mini" type="text" @click="payOrder(row)">支付</el-button>
            <el-button size="mini" type="text" class="danger-link" @click="cancelOrder(row)">取消</el-button>
          </template>
          <template v-else-if="row.status === 1">
            <el-button size="mini" type="text" @click="openRenew(row)">续费</el-button>
            <el-button size="mini" type="text" class="danger-link" @click="cancelOrder(row)">退订</el-button>
          </template>
          <span v-else class="ds-text-secondary">—</span>
        </template>
      </crud-table>
      <div v-if="!loading && tableData.length === 0" class="ds-empty">暂无订阅记录，点击上方「开通/续费」选择套餐</div>
    </el-card>

    <!-- 平台运营（跨租户）：后端 @RequiresAdmin 鉴权，非超管调用会被拒绝 -->
    <el-card shadow="never" class="ds-card admin-card">
      <el-collapse v-model="adminActive">
        <el-collapse-item title="平台运营（跨租户订阅管理，仅超级管理员可用）" name="admin">
          <div class="admin-toolbar">
            <el-input v-model="adminTenantId" placeholder="按租户ID筛选" clearable style="width:180px;" size="small"></el-input>
            <el-select v-model="adminStatus" placeholder="状态" clearable size="small" style="width:140px;">
              <el-option label="待支付" :value="0"></el-option>
              <el-option label="生效中" :value="1"></el-option>
              <el-option label="已过期" :value="2"></el-option>
              <el-option label="已取消" :value="3"></el-option>
            </el-select>
            <el-button size="small" type="primary" @click="loadAdmin(1)">查询</el-button>
            <el-button size="small" type="warning" @click="runExpire">执行过期扫描</el-button>
          </div>
          <el-table :data="adminData" border stripe size="small" style="margin-top:10px;">
            <el-table-column prop="tenantId" label="租户ID" width="90"></el-table-column>
            <el-table-column prop="orderNo" label="订单号" min-width="180"></el-table-column>
            <el-table-column prop="planName" label="套餐" min-width="120"></el-table-column>
            <el-table-column label="周期" width="80">
              <template slot-scope="s">{{ cycleText(s.row.billingCycle) }}</template>
            </el-table-column>
            <el-table-column label="状态" width="90">
              <template slot-scope="s">
                <el-tag size="mini" :type="statusType(s.row.status)">{{ statusText(s.row.status) }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="endTime" label="到期时间" min-width="160"></el-table-column>
          </el-table>
          <el-pagination
            background layout="total, prev, pager, next"
            :total="adminCounts" :current-page.sync="adminPage"
            @current-change="loadAdmin" style="margin-top:10px;"></el-pagination>
        </el-collapse-item>
      </el-collapse>
    </el-card>

    <!-- 开通/续费对话框 -->
    <crud-dialog :title="dialogTitle" :visible.sync="dialogVisible" size="md"
      :close-on-click-modal="false" :submit-loading="submitting" @submit="submit">
      <el-form :model="form" :rules="formRules" ref="formRef" label-width="100px">
        <el-form-item label="套餐" prop="planId">
          <el-select v-model="form.planId" placeholder="请选择套餐" style="width:100%;" @change="onPlanChange">
            <el-option v-for="p in planOptions" :key="p.id" :label="p.planName + '（门店' + limitLabel(p.maxStores) + '/员工' + limitLabel(p.maxEmployees) + '）'" :value="p.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="计费周期" prop="billingCycle">
          <el-radio-group v-model="form.billingCycle" @change="onPlanChange">
            <el-radio-button :label="1">月付</el-radio-button>
            <el-radio-button :label="2">年付</el-radio-button>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="应付金额">
          <span class="price-preview">¥{{ previewAmount }}</span>
          <span class="ds-text-secondary" v-if="form.billingCycle === 2">（年付享年价）</span>
        </el-form-item>
        <el-form-item label="支付方式">
          <el-select v-model="form.payChannel" style="width:100%;">
            <el-option label="线下转账（确认到账后开通）" value="OFFLINE"></el-option>
            <el-option label="模拟支付（演示立即开通）" value="MOCK"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="form.remark" maxlength="200"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button size="medium" @click="dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" :loading="submitting" @click="submit">提交并支付</el-button>
      </template>
    </crud-dialog>
  </div>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/components.js?v=20260913b"></script>
<script src="../../api/billing.js"></script>
<script>
  new Vue({
    el: '#billing-sub-app',
    mixins: [window.ReggieListMixin],
    data() {
      return {
        tableData: [],
        ent: { active: false, daysRemaining: 0, maxStores: null, maxEmployees: null },
        searchValues: {},
        searchConfig: [
          { type: 'select', field: 'status', placeholder: '订阅状态', width: 160, options: [
            { label: '待支付', value: '0' }, { label: '生效中', value: '1' },
            { label: '已过期', value: '2' }, { label: '已取消', value: '3' }
          ] }
        ],
        barActions: [
          { key: 'subscribe', text: '开通 / 续费', type: 'primary', icon: 'el-icon-sell' }
        ],
        columns: [
          { prop: 'orderNo', label: '订单号', minWidth: 180 },
          { prop: 'planName', label: '套餐', minWidth: 120 },
          { prop: 'billingCycle', label: '周期', width: 90, slot: true },
          { prop: 'amount', label: '金额', width: 120, type: 'money' },
          { prop: 'status', label: '状态', width: 100, slot: true },
          { prop: 'startTime', label: '开始时间', minWidth: 160 },
          { prop: 'endTime', label: '到期时间', minWidth: 160 },
          { prop: 'payTime', label: '支付时间', minWidth: 160 }
        ],
        // 开通/续费
        planOptions: [],
        dialogVisible: false,
        submitting: false,
        renewMode: false,
        form: this.emptyForm(),
        formRules: {
          planId: [{ required: true, message: '请选择套餐', trigger: 'change' }],
          billingCycle: [{ required: true, message: '请选择计费周期', trigger: 'change' }]
        },
        // 平台运营
        adminActive: [],
        adminData: [],
        adminCounts: 0,
        adminPage: 1,
        adminTenantId: '',
        adminStatus: null
      }
    },
    computed: {
      entCards() {
        var e = this.ent || {}
        return [
          { icon: 'el-icon-time', label: '剩余天数', value: e.active ? (e.daysRemaining + ' 天') : '—', color: e.daysRemaining <= 7 ? 'warning' : 'primary' },
          { icon: 'el-icon-office-building', label: '门店额度', value: e.active ? this.limitLabel(e.maxStores) : '—', color: 'success' },
          { icon: 'el-icon-user', label: '员工额度', value: e.active ? this.limitLabel(e.maxEmployees) : '—', color: 'success' }
        ]
      },
      dialogTitle() {
        return this.renewMode ? '续费套餐' : '开通套餐'
      },
      previewAmount() {
        var p = this.planOptions.find(x => String(x.id) === String(this.form.planId))
        if (!p) { return '0.00' }
        if (this.form.billingCycle === 2) {
          var annual = (p.annualPrice != null && p.annualPrice !== '') ? Number(p.annualPrice) : Number(p.price) * 12
          return annual.toFixed(2)
        }
        return Number(p.price).toFixed(2)
      }
    },
    created() {
      this.loadEntitlement()
      this.fetchData()
      this.loadPlans()
    },
    methods: {
      emptyForm() {
        return { planId: '', billingCycle: 1, payChannel: 'MOCK', remark: '' }
      },
      limitLabel(v) { return v === -1 || v == null ? '不限' : v },
      cycleText(c) { return c === 2 ? '年付' : '月付' },
      statusText(s) { return { 0: '待支付', 1: '生效中', 2: '已过期', 3: '已取消' }[s] || '未知' },
      statusType(s) { return { 0: 'warning', 1: 'success', 2: 'info', 3: 'info' }[s] || 'info' },
      async loadEntitlement() {
        try {
          var res = await window.billingApi.entitlement()
          if (String(res.code) === '1') { this.ent = res.data || { active: false } }
        } catch (e) { /* 未登录由拦截器处理 */ }
      },
      async loadPlans() {
        try {
          var res = await window.billingApi.planOnShelf()
          if (String(res.code) === '1') { this.planOptions = res.data || [] }
        } catch (e) {}
      },
      async fetchData() {
        this.loading = true
        var params = Object.assign({ page: this.page, pageSize: this.pageSize }, this.searchValues)
        if (params.status !== '' && params.status != null) { params.status = Number(params.status) } else { delete params.status }
        try {
          var res = await window.billingApi.myPage(params)
          if (String(res.code) === '1' && res.data) {
            this.tableData = res.data.records || res.data.list || []
            this.counts = Number(res.data.total) || 0
          } else {
            ReggieUI.error((res && res.msg) || '加载订阅记录失败')
          }
        } catch (err) {
          if (err.message !== 'NOTLOGIN') { ReggieUI.error('加载订阅记录失败') }
        } finally {
          this.loading = false
        }
      },
      onSearch(params) { this.searchValues = params || {}; this.page = 1; this.fetchData() },
      onReset() { this.searchValues = {}; this.page = 1; this.fetchData() },
      onAction(act) { if (act.key === 'subscribe') { this.openSubscribe() } },
      onPlanChange() {},
      openSubscribe() {
        this.renewMode = false
        this.form = this.emptyForm()
        this.dialogVisible = true
        this.$nextTick(() => { this.$refs.formRef && this.$refs.formRef.clearValidate() })
      },
      openRenew(row) {
        this.renewMode = true
        this.form = Object.assign(this.emptyForm(), { planId: row.planId, billingCycle: row.billingCycle || 1 })
        this.dialogVisible = true
        this.$nextTick(() => { this.$refs.formRef && this.$refs.formRef.clearValidate() })
      },
      // 提交：先生成待支付单，再按所选方式完成支付（演示环境直接开通）
      submit() {
        this.$refs.formRef.validate(async (valid) => {
          if (!valid) return
          this.submitting = true
          try {
            var subRes = await window.billingApi.subscribe({
              planId: this.form.planId,
              billingCycle: this.form.billingCycle,
              payChannel: this.form.payChannel,
              remark: this.form.remark
            })
            if (String(subRes.code) !== '1' || !subRes.data) {
              ReggieUI.error((subRes && subRes.msg) || '下单失败')
              return
            }
            var orderId = subRes.data.id
            var amount = subRes.data.amount
            await this.doPay(orderId, amount)
          } catch (err) {
            ReggieUI.error('提交失败，请重试')
          } finally {
            this.submitting = false
          }
        })
      },
      doPay(orderId, amount) {
        var self = this
        return ReggieUI.confirm('订单金额 ¥' + Number(amount || 0).toFixed(2) + '，确认完成支付并开通？', '确认支付', { type: 'warning' })
          .then(async () => {
            var res = await window.billingApi.pay(orderId)
            if (String(res.code) === '1') {
              ReggieUI.success('开通成功')
              self.dialogVisible = false
              self.loadEntitlement()
              self.fetchData()
            } else {
              ReggieUI.error((res && res.msg) || '支付失败')
            }
          }).catch(() => { self.dialogVisible = false; self.fetchData() })
      },
      payOrder(row) { this.doPay(row.id, row.amount) },
      cancelOrder(row) {
        var tip = row.status === 1 ? '退订后当前套餐将失效，确认操作？' : '确认取消该待支付订单？'
        ReggieUI.confirm(tip, '提示', { type: 'warning' }).then(async () => {
          var res = await window.billingApi.cancel(row.id)
          if (String(res.code) === '1') {
            ReggieUI.success('已处理')
            this.loadEntitlement()
            this.fetchData()
          } else {
            ReggieUI.error((res && res.msg) || '操作失败')
          }
        }).catch(() => {})
      },
      // ===== 平台运营（超管） =====
      async loadAdmin(p) {
        this.adminPage = p || 1
        var params = { page: this.adminPage, pageSize: 10 }
        if (this.adminStatus !== null && this.adminStatus !== '' && this.adminStatus != null) { params.status = this.adminStatus }
        if (this.adminTenantId) { params.tenantId = this.adminTenantId }
        try {
          var res = await window.billingApi.adminPage(params)
          if (String(res.code) === '1' && res.data) {
            this.adminData = res.data.records || res.data.list || []
            this.adminCounts = Number(res.data.total) || 0
          } else {
            ReggieUI.error((res && res.msg) || '查询失败（可能无超管权限）')
          }
        } catch (e) {}
      },
      runExpire() {
        ReggieUI.confirm('扫描并将所有已到期的生效订阅置为过期？', '过期扫描', { type: 'warning' }).then(async () => {
          var res = await window.billingApi.expire()
          if (String(res.code) === '1') {
            ReggieUI.success('扫描完成，置过期 ' + (res.data || 0) + ' 条')
            this.loadEntitlement()
            this.fetchData()
          } else {
            ReggieUI.error((res && res.msg) || '操作失败')
          }
        }).catch(() => {})
      }
    }
  })
</script>
<style>
  .entitlement-card { margin-bottom: 12px; }
  .ent-header { display: flex; align-items: center; gap: 10px; }
  .ent-title { font-weight: 600; font-size: var(--font-size-md); }
  .ent-meta { margin-top: 8px; color: var(--el-text-secondary, #909399); font-size: var(--font-size-sm); }
  .admin-card { margin-top: 12px; }
  .admin-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .price-preview { font-size: var(--font-size-2xl); font-weight: 700; color: var(--el-color-danger, #f56c6c); }
  .ds-empty { text-align: center; padding: 40px 0; color: var(--el-text-secondary, #909399); font-size: var(--font-size-base); }
  .ds-text-secondary { color: var(--el-text-secondary, #909399); }
  .danger-link { color: var(--el-color-danger, #f56c6c); }
</style>
</body>
</html>
