<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
    .info-box .item-box { display: flex; height: 20px; line-height: 20px; font-size: 14px; color: #666; margin-bottom: 14px; }
    .info-box .item-box:last-child { margin-bottom: 0; }
    .info-box .item-box .label { width: 100px; }
    .info-box .item-box .des { flex: 1; color: #333; }
  </style>
</head>
<body>
  <div class="dashboard-container" id="payment-app" v-loading="loading">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        @search="onSearch"
        @reset="onReset"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="false"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="180"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-channel="{ row }">
          <el-tag :type="row.channel === 'ALIPAY' ? 'primary' : 'success'" size="small">
            {{ row.channel === 'ALIPAY' ? '支付宝' : '微信' }}
          </el-tag>
        </template>
        <template #col-amount="{ row }">
          <span>￥{{ row.amount }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="statusTagType(row.status)" size="small">{{ statusLabel(row.status) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="viewDetail(row)">查看详情</el-button>
          <el-button v-if="row.status === 'SUCCESS'" type="text" size="small" class="btn-view" @click="openRefund(row)">退款</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 查看详情弹框 -->
    <crud-dialog
      title="支付详情"
      :visible.sync="detailVisible"
      width="35%"
      :show-submit="false"
      submit-text="确 定"
    >
      <div class="info-box">
        <div class="item-box"><span class="label">交易流水号：</span><span class="des">{{ detailForm.id }}</span></div>
        <div class="item-box"><span class="label">订单号：</span><span class="des">{{ detailForm.orderId }}</span></div>
        <div class="item-box"><span class="label">支付渠道：</span><span class="des">{{ detailForm.channel === 'ALIPAY' ? '支付宝' : '微信' }}</span></div>
        <div class="item-box"><span class="label">支付金额：</span><span class="des">￥{{ detailForm.amount }}</span></div>
        <div class="item-box"><span class="label">支付状态：</span><span class="des">{{ statusLabel(detailForm.status) }}</span></div>
        <div class="item-box"><span class="label">支付时间：</span><span class="des">{{ detailForm.paidTime }}</span></div>
      </div>
    </crud-dialog>

    <!-- 退款弹框 -->
    <crud-dialog
      title="退款处理"
      :visible.sync="refundVisible"
      width="30%"
      @submit="submitRefund"
      @close="refundVisible = false"
    >
      <el-form label-width="100px">
        <el-form-item label="退款金额：">
          <el-input-number v-model="refundForm.amount" :precision="2" :min="0.01" :max="refundForm.maxAmount" :step="0.01"></el-input-number>
        </el-form-item>
        <el-form-item label="退款原因：">
          <el-input v-model="refundForm.reason" type="textarea" placeholder="请输入退款原因" :rows="3"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/payment.js"></script>
  <script>
    new Vue({
      el: '#payment-app',
      data: function() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { todayPayments: 0, successPayments: 0, pendingPayments: 0, failedPayments: 0 },
          activeFilter: '',
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'orderId', placeholder: '请输入订单号', width: '200px' },
            { type: 'select', field: 'channel', placeholder: '支付渠道', width: '140px',
              options: [{ label: '支付宝', value: 'ALIPAY' }, { label: '微信', value: 'WECHAT' }] },
            { type: 'select', field: 'status', placeholder: '支付状态', width: '130px',
              options: [
                { label: '待支付', value: 'PENDING' }, { label: '成功', value: 'SUCCESS' },
                { label: '失败', value: 'FAIL' }, { label: '已退款', value: 'REFUNDED' }
              ] },
            { type: 'date', field: 'orderTime', placeholder: '选择日期', width: '360px',
              beginField: 'beginTime', endField: 'endTime' }
          ],
          // 表格列配置
          columns: [
            { prop: 'id', label: '交易流水号', minWidth: '120' },
            { prop: 'orderId', label: '订单号', minWidth: '110' },
            { prop: 'channel', label: '支付渠道', slot: true, width: 100 },
            { prop: 'amount', label: '支付金额', slot: true, width: 100 },
            { prop: 'status', label: '支付状态', slot: true, width: 100 },
            { prop: 'paidTime', label: '支付时间', minWidth: '120' }
          ],
          // 缓存搜索参数
          lastSearch: {},
          // 弹窗数据
          detailVisible: false,
          detailForm: {},
          refundVisible: false,
          refundForm: { id: '', amount: 0, maxAmount: 0, reason: '' }
        }
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: 'TODAY', icon: '💳', label: '今日支付订单', value: self.stats.todayPayments, color: 'primary', clickable: true, active: self.activeFilter === 'TODAY' },
            { key: 'SUCCESS', icon: '✅', label: '支付成功', value: self.stats.successPayments, color: 'success', clickable: true, active: self.activeFilter === 'SUCCESS' },
            { key: 'PENDING', icon: '⏳', label: '待支付', value: self.stats.pendingPayments, color: 'warning', clickable: true, active: self.activeFilter === 'PENDING' },
            { key: 'FAIL', icon: '❌', label: '支付失败', value: self.stats.failedPayments, color: 'danger', clickable: true, active: self.activeFilter === 'FAIL' }
          ]
        }
      },
      created: function() { this.init() },
      methods: {
        async init() {
          this.loading = true
          var self = this
          var params = {
            page: self.page, pageSize: self.pageSize,
            orderId: self.lastSearch.orderId || undefined,
            channel: self.lastSearch.channel || undefined,
            status: self.lastSearch.status || undefined,
            beginTime: self.lastSearch.beginTime || undefined,
            endTime: self.lastSearch.endTime || undefined
          }
          var results = await Promise.all([paymentPage(params), self.loadPaymentStats()])
          var paymentRes = results[0]
          var statsRes = results[1]
          if (String(paymentRes.code) === '1') { self.tableData = paymentRes.data.records || []; self.counts = paymentRes.data.total }
          if (statsRes && String(statsRes.code) === '1') { self.stats = statsRes.data || self.stats }
          self.loading = false
        },
        async loadPaymentStats() {
          try {
            var today = new Date()
            var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0')
            var results = await Promise.all([
              paymentPage({ page: 1, pageSize: 1, beginTime: todayStr + ' 00:00:00', endTime: todayStr + ' 23:59:59' }),
              paymentPage({ page: 1, pageSize: 1000 })
            ])
            var todayRes = results[0]
            var allRes = results[1]
            if (String(allRes.code) === '1') {
              var records = allRes.data.records || []
              return { code: 1, data: {
                todayPayments: (String(todayRes.code) === '1') ? (todayRes.data.total || 0) : 0,
                successPayments: records.filter(function(r) { return r.status === 'SUCCESS' }).length,
                pendingPayments: records.filter(function(r) { return r.status === 'PENDING' }).length,
                failedPayments: records.filter(function(r) { return r.status === 'FAILED' || r.status === 'FAIL' }).length
              }}
            }
          } catch (err) { console.warn('加载支付统计数据失败:', err) }
          return { code: 0 }
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          var self = this
          if (payload.key === 'TODAY') {
            if (self.activeFilter === 'TODAY') {
              self.activeFilter = ''
              self.lastSearch = {}
            } else {
              self.activeFilter = 'TODAY'
              var today = new Date()
              var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0')
              self.lastSearch = { beginTime: todayStr + ' 00:00:00', endTime: todayStr + ' 23:59:59' }
            }
          } else if (payload.key === 'SUCCESS' || payload.key === 'PENDING' || payload.key === 'FAIL') {
            if (self.activeFilter === payload.key) { self.activeFilter = ''; self.lastSearch = {} }
            else { self.activeFilter = payload.key; self.lastSearch = { status: payload.key === 'FAIL' ? 'FAIL' : payload.key } }
          } else {
            self.activeFilter = ''
            self.lastSearch = {}
          }
          self.page = 1
          self.init()
        },
        // table-bar 回调
        onSearch: function(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init()
        },
        onReset: function() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init()
        },
        onPageChange: function(payload) { this.page = payload.page; this.init() },
        onSizeChange: function(payload) { this.pageSize = payload.pageSize; this.init() },
        statusTagType: function(status) {
          var map = { PENDING: 'warning', SUCCESS: 'success', FAIL: 'danger', REFUNDED: 'info' }
          return map[status] || ''
        },
        statusLabel: function(status) {
          var map = { PENDING: '待支付', SUCCESS: '成功', FAIL: '失败', REFUNDED: '已退款' }
          return map[status] || status
        },
        viewDetail: function(row) { this.detailForm = { ...row }; this.detailVisible = true },
        openRefund: function(row) {
          this.refundForm = { id: row.id, amount: row.amount, maxAmount: row.amount, reason: '' }
          this.refundVisible = true
        },
        submitRefund: function() {
          var self = this
          if (!self.refundForm.amount || self.refundForm.amount <= 0) { self.$message.error('请输入有效的退款金额'); return }
          if (self.refundForm.amount > self.refundForm.maxAmount) { self.$message.error('退款金额不能超过支付金额'); return }
          if (!self.refundForm.reason) { self.$message.error('请输入退款原因'); return }
          this.$confirm('确认退款 ￥' + self.refundForm.amount + '?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              paymentRefund({ id: self.refundForm.id, amount: self.refundForm.amount, reason: self.refundForm.reason }).then(function(res) {
                if (res.code === 1) { self.$message.success('退款成功！'); self.refundVisible = false; self.init() }
                else { self.$message.error(res.msg || '退款失败') }
              }).catch(function(err) { self.$message.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
