<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
  .search-btn {
    margin-left: 20px;
  }
  .info-box{
    margin: -15px -44px 20px;
  }
  .info-box .item-box{
    display: flex;
    height: 20px;
    line-height: 20px;
    font-size: 14px;
    font-weight: 400;
    color: #666666;
    text-align: left;
    margin-bottom: 14px;
  }
  .info-box .item-box:last-child{
    margin-bottom: 0;
  }
  .info-box .item-box .label{
    width: 96px;
  }
  .info-box .item-box .des{
    flex: 1;
    color: #333333;
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="payment-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="inputOrderId" placeholder="请输入订单号" style="width: 180px" clearable></el-input>
        <el-select v-model="inputChannel" placeholder="支付渠道" style="width: 140px; margin-left: 15px" clearable>
          <el-option label="支付宝" value="ALIPAY"></el-option>
          <el-option label="微信" value="WECHAT"></el-option>
        </el-select>
        <el-select v-model="inputStatus" placeholder="支付状态" style="width: 140px; margin-left: 15px" clearable>
          <el-option label="待支付" value="PENDING"></el-option>
          <el-option label="成功" value="SUCCESS"></el-option>
          <el-option label="失败" value="FAIL"></el-option>
          <el-option label="已退款" value="REFUNDED"></el-option>
        </el-select>
        <el-date-picker v-model="orderTime"
          clearable
          value-format="yyyy-MM-dd HH:mm:ss"
          type="datetimerange"
          placeholder="选择日期"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          :default-time="['00:00:00', '23:59:59']"
          style="width: 400px; margin-left: 15px"
        ></el-date-picker>
        <el-button type="primary" class="search-btn" @click="handleQuery">查询</el-button>
        <el-button type="default" class="search-btn" @click="handleReset">重置</el-button>
      </div>
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="id" label="交易流水号" min-width="120"></el-table-column>
        <el-table-column prop="orderId" label="订单号" min-width="110"></el-table-column>
        <el-table-column label="支付渠道" width="100">
          <template slot-scope="{ row }">
            <el-tag :type="row.channel === 'ALIPAY' ? 'primary' : 'success'" size="small">
              {{ row.channel === 'ALIPAY' ? '支付宝' : '微信' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="支付金额" width="100">
          <template slot-scope="{ row }">
            <span>￥{{ row.amount }}</span>
          </template>
        </el-table-column>
        <el-table-column label="支付状态" width="100">
          <template slot-scope="{ row }">
            <el-tag :type="statusTagType(row.status)" size="small">
              {{ statusLabel(row.status) }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="paidTime" label="支付时间" min-width="120"></el-table-column>
        <el-table-column label="操作" width="180" align="center">
          <template slot-scope="{ row }">
            <el-button type="text" size="small" class="blueBug" @click="viewDetail(row)">
              查看详情
            </el-button>
            <el-button v-if="row.status === 'SUCCESS'" type="text" size="small" class="blueBug" @click="openRefund(row)">
              退款
            </el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        :current-page.sync="page"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 查看详情弹框 -->
    <el-dialog
      title="支付详情"
      :visible.sync="detailVisible"
      width="35%"
      :before-close="handleClose"
    >
      <div class="info-box">
        <div class="item-box">
          <span class="label">交易流水号：</span>
          <span class="des">{{ detailForm.id }}</span>
        </div>
        <div class="item-box">
          <span class="label">订单号：</span>
          <span class="des">{{ detailForm.orderId }}</span>
        </div>
        <div class="item-box">
          <span class="label">支付渠道：</span>
          <span class="des">{{ detailForm.channel === 'ALIPAY' ? '支付宝' : '微信' }}</span>
        </div>
        <div class="item-box">
          <span class="label">支付金额：</span>
          <span class="des">￥{{ detailForm.amount }}</span>
        </div>
        <div class="item-box">
          <span class="label">支付状态：</span>
          <span class="des">{{ statusLabel(detailForm.status) }}</span>
        </div>
        <div class="item-box">
          <span class="label">支付时间：</span>
          <span class="des">{{ detailForm.paidTime }}</span>
        </div>
      </div>
      <span slot="footer" class="dialog-footer">
        <el-button type="primary" size="medium" @click="detailVisible = false">确 定</el-button>
      </span>
    </el-dialog>

    <!-- 退款弹框 -->
    <el-dialog
      title="退款处理"
      :visible.sync="refundVisible"
      width="30%"
      :before-close="handleClose"
    >
      <el-form label-width="100px">
        <el-form-item label="退款金额：">
          <el-input-number v-model="refundForm.amount" :precision="2" :min="0.01" :max="refundForm.maxAmount" :step="0.01"></el-input-number>
        </el-form-item>
        <el-form-item label="退款原因：">
          <el-input v-model="refundForm.reason" type="textarea" placeholder="请输入退款原因" :rows="3"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="refundVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitRefund">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/payment.js"></script>
    <script>
      new Vue({
        el: '#payment-app',
        data() {
          return {
            inputOrderId: '',
            inputChannel: '',
            inputStatus: '',
            orderTime: '',
            beginTime: '',
            endTime: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            detailVisible: false,
            detailForm: {},
            refundVisible: false,
            refundForm: {
              id: '',
              amount: 0,
              maxAmount: 0,
              reason: ''
            },
            loading: false
          }
        },
        watch: {
          orderTime(val) {
            if (val && val.length >= 2) {
              this.beginTime = val[0]
              this.endTime = val[1]
            } else {
              this.beginTime = ''
              this.endTime = ''
            }
          }
        },
        created() {
          this.init()
        },
        methods: {
          async init() {
            this.loading = true
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              orderId: this.inputOrderId || undefined,
              channel: this.inputChannel || undefined,
              status: this.inputStatus || undefined,
              beginTime: this.beginTime || undefined,
              endTime: this.endTime || undefined
            }
            paymentPage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            }).finally(() => {
              this.loading = false
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          handleReset() {
            this.inputOrderId = ''
            this.inputChannel = ''
            this.inputStatus = ''
            this.orderTime = ''
            this.beginTime = ''
            this.endTime = ''
            this.handleQuery()
          },
          statusTagType(status) {
            const map = {
              PENDING: 'warning',
              SUCCESS: 'success',
              FAIL: 'danger',
              REFUNDED: 'info'
            }
            return map[status] || ''
          },
          statusLabel(status) {
            const map = {
              PENDING: '待支付',
              SUCCESS: '成功',
              FAIL: '失败',
              REFUNDED: '已退款'
            }
            return map[status] || status
          },
          viewDetail(row) {
            this.detailForm = {}
            this.detailVisible = true
            this.detailForm = { ...row }
          },
          openRefund(row) {
            this.refundForm.id = row.id
            this.refundForm.amount = row.amount
            this.refundForm.maxAmount = row.amount
            this.refundForm.reason = ''
            this.refundVisible = true
          },
          submitRefund() {
            if (!this.refundForm.amount || this.refundForm.amount <= 0) {
              this.$message.error('请输入有效的退款金额')
              return
            }
            if (this.refundForm.amount > this.refundForm.maxAmount) {
              this.$message.error('退款金额不能超过支付金额')
              return
            }
            if (!this.refundForm.reason) {
              this.$message.error('请输入退款原因')
              return
            }
            this.$confirm('确认退款 ￥' + this.refundForm.amount + '?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              paymentRefund({
                id: this.refundForm.id,
                amount: this.refundForm.amount,
                reason: this.refundForm.reason
              }).then(res => {
                if (res.code === 1) {
                  this.$message.success('退款成功！')
                  this.refundVisible = false
                  this.init()
                } else {
                  this.$message.error(res.msg || '退款失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          handleClose() {
            this.detailVisible = false
            this.refundVisible = false
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
