<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成本核算 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/chart-panel.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg-page);
      font-family: var(--font-family-base);
    }
    .cost-container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .cost-container .container {
      flex: 1;
      background: transparent;
      padding: 24px 32px 32px;
      min-width: 0;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .tableBar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--el-border-light);
    }
    .chart-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--el-border-light);
    }
    .chart-title {
      font-size:var(--font-size-lg);
      font-weight: 600;
      color: var(--el-text-primary);
      margin-bottom: 16px;
    }
    .chart-container {
      height: 300px;
    }
    .alert-list {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--el-border-light);
    }
    .alert-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--el-border-lighter);
    }
    .alert-item:last-child {
      border-bottom: none;
    }
    .alert-level {
      padding: 4px 8px;
border-radius: var(--radius-sm);
      font-size:var(--font-size-xs);
      font-weight: 600;
      margin-right: 12px;
    }
    .alert-level.critical {
      background: var(--el-color-danger-lighter);
      color: var(--el-color-danger);
    }
    .alert-level.warning {
      background: var(--el-color-warning-lighter);
      color: var(--el-color-warning);
    }
    .alert-level.info {
      background: var(--el-color-info-lighter);
      color: var(--el-color-info);
    }
    .alert-level.normal {
      background: var(--el-color-success-lighter);
      color: var(--el-color-success);
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <div id="app" class="cost-container">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">成本核算</h1>
          <p class="ds-page-header__subtitle">核算菜品成本与毛利</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 工具栏 -->
      <div class="tableBar">
        <span class="toolbar-label">日期范围：</span>
        <el-date-picker
          v-model="dateRange"
          type="daterange"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          value-format="yyyy-MM-dd"
          style="width: 300px;">
        </el-date-picker>
        <el-button type="primary" icon="el-icon-search" aria-label="搜索" @click="fetchData">查询</el-button>
        <el-button icon="el-icon-refresh" aria-label="重置" @click="resetQuery">重置</el-button>
        <div class="toolbar-spacer"></div>
        <el-button type="success" icon="el-icon-download" @click="exportReport">导出报表</el-button>
      </div>

      <!-- 统计卡片 - 使用统一的 <stat-cards> 组件 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 图表行 -->
      <div class="chart-row">
        <!-- 成本趋势图 -->
        <div class="chart-card">
          <div class="chart-title">成本趋势分析</div>
          <div id="trendChart" class="chart-container"></div>
        </div>
        <!-- 成本结构图 -->
        <div class="chart-card">
          <div class="chart-title">成本结构分析</div>
          <div id="structureChart" class="chart-container"></div>
        </div>
      </div>

      <!-- 成本排名 -->
      <div class="chart-card" style="margin-bottom: 20px;">
        <div class="chart-title">菜品成本排名</div>
        <div id="rankingChart" class="chart-container"></div>
      </div>

      <!-- 成本预警 -->
      <div class="alert-list">
        <div class="chart-title">成本预警</div>
        <div v-if="alerts.length === 0" style="text-align: center; padding: 20px; color: var(--el-text-secondary);">
          暂无预警信息
        </div>
        <div v-else>
          <div v-for="(alert, index) in alerts" :key="index" class="alert-item">
            <span class="alert-level" :class="alert.level">{{ alert.levelText }}</span>
            <span>{{ alert.message }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../api/cost.js"></script>
  <script>
    // 颜色调色板已由 js/components.js 的全局 window.RgPalette 提供（运行时从 tokens.css 读取），
    // 本页不再定义本地调色板，消除重复并保证与设计令牌一致。

    new Vue({
      el: '#app',
      data() {
        return {
          loading: false,
          dateRange: [],
          summary: {
            totalCost: 0,
            materialCost: 0,
            laborCost: 0,
            otherCost: 0
          },
          trendData: {
            dates: [],
            materialCosts: [],
            laborCosts: [],
            otherCosts: [],
            totalCosts: []
          },
          structureData: [],
          rankingData: [],
          alerts: [],
          trendChart: null,
          structureChart: null,
          rankingChart: null
        }
      },
      computed: {
        // 统计卡片配置 - 使用统一的 <stat-cards> 组件
        statsCards() {
          return [
            {
              key: 'totalCost',
              icon: 'el-icon-money',
              label: '总成本',
              value: '¥' + this.formatMoney(this.summary.totalCost),
              color: 'primary',
              flex: true
            },
            {
              key: 'materialCost',
              icon: 'el-icon-food',
              label: '食材成本',
              value: '¥' + this.formatMoney(this.summary.materialCost),
              color: 'success',
              flex: true
            },
            {
              key: 'laborCost',
              icon: 'el-icon-user',
              label: '人工成本',
              value: '¥' + this.formatMoney(this.summary.laborCost),
              color: 'warning',
              flex: true
            },
            {
              key: 'otherCost',
              icon: 'el-icon-more',
              label: '其他成本',
              value: '¥' + this.formatMoney(this.summary.otherCost),
              color: 'info',
              flex: true
            }
          ]
        }
      },
      created() {
        // 默认查询最近7天
        const end = new Date()
        const start = new Date()
        start.setTime(start.getTime() - 7 * 24 * 3600 * 1000)
        this.dateRange = [
          this.formatDate(start),
          this.formatDate(end)
        ]
      },
      mounted() {
        this.initCharts()
        this.fetchData()
      },
      // 修改点：补 beforeDestroy 清理 —— 原先 resize 监听与 echarts 实例从不释放，
      // 切换页面后监听器残留、图表实例泄漏（多次进入会累积）
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        const charts = [this.trendChart, this.structureChart, this.rankingChart]
        charts.forEach(function(ch) {
          if (ch && !ch.isDisposed()) { try { ch.dispose() } catch (e) {} }
        })
      },
      methods: {
        formatDate(date) {
          const year = date.getFullYear()
          const month = String(date.getMonth() + 1).padStart(2, '0')
          const day = String(date.getDate()).padStart(2, '0')
          return year + '-' + month + '-' + day
        },
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        initCharts() {
          this.trendChart = echarts.init(document.getElementById('trendChart'))
          this.structureChart = echarts.init(document.getElementById('structureChart'))
          this.rankingChart = echarts.init(document.getElementById('rankingChart'))
          
          // 修改点：把回调存为 this.resizeHandler，否则 beforeDestroy 无法解绑（匿名函数无引用）
          this.resizeHandler = () => {
            const charts = [this.trendChart, this.structureChart, this.rankingChart]
            charts.forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.resize()
            })
          }
          window.addEventListener('resize', this.resizeHandler)
        },
        async fetchData() {
          this.loading = true
          try {
            const startDate = this.dateRange[0]
            const endDate = this.dateRange[1]
            
            const [summaryRes, trendRes, structureRes, rankingRes, alertRes] = await Promise.all([
              getCostSummary({ startDate, endDate }),
              getCostTrend({ startDate, endDate }),
              getCostStructure({ startDate, endDate }),
              getCostRanking({ startDate, endDate }),
              getCostAlerts({ startDate, endDate })
            ])
            
            if (summaryRes.code === 1) {
              this.summary = summaryRes.data
            }
            
            if (trendRes.code === 1) {
              this.trendData = trendRes.data
              this.updateTrendChart()
            }
            
            if (structureRes.code === 1) {
              this.structureData = structureRes.data
              this.updateStructureChart()
            }
            
            if (rankingRes.code === 1) {
              this.rankingData = rankingRes.data
              this.updateRankingChart()
            }
            
            if (alertRes.code === 1) {
              this.alerts = alertRes.data || []
            }
          } catch (err) {
            ReggieUI.error('获取数据失败')
          } finally {
            this.loading = false
          }
        },
        updateTrendChart() {
          const option = {
            tooltip: {
              trigger: 'axis'
            },
            legend: {
              data: ['食材成本', '人工成本', '其他成本', '总成本']
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              boundaryGap: false,
              data: this.trendData.dates
            },
            yAxis: {
              type: 'value',
              axisLabel: {
                formatter: '¥{value}'
              }
            },
            series: [
              {
                name: '食材成本',
                type: 'line',
                stack: 'Total',
                data: this.trendData.materialCosts,
                areaStyle: {},
                itemStyle: { color: RgPalette.success }
              },
              {
                name: '人工成本',
                type: 'line',
                stack: 'Total',
                data: this.trendData.laborCosts,
                areaStyle: {},
                itemStyle: { color: RgPalette.warning }
              },
              {
                name: '其他成本',
                type: 'line',
                stack: 'Total',
                data: this.trendData.otherCosts,
                areaStyle: {},
                itemStyle: { color: RgPalette.textSecondary }
              },
              {
                name: '总成本',
                type: 'line',
                data: this.trendData.totalCosts,
                itemStyle: { color: RgPalette.linkBlue },
                lineStyle: { width: 3 }
              }
            ]
          }
          this.trendChart.setOption(option)
        },
        updateStructureChart() {
          const option = {
            tooltip: {
              trigger: 'item',
              formatter: '{a} <br/>{b}: {c} ({d}%)'
            },
            legend: {
              orient: 'vertical',
              left: 'left'
            },
            series: [
              {
                name: '成本结构',
                type: 'pie',
                radius: ['40%', '70%'],
                avoidLabelOverlap: false,
                itemStyle: {
                  borderRadius: RgPalette.radiusMd
,
                  borderColor: RgPalette.white,
                  borderWidth: 2
                },
                label: {
                  show: false,
                  position: 'center'
                },
                emphasis: {
                  label: {
                    show: true,
                    fontSize: '20',
                    fontWeight: 'bold'
                  }
                },
                labelLine: {
                  show: false
                },
                data: this.structureData.map(item => ({
                  value: item.value,
                  name: item.name
                }))
              }
            ]
          }
          this.structureChart.setOption(option)
        },
        updateRankingChart() {
          const option = {
            tooltip: {
              trigger: 'axis',
              axisPointer: {
                type: 'shadow'
              }
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'value',
              axisLabel: {
                formatter: '¥{value}'
              }
            },
            yAxis: {
              type: 'category',
              data: this.rankingData.map(item => item.dishName).reverse(),
              axisLabel: {
                width: 100,
                overflow: 'truncate'
              }
            },
            series: [
              {
                name: '总成本',
                type: 'bar',
                data: this.rankingData.map(item => item.totalCost).reverse(),
                itemStyle: {
                  color: RgPalette.linkBlue
                }
              }
            ]
          }
          this.rankingChart.setOption(option)
        },
        resetQuery() {
          const end = new Date()
          const start = new Date()
          start.setTime(start.getTime() - 7 * 24 * 3600 * 1000)
          this.dateRange = [
            this.formatDate(start),
            this.formatDate(end)
          ]
          this.fetchData()
        },
        exportReport() {
          ReggieUI.info('导出功能开发中...')
        }
      }
    })
  </script>
</body>
</html>
