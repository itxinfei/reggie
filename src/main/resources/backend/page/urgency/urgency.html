<html lang="zh-CN">

  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style lang="less" scoped>
    @import "../../styles/tokens.css";

    .urgency-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 var(--space-5);
    }

    /* ============ 妞ゅ爼鍎寸紒鐔活吀閸楋紕澧栫悰?============ */
    .urgency-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    @media (max-width: 1100px) { .urgency-stats { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 600px) { .urgency-stats { grid-template-columns: 1fr } }

    .urgency-stat-card {
      padding: var(--space-4);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      transition: box-shadow var(--transition-base);
    }
    .urgency-stat-card:hover {
      box-shadow: var(--shadow-md);
    }
    .urgency-stat-card__icon {
      font-size: var(--font-size-3xl);
      line-height: 1;
      flex-shrink: 0;
    }
    .urgency-stat-card__body { flex: 1; min-width: 0 }
    .urgency-stat-card__label {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .urgency-stat-card__value {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-tight);
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }
    .urgency-stat-card__unit {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-regular);
      margin-left: var(--space-1);
    }
    .urgency-stat-card.warning .urgency-stat-card__value { color: var(--color-warning) }
    .urgency-stat-card.danger .urgency-stat-card__value { color: var(--color-danger) }
    .urgency-stat-card.brand .urgency-stat-card__value { color: var(--color-brand-500) }
    .urgency-stat-card.success .urgency-stat-card__value { color: var(--color-success) }

    /* ============ 闁氨鏁ら崠鍝勬健閺嶅洭顣?============ */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }
    .section-header__title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-medium);
      color: var(--text-primary);
    }
    .section-header__hint {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
    }

    /* ============ 閸岊剙宕熼崚妤勩€冮崡锛勫 ============ */
    .list-card {
      padding: var(--space-4);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-6);
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: var(--border-width-thin) solid var(--border-default);
      flex-wrap: wrap;
    }
    .filter-row__label {
      font-size: var(--font-size-base);
      color: var(--text-primary);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }
    .filter-row__tip {
      margin-left: auto;
      font-size: var(--font-size-xs);
      color: var(--text-muted);
    }

    /* 鐞涖劍鐗哥悰?hover 鏉╁洦娴?*/
    .urgency-table {
      transition: background-color var(--transition-base);
    }

    /* 缁涘绶熼弮鍫曟毐閸?*/
    .wait-time {
      font-variant-numeric: tabular-nums;
      font-weight: var(--font-weight-medium);
      font-size: var(--font-size-base);
    }
    .wait-time.overdue {
      color: var(--color-danger);
    }

    /* 閼挎粌鎼ч崚妤佸焻閺?*/
    .dish-cell {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
    }

    /* 鏉╂稑瀹抽弶陇澹?*/
    .progress-cooking { --progress-color: var(--color-brand-500) }
    .progress-waiting { --progress-color: var(--color-info) }
    .progress-done { --progress-color: var(--color-success) }
    .el-progress-bar__inner {
      background-color: var(--progress-color, var(--color-brand-500)) !important;
      transition: width var(--transition-base);
    }
    .el-progress-bar__innerText {
      color: var(--text-inverse) !important;
    }

    /* ============ 閸欘偄褰?+ 缂佺喕顓?娑撱倖鐖敮鍐ㄧ湰 ============ */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    @media (max-width: 1100px) { .bottom-grid { grid-template-columns: 1fr } }

    .queue-card {
      padding: var(--space-4);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    /* 閸欘偄褰块崡锛勫 */
    .call-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4);
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-4);
    }
    .call-section__left {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    .call-section__label {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      line-height: var(--line-height-base);
    }
    .call-section__number {
      font-size: var(--font-size-4xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-brand-500);
      line-height: var(--line-height-tight);
      font-variant-numeric: tabular-nums;
    }
    .call-section__waiting {
      font-size: var(--font-size-base);
      color: var(--text-primary);
      font-weight: var(--font-weight-medium);
    }
    .call-section__waiting-num {
      font-size: var(--font-size-2xl);
      color: var(--color-danger);
      font-weight: var(--font-weight-semibold);
      font-variant-numeric: tabular-nums;
      margin: 0 var(--space-1);
    }

    .queue-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-2) 0;
      border-bottom: var(--border-width-thin) solid var(--border-subtle);
    }
    .queue-list-item:last-child { border-bottom: none }
    .queue-list-item__table {
      font-size: var(--font-size-base);
      color: var(--text-primary);
      font-weight: var(--font-weight-medium);
      font-variant-numeric: tabular-nums;
    }
    .queue-list-item__hint {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
    }

    /* 缂佺喕顓搁崡锛勫娑撳鐖?*/
    .urgency-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      padding: var(--space-4);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    @media (max-width: 600px) { .urgency-summary { grid-template-columns: 1fr } }

    .summary-item {
      text-align: center;
      padding: var(--space-3) var(--space-2);
      border-right: var(--border-width-thin) solid var(--border-subtle);
    }
    .summary-item:last-child { border-right: none }
    .summary-item__label {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }
    .summary-item__value {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-brand-500);
      font-variant-numeric: tabular-nums;
      line-height: var(--line-height-tight);
    }
    .summary-item.success .summary-item__value { color: var(--color-success) }
    .summary-item.info .summary-item__value { color: var(--text-primary) }
    .summary-item__unit {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-regular);
      margin-left: var(--space-1);
    }

    /* ============ 缁岀儤鈧?============ */
    .empty-state {
      text-align: center;
      padding: 48px var(--space-4);
      color: var(--text-muted);
      font-size: var(--font-size-base);
    }
    .empty-state__icon {
      font-size: var(--font-size-4xl);
      line-height: 1;
      margin-bottom: var(--space-4);
    }
    .empty-state__desc {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      margin-top: var(--space-2);
    }
  </style>
</head>

        <div class="filter-row">

  <script>
    /**
     * 閸岊剙宕熺粻锛勬倞妞ょ敻娼?     * 閸氬海顏亸杈╁崕閸氬骸鎯庨悽?API 鐠嬪啰鏁ら敍灞姐亼鐠愩儲妞傞懛顏勫З闂勫秶楠囨稉?Mock 閺佺増宓?     */
    new Vue({
      el: '#urgency-app',
      data: function () {
        return {
          // 缂佺喕顓搁崡锛勫
          statsLoading: false,
          stats: { urgentCount: 0, overdueCount: 0, avgWaitMin: 0, maxWaitMin: 0 },
          // 閸掓銆冪粵娑⑩偓?          filterStatus: 'ALL',
          tableLoading: false,
          orders: [],
          // 閸欘偄褰?          currentCallTable: '08',
          waitingAheadCount: 3,
          queueList: [],
          // 閸岊剙宕熺紒鐔活吀
          summary: { todayTotal: 0, completeRate: 0, avgResponseMin: 0 },
          // 閸岊剙宕熷鍦崶
          urgeDialogVisible: false,
          urgeLoading: false,
          urgeOrder: { orderId: '', tableNo: '', countdown: '' },
          // 閸婃帟顓搁弮璺虹暰閺冭泛娅?          timerId: null
        }
      },
      computed: {
        filteredOrders: function () {
          if (this.filterStatus === 'ALL') {
            return this.orders
          }
          return this.orders.filter(function (o) {
            return o.status === this.filterStatus
          }.bind(this))
        }
      },
      created: function () {
        this.loadAllData()
        this.startCountdown()
      },
      destroyed: function () {
        if (this.timerId) {
          clearInterval(this.timerId)
          this.timerId = null
        }
      },
      methods: {
        // ============ 閺佺増宓侀崝鐘烘祰 ============
        loadAllData: function () {
          const self = this
          self.loadStats()
          self.loadOrderList()
          self.loadQueueInfo()
          self.loadSummary()
        },

        loadStats: function () {
          const self = this
          self.statsLoading = true
          try {
            self.$axios({ url: '/api/urgency/overview', method: 'get' })
              .then(function (res) {
                if (res.data && res.data.code === 1 && res.data.data) {
                  self.stats = res.data.data
                } else {
                  self.applyMockStats()
                }
              })
              .catch(function () { self.applyMockStats() })
              .then(function () { self.statsLoading = false })
          } catch (e) {
            self.applyMockStats()
            self.statsLoading = false
          }
        },

        loadOrderList: function () {
          const self = this
          self.tableLoading = true
          try {
            self.$axios({ url: '/api/urgency/list', method: 'get', params: { page: 1, pageSize: 20 } })
              .then(function (res) {
                if (res.data && res.data.code === 1 && res.data.data) {
                  self.orders = self.normalizeOrders(res.data.data.records || res.data.data)
                  self.computeCountdowns()
                } else {
                  self.applyMockOrders()
                }
              })
              .catch(function () { self.applyMockOrders() })
              .then(function () { self.tableLoading = false })
          } catch (e) {
            self.applyMockOrders()
            self.tableLoading = false
          }
        },

        loadQueueInfo: function () {
          const self = this
          try {
            self.$axios({ url: '/api/urgency/queue', method: 'get' })
              .then(function (res) {
                if (res.data && res.data.code === 1 && res.data.data) {
                  const d = res.data.data
                  self.currentCallTable = d.currentCallTable || '08'
                  self.waitingAheadCount = d.waitingAheadCount || 3
                  self.queueList = d.queueList || []
                } else {
                  self.applyMockQueue()
                }
              })
              .catch(function () { self.applyMockQueue() })
          } catch (e) {
            self.applyMockQueue()
          }
        },

        loadSummary: function () {
          const self = this
          try {
            self.$axios({ url: '/api/urgency/summary', method: 'get' })
              .then(function (res) {
                if (res.data && res.data.code === 1 && res.data.data) {
                  self.summary = res.data.data
                } else {
                  self.applyMockSummary()
                }
              })
              .catch(function () { self.applyMockSummary() })
          } catch (e) {
            self.applyMockSummary()
          }
        },

        // ============ Mock 閺佺増宓?============
        applyMockStats: function () {
          this.stats = { urgentCount: 5, overdueCount: 2, avgWaitMin: 6, maxWaitMin: 18 }
        },
        applyMockOrders: function () {
          const self = this
          const mockData = [
            {
              orderId: 'ORD20260823001',
              tableNo: '03',
              dishNames: ['黄焖鸡', '干煸四季豆', '生菜'],
              displayDishes: '黄焖鸡、干煸四季豆、生菜',
              orderTime: '2026-08-23 11:35:20',
              orderTimeMs: Date.now() - 18 * 60 * 1000,
              status: 'COOKING',
              progress: 70
            },
            {
              orderId: 'ORD20260823002',
              tableNo: '05',
              dishNames: ['糖醋里脊'],
              displayDishes: '糖醋里脊',
              orderTime: '2026-08-23 11:40:15',
              orderTimeMs: Date.now() - 13 * 60 * 1000,
              status: 'COOKING',
              progress: 60
            },
            {
              orderId: 'ORD20260823003',
              tableNo: '07',
              dishNames: ['宫保鸡丁', '酸辣土豆丝'],
              displayDishes: '宫保鸡丁、酸辣土豆丝',
              orderTime: '2026-08-23 11:42:00',
              orderTimeMs: Date.now() - 11 * 60 * 1000,
              status: 'WAITING_CALL',
              progress: 40
            },
            {
              orderId: 'ORD20260823004',
              tableNo: '08',
              dishNames: ['麻婆豆腐', '回锅肉'],
              displayDishes: '麻婆豆腐、回锅肉',
              orderTime: '2026-08-23 11:45:30',
              orderTimeMs: Date.now() - 9 * 60 * 1000,
              status: 'COOKING',
              progress: 55
            },
            {
              orderId: 'ORD20260823005',
              tableNo: '10',
              dishNames: ['红烧排骨', '清炒时蔬', '紫菜蛋花汤'],
              displayDishes: '红烧排骨、清炒时蔬、紫菜蛋花汤',
              orderTime: '2026-08-23 11:48:10',
              orderTimeMs: Date.now() - 6 * 60 * 1000,
              status: 'COOKING',
              progress: 30
            },
            {
              orderId: 'ORD20260823006',
              tableNo: '12',
              dishNames: ['鱼香肉丝'],
              displayDishes: '鱼香肉丝',
              orderTime: '2026-08-23 11:50:00',
              orderTimeMs: Date.now() - 4 * 60 * 1000,
              status: 'WAITING_CALL',
              progress: 20
            },
            {
              orderId: 'ORD20260823007',
              tableNo: '02',
              dishNames: ['水煮鱼', '番茄炒蛋'],
              displayDishes: '水煮鱼、番茄炒蛋',
              orderTime: '2026-08-23 11:30:00',
              orderTimeMs: Date.now() - 23 * 60 * 1000,
              status: 'DONE',
              progress: 100
            },
            {
              orderId: 'ORD20260823008',
              tableNo: '15',
              dishNames: ['剁椒鱼头', '清蒸鲈鱼', '蒜蓉西兰花', '冬瓜排骨汤'],
              displayDishes: '剁椒鱼头、清蒸鲈鱼、蒜蓉西兰花、冬瓜排骨汤',
              orderTime: '2026-08-23 11:52:30',
              orderTimeMs: Date.now() - 3 * 60 * 1000,
              status: 'COOKING',
              progress: 15
            }
          ]
          self.orders = mockData
          self.computeCountdowns()
        },
        applyMockQueue: function () {
          this.currentCallTable = '08'
          this.waitingAheadCount = 3
          this.queueList = [
            { tableNo: '09', status: 'COOKING' },
            { tableNo: '10', status: 'COOKING' },
            { tableNo: '11', status: 'WAITING' },
            { tableNo: '12', status: 'WAITING' }
          ]
        },
        applyMockSummary: function () {
          this.summary = { todayTotal: 25, completeRate: 92, avgResponseMin: 3 }
        },

        // ============ 閸婃帟顓搁弮?============
        computeCountdowns: function () {
          const self = this
          self.orders.forEach(function (order) {
            const diffMs = Date.now() - (order.orderTimeMs || Date.now())
            order.totalSeconds = Math.max(0, Math.floor(diffMs / 1000))
            order.isOverdue = order.totalSeconds > 600
            self.$set(order, 'countdown', self.formatMMSS(order.totalSeconds))
          })
        },

        formatMMSS: function (totalSeconds) {
          const m = Math.floor(totalSeconds / 60)
          const s = totalSeconds % 60
          return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s)
        },

        startCountdown: function () {
          const self = this
          self.timerId = setInterval(function () {
            self.orders.forEach(function (order) {
              order.totalSeconds += 1
              order.isOverdue = order.totalSeconds > 600
              self.$set(order, 'countdown', self.formatMMSS(order.totalSeconds))
            })
            // 鐡掑懏妞傞崣顖氬亾閺侀绡冪€圭偞妞傞弴瀛樻煀
            self.stats.overdueCount = self.orders.filter(function (o) { return o.isOverdue }).length
          }, 1000)
        },

        // ============ 瀹搞儱鍙块弬瑙勭《 ============
        normalizeOrders: function (raw) {
          const self = this
          return raw.map(function (o) {
            o.orderTimeMs = o.orderTimeMs || new Date(o.orderTime).getTime()
            o.displayDishes = self.truncateDishes(o.dishNames)
            o.totalSeconds = Math.max(0, Math.floor((Date.now() - o.orderTimeMs) / 1000))
            o.isOverdue = o.totalSeconds > 600
            o.countdown = self.formatMMSS(o.totalSeconds)
            return o
          })
        },

        truncateDishes: function (names) {
          if (!names || names.length === 0) return ''
          if (names.length <= 2) {
            return names.join('、');
          }
            return names[0] + '、' + names[1] + '等';
        },

        statusTagType: function (status) {
          if (status === 'COOKING') return 'warning'
          if (status === 'WAITING_CALL') return 'info'
          if (status === 'DONE') return 'success'
          return 'info'
        },

        statusLabel: function (status) {
          const map = { WAITING_CALL: '待上菜', COOKING: '制作中', SERVING: '上菜中', DONE: '已完成' };
          return map[status] || '未知';
        },

        tableRowClassName: function () {
          return 'urgency-table-row'
        },

        // ============ 閹垮秳缍?============
        onFilterChange: function () {
          // 閸掑洦宕茬粵娑⑩偓澶婃倵閺冪娀娓舵０婵嗩樆閹垮秳缍旈敍瀹憃mputed 閼奉亜濮╂潻鍥ㄦ姢
        },

        urgeHandle: function (row) {
          this.urgeOrder = {
            orderId: row.orderId,
            tableNo: row.tableNo,
            countdown: row.countdown
          }
          this.urgeDialogVisible = true
        },

        confirmUrge: function () {
          const self = this
          const orderId = self.urgeOrder.orderId
          self.urgeLoading = true
          try {
            self.$axios({ url: '/api/urgency/call/' + orderId, method: 'post' })
              .then(function () {
                self.urgeLoading = false
                self.urgeDialogVisible = false
          self.$message.success('模拟催单已发送');
                self.loadStats()
              })
              .catch(function () {
                self.urgeLoading = false
                self.urgeDialogVisible = false
          self.$message.success('模拟操作已完成');
              })
          } catch (e) {
            self.urgeLoading = false
            self.urgeDialogVisible = false
          self.$message.success('模拟操作已完成');
          }
        }
      }
    })
  </script>
</body>
