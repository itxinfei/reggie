<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜品排行 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/chart-panel.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow-y: auto; overflow-x: hidden;
      background: var(--bg-page);
      font-family: var(--font-family-base); }
    .dish-ranking-page { min-height: 100%; display: flex; flex-direction: column; }
    .dish-ranking-page .container { flex: 1; background: transparent; padding: 24px 32px 32px;
      min-width: 0; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* 工具栏 */
    .tableBar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
      background: var(--bg-surface); padding: 16px 24px; border-radius: var(--radius-lg); margin-bottom: 20px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--el-border-light);
      transition: box-shadow 0.3s; }
    .tableBar:hover { box-shadow: var(--shadow-lg); }
    .tableBar .toolbar-label { font-size:var(--font-size-base); color: var(--el-text-regular); font-weight: 500; flex-shrink: 0; }
    .tableBar .toolbar-spacer { flex: 1; min-width: 0; }

    /* 图表并排 */
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 1200px) {
      .dish-ranking-page .container { padding: 16px 20px 20px !important; }
      .charts-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .dish-ranking-page .container { padding: 12px 16px 16px !important; }
    }

    /* 排名徽章 */
    .rank-badge { display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: var(--radius-md); font-size:var(--font-size-xs); font-weight: 700; }
    .rank-badge.r1 { background: var(--color-danger); color: var(--bg-surface); }
    .rank-badge.r2 { background: var(--color-brand-500); color: var(--bg-surface); }
    .rank-badge.r3 { background: var(--color-warning); color: var(--bg-surface); }
    .rank-badge.rn { background: var(--el-bg-lighter); color: var(--color-info); }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <div class="dish-ranking-page" id="report-dish-app" v-loading="loading">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <!-- 页头：标题 + 副标题 + 页级操作 -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">菜品排行</h1>
          <p class="ds-page-header__subtitle">查看菜品销量排行和热门菜品</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>


      <stat-cards :cards="statsCards"></stat-cards>

      <table-bar
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="loadData"
        @reset="reset"
        @action="onAction"
      >
        <template slot="search-extra">
          <el-date-picker v-model="dateRange" clearable value-format="yyyy-MM-dd"
            type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
            size="small"></el-date-picker>
          <el-input-number v-model="limit" :min="5" :max="50" :step="5"
            size="small" controls-position="right" style="width:100px;" placeholder="数量"></el-input-number>
        </template>
      </table-bar>

      <!-- 图表并排 -->
      <div class="charts-row">
        <chart-panel :title="rankingTitle" icon="📊">
          <div id="rankingChart" style="width:100%;height:340px;"></div>
        </chart-panel>
        <chart-panel title="Top 3 菜品销量趋势" icon="📈" v-show="tableData.length > 0">
          <div id="trendLineChart" style="width:100%;height:340px;"></div>
        </chart-panel>
      </div>

      <!-- 数据表格（统一 crud-table 组件，替代手写 el-table） -->
      <crud-table
        empty-hint="暂无相关记录"
        :data="tableData"
        :columns="dishColumns"
        :loading="loading"
        :show-pagination="false"
        :stripe="true"
        :border="true"
        aria-label="菜品销量排行"
      >
        <template #col-rank="{ $index }">
          <span :class="['rank-badge', $index === 0 ? 'r1' : $index === 1 ? 'r2' : $index === 2 ? 'r3' : 'rn']">
            {{ $index + 1 }}
          </span>
        </template>
        <template #col-ratio="{ row }">
          <el-progress :percentage="calcPercent(row.count)" :show-text="true"
            :stroke-width="12" :format="function(p) { return p + '%'; }"
            :color="progressColor(row.count)">
          </el-progress>
        </template>
      </crud-table>

    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/report.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/chart-panel.js"></script>
  <script>
    new Vue({
      el: '#report-dish-app',
      data: function() {
        return {
          loading: false, dateRange: [], limit: 10, categoryFilter: null,
          categories: [], tableData: [],
          // 搜索配置
          searchConfig: [
            { type: 'select', field: 'categoryId', placeholder: '菜品分类', width: '150px', options: [] }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'export', text: '导出 CSV', type: 'success', icon: 'el-icon-download' }
          ],
          // 表格列配置（配合 crud-table 组件，替代原手写 el-table 列定义）
          dishColumns: [
            { prop: 'rank', label: '排名', width: 80, align: 'center', slot: true },
            { prop: 'name', label: '菜品名称', width: 140 },
            { prop: 'count', label: '销量（份）', width: 120, type: 'number' },
            { prop: 'ratio', label: '占比', width: 140, align: 'center', slot: true }
          ],
          stats: { totalDishes: 0, topDishes: 0, totalSales: 0, avgSales: 0 },
          chart: null, trendChart: null, resizeHandler: null
        }
      },
      computed: {
        rankingTitle: function() {
          return '菜品销量排行（Top ' + (this.tableData ? this.tableData.length : 0) + '）';
        },
        statsCards: function() {
          const self = this;
          return [
            { key: '菜品', icon: '🍽', label: '菜品总数', value: self.stats.totalDishes || 0, color: 'primary' },
            { key: '上榜', icon: '🏆', label: '上榜菜品', value: self.stats.topDishes || 0, color: 'success' },
            { key: '总销量', icon: '📊', label: '总销量（份）', value: self.stats.totalSales || 0, color: 'warning' },
            { key: '平均', icon: '📈', label: '平均销量', value: self.stats.avgSales || 0, color: 'info' }
          ]
        }
      },
      created: function() {
        const self = this;
        const now = new Date();
        const first = new Date(now.getFullYear(), now.getMonth(), 1);
        const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        var fmt = function(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
        self.dateRange = [fmt(first), fmt(last)];
        self.loadCategories();
      },
      mounted: function() {
        const self = this;
        self.$nextTick(function() {
          const rEl = document.getElementById('rankingChart');
          const tEl = document.getElementById('trendLineChart');
          if (rEl) self.chart = echarts.init(rEl);
          if (tEl) self.trendChart = echarts.init(tEl);
          self.resizeHandler = function() {
            if (self.chart && !self.chart.isDisposed()) self.chart.resize();
            if (self.trendChart && !self.trendChart.isDisposed()) self.trendChart.resize();
          };
          window.addEventListener('resize', self.resizeHandler);
          setTimeout(function() {
            if (self.chart) self.chart.resize();
            if (self.trendChart) self.trendChart.resize();
          }, 400);
          self.loadData();
        });
      },
      beforeDestroy: function() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
        if (this.chart) { try { this.chart.dispose(); } catch(e) {} }
        if (this.trendChart) { try { this.trendChart.dispose(); } catch(e) {} }
      },
      methods: {
        loadCategories: function() {
          const self = this;
          $axios.get('/category/list').then(function(res) {
            if (res.code === 1 && res.data) {
              self.categories = res.data || [];
              // 更新搜索配置中的分类选项
              self.searchConfig[0].options = self.categories.map(function(c) { return { label: c.name, value: c.id } });
            }
          }).catch(function() {});
        },
        onAction: function(payload) {
          if (payload.key === 'export') {
            this.handleExport();
          }
        },
        loadData: function() {
          const self = this;
          self.loading = true;
          const params = {$2};
          if (self.dateRange && self.dateRange.length >= 2) {
            params.startDate = self.dateRange[0]; params.endDate = self.dateRange[1];
          }
          if (self.categoryFilter) params.categoryId = self.categoryFilter;

          Promise.all([reportDishRanking(params), self.loadDishRankingStats()])
            .then(function(results) {
              const rankRes = results[0], statsRes = results[1];
              if (String(rankRes.code) === '1') {
                self.tableData = rankRes.data || [];
                self.renderChart();
                self.loadTopTrend();
              } else { ReggieUI.error(rankRes.msg || '加载失败'); }
              if (statsRes && String(statsRes.code) === '1') {
                self.stats = statsRes.data || self.stats;
              }
            }).catch(function(err) { ReggieUI.error('请求失败：' + err); })
            .finally(function() { self.loading = false; });
        },
        loadDishRankingStats: function() {
          const self = this;
          return reportDishRanking({ limit: 1000 }).then(function(res) {
            if (String(res.code) === '1') {
              const data = res.data || [];
              var totalSales = data.reduce(function(s, i) { return s + (i.count || 0); }, 0);
              const avgSales = data.length > 0 ? Math.round(totalSales / data.length) : 0;
              return { code: 1, data: { totalDishes: data.length, topDishes: data.length, totalSales: totalSales, avgSales: avgSales } };
            }
            return { code: 0 };
          }).catch(function() { return { code: 0 }; });
        },
        loadTopTrend: function() {
          const self = this;
          if (!self.tableData || self.tableData.length === 0 || !self.trendChart) return;
          var top3Names = self.tableData.slice(0, 3).map(function(d) { return d.name; });
          if (top3Names.length === 0) return;
          $axios.get('/api/report/dish-trend', {
            params: {
              names: top3Names.join(','),
              startDate: self.dateRange && self.dateRange.length >= 2 ? self.dateRange[0] : '',
              endDate: self.dateRange && self.dateRange.length >= 2 ? self.dateRange[1] : ''
            }
          }).then(function(res) {
            if (res.code === 1 && res.data) self.renderTrendChart(res.data);
          }).catch(function() {});
        },
        renderTrendChart: function(data) {
          if (!this.trendChart) return;
          if (!data || !data.dates || !data.dates.length) {
            this.trendChart.setOption({
              title: { text: '暂无趋势数据', left: 'center', top: 'center',
                textStyle: { color: RgPalette.borderBase, fontSize: 14, fontWeight: 'normal' } }
            }, true); return;
          }
          var hexToRgba = function(hex, alpha) {
            const h = hex.replace('#','');
            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            const r = parseInt(h.substring(0,2), 16);
            const g = parseInt(h.substring(2,4), 16);
            const b = parseInt(h.substring(4,6), 16);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
          };
          const colors = [$2];
          const dates = data.dates || [];
          var series = (data.series || []).map(function(s, i) {
            const col = colors[i] || RgPalette.textSecondary;
            return {
              name: s.name, type: 'line', data: s.data || [], smooth: true,
              symbol: 'circle', symbolSize: 7,
              lineStyle: { color: col, width: 3 },
              itemStyle: { color: col, borderColor: RgPalette.white, borderWidth: 2 },
              areaStyle: { color: hexToRgba(col, 0.15) }
            };
          });
          this.trendChart.setOption({
            tooltip: { trigger: 'axis', backgroundColor: RgPalette.white,
              borderColor: RgPalette.borderLighter2, borderWidth: 1, textStyle: { color: RgPalette.textPrimary, fontSize: 13 } },
            legend: { data: (data.series || []).map(function(s) { return s.name; }),
              bottom: 8, textStyle: { fontSize: 12, color: RgPalette.textRegular } },
            grid: { left: 55, right: 30, top: 25, bottom: 52 },
            xAxis: { type: 'category', data: dates, boundaryGap: false,
              axisLine: { lineStyle: { color: RgPalette.borderLighter2 } }, axisTick: { show: false },
              axisLabel: { color: RgPalette.textSecondary, fontSize: 12 } },
            yAxis: { type: 'value', name: '销量(份)',
              nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
              splitLine: { lineStyle: { color: RgPalette.bgLight, type: 'dashed' } } },
            series: series
          }, true);
          const chart = this.trendChart;
          setTimeout(function() { if (chart && !chart.isDisposed()) chart.resize(); }, 200);
        },
        calcPercent: function(count) {
          if (!this.tableData.length) return 0;
          const max = this.tableData[0].count || 1;
          return Math.round(count / max * 100);
        },
        progressColor: function(count) {
          const max = this.tableData.length ? (this.tableData[0].count || 1) : 1;
          const ratio = count / max;
          if (ratio > 0.8) return RgPalette.seriesRed;
          if (ratio > 0.5) return RgPalette.linkBlue;
          return RgPalette.seriesGreen;
        },
        renderChart: function() {
          if (!this.chart) return;
          if (!this.tableData || this.tableData.length === 0) {
            this.chart.setOption({
              title: { text: '暂无排行数据', left: 'center', top: 'center',
                textStyle: { color: RgPalette.borderBase, fontSize: 14, fontWeight: 'normal' } }
            }, true); return;
          }
          var names = this.tableData.map(function(item) { return item.name; }).reverse();
          var counts = this.tableData.map(function(item) { return item.count; }).reverse();
          const maxVal = counts.length ? Math.max.apply(null, counts) : 1;
          const barWidth = names.length <= 5 ? 26 : names.length <= 10 ? 22 : 18;
          this.chart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
              backgroundColor: RgPalette.white, borderColor: RgPalette.borderLighter2, borderWidth: 1,
              textStyle: { color: RgPalette.textPrimary, fontSize: 13 },
              formatter: function(p) { return '<b>' + p[0].name + '</b><br/>' + p[0].marker + ' 销量：<b>' + p[0].value + ' 份</b>'; } },
            grid: { left: 130, right: 70, top: 16, bottom: 30 },
            xAxis: { type: 'value', name: '销量（份）',
              splitLine: { lineStyle: { type: 'dashed', color: RgPalette.bgLight } },
              axisLabel: { color: RgPalette.textSecondary } },
            yAxis: { type: 'category', data: names,
              axisLabel: { color: RgPalette.textRegular, interval: 0, width: 110, overflow: 'truncate', fontSize: 13 } },
            series: [{ type: 'bar', data: counts, barMaxWidth: barWidth,
              itemStyle: {
                borderRadius: [0, RgPalette.radiusMd, RgPalette.radiusMd, 0],
                color: function(params) {
                  const v = params.value, r = v / maxVal;
                  if (r > 0.8) return RgPalette.seriesRed;
                  if (r > 0.5) return RgPalette.linkBlue;
                  return RgPalette.success;
                }
              },
              label: { show: true, position: 'right', color: RgPalette.textRegular, fontSize: 12, fontWeight: 600,
                formatter: function(p) { return p.value + ' 份'; } }
            }]
          }, true);
          this.$nextTick(function() { if (this.chart) { this.chart.resize(); } }.bind(this));
        },
        reset: function() {
          this.dateRange = []; this.limit = 10; this.categoryFilter = null; this.tableData = [];
          if (this.chart) this.chart.clear(); if (this.trendChart) this.trendChart.clear();
        },
        handleExport: function() {
          const self = this
          if (!self.dateRange || self.dateRange.length < 2) {
            ReggieUI.warning('请先选择日期范围'); return;
          }
          reportExport({ startDate: self.dateRange[0], endDate: self.dateRange[1] }).then(function(blob) {
            if (blob && blob.type && blob.type.indexOf('json') > -1) { ReggieUI.error('导出失败'); return; }
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '菜品排行_' + self.dateRange[0] + '_' + self.dateRange[1] + '.csv';
            link.click(); URL.revokeObjectURL(link.href);
            ReggieUI.success('导出成功');
          }).catch(function(err) { ReggieUI.error('导出失败：' + err); });
        }
      }
    })
  </script>
</body>
</html>
