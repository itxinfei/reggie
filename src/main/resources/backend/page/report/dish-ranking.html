<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜品排行 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
  .search-btn { margin-left: 10px; }
  #rankingChart { width: 100%; height: 420px; }
  .rank-badge {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px; text-align: center;
    border-radius: 4px;
    font-size: 12px; font-weight: 700;
  }
  .rank-badge.r1 { background: #ff4d4f; color: #fff; }
  .rank-badge.r2 { background: #ff7a45; color: #fff; }
  .rank-badge.r3 { background: #ffa940; color: #fff; }
  .rank-badge.rn { background: #f0f0f0; color: #666; }

  /* ========== 数据统计卡片 ========== */
  .stats-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    border: 1px solid #f0f2f5;
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient);
  }

  .stat-card .stat-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 42px;
    opacity: 0.08;
  }

  .stat-card .stat-label {
    font-size: 13px;
    color: #909399;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .stat-card .stat-value {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-card.primary { --gradient: linear-gradient(135deg, #409eff 0%, #66b1ff 100%); }
  .stat-card.success { --gradient: linear-gradient(135deg, #67c23a 0%, #85ce61 100%); }
  .stat-card.warning { --gradient: linear-gradient(135deg, #e6a23c 0%, #ebb563 100%); }

  @media (max-width: 768px) {
    .stats-cards { grid-template-columns: 1fr; }
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="report-dish-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-date-picker v-model="dateRange"
          clearable
          value-format="yyyy-MM-dd"
          type="daterange"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          style="width: 380px"
        ></el-date-picker>
        <el-input-number v-model="limit" :min="5" :max="50" :step="5"
          size="small" style="width:120px;margin-left:10px;" controls-position="right">
        </el-input-number>
        <span style="margin-left:6px;color:#909399;font-size:13px;">条</span>
        <el-select v-model="categoryFilter" placeholder="菜品分类" size="small" style="width:150px;margin-left:10px;" clearable @change="loadData">
          <el-option v-for="cat in categories" :key="cat.id" :label="cat.name" :value="cat.id" />
        </el-select>
        <el-button type="primary" class="search-btn" @click="loadData">查询</el-button>
        <div class="tableLab">
          <el-button type="primary" @click="handleExport">导出</el-button>
        </div>
      </div>

      <!-- ========== 数据统计卡片 ========== -->
      <div class="stats-cards">
        <div class="stat-card primary">
          <div class="stat-icon">🍽️</div>
          <div class="stat-label">菜品总数</div>
          <div class="stat-value">{{ stats.totalDishes || 0 }}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">🏆</div>
          <div class="stat-label">上榜菜品</div>
          <div class="stat-value">{{ stats.topDishes || 0 }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">📊</div>
          <div class="stat-label">总销量（份）</div>
          <div class="stat-value">{{ stats.totalSales || 0 }}</div>
        </div>
      </div>

      <el-card shadow="never" style="margin-bottom: 20px;">
        <div slot="header">菜品销量排行（Top {{ tableData.length }}）</div>
        <div id="rankingChart"></div>
      </el-card>

      <!-- Top3 菜品趋势对比 -->
      <el-card shadow="never" style="margin-bottom: 20px;" v-show="tableData.length > 0">
        <div slot="header">Top 3 菜品销量趋势对比</div>
        <div id="trendLineChart" style="width:100%;height:320px;"></div>
      </el-card>

      <!-- 后端返回字段：name, count（无 salesCount / amount） -->
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column label="排名" width="70" align="center">
          <template slot-scope="{ $index }">
            <span :class="['rank-badge', $index === 0 ? 'r1' : $index === 1 ? 'r2' : $index === 2 ? 'r3' : 'rn']">
              {{ $index + 1 }}
            </span>
          </template>
        </el-table-column>
        <el-table-column prop="name" label="菜品名称"></el-table-column>
        <el-table-column prop="count" label="销量（份）" align="center"></el-table-column>
        <el-table-column label="占比" align="center">
          <template slot-scope="{ row }">
            <el-progress
              :percentage="calcPercent(row.count)"
              :show-text="true"
              :stroke-width="10"
              :format="p => p + '%'"
            ></el-progress>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script>
    new Vue({
      el: '#report-dish-app',
      data() {
        return {
          loading: false,
          dateRange: [],
          limit: 10,
          categoryFilter: null,
          categories: [],
          tableData: [],
          // 数据统计
          stats: {
            totalDishes: 0,
            topDishes: 0,
            totalSales: 0
          },
          chart: null,
          trendChart: null,
          resizeHandler: null
        }
      },
      created() {
        const now = new Date()
        const first = new Date(now.getFullYear(), now.getMonth(), 1)
        const last  = new Date(now.getFullYear(), now.getMonth() + 1, 0)
        const fmt = d => d.getFullYear() + '-'
          + String(d.getMonth() + 1).padStart(2, '0') + '-'
          + String(d.getDate()).padStart(2, '0')
        this.dateRange = [fmt(first), fmt(last)]
        this.loadCategories()
      },
      mounted() {
        this.$nextTick(() => {
          var rankingEl = document.getElementById('rankingChart')
          var trendEl = document.getElementById('trendLineChart')
          if (rankingEl) this.chart = echarts.init(rankingEl)
          if (trendEl) this.trendChart = echarts.init(trendEl)
          this.resizeHandler = () => {
            if (this.chart) this.chart.resize()
            if (this.trendChart) this.trendChart.resize()
          }
          window.addEventListener('resize', this.resizeHandler)
          this.loadData()
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.chart) this.chart.dispose()
        if (this.trendChart) this.trendChart.dispose()
      },
      methods: {
        // 加载菜品分类列表
        loadCategories() {
          $axios.get('/category/list').then(res => {
            if (res.code === 1 && res.data) this.categories = res.data || [];
          }).catch(() => {});
        },
        async loadData() {
          this.loading = true
          try {
            const params = { limit: this.limit }
            if (this.dateRange && this.dateRange.length >= 2) {
              params.startDate = this.dateRange[0]
              params.endDate   = this.dateRange[1]
            }

            // 并行加载排行数据和统计数据
            const [rankRes, statsRes] = await Promise.all([
              reportDishRanking(params),
              this.loadDishRankingStats()
            ])

            // 处理排行数据
            if (String(rankRes.code) === '1') {
              // 后端字段：name, count
              this.tableData = rankRes.data || []
              this.renderChart()
              // 加载Top3趋势
              this.loadTopTrend()
            } else {
              this.$message.error(rankRes.msg || '加载失败')
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          } catch (err) {
            this.$message.error('请求失败：' + err)
          } finally {
            this.loading = false
          }
        },
        // 加载菜品排行统计数据
        async loadDishRankingStats() {
          try {
            const res = await reportDishRanking({ limit: 1000 })
            if (String(res.code) === '1') {
              const data = res.data || []
              const totalSales = data.reduce((sum, item) => sum + (item.count || 0), 0)
              return {
                code: 1,
                data: {
                  totalDishes: data.length,
                  topDishes: data.length,
                  totalSales: totalSales
                }
              }
            }
          } catch (err) {
            console.warn('加载菜品排行统计数据失败:', err)
          }
          return { code: 0 }
        },
        // 加载Top3趋势对比数据
        loadTopTrend() {
          if (!this.tableData || this.tableData.length === 0 || !this.trendChart) return
          var top3Names = this.tableData.slice(0, 3).map(function(d) { return d.name })
          if (top3Names.length === 0) return
          // 获取最近7天各日期的趋势
          $axios.get('/api/report/dish-trend', {
            params: { names: top3Names.join(','), days: 7 }
          }).then(res => {
            if (res.code === 1 && res.data) this.renderTrendChart(res.data)
          }).catch(() => {})
        },
        renderTrendChart(data) {
          if (!this.trendChart) return
          var colors = ['#ff4d4f', '#5470c6', '#91cc75']
          var dates = data.dates || []
          var series = (data.series || []).map(function(s, i) {
            return {
              name: s.name, type: 'line', data: s.data || [],
              smooth: true, symbol: 'circle', symbolSize: 6,
              lineStyle: { color: colors[i] || '#909399', width: 2.5 },
              itemStyle: { color: colors[i] || '#909399' }
            }
          })
          this.trendChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: (data.series || []).map(function(s) { return s.name }), bottom: 0 },
            grid: { left: 50, right: 30, top: 10, bottom: 40 },
            xAxis: { type: 'category', data: dates, boundaryGap: false },
            yAxis: { type: 'value', name: '销量(份)' },
            series: series
          }, true)
        },
        calcPercent(count) {
          if (!this.tableData.length) return 0
          const max = this.tableData[0].count || 1
          return Math.round(count / max * 100)
        },
        renderChart() {
          if (!this.chart) return
          // 水平条形图，倒序展示（最高在上）
          const names  = this.tableData.map(item => item.name).reverse()
          const counts = this.tableData.map(item => item.count).reverse()
          const maxVal = counts.length ? Math.max(...counts) : 1
          this.chart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
              formatter: p => `<b>${p[0].name}</b><br/>${p[0].marker} 销量：<b>${p[0].value} 份</b>` },
            grid: { left: 130, right: 60, top: 16, bottom: 30 },
            xAxis: { type: 'value', name: '销量（份）',
              splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } } },
            yAxis: { type: 'category', data: names,
              axisLabel: { color: '#606266', interval: 0, width: 110,
                overflow: 'truncate', fontSize: 13 } },
            series: [{
              type: 'bar', data: counts, barMaxWidth: 32,
              itemStyle: {
                borderRadius: [0, 6, 6, 0],
                color(params) {
                  const ratio = params.value / maxVal
                  if (ratio > 0.8) return '#ff4d4f'
                  if (ratio > 0.5) return '#5470c6'
                  return '#91cc75'
                }
              },
              label: { show: true, position: 'right', color: '#606266', fontSize: 12,
                formatter: p => p.value + ' 份' }
            }]
          }, true)
        },
        handleExport() {
          if (!this.dateRange || this.dateRange.length < 2) {
            this.$message.warning('请先选择日期范围')
            return
          }
          // 导出日报CSV（后端 export 接口当前导出日报数据）
          reportExport({ startDate: this.dateRange[0], endDate: this.dateRange[1] })
            .then(blob => {
              if (blob && blob.type && blob.type.indexOf('json') > -1) {
                this.$message.error('导出失败')
                return
              }
              const link = document.createElement('a')
              link.href = URL.createObjectURL(blob)
              link.download = '菜品排名_' + this.dateRange[0] + '_' + this.dateRange[1] + '.csv'
              link.click()
              URL.revokeObjectURL(link.href)
              this.$message.success('导出成功')
            })
            .catch(err => this.$message.error('导出失败：' + err))
        }
      }
    })
  </script>
</body>
</html>
