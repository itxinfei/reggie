<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜品排行 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
  #rankingChart {
    width: 100%;
    height: 400px;
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="report-dish-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-date-picker v-model="dateRange"
          clearable
          value-format="yyyy-MM-dd"
          type="daterange"
          placeholder="选择日期范围"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          style="width: 400px"
        ></el-date-picker>
        <el-button type="primary" class="search-btn" @click="loadData">查询</el-button>
        <div class="tableLab">
          <el-button type="primary" @click="handleExport">导出</el-button>
        </div>
      </div>
      <el-card shadow="never" style="margin-bottom: 20px;">
        <div slot="header">菜品销量 Top 10</div>
        <div id="rankingChart"></div>
      </el-card>
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column type="index" label="排名" width="80"></el-table-column>
        <el-table-column prop="name" label="菜品名称"></el-table-column>
        <el-table-column prop="salesCount" label="销量"></el-table-column>
        <el-table-column label="金额">
          <template slot-scope="{ row }">
            <span>￥{{ row.amount }}</span>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script>
    new Vue({
      el: '#report-dish-app',
      data() {
        return {
          loading: false,
          dateRange: '',
          tableData: [],
          chart: null,
          resizeHandler: null
        }
      },
      created() {
        const now = new Date()
        const first = new Date(now.getFullYear(), now.getMonth(), 1)
        const last = new Date(now.getFullYear(), now.getMonth() + 1, 0)
        const fmt = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        this.dateRange = [fmt(first), fmt(last)]
      },
      mounted() {
        this.$nextTick(() => {
          this.chart = echarts.init(document.getElementById('rankingChart'))
          this.resizeHandler = () => { if (this.chart) this.chart.resize() }
          window.addEventListener('resize', this.resizeHandler)
          this.loadData()
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.chart) this.chart.dispose()
      },
      methods: {
        async loadData() {
          this.loading = true
          try {
            const params = {}
            if (this.dateRange && this.dateRange.length >= 2) {
              params.startDate = this.dateRange[0]
              params.endDate = this.dateRange[1]
            }
            const res = await reportDishRanking(params)
            if (String(res.code) === '1') {
              this.tableData = res.data || []
              this.renderChart()
            } else {
              this.$message.error(res.msg || '加载失败')
            }
          } catch (err) {
            this.$message.error('请求失败：' + err)
          } finally {
            this.loading = false
          }
        },
        renderChart() {
          if (!this.chart) return
          const names = this.tableData.map(item => item.name)
          const values = this.tableData.map(item => item.salesCount)
          const option = {
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: {
              type: 'value',
              name: '销量'
            },
            yAxis: {
              type: 'category',
              data: names.reverse(),
              axisLabel: { interval: 0 }
            },
            series: [{
              type: 'bar',
              data: values.reverse(),
              barMaxWidth: 40,
              itemStyle: {
                color: {
                  type: 'linear',
                  x: 0, y: 0, x2: 1, y2: 0,
                  colorStops: [
                    { offset: 0, color: '#409EFF' },
                    { offset: 1, color: '#66B1FF' }
                  ]
                }
              }
            }]
          }
          this.chart.setOption(option, true)
        },
        handleExport() {
          const params = { type: 'dish' }
          if (this.dateRange && this.dateRange.length >= 2) {
            params.startDate = this.dateRange[0]
            params.endDate = this.dateRange[1]
          }
          reportExport(params).then(blob => {
            if (blob.type && blob.type.indexOf('json') > -1) {
              const reader = new FileReader()
              reader.onload = (e) => {
                try {
                  const err = JSON.parse(e.target.result)
                  this.$message.error(err.msg || '导出失败')
                } catch (e2) {
                  this.$message.error('导出失败')
                }
              }
              reader.readAsText(blob)
              return
            }
            const link = document.createElement('a')
            link.href = URL.createObjectURL(blob)
            link.download = '菜品排名.csv'
            link.click()
            URL.revokeObjectURL(link.href)
            this.$message.success('导出成功')
          }).catch(err => {
            this.$message.error('导出失败：' + err)
          })
        }
      }
    })
  </script>
</body>
</html>
