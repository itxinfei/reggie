<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售报表 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      background: var(--bg-page);
    }
    .container {
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .chart-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .chart-title {
      font-size:var(--font-size-lg);
      font-weight: 600;
      color: var(--el-text-primary);
      margin-bottom: 16px;
    }
    .chart-container {
      height: 300px;
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#app" class="skip-link">跳转到主内容</a>
 <div id="app" class="container ds-page" role="main" aria-label="页面主要内容">
    <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title" id="page-title">销售报表</h1>
        <p class="ds-page-header__subtitle">统计商品销售数据</p>
      </div>
      <div class="ds-page-header__actions"></div>
    </header>

    <!-- 统计卡片 -->
    <stat-cards :cards="statsCards"></stat-cards>

    <!-- 工具栏 -->
    <table-bar
      :search-items="searchConfig"
      :actions="actionConfig"
      @search="fetchData"
      @reset="resetForm"
      @action="onAction"
    >
      <template slot="search-extra">
        <el-radio-group v-model="reportType" @change="handleTypeChange" size="small">
          <el-radio-button label="weekly">周报</el-radio-button>
          <el-radio-button label="monthly">月报</el-radio-button>
          <el-radio-button label="yearly">年报</el-radio-button>
        </el-radio-group>

        <template v-if="reportType === 'weekly'">
          <el-date-picker v-model="year" type="year" value-format="yyyy" size="small" style="width: 100px;" placeholder="年份"></el-date-picker>
          <el-input-number v-model="week" :min="1" :max="53" size="small" style="width: 100px;" placeholder="周数"></el-input-number>
        </template>

        <template v-if="reportType === 'monthly'">
          <el-date-picker v-model="year" type="year" value-format="yyyy" size="small" style="width: 100px;" placeholder="年份"></el-date-picker>
          <el-select v-model="month" size="small" style="width: 80px;" placeholder="月份">
            <el-option v-for="i in 12" :key="i" :label="i + '月'" :value="i"></el-option>
          </el-select>
        </template>

        <template v-if="reportType === 'yearly'">
          <el-date-picker v-model="year" type="year" value-format="yyyy" size="small" style="width: 100px;" placeholder="年份"></el-date-picker>
        </template>
      </template>
    </table-bar>

    <!-- 图表行 -->
    <div class="chart-row">
      <!-- 营业额趋势图 -->
      <div class="chart-card">
        <div class="chart-title">营业额趋势</div>
        <div id="revenueChart" class="chart-container"></div>
      </div>
      <!-- 订单数趋势图 -->
      <div class="chart-card">
        <div class="chart-title">订单数趋势</div>
        <div id="orderChart" class="chart-container"></div>
      </div>
    </div>

    <!-- 详情表格 -->
    <crud-table
      :data="detailData"
      :columns="tableColumns"
      :loading="loading"
      :show-pagination="false"
      :stripe="true"
      :border="true"
      aria-label="销售报表数据"
      empty-hint="暂无数据，试试调整筛选条件"
    >
    </crud-table>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <!-- 修改点：补引 axios —— request.js 首行即使用全局 axios，缺失会抛错导致
       $axios 永不挂载，本页所有接口请求全部失效 -->
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../api/report-enhanced.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        const now = new Date()
        return {
          loading: false,
          reportType: 'weekly',
          year: String(now.getFullYear()),
          month: now.getMonth() + 1,
          week: this.getWeekNumber(now),
          report: {
            totalRevenue: 0,
            totalOrders: 0,
            avgOrderValue: 0,
            completedCount: 0
          },
          detailData: [],
          revenueChart: null,
          orderChart: null,
          // 搜索配置
          searchConfig: [],
          // 操作按钮配置
          actionConfig: [
            { key: 'query', text: '查询', type: 'primary', icon: 'el-icon-search' }
          ],
          // 表格列配置
          tableColumns: [
            { prop: 'label', label: '时间', width: 120, align: 'center' },
            { prop: 'revenue', label: '营业额', width: 120, type: 'money' },
            { prop: 'orderCount', label: '订单数', width: 100, align: 'center', type: 'number' },
            { prop: 'completedCount', label: '完成数', width: 100, align: 'center', type: 'number' },
            { prop: 'avgOrderValue', label: '客单价', width: 120, type: 'money' }
          ]
        }
      },
      mounted() {
        this.initCharts()
        this.fetchData()
      },
      // 修改点：补清理，避免 resize 监听残留与 echarts 实例泄漏
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        ;[this.revenueChart, this.orderChart].forEach(function(ch) {
          if (ch && !ch.isDisposed()) { try { ch.dispose() } catch (e) {} }
        })
      },
      computed: {
        statsCards: function() {
          const self = this;
          return [
            { key: '营业额', icon: 'ri-money-cny-circle-line', label: '总营业额', value: '¥' + self.formatMoney(self.report.totalRevenue), color: 'primary' },
            { key: '订单数', icon: 'ri-file-list-3-line', label: '总订单数', value: self.report.totalOrders, color: 'success' },
            { key: '客单价', icon: 'ri-price-tag-3-line', label: '平均客单价', value: '¥' + self.formatMoney(self.report.avgOrderValue), color: 'warning' },
            { key: '完成数', icon: 'ri-checkbox-circle-line', label: '完成订单', value: self.report.completedCount, color: 'info' }
          ]
        }
      },
      methods: {
        getWeekNumber(date) {
          const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()))
          const dayNum = d.getUTCDay() || 7
          d.setUTCDate(d.getUTCDate() + 4 - dayNum)
          const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1))
          return Math.ceil((((d - yearStart) / 86400000) + 1) / 7)
        },
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        initCharts() {
          this.revenueChart = echarts.init(document.getElementById('revenueChart'))
          this.orderChart = echarts.init(document.getElementById('orderChart'))

          // 修改点：存引用以便 beforeDestroy 解绑（匿名函数无法 removeEventListener）
          this.resizeHandler = () => {
            const charts = [this.revenueChart, this.orderChart]
            charts.forEach(function(ch) { if (ch && !ch.isDisposed()) ch.resize() })
          }
          window.addEventListener('resize', this.resizeHandler)
        },
        handleTypeChange() {
          this.fetchData()
        },
        onAction(payload) {
          if (payload.key === 'query') {
            this.fetchData();
          }
        },
        resetForm() {
          const now = new Date();
          this.reportType = 'weekly';
          this.year = String(now.getFullYear());
          this.month = now.getMonth() + 1;
          this.week = this.getWeekNumber(now);
          this.fetchData();
        },
        async fetchData() {
          this.loading = true
          try {
            let res
            const yearNum = parseInt(this.year)
            
            if (this.reportType === 'weekly') {
              res = await getWeeklyReport({ year: yearNum, week: this.week })
            } else if (this.reportType === 'monthly') {
              res = await getMonthlyReport({ year: yearNum, month: this.month })
            } else {
              res = await getYearlyReport({ year: yearNum })
            }
            
            if (res.code === 1) {
              const data = res.data
              this.report = {
                totalRevenue: data.totalRevenue || 0,
                totalOrders: data.totalOrders || 0,
                avgOrderValue: data.avgDailyRevenue || data.avgWeeklyRevenue || data.avgMonthlyRevenue || 0,
                completedCount: data.totalOrders || 0
              }
              
              // Prepare detail data
              this.detailData = []
              const sourceData = data.dailyData || data.weeklyData || data.monthlyData || []
              sourceData.forEach(item => {
                this.detailData.push({
                  label: item.date || item.weekStart || (item.month + '月'),
                  revenue: item.revenue || 0,
                  orderCount: item.orderCount || 0,
                  completedCount: item.completedCount || 0,
                  avgOrderValue: item.orderCount > 0 ? (item.revenue / item.orderCount) : 0
                })
              })
              
              this.updateCharts()
            }
          } catch (err) {
            ReggieUI.error('获取数据失败')
          } finally {
            this.loading = false
          }
        },
        updateCharts() {
          const labels = this.detailData.map(d => d.label)
          const revenues = this.detailData.map(d => d.revenue)
          const orders = this.detailData.map(d => d.orderCount)
          
          // Revenue chart
          this.revenueChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', data: labels },
            yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
            series: [{
              name: '营业额',
              type: 'bar',
              data: revenues,
              itemStyle: { color: RgPalette.linkBlue }
            }]
          })
          
          // Order chart
          this.orderChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', data: labels },
            yAxis: { type: 'value' },
            series: [{
              name: '订单数',
              type: 'line',
              data: orders,
              itemStyle: { color: RgPalette.success },
              areaStyle: { opacity: 0.3 }
            }]
          })
        }
      }
    })
  </script>
</body>
</html>
