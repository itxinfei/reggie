<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售报表 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css?v=20260915c" />
    <link rel="stylesheet" href="../../styles/main.css?v=20260915c" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    /* ========== 页面基础布局 ========== */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-page);
    }
    /* 防抖动（2026-09-20）：滚动统一由 body 承担；若 html 也产生滚动条，append-to-body 的
       下拉浮层超出视口底部时会撑高 html、闪现第二滚动条挤占宽度，表格随之左右横跳 */
    html {
      overflow: hidden;
    }
    body {
      overflow-y: auto;
    }
    .container {
      padding: var(--space-2) var(--space-3);
      max-width: 1400px;
      margin: 0 auto;
    }
    /* ========== 图表卡片 ========== */
    .chart-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .chart-title {
      font-size:var(--font-size-lg);
      font-weight: 600;
      color: var(--el-text-primary);
      margin-bottom: 16px;
    }
    .chart-title__sub {
      font-size: var(--font-size-xs);
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 4px;
    }
    .chart-container {
      height: 300px;
    }
    /* 窄屏：图表降单列，容器留白收到 8px */
    @media (max-width: 1200px) {
      .chart-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .container { padding: var(--space-2); }
      .chart-card { padding: var(--space-3); }
      .chart-container { height: 260px; }
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
    <!-- 修改点：视觉隐藏的页面主标题，供屏幕阅读器播报（页头已移除，配合 main 的 aria-labelledby） -->
    <h1 class="sr-only" id="page-title">销售报表</h1>
    
    

    <!-- 统计卡片 -->
    <stat-cards :cards="statsCards"></stat-cards>

    <!-- 工具栏 -->
    <table-bar
      :search-items="searchConfig"
      :actions="actionConfig"
      @search="fetchData"
      @reset="resetForm"
      @action="onAction"
    >
      <template slot="search-extra">
        <el-radio-group v-model="reportType" @change="handleTypeChange" size="small">
          <el-radio-button label="weekly">周报</el-radio-button>
          <el-radio-button label="monthly">月报</el-radio-button>
          <el-radio-button label="yearly">年报</el-radio-button>
        </el-radio-group>

        <template v-if="reportType === 'weekly'">
          <el-date-picker v-model="year" type="year" value-format="yyyy" size="small" style="width: 100px" placeholder="年份"></el-date-picker>
          <el-input-number v-model="week" :min="1" :max="53" size="small" style="width: 100px" placeholder="周数"></el-input-number>
        </template>

        <template v-if="reportType === 'monthly'">
          <el-date-picker v-model="year" type="year" value-format="yyyy" size="small" style="width: 100px;" placeholder="年份"></el-date-picker>
          <el-select v-model="month" size="small" style="width: 80px;" placeholder="月份">
            <el-option v-for="i in 12" :key="i" :label="i + '月'" :value="i"></el-option>
          </el-select>
        </template>

        <template v-if="reportType === 'yearly'">
          <el-date-picker v-model="year" type="year" value-format="yyyy" size="small" style="width: 100px;" placeholder="年份"></el-date-picker>
        </template>
      </template>
    </table-bar>

    <!-- 图表行 -->
    <div class="chart-row">
      <!-- 营业额趋势图 -->
      <div class="chart-card">
        <div class="chart-title">营业额趋势<span class="chart-title__sub">（{{ periodLabel }}）</span></div>
        <div id="revenueChart" class="chart-container"></div>
      </div>
      <!-- 订单数趋势图 -->
      <div class="chart-card">
        <div class="chart-title">订单数趋势<span class="chart-title__sub">（{{ periodLabel }}）</span></div>
        <div id="orderChart" class="chart-container"></div>
      </div>
    </div>

    <!-- 详情表格 -->
    <crud-table
      :data="detailData"
      :columns="tableColumns"
      :loading="loading"
      :show-pagination="false"
      :stripe="true"
      :border="true"
      aria-label="销售报表数据"
      empty-hint="暂无数据，试试调整筛选条件"
    >
    </crud-table>
 </main>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <!-- 修改点：补引 axios —— request.js 首行即使用全局 axios，缺失会抛错导致
       $axios 永不挂载，本页所有接口请求全部失效 -->
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260915c"></script>
  <script src="../../js/components.js?v=20260924"></script>
  <script src="../../js/accessibility-utils.js?v=20260915c"></script>
  <script src="../../js/performance-utils.js?v=20260915c"></script>
  <script src="../../js/common.js?v=20260915c"></script>
  <script src="../../api/report-enhanced.js?v=20260915c"></script>
  <script>
    new Vue({
      el: '#main-content',
      data() {
        const now = new Date()
        return {
          loading: false,
          reportType: 'weekly',
          year: String(now.getFullYear()),
          month: now.getMonth() + 1,
          week: this.getWeekNumber(now),
          report: {
            totalRevenue: 0,
            totalOrders: 0,
            avgOrderValue: 0,
            completedCount: 0
          },
          detailData: [],
          revenueChart: null,
          orderChart: null,
          // 搜索配置
          searchConfig: [],
          // 操作按钮配置：查询按钮由 table-bar 左侧标准区（@search=fetchData）统一处理，避免 action-group 出现重复素色按钮
          actionConfig: [],
          // 表格列配置
          tableColumns: [
            { prop: 'label', label: '时间', width: 120, align: 'center' },
            { prop: 'revenue', label: '营业额', width: 120, type: 'money' },
            { prop: 'orderCount', label: '订单数', width: 100, align: 'center', type: 'number' },
            { prop: 'completedCount', label: '完成数', width: 100, align: 'center', type: 'number' },
            { prop: 'avgOrderValue', label: '客单价', width: 120, type: 'money' }
          ]
        }
      },
      mounted() {
        this.initCharts()
        this.fetchData()
      },
      // 修改点：补清理，避免 resize 监听残留与 echarts 实例泄漏
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        ;[this.revenueChart, this.orderChart].forEach(function(ch) {
          if (ch && !ch.isDisposed()) { try { ch.dispose() } catch (e) {} }
        })
      },
      computed: {
        // 图表标题中的统计周期，随周报/月报/年报切换实时变化
        periodLabel: function() {
          if (this.reportType === 'weekly') return this.year + '年 第' + this.week + '周'
          if (this.reportType === 'monthly') return this.year + '年' + this.month + '月'
          return this.year + '年'
        },
        statsCards: function() {
          const self = this;
          return [
            { key: '营业额', icon: 'ri-money-cny-circle-line', label: '总营业额', value: '¥' + self.formatMoney(self.report.totalRevenue), color: 'primary' },
            { key: '订单数', icon: 'ri-file-list-3-line', label: '总订单数', value: self.report.totalOrders, color: 'success' },
            { key: '客单价', icon: 'ri-price-tag-3-line', label: '平均客单价', value: '¥' + self.formatMoney(self.report.avgOrderValue), color: 'warning' },
            { key: '完成数', icon: 'ri-checkbox-circle-line', label: '完成订单', value: self.report.completedCount, color: 'info' }
          ]
        }
      },
      methods: {
        /* ========== 工具方法 ========== */
        getWeekNumber(date) {
          const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()))
          const dayNum = d.getUTCDay() || 7
          d.setUTCDate(d.getUTCDate() + 4 - dayNum)
          const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1))
          return Math.ceil((((d - yearStart) / 86400000) + 1) / 7)
        },
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        /* ========== 图表初始化 ========== */
        initCharts() {
          var dom1 = document.getElementById('revenueChart');
          if (dom1) this.revenueChart = echarts.init(dom1);
          var dom2 = document.getElementById('orderChart');
          if (dom2) this.orderChart = echarts.init(dom2);

          // 修改点：存引用以便 beforeDestroy 解绑（匿名函数无法 removeEventListener）
          this.resizeHandler = () => {
            const charts = [this.revenueChart, this.orderChart]
            charts.forEach(function(ch) { if (ch && !ch.isDisposed()) ch.resize() })
          }
          window.addEventListener('resize', this.resizeHandler)
        },
        /* ========== 数据加载 ========== */
        handleTypeChange() {
          this.fetchData()
        },
        onAction(payload) {
          if (payload.key === 'query') {
            this.fetchData();
          }
        },
        resetForm() {
          const now = new Date();
          this.reportType = 'weekly';
          this.year = String(now.getFullYear());
          this.month = now.getMonth() + 1;
          this.week = this.getWeekNumber(now);
          this.fetchData();
        },
        async fetchData() {
          this.loading = true
          try {
            let res
            const yearNum = parseInt(this.year)
            
            if (this.reportType === 'weekly') {
              res = await getWeeklyReport({ year: yearNum, week: this.week })
            } else if (this.reportType === 'monthly') {
              res = await getMonthlyReport({ year: yearNum, month: this.month })
            } else {
              res = await getYearlyReport({ year: yearNum })
            }
            
            if (res.code === 1) {
              const data = res.data

              // Prepare detail data
              this.detailData = []
              const sourceData = data.dailyData || data.weeklyData || data.monthlyData || []
              let totalRevenue = 0
              let totalOrderCount = 0
              let totalCompletedCount = 0
              sourceData.forEach(item => {
                const revenue = Number(item.revenue) || 0
                const orderCount = Number(item.orderCount) || 0
                const completedCount = Number(item.completedCount) || 0
                totalRevenue += revenue
                totalOrderCount += orderCount
                totalCompletedCount += completedCount
                this.detailData.push({
                  label: item.date || item.weekStart || (item.month + '月'),
                  revenue: revenue,
                  orderCount: orderCount,
                  completedCount: completedCount,
                  avgOrderValue: orderCount > 0 ? (revenue / orderCount) : 0
                })
              })

              // 修改点：客单价 = 总营收 / 总订单数（此前误用后端 avgDailyRevenue=总营收/天数）；
              // 完成订单数 = 明细 completedCount 求和（此前 totalOrders 含取消单）
              this.report = {
                totalRevenue: data.totalRevenue || 0,
                totalOrders: data.totalOrders || 0,
                avgOrderValue: totalOrderCount > 0 ? (totalRevenue / totalOrderCount) : 0,
                completedCount: totalCompletedCount
              }

              this.updateCharts()
            }
          } catch (err) {
            ReggieUI.error('获取数据失败')
          } finally {
            this.loading = false
          }
        },
        /* ========== 图表更新 ========== */
        updateCharts() {
          const labels = this.detailData.map(d => d.label)
          const revenues = this.detailData.map(d => d.revenue)
          const orders = this.detailData.map(d => d.orderCount)
          const emptyTitle = { text: '暂无数据', left: 'center', top: 'center',
            textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } }

          // Revenue chart
          // 第二参 true（notMerge）：切换周/月/年后轴与系列口径不同，防止旧配置残留
          if (!labels.length) {
            this.revenueChart.setOption({ title: emptyTitle }, true)
          } else {
            this.revenueChart.setOption({
              // 金额 tooltip 统一半角 ¥ + 千分位（¥12,345.67）
              tooltip: { trigger: 'axis', formatter: function(params) {
                var p = params[0]
                return p.name + '<br/>' + p.marker + p.seriesName + '：¥' + RgFormat.formatMoney(p.value)
              } },
              grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
              xAxis: { type: 'category', data: labels },
              yAxis: { type: 'value', name: '营业额(元)', axisLabel: {
                formatter: function(v) { return '¥' + Number(v).toLocaleString('zh-CN'); } } },
              series: [{
                name: '营业额',
                type: 'bar',
                data: revenues,
                // 修改点：金额系列用金额绿 seriesGreen（原误用链接蓝 linkBlue）
                itemStyle: { color: RgPalette.seriesGreen }
              }]
            }, true)
          }

          // Order chart
          if (!labels.length) {
            this.orderChart.setOption({ title: emptyTitle }, true)
          } else {
            this.orderChart.setOption({
              // 单数 tooltip：千分位整数 + 单位「单」
              tooltip: { trigger: 'axis', formatter: function(params) {
                var p = params[0]
                return p.name + '<br/>' + p.marker + p.seriesName + '：' + RgFormat.formatNumber(p.value) + ' 单'
              } },
              grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
              xAxis: { type: 'category', data: labels },
              yAxis: { type: 'value', name: '订单数(单)', minInterval: 1,
                axisLabel: { formatter: '{value} 单' } },
              series: [{
                name: '订单数',
                type: 'line',
                data: orders,
                // 修改点：单数系列统一用 seriesBlue（原误用 success 绿）
                itemStyle: { color: RgPalette.seriesBlue },
                areaStyle: { opacity: 0.3 }
              }]
            }, true)
          }
        }
      }
    })
  </script>
</body>
</html>
