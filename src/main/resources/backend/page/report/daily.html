<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>营业日报 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/chart-panel.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    /* ========== 基础重置 ========== */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: linear-gradient(135deg, var(--el-bg-subtle) 0%, var(--el-border-lighter) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ========== 主容器 ========== */
    .daily-container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .daily-container .container {
      flex: 1;
      background: transparent;
      padding: 24px 32px 32px;
      min-width: 0;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    /* ========== 工具栏 ========== */
    .tableBar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: all 0.3s;
    }
    .tableBar:hover {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    .tableBar .toolbar-label {
      font-size: 14px;
      color: var(--el-text-regular);
      font-weight: 500;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .tableBar .toolbar-spacer {
      flex: 1;
      min-width: 0;
    }

    /* ========== KPI 卡片（使用 components-stats-card.css 统一样式） ========== */

    /* ========== 导出记录折叠面板 ========== */
    .export-records-panel {
      background: var(--bg-surface);
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
      overflow: hidden;
      transition: all 0.3s;
    }
    .export-records-panel:hover {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .export-records-panel .panel-header {
      display: flex;
      align-items: center;
      padding: 18px 24px;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    .export-records-panel .panel-header:hover {
      background: var(--el-bg-ghost);
    }
    .export-records-panel .panel-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--el-text-primary);
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .export-records-panel .record-count-badge {
      background: var(--el-color-primary);
      color: var(--bg-surface);
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: 600;
    }
    .export-records-panel .expand-icon {
      transition: transform 0.3s;
      color: var(--el-border-base);
      font-size: 14px;
    }
    .export-records-panel .expand-icon.is-expanded {
      transform: rotate(180deg);
    }
    .export-records-panel .panel-body {
      padding: 0 24px 20px;
      transition: all 0.3s;
    }

    /* ========== 导出记录表格 ========== */
    .record-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .record-table thead th {
      background: var(--el-bg-ghost);
      color: var(--color-info);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid var(--el-bg-page);
    }
    .record-table tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--el-bg-light);
      color: var(--el-text-regular);
      vertical-align: middle;
    }
    .record-table tbody tr {
      transition: all 0.2s;
    }
    .record-table tbody tr:hover {
      background: var(--el-bg-ghost);
    }
    .record-table tbody tr:last-child td {
      border-bottom: none;
    }
    .format-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .format-tag.excel {
      background: var(--el-color-primary-lighter);
      color: var(--el-color-primary);
    }
    .format-tag.pdf {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-tag.success {
      background: var(--color-success-light);
      color: var(--color-success);
    }
    .status-tag.failed {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.success { background: var(--color-success); }
    .status-dot.failed { background: var(--color-danger); }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--el-border-base);
    }
    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }
    .empty-state .empty-text {
      font-size: 14px;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 1400px) {
      .kpi-cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 1200px) {
      .container { padding: 20px 28px 28px !important; }
      .tableBar { padding: 14px 20px; }
      /* 修改点：中等屏幕下双图改为单列 */
      .daily-two-col { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 768px) {
      .container { padding: 12px 16px 16px !important; }
      .stats-cards { grid-template-columns: 1fr; gap: 12px; }
      .stat-card { padding: 18px; min-height: 110px; }
      .stat-card .stat-value { font-size: 26px; }
      .tableBar { flex-direction: column; align-items: stretch; }
      .tableBar .toolbar-spacer { display: none; }
    }
    @media (max-width: 480px) {
      .stat-card { padding: 16px; min-height: 100px; }
      .stat-card .stat-value { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container daily-container" id="report-daily-app">
    <div class="container">

      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 stat-card -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 tableBar -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="loadData"
        @reset="onTableReset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-date-picker
            v-model="queryDate"
            type="daterange"
            range-separator="至"
            start-placeholder="开始日期"
            end-placeholder="结束日期"
            value-format="yyyy-MM-dd"
            :shortcuts="dateShortcuts"
            @change="onDateChange"
            size="small"
          ></el-date-picker>
        </template>
      </table-bar>

      <!-- ========== 趋势图 + 分类销售 双图 ========== -->
      <!-- 修改点：图表容器增加 min-height 防止变形，统一 class 便于响应式 -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;" class="daily-two-col">
      <chart-panel style="margin-bottom:0;" padding="24px" margin-bottom="0">
        <template #title>
          <i class="el-icon-data-line" style="color:var(--el-color-primary);"></i>
          营收趋势
          <span style="font-size:12px;color:var(--el-border-base);font-weight:400;margin-left:4px;">（近7天）</span>
        </template>
        <div style="flex:1;min-height:360px;" id="trendChart"></div>
      </chart-panel>
      <chart-panel style="margin-bottom:0;" padding="24px" margin-bottom="0">
        <template #title>
          <i class="el-icon-pie-chart" style="color:var(--color-warning);"></i>
          菜品分类销售占比
          <span style="font-size:12px;color:var(--el-border-base);font-weight:400;margin-left:4px;">（基于已选日期）</span>
        </template>
        <div style="flex:1;min-height:360px;" id="categoryChart"></div>
      </chart-panel>
      </div>

      <!-- ========== 导出记录折叠面板 ========== -->
      <div class="export-records-panel">
        <div class="panel-header" @click="toggleRecords">
          <div class="panel-title">
            <i class="el-icon-s-order" style="color:var(--color-success);"></i>
            导出记录
            <span class="record-count-badge" v-if="exportRecords.length > 0">{{ exportRecords.length }}</span>
          </div>
          <i
            :class="['el-icon-arrow-down expand-icon', { 'is-expanded': recordsExpanded }]"
          ></i>
        </div>
        <div class="panel-body" v-show="recordsExpanded">
          <div v-if="exportRecords.length === 0" class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">暂无导出记录</div>
          </div>
          <div v-else style="overflow-x:auto;">
            <table class="record-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>导出时间</th>
                  <th>日期范围</th>
                  <th>格式</th>
                  <th>文件大小</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(record, index) in exportRecords" :key="record.id">
                  <td>{{ index + 1 }}</td>
                  <td>{{ record.exportTime }}</td>
                  <td>{{ record.dateRange }}</td>
                  <td>
                    <span :class="['format-tag', record.format]">
                      {{ record.format.toUpperCase() }}
                    </span>
                  </td>
                  <td>{{ record.fileSize }}</td>
                  <td>
                    <span :class="['status-tag', record.status]">
                      <span :class="['status-dot', record.status]"></span>
                      {{ record.status === 'success' ? '成功' : '失败' }}
                    </span>
                  </td>
                  <td>
                    <template v-if="record.status === 'success'">
                      <el-button
                        type="text"
                        size="mini"
                        icon="el-icon-download"
                        @click="reDownload(record)"
                      >重新下载</el-button>
                      <el-button
                        type="text"
                        size="mini"
                        icon="el-icon-delete"
                        style="color:var(--color-danger);"
                        @click="deleteRecord(index)"
                      >删除</el-button>
                    </template>
                    <span v-else style="color:var(--el-border-base);font-size:12px;">--</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- ========== 全屏导出 Loading 遮罩 ========== -->
    <div v-loading="exporting" element-loading-text="正在导出..." element-loading-background="rgba(0,0,0,0.5)"></div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/export.js"></script>
  <script src="../../api/report.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/chart-panel.js"></script>
  <script>
    new Vue({
      el: '#report-daily-app',
      data() {
        // 日期快捷选项：今天、近7天、近30天、本月、上月
        const formatDate = function(d) {
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        };
        const today = new Date();
        const todayStr = formatDate(today);
        const day7 = new Date(today);
        day7.setDate(day7.getDate() - 6);
        const day7Str = formatDate(day7);
        const day30 = new Date(today);
        day30.setDate(day30.getDate() - 29);
        // 本月第一天
        const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
        // 上月
        const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0);
        const lastMonthStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);

        return {
          loading: false,
          exporting: false,
          queryDate: [day7Str, todayStr], // 默认范围：近7天（已格式化为 yyyy-MM-dd 字符串）
          dailyData: {},
          chart: null,
          categoryChart: null,
          resizeHandler: null,
          // 导出记录
          exportRecords: [],
          recordsExpanded: false,
          // 成功导出的 Blob 缓存（用于重新下载）
          _blobCache: {},
          dateShortcuts: [
            {
              text: '今天',
              onClick(picker) {
                const d = new Date();
                picker.$emit('pick', [d, d]);
              }
            },
            {
              text: '近7天',
              onClick(picker) {
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - 6);
                picker.$emit('pick', [start, end]);
              }
            },
            {
              text: '近30天',
              onClick(picker) {
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - 29);
                picker.$emit('pick', [start, end]);
              }
            },
            {
              text: '本月',
              onClick(picker) {
                const start = new Date(today.getFullYear(), today.getMonth(), 1);
                picker.$emit('pick', [start, today]);
              }
            },
            {
              text: '上月',
              onClick(picker) {
                const start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                const end = new Date(today.getFullYear(), today.getMonth(), 0);
                picker.$emit('pick', [start, end]);
              }
            }
          ],
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'exportExcel', text: '导出 Excel', type: 'success' },
            { key: 'exportPdf', text: '导出 PDF', type: 'warning' }
          ]
        }
      },
      computed: {
        completionRate() {
          const total = this.dailyData.totalOrders || 0
          const completed = this.dailyData.completedOrders || 0
          if (!total) return '0.0'
          return (completed / total * 100).toFixed(1)
        },
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: '订单', icon: '📋', label: '订单总数', value: self.dailyData.totalOrders || 0, color: 'primary' },
            { key: '营业额', icon: '💰', label: '营业额（元）', value: '¥' + self.formatMoney(self.dailyData.totalAmount), color: 'success' },
            { key: '客单价', icon: '🏷️', label: '客单价（元）', value: '¥' + self.formatMoney(self.dailyData.avgAmount), color: 'warning' },
            { key: '完成率', icon: '📊', label: '完成 / 取消', value: (self.dailyData.completedOrders || 0) + ' / ' + (self.dailyData.cancelledOrders || 0), color: 'danger' }
          ]
        }
      },
      created() {
        // queryDate 默认值已通过 data() 中闭包设置
      },
      mounted() {
        var self = this;
        this.$nextTick(() => {
          // 修改点：安全初始化图表，增加容器存在判断
          var initChart = function(id) {
            var el = document.getElementById(id);
            if (!el) { console.warn('[daily] 图表容器未找到:', id); return null; }
            return echarts.init(el);
          };
          this.chart = initChart('trendChart');
          this.categoryChart = initChart('categoryChart');
          this.resizeHandler = () => {
            if (this.chart && !this.chart.isDisposed()) this.chart.resize();
            if (this.categoryChart && !this.categoryChart.isDisposed()) this.categoryChart.resize();
          };
          window.addEventListener('resize', this.resizeHandler);
          // 修改点：延迟 resize 确保 Chart 容器已撑开
          setTimeout(function() {
            if (self.chart) self.chart.resize();
            if (self.categoryChart) self.categoryChart.resize();
          }, 400);
          this.loadData();
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
        if (this.chart) { try { this.chart.dispose(); } catch(e) {} }
        if (this.categoryChart) { try { this.categoryChart.dispose(); } catch(e) {} }
      },
      methods: {
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'exportExcel') { this.handleExport('excel'); }
          else if (payload.key === 'exportPdf') { this.handleExport('pdf'); }
        },
        // 格式化日期为 yyyy-MM-dd
        formatDateStr(date) {
          const y = date.getFullYear()
          const m = String(date.getMonth() + 1).padStart(2, '0')
          const d = String(date.getDate()).padStart(2, '0')
          return y + '-' + m + '-' + d
        },

        // table-bar @reset — 重置日期到今天
        onTableReset: function() {
          var today = new Date()
          var y = today.getFullYear()
          var m = String(today.getMonth() + 1).padStart(2, '0')
          var d = String(today.getDate()).padStart(2, '0')
          this.queryDate = [y + '-' + m + '-' + d, y + '-' + m + '-' + d]
          this.loadData()
        },
        onDateChange(val) {
          if (val && val.length === 2) {
            this.loadData()
          }
        },

        // 加载日报数据 + 趋势图
        async loadData() {
          if (!this.queryDate || this.queryDate.length < 2) {
            ReggieUI.warning('请选择日期范围')
            return
          }
          const [startDate, endDate] = this.queryDate
          this.loading = true
          try {
            // 日报数据（使用开始日期作为日报日期参数）
            const dailyRes = await reportDaily({ date: startDate })
            if (String(dailyRes.code) === '1') {
              this.dailyData = dailyRes.data || {}
            } else {
              ReggieUI.notify({
                title: '日报加载失败',
                message: dailyRes.msg || '无法获取日报数据，请重试',
                type: 'error',
                duration: 5000
              })
            }

            // 趋势数据
            const trendRes = await $axios.get('/api/dashboard/trend')
            if (String(trendRes.code) === '1') {
              this.renderChart(trendRes.data || [])
            } else {
              this.renderChart([])
            }

            // 分类销售数据
            const catRes = await $axios.get('/api/report/category-sales', {
              params: { startDate: this.queryDate[0], endDate: this.queryDate[1] }
            })
            if (String(catRes.code) === '1') {
              this.renderCategoryChart(catRes.data || [])
            } else {
              this.renderCategoryChart(null)
            }
          } catch (err) {
            ReggieUI.notify({
              title: '请求失败',
              message: err.message || String(err),
              type: 'error',
              duration: 6000
            })
          } finally {
            this.loading = false
          }
        },

        renderChart(trendData) {
          if (!this.chart) return
          if (!trendData || trendData.length === 0) {
            this.chart.setOption({
              title: { text: '暂无趋势数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          const dates   = trendData.map(t => t.date)
          const orders  = trendData.map(t => t.orderCount || 0)
          const amounts = trendData.map(t => Number(t.revenue) || 0)
          const hasData = dates.length > 0
          // 修改点：根据数据量自适应柱宽，防止图表拥挤变形
          var barW = dates.length <= 5 ? 32 : dates.length <= 10 ? 26 : 20;
          this.chart.setOption({
            tooltip: {
              trigger: 'axis',
              axisPointer: { type: 'cross', crossStyle: { color: '#d4d7de' } },
              backgroundColor: 'rgba(255,255,255,0.96)',
              borderColor: '#e4e7ed',
              borderWidth: 1,
              textStyle: { color: '#303133', fontSize: 13 },
              formatter(params) {
                let html = '<b>' + params[0].axisValue + '</b><br/>'
                params.forEach(p => {
                  const val = p.seriesName === '营业额'
                    ? '¥' + Number(p.value).toFixed(2)
                    : p.value + ' 单'
                  html += p.marker + ' ' + p.seriesName + '：<b>' + val + '</b><br/>'
                })
                return html
              }
            },
            legend: { data: ['订单数', '营业额'], bottom: 8, textStyle: { color: '#606266', fontSize: 13 } },
            // 修改点：增大 top/bottom/right 防止双Y轴标签和 legend 被裁剪
            grid: { left: 50, right: 65, top: 30, bottom: 52 },
            xAxis: {
              type: 'category',
              data: hasData ? dates : ['暂无数据'],
              axisLine: { lineStyle: { color: '#e4e7ed' } },
              axisTick: { show: false },
              axisLabel: { color: '#909399', fontSize: 12, rotate: dates.length > 7 ? 30 : 0 }
            },
            yAxis: [
              {
                type: 'value', name: '订单量(单)',
                nameTextStyle: { color: '#909399', fontSize: 12 },
                axisLabel: { color: '#909399', fontSize: 12 },
                splitLine: { lineStyle: { color: '#f2f3f5', type: 'dashed' } },
                axisLine: { show: false }, axisTick: { show: false }
              },
              {
                type: 'value', name: '营业额(元)',
                nameTextStyle: { color: '#909399', fontSize: 12 },
                axisLabel: { color: '#909399', fontSize: 12, formatter: '¥{value}' },
                splitLine: { show: false },
                axisLine: { show: false }, axisTick: { show: false }
              }
            ],
            series: [
              {
                name: '订单数', type: 'bar', data: hasData ? orders : [0],
                barWidth: barW, barGap: '20%',
                itemStyle: {
                  borderRadius: [6, 6, 0, 0],
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#6c9df8' },
                    { offset: 1, color: '#5470c6' }
                  ])
                },
                label: { show: hasData, position: 'top', color: '#5470c6', fontSize: 12, fontWeight: 600, formatter: '{c}' }
              },
              {
                name: '营业额', type: 'line', yAxisIndex: 1, data: hasData ? amounts : [0],
                smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                lineStyle: { color: '#91cc75', width: 3 },
                itemStyle: { color: '#91cc75', borderColor: '#fff', borderWidth: 2 },
                areaStyle: {
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: 'rgba(145,204,117,0.28)' },
                    { offset: 1, color: 'rgba(145,204,117,0.02)' }
                  ])
                },
                label: {
                  show: hasData, position: 'top', color: '#67a94e', fontSize: 12, fontWeight: 700,
                  formatter: p => '¥' + Number(p.value).toFixed(0)
                }
              }
            ]
          }, true)
          // 修改点：渲染后延迟 resize 确保在 flex 布局中尺寸正确
          var self = this;
          setTimeout(function() { if (self.chart && !self.chart.isDisposed()) self.chart.resize(); }, 200);
        },

        // 渲染分类销售饼图
        renderCategoryChart(data) {
          if (!this.categoryChart) return
          if (!data || data.length === 0) {
            this.categoryChart.setOption({
              title: { text: '暂无分类数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          var colors = ['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#fc8452','#9a60b4','#ea7ccc']
          this.categoryChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c} 份 ({d}%)' },
            legend: { bottom: 4, textStyle: { fontSize: 12 } },
            series: [{
              type: 'pie',
              radius: ['45%', '72%'],
              // 修改点：center top 从 48% 提至 44%，为底部 legend 留出空间
              center: ['50%', '44%'],
              itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
              label: { fontSize: 12, formatter: '{b}\n{d}%' },
              emphasis: { scaleSize: 8, label: { fontSize: 15, fontWeight: 'bold' } },
              data: data.map(function(item, i) {
                return { name: item.name, value: item.count, itemStyle: { color: colors[i % colors.length] } }
              })
            }]
          }, true)
        },

        // 格式化金额
        formatMoney(val) {
          if (val === null || val === undefined) return '0.00'
          return Number(val).toFixed(2)
        },

        // 格式化文件大小
        formatFileSize(bytes) {
          if (bytes === 0) return '0 B'
          const k = 1024
          const sizes = ['B', 'KB', 'MB', 'GB']
          const i = Math.floor(Math.log(bytes) / Math.log(k))
          const idx = Math.min(i, sizes.length - 1)
          return (bytes / Math.pow(k, idx)).toFixed(idx > 0 ? 2 : 0) + ' ' + sizes[idx]
        },

        // 生成唯一 ID
        genId() {
          return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8)
        },

        // 获取当前时间字符串
        getNowStr() {
          const now = new Date()
          const pad = n => String(n).padStart(2, '0')
          return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
            + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds())
        },

        // 切换导出记录折叠
        toggleRecords() {
          this.recordsExpanded = !this.recordsExpanded
        },

        // 导出处理
        async handleExport(format) {
          if (!this.queryDate || this.queryDate.length < 2) {
            ReggieUI.warning('请先选择日期范围')
            return
          }
          const [startDate, endDate] = this.queryDate
          const now = this.getNowStr()
          const dateRangeLabel = startDate + ' ~ ' + endDate
          const fileName = '营业日报_' + startDate.replace(/-/g, '') + '_' + endDate.replace(/-/g, '') + '.' + format

          this.exporting = true
          try {
            let blob
            if (format === 'excel') {
              blob = await exportApi.exportReportExcel({ startDate, endDate })
            } else {
              blob = await exportApi.exportReportPdf({ startDate, endDate })
            }

            // 使用 downloadFile 下载
            await exportApi.downloadFile(
              Promise.resolve({ data: blob }),
              fileName
            )

            // 计算文件大小
            const fileSize = blob ? blob.size : 0
            const sizeStr = this.formatFileSize(fileSize)

            // 记录导出历史
            const record = {
              id: this.genId(),
              exportTime: now,
              dateRange: dateRangeLabel,
              format: format,
              fileSize: sizeStr,
              fileSizeBytes: fileSize,
              status: 'success',
              blob: blob,
              fileName: fileName
            }
            this.exportRecords.unshift(record)
            this._blobCache[record.id] = blob

            // 展开导出记录面板
            this.recordsExpanded = true

            // 右上角富文本通知
            ReggieUI.notify({
              title: '导出成功',
              dangerouslyUseHTMLString: true,
              message: '<div style="line-height:1.8;">'
                + '<div><i class="el-icon-document" style="margin-right:6px;color:var(--el-color-primary);"></i>文件：' + fileName + '</div>'
                + '<div><i class="el-icon-coin" style="margin-right:6px;color:var(--color-success);"></i>大小：' + sizeStr + '</div>'
                + '<div><i class="el-icon-time" style="margin-right:6px;color:var(--color-warning);"></i>时间：' + now + '</div>'
                + '</div>',
              type: 'success',
              duration: 5000,
              position: 'top-right'
            })
          } catch (err) {
            // 导出失败记录
            const record = {
              id: this.genId(),
              exportTime: now,
              dateRange: this.queryDate ? (this.queryDate[0] + ' ~ ' + this.queryDate[1]) : '--',
              format: format,
              fileSize: '--',
              fileSizeBytes: 0,
              status: 'failed',
              blob: null,
              fileName: fileName,
              errorMsg: err.message || String(err)
            }
            this.exportRecords.unshift(record)
            this.recordsExpanded = true

            // 右上角错误通知
            ReggieUI.notify({
              title: '导出失败',
              dangerouslyUseHTMLString: true,
              message: '<div style="line-height:1.8;">'
                + '<div><i class="el-icon-warning-outline" style="margin-right:6px;color:var(--color-danger);"></i>格式：' + format.toUpperCase() + '</div>'
                + '<div><i class="el-icon-info" style="margin-right:6px;color:var(--color-info);"></i>原因：' + (err.message || String(err)) + '</div>'
                + '<div style="color:var(--el-border-base);font-size:12px;">时间：' + now + '</div>'
                + '</div>',
              type: 'error',
              duration: 8000,
              position: 'top-right'
            })
          } finally {
            this.exporting = false
          }
        },

        // 重新下载
        reDownload(record) {
          if (!record.blob) {
            ReggieUI.warning('文件数据已过期，请重新导出')
            return
          }
          try {
            const url = window.URL.createObjectURL(record.blob)
            const a = document.createElement('a')
            a.href = url
            a.download = record.fileName
            a.style.display = 'none'
            document.body.appendChild(a)
            a.click()
            setTimeout(() => {
              document.body.removeChild(a)
              window.URL.revokeObjectURL(url)
            }, 200)
            ReggieUI.success('正在下载：' + record.fileName)
          } catch (err) {
            ReggieUI.error('下载失败：' + err.message)
          }
        },

        // 删除导出记录
        deleteRecord(index) {
          ReggieUI.confirm('确认删除该条导出记录？', '提示', {
            confirmButtonText: '删除',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            const record = this.exportRecords[index]
            if (record && record.id && this._blobCache[record.id]) {
              // 释放 Blob URL
              try {
                // Blob 本身不需要 revokeObjectURL（URL.createObjectURL 返回的才需要）
                // 重新下载时才会创建新 URL，这里清理缓存即可
                delete this._blobCache[record.id]
              } catch (e) { /* ignore */ }
            }
            this.exportRecords.splice(index, 1)
            ReggieUI.success('记录已删除')
          }).catch(() => {
            // 用户取消，不做处理
          })
        }
      }
    })
  </script>
</body>
</html>
