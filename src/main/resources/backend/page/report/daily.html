<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>钀ヤ笟鏃ユ姤 - 鐟炲悏澶栧崠绠＄悊绔?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/chart-panel.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    /* ========== 鍩虹閲嶇疆 ========== */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg-page);
      font-family: var(--font-family-base);
    }

    /* ========== 涓诲鍣?========== */
    .daily-container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .daily-container .container {
      flex: 1;
      background: transparent;
      padding: 24px 32px 32px;
      min-width: 0;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ========== 宸ュ叿鏍?========== */
    .tableBar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--el-border-light);
      transition: all 0.3s;
    }
    .tableBar:hover {
      box-shadow: var(--shadow-lg);
    }
    .tableBar .toolbar-label {
      font-size:var(--font-size-base);
      color: var(--el-text-regular);
      font-weight: 500;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .tableBar .toolbar-spacer {
      flex: 1;
      min-width: 0;
    }

    /* ========== KPI 鍗＄墖锛堜娇鐢?components-stats-card.css 缁熶竴鏍峰紡锛?========== */

    /* ========== 瀵煎嚭璁板綍鎶樺彔闈㈡澘 ========== */
    .export-records-panel {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--el-border-light);
      margin-bottom: 20px;
      overflow: hidden;
      transition: all 0.3s;
    }
    .export-records-panel:hover {
      box-shadow: var(--shadow-xl);
    }
    .export-records-panel .panel-header {
      display: flex;
      align-items: center;
      padding: 18px 24px;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    .export-records-panel .panel-header:hover {
      background: var(--el-bg-ghost);
    }
    .export-records-panel .panel-title {
      font-size:var(--font-size-md);
      font-weight: 600;
      color: var(--el-text-primary);
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .export-records-panel .record-count-badge {
      background: var(--el-color-primary);
      color: var(--bg-surface);
      font-size: var(--font-size-xs);
      padding: 2px 10px;
      border-radius: var(--radius-md);
      font-weight: 600;
    }
    .export-records-panel .expand-icon {
      transition: transform 0.3s;
      color: var(--el-border-base);
      font-size:var(--font-size-base);
    }
    .export-records-panel .expand-icon.is-expanded {
      transform: rotate(180deg);
    }
    .export-records-panel .panel-body {
      padding: 0 24px 20px;
      transition: all 0.3s;
    }

    /* ========== 瀵煎嚭璁板綍琛ㄦ牸 ========== */
    .record-table {
      width: 100%;
      border-collapse: collapse;
      font-size:var(--font-size-sm);
    }
    .record-table thead th {
      background: var(--el-bg-ghost);
      color: var(--color-info);
      font-weight: 600;
      font-size:var(--font-size-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid var(--el-bg-page);
    }
    .record-table tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--el-bg-light);
      color: var(--el-text-regular);
      vertical-align: middle;
    }
    .record-table tbody tr {
      transition: all 0.2s;
    }
    .record-table tbody tr:hover {
      background: var(--el-bg-ghost);
    }
    .record-table tbody tr:last-child td {
      border-bottom: none;
    }
    .format-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--radius-md);
      font-size:var(--font-size-xs);
      font-weight: 600;
    }
    .format-tag.excel {
      background: var(--el-color-primary-lighter);
      color: var(--el-color-primary);
    }
    .format-tag.pdf {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-md);
      font-size:var(--font-size-xs);
      font-weight: 600;
    }
    .status-tag.success {
      background: var(--color-success-light);
      color: var(--color-success);
    }
    .status-tag.failed {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.success { background: var(--color-success); }
    .status-dot.failed { background: var(--color-danger); }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--el-border-base);
    }
    .empty-state .empty-icon {
      font-size: var(--font-size-4xl);
      margin-bottom: 12px;
      opacity: 0.4;
    }
    .empty-state .empty-text {
      font-size:var(--font-size-base);
    }

    /* ========== 鍝嶅簲寮?========== */
    @media (max-width: 1400px) {
      .kpi-cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 1200px) {
      .container { padding: 20px 28px 28px !important; }
      .tableBar { padding: 14px 20px; }
      /* 淇敼鐐癸細涓瓑灞忓箷涓嬪弻鍥炬敼涓哄崟鍒?*/
      .daily-two-col { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 768px) {
      .container { padding: 12px 16px 16px !important; }
      .stats-cards { grid-template-columns: 1fr; gap: 12px; }
      .stat-card { padding: 18px; min-height: 110px; }
      .stat-card .stat-value { font-size: var(--font-size-3xl); }
      .tableBar { flex-direction: column; align-items: stretch; }
      .tableBar .toolbar-spacer { display: none; }
    }
    @media (max-width: 480px) {
      .stat-card { padding: 16px; min-height: 100px; }
      .stat-card .stat-value { font-size: var(--font-size-3xl); }
    }
  </style>
</head>
<body>
  <!-- 閿洏鐢ㄦ埛锛氳烦杞埌涓诲唴瀹癸紙WCAG 2.4.1锛?-->
  <a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>

  <div class="dashboard-container daily-container" id="report-daily-app">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <!-- 椤靛ご锛氭爣棰?+ 鍓爣棰?+ 椤电骇鎿嶄綔 -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">钀ヤ笟鏃ユ姤</h1>
          <p class="ds-page-header__subtitle">鏌ョ湅姣忔棩钀ヤ笟鏁版嵁鍜屽鍑烘姤琛?/p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>

      <!-- 淇敼鐐癸細浣跨敤 <stat-cards> 缁熶竴缁勪欢鏇夸唬鎵嬪啓 stat-card -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 淇敼鐐癸細浣跨敤 <table-bar> 缁熶竴缁勪欢鏇夸唬鎵嬪啓 tableBar -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="loadData"
        @reset="onTableReset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-date-picker
            v-model="queryDate"
            type="daterange"
            range-separator="鑷?
            start-placeholder="寮€濮嬫棩鏈?
            end-placeholder="缁撴潫鏃ユ湡"
            value-format="yyyy-MM-dd"
            :shortcuts="dateShortcuts"
            @change="onDateChange"
            size="small"
          ></el-date-picker>
        </template>
      </table-bar>

      <!-- ========== 瓒嬪娍鍥?+ 鍒嗙被閿€鍞?鍙屽浘 ========== -->
      <!-- 淇敼鐐癸細鍥捐〃瀹瑰櫒澧炲姞 min-height 闃叉鍙樺舰锛岀粺涓€ class 渚夸簬鍝嶅簲寮?-->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;" class="daily-two-col">
      <chart-panel style="margin-bottom:0;" padding="24px" margin-bottom="0">
        <template #title>
          <i class="el-icon-data-line" style="color:var(--el-color-primary);"></i>
          钀ユ敹瓒嬪娍
          <span style="font-size:var(--font-size-xs);color:var(--el-border-base);font-weight:400;margin-left:4px;">锛堣繎7澶╋級</span>
        </template>
        <div style="flex:1;min-height:360px;" id="trendChart"></div>
      </chart-panel>
      <chart-panel style="margin-bottom:0;" padding="24px" margin-bottom="0">
        <template #title>
          <i class="el-icon-pie-chart" style="color:var(--color-warning);"></i>
          鑿滃搧鍒嗙被閿€鍞崰姣?
          <span style="font-size:var(--font-size-xs);color:var(--el-border-base);font-weight:400;margin-left:4px;">锛堝熀浜庡凡閫夋棩鏈燂級</span>
        </template>
        <div style="flex:1;min-height:360px;" id="categoryChart"></div>
      </chart-panel>
      </div>

      <!-- ========== 瀵煎嚭璁板綍鎶樺彔闈㈡澘 ========== -->
      <div class="export-records-panel">
        <div class="panel-header" role="button" tabindex="0" @click="toggleRecords" @keydown.enter="toggleRecords" :aria-expanded="recordsExpanded" aria-label="瀵煎嚭璁板綍闈㈡澘">
          <div class="panel-title">
            <i class="el-icon-s-order" style="color:var(--color-success);"></i>
            瀵煎嚭璁板綍
            <span class="record-count-badge" v-if="exportRecords.length > 0">{{ exportRecords.length }}</span>
          </div>
          <i
            :class="['el-icon-arrow-down expand-icon', { 'is-expanded': recordsExpanded }]"
          ></i>
        </div>
        <div class="panel-body" v-show="recordsExpanded">
          <div v-if="exportRecords.length === 0" class="empty-state">
            <div class="empty-icon">馃摥</div>
            <div class="empty-text">鏆傛棤瀵煎嚭璁板綍</div>
          </div>
          <div v-else style="overflow-x:auto;">
            <table class="record-table">
              <thead>
                <tr>
                  <th>搴忓彿</th>
                  <th>瀵煎嚭鏃堕棿</th>
                  <th>鏃ユ湡鑼冨洿</th>
                  <th>鏍煎紡</th>
                  <th>鏂囦欢澶у皬</th>
                  <th>鐘舵€?/th>
                  <th>鎿嶄綔</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(record, index) in exportRecords" :key="record.id">
                  <td>{{ index + 1 }}</td>
                  <td>{{ record.exportTime }}</td>
                  <td>{{ record.dateRange }}</td>
                  <td>
                    <span :class="['format-tag', record.format]">
                      {{ record.format.toUpperCase() }}
                    </span>
                  </td>
                  <td>{{ record.fileSize }}</td>
                  <td>
                    <span :class="['status-tag', record.status]">
                      <span :class="['status-dot', record.status]"></span>
                      {{ record.status === 'success' ? '鎴愬姛' : '澶辫触' }}
                    </span>
                  </td>
                  <td>
                    <template v-if="record.status === 'success'">
                      <el-button
                        type="text"
                        size="mini"
                        icon="el-icon-download"
                        @click="reDownload(record)"
                      >閲嶆柊涓嬭浇</el-button>
                      <el-button
                        type="text"
                        size="mini"
                        icon="el-icon-delete"
                        style="color:var(--color-danger);"
                        @click="deleteRecord(index)"
                      >鍒犻櫎</el-button>
                    </template>
                    <span v-else style="color:var(--el-border-base);font-size:var(--font-size-xs);">--</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>

    <!-- ========== 鍏ㄥ睆瀵煎嚭 Loading 閬僵 ========== -->
    <div v-loading="exporting" element-loading-text="姝ｅ湪瀵煎嚭..." element-loading-background="rgba(0,0,0,0.5)"></div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/export.js"></script>
  <script src="../../api/report.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/chart-panel.js"></script>
  <script>
    new Vue({
      el: '#report-daily-app',
      data() {
        // 鏃ユ湡蹇嵎閫夐」锛氫粖澶┿€佽繎7澶┿€佽繎30澶┿€佹湰鏈堛€佷笂鏈?
        const formatDate = function(d) {
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        };
        const today = new Date();
        const todayStr = formatDate(today);
        const day7 = new Date(today);
        day7.setDate(day7.getDate() - 6);
        const day7Str = formatDate(day7);
        const day30 = new Date(today);
        day30.setDate(day30.getDate() - 29);
        // 鏈湀绗竴澶?
        const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
        // 涓婃湀
        const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0);
        const lastMonthStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);

        return {
          loading: false,
          exporting: false,
          queryDate: [day7Str, todayStr], // 榛樿鑼冨洿锛氳繎7澶╋紙宸叉牸寮忓寲涓?yyyy-MM-dd 瀛楃涓诧級
          dailyData: {},
          chart: null,
          categoryChart: null,
          resizeHandler: null,
          // 瀵煎嚭璁板綍
          exportRecords: [],
          recordsExpanded: false,
          // 鎴愬姛瀵煎嚭鐨?Blob 缂撳瓨锛堢敤浜庨噸鏂颁笅杞斤級
          _blobCache: {},
          dateShortcuts: [
            {
              text: '浠婂ぉ',
              onClick(picker) {
                const d = new Date();
                picker.$emit('pick', [d, d]);
              }
            },
            {
              text: '杩?澶?,
              onClick(picker) {
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - 6);
                picker.$emit('pick', [start, end]);
              }
            },
            {
              text: '杩?0澶?,
              onClick(picker) {
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - 29);
                picker.$emit('pick', [start, end]);
              }
            },
            {
              text: '鏈湀',
              onClick(picker) {
                const start = new Date(today.getFullYear(), today.getMonth(), 1);
                picker.$emit('pick', [start, today]);
              }
            },
            {
              text: '涓婃湀',
              onClick(picker) {
                const start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                const end = new Date(today.getFullYear(), today.getMonth(), 0);
                picker.$emit('pick', [start, end]);
              }
            }
          ],
          // 淇敼鐐癸細<table-bar> 缁熶竴缁勪欢閰嶇疆
          tableSearchItems: [],
          tableActions: [
            { key: 'exportExcel', text: '瀵煎嚭 Excel', type: 'success' },
            { key: 'exportPdf', text: '瀵煎嚭 PDF', type: 'warning' }
          ]
        }
      },
      computed: {
        completionRate() {
          const total = this.dailyData.totalOrders || 0
          const completed = this.dailyData.completedOrders || 0
          if (!total) return '0.0'
          return (completed / total * 100).toFixed(1)
        },
        // 淇敼鐐癸細statsCards 缁熶竴鍗＄墖閰嶇疆锛堜緵 <stat-cards> 缁勪欢浣跨敤锛?
        statsCards: function() {
          const self = this;
          return [
            { key: '璁㈠崟', icon: '馃搵', label: '璁㈠崟鎬绘暟', value: self.dailyData.totalOrders || 0, color: 'primary' },
            { key: '钀ヤ笟棰?, icon: '馃挵', label: '钀ヤ笟棰濓紙鍏冿級', value: '楼' + self.formatMoney(self.dailyData.totalAmount), color: 'success' },
            { key: '瀹㈠崟浠?, icon: '馃彿锔?, label: '瀹㈠崟浠凤紙鍏冿級', value: '楼' + self.formatMoney(self.dailyData.avgAmount), color: 'warning' },
            { key: '瀹屾垚鐜?, icon: '馃搳', label: '瀹屾垚 / 鍙栨秷', value: (self.dailyData.completedOrders || 0) + ' / ' + (self.dailyData.cancelledOrders || 0), color: 'danger' }
          ]
        }
      },
      created() {
        // queryDate 榛樿鍊煎凡閫氳繃 data() 涓棴鍖呰缃?
      },
      mounted() {
        const self = this;
        this.$nextTick(() => {
          // 淇敼鐐癸細瀹夊叏鍒濆鍖栧浘琛紝澧炲姞瀹瑰櫒瀛樺湪鍒ゆ柇
          var initChart = function(id) {
            var el = document.getElementById(id);
            if (!el) { console.warn('[daily] 鍥捐〃瀹瑰櫒鏈壘鍒?', id); return null; }
            return echarts.init(el);
          };
          this.chart = initChart('trendChart');
          this.categoryChart = initChart('categoryChart');
          this.resizeHandler = () => {
            if (this.chart && !this.chart.isDisposed()) this.chart.resize();
            if (this.categoryChart && !this.categoryChart.isDisposed()) this.categoryChart.resize();
          };
          window.addEventListener('resize', this.resizeHandler);
          // 淇敼鐐癸細寤惰繜 resize 纭繚 Chart 瀹瑰櫒宸叉拺寮€
          setTimeout(function() {
            if (self.chart) self.chart.resize();
            if (self.categoryChart) self.categoryChart.resize();
          }, 400);
          this.loadData();
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
        if (this.chart) { try { this.chart.dispose(); } catch(e) {} }
        if (this.categoryChart) { try { this.categoryChart.dispose(); } catch(e) {} }
      },
      methods: {
        // 淇敼鐐癸細<table-bar> 缁勪欢缁熶竴鎿嶄綔鍒嗗彂
        onTableAction: function(payload) {
          if (payload.key === 'exportExcel') { this.handleExport('excel'); }
          else if (payload.key === 'exportPdf') { this.handleExport('pdf'); }
        },
        // 鏍煎紡鍖栨棩鏈熶负 yyyy-MM-dd
        formatDateStr(date) {
          const y = date.getFullYear()
          const m = String(date.getMonth() + 1).padStart(2, '0')
          const d = String(date.getDate()).padStart(2, '0')
          return y + '-' + m + '-' + d
        },

        // table-bar @reset 鈥?閲嶇疆鏃ユ湡鍒颁粖澶?
        onTableReset: function() {
          const today = new Date()
          var y = today.getFullYear()
          var m = String(today.getMonth() + 1).padStart(2, '0')
          var d = String(today.getDate()).padStart(2, '0')
          this.queryDate = [y + '-' + m + '-' + d, y + '-' + m + '-' + d]
          this.loadData()
        },
        onDateChange(val) {
          if (val && val.length === 2) {
            this.loadData()
          }
        },

        // 鍔犺浇鏃ユ姤鏁版嵁 + 瓒嬪娍鍥?
        async loadData() {
          if (!this.queryDate || this.queryDate.length < 2) {
            ReggieUI.warning('璇烽€夋嫨鏃ユ湡鑼冨洿')
            return
          }
          const [startDate, endDate] = this.queryDate
          this.loading = true
          try {
            // 鏃ユ姤鏁版嵁锛堜娇鐢ㄥ紑濮嬫棩鏈熶綔涓烘棩鎶ユ棩鏈熷弬鏁帮級
            const dailyRes = await reportDaily({ date: startDate })
            if (String(dailyRes.code) === '1') {
              this.dailyData = dailyRes.data || {}
            } else {
              ReggieUI.notify({
                title: '鏃ユ姤鍔犺浇澶辫触',
                message: dailyRes.msg || '鏃犳硶鑾峰彇鏃ユ姤鏁版嵁锛岃閲嶈瘯',
                type: 'error',
                duration: 5000
              })
            }

            // 瓒嬪娍鏁版嵁
            const trendRes = await $axios.get('/api/dashboard/trend')
            if (String(trendRes.code) === '1') {
              this.renderChart(trendRes.data || [])
            } else {
              this.renderChart([])
            }

            // 鍒嗙被閿€鍞暟鎹?
            const catRes = await $axios.get('/api/report/category-sales', {
              params: { startDate: this.queryDate[0], endDate: this.queryDate[1] }
            })
            if (String(catRes.code) === '1') {
              this.renderCategoryChart(catRes.data || [])
            } else {
              this.renderCategoryChart(null)
            }
          } catch (err) {
            ReggieUI.notify({
              title: '璇锋眰澶辫触',
              message: err.message || String(err),
              type: 'error',
              duration: 6000
            })
          } finally {
            this.loading = false
          }
        },

        renderChart(trendData) {
          if (!this.chart) return
          if (!trendData || trendData.length === 0) {
            this.chart.setOption({
              title: { text: '鏆傛棤瓒嬪娍鏁版嵁', left: 'center', top: 'center',
                textStyle: { color: RgPalette.borderBase, fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          const dates   = trendData.map(t => t.date)
          const orders  = trendData.map(t => t.orderCount || 0)
          const amounts = trendData.map(t => Number(t.revenue) || 0)
          const hasData = dates.length > 0
          // 淇敼鐐癸細鏍规嵁鏁版嵁閲忚嚜閫傚簲鏌卞锛岄槻姝㈠浘琛ㄦ嫢鎸ゅ彉褰?
          var barW = dates.length <= 5 ? 32 : dates.length <= 10 ? 26 : 20;
          this.chart.setOption({
            tooltip: {
              trigger: 'axis',
              axisPointer: { type: 'cross', crossStyle: { color: RgPalette.graySoft } },
              backgroundColor: RgPalette.white,
              borderColor: RgPalette.borderLighter2,
              borderWidth: 1,
              textStyle: { color: RgPalette.textPrimary, fontSize: 13 },
              formatter(params) {
                let html = '<b>' + params[0].axisValue + '</b><br/>'
                params.forEach(p => {
                  const val = p.seriesName === '钀ヤ笟棰?
                    ? '楼' + Number(p.value).toFixed(2)
                    : p.value + ' 鍗?
                  html += p.marker + ' ' + p.seriesName + '锛?b>' + val + '</b><br/>'
                })
                return html
              }
            },
            legend: { data: ['璁㈠崟鏁?, '钀ヤ笟棰?], bottom: 8, textStyle: { color: RgPalette.textRegular, fontSize: 13 } },
            // 淇敼鐐癸細澧炲ぇ top/bottom/right 闃叉鍙孻杞存爣绛惧拰 legend 琚鍓?
            grid: { left: 50, right: 65, top: 30, bottom: 52 },
            xAxis: {
              type: 'category',
              data: hasData ? dates : ['鏆傛棤鏁版嵁'],
              axisLine: { lineStyle: { color: RgPalette.borderLighter2 } },
              axisTick: { show: false },
              axisLabel: { color: RgPalette.textSecondary, fontSize: 12, rotate: dates.length > 7 ? 30 : 0 }
            },
            yAxis: [
              {
                type: 'value', name: '璁㈠崟閲?鍗?',
                nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
                axisLabel: { color: RgPalette.textSecondary, fontSize: 12 },
                splitLine: { lineStyle: { color: RgPalette.bgLight, type: 'dashed' } },
                axisLine: { show: false }, axisTick: { show: false }
              },
              {
                type: 'value', name: '钀ヤ笟棰?鍏?',
                nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
                axisLabel: { color: RgPalette.textSecondary, fontSize: 12, formatter: '楼{value}' },
                splitLine: { show: false },
                axisLine: { show: false }, axisTick: { show: false }
              }
            ],
            series: [
              {
                name: '璁㈠崟鏁?, type: 'bar', data: hasData ? orders : [0],
                barWidth: barW, barGap: '20%',
                itemStyle: {
                  borderRadius: [RgPalette.radiusMd, RgPalette.radiusMd, 0, 0],
                  color: RgPalette.seriesBlue
                },
                label: { show: hasData, position: 'top', color: RgPalette.seriesBlue, fontSize: 12, fontWeight: 600, formatter: '{c}' }
              },
              {
                name: '钀ヤ笟棰?, type: 'line', yAxisIndex: 1, data: hasData ? amounts : [0],
                smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                lineStyle: { color: RgPalette.seriesGreen, width: 3 },
                itemStyle: { color: RgPalette.seriesGreen, borderColor: RgPalette.white, borderWidth: 2 },
                areaStyle: {
                  color: RgPalette.seriesGreenArea
                },
                label: {
                  show: hasData, position: 'top', color: RgPalette.successDark, fontSize: 12, fontWeight: 700,
                  formatter: p => '楼' + Number(p.value).toFixed(0)
                }
              }
            ]
          }, true)
          // 淇敼鐐癸細娓叉煋鍚庡欢杩?resize 纭繚鍦?flex 甯冨眬涓昂瀵告纭?
          const self = this;
          setTimeout(function() { if (self.chart && !self.chart.isDisposed()) self.chart.resize(); }, 200);
        },

        // 娓叉煋鍒嗙被閿€鍞ゼ鍥?
        renderCategoryChart(data) {
          if (!this.categoryChart) return
          if (!data || data.length === 0) {
            this.categoryChart.setOption({
              title: { text: '鏆傛棤鍒嗙被鏁版嵁', left: 'center', top: 'center',
                textStyle: { color: RgPalette.borderBase, fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          var colors = [RgPalette.seriesBlue,RgPalette.seriesGreen,RgPalette.seriesGold,RgPalette.seriesPink,RgPalette.seriesSky,RgPalette.seriesOrange,RgPalette.seriesViolet,RgPalette.seriesMagenta]
          this.categoryChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c} 浠?({d}%)' },
            legend: { bottom: 4, textStyle: { fontSize: 12 } },
            series: [{
              type: 'pie',
              radius: ['45%', '72%'],
              // 淇敼鐐癸細center top 浠?48% 鎻愯嚦 44%锛屼负搴曢儴 legend 鐣欏嚭绌洪棿
              center: ['50%', '44%'],
              itemStyle: { borderRadius: RgPalette.radiusMd borderColor: RgPalette.white, borderWidth: 2 },
              label: { fontSize: 12, formatter: '{b}\n{d}%' },
              emphasis: { scaleSize: 8, label: { fontSize: 15, fontWeight: 'bold' } },
              data: data.map(function(item, i) {
                return { name: item.name, value: item.count, itemStyle: { color: colors[i % colors.length] } }
              })
            }]
          }, true)
        },

        // 鏍煎紡鍖栭噾棰?
        formatMoney(val) {
          if (val === null || val === undefined) return '0.00'
          return Number(val).toFixed(2)
        },

        // 鏍煎紡鍖栨枃浠跺ぇ灏?
        formatFileSize(bytes) {
          if (bytes === 0) return '0 B'
          const k = 1024
          const sizes = ['B', 'KB', 'MB', 'GB']
          const i = Math.floor(Math.log(bytes) / Math.log(k))
          const idx = Math.min(i, sizes.length - 1)
          return (bytes / Math.pow(k, idx)).toFixed(idx > 0 ? 2 : 0) + ' ' + sizes[idx]
        },

        // 鐢熸垚鍞竴 ID
        genId() {
          return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8)
        },

        // 鑾峰彇褰撳墠鏃堕棿瀛楃涓?
        getNowStr() {
          const now = new Date()
          const pad = n => String(n).padStart(2, '0')
          return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
            + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds())
        },

        // 鍒囨崲瀵煎嚭璁板綍鎶樺彔
        toggleRecords() {
          this.recordsExpanded = !this.recordsExpanded
        },

        // 瀵煎嚭澶勭悊
        async handleExport(format) {
          if (!this.queryDate || this.queryDate.length < 2) {
            ReggieUI.warning('璇峰厛閫夋嫨鏃ユ湡鑼冨洿')
            return
          }
          const [startDate, endDate] = this.queryDate
          const now = this.getNowStr()
          const dateRangeLabel = startDate + ' ~ ' + endDate
          const fileName = '钀ヤ笟鏃ユ姤_' + startDate.replace(/-/g, '') + '_' + endDate.replace(/-/g, '') + '.' + format

          this.exporting = true
          try {
            let blob
            if (format === 'excel') {
              blob = await exportApi.exportReportExcel({ startDate, endDate })
            } else {
              blob = await exportApi.exportReportPdf({ startDate, endDate })
            }

            // 浣跨敤 downloadFile 涓嬭浇
            await exportApi.downloadFile(
              Promise.resolve({ data: blob }),
              fileName
            )

            // 璁＄畻鏂囦欢澶у皬
            const fileSize = blob ? blob.size : 0
            const sizeStr = this.formatFileSize(fileSize)

            // 璁板綍瀵煎嚭鍘嗗彶
            const record = {
              id: this.genId(),
              exportTime: now,
              dateRange: dateRangeLabel,
              format: format,
              fileSize: sizeStr,
              fileSizeBytes: fileSize,
              status: 'success',
              blob: blob,
              fileName: fileName
            }
            this.exportRecords.unshift(record)
            this._blobCache[record.id] = blob

            // 灞曞紑瀵煎嚭璁板綍闈㈡澘
            this.recordsExpanded = true

            // 鍙充笂瑙掑瘜鏂囨湰閫氱煡
            ReggieUI.notify({
              title: '瀵煎嚭鎴愬姛',
              dangerouslyUseHTMLString: true,
              message: '<div style="line-height:1.8;">'
                + '<div><i class="el-icon-document" style="margin-right:6px;color:var(--el-color-primary);"></i>鏂囦欢锛? + fileName + '</div>'
                + '<div><i class="el-icon-coin" style="margin-right:6px;color:var(--color-success);"></i>澶у皬锛? + sizeStr + '</div>'
                + '<div><i class="el-icon-time" style="margin-right:6px;color:var(--color-warning);"></i>鏃堕棿锛? + now + '</div>'
                + '</div>',
              type: 'success',
              duration: 5000,
              position: 'top-right'
            })
          } catch (err) {
            // 瀵煎嚭澶辫触璁板綍
            const record = {
              id: this.genId(),
              exportTime: now,
              dateRange: this.queryDate ? (this.queryDate[0] + ' ~ ' + this.queryDate[1]) : '--',
              format: format,
              fileSize: '--',
              fileSizeBytes: 0,
              status: 'failed',
              blob: null,
              fileName: fileName,
              errorMsg: err.message || String(err)
            }
            this.exportRecords.unshift(record)
            this.recordsExpanded = true

            // 鍙充笂瑙掗敊璇€氱煡
            ReggieUI.notify({
              title: '瀵煎嚭澶辫触',
              dangerouslyUseHTMLString: true,
              message: '<div style="line-height:1.8;">'
                + '<div><i class="el-icon-warning-outline" style="margin-right:6px;color:var(--color-danger);"></i>鏍煎紡锛? + format.toUpperCase() + '</div>'
                + '<div><i class="el-icon-info" style="margin-right:6px;color:var(--color-info);"></i>鍘熷洜锛? + (err.message || String(err)) + '</div>'
                + '<div style="color:var(--el-border-base);font-size:var(--font-size-xs);">鏃堕棿锛? + now + '</div>'
                + '</div>',
              type: 'error',
              duration: 8000,
              position: 'top-right'
            })
          } finally {
            this.exporting = false
          }
        },

        // 閲嶆柊涓嬭浇
        reDownload(record) {
          if (!record.blob) {
            ReggieUI.warning('鏂囦欢鏁版嵁宸茶繃鏈燂紝璇烽噸鏂板鍑?)
            return
          }
          try {
            const url = window.URL.createObjectURL(record.blob)
            const a = document.createElement('a')
            a.href = url
            a.download = record.fileName
            a.style.display = 'none'
            document.body.appendChild(a)
            a.click()
            setTimeout(() => {
              document.body.removeChild(a)
              window.URL.revokeObjectURL(url)
            }, 200)
            ReggieUI.success('姝ｅ湪涓嬭浇锛? + record.fileName)
          } catch (err) {
            ReggieUI.error('涓嬭浇澶辫触锛? + err.message)
          }
        },

        // 鍒犻櫎瀵煎嚭璁板綍
        deleteRecord(index) {
          ReggieUI.confirm('纭鍒犻櫎璇ユ潯瀵煎嚭璁板綍锛?, '鎻愮ず', {
            confirmButtonText: '鍒犻櫎',
            cancelButtonText: '鍙栨秷',
            type: 'warning'
          }).then(() => {
            const record = this.exportRecords[index]
            if (record && record.id && this._blobCache[record.id]) {
              // 閲婃斁 Blob URL
              try {
                // Blob 鏈韩涓嶉渶瑕?revokeObjectURL锛圲RL.createObjectURL 杩斿洖鐨勬墠闇€瑕侊級
                // 閲嶆柊涓嬭浇鏃舵墠浼氬垱寤烘柊 URL锛岃繖閲屾竻鐞嗙紦瀛樺嵆鍙?
                delete this._blobCache[record.id]
              } catch (e) { /* ignore */ }
            }
            this.exportRecords.splice(index, 1)
            ReggieUI.success('璁板綍宸插垹闄?)
          }).catch(() => {
            // 鐢ㄦ埛鍙栨秷锛屼笉鍋氬鐞?
          })
        }
      }
    })
  </script>
</body>
</html>
