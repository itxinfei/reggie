<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付分析 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/chart-panel.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow-y: auto; overflow-x: hidden;
      background: linear-gradient(135deg, var(--el-bg-subtle) 0%, var(--el-border-lighter) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .payment-page { min-height: 100%; display: flex; flex-direction: column; }
    .payment-page .container { flex: 1; background: transparent; padding: 24px 32px 32px;
      min-width: 0; max-width: 1600px; margin: 0 auto; width: 100%; }
    .payment-page .tableBar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
      background: var(--bg-surface); padding: 16px 24px; border-radius: 14px; margin-bottom: 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.8);
      transition: box-shadow 0.3s; }
    .payment-page .tableBar:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .payment-page .tableBar .fl-label { font-size: 14px; color: var(--el-text-regular); font-weight: 500; flex-shrink: 0; }
    .payment-page .tableBar .fl-spacer { flex: 1; min-width: 0; }
    .payment-page .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 1200px) { .payment-page .container { padding: 16px 20px 20px !important; }
      .payment-page .charts-row { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { .payment-page .container { padding: 12px 16px 16px !important; } }
  </style>
</head>
<body>
  <div class="payment-page" id="report-payment-app" v-loading="loading">
    <div class="container">

      <!-- 面包屑导航 -->
      <nav class="ds-breadcrumb" aria-label="面包屑导航">
        <span class="ds-breadcrumb__item">首页</span>
        <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
        <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">支付分析</span>
      </nav>

      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 KPI 卡片 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ========== 工具栏 ========== -->
      <div class="tableBar">
        <span class="fl-label"><i class="el-icon-date" style="margin-right:4px;"></i>日期范围</span>
        <el-date-picker v-model="dateRange" clearable value-format="yyyy-MM-dd"
          type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
          size="small"></el-date-picker>
        <el-button type="primary" size="small" class="btn-query" icon="el-icon-search" @click="loadData">查询</el-button>
        <el-button size="small" class="btn-reset" icon="el-icon-refresh" @click="reset">重置</el-button>
        <span class="fl-spacer"></span>
        <el-button type="success" size="small" icon="el-icon-download" @click="handleExport">导出 CSV</el-button>
      </div>

      <!-- ========== 支付方式分布 ========== -->
      <chart-panel title="支付方式分布" icon="📊">
        <div class="charts-row">
          <div id="pieChart" style="width:100%;height:380px;min-height:300px;"></div>
          <div id="barChart" style="width:100%;height:380px;min-height:300px;"></div>
        </div>
      </chart-panel>

      <!-- ========== 每日支付金额趋势 ========== -->
      <chart-panel title="每日支付金额趋势" icon="📈">
        <div id="paymentTrendChart" style="width:100%;height:360px;min-height:300px;"></div>
      </chart-panel>

      <!-- ========== 数据表格（统一 crud-table 组件，替代手写 el-table） ========== -->
      <crud-table
        :data="tableData"
        :columns="paymentColumns"
        :loading="loading"
        :show-pagination="false"
        :stripe="true"
        :border="true"
        aria-label="支付渠道数据"
      >
        <template #col-amount="{ row }">
          <span>{{ row.amount != null ? '￥' + formatMoney(row.amount) : '-' }}</span>
        </template>
        <template #col-ratio="{ row }">
          <el-progress :percentage="calcPercent(row.transactionCount)" :show-text="true"
            :stroke-width="12" :format="function(p) { return p + '%'; }"
            :color="channelProgressColor(row.key)">
          </el-progress>
        </template>
      </crud-table>

    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/chart-panel.js"></script>
  <script>
    var CHANNEL_LABEL = { wechat: '微信支付', alipay: '支付宝', balance: '余额支付', other: '其他' };
    var CHANNEL_COLOR = { wechat: '#07C160', alipay: '#1677FF', balance: '#E6A23C', other: '#909399' };

    (function() {
      new Vue({
        el: '#report-payment-app',
        data: function() {
          return {
            loading: false, dateRange: [], tableData: [],
            // 表格列配置（配合 crud-table 组件，替代原手写 el-table 列定义）
            paymentColumns: [
              { prop: 'channel', label: '支付渠道', width: 150, align: 'center' },
              { prop: 'transactionCount', label: '交易笔数', width: 120, align: 'center' },
              { prop: 'amount', label: '金额（元）', width: 150, align: 'center', slot: true, type: 'money' },
              { prop: 'ratio', label: '占比', minWidth: 200, align: 'center', slot: true }
            ],
            pieChart: null, barChart: null, trendChart: null, resizeHandler: null
          }
        },
        computed: {
          totalCount: function() { return this.tableData.reduce(function(s, r) { return s + (r.transactionCount || 0); }, 0); },
          totalAmount: function() { return this.tableData.reduce(function(s, r) { return s + (Number(r.amount) || 0); }, 0); },
          topChannel: function() {
            if (!this.tableData.length) return '--';
            var top = this.tableData.reduce(function(m, r) { return (r.transactionCount || 0) > (m.transactionCount || 0) ? r : m; }, this.tableData[0]);
            return CHANNEL_LABEL[top.key] || top.channel || '--';
          },
          // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
          statsCards: function() {
            var self = this;
            return [
              { key: '笔数', icon: '💳', label: '交易总笔数', value: self.totalCount, color: 'primary' },
              { key: '总额', icon: '💰', label: '交易总额（元）', value: '¥' + self.formatMoney(self.totalAmount), color: 'success' },
              { key: '常用', icon: '🏅', label: '最常用支付方式', value: self.topChannel, color: 'warning' },
              { key: '渠道', icon: '📊', label: '支付渠道数', value: self.tableData.length || 0, color: 'info' }
            ]
          }
        },
        created: function() {
          var now = new Date();
          var first = new Date(now.getFullYear(), now.getMonth(), 1);
          var last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
          var fmt = function(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
          this.dateRange = [fmt(first), fmt(last)];
        },
        mounted: function() {
          var self = this;
          self.$nextTick(function() {
            // 修改点：安全初始化图表
            var initChart = function(id) {
              var el = document.getElementById(id);
              if (!el) { console.warn('[payment] 图表容器未找到:', id); return null; }
              return echarts.init(el);
            };
            self.pieChart = initChart('pieChart');
            self.barChart = initChart('barChart');
            self.trendChart = initChart('paymentTrendChart');
            self.resizeHandler = function() {
              [self.pieChart, self.barChart, self.trendChart].forEach(function(ch) {
                if (ch && !ch.isDisposed()) ch.resize();
              });
            };
            window.addEventListener('resize', self.resizeHandler);
            // 修改点：延迟 resize 确保容器已撑开
            setTimeout(function() {
              [self.pieChart, self.barChart, self.trendChart].forEach(function(ch) {
                if (ch && !ch.isDisposed()) ch.resize();
              });
            }, 400);
            self.loadData();
          });
        },
        beforeDestroy: function() {
          if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
          [this.pieChart, this.barChart, this.trendChart].forEach(function(ch) {
            if (ch) try { ch.dispose(); } catch(e) {}
          });
        },
        methods: {
          loadData: function() {
            var self = this;
            if (!self.dateRange || self.dateRange.length < 2) {
              self.$message.warning('请选择日期范围'); return;
            }
            self.loading = true;
            reportPayment({ startDate: self.dateRange[0], endDate: self.dateRange[1] }).then(function(res) {
              if (String(res.code) === '1') {
                self.tableData = self.convertToArray(res.data || {});
                self.$nextTick(function() { self.renderCharts(); self.loadPaymentTrend(); });
              } else { self.$message.error(res.msg || '加载支付数据失败'); }
            }).catch(function(err) { self.$message.error('请求失败：' + (err || '网络异常')); })
            .finally(function() { self.loading = false; });
          },
          loadPaymentTrend: function() {
            var self = this;
            if (!self.trendChart) return;
            $axios.get('/api/report/payment/trend', { params: { startDate: self.dateRange[0], endDate: self.dateRange[1] } })
              .then(function(res) { if (res.code === 1 && res.data) self.renderPaymentTrend(res.data); })
              .catch(function() {});
          },
          renderPaymentTrend: function(data) {
            if (!this.trendChart) return;
            if (!data || !data.dates || !data.dates.length) {
              this.trendChart.setOption({ title: { text: '暂无趋势数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            var dates = data.dates || [];
            var makeAreaGrad = function(c) { return new echarts.graphic.LinearGradient(0,0,0,1, [{ offset:0,color:c+'33'},{ offset:1,color:c+'05' }]); };
            this.trendChart.setOption({
              tooltip: { trigger: 'axis', backgroundColor: 'rgba(255,255,255,0.96)',
                borderColor: '#e4e7ed', borderWidth: 1, textStyle: { color: '#303133', fontSize: 13 } },
              legend: { data: ['微信支付', '支付宝', '余额支付'], bottom: 8, textStyle: { fontSize: 12, color: '#606266' } },
              // 修改点：增大左/底部 padding 防止标签被裁剪
              grid: { left: 55, right: 30, top: 25, bottom: 52 },
              xAxis: { type: 'category', data: dates, boundaryGap: false,
                axisLine: { lineStyle: { color: '#e4e7ed' } }, axisTick: { show: false },
                axisLabel: { color: '#909399', fontSize: 12 } },
              yAxis: { type: 'value', name: '金额(元)',
                nameTextStyle: { color: '#909399', fontSize: 12 },
                splitLine: { lineStyle: { color: '#f2f3f5', type: 'dashed' } } },
              series: [
                { name: '微信支付', type: 'line', data: data.wechat || [], smooth: true, symbol: 'circle', symbolSize: 6,
                  lineStyle: { color: '#07C160', width: 3 }, itemStyle: { color: '#07C160', borderColor: '#fff', borderWidth: 2 },
                  areaStyle: { color: makeAreaGrad('#07C160') } },
                { name: '支付宝', type: 'line', data: data.alipay || [], smooth: true, symbol: 'circle', symbolSize: 6,
                  lineStyle: { color: '#1677FF', width: 3 }, itemStyle: { color: '#1677FF', borderColor: '#fff', borderWidth: 2 },
                  areaStyle: { color: makeAreaGrad('#1677FF') } },
                { name: '余额支付', type: 'line', data: data.balance || [], smooth: true, symbol: 'circle', symbolSize: 6,
                  lineStyle: { color: '#E6A23C', width: 3 }, itemStyle: { color: '#E6A23C', borderColor: '#fff', borderWidth: 2 },
                  areaStyle: { color: makeAreaGrad('#E6A23C') } }
              ]
            }, true);
          },
          reset: function() {
            this.dateRange = []; this.tableData = [];
            [this.pieChart, this.barChart, this.trendChart].forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.clear();
            });
          },
          convertToArray: function(data) {
            return Object.keys(CHANNEL_LABEL).filter(function(k) { return data[k] != null; })
              .map(function(k) { var item = data[k] || {}; return { key: k, channel: CHANNEL_LABEL[k],
                transactionCount: item.count || 0, amount: item.amount != null ? item.amount : null }; });
          },
          calcPercent: function(count) { if (!this.totalCount) return 0; return Math.round(count / this.totalCount * 100); },
          channelProgressColor: function(key) { return CHANNEL_COLOR[key] || '#909399'; },
          formatMoney: function(val) { return Number(val || 0).toFixed(2); },
          renderCharts: function() {
            // 修改点：渲染前 resize 确保容器尺寸正确
            [this.pieChart, this.barChart].forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.resize();
            });
            this.renderPie(); this.renderBar();
          },
          renderPie: function() {
            if (!this.pieChart || !this.tableData.length) {
              if (this.pieChart) this.pieChart.setOption({ title: { text: '暂无支付数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            var pieData = this.tableData.filter(function(r) { return r.transactionCount > 0; })
              .map(function(r) { return { name: r.channel, value: r.transactionCount,
                itemStyle: { color: CHANNEL_COLOR[r.key] || '#909399' } }; });
            this.pieChart.setOption({
              color: ['#07C160','#1677FF','#E6A23C','#909399'],
              tooltip: { trigger: 'item', backgroundColor: 'rgba(255,255,255,0.96)',
                borderColor: '#e4e7ed', borderWidth: 1, textStyle: { color: '#303133', fontSize: 13 },
                formatter: function(p) { return '<b>' + p.name + '</b><br/>' + p.marker + ' 笔数：<b>' + p.value + '</b>（' + p.percent + '%）'; } },
              legend: { bottom: 0, left: 'center', itemWidth: 10, itemHeight: 10,
                textStyle: { color: '#606266', fontSize: 12 } },
              series: [{ type: 'pie', radius: ['45%','68%'], center: ['50%','44%'],
                avoidLabelOverlap: false, itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
                label: { position: 'outside', formatter: '{b}\n{d}%', fontSize: 13, lineHeight: 18, color: '#606266' },
                labelLine: { length: 25, length2: 20, lineStyle: { color: '#c0c4cc' } },
                emphasis: { scaleSize: 10, label: { fontSize: 16, fontWeight: 'bold' } },
                data: pieData.length ? pieData : [{ name: '暂无数据', value: 1, itemStyle: { color: '#e4e7ed' } }] }]
            }, true);
          },
          renderBar: function() {
            if (!this.barChart || !this.tableData.length) {
              if (this.barChart) this.barChart.setOption({ title: { text: '暂无支付数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            var names = this.tableData.map(function(r) { return r.channel; });
            var counts = this.tableData.map(function(r) { return r.transactionCount; });
            var amounts = this.tableData.map(function(r) { return r.amount != null ? Number(r.amount).toFixed(2) : 0; });
            var hasAmount = this.tableData.some(function(r) { return r.amount != null; });
            var barW = names.length <= 2 ? 48 : names.length <= 3 ? 36 : 24;
            this.barChart.setOption({
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
                backgroundColor: 'rgba(255,255,255,0.96)', borderColor: '#e4e7ed', borderWidth: 1,
                textStyle: { color: '#303133', fontSize: 13 },
                formatter: function(ps) {
                  var h = '<b>' + ps[0].axisValue + '</b><br/>';
                  ps.forEach(function(p) {
                    var v = p.seriesName === '交易金额' ? '¥' + Number(p.value).toFixed(2) : p.value + ' 笔';
                    h += p.marker + ' ' + p.seriesName + '：<b>' + v + '</b><br/>';
                  }); return h;
                } },
              legend: { data: hasAmount ? ['交易笔数', '交易金额'] : ['交易笔数'], bottom: 4,
                textStyle: { fontSize: 12, color: '#606266' } },
              // 修改点：增大右 padding 防止金额标签被裁剪
              grid: { left: 55, right: hasAmount ? 70 : 20, top: 25, bottom: 52 },
              xAxis: { type: 'category', data: names, axisTick: { show: false },
                axisLabel: { color: '#606266', interval: 0, fontSize: 13 } },
              yAxis: [
                { type: 'value', name: '笔数',
                  nameTextStyle: { color: '#909399', fontSize: 12 },
                  splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } },
                  axisLabel: { color: '#909399', fontSize: 12 } },
                hasAmount ? { type: 'value', name: '金额',
                  nameTextStyle: { color: '#909399', fontSize: 12 },
                  axisLabel: { formatter: '¥{value}', color: '#909399', fontSize: 12 },
                  splitLine: { show: false } } : {}
              ].filter(function(y) { return Object.keys(y).length; }),
              series: [
                { name: '交易笔数', type: 'bar', data: counts, barWidth: barW,
                  itemStyle: { borderRadius: [8, 8, 0, 0],
                    color: function(p) { var key = Object.keys(CHANNEL_COLOR)[p.dataIndex]; return CHANNEL_COLOR[key] || '#909399'; } },
                  label: { show: true, position: 'top', fontSize: 12, fontWeight: 600, formatter: '{c} 笔' } },
                hasAmount ? { name: '交易金额', type: 'line', yAxisIndex: 1, data: amounts,
                  smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                  lineStyle: { color: '#fc8452', width: 3 },
                  itemStyle: { color: '#fc8452', borderColor: '#fff', borderWidth: 2 },
                  label: { show: true, position: 'top', fontSize: 12, fontWeight: 700, color: '#e6a23c',
                    formatter: function(p) { return '¥' + Number(p.value).toFixed(0); } } } : null
              ].filter(function(s) { return s; })
            }, true);
          },
          handleExport: function() {
            var self = this;
            if (!self.dateRange || self.dateRange.length < 2) { self.$message.warning('请先选择日期范围'); return; }
            reportExport({ startDate: self.dateRange[0], endDate: self.dateRange[1] }).then(function(blob) {
              if (blob && blob.type && blob.type.indexOf('json') > -1) { self.$message.error('导出失败，文件格式异常'); return; }
              var link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = '支付分析_' + self.dateRange[0] + '_' + self.dateRange[1] + '.csv';
              document.body.appendChild(link); link.click(); document.body.removeChild(link);
              URL.revokeObjectURL(link.href);
              self.$message.success('导出成功');
            }).catch(function(err) { self.$message.error('导出失败：' + (err || '网络异常')); });
          }
        }
      })
    })();
  </script>
</body>
</html>
