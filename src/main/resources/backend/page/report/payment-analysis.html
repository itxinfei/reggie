<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付分析</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
  .chart-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .chart-container .chart-box {
    flex: 1;
    height: 400px;
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="report-payment-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-date-picker v-model="dateRange"
          clearable
          value-format="yyyy-MM-dd"
          type="daterange"
          placeholder="选择日期范围"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          style="width: 400px"
        ></el-date-picker>
        <el-button type="primary" class="search-btn" @click="loadData">查询</el-button>
      </div>
      <el-card shadow="never" style="margin-bottom: 20px;">
        <div slot="header">支付方式分布</div>
        <div class="chart-container">
          <div class="chart-box" id="paymentChart"></div>
        </div>
      </el-card>
      <el-table :data="tableData" stripe class="tableBox">
        <el-table-column prop="channel" label="支付渠道"></el-table-column>
        <el-table-column prop="transactionCount" label="交易笔数"></el-table-column>
        <el-table-column label="金额">
          <template slot-scope="{ row }">
            <span>￥{{ row.amount }}</span>
          </template>
        </el-table-column>
        <el-table-column label="占比">
          <template slot-scope="{ row }">
            <span>{{ row.percentage }}%</span>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script>
    new Vue({
      el: '#report-payment-app',
      data() {
        return {
          loading: false,
          dateRange: '',
          tableData: [],
          chart: null,
          resizeHandler: null
        }
      },
      created() {
        const now = new Date()
        const first = new Date(now.getFullYear(), now.getMonth(), 1)
        const last = new Date(now.getFullYear(), now.getMonth() + 1, 0)
        const fmt = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        this.dateRange = [fmt(first), fmt(last)]
      },
      mounted() {
        this.$nextTick(() => {
          this.chart = echarts.init(document.getElementById('paymentChart'))
          this.resizeHandler = () => { if (this.chart) this.chart.resize() }
          window.addEventListener('resize', this.resizeHandler)
          this.loadData()
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.chart) this.chart.dispose()
      },
      methods: {
        async loadData() {
          this.loading = true
          try {
            const params = {}
            if (this.dateRange && this.dateRange.length >= 2) {
              params.startDate = this.dateRange[0]
              params.endDate = this.dateRange[1]
            }
            const res = await reportPayment(params)
            if (String(res.code) === '1') {
              this.tableData = res.data || []
              this.renderChart()
            } else {
              this.$message.error(res.msg || '加载失败')
            }
          } catch (err) {
            this.$message.error('请求出错了：' + err)
          } finally {
            this.loading = false
          }
        },
        renderChart() {
          if (!this.chart) return
          const channelMap = {
            'ALIPAY': '支付宝',
            'WECHAT': '微信',
            'OTHER': '其他'
          }
          const pieData = this.tableData.map(item => ({
            name: channelMap[item.channel] || item.channel,
            value: item.transactionCount
          }))
          const option = {
            tooltip: {
              trigger: 'item',
              formatter: '{b}: {c} ({d}%)'
            },
            series: [{
              type: 'pie',
              radius: ['35%', '60%'],
              center: ['50%', '50%'],
              avoidLabelOverlap: true,
              itemStyle: {
                borderRadius: 6,
                borderColor: '#fff',
                borderWidth: 2
              },
              label: {
                show: true,
                formatter: '{b}\n{d}%'
              },
              emphasis: {
                label: { show: true, fontSize: 16, fontWeight: 'bold' }
              },
              data: pieData,
              color: ['#1E90FF', '#07C160', '#909399']
            }]
          }
          this.chart.setOption(option, true)
        }
      }
    })
  </script>
</body>
</html>
