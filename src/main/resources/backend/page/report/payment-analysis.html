<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付分析 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
  .search-btn { margin-left: 10px; }
  .charts-row { display: flex; gap: 16px; margin-bottom: 20px; }
  .charts-row .chart-box { flex: 1; height: 380px; }

  /* ========== 数据统计卡片 ========== */
  .stats-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    border: 1px solid #f0f2f5;
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient);
  }

  .stat-card .stat-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 42px;
  }

  .stat-card .stat-label {
    font-size: 13px;
    color: #909399;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .stat-card .stat-value {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-card.primary { --gradient: linear-gradient(135deg, #409eff 0%, #66b1ff 100%); }
  .stat-card.success { --gradient: linear-gradient(135deg, #67c23a 0%, #85ce61 100%); }
  .stat-card.warning { --gradient: linear-gradient(135deg, #e6a23c 0%, #ebb563 100%); }
  .stat-card.danger  { --gradient: linear-gradient(135deg, #f56c6c 0%, #f78989 100%); }

  @media (max-width: 1400px) {
    .stats-cards { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 768px) {
    .stats-cards { grid-template-columns: 1fr; }
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="report-payment-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-date-picker v-model="dateRange"
          clearable
          value-format="yyyy-MM-dd"
          type="daterange"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          style="width: 380px"
        ></el-date-picker>
        <el-button type="primary" class="search-btn" @click="loadData">查询</el-button>
        <el-button class="search-btn" @click="reset">重置</el-button>
      </div>

      <!-- ========== 数据统计卡片 ========== -->
      <div class="stats-cards">
        <div class="stat-card primary">
          <div class="stat-icon">💳</div>
          <div class="stat-label">交易总笔数</div>
          <div class="stat-value">{{ totalCount }}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">💰</div>
          <div class="stat-label">交易总金额（元）</div>
          <div class="stat-value">¥{{ formatMoney(totalAmount) }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">🏅</div>
          <div class="stat-label">最常用支付方式</div>
          <div class="stat-value" style="font-size:20px;">{{ topChannel }}</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon">📊</div>
          <div class="stat-label">支付渠道数</div>
          <div class="stat-value">{{ tableData.length || 0 }}</div>
        </div>
      </div>

      <el-card shadow="never" style="margin-bottom:20px;">
        <div slot="header">支付方式分布</div>
        <div class="charts-row">
          <div class="chart-box" id="pieChart"></div>
          <div class="chart-box" id="barChart"></div>
        </div>
      </el-card>

      <!-- 支付金额趋势 -->
      <el-card shadow="never" style="margin-bottom:20px;">
        <div slot="header">每日支付金额趋势</div>
        <div id="paymentTrendChart" style="width:100%;height:360px;"></div>
      </el-card>

      <!--
        后端返回结构（Map，非数组）：
        { wechat: { count, amount }, alipay: { count, amount }, balance: { count }, other: { count } }
        前端将其转为 tableData 数组展示
      -->
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="channel" label="支付渠道" align="center"></el-table-column>
        <el-table-column prop="transactionCount" label="交易笔数" align="center"></el-table-column>
        <el-table-column label="金额（元）" align="center">
          <template slot-scope="{ row }">
            <span>{{ row.amount != null ? '￥' + formatMoney(row.amount) : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="占比" align="center">
          <template slot-scope="{ row }">
            <el-progress
              :percentage="calcPercent(row.transactionCount)"
              :show-text="true"
              :stroke-width="10"
              :format="p => p + '%'"
            ></el-progress>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script>
    // 支付渠道 key → 展示名
    const CHANNEL_LABEL = {
      wechat:  '微信支付',
      alipay:  '支付宝',
      balance: '余额支付',
      other:   '其他'
    }
    const CHANNEL_COLOR = {
      wechat:  '#07C160',
      alipay:  '#1677FF',
      balance: '#E6A23C',
      other:   '#909399'
    }

    new Vue({
      el: '#report-payment-app',
      data() {
        return {
          loading: false,
          dateRange: [],
          tableData: [],   // 转换后的数组
          pieChart: null,
          barChart: null,
          trendChart: null,
          resizeHandler: null
        }
      },
      computed: {
        totalCount() {
          return this.tableData.reduce((s, r) => s + (r.transactionCount || 0), 0)
        },
        // 修改点：新增总金额、最常用渠道计算属性
        totalAmount() {
          return this.tableData.reduce((s, r) => s + (Number(r.amount) || 0), 0)
        },
        topChannel() {
          if (!this.tableData.length) return '--'
          const top = this.tableData.reduce((max, r) =>
            (r.transactionCount || 0) > (max.transactionCount || 0) ? r : max, this.tableData[0])
          return top.channel || '--'
        }
      },
      created() {
        const now = new Date()
        const first = new Date(now.getFullYear(), now.getMonth(), 1)
        const last  = new Date(now.getFullYear(), now.getMonth() + 1, 0)
        const fmt = d => d.getFullYear() + '-'
          + String(d.getMonth() + 1).padStart(2, '0') + '-'
          + String(d.getDate()).padStart(2, '0')
        this.dateRange = [fmt(first), fmt(last)]
      },
      mounted() {
        this.$nextTick(() => {
          this.pieChart = echarts.init(document.getElementById('pieChart'))
          this.barChart = echarts.init(document.getElementById('barChart'))
          this.trendChart = echarts.init(document.getElementById('paymentTrendChart'))
          this.resizeHandler = () => {
            if (this.pieChart) this.pieChart.resize()
            if (this.barChart) this.barChart.resize()
            if (this.trendChart) this.trendChart.resize()
          }
          window.addEventListener('resize', this.resizeHandler)
          this.loadData()
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.pieChart) this.pieChart.dispose()
        if (this.barChart) this.barChart.dispose()
        if (this.trendChart) this.trendChart.dispose()
      },
      methods: {
        async loadData() {
          if (!this.dateRange || this.dateRange.length < 2) {
            this.$message.warning('请选择日期范围')
            return
          }
          this.loading = true
          try {
            const res = await reportPayment({
              startDate: this.dateRange[0],
              endDate:   this.dateRange[1]
            })
            if (String(res.code) === '1') {
              // 后端返回 Map 对象：{ wechat:{count,amount}, alipay:{count,amount}, balance:{count}, other:{count} }
              // 转换为数组供 el-table 使用
              this.tableData = this.convertToArray(res.data || {})
              this.renderCharts()
              this.loadPaymentTrend()
            } else {
              this.$message.error(res.msg || '加载失败')
            }
          } catch (err) {
            this.$message.error('请求失败：' + err)
          } finally {
            this.loading = false
          }
        },

        // 加载支付金额趋势
        loadPaymentTrend() {
          if (!this.trendChart) return
          var self = this
          $axios.get('/api/report/payment/trend', {
            params: { startDate: self.dateRange[0], endDate: self.dateRange[1] }
          }).then(function(res) {
            if (res.code === 1 && res.data) self.renderPaymentTrend(res.data)
          }).catch(function() {})
        },
        renderPaymentTrend(data) {
          if (!this.trendChart) return
          // 修改点：空数据兜底
          if (!data || !data.dates || !data.dates.length) {
            this.trendChart.setOption({
              title: { text: '暂无趋势数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          var dates = data.dates || []
          this.trendChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['微信', '支付宝', '余额'], bottom: 0, textStyle: { fontSize: 12 } },
            grid: { left: 55, right: 55, top: 15, bottom: 45 },
            xAxis: { type: 'category', data: dates, boundaryGap: false },
            yAxis: { type: 'value', name: '金额(元)' },
            series: [
              { name: '微信', type: 'line', data: data.wechat || [], smooth: true,
                symbol: 'circle', symbolSize: 6, lineStyle: { color: '#07C160', width: 2.5 },
                areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1, [
                  { offset: 0, color: 'rgba(7,193,96,0.2)' }, { offset: 1, color: 'rgba(7,193,96,0.02)' }]) } },
              { name: '支付宝', type: 'line', data: data.alipay || [], smooth: true,
                symbol: 'circle', symbolSize: 6, lineStyle: { color: '#1677FF', width: 2.5 },
                areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1, [
                  { offset: 0, color: 'rgba(22,119,255,0.2)' }, { offset: 1, color: 'rgba(22,119,255,0.02)' }]) } },
              { name: '余额', type: 'line', data: data.balance || [], smooth: true,
                symbol: 'circle', symbolSize: 6, lineStyle: { color: '#E6A23C', width: 2.5 },
                areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1, [
                  { offset: 0, color: 'rgba(230,162,60,0.2)' }, { offset: 1, color: 'rgba(230,162,60,0.02)' }]) } }
            ]
          }, true)
        },

        reset() {
          this.dateRange = []
          this.tableData = []
          if (this.pieChart) this.pieChart.clear()
          if (this.barChart) this.barChart.clear()
          if (this.trendChart) this.trendChart.clear()
        },

        // 将后端 Map 转为前端展示数组
        convertToArray(data) {
          return Object.keys(CHANNEL_LABEL)
            .filter(key => data[key] != null)
            .map(key => {
              const item = data[key] || {}
              return {
                key,
                channel:          CHANNEL_LABEL[key],
                transactionCount: item.count  || 0,
                amount:           item.amount != null ? item.amount : null
              }
            })
        },

        calcPercent(count) {
          if (!this.totalCount) return 0
          return Math.round(count / this.totalCount * 100)
        },
        formatMoney(val) {
          return Number(val || 0).toFixed(2)
        },

        renderCharts() {
          this.renderPie()
          this.renderBar()
        },

        renderPie() {
          if (!this.pieChart) return
          const pieData = this.tableData
            .filter(r => r.transactionCount > 0)
            .map(r => ({
              name:      r.channel,
              value:     r.transactionCount,
              itemStyle: { color: CHANNEL_COLOR[r.key] || '#909399' }
            }))
          const isEmpty = !pieData.length
          this.pieChart.setOption({
            tooltip: { trigger: 'item',
              formatter: p => `<b>${p.name}</b><br/>${p.marker} 笔数：<b>${p.value}</b>（${p.percent}%）` },
            legend: { bottom: 0, left: 'center', itemWidth: 10, itemHeight: 10,
              textStyle: { color: '#606266', fontSize: 12 } },
            series: [{
              type: 'pie',
              // 修改点：center top 从 46% 提至 44%，为底部 legend 留出空间
              radius: isEmpty ? ['0%','55%'] : ['45%','68%'],
              center: ['50%', '44%'],
              avoidLabelOverlap: false,
              itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
              label: { show: !isEmpty, position: 'outside',
                formatter: '{b}\n{d}%', fontSize: 13, lineHeight: 18 },
              labelLine: { show: !isEmpty },
              emphasis: { scaleSize: 10, label: { fontSize: 15, fontWeight: 'bold' } },
              data: isEmpty ? [{ name: '暂无数据', value: 1, itemStyle: { color: '#e4e7ed' } }] : pieData
            }]
          }, true)
        },

        renderBar() {
          if (!this.barChart) return
          const names   = this.tableData.map(r => r.channel)
          const counts  = this.tableData.map(r => r.transactionCount)
          const amounts = this.tableData.map(r => r.amount != null ? Number(r.amount).toFixed(2) : 0)
          const hasAmount = this.tableData.some(r => r.amount != null)
          // 修改点：根据渠道数动态调整柱宽，避免过宽或过窄
          const barW = names.length <= 2 ? 48 : names.length <= 3 ? 36 : 24
          if (!names.length) {
            this.barChart.setOption({
              title: { text: '暂无支付数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          this.barChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
              formatter(params) {
                let html = '<b>' + params[0].axisValue + '</b><br/>'
                params.forEach(p => {
                  const v = p.seriesName === '金额' ? '¥' + p.value : p.value + ' 笔'
                  html += p.marker + ' ' + p.seriesName + '：<b>' + v + '</b><br/>'
                })
                return html
              }
            },
            legend: { data: hasAmount ? ['交易笔数', '金额'] : ['交易笔数'], bottom: 4 },
            grid: { left: 50, right: hasAmount ? 60 : 20, top: 20, bottom: 48 },
            xAxis: { type: 'category', data: names, axisTick: { show: false },
              axisLabel: { color: '#606266', interval: 0 } },
            yAxis: [
              { type: 'value', name: '笔数',
                splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } } },
              hasAmount ? { type: 'value', name: '金额',
                axisLabel: { formatter: '¥{value}' }, splitLine: { show: false } } : {}
            ].filter(y => Object.keys(y).length),
            series: [
              { name: '交易笔数', type: 'bar', data: counts, barWidth: barW,
                itemStyle: { borderRadius: [6, 6, 0, 0],
                  color(p) {
                    const key = Object.keys(CHANNEL_COLOR)[p.dataIndex]
                    return CHANNEL_COLOR[key] || '#909399'
                  }
                },
                label: { show: true, position: 'top', fontSize: 12 }
              },
              ...(hasAmount ? [{
                name: '金额', type: 'line', yAxisIndex: 1, data: amounts,
                smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                lineStyle: { color: '#fac858', width: 2.5 },
                itemStyle: { color: '#fac858', borderColor: '#fff', borderWidth: 2 }
              }] : [])
            ]
          }, true)
        }
      }
    })
  </script>
</body>
</html>
