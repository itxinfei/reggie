<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付分析 - 瑞吉外卖管理端</title>

  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css?v=20260915c" />
    <link rel="stylesheet" href="../../styles/main.css?v=20260915c" />
  <link rel="stylesheet" href="../../styles/chart-panel.css?v=20260915c" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow-y: auto; overflow-x: hidden;
      background: var(--bg-page);
      font-family: var(--font-family-base); }
    .payment-page { min-height: 100%; display: flex; flex-direction: column; }
    .payment-page .container { flex: 1; background: transparent; padding: var(--space-2) var(--space-3);
      min-width: 0; max-width: 1400px; margin: 0 auto; width: 100%; }
    /* 工具栏统一走 table-bar 组件 + page.css 的 .container .tableBar 纯 flex 栏规则，
       不再私有卡片化覆盖；fl-label/fl-spacer 旧类已无引用。 */
    .payment-page .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    /* 退款面板顶部紧凑汇总条：3 指标等宽，数值语义色 */
    .refund-summary { display: flex; gap: 12px; margin-bottom: 12px; }
    .refund-summary__item {
      flex: 1; display: flex; flex-direction: column; gap: 2px;
      padding: 8px 12px; background: var(--bg-page); border-radius: var(--radius-md);
    }
    .refund-summary__value { font-size: var(--font-size-lg); font-weight: 600; color: var(--text-primary); }
    .refund-summary__value.is-danger { color: var(--color-danger); }
    .refund-summary__value.is-success { color: var(--color-success); }
    .refund-summary__value.is-warning { color: var(--color-warning); }
    .refund-summary__label { font-size: var(--font-size-xs); color: var(--text-muted); }
    @media (max-width: 1200px) { .payment-page .charts-row { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { .payment-page .container { padding: var(--space-2); }
      .refund-summary { flex-direction: column; } }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <div class="payment-page" id="report-payment-app" v-loading="loading">
    <main class="container" id="main-content" role="main" aria-label="页面主要内容">

      
      

      <!-- 修改点：使用 stat-cards 统一组件替代手写 KPI 卡片 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ========== 工具栏 ========== -->
      <!-- 修改点：搜索栏使用 table-bar 统一组件 -->
      <table-bar
        :search-items="searchItems"
        :actions="searchActions"
        :loading="loading"
        @search="handleSearch"
        @reset="handleReset"
        @action="handleAction">
      </table-bar>

      <!-- ========== 支付方式分布 ========== -->
      <chart-panel title="支付方式分布" icon="ri-bar-chart-2-line">
        <div class="charts-row">
          <div id="pieChart" style="width:100%;height:380px;min-height:300px;"></div>
          <div id="barChart" style="width:100%;height:380px;min-height:300px;"></div>
        </div>
      </chart-panel>

      <!-- ========== 每日支付金额趋势 ========== -->
      <chart-panel title="每日支付金额趋势" icon="ri-line-chart-line">
        <div id="paymentTrendChart" style="width:100%;height:360px;min-height:300px;"></div>
      </chart-panel>

      <!-- ========== 退款分析（8.5.2 补充） ========== -->
      <!-- 修改点：退款图归入图表成组区（统计卡片→工具栏→图表→明细表），
           原独立退款指标卡块已并入顶部 stat-cards（退款金额 danger 卡） -->
      <chart-panel title="退款分析" icon="ri-refund-2-line">
        <!-- 退款 3 指标汇总条（聚合在本面板，避免挤占顶部 4 卡） -->
        <div class="refund-summary">
          <div v-for="c in refundSummary" :key="c.key" class="refund-summary__item">
            <span class="refund-summary__value" :class="c.cls">{{ c.value }}</span>
            <span class="refund-summary__label">{{ c.label }}</span>
          </div>
        </div>
        <div id="refundChart" style="width:100%;height:300px;min-height:260px;"></div>
      </chart-panel>

      <!-- ========== 数据表格（统一 crud-table 组件，替代手写 el-table；页面主体收尾） ========== -->
      <crud-table
        empty-hint="暂无相关记录"
        :data="tableData"
        :columns="paymentColumns"
        :loading="loading"
        :show-pagination="false"
        :stripe="true"
        :border="true"
        aria-label="支付渠道数据"
      >
        <template #col-amount="{ row }">
          <span>{{ row.amount != null ? '¥' + formatMoney(row.amount) : '-' }}</span>
        </template>
        <template #col-ratio="{ row }">
          <el-progress :percentage="calcPercent(row.transactionCount)" :show-text="true"
            :stroke-width="12" :format="function(p) { return p + '%'; }"
            :color="channelProgressColor(row.key)">
          </el-progress>
        </template>
      </crud-table>

    </main>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260915c"></script>
  <script src="../../js/accessibility-utils.js?v=20260915c"></script>
  <script src="../../js/performance-utils.js?v=20260915c"></script>
  <script src="../../api/report.js?v=20260915c"></script>
  <script src="../../api/payment.js?v=20260915c"></script>
  <script src="../../js/components.js?v=20260915c"></script>
  <script src="../../js/chart-panel.js?v=20260915c"></script>
  <script>
    const CHANNEL_LABEL = { wechat: '微信支付', alipay: '支付宝', balance: '线下/其他', other: '其他渠道' };
    // 支付渠道配色：统一走 RgPalette（微信绿/支付宝蓝已收录为调色板字段），canvas 中禁止写 hex
    const CHANNEL_COLOR = {
      wechat: RgPalette.wechatGreen, // 微信支付品牌绿
      alipay: RgPalette.alipayBlue,  // 支付宝品牌蓝
      balance: RgPalette.brand,      // 余额支付 → 品牌金
      other: RgPalette.warning       // 其他渠道 → 警告橙
    };

    (function() {
      new Vue({
        el: '#report-payment-app',
        data: function() {
          return {
            loading: false, dateRange: [], tableData: [],
            // 修改点：table-bar 统一组件配置
            searchItems: [{ type: 'daterange', field: 'dateRange', placeholder: '日期范围' }],
            searchActions: [{ key: 'export', text: '导出 CSV', type: 'success', icon: 'ri-download-line' }],
            // 表格列配置（配合 crud-table 组件，替代原手写 el-table 列定义）
            paymentColumns: [
              { prop: 'channel', label: '支付渠道', width: 150, align: 'center' },
              { prop: 'transactionCount', label: '交易笔数', width: 120, type: 'number' },
              { prop: 'amount', label: '金额（元）', width: 150, slot: true, type: 'money' },
              { prop: 'ratio', label: '占比', width: 160, align: 'center', slot: true }
            ],
            pieChart: null, barChart: null, trendChart: null, refundChart: null, resizeHandler: null,
            // 退款分析数据（GET /api/payment/refund/stats）
            refundAnalysis: null
          }
        },
        computed: {
          totalCount: function() { return this.tableData.reduce(function(s, r) { return s + (r.transactionCount || 0); }, 0); },
          totalAmount: function() { return this.tableData.reduce(function(s, r) { return s + (Number(r.amount) || 0); }, 0); },
          topChannel: function() {
            if (!this.tableData.length) return '--';
            var top = this.tableData.reduce(function(m, r) { return (r.transactionCount || 0) > (m.transactionCount || 0) ? r : m; }, this.tableData[0]);
            return CHANNEL_LABEL[top.key] || top.channel || '--';
          },
          // 修改点：statsCards 统一卡片配置（供 stat-cards 组件使用）
          statsCards: function() {
            // 顶部固定 4 张支付卡（stat-cards 4 列网格）；退款 3 指标聚合在退款分析面板顶部汇总条
            return [
              { key: '笔数', icon: 'ri-bank-card-line', label: '交易总笔数', value: this.totalCount, color: 'primary', clickable: false },
              { key: '总额', icon: 'ri-money-cny-circle-line', label: '交易总额（元）', value: '¥' + this.formatMoney(this.totalAmount), color: 'success', clickable: false },
              { key: '常用', icon: 'ri-medal-line', label: '最常用支付方式', value: this.topChannel, color: 'warning', clickable: false },
              { key: '渠道', icon: 'ri-bar-chart-2-line', label: '支付渠道数', value: this.tableData.length || 0, color: 'info', clickable: false }
            ]
          },
          // 退款分析面板顶部 3 指标（退款单数/成功退款/退款金额），数据未加载时置 0
          refundSummary: function() {
            const a = this.refundAnalysis || {};
            return [
              { key: 'count', label: '退款单数', value: a.totalCount || 0, cls: 'is-danger' },
              { key: 'success', label: '成功退款', value: a.successCount || 0, cls: 'is-success' },
              { key: 'amount', label: '退款金额（元）', value: '¥' + this.formatMoney(a.totalAmount || 0), cls: 'is-warning' }
            ];
          }
        },
        created: function() {
          this.dateRange = this.defaultRange();
        },
        mounted: function() {
          const self = this;
          self.$nextTick(function() {
            // 修改点：安全初始化图表
            var initChart = function(id) {
              const el = document.getElementById(id);
              if (!el) { console.warn('[payment] 图表容器未找到:', id); return null; }
              return echarts.init(el);
            };
            self.pieChart = initChart('pieChart');
            self.barChart = initChart('barChart');
            self.trendChart = initChart('paymentTrendChart');
            self.refundChart = initChart('refundChart');
            self.resizeHandler = function() {
              [self.pieChart, self.barChart, self.trendChart, self.refundChart].forEach(function(ch) {
                if (ch && !ch.isDisposed()) ch.resize();
              });
            };
            window.addEventListener('resize', self.resizeHandler);
            // 修改点：延迟 resize 确保容器已撑开
            setTimeout(function() {
              [self.pieChart, self.barChart, self.trendChart, self.refundChart].forEach(function(ch) {
                if (ch && !ch.isDisposed()) ch.resize();
              });
            }, 400);
            self.loadData();
          });
        },
        beforeDestroy: function() {
          if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
          [this.pieChart, this.barChart, this.trendChart, this.refundChart].forEach(function(ch) {
            if (ch) try { ch.dispose(); } catch(e) {}
          });
        },
        methods: {
          // 默认查询区间：本月 1 日 ~ 月末（created 初始化与重置共用）
          defaultRange: function() {
            const now = new Date();
            const first = new Date(now.getFullYear(), now.getMonth(), 1);
            const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            var fmt = function(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
            return [fmt(first), fmt(last)];
          },
          loadData: function() {
            const self = this;
            if (!self.dateRange || self.dateRange.length < 2) {
              ReggieUI.warning('请选择日期范围'); return;
            }
            self.loading = true;
            reportPayment({ startDate: self.dateRange[0], endDate: self.dateRange[1] }).then(function(res) {
              if (String(res.code) === '1') {
                self.tableData = self.convertToArray(res.data || {});
                self.$nextTick(function() { self.renderCharts(); self.loadPaymentTrend(); self.loadRefundAnalysis(); });
              } else { ReggieUI.error(res.msg || '加载支付数据失败'); }
            }).catch(function(err) { ReggieUI.error('请求失败：' + (err || '网络异常')); })
            .finally(function() { self.loading = false; });
          },
          // ====== 退款分析（8.5.2） ======
          loadRefundAnalysis: function() {
            const self = this;
            paymentRefundStats().then(function(res) {
              if (res && res.code === 1 && res.data) {
                self.refundAnalysis = res.data;
                self.$nextTick(function() { self.renderRefundChart(); });
              } else {
                // 修改点：此前仅 console.warn 静默，失败无用户提示
                ReggieUI.error((res && res.msg) || '加载退款分析失败');
              }
            }).catch(function(err) { ReggieUI.error('加载退款分析失败：' + (err || '网络异常')); });
          },
          renderRefundChart: function() {
            if (!this.refundChart) return;
            const byReason = (this.refundAnalysis && this.refundAnalysis.byReason) || [];
            if (!byReason.length) {
              this.refundChart.setOption({ title: { text: '暂无退款数据', left: 'center', top: 'center',
                textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } } }, true);
              return;
            }
            const reasons = byReason.map(function(r) { return r.reason; }).reverse();
            const amounts = byReason.map(function(r) { return Number(r.amount) || 0; }).reverse();
            const counts = byReason.map(function(r) { return r.count || 0; }).reverse();
            this.refundChart.setOption({
              tooltip: {
                trigger: 'axis', axisPointer: { type: 'shadow' },
                backgroundColor: RgPalette.white, borderColor: RgPalette.borderLighter2, borderWidth: 1,
                textStyle: { color: RgPalette.textPrimary, fontSize: 13 },
                formatter: function(params) {
                  if (!params || !params.length) return '';
                  var p = params[0];
                  // 修改点：金额统一半角 ¥ + 千分位
                  return p.name + '<br/>退款 ¥' + RgFormat.formatMoney(p.value) + ' · ' + RgFormat.formatNumber(counts[params[0].dataIndex]) + ' 笔';
                }
              },
              grid: { left: 120, right: 60, top: 20, bottom: 30 },
              xAxis: {
                type: 'value', axisLabel: { color: RgPalette.info, fontSize: 12,
                  formatter: function(v) { return '¥' + Number(v).toLocaleString('zh-CN'); } },
                splitLine: { lineStyle: { color: RgPalette.borderLighter2, type: 'dashed' } },
                axisLine: { show: false }, axisTick: { show: false }
              },
              yAxis: {
                type: 'category', data: reasons,
                axisLine: { lineStyle: { color: RgPalette.borderLighter2 } }, axisTick: { show: false },
                axisLabel: { color: RgPalette.textRegular, fontSize: 12 }
              },
              series: [{
                name: '退款金额', type: 'bar', data: amounts, barWidth: 18,
                itemStyle: { color: RgPalette.danger, borderRadius: [0, RgPalette.radiusMd, RgPalette.radiusMd, 0] },
                label: { show: true, position: 'right', fontSize: 12, fontWeight: 600, color: RgPalette.danger, formatter: function(p) { return '¥' + Number(p.value).toFixed(2); } }
              }]
            }, true);
          },
          loadPaymentTrend: function() {
            const self = this;
            if (!self.trendChart) return;
            reportPaymentTrend({ startDate: self.dateRange[0], endDate: self.dateRange[1] })
              .then(function(res) {
                if (res.code === 1 && res.data) {
                  self.renderPaymentTrend(res.data);
                } else {
                  // 修改点：此前仅 console.warn 静默，失败无用户提示
                  ReggieUI.error((res && res.msg) || '加载支付趋势失败');
                }
              })
              .catch(function(err) { ReggieUI.error('加载支付趋势失败：' + (err || '网络异常')); });
          },
          renderPaymentTrend: function(data) {
            if (!this.trendChart) return;
            if (!data || !data.dates || !data.dates.length) {
              this.trendChart.setOption({ title: { text: '暂无趋势数据', left: 'center', top: 'center',
                textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            const dates = data.dates || [];
            var makeAreaGrad = function(c) { return c; };
            this.trendChart.setOption({
              // 修改点：金额 tooltip 统一半角 ¥ + 千分位（三个支付系列均为金额）
              tooltip: { trigger: 'axis', backgroundColor: RgPalette.white,
                borderColor: RgPalette.borderLighter2, borderWidth: 1, textStyle: { color: RgPalette.textPrimary, fontSize: 13 },
                formatter: function(params) {
                  var lines = params.map(function(p) {
                    return p.marker + ' ' + p.seriesName + '：<b>¥' + RgFormat.formatMoney(p.value) + '</b>'
                  })
                  return '<b>' + params[0].axisValue + '</b><br/>' + lines.join('<br/>')
                } },
              legend: { data: ['微信支付', '支付宝', '线下/其他'], bottom: 8, textStyle: { fontSize: 12, color: RgPalette.textRegular } },
              // 修改点：增大左/底部 padding 防止标签被裁剪
              grid: { left: 55, right: 30, top: 25, bottom: 52 },
              xAxis: { type: 'category', data: dates, boundaryGap: false,
                axisLine: { lineStyle: { color: RgPalette.borderLighter2 } }, axisTick: { show: false },
                axisLabel: { color: RgPalette.textSecondary, fontSize: 12 } },
              yAxis: { type: 'value', name: '金额(元)',
                nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
                splitLine: { lineStyle: { color: RgPalette.bgLight, type: 'dashed' } } },
              series: [
                { name: '微信支付', type: 'line', data: data.wechat || [], smooth: true, symbol: 'circle', symbolSize: 6,
                  lineStyle: { color: RgPalette.wechatGreen, width: 3 }, itemStyle: { color: RgPalette.wechatGreen, borderColor: RgPalette.white, borderWidth: 2 },
                  // 面积半透明（opacity 0.15），三条线重叠时互不遮盖
                  areaStyle: { color: makeAreaGrad(RgPalette.wechatGreen), opacity: 0.15 } },
                { name: '支付宝', type: 'line', data: data.alipay || [], smooth: true, symbol: 'circle', symbolSize: 6,
                  lineStyle: { color: RgPalette.alipayBlue, width: 3 }, itemStyle: { color: RgPalette.alipayBlue, borderColor: RgPalette.white, borderWidth: 2 },
                  areaStyle: { color: makeAreaGrad(RgPalette.alipayBlue), opacity: 0.15 } },
                { name: '线下/其他', type: 'line', data: data.balance || [], smooth: true, symbol: 'circle', symbolSize: 6,
                  lineStyle: { color: RgPalette.warning, width: 3 }, itemStyle: { color: RgPalette.warning, borderColor: RgPalette.white, borderWidth: 2 },
                  areaStyle: { color: makeAreaGrad(RgPalette.warning), opacity: 0.15 } }
              ]
            }, true);
          },
          reset: function() {
            this.dateRange = []; this.tableData = [];
            [this.pieChart, this.barChart, this.trendChart, this.refundChart].forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.clear();
            });
          },
          convertToArray: function(data) {
            return Object.keys(CHANNEL_LABEL).filter(function(k) { return data[k] != null; })
              .map(function(k) { const item = data[k] || {}; return { key: k, channel: CHANNEL_LABEL[k],
                transactionCount: item.count || 0, amount: item.amount != null ? item.amount : null }; });
          },
          calcPercent: function(count) { if (!this.totalCount) return 0; return Math.round(count / this.totalCount * 100); },
          channelProgressColor: function(key) { return CHANNEL_COLOR[key] || RgPalette.textSecondary; },
          renderCharts: function() {
            // 修改点：渲染前 resize 确保容器尺寸正确
            [this.pieChart, this.barChart].forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.resize();
            });
            this.renderPie(); this.renderBar();
          },
          renderPie: function() {
            if (!this.pieChart || !this.tableData.length) {
              if (this.pieChart) this.pieChart.setOption({ title: { text: '暂无支付数据', left: 'center', top: 'center',
                textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            var pieData = this.tableData.filter(function(r) { return r.transactionCount > 0; })
              .map(function(r) { return { name: r.channel, value: r.transactionCount,
                itemStyle: { color: CHANNEL_COLOR[r.key] || RgPalette.textSecondary } }; });
            this.pieChart.setOption({
              color: [RgPalette.wechatGreen,RgPalette.alipayBlue,RgPalette.warning,RgPalette.textSecondary],
              tooltip: { trigger: 'item', backgroundColor: RgPalette.white,
                borderColor: RgPalette.borderLighter2, borderWidth: 1, textStyle: { color: RgPalette.textPrimary, fontSize: 13 },
                formatter: function(p) { return '<b>' + p.name + '</b><br/>' + p.marker + ' 笔数：<b>' + p.value + '</b>（' + p.percent + '%）'; } },
              legend: { bottom: 0, left: 'center', itemWidth: 10, itemHeight: 10,
                textStyle: { color: RgPalette.textRegular, fontSize: 12 } },
              series: [{ type: 'pie', radius: ['45%','68%'], center: ['50%','44%'],
                avoidLabelOverlap: false, itemStyle: { borderRadius: RgPalette.radiusMd, borderColor: RgPalette.white, borderWidth: 3 },
                label: { position: 'outside', formatter: '{b}\n{d}%', fontSize: 13, lineHeight: 18, color: RgPalette.textRegular },
                labelLine: { length: 25, length2: 20, lineStyle: { color: RgPalette.borderBase } },
                emphasis: { scaleSize: 10, label: { fontSize: 16, fontWeight: 'bold' } },
                data: pieData.length ? pieData : [{ name: '暂无数据', value: 1, itemStyle: { color: RgPalette.borderLighter2 } }] }]
            }, true);
          },
          renderBar: function() {
            if (!this.barChart || !this.tableData.length) {
              if (this.barChart) this.barChart.setOption({ title: { text: '暂无支付数据', left: 'center', top: 'center',
                textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            var rows = this.tableData;
            var names = rows.map(function(r) { return r.channel; });
            var counts = rows.map(function(r) { return r.transactionCount; });
            var amounts = this.tableData.map(function(r) { return r.amount != null ? Number(r.amount).toFixed(2) : 0; });
            var hasAmount = this.tableData.some(function(r) { return r.amount != null; });
            const barW = names.length <= 2 ? 48 : names.length <= 3 ? 36 : 24;
            this.barChart.setOption({
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
                backgroundColor: RgPalette.white, borderColor: RgPalette.borderLighter2, borderWidth: 1,
                textStyle: { color: RgPalette.textPrimary, fontSize: 13 },
                formatter: function(ps) {
                  // 修改点：h 需累加拼接，声明为 const 会抛 "Assignment to constant variable"（悬停图表即崩溃）
                  let h = '<b>' + ps[0].axisValue + '</b><br/>';
                  ps.forEach(function(p) {
                    // 修改点：金额统一半角 ¥ + 千分位（原 toFixed(2) 无千分位）
                    const v = p.seriesName === '交易金额' ? '¥' + RgFormat.formatMoney(p.value) : p.value + ' 笔';
                    h += p.marker + ' ' + p.seriesName + '：<b>' + v + '</b><br/>';
                  }); return h;
                } },
              legend: { data: hasAmount ? ['交易笔数', '交易金额'] : ['交易笔数'], bottom: 4,
                textStyle: { fontSize: 12, color: RgPalette.textRegular } },
              // 修改点：增大右 padding 防止金额标签被裁剪
              grid: { left: 55, right: hasAmount ? 70 : 20, top: 25, bottom: 52 },
              xAxis: { type: 'category', data: names, axisTick: { show: false },
                axisLabel: { color: RgPalette.textRegular, interval: 0, fontSize: 13 } },
              yAxis: [
                { type: 'value', name: '笔数',
                  nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
                  splitLine: { lineStyle: { type: 'dashed', color: RgPalette.bgLight } },
                  axisLabel: { color: RgPalette.textSecondary, fontSize: 12 } },
                hasAmount ? { type: 'value', name: '金额',
                  nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
                  axisLabel: { color: RgPalette.textSecondary, fontSize: 12,
                    formatter: function(v) { return '¥' + Number(v).toLocaleString('zh-CN'); } },
                  splitLine: { show: false } } : {}
              ].filter(function(y) { return Object.keys(y).length; }),
              series: [
                { name: '交易笔数', type: 'bar', data: counts, barWidth: barW,
                  itemStyle: { borderRadius: [RgPalette.radiusMd, RgPalette.radiusMd, 0, 0],
                    // 按数据行真实渠道 key 取色（旧实现按 Object.keys 下标，渠道缺失/乱序时会错配）
                    color: function(p) { const row = rows[p.dataIndex] || {}; return CHANNEL_COLOR[row.key] || RgPalette.textSecondary; } },
                  label: { show: true, position: 'top', fontSize: 12, fontWeight: 600, formatter: '{c} 笔' } },
                hasAmount ? { name: '交易金额', type: 'line', yAxisIndex: 1, data: amounts,
                  smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                  lineStyle: { color: RgPalette.seriesOrange, width: 3 },
                  itemStyle: { color: RgPalette.seriesOrange, borderColor: RgPalette.white, borderWidth: 2 },
                  label: { show: true, position: 'top', fontSize: 12, fontWeight: 700, color: RgPalette.warning,
                    formatter: function(p) { return '¥' + Number(p.value).toFixed(0); } } } : null
              ].filter(function(s) { return s; })
            }, true);
          },
          // 修改点：改为导出当前表格数据生成 CSV（此前误调日报接口且扩展名 .csv 内容为 xlsx）
          handleExport: function() {
            const self = this;
            if (!self.dateRange || self.dateRange.length < 2) { ReggieUI.warning('请先选择日期范围'); return; }
            if (!self.tableData || !self.tableData.length) { ReggieUI.warning('暂无数据可导出'); return; }
            const esc = function(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"' }
            const header = ['支付渠道', '交易笔数', '交易金额（元）']
            const lines = self.tableData.map(function(r) {
              return [r.channel, r.transactionCount, r.amount != null ? r.amount : 0].map(esc).join(',')
            })
            const csv = '\uFEFF' + header.map(esc).join(',') + '\r\n' + lines.join('\r\n')
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' })
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '支付分析_' + self.dateRange[0] + '_' + self.dateRange[1] + '.csv';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            ReggieUI.success('导出成功');
          },
          // 修改点：table-bar 组件回调桥接
          handleSearch: function(params) {
            if (params && params.dateRange) this.dateRange = params.dateRange;
            this.loadData();
          },
          handleReset: function() {
            // 重置为默认本月区间再查询；清空后立即 loadData 必然触发“请选择日期范围”警告
            this.dateRange = this.defaultRange();
            this.tableData = [];
            this.loadData();
          },
          handleAction: function(action) { if (action.key === 'export') this.handleExport(); }
        }
      })
    })();
  </script>
</body>
</html>
