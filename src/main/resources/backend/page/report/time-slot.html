<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时段分析 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/chart-panel.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow-y: auto; overflow-x: hidden;
      background: linear-gradient(135deg, var(--el-bg-subtle) 0%, var(--el-border-lighter) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .timeslot-page { min-height: 100%; display: flex; flex-direction: column; }
    .timeslot-page .container { flex: 1; background: transparent; padding: 24px 32px 32px;
      min-width: 0; max-width: 1600px; margin: 0 auto; width: 100%; }

    /* 工具栏 */
    .tableBar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
      background: var(--bg-surface); padding: 16px 24px; border-radius: 12px; margin-bottom: 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.8);
      transition: all 0.3s; }
    .tableBar:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .tableBar .toolbar-label { font-size: 14px; color: var(--el-text-regular); font-weight: 500; flex-shrink: 0; }
    .tableBar .toolbar-spacer { flex: 1; min-width: 0; }

    .timeslot-page .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .timeslot-page .chart-box { width: 100%; height: 380px; min-height: 300px; }
    @media (max-width: 1200px) { .timeslot-page .container { padding: 16px 20px 20px !important; }
      .timeslot-page .charts-row { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { .timeslot-page .container { padding: 12px 16px 16px !important; }
      .timeslot-page .chart-box { height: 300px; min-height: 260px; } }
  </style>
</head>
<body>
  <div class="timeslot-page" id="report-timeslot-app" v-loading="loading">
    <div class="container">


      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 KPI 卡片 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ========== 工具栏 ========== -->
      <div class="tableBar">
        <span class="toolbar-label"><i class="el-icon-date" style="margin-right:4px;"></i>日期范围</span>
        <el-date-picker v-model="dateRange" clearable value-format="yyyy-MM-dd"
          type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
          size="small"></el-date-picker>
        <el-button type="primary" size="small" class="btn-query" icon="el-icon-search" @click="loadData">查询</el-button>
        <el-button size="small" class="btn-reset" icon="el-icon-refresh" @click="reset">重置</el-button>
        <span class="toolbar-spacer"></span>
        <el-button type="success" size="small" icon="el-icon-download" @click="handleExport">导出 CSV</el-button>
      </div>



      <!-- ========== 时段分布图表 ========== -->
      <chart-panel title="📊 时段订单与营业额分布">
        <div class="charts-row">
          <div id="barChart" class="chart-box"></div>
          <div id="pieChart" class="chart-box"></div>
        </div>
      </chart-panel>

      <!-- ========== 工作日×时段热力图 ========== -->
      <chart-panel title="🗺 工作日 × 时段 客流量热力图">
        <div id="heatmapChart" style="width:100%;height:420px;min-height:320px;"></div>
      </chart-panel>

      <!-- ========== 数据表格（统一 crud-table 组件，替代手写 el-table） ========== -->
      <crud-table
        :data="tableData"
        :columns="timeSlotColumns"
        :loading="loading"
        :show-pagination="false"
        :stripe="true"
        :border="true"
        aria-label="时段分布数据"
      >
        <template #col-ratio="{ row }"><span>{{ calcPercent(row.count) }}%</span></template>
        <template #col-amount="{ row }"><span>￥{{ formatMoney(row.amount) }}</span></template>
        <template #col-heat="{ row }">
          <el-progress :percentage="calcPercent(row.count)" :show-text="true"
            :stroke-width="12" :format="function(p) { return p + '%'; }"
            :color="slotHeatColor(row)">
          </el-progress>
        </template>
      </crud-table>

    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/report.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/chart-panel.js"></script>
  <script>
    (function() {
      var COLORS = ['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#fc8452','#9a60b4'];
      new Vue({
        el: '#report-timeslot-app',
        data: function() {
          return {
            loading: false, dateRange: [], tableData: [],
            // 表格列配置（配合 crud-table 组件，替代原手写 el-table 列定义）
            timeSlotColumns: [
              { prop: 'name', label: '时段', width: 120, align: 'center' },
              { prop: 'count', label: '订单数', width: 120, align: 'center', type: 'number' },
              { prop: 'ratio', label: '占比', width: 120, align: 'center', slot: true },
              { prop: 'amount', label: '营业额（元）', width: 150, align: 'center', slot: true, type: 'money' },
              { prop: 'heat', label: '时段热度', minWidth: 200, align: 'center', slot: true }
            ],
            barChart: null, pieChart: null, heatmapChart: null,
            resizeHandler: null, observer: null
          }
        },
        computed: {
          totalCount: function() { return this.tableData.reduce(function(s, r) { return s + (r.count || 0); }, 0); },
          totalAmount: function() { return this.tableData.reduce(function(s, r) { return s + (Number(r.amount) || 0); }, 0); },
          peakSlot: function() {
            if (!this.tableData.length) return '--';
            var p = this.tableData.reduce(function(m, r) { return (r.count || 0) > (m.count || 0) ? r : m; }, this.tableData[0]);
            return p.name || '--';
          },
          // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
          statsCards: function() {
            var self = this;
            return [
              { key: '时段', icon: '🕐', label: '时段数量', value: self.tableData.length || 0, color: 'primary' },
              { key: '订单', icon: '📋', label: '总订单数', value: self.totalCount, color: 'success' },
              { key: '营业额', icon: '💰', label: '总营业额（元）', value: '¥' + self.formatMoney(self.totalAmount), color: 'warning' },
              { key: '高峰', icon: '🔥', label: '高峰时段', value: self.peakSlot, color: 'info' }
            ]
          }
        },
        created: function() {
          var now = new Date();
          var first = new Date(now.getFullYear(), now.getMonth(), 1);
          var last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
          var fmt = function(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
          this.dateRange = [fmt(first), fmt(last)];
        },
        mounted: function() {
          var self = this;
          self.$nextTick(function() {
            self.initCharts();
            self.loadData();
          });
        },
        beforeDestroy: function() {
          if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler);
          if (this.observer) this.observer.disconnect();
          [this.barChart, this.pieChart, this.heatmapChart].forEach(function(ch) {
            if (ch) try { ch.dispose(); } catch(e) {}
          });
        },
        methods: {
          // 修改点：独立初始化逻辑，增加安全判断与延迟 resize 防止变形
          initCharts: function() {
            var self = this;
            var tryInit = function(id, key) {
              var el = document.getElementById(id);
              if (!el) { console.warn('[time-slot] 图表容器未找到:', id); return null; }
              var ch = echarts.init(el);
              // 修改点：延迟手动 resize 确保父子容器尺寸稳定后再渲染
              setTimeout(function() { if (ch && !ch.isDisposed()) ch.resize(); }, 300);
              return ch;
            };
            self.barChart = tryInit('barChart', 'barChart');
            self.pieChart = tryInit('pieChart', 'pieChart');
            self.heatmapChart = tryInit('heatmapChart', 'heatmapChart');
            self.resizeHandler = function() {
              [self.barChart, self.pieChart, self.heatmapChart].forEach(function(ch) {
                if (ch && !ch.isDisposed()) ch.resize();
              });
            };
            window.addEventListener('resize', self.resizeHandler);
            // 修改点：ResizeObserver 监听图表父容器尺寸变化
            if (typeof ResizeObserver !== 'undefined') {
              try {
                self.observer = new ResizeObserver(function() {
                  [self.barChart, self.pieChart, self.heatmapChart].forEach(function(ch) {
                    if (ch && !ch.isDisposed()) ch.resize();
                  });
                });
                var chartPanel = document.querySelector('.timeslot-page .chart-panel');
                if (chartPanel) self.observer.observe(chartPanel.parentElement || chartPanel);
              } catch(e) { console.warn('[time-slot] ResizeObserver 初始化失败:', e); }
            }
          },
          loadData: function() {
            var self = this;
            if (!self.dateRange || self.dateRange.length < 2) {
              self.$message.warning('请选择日期范围'); return;
            }
            self.loading = true;
            reportTimeSlot({ startDate: self.dateRange[0], endDate: self.dateRange[1] }).then(function(res) {
              if (String(res.code) === '1') {
                self.tableData = res.data || [];
                self.$nextTick(function() { self.renderCharts(); self.loadHeatmap(); });
              } else { self.$message.error(res.msg || '加载时段数据失败'); }
            }).catch(function(err) { self.$message.error('请求失败：' + (err || '网络异常')); })
            .finally(function() { self.loading = false; });
          },
          loadHeatmap: function() {
            var self = this; if (!self.heatmapChart) return;
            $axios.get('/api/report/time-slot/heatmap', { params: { startDate: self.dateRange[0], endDate: self.dateRange[1] } })
              .then(function(res) { if (res.code === 1 && res.data) self.renderHeatmap(res.data); })
              .catch(function() {});
          },
          renderHeatmap: function(data) {
            if (!this.heatmapChart) return;
            var days = ['周一','周二','周三','周四','周五','周六','周日'];
            var slots = ['早市','午市','下午茶','晚市','夜市'];
            var heatData = (data.data || []).map(function(d) { return [d.slotIdx || 0, d.dayIdx || 0, d.value || 0]; });
            var maxVal = data.maxVal || 100;
            this.heatmapChart.setOption({
              tooltip: { formatter: function(p) { return days[p.value[1]] + ' ' + slots[p.value[0]] + ': ' + p.value[2] + ' 单'; },
                backgroundColor: 'rgba(255,255,255,0.96)', borderColor: '#e4e7ed', borderWidth: 1,
                textStyle: { color: '#303133', fontSize: 13 } },
              grid: { left: 80, right: 30, top: 15, bottom: 70 },
              xAxis: { type: 'category', data: slots, splitArea: { show: true },
                axisLabel: { fontSize: 12, color: '#606266' } },
              yAxis: { type: 'category', data: days, splitArea: { show: true },
                axisLabel: { fontSize: 12, color: '#606266' } },
              visualMap: { min: 0, max: maxVal, calculable: true,
                orient: 'horizontal', left: 'center', bottom: 8,
                inRange: { color: ['#f0f4ff','#a0cfff','#409eff','#2b6cb0','#1a365d'] },
                text: ['高', '低'], textStyle: { fontSize: 11, color: '#606266' } },
              series: [{ type: 'heatmap', data: heatData,
                label: { show: true, fontSize: 12, color: function(p) { return p.value > maxVal * 0.6 ? '#fff' : '#303133'; } },
                emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.3)' } } }]
            }, true);
          },
          reset: function() {
            this.dateRange = []; this.tableData = [];
            [this.barChart, this.pieChart, this.heatmapChart].forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.clear();
            });
          },
          calcPercent: function(count) {
            var t = this.totalCount; if (!t) return '0.0';
            return (count / t * 100).toFixed(1);
          },
          formatMoney: function(val) { return Number(val || 0).toFixed(2); },
          slotHeatColor: function(row) {
            if (!this.tableData.length) return '#909399';
            var max = this.tableData.reduce(function(m, r) { return Math.max(m, r.count || 0); }, 1);
            var r = (row.count || 0) / max;
            if (r > 0.8) return '#ff4d4f'; if (r > 0.5) return '#e6a23c'; return '#409eff';
          },
          renderCharts: function() {
            var self = this;
            // 修改点：渲染前先保障容器尺寸稳定
            [self.barChart, self.pieChart].forEach(function(ch) {
              if (ch && !ch.isDisposed()) ch.resize();
            });
            self.renderBar(); self.renderPie();
          },
          renderBar: function() {
            if (!this.barChart) return;
            if (!this.tableData.length) {
              this.barChart.setOption({ title: { text: '暂无时段数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } } }, true); return;
            }
            var names = this.tableData.map(function(r) { return r.name; });
            var counts = this.tableData.map(function(r) { return r.count; });
            var amounts = this.tableData.map(function(r) { return Number(r.amount || 0).toFixed(2); });
            var barW = names.length <= 3 ? 40 : names.length <= 5 ? 30 : 22;
            this.barChart.setOption({
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
                backgroundColor: 'rgba(255,255,255,0.96)', borderColor: '#e4e7ed', borderWidth: 1,
                textStyle: { color: '#303133', fontSize: 13 },
                formatter: function(ps) {
                  var h = '<b>' + ps[0].axisValue + '</b><br/>';
                  ps.forEach(function(p) {
                    var v = p.seriesName === '营业额' ? '¥' + Number(p.value).toFixed(2) : p.value + ' 单';
                    h += p.marker + ' ' + p.seriesName + '：<b>' + v + '</b><br/>';
                  }); return h;
                } },
              legend: { data: ['订单数', '营业额'], bottom: 4, textStyle: { fontSize: 12, color: '#606266' } },
              // 修改点：增大右 padding 防止营业额标签被裁剪
              grid: { left: 50, right: 70, top: 25, bottom: 48 },
              xAxis: { type: 'category', data: names, axisTick: { show: false },
                axisLabel: { color: '#606266', interval: 0, fontSize: 13 } },
              yAxis: [
                { type: 'value', name: '订单数(单)',
                  nameTextStyle: { color: '#909399', fontSize: 11 },
                  splitLine: { lineStyle: { type: 'dashed', color: '#f2f3f5' } },
                  axisLabel: { color: '#909399', fontSize: 12 } },
                { type: 'value', name: '营业额(元)',
                  nameTextStyle: { color: '#909399', fontSize: 11 },
                  axisLabel: { formatter: '¥{value}', color: '#909399', fontSize: 12 },
                  splitLine: { show: false } }
              ],
              series: [
                { name: '订单数', type: 'bar', data: counts, barWidth: barW,
                  itemStyle: { borderRadius: [8, 8, 0, 0],
                    color: function(p) { return COLORS[p.dataIndex % COLORS.length]; } },
                  label: { show: true, position: 'top', fontSize: 12, fontWeight: 600, formatter: '{c} 单' } },
                { name: '营业额', type: 'line', yAxisIndex: 1, data: amounts,
                  smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                  lineStyle: { color: '#fc8452', width: 3 },
                  itemStyle: { color: '#fc8452', borderColor: '#fff', borderWidth: 2 },
                  label: { show: true, position: 'top', fontSize: 12, fontWeight: 700, color: '#e6a23c',
                    formatter: function(p) { return '¥' + Number(p.value).toFixed(0); } } }
              ]
            }, true);
          },
          renderPie: function() {
            if (!this.pieChart) return;
            var pieData = this.tableData.map(function(r, i) { return { name: r.name, value: r.count,
              itemStyle: { color: COLORS[i % COLORS.length] } }; });
            var isEmpty = pieData.every(function(d) { return !d.value; }) || !pieData.length;
            this.pieChart.setOption({
              tooltip: { trigger: 'item', backgroundColor: 'rgba(255,255,255,0.96)',
                borderColor: '#e4e7ed', borderWidth: 1, textStyle: { color: '#303133', fontSize: 13 },
                formatter: function(p) { return '<b>' + p.name + '</b><br/>' + p.marker + ' 订单：<b>' + p.value + ' 单</b>（' + p.percent + '%）'; } },
              legend: { bottom: 0, left: 'center', itemWidth: 10, itemHeight: 10,
                textStyle: { color: '#606266', fontSize: 12 } },
              series: [{ type: 'pie', radius: isEmpty ? ['0%','55%'] : ['45%','68%'], center: ['50%','44%'],
                avoidLabelOverlap: false, itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
                label: { show: !isEmpty, position: 'outside', formatter: '{b}\n{d}%',
                  fontSize: 13, lineHeight: 18, color: '#606266' },
                labelLine: { show: !isEmpty, length: 25, length2: 20, lineStyle: { color: '#c0c4cc' } },
                emphasis: { scaleSize: 10, label: { fontSize: 16, fontWeight: 'bold' } },
                data: isEmpty ? [{ name: '暂无数据', value: 1, itemStyle: { color: '#e4e7ed' } }] : pieData }]
            }, true);
          },
          handleExport: function() {
            var self = this;
            if (!self.dateRange || self.dateRange.length < 2) { self.$message.warning('请先选择日期范围'); return; }
            reportExport({ startDate: self.dateRange[0], endDate: self.dateRange[1] }).then(function(blob) {
              if (blob && blob.type && blob.type.indexOf('json') > -1) { self.$message.error('导出失败，文件格式异常'); return; }
              var link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = '时段分析_' + self.dateRange[0] + '_' + self.dateRange[1] + '.csv';
              document.body.appendChild(link); link.click(); document.body.removeChild(link);
              URL.revokeObjectURL(link.href);
              self.$message.success('导出成功');
            }).catch(function(err) { self.$message.error('导出失败：' + (err || '网络异常')); });
          }
        }
      })
    })();
  </script>
</body>
</html>
