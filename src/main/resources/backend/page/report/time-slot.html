<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时段分析</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
  .chart-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .chart-container .chart-box {
    flex: 1;
    height: 400px;
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="report-timeslot-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-date-picker v-model="queryDate"
          clearable
          value-format="yyyy-MM-dd"
          type="date"
          placeholder="选择日期"
          style="width: 200px"
        ></el-date-picker>
        <el-button type="primary" class="search-btn" @click="loadData">查询</el-button>
      </div>
      <el-card shadow="never" style="margin-bottom: 20px;">
        <div slot="header">时段订单分布</div>
        <div class="chart-container">
          <div class="chart-box" id="pieChart"></div>
        </div>
      </el-card>
      <el-table :data="tableData" stripe class="tableBox">
        <el-table-column prop="timeSlot" label="时段"></el-table-column>
        <el-table-column prop="orderCount" label="订单数"></el-table-column>
        <el-table-column label="占比">
          <template slot-scope="{ row }">
            <span>{{ row.percentage }}%</span>
          </template>
        </el-table-column>
        <el-table-column label="金额">
          <template slot-scope="{ row }">
            <span>￥{{ row.amount }}</span>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script>
    new Vue({
      el: '#report-timeslot-app',
      data() {
        return {
          loading: false,
          queryDate: '',
          tableData: [],
          chart: null,
          resizeHandler: null
        }
      },
      created() {
        const now = new Date()
        const y = now.getFullYear()
        const m = String(now.getMonth() + 1).padStart(2, '0')
        const d = String(now.getDate()).padStart(2, '0')
        this.queryDate = y + '-' + m + '-' + d
      },
      mounted() {
        this.$nextTick(() => {
          this.chart = echarts.init(document.getElementById('pieChart'))
          this.resizeHandler = () => { if (this.chart) this.chart.resize() }
          window.addEventListener('resize', this.resizeHandler)
          this.loadData()
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.chart) this.chart.dispose()
      },
      methods: {
        async loadData() {
          if (!this.queryDate) {
            this.$message.warning('请选择日期')
            return
          }
          this.loading = true
          try {
            const res = await reportTimeSlot({ date: this.queryDate })
            if (String(res.code) === '1') {
              this.tableData = res.data || []
              this.renderChart()
            } else {
              this.$message.error(res.msg || '加载失败')
            }
          } catch (err) {
            this.$message.error('请求出错了：' + err)
          } finally {
            this.loading = false
          }
        },
        renderChart() {
          if (!this.chart) return
          const slotColors = {
            '早餐': '#F56C6C',
            '午餐': '#409EFF',
            '晚餐': '#67C23A',
            '夜宵': '#E6A23C'
          }
          const pieData = this.tableData.map(item => ({
            name: item.timeSlot,
            value: item.orderCount
          }))
          const colors = pieData.map(item => slotColors[item.name] || '#909399')
          const option = {
            tooltip: {
              trigger: 'item',
              formatter: '{b}: {c} ({d}%)'
            },
            series: [{
              type: 'pie',
              radius: ['35%', '60%'],
              center: ['50%', '50%'],
              avoidLabelOverlap: true,
              itemStyle: {
                borderRadius: 6,
                borderColor: '#fff',
                borderWidth: 2
              },
              label: {
                show: true,
                formatter: '{b}\n{d}%'
              },
              emphasis: {
                label: { show: true, fontSize: 16, fontWeight: 'bold' }
              },
              data: pieData,
              color: colors
            }]
          }
          this.chart.setOption(option, true)
        }
      }
    })
  </script>
</body>
</html>
