<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时段分析 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
  .search-btn { margin-left: 10px; }
  .charts-row { display: flex; gap: 16px; margin-bottom: 20px; }
  .charts-row .chart-box { flex: 1; height: 380px; }
  #heatmapChart { width: 100%; }

  /* ========== 数据统计卡片 ========== */
  .stats-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    border: 1px solid #f0f2f5;
  }
  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--gradient);
  }
  .stat-card .stat-icon {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 42px; 
  }
  .stat-card .stat-label {
    font-size: 13px; color: #909399;
    margin-bottom: 8px; font-weight: 500;
  }
  .stat-card .stat-value {
    font-size: 30px; font-weight: 700;
    line-height: 1.2;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card.primary { --gradient: linear-gradient(135deg, #409eff 0%, #66b1ff 100%); }
  .stat-card.success { --gradient: linear-gradient(135deg, #67c23a 0%, #85ce61 100%); }
  .stat-card.warning { --gradient: linear-gradient(135deg, #e6a23c 0%, #ebb563 100%); }
  .stat-card.danger  { --gradient: linear-gradient(135deg, #f56c6c 0%, #f78989 100%); }

  @media (max-width: 1400px) {
    .stats-cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .stats-cards { grid-template-columns: 1fr; }
    .charts-row { flex-direction: column; }
  }
  </style>
</head>
<body>
  <div class="dashboard-container" id="report-timeslot-app" v-loading="loading">
    <div class="container">
      <div class="tableBar">
        <el-date-picker v-model="dateRange"
          clearable
          value-format="yyyy-MM-dd"
          type="daterange"
          range-separator="至"
          start-placeholder="开始日期"
          end-placeholder="结束日期"
          style="width: 380px"
        ></el-date-picker>
        <el-button type="primary" class="search-btn" @click="loadData">查询</el-button>
        <el-button class="search-btn" @click="reset">重置</el-button>
        <div class="tableLab">
          <el-button type="primary" @click="handleExport">导出</el-button>
        </div>
      </div>

      <!-- ========== 数据统计卡片 ========== -->
      <div class="stats-cards">
        <div class="stat-card primary">
          <div class="stat-icon">🕐</div>
          <div class="stat-label">时段数量</div>
          <div class="stat-value">{{ tableData.length || 0 }}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">📋</div>
          <div class="stat-label">总订单数</div>
          <div class="stat-value">{{ totalCount }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">💰</div>
          <div class="stat-label">总营业额（元）</div>
          <div class="stat-value">¥{{ formatMoney(totalAmount) }}</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon">🔥</div>
          <div class="stat-label">高峰时段</div>
          <div class="stat-value" style="font-size:20px;">{{ peakSlot }}</div>
        </div>
      </div>

      <el-card shadow="never" style="margin-bottom:20px;">
        <div slot="header">时段订单与营业额分布</div>
        <div class="charts-row">
          <div class="chart-box" id="barChart"></div>
          <div class="chart-box" id="pieChart"></div>
        </div>
      </el-card>

      <!-- 工作日 × 时段热力图 -->
      <el-card shadow="never" style="margin-bottom:20px;">
        <div slot="header">工作日 × 时段 客流量热力图</div>
        <div id="heatmapChart" style="width:100%;height:420px;"></div>
      </el-card>

      <!-- 后端字段：name, count, amount（非 timeSlot/orderCount/percentage） -->
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="时段" align="center"></el-table-column>
        <el-table-column prop="count" label="订单数" align="center"></el-table-column>
        <el-table-column label="占比" align="center">
          <template slot-scope="{ row }">
            <span>{{ calcPercent(row.count) }}%</span>
          </template>
        </el-table-column>
        <el-table-column label="营业额（元）" align="center">
          <template slot-scope="{ row }">
            <span>￥{{ formatMoney(row.amount) }}</span>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/report.js"></script>
  <script>
    new Vue({
      el: '#report-timeslot-app',
      data() {
        return {
          loading: false,
          dateRange: [],
          tableData: [],
          barChart: null,
          pieChart: null,
          heatmapChart: null,
          resizeHandler: null
        }
      },
      computed: {
        totalCount() {
          return this.tableData.reduce((s, r) => s + (r.count || 0), 0)
        },
        // 修改点：新增总营业额计算
        totalAmount() {
          return this.tableData.reduce((s, r) => s + (Number(r.amount) || 0), 0)
        },
        // 修改点：新增高峰时段识别
        peakSlot() {
          if (!this.tableData.length) return '--'
          const peak = this.tableData.reduce((max, r) => (r.count || 0) > (max.count || 0) ? r : max, this.tableData[0])
          return peak.name || '--'
        }
      },
      created() {
        const now = new Date()
        const first = new Date(now.getFullYear(), now.getMonth(), 1)
        const last  = new Date(now.getFullYear(), now.getMonth() + 1, 0)
        const fmt = d => d.getFullYear() + '-'
          + String(d.getMonth() + 1).padStart(2, '0') + '-'
          + String(d.getDate()).padStart(2, '0')
        this.dateRange = [fmt(first), fmt(last)]
      },
      mounted() {
        this.$nextTick(() => {
          this.barChart = echarts.init(document.getElementById('barChart'))
          this.pieChart = echarts.init(document.getElementById('pieChart'))
          this.heatmapChart = echarts.init(document.getElementById('heatmapChart'))
          this.resizeHandler = () => {
            if (this.barChart) this.barChart.resize()
            if (this.pieChart) this.pieChart.resize()
            if (this.heatmapChart) this.heatmapChart.resize()
          }
          window.addEventListener('resize', this.resizeHandler)
          this.loadData()
        })
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.barChart) this.barChart.dispose()
        if (this.pieChart) this.pieChart.dispose()
        if (this.heatmapChart) this.heatmapChart.dispose()
      },
      methods: {
        async loadData() {
          if (!this.dateRange || this.dateRange.length < 2) {
            this.$message.warning('请选择日期范围')
            return
          }
          this.loading = true
          try {
            const res = await reportTimeSlot({
              startDate: this.dateRange[0],
              endDate:   this.dateRange[1]
            })
            if (String(res.code) === '1') {
              // 后端字段：name, count, amount
              this.tableData = res.data || []
              this.renderCharts()
              this.loadHeatmap()
            } else {
              this.$message.error(res.msg || '加载失败')
            }
          } catch (err) {
            this.$message.error('请求失败：' + err)
          } finally {
            this.loading = false
          }
        },
        // 加载工作日×时段热力图数据
        loadHeatmap() {
          if (!this.heatmapChart) return
          var self = this
          $axios.get('/api/report/time-slot/heatmap', {
            params: { startDate: self.dateRange[0], endDate: self.dateRange[1] }
          }).then(function(res) {
            if (res.code === 1 && res.data) self.renderHeatmap(res.data)
          }).catch(function() {})
        },
        renderHeatmap(data) {
          if (!this.heatmapChart) return
          var days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
          var slots = ['早市', '午市', '下午茶', '晚市', '夜市']
          var heatData = (data.data || []).map(function(d) {
            return [d.slotIdx || 0, d.dayIdx || 0, d.value || 0]
          })
          this.heatmapChart.setOption({
            tooltip: { formatter: function(p) { return days[p.value[1]] + ' ' + slots[p.value[0]] + ': ' + p.value[2] + ' 单' } },
            // 修改点：grid.bottom 从 40 增至 65，为底部视觉映射组件腾出空间，解决下午茶区域被遮挡问题
            grid: { left: 80, right: 30, top: 15, bottom: 65 },
            xAxis: { type: 'category', data: slots, splitArea: { show: true },
              axisLabel: { fontSize: 12 } },
            yAxis: { type: 'category', data: days, splitArea: { show: true },
              axisLabel: { fontSize: 12 } },
            // 修改点：配色从单色渐变升级为冷暖渐变，高值→暖色更直观
            visualMap: { min: 0, max: data.maxVal || 100, calculable: true, orient: 'horizontal',
              left: 'center', bottom: 8,
              inRange: { color: ['#f6f8fc', '#a0cfff', '#409eff', '#2b6cb0', '#1a365d'] },
              text: ['高', '低'], textStyle: { fontSize: 11, color: '#606266' } },
            series: [{ type: 'heatmap', data: heatData, label: { show: true, fontSize: 12 },
              emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } } }]
          }, true)
        },
        reset() {
          this.dateRange = []
          this.tableData = []
          if (this.barChart) this.barChart.clear()
          if (this.pieChart) this.pieChart.clear()
          if (this.heatmapChart) this.heatmapChart.clear()
        },
        calcPercent(count) {
          if (!this.totalCount) return '0.0'
          return (count / this.totalCount * 100).toFixed(1)
        },
        formatMoney(val) {
          return Number(val || 0).toFixed(2)
        },
        // 修改点：新增导出功能
        handleExport() {
          if (!this.dateRange || this.dateRange.length < 2) {
            this.$message.warning('请先选择日期范围')
            return
          }
          reportExport({ startDate: this.dateRange[0], endDate: this.dateRange[1] })
            .then(blob => {
              if (blob && blob.type && blob.type.indexOf('json') > -1) {
                this.$message.error('导出失败')
                return
              }
              const link = document.createElement('a')
              link.href = URL.createObjectURL(blob)
              link.download = '时段分析_' + this.dateRange[0] + '_' + this.dateRange[1] + '.csv'
              link.click()
              URL.revokeObjectURL(link.href)
              this.$message.success('导出成功')
            })
            .catch(err => this.$message.error('导出失败：' + err))
        },
        renderCharts() {
          this.renderBar()
          this.renderPie()
        },
        renderBar() {
          if (!this.barChart) return
          const COLORS = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de']
          const names   = this.tableData.map(r => r.name)
          const counts  = this.tableData.map(r => r.count)
          const amounts = this.tableData.map(r => Number(r.amount || 0).toFixed(2))
          // 修改点：根据时段数量动态调整柱宽
          const barW = names.length <= 3 ? 40 : names.length <= 5 ? 30 : 22
          if (!names.length) {
            this.barChart.setOption({
              title: { text: '暂无时段数据', left: 'center', top: 'center',
                textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true)
            return
          }
          this.barChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
              formatter(params) {
                let html = '<b>' + params[0].axisValue + '</b><br/>'
                params.forEach(p => {
                  const v = p.seriesName === '营业额' ? '¥' + p.value : p.value + ' 单'
                  html += p.marker + ' ' + p.seriesName + '：<b>' + v + '</b><br/>'
                })
                return html
              }
            },
            legend: { data: ['订单数', '营业额'], bottom: 4 },
            grid: { left: 50, right: 60, top: 20, bottom: 48 },
            xAxis: { type: 'category', data: names, axisTick: { show: false },
              axisLabel: { color: '#606266', interval: 0 } },
            yAxis: [
              { type: 'value', name: '订单数', splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } } },
              { type: 'value', name: '营业额', axisLabel: { formatter: '¥{value}' }, splitLine: { show: false } }
            ],
            series: [
              { name: '订单数', type: 'bar', data: counts, barWidth: barW,
                itemStyle: { borderRadius: [6, 6, 0, 0],
                  color(p) { return COLORS[p.dataIndex % COLORS.length] } },
                label: { show: true, position: 'top', fontSize: 12 }
              },
              { name: '营业额', type: 'line', yAxisIndex: 1, data: amounts,
                smooth: true, symbol: 'emptyCircle', symbolSize: 8,
                lineStyle: { color: '#fac858', width: 2.5 },
                itemStyle: { color: '#fac858', borderColor: '#fff', borderWidth: 2 }
              }
            ]
          }, true)
        },
        renderPie() {
          if (!this.pieChart) return
          const COLORS = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de']
          const pieData = this.tableData.map((r, i) => ({
            name: r.name,
            value: r.count,
            itemStyle: { color: COLORS[i % COLORS.length] }
          }))
          const isEmpty = pieData.every(d => !d.value)
          this.pieChart.setOption({
            tooltip: { trigger: 'item',
              formatter: p => `<b>${p.name}</b><br/>${p.marker} 订单：<b>${p.value} 单</b>（${p.percent}%）` },
            legend: { bottom: 0, left: 'center', itemWidth: 10, itemHeight: 10,
              textStyle: { color: '#606266', fontSize: 12 } },
            series: [{
              type: 'pie',
              // 修改点：center top 从 46% 提至 44%，避免底部 legend 遮挡标签
              radius: isEmpty ? ['0%','55%'] : ['45%','68%'],
              center: ['50%', '44%'],
              avoidLabelOverlap: false,
              itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
              label: { show: !isEmpty, position: 'outside',
                formatter: '{b}\n{d}%', fontSize: 13, lineHeight: 18 },
              labelLine: { show: !isEmpty },
              emphasis: { scaleSize: 10, label: { fontSize: 15, fontWeight: 'bold' } },
              data: isEmpty ? [{ name: '暂无数据', value: 1, itemStyle: { color: '#e4e7ed' } }] : pieData
            }]
          }, true)
        }
      }
    })
  </script>
</body>
</html>
