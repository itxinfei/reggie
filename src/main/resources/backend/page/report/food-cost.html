<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食材成本报表 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      background: var(--el-bg-subtle);
    }
    .container {
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .tableBar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }
    .tableBar .toolbar-label {
      font-size:var(--font-size-base);
      color: var(--el-text-regular);
      font-weight: 500;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: var(--bg-surface);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }
    .chart-title {
      font-size:var(--font-size-lg);
      font-weight: 600;
      color: var(--el-text-primary);
      margin-bottom: 16px;
    }
    .chart-container {
      height: 300px;
    }
    .table-card {
      background: var(--bg-surface);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#app" class="skip-link">跳转到主内容</a>
 <div id="app" class="container" role="main" aria-label="页面主要内容">
    <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title" id="page-title">食材成本报表</h1>
        <p class="ds-page-header__subtitle">核算食材成本与损耗</p>
      </div>
      <div class="ds-page-header__actions"></div>
    </header>
    <!-- 工具栏 -->
    <div class="tableBar">
      <span class="toolbar-label">日期范围：</span>
      <el-date-picker
        v-model="dateRange"
        type="daterange"
        range-separator="至"
        start-placeholder="开始日期"
        end-placeholder="结束日期"
        value-format="yyyy-MM-dd"
        style="width: 300px;">
      </el-date-picker>
      <el-button type="primary" icon="el-icon-search" aria-label="搜索" @click="fetchData">查询</el-button>
      <el-button icon="el-icon-refresh" aria-label="重置" @click="resetQuery">重置</el-button>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
      <div class="stats-card">
        <div class="stats-card-icon" style="background: var(--el-color-primary-lighter);">
          <i class="el-icon-money" style="color: var(--el-color-primary);"></i>
        </div>
        <div class="stats-card-content">
          <div class="stats-card-value">¥{{ formatMoney(report.totalMaterialCost) }}</div>
          <div class="stats-card-label">食材总成本</div>
        </div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon" style="background: var(--el-color-success-lighter);">
          <i class="el-icon-wallet" style="color: var(--el-color-success);"></i>
        </div>
        <div class="stats-card-content">
          <div class="stats-card-value">¥{{ formatMoney(report.totalRevenue) }}</div>
          <div class="stats-card-label">总营业额</div>
        </div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon" style="background: var(--el-color-warning-lighter);">
          <i class="el-icon-data-analysis" style="color: var(--el-color-warning);"></i>
        </div>
        <div class="stats-card-content">
          <div class="stats-card-value">{{ report.foodCostRate }}%</div>
          <div class="stats-card-label">食材成本率</div>
        </div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon" style="background: var(--el-color-info-lighter);">
          <i class="el-icon-trend-charts" style="color: var(--el-color-info);"></i>
        </div>
        <div class="stats-card-content">
          <div class="stats-card-value">¥{{ formatMoney(report.totalRevenue - report.totalMaterialCost) }}</div>
          <div class="stats-card-label">毛利润</div>
        </div>
      </div>
    </div>

    <!-- 图表行 -->
    <div class="chart-row">
      <!-- 成本趋势图 -->
      <div class="chart-card">
        <div class="chart-title">食材成本趋势</div>
        <div id="trendChart" class="chart-container"></div>
      </div>
      <!-- 成本率趋势图 -->
      <div class="chart-card">
        <div class="chart-title">食材成本率趋势</div>
        <div id="rateChart" class="chart-container"></div>
      </div>
    </div>

    <!-- 排行表格 -->
    <div class="table-card">
      <div class="chart-title">菜品食材成本排行</div>
      <el-table aria-label="数据表格" :data="rankingData" border stripe style="width: 100%" v-loading="loading">
        <el-table-column type="index" label="排名" width="80" align="center"></el-table-column>
        <el-table-column prop="dishName" label="菜品名称" min-width="150" align="center"></el-table-column>
        <el-table-column prop="materialCost" label="食材成本" width="120" align="right">
          <template slot-scope="scope">
            ¥{{ formatMoney(scope.row.materialCost) }}
          </template>
        </el-table-column>
        <el-table-column prop="totalCost" label="总成本" width="120" align="right">
          <template slot-scope="scope">
            ¥{{ formatMoney(scope.row.totalCost) }}
          </template>
        </el-table-column>
        <el-table-column prop="salePrice" label="售价" width="120" align="right">
          <template slot-scope="scope">
            ¥{{ formatMoney(scope.row.salePrice) }}
          </template>
        </el-table-column>
        <el-table-column prop="profitRate" label="毛利率" width="100" align="center">
          <template slot-scope="scope">
            <span :style="{ color: scope.row.profitRate >= 30 ? 'var(--el-color-success)' : scope.row.profitRate >= 10 ? 'var(--el-color-warning)' : 'var(--el-color-danger)' }">
              {{ scope.row.profitRate }}%
            </span>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../api/report-enhanced.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          loading: false,
          dateRange: [],
          report: {
            totalMaterialCost: 0,
            totalRevenue: 0,
            foodCostRate: 0
          },
          trendData: {
            dates: [],
            costs: [],
            revenues: [],
            rates: []
          },
          rankingData: [],
          trendChart: null,
          rateChart: null
        }
      },
      created() {
        // Default to last 7 days
        const end = new Date()
        const start = new Date()
        start.setTime(start.getTime() - 7 * 24 * 3600 * 1000)
        this.dateRange = [
          this.formatDate(start),
          this.formatDate(end)
        ]
      },
      mounted() {
        this.initCharts()
        this.fetchData()
      },
      methods: {
        formatDate(date) {
          const year = date.getFullYear()
          const month = String(date.getMonth() + 1).padStart(2, '0')
          const day = String(date.getDate()).padStart(2, '0')
          return `${year}-${month}-${day}`
        },
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        initCharts() {
          this.trendChart = echarts.init(document.getElementById('trendChart'))
          this.rateChart = echarts.init(document.getElementById('rateChart'))
          
          window.addEventListener('resize', () => {
            this.trendChart && this.trendChart.resize()
            this.rateChart && this.rateChart.resize()
          })
        },
        async fetchData() {
          if (!this.dateRange || this.dateRange.length !== 2) {
            ReggieUI.warning('请选择日期范围')
            return
          }
          
          this.loading = true
          const startDate = this.dateRange[0]
          const endDate = this.dateRange[1]
          
          try {
            const [reportRes, trendRes, rankingRes] = await Promise.all([
              getFoodCostReport({ startDate, endDate }),
              getFoodCostTrend({ startDate, endDate }),
              getFoodCostRanking({ startDate, endDate, limit: 10 })
            ])
            
            if (reportRes.code === 1) {
              this.report = reportRes.data
            }
            
            if (trendRes.code === 1) {
              this.trendData = trendRes.data
              this.updateTrendChart()
              this.updateRateChart()
            }
            
            if (rankingRes.code === 1) {
              this.rankingData = rankingRes.data || []
            }
          } catch (err) {
            console.error('Failed to fetch data', err)
            ReggieUI.error('获取数据失败')
          } finally {
            this.loading = false
          }
        },
        updateTrendChart() {
          const option = {
            tooltip: {
              trigger: 'axis'
            },
            legend: {
              data: ['食材成本', '营业额']
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              boundaryGap: false,
              data: this.trendData.dates
            },
            yAxis: {
              type: 'value',
              axisLabel: {
                formatter: '¥{value}'
              }
            },
            series: [
              {
                name: '食材成本',
                type: 'line',
                data: this.trendData.costs,
                itemStyle: { color: RgPalette.warning },
                areaStyle: { opacity: 0.3 }
              },
              {
                name: '营业额',
                type: 'line',
                data: this.trendData.revenues,
                itemStyle: { color: RgPalette.success },
                areaStyle: { opacity: 0.3 }
              }
            ]
          }
          this.trendChart.setOption(option)
        },
        updateRateChart() {
          const option = {
            tooltip: {
              trigger: 'axis',
              formatter: '{b}: {c}%'
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              data: this.trendData.dates
            },
            yAxis: {
              type: 'value',
              axisLabel: {
                formatter: '{value}%'
              }
            },
            series: [
              {
                name: '成本率',
                type: 'line',
                data: this.trendData.rates,
                itemStyle: { color: RgPalette.danger },
                areaStyle: { opacity: 0.3 },
                markLine: {
                  data: [
                    { type: 'average', name: '平均值' }
                  ]
                }
              }
            ]
          }
          this.rateChart.setOption(option)
        },
        resetQuery() {
          const end = new Date()
          const start = new Date()
          start.setTime(start.getTime() - 7 * 24 * 3600 * 1000)
          this.dateRange = [
            this.formatDate(start),
            this.formatDate(end)
          ]
          this.fetchData()
        }
      }
    })
  </script>
</body>
</html>
