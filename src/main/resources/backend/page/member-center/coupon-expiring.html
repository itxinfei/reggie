<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鍒版湡棰勮 - 鐟炲悏澶栧崠绠＄悊绔?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    .warn-container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-5) }

    /* 绛涢€夋爮 */
    .filter-bar { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap }
    .filter-bar__label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .filter-bar__col { display: flex; flex-direction: column; gap: 4px }
    .filter-bar__input { height: 36px }
    .filter-bar__btn { height: 36px; font-size: var(--font-size-base) }

    /* 缁熻鍗＄墖琛?*/
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-6) }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 520px) { .stats-grid { grid-template-columns: 1fr } }
    .stat-card { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: var(--space-4) }
    .stat-card__icon { font-size: var(--font-size-3xl); line-height: 1 }
    .stat-card__body { flex: 1 }
    .stat-card__label { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 4px }
    .stat-card__value { font-size: var(--font-size-3xl); font-weight: 600; color: var(--text-primary); line-height: 1.2 }
    .stat-card__sub { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 2px }
    .stat-card.danger .stat-card__value { color: var(--color-danger) }
    .stat-card.warning .stat-card__value { color: var(--color-warning) }
    .stat-card.brand .stat-card__value { color: var(--color-brand-500) }

    /* 鎵归噺寤舵湡鎸夐挳琛?*/
    .batch-bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap }
    .batch-bar__tip { font-size: var(--font-size-xs); color: var(--text-muted) }

    /* 绌烘€?*/
    .empty-state { text-align: center; padding: 60px var(--space-4); color: var(--text-muted); font-size: var(--font-size-base) }
    .empty-state__icon { font-size: var(--font-size-4xl); line-height: 1; margin-bottom: var(--space-4) }
    .empty-state__desc { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-2) }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>
  <div class="dashboard-container" id="expiring-app">
    <div class="container warn-container" id="main-content" role="main" aria-label="浼樻儬鍒稿埌鏈熼璀?>
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">鍒版湡棰勮</h1>
          <p class="ds-page-header__subtitle">鏌ョ湅鍗冲皢鍒版湡/宸茶繃鏈熺殑浼樻儬鍒革紝鎵归噺骞查鎸藉洖钀ラ攢鎶曞叆</p>
        </div>
      </header>

      <!-- 绛涢€夋爮 -->
      <div class="filter-bar">
        <div class="filter-bar__col">
          <span class="filter-bar__label">棰勮澶╂暟锛?/span>
          <el-select v-model="days" class="filter-bar__input" style="width:120px" @change="onFilterChange" aria-label="棰勮澶╂暟">
            <el-option :value="1" label="1澶?>1澶╁唴鍒版湡</el-option>
            <el-option :value="3" label="3澶?>3澶╁唴鍒版湡</el-option>
            <el-option :value="7" label="7澶?>7澶╁唴鍒版湡</el-option>
            <el-option :value="14" label="14澶?>14澶╁唴鍒版湡</el-option>
          </el-select>
        </div>
        <div class="filter-bar__col">
          <span class="filter-bar__label">浼樻儬鍒告ā鏉匡細</span>
          <el-select v-model="templateId" class="filter-bar__input" style="width:260px" filterable clearable @change="onFilterChange" aria-label="浼樻儬鍒告ā鏉?>
            <el-option
              v-for="t in templateOptions"
              :key="t.value"
              :label="t.label"
              :value="t.value"
              :disabled="t.status !== 1"
            >
              <span>{{ t.label }}</span>
            </el-option>
          </el-select>
        </div>
        <div class="filter-bar__col">
          <span class="filter-bar__label">浼氬憳鎵嬫満锛?/span>
          <el-input v-model="phone" class="filter-bar__input" placeholder="鎵嬫満鍙锋ā绯婃煡璇? style="width:200px" @keyup.enter.native="onFilterChange" clearable aria-label="浼氬憳鎵嬫満"></el-input>
        </div>
        <el-button type="primary" size="small" @click="onFilterChange" class="filter-bar__btn">鏌ヨ</el-button>
        <el-button size="small" @click="refreshAll">鍒锋柊鍏ㄩ儴</el-button>
      </div>

      <!-- 缁熻鍗＄墖 -->
      <div class="stats-grid" v-loading="statsLoading">
        <div class="stat-card warning">
          <div class="stat-card__icon">鈴?/div>
          <div class="stat-card__body">
            <div class="stat-card__label">{{ days }}澶╁唴鍒版湡</div>
            <div class="stat-card__value">{{ statsData.totalExpiringCount }}</div>
            <div class="stat-card__sub">浼樻儬鎬婚 楼{{ statsData.totalExpiringAmount | toDecimal }}</div>
          </div>
        </div>
        <div class="stat-card danger">
          <div class="stat-card__icon">鉂?/div>
          <div class="stat-card__body">
            <div class="stat-card__label">宸茶繃鏈?/div>
            <div class="stat-card__value">{{ statsData.totalExpiredCount }}</div>
            <div class="stat-card__sub">浼樻儬鎬婚 楼{{ statsData.totalExpiredAmount | toDecimal }}</div>
          </div>
        </div>
        <div class="stat-card brand">
          <div class="stat-card__icon">馃摝</div>
          <div class="stat-card__body">
            <div class="stat-card__label">娑夊強妯℃澘鏁?/div>
            <div class="stat-card__value">{{ statsData.byTemplate ? statsData.byTemplate.length : 0 }}</div>
            <div class="stat-card__sub">鏈夐璀︾殑浼樻儬鍒告ā鏉?/div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card__icon">馃搵</div>
          <div class="stat-card__body">
            <div class="stat-card__label">褰撳墠Tab</div>
            <div class="stat-card__value" style="font-size: var(--font-size-lg)">{{ activeTab === 'expiring' ? '鍗冲皢鍒版湡' : '宸茶繃鏈? }}</div>
            <div class="stat-card__sub">{{ activeTab === 'expiring' ? '鍙壒閲忓欢鏈? : '浠呭彲鏌ヨ' }}</div>
          </div>
        </div>
      </div>

      <!-- Tab鍒囨崲 -->
      <el-tabs v-model="activeTab" @tab-click="onTabClick">
        <el-tab-pane label="鍗冲皢鍒版湡" name="expiring"></el-tab-pane>
        <el-tab-pane label="宸茶繃鏈? name="expired"></el-tab-pane>
      </el-tabs>

      <!-- 鍗冲皢鍒版湡锛氭壒閲忓欢鏈熸寜閽?-->
      <div class="batch-bar" v-if="activeTab === 'expiring'">
        <el-button
          type="primary"
          size="small"
          :disabled="selectedRows.length === 0"
          @click="openExtendDialog"
        >鎵归噺寤舵湡</el-button>
        <span class="batch-bar__tip" v-if="selectedRows.length > 0">宸查€?{{ selectedRows.length }} 鏉★紝鍙竴閿欢闀胯繃鏈熸椂闂?/span>
        <span class="batch-bar__tip" v-else>鍕鹃€夊嵆灏嗗埌鏈熺殑浼樻儬鍒革紝鍙壒閲忓欢闀胯繃鏈熸椂闂?/span>
      </div>

      <!-- 鏄庣粏琛ㄦ牸 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="tableLoading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :selection="activeTab === 'expiring'"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        @selection-change="onSelectionChange"
      >
        <template #col-couponType="{ row }">
          <el-tag :type="row.couponType === 'FULL_REDUCTION' ? 'success' : row.couponType === 'DISCOUNT' ? 'warning' : 'info'" size="small">
            {{ row.couponType === 'FULL_REDUCTION' ? '婊″噺' : row.couponType === 'DISCOUNT' ? '鎶樻墸' : '鏂板' }}
          </el-tag>
        </template>
        <template #col-expireTime="{ row }">
          <span>{{ row.expireTime || '-' }}</span>
        </template>
      </crud-table>

      <div v-if="counts === 0 && !tableLoading" class="empty-state">
        <div class="empty-state__icon">馃帀</div>
        <div>{{ activeTab === 'expiring' ? '鏆傛棤鍗冲皢鍒版湡鐨勪紭鎯犲埜' : '鏆傛棤宸茶繃鏈熺殑浼樻儬鍒? }}</div>
        <div class="empty-state__desc">鍙皟鏁撮璀﹀ぉ鏁版垨娓呴櫎绛涢€夋潯浠跺悗閲嶆柊鏌ヨ</div>
      </div>
    </div>

    <!-- 鎵归噺寤舵湡寮圭獥 -->
    <crud-dialog
      :title="extendForm.title"
      :visible.sync="extendForm.dialogVisible"
      :submit-loading="extendLoading"
      width="380px"
      @submit="submitExtend"
      @close="handleExtendClose"
    >
      <el-form :model="extendForm" :rules="extendRules" ref="extendFormRef" label-width="100px">
        <el-form-item label="宸查€夋暟閲? prop="selectedCount">
          <el-input-number v-model="extendForm.selectedCount" :min="0" :max="9999" disabled></el-input-number>
          <span style="margin-left:8px; font-size: var(--font-size-xs); color:var(--text-muted)">鏉′紭鎯犲埜</span>
        </el-form-item>
        <el-form-item label="寤堕暱澶╂暟" prop="extendDays">
          <el-input-number v-model="extendForm.extendDays" :min="1" :max="365" style="width:200px"></el-input-number>
          <span style="margin-left:8px; font-size: var(--font-size-xs); color:var(--text-muted)">澶?/span>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/member-center.js"></script>
  <script>
    new Vue({
      el: '#expiring-app',
      data() {
        return {
          days: 7,
          templateId: null,
          phone: null,
          templateOptions: [],
          activeTab: 'expiring',
          // 缁熻
          statsLoading: false,
          statsData: {
            totalExpiringCount: 0,
            totalExpiredCount: 0,
            totalExpiringAmount: 0,
            totalExpiredAmount: 0,
            byTemplate: []
          },
          // 琛ㄦ牸
          tableLoading: false,
          page: 1,
          pageSize: 10,
          counts: 0,
          tableData: [],
          selectedRows: [],
          columns: [
            { prop: 'templateName', label: '浼樻儬鍒告ā鏉?, width: 180 },
            { prop: 'couponType', label: '绫诲瀷', slot: true, width: 90, align: 'center' },
            { prop: 'memberName', label: '浼氬憳濮撳悕', width: 100 },
            { prop: 'memberPhone', label: '浼氬憳鎵嬫満', width: 130 },
            { prop: 'couponCode', label: '浼樻儬鍒哥爜', width: 140 },
            { prop: 'discountAmount', label: '浼樻儬閲戦', width: 110, align: 'right',
              formatter: function(row) {
                if (row.couponType === 'DISCOUNT') {
                  return row.discountRate ? (Number(row.discountRate) * 10).toFixed(1) + '鎶? : '-'
                }
                if (row.discountAmount != null) return '楼' + Number(row.discountAmount).toFixed(2)
                return '-'
              } },
            { prop: 'createdTime', label: '棰嗗彇鏃堕棿', width: 160, align: 'center' },
            { prop: 'expireTime', label: '杩囨湡鏃堕棿', slot: true, width: 160, align: 'center' }
          ],
          // 寤舵湡寮圭獥
          extendLoading: false,
          extendForm: {
            title: '鎵归噺寤舵湡浼樻儬鍒?,
            dialogVisible: false,
            selectedCount: 0,
            extendDays: 7
          },
          extendRules: {
            extendDays: [{ required: true, message: '璇烽€夋嫨寤堕暱澶╂暟', trigger: 'change' }]
          }
        }
      },
      created() {
        this.loadTemplates()
        this.loadStats()
        this.loadTable()
      },
      filters: {
        toDecimal(val) {
          if (val == null) return '0.00'
          return Number(val).toFixed(2)
        }
      },
      methods: {
        onFilterChange() {
          this.page = 1
          this.loadStats()
          this.loadTable()
        },
        refreshAll() {
          this.loadTemplates()
          this.loadStats()
          this.loadTable()
        },
        onTabClick() {
          this.page = 1
          this.tableData = []
          this.counts = 0
          this.selectedRows = []
          this.loadTable()
        },
        onPageChange(payload) {
          this.page = payload.page
          this.loadTable()
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.loadTable()
        },
        onSelectionChange(payload) {
          this.selectedRows = (payload && payload.rows) || payload || []
        },
        async loadTemplates() {
          try {
            const res = await couponTemplateList()
            if (String(res.code) === '1') {
              const records = res.data.records || []
              this.templateOptions = records.map(function(t) {
                return {
                  value: t.id,
                  label: t.name,
                  status: t.status
                }
              })
            }
          } catch (e) {
            console.warn('鍔犺浇妯℃澘鍒楄〃澶辫触:', e)
          }
        },
        async loadStats() {
          this.statsLoading = true
          try {
            const res = await couponExpiringStats(this.days)
            if (String(res.code) === '1' && res.data) {
              const d = res.data
              this.statsData = {
                totalExpiringCount: d.totalExpiringCount || 0,
                totalExpiredCount: d.totalExpiredCount || 0,
                totalExpiringAmount: d.totalExpiringAmount || 0,
                totalExpiredAmount: d.totalExpiredAmount || 0,
                byTemplate: d.byTemplate || []
              }
            }
          } catch (e) {
            console.warn('鍔犺浇棰勮缁熻澶辫触:', e)
          } finally {
            this.statsLoading = false
          }
        },
        async loadTable() {
          this.tableLoading = true
          try {
            var params
            if (this.activeTab === 'expiring') {
              params = {
                days: this.days,
                page: this.page,
                pageSize: this.pageSize
              }
              if (this.templateId) params.templateId = this.templateId
              if (this.phone) params.phone = this.phone
              const res = await couponExpiring(params)
            } else {
              params = {
                page: this.page,
                pageSize: this.pageSize
              }
              if (this.templateId) params.templateId = this.templateId
              if (this.phone) params.phone = this.phone
              const res = await couponExpired(params)
            }
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total || 0
            } else {
              this.tableData = []
              this.counts = 0
              this.$message.error(res.msg || '鍔犺浇澶辫触')
            }
          } catch (e) {
            console.warn('鍔犺浇鏄庣粏澶辫触:', e)
            this.tableData = []
            this.counts = 0
          } finally {
            this.tableLoading = false
          }
        },
        openExtendDialog() {
          this.extendForm.selectedCount = this.selectedRows.length
          this.extendForm.extendDays = 7
          this.extendForm.dialogVisible = true
        },
        async submitExtend() {
          if (this.selectedRows.length === 0) {
            this.$message.warning('鏈嬀閫変换浣曚紭鎯犲埜')
            return
          }
          const self = this
          this.$refs.extendFormRef.validate(function(valid) {
            if (!valid) return
            self.doExtend()
          })
        },
        async doExtend() {
          const ids = []
          for (let i = 0; i < this.selectedRows.length; i++) {
            ids.push(this.selectedRows[i].couponUserId)
          }
          this.extendLoading = true
          try {
            const res = await couponBatchExtend({$3})
            if (String(res.code) === '1') {
              const d = res.data
              this.$message.success('寤舵湡鎴愬姛锛? + d.successCount + '鏉′紭鎯犲埜寤堕暱' + this.extendForm.extendDays + '澶?)
              this.extendForm.dialogVisible = false
              this.loadTable()
              this.loadStats()
            } else {
              this.$message.error(res.msg || '寤舵湡澶辫触')
            }
          } catch (e) {
            console.warn('鎵归噺寤舵湡澶辫触:', e)
            this.$message.error('鎿嶄綔澶辫触锛岃閲嶈瘯')
          } finally {
            this.extendLoading = false
          }
        },
        handleExtendClose() {
          this.extendForm.selectedCount = 0
          this.extendForm.extendDays = 7
        }
      }
    })
  </script>
</body>
</html>
