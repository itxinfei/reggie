<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瀹氬悜鍙戝埜 - 鐟炲悏澶栧崠绠＄悊绔?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    /* 椤靛唴甯冨眬鈥斺€斿叏閮ㄥ紩鐢?tokens.css 璁捐浠ょ墝 */
    .issue-container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-5) }
    .issue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); margin-top: var(--space-6) }
    @media (max-width: 1200px) { .issue-grid { grid-template-columns: 1fr } }

    .issue-card { padding: var(--space-4); border-radius: var(--radius-md); background: var(--bg-surface); box-shadow: var(--shadow-sm) }
    .issue-card__title { font-size: var(--font-size-lg); font-weight: 500; color: var(--text-primary); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2) }

    .mode-tabs { display: flex; gap: 0; border: 1px solid var(--border-default); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: var(--space-4) }
    .mode-tab { flex: 1; padding: 10px 16px; text-align: center; font-size: var(--font-size-base); color: var(--text-secondary); border: none; background: var(--bg-surface); cursor: pointer; transition: all var(--transition-base); border-right: 1px solid var(--border-default) }
    .mode-tab:last-child { border-right: none }
    .mode-tab.active { background: var(--color-brand-500); color: var(--text-primary); font-weight: 500 }
    .mode-tab:hover:not(.active) { background: var(--color-brand-100) }

    .template-row { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-4); padding: var(--space-4); background: var(--el-bg-base); border-radius: var(--radius-sm); border: 1px solid var(--border-default) }
    .template-row__label { font-size: var(--font-size-base); color: var(--text-secondary); white-space: nowrap }
    .template-select { flex: 1 }
    .template-info { font-size: var(--font-size-xs); color: var(--text-muted); margin-left: var(--space-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px }

    .ids-input { width: 100%; min-height: 100px; margin-bottom: var(--space-2) }
    .ids-tip { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: var(--space-4) }
    .ids-preview { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4) }
    .ids-count { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500 }
    .ids-count .num { color: var(--color-brand-500); font-size: var(--font-size-xl); font-weight: 600 }
    .ids-tag { color: var(--text-muted); font-size: var(--font-size-xs) }

    .condition-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4) }
    @media (max-width: 768px) { .condition-row { grid-template-columns: 1fr } }

    .btn-issue { width: 100%; margin-top: var(--space-4); font-size: var(--font-size-base); height: 40px }

    .result-panel { margin-top: var(--space-6); padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border-left: 4px solid var(--color-brand-500) }
    .result-panel__title { font-size: var(--font-size-lg); font-weight: 500; color: var(--text-primary); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2) }
    .result-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4) }
    @media (max-width: 768px) { .result-stats { grid-template-columns: repeat(2, 1fr) } }
    .result-stat { text-align: center; padding: var(--space-4); background: var(--el-bg-base); border-radius: var(--radius-sm) }
    .result-stat__value { font-size: var(--font-size-3xl); font-weight: 600; color: var(--text-primary); line-height: 1.2 }
    .result-stat__label { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-2) }
    .result-stat.success .result-stat__value { color: var(--color-success) }
    .result-stat.danger .result-stat__value { color: var(--color-danger) }
    .result-stat.warning .result-stat__value { color: var(--color-warning) }
    .result-stat.primary .result-stat__value { color: var(--color-brand-500) }
    .result-time { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-3); text-align: center }

    .history-panel { margin-top: var(--space-6) }
    .history-panel__title { font-size: var(--font-size-lg); font-weight: 500; color: var(--text-primary); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2) }
    .empty-history { text-align: center; padding: var(--space-6) var(--space-4); color: var(--text-muted); font-size: var(--font-size-base) }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px var(--space-4); border-bottom: 1px solid var(--border-default); font-size: var(--font-size-base) }
    .history-item:last-child { border-bottom: none }
    .history-item__info { display: flex; flex-direction: column; gap: var(--space-2) }
    .history-item__info-1 { color: var(--text-primary) }
    .history-item__info-2 { font-size: var(--font-size-xs); color: var(--text-muted) }
    .history-item__stats { display: flex; align-items: center; gap: var(--space-3) }
    .history-mode-badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 500 }
    .history-mode-badge.mode-a { background: var(--color-success-light); color: var(--color-success) }
    .history-mode-badge.mode-b { background: var(--color-warning-light); color: var(--color-warning-dark) }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>
  <div class="dashboard-container" id="issue-app">
    <div class="container issue-container" id="main-content" role="main" aria-label="椤甸潰涓昏鍐呭">
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">瀹氬悜鍙戝埜</h1>
          <p class="ds-page-header__subtitle">閫夋嫨浼樻儬鍒告ā鏉垮悗锛屾寜浼氬憳鍒楄〃鎴栨潯浠剁簿鍑嗗彂鏀?/p>
        </div>
      </header>

      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
      ></stat-cards>

      <div class="issue-grid">
        <!-- 宸﹀崱锛氶€夋嫨妯℃澘 + 涓ょ鍙戝埜妯″紡 -->
        <div class="issue-card">
          <div class="issue-card__title">馃幆 瀹氬悜鍙戞斁</div>

          <div class="template-row">
            <div class="template-row__label">浼樻儬鍒告ā鏉匡細</div>
            <div class="template-select">
              <el-select v-model="form.templateId" filterable placeholder="璇烽€夋嫨浼樻儬鍒告ā鏉? style="width: 293px" @change="onTemplateChange">
                <el-option v-for="t in templateList" :key="t.id" :label="t.name + ' (浣? + t.remainCount + '寮?'" :value="t.id" :disabled="t.remainCount <= 0"></el-option>
              </el-select>
            </div>
            <div class="template-info" v-if="currentTemplate">
              鍓╀綑 <span style="color: var(--color-brand-500); font-weight: 500">{{ currentTemplate.remainCount }}</span> 寮?            </div>
          </div>

          <div class="mode-tabs">
            <button class="mode-tab" :class="{ active: form.mode === 'members' }" @click="switchMode('members')">
              馃搵 鎸変細鍛業D
            </button>
            <button class="mode-tab" :class="{ active: form.mode === 'condition' }" @click="switchMode('condition')">
              馃帥锔?鎸夋潯浠剁瓫閫?            </button>
          </div>

          <!-- 妯″紡鈶狅細鎸変細鍛業D鍒楄〃 -->
          <div v-show="form.mode === 'members'">
            <el-input
              v-model="form.memberIdsText"
              type="textarea"
              class="ids-input"
              placeholder="璇疯緭鍏ヤ細鍛業D锛屽涓狪D浠ラ€楀彿銆佺┖鏍兼垨鎹㈣鍒嗛殧&#10;渚嬪锛?, 2, 3"
              :rows="4"
              @input="onIdsTextChange"
            ></el-input>
            <div class="ids-tip">鏀寔閫楀彿銆佺┖鏍笺€佹崲琛屽垎闅旓紱鑷姩鍘婚噸</div>
            <div class="ids-preview">
              <span class="ids-count">瑙ｆ瀽鍒?<span class="num">{{ parsedMemberIds.length }}</span> 涓細鍛業D</span>
              <span class="ids-tag" v-if="parsedMemberIds.length > 0">(宸插幓閲?</span>
            </div>
          </div>

          <!-- 妯″紡鈶★細鎸夋潯浠剁瓫閫?-->
          <div v-show="form.mode === 'condition'">
            <el-form :model="form.condition" label-width="100px" size="small">
              <div class="condition-row">
                <el-form-item label="浼氬憳绛夌骇锛?>
                  <el-select v-model="form.condition.levelId" placeholder="涓嶉檺" clearable style="width: 100%">
                    <el-option v-for="lv in levelList" :key="lv.id" :label="lv.name" :value="lv.id"></el-option>
                  </el-select>
                </el-form-item>
                <el-form-item label="鏂颁細鍛?澶?锛?>
                  <el-input-number v-model="form.condition.newMemberDays" :min="1" :max="365" placeholder="濡?0" controls-position="right" style="width: 100%"></el-input-number>
                </el-form-item>
              </div>
              <div class="condition-row">
                <el-form-item label="鏈€灏忕Н鍒嗭細">
                  <el-input-number v-model="form.condition.minPoints" :min="0" controls-position="right" style="width: 100%"></el-input-number>
                </el-form-item>
                <el-form-item label="鏈€澶хН鍒嗭細">
                  <el-input-number v-model="form.condition.maxPoints" :min="0" controls-position="right" style="width: 100%"></el-input-number>
                </el-form-item>
              </div>
              <div class="condition-row">
                <el-form-item label="鏈€灏忔秷璐癸細">
                  <el-input-number v-model="form.condition.minConsumption" :min="0" :precision="2" controls-position="right" style="width: 100%"></el-input-number>
                </el-form-item>
                <el-form-item label="鏈€澶ф秷璐癸細">
                  <el-input-number v-model="form.condition.maxConsumption" :min="0" :precision="2" controls-position="right" style="width: 100%"></el-input-number>
                </el-form-item>
              </div>
            </el-form>
            <div class="ids-tip">鐣欑┖琛ㄧず涓嶉檺锛涙湭璁剧疆浠绘剰鏉′欢鏃堕粯璁ゆ寜绛夌骇绛涢€夊惎鐢ㄤ細鍛?/div>
          </div>

          <el-button
            type="primary"
            class="btn-issue"
            :loading="issuing"
            :disabled="!canIssue"
            @click="doIssue"
          >
            {{ issuing ? '鍙戞斁涓?..' : '馃殌 涓€閿彂鏀? }}
          </el-button>
        </div>

        <!-- 鍙冲崱锛氬巻鍙插彂鏀捐褰?-->
        <div class="issue-card">
          <div class="issue-card__title">馃摐 鍙戞斁鍘嗗彶</div>

          <div v-if="historyList.length === 0" class="empty-history">
            <div style="font-size: var(--font-size-4xl); margin-bottom: var(--space-4); opacity: 0.5">馃摥</div>
            <div>鏆傛棤鍙戞斁璁板綍</div>
            <div style="font-size: var(--font-size-xs); margin-top: var(--space-2)">瀹屾垚涓€娆″畾鍚戝彂鏀惧悗锛岃褰曞皢鍦ㄦ灞曠ず</div>
          </div>

          <div v-else>
            <div v-for="(item, idx) in historyList" :key="idx" class="history-item">
              <div class="history-item__info">
                <div class="history-item__info-1">
                  <span class="history-mode-badge" :class="item.mode === 'members' ? 'mode-a' : 'mode-b'">
                    {{ item.mode === 'members' ? '鎸変細鍛業D' : '鎸夋潯浠? }}
                  </span>
                  <span style="margin-left: var(--space-2)">{{ item.templateName }}</span>
                </div>
                <div class="history-item__info-2">{{ item.time }}</div>
              </div>
              <div class="history-item__stats">
                <el-tag type="success" size="small">鎴愬姛 {{ item.successCount }}</el-tag>
                <el-tag v-if="item.alreadyIssuedCount > 0" type="warning" size="small">宸查杩?{{ item.alreadyIssuedCount }}</el-tag>
                <el-tag v-if="item.failCount > 0" type="danger" size="small">澶辫触 {{ item.failCount }}</el-tag>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 鍙戞斁缁撴灉闈㈡澘 -->
      <div class="result-panel" v-if="lastResult">
        <div class="result-panel__title">馃搳 鏈€杩戜竴娆″彂鏀剧粨鏋?/div>
        <div class="result-stats">
          <div class="result-stat success">
            <div class="result-stat__value">{{ lastResult.successCount }}</div>
            <div class="result-stat__label">鍙戞斁鎴愬姛</div>
          </div>
          <div class="result-stat warning">
            <div class="result-stat__value">{{ lastResult.alreadyIssuedCount }}</div>
            <div class="result-stat__label">宸查杩?/div>
          </div>
          <div class="result-stat danger">
            <div class="result-stat__value">{{ lastResult.failCount }}</div>
            <div class="result-stat__label">鍙戞斁澶辫触</div>
          </div>
          <div class="result-stat primary">
            <div class="result-stat__value">{{ lastResult.total }}</div>
            <div class="result-stat__label">澶勭悊鎬绘暟</div>
          </div>
        </div>
        <div class="result-time">
          妯℃澘锛歿{ lastResult.templateName }} 锝?妯″紡锛歿{ lastResult.mode === 'members' ? '鎸変細鍛業D' : '鎸夋潯浠剁瓫閫? }} 锝?鏃堕棿锛歿{ lastResult.time }}
        </div>
      </div>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/member-center.js"></script>
  <script>
    new Vue({
      el: '#issue-app',
      data: function() {
        return {
          loading: false,
          issuing: false,
          activeFilter: '',

          // 浼樻儬鍒告ā鏉垮垪琛?          templateList: [],
          // 浼氬憳绛夌骇鍒楄〃
          levelList: [],

          // 琛ㄥ崟
          form: {
            mode: 'members',
            templateId: null,
            memberIdsText: '',
            condition: {
              levelId: null,
              newMemberDays: null,
              minPoints: null,
              maxPoints: null,
              minConsumption: null,
              maxConsumption: null
            }
          },

          // 缁熻鏁版嵁
          stats: { totalCoupons: 0, enabledCount: 0, disabledCount: 0, claimedCount: 0, usageRate: '0%' },

          // 鏈€杩戜竴娆″彂鏀剧粨鏋?          lastResult: null,

          // 鍙戞斁鍘嗗彶
          historyList: []
        }
      },
      computed: {
        // 瑙ｆ瀽浼氬憳ID鍒楄〃
        parsedMemberIds: function() {
          var text = this.form.memberIdsText || ''
          if (!text.trim()) return []
          // 鎸夐€楀彿銆佺┖鏍笺€佹崲琛岀瓑鍒嗛殧
          var raw = text.split(/[,\s\n\r]+/).map(function(s) { return s.trim() }).filter(function(s) { return s.length > 0 })
          // 杞暣鏁板苟鍘婚噸
          var set = {}
          for (var i = 0; i < raw.length; i++) {
            var n = parseInt(raw[i], 10)
            if (!isNaN(n) && n > 0) set[n] = true
          }
          var list = []
          for (var k in set) { list.push(parseInt(k, 10)) }
          return list
        },

        // 褰撳墠閫変腑鐨勬ā鏉?        currentTemplate: function() {
          for (var i = 0; i < this.templateList.length; i++) {
            if (this.templateList[i].id === this.form.templateId) return this.templateList[i]
          }
          return null
        },

        // 鑳藉惁鍙戞斁
        canIssue: function() {
          if (!this.form.templateId) return false
          if (this.form.mode === 'members') return this.parsedMemberIds.length > 0
          // 鎸夋潯浠讹細鑷冲皯璁剧疆涓€涓潯浠?          var c = this.form.condition
          return c.levelId != null || c.newMemberDays != null ||
                 c.minPoints != null || c.maxPoints != null ||
                 c.minConsumption != null || c.maxConsumption != null
        },

        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '馃帿', label: '浼樻儬鍒告ā鏉?, value: self.stats.totalCoupons, color: 'primary', clickable: false },
            { key: '', icon: '鉁?, label: '宸插惎鐢?, value: self.stats.enabledCount, color: 'success', clickable: false },
            { key: '', icon: '鈴革笍', label: '宸茬鐢?, value: self.stats.disabledCount, color: 'warning', clickable: false },
            { key: '', icon: '馃摛', label: '宸查瀹?, value: self.stats.exhaustedCount || 0, color: 'danger', clickable: false }
          ]
        }
      },
      created: function() {
        this.loadStats()
        this.loadTemplates()
        this.loadLevels()
      },
      methods: {
        async loadStats() {
          try {
            var res = await couponStats()
            if (String(res.code) === '1') {
              this.stats = res.data || {}
            }
          } catch (e) { console.error(e) }
        },
        async loadTemplates() {
          try {
            var res = await couponTemplateList()
            if (String(res.code) === '1') {
              // 鍙睍绀哄惎鐢ㄧ姸鎬佺殑妯℃澘
              var records = res.data && res.data.records ? res.data.records : []
              this.templateList = []
              for (var i = 0; i < records.length; i++) {
                if (records[i].status === 1) {
                  this.templateList.push(records[i])
                }
              }
            }
          } catch (e) { console.error(e) }
        },
        async loadLevels() {
          try {
            var res = await levelPage({ page: 1, pageSize: 100 })
            if (String(res.code) === '1') {
              var records = res.data && res.data.records ? res.data.records : []
              this.levelList = []
              for (var i = 0; i < records.length; i++) {
                if (records[i].status === 1) {
                  this.levelList.push(records[i])
                }
              }
            }
          } catch (e) { console.error(e) }
        },
        switchMode: function(mode) {
          this.form.mode = mode
          if (mode === 'condition') {
            // 榛樿涓嶉檺鍒讹紝鐢ㄦ埛鑷濉啓
            this.form.condition = { levelId: null, newMemberDays: null, minPoints: null, maxPoints: null, minConsumption: null, maxConsumption: null }
          }
        },
        onTemplateChange: function() {},
        onIdsTextChange: function() {},

        doIssue: function() {
          var self = this
          this.$confirm('纭鍙戞斁浼樻儬鍒稿埌鐩爣浼氬憳锛熷彂鏀惧悗涓嶅彲鎾ら攢銆?, '纭鍙戞斁', {
            confirmButtonText: '纭鍙戞斁',
            cancelButtonText: '鍙栨秷',
            type: 'warning'
          }).then(function() {
            self.issueCoupon()
          }).catch(function() {})
        },

        async issueCoupon() {
          this.issuing = true
          try {
            var res
            if (this.form.mode === 'members') {
              res = await couponBatchIssue({
                templateId: this.form.templateId,
                memberIds: this.parsedMemberIds
              })
            } else {
              var c = {}
              var cond = this.form.condition
              if (cond.levelId != null) c.levelId = cond.levelId
              if (cond.newMemberDays != null) c.newMemberDays = cond.newMemberDays
              if (cond.minPoints != null) c.minPoints = cond.minPoints
              if (cond.maxPoints != null) c.maxPoints = cond.maxPoints
              if (cond.minConsumption != null) c.minConsumption = cond.minConsumption
              if (cond.maxConsumption != null) c.maxConsumption = cond.maxConsumption

              res = await couponIssueByCondition({
                templateId: this.form.templateId,
                condition: c
              })
            }

            if (String(res.code) === '1') {
              var data = res.data || {}
              var name = this.currentTemplate ? this.currentTemplate.name : ''
              var now = new Date()
              var timeStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0')

              this.lastResult = {
                successCount: data.successCount || 0,
                failCount: data.failCount || 0,
                alreadyIssuedCount: data.alreadyIssuedCount || 0,
                total: data.total || 0,
                templateName: name,
                mode: this.form.mode,
                time: timeStr
              }

              // 杩藉姞鍘嗗彶璁板綍
              this.historyList.unshift({
                successCount: data.successCount || 0,
                failCount: data.failCount || 0,
                alreadyIssuedCount: data.alreadyIssuedCount || 0,
                total: data.total || 0,
                templateName: name,
                mode: this.form.mode,
                time: timeStr
              })

              var msg = '鍙戞斁瀹屾垚锛氭垚鍔?' + (data.successCount || 0) + '锛屽凡棰嗚繃 ' + (data.alreadyIssuedCount || 0) + '锛屽け璐?' + (data.failCount || 0)
              this.$message.success(msg)
              this.loadStats()
              this.loadTemplates()
            } else {
              this.$message.error(res.message || '鍙戞斁澶辫触')
            }
          } catch (e) {
            console.error(e)
            this.$message.error('鍙戞斁璇锋眰澶辫触锛? + (e.message || '鏈煡閿欒'))
          } finally {
            this.issuing = false
          }
        }
      }
    })
  </script>
</body>
</html>
