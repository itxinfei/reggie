<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优惠券管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="dashboard-container" id="coupon-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-type="{ row }">
          <el-tag :type="row.type === 'FULL_REDUCTION' ? 'success' : row.type === 'DISCOUNT' ? 'warning' : 'info'" size="small">
            {{ row.type === 'FULL_REDUCTION' ? '满减' : row.type === 'DISCOUNT' ? '折扣' : '新客' }}
          </el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'danger'" size="small">
            {{ row.status === 1 ? '启用' : '禁用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 新增/编辑弹窗 -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="35%"
      @submit="submitForm"
      @close="handleClose"
    >
      <!-- 修改点：补全 ref/:model/:rules 启用 Element 校验（复杂条件校验仍保留在 submitForm） -->
      <el-form ref="couponForm" :model="formData" :rules="couponRules" label-width="80px" size="small">
        <el-form-item label="优惠券名称：" prop="name">
          <el-input v-model="formData.name" placeholder="请输入优惠券名称" maxlength="30"></el-input>
        </el-form-item>
        <el-form-item label="优惠券类型：" prop="type">
          <el-select v-model="formData.type" placeholder="请选择类型" style="width: 100%">
            <el-option label="满减" value="FULL_REDUCTION"></el-option>
            <el-option label="折扣" value="DISCOUNT"></el-option>
            <el-option label="新客" value="NEW_MEMBER"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="条件金额：" prop="conditionAmount">
          <el-input v-model="formData.conditionAmount" type="number" placeholder="请输入条件金额"></el-input>
        </el-form-item>
        <el-form-item label="优惠金额：" prop="discountAmount">
          <el-input v-model="formData.discountAmount" type="number" placeholder="请输入优惠金额"></el-input>
        </el-form-item>
        <el-form-item label="折扣率：" prop="discountRate" v-if="formData.type === 'DISCOUNT'">
          <el-input v-model="formData.discountRate" type="number" placeholder="如0.85表示8.5折"></el-input>
        </el-form-item>
        <el-form-item label="总数量：" prop="totalCount">
          <el-input v-model="formData.totalCount" type="number" placeholder="请输入总数量"></el-input>
        </el-form-item>
        <el-form-item label="有效期(天)：" prop="validDays">
          <el-input v-model="formData.validDays" type="number" placeholder="请输入有效期天数"></el-input>
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/member-center.js"></script>
  <script>
    new Vue({
      el: '#coupon-app',
      data() {
        return {
          loading: false,
          action: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { totalCoupons: 0, enabledCount: 0, disabledCount: 0, claimedCount: 0, usageRate: '0%' },
          activeFilter: '',
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'name', placeholder: '请输入优惠券名称', width: '220px' },
            { type: 'select', field: 'type', placeholder: '请选择优惠券类型', width: '180px',
              options: [
                { label: '满减', value: 'FULL_REDUCTION' },
                { label: '折扣', value: 'DISCOUNT' },
                { label: '新客', value: 'NEW_MEMBER' }
              ] },
            { type: 'select', field: 'status', placeholder: '请选择状态', width: '150px',
              options: [
                { label: '启用', value: '1' },
                { label: '禁用', value: '0' }
              ] }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'add', text: '+ 新增优惠券', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'name', label: '优惠券名称', align: 'center' },
            { prop: 'type', label: '类型', slot: true, width: 100, align: 'center' },
            { prop: 'discountRate', label: '折扣率', width: 80, align: 'center', type: 'number' },
            { prop: 'conditionAmount', label: '条件金额', width: 100, align: 'center' },
            { prop: 'discountAmount', label: '优惠金额', width: 100, align: 'center' },
            { prop: 'totalCount', label: '总数量', width: 90, align: 'center' },
            { prop: 'remainCount', label: '剩余数量', width: 90, align: 'center' },
            { prop: 'validDays', label: '有效期(天)', width: 100, align: 'center' },
            { prop: 'status', label: '状态', slot: true, width: 80, align: 'center' }
          ],
          // 弹窗表单
          formData: {
            title: '新增优惠券',
            dialogVisible: false,
            id: '',
            name: '',
            type: '',
            conditionAmount: '',
            discountAmount: '',
            discountRate: '',
            totalCount: '',
            validDays: '',
            status: 1
          },
          // 修改点：优惠券表单校验规则（基础必填，配合 el-form :rules + validate()）
          couponRules: {
            name: [{ required: true, whitespace: true, message: '请输入优惠券名称', trigger: 'blur' }],
            type: [{ required: true, message: '请选择优惠券类型', trigger: 'change' }],
            totalCount: [{ required: true, message: '请输入发放总数', trigger: 'blur' }],
            validDays: [{ required: true, message: '请输入有效天数', trigger: 'blur' }]
          },
          searchValues: {}
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '🎫', label: '优惠券模板', value: self.stats.totalCoupons, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'enabled', icon: '✅', label: '已启用', value: self.stats.enabledCount, color: 'success', clickable: true, active: self.activeFilter === 'enabled' },
            { key: 'disabled', icon: '⏸️', label: '已禁用', value: self.stats.disabledCount, color: 'warning', clickable: true, active: self.activeFilter === 'disabled' },
            { key: 'claimed', icon: '📤', label: '已领取 ' + (self.stats.claimedCount || 0) + ' 张', value: self.stats.usageRate || '0%', color: 'danger', clickable: false }
          ]
        }
      },
      methods: {
        async init(reloadStats = true) {
          this.loading = true
          var sv = this.searchValues || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            name: sv.name || undefined,
            type: sv.type || undefined,
            status: sv.status || undefined
          }
          // 修改点：F9 性能 — 全局统计与分页列表分离，仅数据突变后重载，翻页/搜索不重算
          var requests = [couponTemplatePage(params)]
          if (reloadStats) { requests.push(this.loadCouponStats()) }
          var results = await Promise.all(requests)
          var couponRes = results[0]
          if (String(couponRes.code) === '1') {
            this.tableData = couponRes.data.records || []
            this.counts = couponRes.data.total
          } else {
            ReggieUI.error(couponRes.msg || '操作失败')
          }
          if (reloadStats) {
            var statsRes = results[1]
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
          this.loading = false
        },
        async loadCouponStats() {
          try {
            // 修改点：改为调用后端聚合接口 /stats，避免 pageSize=1000 拉全量后在浏览器聚合
            var res = await couponStats()
            if (String(res.code) === '1') {
              return { code: 1, data: res.data || {} }
            }
          } catch (err) { console.warn('加载优惠券统计失败:', err) }
          return { code: 0 }
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          var self = this
          if (payload.key === '') {
            self.activeFilter = ''
            self.searchValues = { name: '', type: '', status: '' }
          } else if (payload.key === 'enabled') {
            self.activeFilter = 'enabled'
            self.searchValues = { name: '', type: '', status: self.activeFilter ? '1' : '' }
          } else if (payload.key === 'disabled') {
            self.activeFilter = 'disabled'
            self.searchValues = { name: '', type: '', status: self.activeFilter ? '0' : '' }
          }
          self.page = 1
          this.init(false)
        },
        // table-bar 回调
        onSearch(searchParams) {
          this.activeFilter = ''
          this.searchValues = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.searchValues = {}
          this.page = 1
          this.init(false)
        },
        onAction(payload) {
          if (payload.key === 'add') this.addHandle()
        },
        // 分页
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.init(false)
        },
        // CRUD 操作
        addHandle() {
          this.action = 'add'
          this.formData.title = '新增优惠券'
          this.formData.id = ''
          this.formData.name = ''
          this.formData.type = ''
          this.formData.conditionAmount = ''
          this.formData.discountAmount = ''
          this.formData.discountRate = ''
          this.formData.totalCount = ''
          this.formData.validDays = ''
          this.formData.status = 1
          this.formData.dialogVisible = true
        },
        editHandle(row) {
          this.action = 'edit'
          this.formData.title = '修改优惠券'
          this.formData.id = row.id
          this.formData.name = row.name
          this.formData.type = row.type
          this.formData.conditionAmount = row.conditionAmount
          this.formData.discountAmount = row.discountAmount
          this.formData.discountRate = row.discountRate
          this.formData.totalCount = row.totalCount
          this.formData.validDays = row.validDays
          this.formData.status = row.status
          this.formData.dialogVisible = true
        },
        submitForm() {
          var self = this
          var passed = false
          self.$refs.couponForm.validate(function(valid) { passed = valid })
          if (!passed) {
            self.$message.warning('请完善表单必填项')
            return
          }
          // 修改点：前端表单校验，与后端 validateCoupon 保持一致，拦截非法提交
          if (!self.formData.name || !self.formData.name.trim()) {
            self.$message.error('请输入优惠券名称'); return
          }
          if (!this.formData.type) {
            ReggieUI.error('请选择优惠券类型'); return
          }
          if (this.formData.type === 'FULL_REDUCTION') {
            if (!this.formData.conditionAmount || Number(this.formData.conditionAmount) <= 0) {
              ReggieUI.error('请输入有效的条件金额'); return
            }
            if (!this.formData.discountAmount || Number(this.formData.discountAmount) <= 0) {
              ReggieUI.error('请输入有效的优惠金额'); return
            }
            if (Number(this.formData.discountAmount) >= Number(this.formData.conditionAmount)) {
              ReggieUI.error('优惠金额必须小于条件金额'); return
            }
          } else if (this.formData.type === 'DISCOUNT') {
            if (!this.formData.discountRate || Number(this.formData.discountRate) <= 0 || Number(this.formData.discountRate) >= 1) {
              ReggieUI.error('折扣率必须在0~1之间（如0.85表示8.5折）'); return
            }
          }
          if (!this.formData.totalCount || Number(this.formData.totalCount) <= 0) {
            ReggieUI.error('请输入发放总数'); return
          }
          if (this.formData.validDays === '' || Number(this.formData.validDays) <= 0) {
            ReggieUI.error('请输入有效天数'); return
          }
          var data = {
            name: this.formData.name,
            type: this.formData.type,
            conditionAmount: this.formData.conditionAmount || null,
            discountAmount: this.formData.discountAmount || null,
            discountRate: this.formData.discountRate || null,
            totalCount: this.formData.totalCount,
            validDays: this.formData.validDays,
            status: this.formData.status
          }
          var self = this
          if (this.action === 'add') {
            addCouponTemplate(data).then(res => {
              if (res.code === 1) {
                self.$message.success('优惠券添加成功！')
                self.formData.dialogVisible = false
                self.init()
              } else {
                self.$message.error(res.msg || '操作失败')
              }
            }).catch(err => { self.$message.error('请求失败：' + err) })
          } else {
            data.id = this.formData.id
            updateCouponTemplate(data).then(res => {
              if (res.code === 1) {
                self.$message.success('优惠券修改成功！')
                self.formData.dialogVisible = false
                self.init()
              } else {
                self.$message.error(res.msg || '操作失败')
              }
            }).catch(err => { self.$message.error('请求失败：' + err) })
          }
        },
        deleteHandle(id) {
          var self = this
          ReggieUI.confirm('此操作将永久删除该优惠券, 是否继续?', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(function() {
            deleteCouponTemplate(id).then(res => {
              if (res.code === 1) {
                self.$message.success('删除成功！')
                self.init()
              } else {
                self.$message.error(res.msg || '操作失败')
              }
            }).catch(err => { self.$message.error('请求失败：' + err) })
          })
        },
        handleClose() {
          this.formData.dialogVisible = false
        }
      }
    })
  </script>
</body>
</html>
