<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优惠券管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="coupon-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="input.name" placeholder="请输入优惠券名称" style="width: 200px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-select v-model="input.type" placeholder="请选择优惠券类型" style="width: 200px; margin-left: 10px" clearable @change="handleQuery">
          <el-option label="满减" value="FULL_REDUCTION"></el-option>
          <el-option label="折扣" value="DISCOUNT"></el-option>
          <el-option label="新客" value="NEW_MEMBER"></el-option>
        </el-select>
        <el-select v-model="input.status" placeholder="请选择状态" style="width: 150px; margin-left: 10px" clearable @change="handleQuery">
          <el-option label="启用" value="1"></el-option>
          <el-option label="禁用" value="0"></el-option>
        </el-select>
        <el-button type="primary" style="margin-left: 10px" @click="handleQuery">查询</el-button>
        <el-button type="primary" @click="addHandle">+ 新增优惠券</el-button>
      </div>
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="优惠券名称"></el-table-column>
        <el-table-column prop="type" label="类型">
          <template slot-scope="scope">
            <el-tag :type="scope.row.type === 'FULL_REDUCTION' ? 'success' : scope.row.type === 'DISCOUNT' ? 'warning' : 'info'">
              {{ scope.row.type === 'FULL_REDUCTION' ? '满减' : scope.row.type === 'DISCOUNT' ? '折扣' : '新客' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="conditionAmount" label="条件金额"></el-table-column>
        <el-table-column prop="discountAmount" label="优惠金额"></el-table-column>
        <el-table-column prop="totalCount" label="总数量"></el-table-column>
        <el-table-column prop="remainCount" label="剩余数量"></el-table-column>
        <el-table-column prop="validDays" label="有效期(天)"></el-table-column>
        <el-table-column prop="status" label="状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 1 ? 'success' : 'danger'">
              {{ scope.row.status === 1 ? '启用' : '禁用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="35%" :before-close="handleClose">
      <el-form label-width="120px">
        <el-form-item label="优惠券名称：">
          <el-input v-model="formData.name" placeholder="请输入优惠券名称" maxlength="30"></el-input>
        </el-form-item>
        <el-form-item label="优惠券类型：">
          <el-select v-model="formData.type" placeholder="请选择类型" style="width: 100%">
            <el-option label="满减" value="FULL_REDUCTION"></el-option>
            <el-option label="折扣" value="DISCOUNT"></el-option>
            <el-option label="新客" value="NEW_MEMBER"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="条件金额：">
          <el-input v-model="formData.conditionAmount" type="number" placeholder="请输入条件金额"></el-input>
        </el-form-item>
        <el-form-item label="优惠金额：">
          <el-input v-model="formData.discountAmount" type="number" placeholder="请输入优惠金额"></el-input>
        </el-form-item>
        <el-form-item label="总数量：">
          <el-input v-model="formData.totalCount" type="number" placeholder="请输入总数量"></el-input>
        </el-form-item>
        <el-form-item label="有效期(天)：">
          <el-input v-model="formData.validDays" type="number" placeholder="请输入有效期天数"></el-input>
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member-center.js"></script>
    <script>
      new Vue({
        el: '#coupon-app',
        data() {
          return {
            action: '',
            input: { name: '', type: '', status: '' },
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            formData: {
              title: '新增优惠券',
              dialogVisible: false,
              id: '',
              name: '',
              type: '',
              conditionAmount: '',
              discountAmount: '',
              totalCount: '',
              validDays: '',
              status: 1
            }
          }
        },
        created() {
          this.init()
        },
        methods: {
          async init() {
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input.name || undefined,
              type: this.input.type || undefined,
              status: this.input.status || undefined
            }
            await couponTemplatePage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增优惠券'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.type = ''
            this.formData.conditionAmount = ''
            this.formData.discountAmount = ''
            this.formData.totalCount = ''
            this.formData.validDays = ''
            this.formData.status = 1
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改优惠券'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.type = row.type
            this.formData.conditionAmount = row.conditionAmount
            this.formData.discountAmount = row.discountAmount
            this.formData.totalCount = row.totalCount
            this.formData.validDays = row.validDays
            this.formData.status = row.status
            this.formData.dialogVisible = true
          },
          submitForm() {
            const data = {
              name: this.formData.name,
              type: this.formData.type,
              conditionAmount: this.formData.conditionAmount,
              discountAmount: this.formData.discountAmount,
              totalCount: this.formData.totalCount,
              validDays: this.formData.validDays,
              status: this.formData.status
            }
            if (this.action === 'add') {
              addCouponTemplate(data).then(res => {
                if (res.code === 1) {
                  this.$message.success('优惠券添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              data.id = this.formData.id
              updateCouponTemplate(data).then(res => {
                if (res.code === 1) {
                  this.$message.success('优惠券修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该优惠券, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteCouponTemplate(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
