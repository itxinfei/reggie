<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
    /* ---- 图表区 ---- */
    .chart-panels { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .chart-panel { flex: 1; min-width: 380px; background: #fff; border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 18px 20px; }
    .chart-panel .panel-title { font-size: 15px; font-weight: 600; color: #303133; margin-bottom: 12px;
      padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
    .chart-box { width: 100%; height: 320px; }

    /* ---- 筛选区 ---- */
    .filter-bar { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-bar .el-select, .filter-bar .el-input { width: 180px; }
    .type-tag { cursor: pointer; padding: 5px 14px; border-radius: 20px; font-size: 13px;
      border: 1px solid #e4e7ed; color: #606266; transition: all 0.2s; user-select: none; }
    .type-tag.active { color: #409eff; border-color: #409eff; background: #ecf5ff; }
    .type-tag:hover { color: #409eff; border-color: #c6e2ff; }

    @media (max-width: 900px) {
      .stat-card { min-width: 140px; flex: 1 1 calc(50% - 8px); }
      .chart-panel { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="points-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 stat-card -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ===== 图表区 ===== -->
      <div class="chart-panels">
        <div class="chart-panel">
          <div class="panel-title">📈 近30天积分趋势</div>
          <div class="chart-box" id="trendChart"></div>
        </div>
        <div class="chart-panel">
          <div class="panel-title">🥧 积分类型分布</div>
          <div class="chart-box" id="pieChart"></div>
        </div>
      </div>

      <!-- ===== 筛选区 ===== -->
      <div class="filter-bar">
        <el-input v-model="input.phone" placeholder="请输入会员手机号" clearable
          @keyup.enter.native="handleQuery" style="width:200px;">
          <i slot="prefix" class="el-input__icon el-icon-search"></i>
        </el-input>
        <span style="color:#909399;font-size:13px;">类型：</span>
        <span :class="['type-tag', input.type === '' ? 'active' : '']" @click="setType('')">全部</span>
        <span :class="['type-tag', input.type === 'ACQUIRE' ? 'active' : '']" @click="setType('ACQUIRE')">🟢 获取</span>
        <span :class="['type-tag', input.type === 'CONSUME' ? 'active' : '']" @click="setType('CONSUME')">🔴 消费</span>
        <span :class="['type-tag', input.type === 'EXPIRE' ? 'active' : '']" @click="setType('EXPIRE')">⚠️ 过期</span>
        <el-button type="primary" size="small" @click="handleQuery">查询</el-button>
        <el-button size="small" @click="reset">重置</el-button>
      </div>

      <!-- ===== 数据表格 ===== -->
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="memberName" label="会员名称" min-width="120"></el-table-column>
        <el-table-column prop="phone" label="手机号" width="130"></el-table-column>
        <el-table-column prop="type" label="类型" width="90" align="center">
          <template slot-scope="{row}">
            <el-tag :type="row.type==='ACQUIRE'?'success':row.type==='CONSUME'?'danger':'warning'" size="small" effect="dark">
              {{ row.type === 'ACQUIRE' ? '获取' : row.type === 'CONSUME' ? '消费' : '过期' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="points" label="积分变动" width="110" align="center">
          <template slot-scope="{row}">
            <span :style="{color: row.type==='ACQUIRE'?'#22c55e':'#f97316', fontWeight:600}">
              {{ row.type === 'ACQUIRE' ? '+' : '-' }}{{ row.points }}
            </span>
          </template>
        </el-table-column>
        <el-table-column prop="balance" label="当前余额" width="120" align="center">
          <template slot-scope="{row}">
            <span style="font-weight:600;">{{ row.balance != null ? row.balance : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="createdTime" label="记录时间" min-width="170"></el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 50]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/member-center.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#points-app',
      data: function() {
        return {
          loading: false,
          input: { phone: '', type: '' },
          counts: 0, page: 1, pageSize: 10,
          tableData: [],
          stats: { totalPoints: 0, todayAcquired: 0, todayConsumed: 0,
            monthAcquired: 0, monthConsumed: 0, totalAcquired: 0, totalConsumed: 0, trend: [] },
          trendChart: null, pieChart: null
        }
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: '总积分', icon: '💎', label: '全平台总积分', value: self.fmtNum(self.stats.totalPoints), color: 'info' },
            { key: '今日', icon: '📈', label: '今日获取', value: '+' + self.fmtNum(self.stats.todayAcquired), color: 'success' },
            { key: '今日消耗', icon: '📉', label: '今日消耗', value: '-' + self.fmtNum(self.stats.todayConsumed), color: 'warning' },
            { key: '收支', icon: '📊', label: '累计收支', value: '+' + self.fmtNum(self.stats.totalAcquired) + ' / -' + self.fmtNum(self.stats.totalConsumed), color: 'primary' }
          ]
        }
      },
      created: function() { this.init() },
      mounted: function() { this.$nextTick(function() { this.initCharts() }) },
      methods: {
        async init() {
          this.loading = true
          var params = { page: this.page, pageSize: this.pageSize, phone: this.input.phone || undefined, type: this.input.type || undefined }
          try {
            var results = await Promise.all([pointsPage(params), pointsStats()])
            var pageRes = results[0], statsRes = results[1]
            if (String(pageRes.code) === '1') {
              this.tableData = pageRes.data.records || []
              this.counts = pageRes.data.total
            } else { this.$message.error(pageRes.msg || '操作失败') }
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data
              this.$nextTick(function() { this.renderCharts() })
            }
          } catch(e) { this.$message.error('请求失败：' + e) }
          this.loading = false
        },
        initCharts: function() {
          this.trendChart = echarts.init(document.getElementById('trendChart'))
          this.pieChart = echarts.init(document.getElementById('pieChart'))
          window.addEventListener('resize', function() {
            if (this.trendChart) this.trendChart.resize()
            if (this.pieChart) this.pieChart.resize()
          }.bind(this))
        },
        renderCharts: function() {
          var self = this
          // 趋势图
          if (self.trendChart && self.stats.trend) {
            var dates = [], acquired = [], consumed = []
            self.stats.trend.forEach(function(d) { dates.push(d.date); acquired.push(d.acquired); consumed.push(d.consumed) })
            self.trendChart.setOption({
              tooltip: { trigger: 'axis' },
              legend: { data: ['获取', '消耗'], bottom: 0, textStyle: { fontSize: 12 } },
              grid: { left: 50, right: 20, top: 20, bottom: 35 },
              xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 10, formatter: function(v) { return v.slice(5) } } },
              yAxis: { type: 'value' },
              series: [
                { name: '获取', type: 'line', data: acquired, smooth: true, symbol: 'none',
                  lineStyle: { color: '#22c55e', width: 2 }, areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,
                    [{offset:0,color:'rgba(34,197,94,0.25)'},{offset:1,color:'rgba(34,197,94,0.02)'}]) } },
                { name: '消耗', type: 'line', data: consumed, smooth: true, symbol: 'none',
                  lineStyle: { color: '#f97316', width: 2 }, areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,
                    [{offset:0,color:'rgba(249,115,22,0.25)'},{offset:1,color:'rgba(249,115,22,0.02)'}]) } }
              ]
            })
          }
          // 饼图
          if (self.pieChart) {
            self.pieChart.setOption({
              tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
              legend: { bottom: 0, textStyle: { fontSize: 12 } },
              series: [{
                type: 'pie', radius: ['48%', '72%'], center: ['50%', '48%'], avoidLabelOverlap: false,
                label: { show: false }, emphasis: { label: { show: true, fontWeight: 'bold' } },
                itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
                data: [
                  { value: self.stats.totalAcquired || 0, name: '累计获取', itemStyle: { color: '#22c55e' } },
                  { value: self.stats.totalConsumed || 0, name: '累计消耗', itemStyle: { color: '#f97316' } },
                  { value: Math.max(0, (self.stats.totalPoints||0) - (self.stats.totalAcquired||0) + (self.stats.totalConsumed||0)), name: '初始积分', itemStyle: { color: '#3b82f6' } }
                ]
              }]
            })
          }
        },
        fmtNum: function(n) { return (n || 0).toLocaleString() },
        setType: function(t) { this.input.type = t; this.page = 1; this.init() },
        handleQuery: function() { this.page = 1; this.init() },
        reset: function() { this.input = { phone: '', type: '' }; this.page = 1; this.init() },
        handleSizeChange: function(v) { this.pageSize = v; this.init() },
        handleCurrentChange: function(v) { this.page = v; this.init() }
      }
    })
  </script>
</body>
</html>
