<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分管理 - 瑞吉外卖管理端</title>

  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css?v=20260915c" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260915c" />
  <style>
    /* ---- 图表区 ---- */
    .chart-panels { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .chart-panel { flex: 1; min-width: 380px; background: var(--bg-surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 18px 20px; }
    .chart-panel .panel-title { font-size:var(--font-size-md); font-weight: 600; color: var(--el-text-primary); margin-bottom: 12px;
      padding-bottom: 10px; border-bottom: 1px solid var(--el-bg-lighter); display: flex; align-items: center; gap: 8px; }
    .chart-box { width: 100%; height: 320px; }

    /* 筛选区已迁移到统一 table-bar 组件，旧 .filter-bar/.type-tag 手写样式移除 */

    .adjust-member { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%;
      padding: 10px 14px; background: var(--bg-subtle); border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); font-size: var(--font-size-base); color: var(--text-primary) }
    .adjust-member b { font-weight: 600 }
    .adjust-member .ri-user-star-line { color: var(--color-brand-500); font-size: var(--font-size-xl) }

    @media (max-width: 900px) {
      .chart-panel { min-width: 100%; }
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <!-- ====== 积分明细管理页 ====== -->
  <!-- 功能：查看会员积分变动记录，支持按手机号/类型筛选，含趋势图与饼图统计，支持手动积分调整 -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="points-app">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <h1 class="sr-only" id="page-title">积分管理</h1>
      <!-- 统计卡片（第一区块） -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 工具栏（第二区块）：手机号 + 类型筛选 + 查询/重置 + 积分调整，统一 table-bar -->
      <table-bar
        :search-items="searchItems"
        :actions="tableActions"
        @search="onBarSearch"
        @reset="onBarReset"
        @action="onBarAction">
      </table-bar>

      <!-- ===== 图表区（主体） ===== -->
      <div class="chart-panels">
        <div class="chart-panel">
          <div class="panel-title"><i class="ri-line-chart-line" aria-hidden="true"></i> 近30天积分趋势</div>
          <div class="chart-box" id="trendChart"></div>
        </div>
        <div class="chart-panel">
          <div class="panel-title"><i class="ri-pie-chart-2-line" aria-hidden="true"></i> 积分类型分布</div>
          <div class="chart-box" id="pieChart"></div>
        </div>
      </div>

      <!-- ===== 数据表格（主体） ===== -->
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination（图表区保持不变） -->
      <crud-table
        empty-hint="暂无相关记录"
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10, 20, 30, 50]"
        :total="counts"
        :loading="loading"
        :show-actions="false"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-type="{ row }">
          <el-tag :type="row.type==='IN'?'success':row.type==='OUT'?'danger':'warning'" size="small" effect="dark">
            {{ row.type === 'IN' ? '获取' : row.type === 'OUT' ? '消费' : '未知' }}
          </el-tag>
        </template>
        <template #col-points="{ row }">
          <span :style="{color: row.type==='IN'?'var(--color-success)':'var(--color-danger)', fontWeight:600}">
            {{ row.type === 'IN' ? '+' : '-' }}{{ row.points }}
          </span>
        </template>
        <template #col-balance="{ row }">
          <span style="font-weight:600;">{{ row.balance != null ? row.balance : '-' }}</span>
        </template>
      </crud-table>
    </main>

    <!-- ===== 积分调整弹窗（8.4.3：发放/扣减/说明） ===== -->
    <crud-dialog :show-submit="true" :show-cancel="true" title="积分调整" :visible.sync="adjustForm.dialogVisible" :submit-loading="adjustLoading" size="md" @submit="submitAdjust">
      <el-form :model="adjustForm" :rules="adjustRules" ref="adjustFormRef" label-width="100px" size="small">
        <el-form-item label="会员手机：" prop="phone">
          <div style="display:flex;gap:8px;width:100%;">
            <el-input v-model="adjustForm.phone" placeholder="输入会员手机号" clearable style="flex:1" @keyup.enter.native="queryAdjustMember"></el-input>
            <el-button :loading="memberLoading" @click="queryAdjustMember">查询</el-button>
          </div>
        </el-form-item>
        <template v-if="adjustMember">
          <el-form-item label="会员信息：">
            <div class="adjust-member">
              <i class="ri-user-star-line" aria-hidden="true"></i>
              <span><b>{{ adjustMember.name }}</b>（{{ adjustMember.phone }}）</span>
              <span>当前积分：<b style="color:var(--color-brand-500)">{{ adjustMember.points != null ? adjustMember.points : 0 }}</b></span>
              <span>余额：<b>¥{{ formatMoney(adjustMember.balance) }}</b></span>
            </div>
          </el-form-item>
          <el-form-item label="调整方式：" prop="adjustType">
            <el-radio-group v-model="adjustForm.adjustType" @change="onAdjustTypeChange">
              <el-radio-button label="IN">发放</el-radio-button>
              <el-radio-button label="OUT">扣减</el-radio-button>
            </el-radio-group>
          </el-form-item>
          <el-form-item label="积分数量：" prop="points">
            <el-input-number v-model="adjustForm.points" :min="1" :max="1000000" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="调整说明：" prop="remark">
            <el-input v-model="adjustForm.remark" placeholder="如：生日关怀赠送 / 活动补偿 / 违规扣减" maxlength="100"></el-input>
          </el-form-item>
        </template>
        <div v-else-if="adjustSearched" class="empty-state" style="padding:20px;">
          <div class="empty-state__icon"><i class="ri-user-unfollow-line" aria-hidden="true"></i></div>
          <div>未找到该手机号的会员</div>
          <div class="empty-state__desc">请核对手机号后重新查询</div>
        </div>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <script src="../../js/request.js?v=20260915c"></script>
  <script src="../../js/accessibility-utils.js?v=20260915c"></script>
  <script src="../../js/performance-utils.js?v=20260915c"></script>
  <script src="../../api/member-center.js?v=20260915c"></script>
  <script src="../../js/components.js?v=20260924"></script>
  <script>
    new Vue({
      el: '#points-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
      data: function() {
        // adjustForm 提为局部变量：remark 的动态必填规则需闭包读取 adjustType
        var adjustForm = { dialogVisible: false, phone: '', adjustType: 'IN', points: 100, remark: '' };
        return {
          loading: false,
          input: { phone: '', type: '' },
          // table-bar 统一工具栏：手机号搜索 + 类型下拉（清空=全部）+ 积分调整操作
          searchItems: [
            { type: 'input', field: 'phone', placeholder: '请输入会员手机号', width: 200 },
            { type: 'select', field: 'type', placeholder: '类型（全部）', width: 140,
              options: [ { label: '获取', value: 'IN' }, { label: '消费', value: 'OUT' } ] }
          ],
          tableActions: [
            { key: 'adjust', text: '积分调整', type: 'primary', icon: 'ri-add-line' }
          ],
          counts: 0, page: 1, pageSize: 10,
          tableData: [],
          stats: { totalPoints: 0, todayAcquired: 0, todayConsumed: 0,
            monthAcquired: 0, monthConsumed: 0, totalAcquired: 0, totalConsumed: 0, trend: [] },
          trendChart: null, pieChart: null,
          // 积分调整弹窗（8.4.3）
          adjustForm: adjustForm,
          adjustLoading: false, memberLoading: false, adjustMember: null, adjustSearched: false,
          adjustRules: {
            phone: [{ required: true, message: '请输入会员手机号', trigger: 'blur' }],
            points: [{ required: true, message: '请输入积分数量', trigger: 'change' }],
            // 动态必填：扣减积分(OUT)必须写明原因，便于对账与会员申诉；赠送(IN)不强制
            remark: [{ validator: function(rule, value, callback) {
                if (adjustForm.adjustType === 'OUT' && (!value || !value.trim())) {
                  callback(new Error('扣减积分时必须填写调整说明'));
                } else {
                  callback();
                }
              }, trigger: 'blur' }]
          },
        // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
        columns: [
          { prop: 'memberName', label: '会员名称', width: 100 },
          { prop: 'phone', label: '手机号', width: 120, align: 'center' },
          { prop: 'type', label: '类型', width: 70, align: 'center', slot: true },
          { prop: 'points', label: '积分变动', width: 80, slot: true, type: 'number' },
          { prop: 'balance', label: '当前余额', width: 90, slot: true, type: 'number' },
          { prop: 'createdTime', label: '记录时间', width: 140, align: 'center' }
        ]
      }
    },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          const self = this;
          return [
            { key: '总积分', icon: 'ri-vip-diamond-line', label: '全平台总积分', value: self.fmtNum(self.stats.totalPoints), color: 'info' },
            { key: '今日', icon: 'ri-line-chart-line', label: '今日获取', value: '+' + self.fmtNum(self.stats.todayAcquired), color: 'success' },
            { key: '今日消耗', icon: 'ri-line-chart-line', label: '今日消耗', value: '-' + self.fmtNum(self.stats.todayConsumed), color: 'warning' },
            { key: '收支', icon: 'ri-bar-chart-2-line', label: '累计收支', value: '+' + self.fmtNum(self.stats.totalAcquired) + ' / -' + self.fmtNum(self.stats.totalConsumed), color: 'primary' }
          ]
        }
      },
      created: function() { this.fetchData(true) },
      mounted: function() { this.$nextTick(function() { this.initCharts() }) },
      // 修改点：页面销毁时移除 resize 监听并释放图表实例，避免监听器与内存泄漏
      beforeDestroy: function() {
        if (this._resizeHandler) {
          window.removeEventListener('resize', this._resizeHandler)
        }
        if (this.trendChart) { this.trendChart.dispose(); this.trendChart = null }
        if (this.pieChart) { this.pieChart.dispose(); this.pieChart = null }
      },
      methods: {
        /* ── 数据加载 ── */
        // 修改点：F9 性能 — 列表查询与全局统计分离，reloadStats=true 才重算
        async fetchData(reloadStats = true) {
          this.loading = true
          // 修改点：搜索参数来源统一为 input（原读取未定义的 searchValues，导致手机号与类型筛选从未下发）
          const params = Object.assign({}, this.input, { page: this.page, pageSize: this.pageSize })
          try {
            const requests = [pointsPage(params)]
            if (reloadStats) { requests.push(pointsStats()) }
            const results = await Promise.all(requests)
            const pageRes = results[0]
            if (String(pageRes.code) === '1') {
              this.tableData = pageRes.data.records || []
              this.counts = Number(pageRes.data.total) || 0
            } else { ReggieUI.error(pageRes.msg || '操作失败') }
            if (reloadStats) {
              const statsRes = results[1]
              if (statsRes && String(statsRes.code) === '1') {
                this.stats = statsRes.data
                this.$nextTick(function() { this.renderCharts() })
              }
            }
          } catch(e) { ReggieUI.error('请求失败：' + e) }
          this.loading = false
        },
        /* ── 图表初始化与渲染 ── */
        initCharts: function() {
          var dom1 = document.getElementById('trendChart');
          if (dom1) this.trendChart = echarts.init(dom1);
          var dom2 = document.getElementById('pieChart');
          if (dom2) this.pieChart = echarts.init(dom2);
          // 修改点：具名处理函数并保存引用，便于 beforeDestroy 中移除监听器，防止页面切换时监听器累积泄漏
          this._resizeHandler = function() {
            if (this.trendChart) this.trendChart.resize()
            if (this.pieChart) this.pieChart.resize()
          }.bind(this)
          window.addEventListener('resize', this._resizeHandler)
        },
        renderCharts: function() {
          const self = this
          // 积分空态文案：趋势与构成共用同一套 title 配置，notMerge=true 先清旧系列再绘制
          const emptyTitle = {
            text: '暂无积分数据', left: 'center', top: 'center',
            textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' }
          }
          // 趋势图
          const trend = self.stats.trend || []
          const trendEmpty = !trend.length || !trend.some(function(d) {
            return (Number(d.acquired) || 0) > 0 || (Number(d.consumed) || 0) > 0
          })
          if (self.trendChart) {
            if (trendEmpty) {
              self.trendChart.setOption({ title: emptyTitle }, true)
            } else {
              const dates = [], acquired = [], consumed = []
              trend.forEach(function(d) { dates.push(d.date); acquired.push(Number(d.acquired) || 0); consumed.push(Number(d.consumed) || 0) })
              self.trendChart.setOption({
                tooltip: {
                  trigger: 'axis',
                  // 两系列均为积分数值，统一补「分」单位并千分位
                  formatter: function(params) {
                    let html = '<b>' + String(params[0].axisValue).slice(5) + '</b><br/>'
                    params.forEach(function(p) {
                      html += p.marker + ' ' + p.seriesName + '：<b>' + (Number(p.value) || 0).toLocaleString() + ' 分</b><br/>'
                    })
                    return html
                  }
                },
                legend: { data: ['获取', '消耗'], bottom: 0, textStyle: { fontSize: 12 } },
                grid: { left: 60, right: 20, top: 20, bottom: 35 },
                xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 10, formatter: function(v) { return v.slice(5) } } },
                yAxis: {
                  type: 'value', name: '积分(分)',
                  nameTextStyle: { color: RgPalette.textSecondary, fontSize: 12 },
                  axisLabel: { color: RgPalette.textSecondary, fontSize: 12 }
                },
                series: [
                  { name: '获取', type: 'line', data: acquired, smooth: true, symbol: 'none',
                    lineStyle: { color: RgPalette.emerald, width: 2 }, areaStyle: { color: RgPalette.emeraldArea } },
                  { name: '消耗', type: 'line', data: consumed, smooth: true, symbol: 'none',
                    lineStyle: { color: RgPalette.orange500, width: 2 }, areaStyle: { color: RgPalette.orange500Area } }
                ]
              }, true)
            }
          }
          // 饼图
          if (self.pieChart) {
            const initialPoints = Math.max(0, (self.stats.totalPoints || 0) - (self.stats.totalAcquired || 0) + (self.stats.totalConsumed || 0))
            const pieEmpty = !(self.stats.totalAcquired || 0) && !(self.stats.totalConsumed || 0) && !initialPoints
            if (pieEmpty) {
              self.pieChart.setOption({ title: emptyTitle }, true)
            } else {
              self.pieChart.setOption({
                tooltip: { trigger: 'item', formatter: function(p) { return p.name + ': ' + (Number(p.value) || 0).toLocaleString() + ' 分 (' + p.percent + '%)' } },
                legend: { bottom: 0, textStyle: { fontSize: 12 } },
                series: [{
                  type: 'pie', radius: ['48%', '72%'], center: ['50%', '48%'], avoidLabelOverlap: false,
                  label: { show: false }, emphasis: { label: { show: true, fontWeight: 'bold' } },
                  itemStyle: { borderRadius: RgPalette.radiusMd, borderColor: RgPalette.white, borderWidth: 3 },
                  data: [
                    { value: self.stats.totalAcquired || 0, name: '累计获取', itemStyle: { color: RgPalette.emerald } },
                    { value: self.stats.totalConsumed || 0, name: '累计消耗', itemStyle: { color: RgPalette.orange500 } },
                    { value: initialPoints, name: '初始积分', itemStyle: { color: RgPalette.blue500 } }
                  ]
                }]
              }, true)
            }
          }
        },
        /* ── 筛选与分页 ── */
        fmtNum: function(n) { return (n || 0).toLocaleString() },
        // table-bar 回调桥接：组件内部筛选值同步到既有 input，再复用原查询逻辑
        onBarSearch: function(params) {
          this.input.phone = params.phone || ''
          this.input.type = params.type || ''
          this.handleQuery()
        },
        onBarReset: function() { this.reset() },
        onBarAction: function(payload) { if (payload.key === 'adjust') this.openAdjust() },
        handleQuery: function() { this.page = 1; this.fetchData(false) },
        reset: function() { this.input = { phone: '', type: '' }; this.page = 1; this.fetchData(false) },
        /* ── 积分调整弹窗（8.4.3） ── */
        openAdjust: function() {
          this.adjustForm.phone = ''
          this.adjustForm.adjustType = 'IN'
          this.adjustForm.points = 100
          this.adjustForm.remark = ''
          this.adjustMember = null
          this.adjustSearched = false
          this.adjustForm.dialogVisible = true
          const self = this
          this.$nextTick(function() { if (self.$refs.adjustFormRef) self.$refs.adjustFormRef.clearValidate() })
        },
        // 切换调整方式：清除调整说明旧校验态（OUT 的必填错误在切回 IN 时应消失）
        onAdjustTypeChange() {
          const self = this
          this.$nextTick(function() {
            if (self.$refs.adjustFormRef) self.$refs.adjustFormRef.clearValidate('remark')
          })
        },
        async queryAdjustMember() {
          if (!this.adjustForm.phone || !this.adjustForm.phone.trim()) {
            ReggieUI.warning('请输入会员手机号')
            return
          }
          this.memberLoading = true
          try {
            const res = await memberByPhone(this.adjustForm.phone.trim())
            if (String(res.code) === '1') {
              this.adjustMember = res.data
              this.adjustSearched = true
            } else {
              this.adjustMember = null
              this.adjustSearched = true
              ReggieUI.warning(res.msg || '未找到该会员')
            }
          } catch (e) {
            console.warn('查询会员失败:', e)
            ReggieUI.error('查询失败，请重试')
          } finally {
            this.memberLoading = false
          }
        },
        submitAdjust: function() {
          if (this.adjustLoading) { return } // 提交防重：请求期间锁定，防止连点重复调整积分
          const self = this
          this.$refs.adjustFormRef.validate(function(valid) {
            if (!valid) return
            if (!self.adjustMember) {
              ReggieUI.warning('请先查询并选择会员')
              return
            }
            // 扣积分(OUT)不能超过当前余额，超额直接拦截
            var ptsNum = Number(self.adjustForm.points)
            if (self.adjustForm.adjustType === 'OUT') {
              var cur = Number(self.adjustMember.points) || 0
              if (ptsNum > cur) {
                ReggieUI.warning('扣减积分不能超过当前余额（当前 ' + cur + ' 分）')
                return
              }
            }
            self.adjustLoading = true
            const delta = self.adjustForm.adjustType === 'IN' ? self.adjustForm.points : -self.adjustForm.points
            adjustPoints({
              memberId: self.adjustMember.id,
              points: delta,
              remark: self.adjustForm.remark || ''
            }).then(function(res) {
              if (String(res.code) === '1') {
                ReggieUI.success('积分调整成功')
                self.adjustForm.dialogVisible = false
                self.handleQuery()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(function(e) { ReggieUI.error('请求失败：' + e) })
              .finally(function() { self.adjustLoading = false })
          })
        },
        // 修改点：F9 性能 — 覆盖 ReggieListMixin 分页方法，翻页不重算全局统计
        onPageChange: function(payload) {
          this.page = payload.page
          this.pageSize = payload.pageSize
          if (typeof this.fetchData === 'function') this.fetchData(false)
        },
        onSizeChange: function(val) {
          this.page = 1
          this.pageSize = (typeof val === 'object' && val != null) ? (val.pageSize || val) : val
          if (typeof this.fetchData === 'function') this.fetchData(false)
        },
      }
    })
  </script>
</body>
</html>
