<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员等级 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
    .stats-cards--col-3 {
      grid-template-columns: repeat(4, 1fr);
    }

    .progression-section { background: #fff; border-radius: 14px; padding: 20px 24px; margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .progression-title { font-size: 15px; font-weight: 600; color: #303133; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px; }
    .progression-bar { display: flex; align-items: flex-end; gap: 10px; padding: 10px 0; }
    .prog-item { flex: 1; text-align: center; position: relative; }
    .prog-icon { font-size: 18px; margin-bottom: 6px; }
    .prog-bar-wrap { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
    .prog-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .prog-name { font-size: 12px; color: #606266; font-weight: 500; white-space: nowrap; }
    .prog-pts { font-size: 11px; color: #909399; }
    .prog-discount { font-size: 11px; color: #10b981; font-weight: 600; }

    @media (max-width: 900px) {
      .stat-card { min-width: 140px; flex: 1 1 calc(50% - 8px); }
      .prog-name { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="level-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ===== 等级进阶 ===== -->
      <div class="progression-section" v-if="tableData.length > 0">
        <div class="progression-title">📊 等级晋升阶梯</div>
        <div class="progression-bar">
          <div class="prog-item" v-for="(item, idx) in sortedLevels" :key="item.id">
            <div class="prog-icon">{{ idx === sortedLevels.length - 1 ? '👑' : idx >= sortedLevels.length - 3 ? '⭐' : idx >= 2 ? '🎖' : idx >= 1 ? '🥉' : '🌱' }}</div>
            <div class="prog-name">{{ item.name }}</div>
            <div class="prog-bar-wrap"><div class="prog-bar-fill" :style="{width: getBarWidth(idx), background: getBarColor(idx)}"></div></div>
            <div class="prog-pts">{{ item.minPoints }} 分</div>
            <div class="prog-discount" v-if="item.discount != null">{{ (item.discount*100).toFixed(0) }}折</div>
          </div>
        </div>
      </div>

      <!-- 修改点：使用 <table-bar> 统一组件 -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="handleReset"
        @action="onTableAction">
      </table-bar>

      <!-- ===== 表格 ===== -->
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="等级名称" min-width="120">
          <template slot-scope="{row}">
            <span style="font-weight:600;">{{ row.name }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="minPoints" label="所需积分" width="120" align="center">
          <template slot-scope="{row}">
            <span style="font-weight:600;color:#8b5cf6;">{{ row.minPoints }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="discount" label="折扣率" width="120" align="center">
          <template slot-scope="{row}">
            <el-tag :type="row.discount >= 0.9 ? 'info' : row.discount >= 0.8 ? 'warning' : 'danger'" size="small" effect="dark">
              {{ row.discount != null ? (row.discount * 100).toFixed(0) + '%' : '-' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="sort" label="排序" width="80" align="center">
          <template slot-scope="{row}">
            <span>{{ row.sort != null ? row.sort : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-view" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- ===== 弹窗 ===== -->
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="35%" :before-close="handleClose">
      <el-form label-width="120px" :model="formData" :rules="formRules" ref="levelForm">
        <el-form-item label="等级名称：" prop="name">
          <el-input v-model="formData.name" placeholder="请输入等级名称" maxlength="20"></el-input>
        </el-form-item>
        <el-form-item label="所需积分：" prop="minPoints">
          <el-input v-model.number="formData.minPoints" type="number" placeholder="请输入所需积分" min="0"></el-input>
        </el-form-item>
        <el-form-item label="折扣率：" prop="discount">
          <el-input v-model.number="formData.discount" type="number" placeholder="如 0.85 表示85折" min="0" max="1" step="0.01">
            <template slot="append">折</template>
          </el-input>
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input v-model.number="formData.sort" type="number" placeholder="数字越小越靠前" min="0"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm">确 定</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/member-center.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#level-app',
      data: function() {
        return {
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [
            { type: 'input', field: 'name', placeholder: '等级名称搜索', width: 200 }
          ],
          tableActions: [
            { key: 'add', text: '+ 新增会员等级', type: 'primary' }
          ],
          loading: false, action: '', counts: 0, page: 1, pageSize: 10, tableData: [],
          stats: { totalLevels: 0, highestLevel: '-', lowestPoints: 0, avgDiscount: '-' },
          formData: { title: '新增会员等级', dialogVisible: false, id: '', name: '', minPoints: '', discount: '', sort: '' },
          formRules: {
            name: [{ required: true, message: '请输入等级名称', trigger: 'blur' }],
            minPoints: [{ required: true, message: '请输入所需积分', trigger: 'blur' }],
            discount: [{ required: true, message: '请输入折扣率', trigger: 'blur' }],
            sort: [{ required: true, message: '请输入排序', trigger: 'blur' }]
          }
        }
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: 'total', icon: '🏅', label: '等级总数', value: self.stats.totalLevels || 0, color: 'primary' },
            { key: 'highest', icon: '👑', label: '最高等级', value: self.stats.highestLevel || '-', color: 'success' },
            { key: 'entry', icon: '🎯', label: '入门门槛', value: self.stats.lowestPoints || 0, color: 'warning' },
            { key: 'avg', icon: '💯', label: '平均折扣率', value: self.stats.avgDiscount || '-', color: 'info' }
          ]
        },
        sortedLevels: function() {
          return this.tableData.slice().sort(function(a,b) { return (a.minPoints||0) - (b.minPoints||0) })
        }
      },
      created: function() { this.init() },
      methods: {
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        async init() {
          this.loading = true
          var s = this.lastSearch || {}
          try {
            var res = await levelPage({ page: this.page, pageSize: this.pageSize, name: s.name || undefined })
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
              this.calcStats(this.tableData)
            } else { this.$message.error(res.msg || '操作失败') }
          } catch(e) { this.$message.error('请求失败：' + e) }
          this.loading = false
        },
        calcStats: function(records) {
          if (!records || records.length === 0) { this.stats = { totalLevels: 0, highestLevel: '-', lowestPoints: 0, avgDiscount: '-' }; return }
          this.stats.totalLevels = this.counts || records.length
          var highest = records.reduce(function(p, c) { return (c.minPoints != null && (p == null || c.minPoints > p.minPoints)) ? c : p }, null)
          this.stats.highestLevel = highest ? highest.name : '-'
          var lowest = records.reduce(function(p, c) {
            if (c.minPoints != null && c.minPoints > 0) return (p == null || c.minPoints < p) ? c.minPoints : p
            return p
          }, null)
          this.stats.lowestPoints = lowest || 0
          var valid = records.filter(function(d) { return d.discount != null && d.discount > 0 })
          this.stats.avgDiscount = valid.length > 0 ? (valid.reduce(function(s,d) { return s + (d.discount||0) }, 0) / valid.length * 100).toFixed(0) + '%' : '-'
        },
        getBarWidth: function(idx) {
          var max = this.sortedLevels.length || 1
          return ((idx + 1) / max * 100) + '%'
        },
        getBarColor: function(idx) {
          var colors = ['#e2e8f0','#a78bfa','#818cf8','#60a5fa','#34d399','#fbbf24','#f97316','#ef4444']
          return colors[idx % colors.length]
        },
        // <table-bar> @search 回调（table-bar 已管理搜索条件，通过 searchParams 传入）
        handleQuery: function(searchParams) {
          this.lastSearch = searchParams || {}
          this.page = 1
          this.init()
        },
        // <table-bar> @reset 回调
        handleReset: function() {
          this.lastSearch = {}
          this.page = 1
          this.init()
        },
        addHandle: function() {
          this.action = 'add'; this.formData.title = '新增会员等级'
          this.formData.id = ''; this.formData.name = ''; this.formData.minPoints = ''
          this.formData.discount = ''; this.formData.sort = ''
          this.formData.dialogVisible = true
          var self = this; this.$nextTick(function() { if (self.$refs.levelForm) self.$refs.levelForm.clearValidate() })
        },
        editHandle: function(row) {
          this.action = 'edit'; this.formData.title = '修改会员等级'
          this.formData.id = row.id; this.formData.name = row.name
          this.formData.minPoints = row.minPoints; this.formData.discount = row.discount; this.formData.sort = row.sort
          this.formData.dialogVisible = true
          var self = this; this.$nextTick(function() { if (self.$refs.levelForm) self.$refs.levelForm.clearValidate() })
        },
        submitForm: function() {
          var self = this
          this.$refs.levelForm.validate(function(valid) {
            if (!valid) { self.$message.warning('请完善表单信息'); return false }
            var data = { name: self.formData.name, minPoints: self.formData.minPoints, discount: self.formData.discount, sort: self.formData.sort }
            if (self.action === 'add') {
              addLevel(data).then(function(res) {
                if (res.code === 1) { self.$message.success('等级添加成功！'); self.formData.dialogVisible = false; self.handleQuery() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(function(e) { self.$message.error('请求失败：' + e) })
            } else {
              data.id = self.formData.id
              updateLevel(data).then(function(res) {
                if (res.code === 1) { self.$message.success('等级修改成功！'); self.formData.dialogVisible = false; self.handleQuery() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(function(e) { self.$message.error('请求失败：' + e) })
            }
          })
        },
        deleteHandle: function(id) {
          var self = this
          this.$confirm('此操作将永久删除该等级, 是否继续?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              deleteLevel(id).then(function(res) {
                if (res.code === 1) { self.$message.success('删除成功！'); self.handleQuery() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(function(e) { self.$message.error('请求失败：' + e) })
            })
        },
        handleClose: function() { this.formData.dialogVisible = false },
        handleSizeChange: function(v) { this.pageSize = v; this.init() },
        handleCurrentChange: function(v) { this.page = v; this.init() }
      }
    })
  </script>
</body>
</html>
