<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员等级 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="level-app">
    <div class="container">
      <!-- 修改点：新增统计卡片 -->
      <div class="stats-cards">
        <div class="stat-card primary">
          <div class="stat-icon">🏅</div>
          <div class="stat-label">等级总数</div>
          <div class="stat-value">{{ stats.totalLevels || 0 }}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">⬆️</div>
          <div class="stat-label">最高等级</div>
          <div class="stat-value" style="font-size: 20px">{{ stats.highestLevel || '-' }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">📊</div>
          <div class="stat-label">最低积分门槛</div>
          <div class="stat-value" style="font-size: 22px">{{ stats.lowestPoints || 0 }}</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">💯</div>
          <div class="stat-label">平均折扣率</div>
          <div class="stat-value" style="font-size: 22px">{{ stats.avgDiscount || '-' }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-button type="primary" @click="addHandle">+ 新增会员等级</el-button>
      </div>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="等级名称"></el-table-column>
        <!-- 修改点：字段名 requiredPoints → minPoints，对齐实体 -->
        <el-table-column prop="minPoints" label="所需积分"></el-table-column>
        <!-- 修改点：字段名 discountRate → discount，对齐实体 BigDecimal -->
        <el-table-column prop="discount" label="折扣率">
          <template slot-scope="scope">
            <span>{{ scope.row.discount != null ? scope.row.discount : '-' }}</span>
          </template>
        </el-table-column>
        <!-- 修改点：sort -->
        <el-table-column prop="sort" label="排序">
          <template slot-scope="scope">
            <span>{{ scope.row.sort != null ? scope.row.sort : '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-view" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="35%" :before-close="handleClose">
      <!-- 修改点：添加表单校验规则 -->
      <el-form label-width="120px" :model="formData" :rules="formRules" ref="levelForm">
        <el-form-item label="等级名称：" prop="name">
          <el-input v-model="formData.name" placeholder="请输入等级名称" maxlength="20"></el-input>
        </el-form-item>
        <!-- 修改点：字段名 requiredPoints → minPoints -->
        <el-form-item label="所需积分：" prop="minPoints">
          <el-input v-model.number="formData.minPoints" type="number" placeholder="请输入所需积分" min="0"></el-input>
        </el-form-item>
        <!-- 修改点：字段名 discountRate → discount -->
        <el-form-item label="折扣率：" prop="discount">
          <el-input v-model.number="formData.discount" type="number" placeholder="请输入折扣率（如0.85表示85折）" min="0" max="1" step="0.01"></el-input>
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input v-model.number="formData.sort" type="number" placeholder="请输入排序序号" min="0"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member-center.js"></script>
    <script>
      new Vue({
        el: '#level-app',
        data() {
          return {
            loading: false,
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            // 修改点：新增统计对象
            stats: { totalLevels: 0, highestLevel: '-', lowestPoints: 0, avgDiscount: '-' },
            // 修改点：字段名统一对齐实体：minPoints / discount / sort
            formData: {
              title: '新增会员等级',
              dialogVisible: false,
              id: '',
              name: '',
              minPoints: '',
              discount: '',
              sort: ''
            },
            // 修改点：新增前表单端校验规则
            formRules: {
              name: [{ required: true, message: '请输入等级名称', trigger: 'blur' }],
              minPoints: [{ required: true, message: '请输入所需积分', trigger: 'blur' }],
              discount: [{ required: true, message: '请输入折扣率', trigger: 'blur' }],
              sort: [{ required: true, message: '请输入排序', trigger: 'blur' }]
            }
          }
        },
        created() {
          this.init()
        },
        methods: {
          // 修改点：加载列表并计算统计
          async init() {
            this.loading = true
            try {
              var res = await levelPage({ page: this.page, pageSize: this.pageSize })
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
                this.calcStats(this.tableData)
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
            this.loading = false
          },
          // 修改点：根据数据库真实数据计算统计
          calcStats(records) {
            if (!records || records.length === 0) {
              this.stats = { totalLevels: 0, highestLevel: '-', lowestPoints: 0, avgDiscount: '-' }
              return
            }
            // total来自分页总数
            this.stats.totalLevels = this.counts || records.length
            // 最高等级 = minPoints最大的那条
            var highest = records.reduce(function(prev, curr) {
              return (curr.minPoints != null && (prev == null || curr.minPoints > prev.minPoints)) ? curr : prev
            }, null)
            this.stats.highestLevel = highest ? highest.name : '-'
            // 最低积分门槛 = minPoints最小的(>0)
            var lowest = records.reduce(function(prev, curr) {
              if (curr.minPoints != null && curr.minPoints > 0) {
                return (prev == null || curr.minPoints < prev) ? curr.minPoints : prev
              }
              return prev
            }, null)
            this.stats.lowestPoints = lowest || 0
            // 修改点：计算平均折扣率
            var validDiscounts = records.filter(function(d) { return d.discount != null && d.discount > 0 })
            if (validDiscounts.length > 0) {
              var sum = validDiscounts.reduce(function(s, d) { return s + (d.discount || 0) }, 0)
              this.stats.avgDiscount = (sum / validDiscounts.length * 100).toFixed(0) + '%'
            } else {
              this.stats.avgDiscount = '-'
            }
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增会员等级'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.minPoints = ''
            this.formData.discount = ''
            this.formData.sort = ''
            this.formData.dialogVisible = true
            // 重置表单校验状态
            this.$nextTick(function() {
              if (this.$refs.levelForm) this.$refs.levelForm.clearValidate()
            })
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改会员等级'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.minPoints = row.minPoints
            this.formData.discount = row.discount
            this.formData.sort = row.sort
            this.formData.dialogVisible = true
            this.$nextTick(function() {
              if (this.$refs.levelForm) this.$refs.levelForm.clearValidate()
            })
          },
          // 修改点：提交前进行前端表单校验
          submitForm() {
            var self = this
            this.$refs.levelForm.validate(function(valid) {
              if (!valid) {
                self.$message.warning('请完善表单信息')
                return false
              }
              var data = {
                name: self.formData.name,
                minPoints: self.formData.minPoints,
                discount: self.formData.discount,
                sort: self.formData.sort
              }
              if (self.action === 'add') {
                addLevel(data).then(function(res) {
                  if (res.code === 1) {
                    self.$message.success('等级添加成功！')
                    self.formData.dialogVisible = false
                    self.handleQuery()
                  } else {
                    self.$message.error(res.msg || '操作失败')
                  }
                }).catch(function(err) {
                  self.$message.error('请求失败：' + err)
                })
              } else {
                data.id = self.formData.id
                updateLevel(data).then(function(res) {
                  if (res.code === 1) {
                    self.$message.success('等级修改成功！')
                    self.formData.dialogVisible = false
                    self.handleQuery()
                  } else {
                    self.$message.error(res.msg || '操作失败')
                  }
                }).catch(function(err) {
                  self.$message.error('请求失败：' + err)
                })
              }
            })
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该等级, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(function() {
              deleteLevel(id).then(function(res) {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }.bind(this)).catch(function(err) {
                this.$message.error('请求失败：' + err)
              }.bind(this))
            }.bind(this))
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
