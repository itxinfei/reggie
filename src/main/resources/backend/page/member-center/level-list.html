<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员等级 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="level-app">
    <div class="container">
      <div class="tableBar">
        <el-button type="primary" @click="addHandle">+ 新增会员等级</el-button>
      </div>
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="等级名称"></el-table-column>
        <el-table-column prop="requiredPoints" label="所需积分"></el-table-column>
        <el-table-column prop="discountRate" label="折扣率">
          <template slot-scope="scope">
            <span>{{ scope.row.discountRate }}%</span>
          </template>
        </el-table-column>
        <el-table-column prop="sort" label="排序"></el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="30%" :before-close="handleClose">
      <el-form label-width="120px">
        <el-form-item label="等级名称：">
          <el-input v-model="formData.name" placeholder="请输入等级名称" maxlength="20"></el-input>
        </el-form-item>
        <el-form-item label="所需积分：">
          <el-input v-model="formData.requiredPoints" type="number" placeholder="请输入所需积分"></el-input>
        </el-form-item>
        <el-form-item label="折扣率(%)：">
          <el-input v-model="formData.discountRate" type="number" placeholder="请输入折扣率"></el-input>
        </el-form-item>
        <el-form-item label="排序：">
          <el-input v-model="formData.sort" type="number" placeholder="请输入排序"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member-center.js"></script>
    <script>
      new Vue({
        el: '#level-app',
        data() {
          return {
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            formData: {
              title: '新增会员等级',
              dialogVisible: false,
              id: '',
              name: '',
              requiredPoints: '',
              discountRate: '',
              sort: ''
            }
          }
        },
        created() {
          this.init()
        },
        methods: {
          async init() {
            await levelPage({ page: this.page, pageSize: this.pageSize }).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增会员等级'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.requiredPoints = ''
            this.formData.discountRate = ''
            this.formData.sort = ''
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改会员等级'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.requiredPoints = row.requiredPoints
            this.formData.discountRate = row.discountRate
            this.formData.sort = row.sort
            this.formData.dialogVisible = true
          },
          submitForm() {
            const data = {
              name: this.formData.name,
              requiredPoints: this.formData.requiredPoints,
              discountRate: this.formData.discountRate,
              sort: this.formData.sort
            }
            if (this.action === 'add') {
              addLevel(data).then(res => {
                if (res.code === 1) {
                  this.$message.success('等级添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              data.id = this.formData.id
              updateLevel(data).then(res => {
                if (res.code === 1) {
                  this.$message.success('等级修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该等级, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteLevel(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
