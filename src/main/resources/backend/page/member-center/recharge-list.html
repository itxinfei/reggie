<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值记录 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
  <style>
    .chart-panels { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .chart-panel { flex: 1; min-width: 380px; background: var(--bg-surface); border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 18px 20px; }
    .chart-panel .panel-title { font-size: 15px; font-weight: 600; color: var(--el-text-primary); margin-bottom: 12px;
      padding-bottom: 10px; border-bottom: 1px solid var(--el-bg-lighter); }
    .chart-box { width: 100%; height: 300px; }
    .filter-bar { background: var(--bg-surface); border-radius: 12px; padding: 14px 20px; margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-bar .el-select { width: 150px; }
    @media (max-width: 900px) {
      .chart-panel { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="recharge-app">
    <div class="container">
      <!-- 面包屑导航 -->
      <nav class="ds-breadcrumb" aria-label="面包屑导航">
        <span class="ds-breadcrumb__item">首页</span>
        <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
        <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">充值记录</span>
      </nav>
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 stat-card -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ===== 图表区 ===== -->
      <div class="chart-panels">
        <div class="chart-panel">
          <div class="panel-title">📈 近12月充值趋势</div>
          <div class="chart-box" id="trendChart"></div>
        </div>
        <div class="chart-panel">
          <div class="panel-title">💳 支付方式分布</div>
          <div class="chart-box" id="paymentChart"></div>
        </div>
      </div>

      <!-- ===== 筛选区 ===== -->
      <div class="filter-bar">
        <el-input v-model="input.phone" placeholder="请输入会员手机号" clearable
          @keyup.enter.native="handleQuery" style="width:200px;">
          <i slot="prefix" class="el-input__icon el-icon-search"></i>
        </el-input>
        <el-select v-model="input.paymentMethod" placeholder="支付方式" clearable @change="handleQuery">
          <el-option label="微信支付" value="WECHAT"></el-option>
          <el-option label="支付宝" value="ALIPAY"></el-option>
          <el-option label="现金" value="CASH"></el-option>
        </el-select>
        <el-button type="primary" size="small" @click="handleQuery">查询</el-button>
        <el-button size="small" @click="reset">重置</el-button>
      </div>

      <!-- ===== 数据表格 ===== -->
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination（图表区保持不变） -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10, 20, 30, 50]"
        :total="counts"
        :loading="loading"
        :show-actions="false"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-amount="{ row }">
          <span style="color:#f59e0b;font-weight:700;font-size:15px;">￥{{ row.amount }}</span>
        </template>
        <template #col-giftAmount="{ row }">
          <span :style="{color: Number(row.giftAmount)>0?'var(--emerald)':'var(--color-info)', fontWeight: Number(row.giftAmount)>0?'600':'400' }">
            ￥{{ row.giftAmount || '0.00' }}
          </span>
        </template>
        <template #col-paymentMethod="{ row }">
          <el-tag :type="row.paymentMethod==='WECHAT'?'success':row.paymentMethod==='ALIPAY'?'primary':row.paymentMethod==='CASH'?'warning':'info'" size="small" effect="plain">
            {{ row.paymentMethod === 'WECHAT' ? '微信' : row.paymentMethod === 'ALIPAY' ? '支付宝' : row.paymentMethod === 'CASH' ? '现金' : row.paymentMethod || '--' }}
          </el-tag>
        </template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/member-center.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#recharge-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
      data: function() {
        return {
          loading: false,
          input: { phone: '', paymentMethod: '' },
          counts: 0, page: 1, pageSize: 10,
          tableData: [],
          stats: { totalAmount: 0, totalCount: 0, todayAmount: 0, todayCount: 0,
            monthAmount: 0, monthCount: 0, avgAmount: 0, paymentDistribution: [], trend: [] },
          trendChart: null, paymentChart: null,
        // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
        columns: [
          { prop: 'memberName', label: '会员名称', minWidth: 120 },
          { prop: 'phone', label: '手机号', width: 130 },
          { prop: 'amount', label: '充值金额', width: 130, align: 'center', slot: true },
          { prop: 'giftAmount', label: '赠送金额', width: 120, align: 'center', slot: true },
          { prop: 'paymentMethod', label: '支付方式', width: 110, align: 'center', slot: true },
          { prop: 'createdTime', label: '充值时间', minWidth: 170 }
        ]
      }
    },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: '总额', icon: '💰', label: '累计充值总额', value: '￥' + self.fmtMoney(self.stats.totalAmount), color: 'warning' },
            { key: '今日', icon: '📅', label: '今日充值', value: '￥' + self.fmtMoney(self.stats.todayAmount), color: 'success' },
            { key: '本月', icon: '📆', label: '本月充值', value: '￥' + self.fmtMoney(self.stats.monthAmount), color: 'primary' },
            { key: '平均', icon: '📊', label: '平均单笔充值', value: '￥' + self.fmtMoney(self.stats.avgAmount), color: 'info' }
          ]
        }
      },
      created: function() { this.fetchData() },
      mounted: function() { this.$nextTick(function() { this.initCharts() }) },
      // 修改点：页面销毁时移除 resize 监听并释放图表实例，避免监听器与内存泄漏
      beforeDestroy: function() {
        if (this._resizeHandler) {
          window.removeEventListener('resize', this._resizeHandler)
        }
        if (this.trendChart) { this.trendChart.dispose(); this.trendChart = null }
        if (this.paymentChart) { this.paymentChart.dispose(); this.paymentChart = null }
      },
      methods: {
        // 修改点：新增 fmtMoney 工具方法
        async fetchData() {
          this.loading = true
          var params = { page: this.page, pageSize: this.pageSize, phone: this.input.phone || undefined, paymentMethod: this.input.paymentMethod || undefined }
          try {
            var results = await Promise.all([rechargePage(params), rechargeStats()])
            var pageRes = results[0], statsRes = results[1]
            if (String(pageRes.code) === '1') {
              this.tableData = pageRes.data.records || []
              this.counts = pageRes.data.total
            } else { ReggieUI.error(pageRes.msg || '操作失败') }
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data
              this.$nextTick(function() { this.renderCharts() })
            }
          } catch(e) { ReggieUI.error('请求失败：' + e) }
          this.loading = false
        },
        initCharts: function() {
          this.trendChart = echarts.init(document.getElementById('trendChart'))
          this.paymentChart = echarts.init(document.getElementById('paymentChart'))
          var self = this
          // 修改点：具名处理函数并保存引用，便于 beforeDestroy 中移除监听器，防止页面切换时监听器累积泄漏
          this._resizeHandler = function() {
            if (self.trendChart) self.trendChart.resize()
            if (self.paymentChart) self.paymentChart.resize()
          }
          window.addEventListener('resize', this._resizeHandler)
        },
        renderCharts: function() {
          var self = this
          // 趋势
          if (self.trendChart && self.stats.trend) {
            var months = [], amounts = []
            self.stats.trend.forEach(function(d) { months.push(d.month); amounts.push(Number(d.amount) || 0) })
            self.trendChart.setOption({
              tooltip: { trigger: 'axis', formatter: function(p) { return p[0].name + '<br/>充值：¥' + p[0].value.toLocaleString() } },
              grid: { left: 55, right: 25, top: 15, bottom: 20 },
              xAxis: { type: 'category', data: months, axisLabel: { rotate: 30, fontSize: 10 } },
              yAxis: { type: 'value', axisLabel: { formatter: function(v) { return '¥' + (v/10000).toFixed(0) + 'w' } } },
              series: [{
                type: 'bar', data: amounts, barWidth: '50%',
                itemStyle: { borderRadius: [6,6,0,0], color: new echarts.graphic.LinearGradient(0,0,0,1,
                  [{offset:0,color:'#f59e0b'},{offset:1,color:'#fbbf24'}]) }
              }]
            })
          }
          // 支付方式
          if (self.paymentChart && self.stats.paymentDistribution) {
            var pieData = self.stats.paymentDistribution.map(function(d) {
              var name = d.name === 'WECHAT' ? '微信支付' : d.name === 'ALIPAY' ? '支付宝' : d.name === 'CASH' ? '现金' : d.name
              return { name: name, value: Number(d.value) || 0 }
            })
            var colors = ['#07c160','#1677ff','#f59e0b','#8b5cf6']
            self.paymentChart.setOption({
              tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
              series: [{
                type: 'pie', radius: ['50%', '75%'], center: ['50%', '50%'],
                avoidLabelOverlap: false, itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
                label: { show: true, formatter: '{b}\n{d}%' },
                data: pieData, color: colors
              }]
            })
          }
        },
        fmtMoney: function(v) {
          if (v == null) return '0.00'
          var n = Number(v)
          if (n >= 10000) return (n/10000).toFixed(2).replace(/\.?0+$/,'') + '万'
          return n.toFixed(2)
        },
        handleQuery: function() { this.page = 1; this.fetchData() },
        reset: function() { this.input = { phone: '', paymentMethod: '' }; this.page = 1; this.fetchData() },
        // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除
      }
    })
  </script>
</body>
</html>
