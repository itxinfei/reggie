<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值记录 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    .chart-panels { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .chart-panel { flex: 1; min-width: 380px; background: var(--bg-surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 18px 20px; }
    .chart-panel .panel-title { font-size:var(--font-size-md); font-weight: 600; color: var(--el-text-primary); margin-bottom: 12px;
      padding-bottom: 10px; border-bottom: 1px solid var(--el-bg-lighter); }
    .chart-box { width: 100%; height: 300px; }
    .filter-bar { background: var(--bg-surface); border-radius: var(--radius-lg); padding: 14px 20px; margin-bottom: 16px;
      box-shadow: var(--shadow-xs); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-bar .el-select { width: 150px; }
    .recharge-member { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%;
      padding: 10px 14px; background: var(--bg-subtle); border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); font-size: var(--font-size-base); color: var(--text-primary) }
    .recharge-member b { font-weight: 600 }
    .recharge-member .ri-wallet-3-line { color: var(--color-success); font-size: 18px }
    @media (max-width: 900px) {
      .chart-panel { min-width: 100%; }
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="recharge-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">充值记录</h1>
          <p class="ds-page-header__subtitle">查看会员充值流水</p>
        </div>
        <div class="ds-page-header__actions">
          <el-button type="primary" size="small" icon="el-icon-plus" @click="openRecharge">手动充值</el-button>
        </div>
      </header>
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 stat-card -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- ===== 图表区 ===== -->
      <div class="chart-panels">
        <div class="chart-panel">
          <div class="panel-title"><i class="ri-line-chart-line" aria-hidden="true"></i> 近12月充值趋势</div>
          <div class="chart-box" id="trendChart"></div>
        </div>
        <div class="chart-panel">
          <div class="panel-title"><i class="ri-bank-card-line" aria-hidden="true"></i> 支付方式分布</div>
          <div class="chart-box" id="paymentChart"></div>
        </div>
      </div>

      <!-- ===== 筛选区 ===== -->
      <div class="filter-bar">
        <el-input v-model="input.phone" placeholder="请输入会员手机号" clearable
          @keyup.enter.native="handleQuery" style="width:200px;">
          <i slot="prefix" class="el-input__icon el-icon-search"></i>
        </el-input>
        <el-select v-model="input.paymentMethod" placeholder="支付方式" clearable @change="handleQuery">
          <el-option label="微信支付" value="WECHAT"></el-option>
          <el-option label="支付宝" value="ALIPAY"></el-option>
          <el-option label="现金" value="CASH"></el-option>
        </el-select>
        <el-button type="primary" size="small" @click="handleQuery">查询</el-button>
        <el-button size="small" @click="reset">重置</el-button>
      </div>

      <!-- ===== 数据表格 ===== -->
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination（图表区保持不变） -->
      <crud-table
        empty-hint="暂无相关记录"
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10, 20, 30, 50]"
        :total="counts"
        :loading="loading"
        :show-actions="false"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-amount="{ row }">
          <span class="ds-money--gold">￥{{ formatMoney(row.amount) }}</span>
        </template>
        <template #col-giftAmount="{ row }">
          <span :class="Number(row.giftAmount)>0 ? 'ds-money--success' : 'ds-money--muted'">
            ￥{{ formatMoney(row.giftAmount) }}
          </span>
        </template>
        <template #col-paymentMethod="{ row }">
          <el-tag :type="row.paymentMethod==='WECHAT'?'success':row.paymentMethod==='ALIPAY'?'primary':row.paymentMethod==='CASH'?'warning':'info'" size="small" effect="plain">
            {{ row.paymentMethod === 'WECHAT' ? '微信' : row.paymentMethod === 'ALIPAY' ? '支付宝' : row.paymentMethod === 'CASH' ? '现金' : row.paymentMethod || '--' }}
          </el-tag>
        </template>
      </crud-table>
    </div>

    <!-- ===== 手动充值弹窗（8.4.3：金额/赠送/支付方式，充值后余额即时更新） ===== -->
    <crud-dialog title="手动充值" :visible.sync="rechargeForm.dialogVisible" :submit-loading="rechargeLoading" width="480px" @submit="submitRecharge">
      <el-form :model="rechargeForm" :rules="rechargeRules" ref="rechargeFormRef" label-width="90px" size="small">
        <el-form-item label="会员手机：" prop="phone">
          <div style="display:flex;gap:8px;width:100%;">
            <el-input v-model="rechargeForm.phone" placeholder="输入会员手机号" clearable style="flex:1" @keyup.enter.native="queryRechargeMember"></el-input>
            <el-button :loading="memberLoading" @click="queryRechargeMember">查询</el-button>
          </div>
        </el-form-item>
        <template v-if="rechargeMember">
          <el-form-item label="会员信息：">
            <div class="recharge-member">
              <i class="ri-wallet-3-line" aria-hidden="true"></i>
              <span><b>{{ rechargeMember.name }}</b>（{{ rechargeMember.phone }}）</span>
              <span>当前余额：<b style="color:var(--color-success)">￥{{ formatMoney(rechargeMember.balance) }}</b></span>
            </div>
          </el-form-item>
          <el-form-item label="充值金额：" prop="amount">
            <el-input-number v-model="rechargeForm.amount" :min="1" :max="999999" :precision="2" :step="100" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="赠送金额：" prop="giftAmount">
            <el-input-number v-model="rechargeForm.giftAmount" :min="0" :max="99999" :precision="2" :step="10" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="支付方式：" prop="paymentMethod">
            <el-select v-model="rechargeForm.paymentMethod" style="width:100%">
              <el-option label="微信支付" value="WECHAT"></el-option>
              <el-option label="支付宝" value="ALIPAY"></el-option>
              <el-option label="现金" value="CASH"></el-option>
            </el-select>
          </el-form-item>
        </template>
        <div v-else-if="rechargeSearched" class="empty-state" style="padding:20px;">
          <div class="empty-state__icon"><i class="ri-user-unfollow-line" aria-hidden="true"></i></div>
          <div>未找到该手机号的会员</div>
          <div class="empty-state__desc">请核对手机号后重新查询</div>
        </div>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/member-center.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#recharge-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
      data: function() {
        return {
          loading: false,
          input: { phone: '', paymentMethod: '' },
          counts: 0, page: 1, pageSize: 10,
          tableData: [],
          stats: { totalAmount: 0, totalCount: 0, todayAmount: 0, todayCount: 0,
            monthAmount: 0, monthCount: 0, avgAmount: 0, paymentDistribution: [], trend: [] },
          trendChart: null, paymentChart: null,
          // 手动充值弹窗（8.4.3）
          rechargeForm: { dialogVisible: false, phone: '', amount: 100, giftAmount: 0, paymentMethod: 'WECHAT' },
          rechargeLoading: false, memberLoading: false, rechargeMember: null, rechargeSearched: false,
          rechargeRules: {
            phone: [{ required: true, message: '请输入会员手机号', trigger: 'blur' }],
            amount: [{ required: true, message: '请输入充值金额', trigger: 'change' }],
            giftAmount: [{ required: true, message: '请输入赠送金额', trigger: 'change' }],
            paymentMethod: [{ required: true, message: '请选择支付方式', trigger: 'change' }]
          },
        // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
        columns: [
          { prop: 'memberName', label: '会员名称', width: 100 },
          { prop: 'phone', label: '手机号', width: 120, align: 'center' },
          { prop: 'amount', label: '充值金额', width: 90, slot: true, type: 'money' },
          { prop: 'giftAmount', label: '赠送金额', width: 90, slot: true, type: 'money' },
          { prop: 'paymentMethod', label: '支付方式', width: 80, align: 'center', slot: true },
          { prop: 'createdTime', label: '充值时间', width: 140, align: 'center' }
        ]
      }
    },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          const self = this;
          return [
            { key: '总额', icon: 'ri-money-cny-circle-line', label: '累计充值总额', value: '￥' + self.fmtMoney(self.stats.totalAmount), color: 'warning' },
            { key: '今日', icon: 'ri-calendar-check-line', label: '今日充值', value: '￥' + self.fmtMoney(self.stats.todayAmount), color: 'success' },
            { key: '本月', icon: 'ri-calendar-line', label: '本月充值', value: '￥' + self.fmtMoney(self.stats.monthAmount), color: 'primary' },
            { key: '平均', icon: 'ri-bar-chart-2-line', label: '平均单笔充值', value: '￥' + self.fmtMoney(self.stats.avgAmount), color: 'info' }
          ]
        }
      },
      created: function() { this.fetchData(true) },
      mounted: function() { this.$nextTick(function() { this.initCharts() }) },
      // 修改点：页面销毁时移除 resize 监听并释放图表实例，避免监听器与内存泄漏
      beforeDestroy: function() {
        if (this._resizeHandler) {
          window.removeEventListener('resize', this._resizeHandler)
        }
        if (this.trendChart) { this.trendChart.dispose(); this.trendChart = null }
        if (this.paymentChart) { this.paymentChart.dispose(); this.paymentChart = null }
      },
      methods: {
        // 修改点：新增 fmtMoney 工具方法
        // 修改点：F9 性能 — 列表查询与全局统计分离，reloadStats=true 才重算
        async fetchData(reloadStats = true) {
          this.loading = true
          // 修改点：搜索参数来源统一为 input（原读取未定义的 searchValues，导致手机号/支付方式筛选从未下发）
          const params = Object.assign({}, this.input, { page: this.page, pageSize: this.pageSize })
          try {
            const requests = [rechargePage(params)]
            if (reloadStats) { requests.push(rechargeStats()) }
            const results = await Promise.all(requests)
            const pageRes = results[0]
            if (String(pageRes.code) === '1') {
              this.tableData = pageRes.data.records || []
              this.counts = Number(pageRes.data.total) || 0
            } else { ReggieUI.error(pageRes.msg || '操作失败') }
            if (reloadStats) {
              const statsRes = results[1]
              if (statsRes && String(statsRes.code) === '1') {
                this.stats = statsRes.data
                this.$nextTick(function() { this.renderCharts() })
              }
            }
          } catch(e) { ReggieUI.error('请求失败：' + e) }
          this.loading = false
        },
        initCharts: function() {
          this.trendChart = echarts.init(document.getElementById('trendChart'))
          this.paymentChart = echarts.init(document.getElementById('paymentChart'))
          const self = this
          // 修改点：具名处理函数并保存引用，便于 beforeDestroy 中移除监听器，防止页面切换时监听器累积泄漏
          this._resizeHandler = function() {
            if (self.trendChart) self.trendChart.resize()
            if (self.paymentChart) self.paymentChart.resize()
          }
          window.addEventListener('resize', this._resizeHandler)
        },
        renderCharts: function() {
          const self = this
          // 趋势
          if (self.trendChart && self.stats.trend) {
            const months = [], amounts = []
            self.stats.trend.forEach(function(d) { months.push(d.month); amounts.push(Number(d.amount) || 0) })
            self.trendChart.setOption({
              tooltip: { trigger: 'axis', formatter: function(p) { return p[0].name + '<br/>充值：¥' + p[0].value.toLocaleString() } },
              grid: { left: 55, right: 25, top: 15, bottom: 20 },
              xAxis: { type: 'category', data: months, axisLabel: { rotate: 30, fontSize: 10 } },
              yAxis: { type: 'value', axisLabel: { formatter: function(v) { return '¥' + (v/10000).toFixed(0) + 'w' } } },
              series: [{
                type: 'bar', data: amounts, barWidth: '50%',
                itemStyle: { borderRadius: [RgPalette.radiusMd, RgPalette.radiusMd, 0, 0], color: RgPalette.amber500 }
              }]
            })
          }
          // 支付方式
          if (self.paymentChart && self.stats.paymentDistribution) {
            var pieData = self.stats.paymentDistribution.map(function(d) {
              const name = d.name === 'WECHAT' ? '微信支付' : d.name === 'ALIPAY' ? '支付宝' : d.name === 'CASH' ? '现金' : d.name
              return { name: name, value: Number(d.value) || 0 }
            })
            const colors = [RgPalette.emerald,RgPalette.alipayBlue,RgPalette.amber500,RgPalette.violet500]
            self.paymentChart.setOption({
              tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
              series: [{
                type: 'pie', radius: ['50%', '75%'], center: ['50%', '50%'],
                avoidLabelOverlap: false, itemStyle: { borderRadius: RgPalette.radiusMd, borderColor: RgPalette.white, borderWidth: 3 },
                label: { show: true, formatter: '{b}\n{d}%' },
                data: pieData, color: colors
              }]
            })
          }
        },
        fmtMoney: function(v) {
          if (v == null) return '0.00'
          const n = Number(v)
          if (n >= 10000) return (n/10000).toFixed(2).replace(/\.?0+$/,'') + '万'
          return n.toFixed(2)
        },
        handleQuery: function() { this.page = 1; this.fetchData(false) },
        reset: function() { this.input = { phone: '', paymentMethod: '' }; this.page = 1; this.fetchData(false) },
        // ===== 手动充值（8.4.3） =====
        openRecharge: function() {
          this.rechargeForm.phone = ''
          this.rechargeForm.amount = 100
          this.rechargeForm.giftAmount = 0
          this.rechargeForm.paymentMethod = 'WECHAT'
          this.rechargeMember = null
          this.rechargeSearched = false
          this.rechargeForm.dialogVisible = true
          const self = this
          this.$nextTick(function() { if (self.$refs.rechargeFormRef) self.$refs.rechargeFormRef.clearValidate() })
        },
        async queryRechargeMember() {
          if (!this.rechargeForm.phone || !this.rechargeForm.phone.trim()) {
            ReggieUI.warning('请输入会员手机号')
            return
          }
          this.memberLoading = true
          try {
            const res = await memberByPhone(this.rechargeForm.phone.trim())
            if (String(res.code) === '1') {
              this.rechargeMember = res.data
              this.rechargeSearched = true
            } else {
              this.rechargeMember = null
              this.rechargeSearched = true
              ReggieUI.warning(res.msg || '未找到该会员')
            }
          } catch (e) {
            console.warn('查询会员失败:', e)
            ReggieUI.error('查询失败，请重试')
          } finally {
            this.memberLoading = false
          }
        },
        submitRecharge: function() {
          const self = this
          this.$refs.rechargeFormRef.validate(function(valid) {
            if (!valid) return
            if (!self.rechargeMember) {
              ReggieUI.warning('请先查询并选择会员')
              return
            }
            memberRecharge({
              memberId: self.rechargeMember.id,
              amount: self.rechargeForm.amount,
              giftAmount: self.rechargeForm.giftAmount || 0,
              paymentMethod: self.rechargeForm.paymentMethod
            }).then(function(res) {
              if (String(res.code) === '1') {
                ReggieUI.success('充值成功，余额已更新')
                self.rechargeForm.dialogVisible = false
                self.handleQuery()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(function(e) { ReggieUI.error('请求失败：' + e) })
          })
        },
        // 修改点：F9 性能 — 覆盖 ReggieListMixin 分页方法，翻页不重算全局统计
        onPageChange: function(payload) {
          this.page = payload.page
          this.pageSize = payload.pageSize
          if (typeof this.fetchData === 'function') this.fetchData(false)
        },
        onSizeChange: function(val) {
          this.page = 1
          this.pageSize = (typeof val === 'object' && val != null) ? (val.pageSize || val) : val
          if (typeof this.fetchData === 'function') this.fetchData(false)
        },
      }
    })
  </script>
</body>
</html>
