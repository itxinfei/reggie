<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鎶曟斁鏄庣粏 - 鐟炲悏澶栧崠绠＄悊绔?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    /* 鍏ㄩ儴浣跨敤 tokens.css 璁捐浠ょ墝 */
    .detail-container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-5) }

    /* 椤堕儴妯℃澘閫夋嫨鍖?*/
    .select-panel { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-6) }
    .select-panel__label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .select-panel__select { flex: 1; max-width: 420px }
    .select-panel__btn { height: 36px; font-size: var(--font-size-base) }
    .select-panel__tip { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 4px }

    /* 鏁堟灉缁熻鍗＄墖琛?*/
    .effect-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-6) }
    @media (max-width: 900px) { .effect-grid { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 520px) { .effect-grid { grid-template-columns: 1fr } }
    .effect-card { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); text-align: center }
    .effect-card__label { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: var(--space-2) }
    .effect-card__value { font-size: var(--font-size-3xl); font-weight: 600; color: var(--text-primary); line-height: 1.2 }
    .effect-card__sub { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-2) }
    .effect-card.primary .effect-card__value { color: var(--color-brand-500) }
    .effect-card.success .effect-card__value { color: var(--color-success) }
    .effect-card.warning .effect-card__value { color: var(--color-warning) }
    .effect-card.danger .effect-card__value { color: var(--color-danger) }

    /* 鐘舵€佸垎甯冭 */
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-bottom: var(--space-6) }
    @media (max-width: 700px) { .status-grid { grid-template-columns: 1fr } }
    .status-card { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between }
    .status-card__label { font-size: var(--font-size-base); color: var(--text-secondary) }
    .status-card__value { font-size: var(--font-size-2xl); font-weight: 600; line-height: 1.2 }
    .status-card__value--used { color: var(--color-success) }
    .status-card__value--unused { color: var(--color-brand-500) }
    .status-card__value--expired { color: var(--color-danger) }

    /* 绌虹姸鎬?*/
    .empty-state { text-align: center; padding: 60px var(--space-4); color: var(--text-muted); font-size: var(--font-size-base) }
    .empty-state__icon { font-size: var(--font-size-4xl); line-height: 1; margin-bottom: var(--space-4) }
    .empty-state__desc { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-2) }

    /* 鏃堕棿鍒楁牱寮?*/
    .time-cell { font-size: var(--font-size-xs); color: var(--text-secondary); text-align: center }
    .time-cell--muted { color: var(--text-muted) }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>
  <div class="dashboard-container" id="detail-app">
    <div class="container detail-container" id="main-content" role="main" aria-label="鎶曟斁鏄庣粏涓庢晥鏋滆拷婧?>
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">鎶曟斁鏄庣粏</h1>
          <p class="ds-page-header__subtitle">杩芥函鍚勪紭鎯犲埜妯℃澘鐨勫彂鏀炬儏鍐典笌鏁堟灉</p>
        </div>
      </header>

      <!-- 妯℃澘閫夋嫨 -->
      <div class="select-panel">
        <div class="select-panel__label">閫夋嫨妯℃澘锛?/div>
        <div class="select-panel__select">
          <el-select v-model="templateId" placeholder="璇烽€夋嫨浼樻儬鍒告ā鏉? filterable style="width: 100%" @change="onTemplateChange" aria-label="閫夋嫨浼樻儬鍒告ā鏉?>
            <el-option
              v-for="t in templateOptions"
              :key="t.value"
              :label="t.label"
              :value="t.value"
              :disabled="t.status !== 1"
            >
              <span>{{ t.label }}</span>
              <span style="display:flex; flex-direction:column; align-items:flex-end; margin-left:8px">
                鎬绘暟 {{ t.totalCount }} / 鍓╀綑 {{ t.remainCount }}
              </span>
            </el-option>
          </el-select>
          <div class="select-panel__tip">璇烽€夋嫨宸插惎鐢ㄧ殑浼樻儬鍒告ā鏉挎煡璇㈡姇鏀炬槑缁嗕笌鏁堟灉</div>
        </div>
        <el-button type="primary" size="small" @click="onTemplateChange" class="select-panel__btn">鏌ヨ</el-button>
        <el-button size="small" @click="loadTemplates">鍒锋柊鍒楄〃</el-button>
      </div>

      <!-- 鏁版嵁鍖猴紙浠呴€夋嫨妯℃澘鍚庢樉绀猴級 -->
      <div v-if="selected">

        <!-- 鏁堟灉鎸囨爣鍗?-->
        <div class="effect-grid" v-loading="effectLoading">
          <div class="effect-card primary">
            <div class="effect-card__label">鍙戞斁鐜?/div>
            <div class="effect-card__value">{{ effectData.issueRate }}</div>
            <div class="effect-card__sub">{{ effectData.issuedCount }} / {{ effectData.totalCount }}</div>
          </div>
          <div class="effect-card success">
            <div class="effect-card__label">浣跨敤鐜?/div>
            <div class="effect-card__value">{{ effectData.usageRate }}</div>
            <div class="effect-card__sub">{{ effectData.usedCount }} / {{ effectData.issuedCount }}</div>
          </div>
          <div class="effect-card warning">
            <div class="effect-card__label">娲昏穬鐜?/div>
            <div class="effect-card__value">{{ effectData.activeRate }}</div>
            <div class="effect-card__sub">{{ effectData.usedCount }} / {{ effectData.totalCount }}</div>
          </div>
          <div class="effect-card danger">
            <div class="effect-card__label">浼樻儬鎬婚</div>
            <div class="effect-card__value">
              楼{{ effectData.discountAmount | toDecimal }}
            </div>
            <div class="effect-card__sub">鏉′欢 楼{{ effectData.conditionAmount | toDecimal }}</div>
          </div>
        </div>

        <!-- 鐘舵€佸垎甯?-->
        <div class="status-grid">
          <div class="status-card">
            <span class="status-card__label">宸蹭娇鐢?/span>
            <span class="status-card__value status-card__value--used">{{ effectData.usedCount }}</span>
          </div>
          <div class="status-card">
            <span class="status-card__label">鏈娇鐢?/span>
            <span class="status-card__value status-card__value--unused">{{ effectData.unusedCount }}</span>
          </div>
          <div class="status-card">
            <span class="status-card__label">宸茶繃鏈?/span>
            <span class="status-card__value status-card__value--expired">{{ effectData.expiredCount }}</span>
          </div>
        </div>

        <!-- 鍙戞斁浼氬憳鏄庣粏琛ㄦ牸 -->
        <crud-table
          ref="crudTable"
          :data="tableData"
          :columns="columns"
          :loading="tableLoading"
          :page="page"
          :page-size="pageSize"
          :total="counts"
          @page-change="onPageChange"
          @size-change="onSizeChange"
        >
          <template #col-couponStatus="{ row }">
            <el-tag
              :type="row.couponStatus === 'used' ? 'success' : row.couponStatus === 'unused' ? 'warning' : 'info'"
              size="small"
            >
              {{ statusLabel(row.couponStatus) }}
            </el-tag>
          </template>
        </crud-table>
      </div>

      <!-- 鏈€夋嫨妯℃澘鎻愮ず -->
      <div v-else class="empty-state">
        <div class="empty-state__icon">馃搳</div>
        <div>璇烽€夋嫨浼樻儬鍒告ā鏉挎煡鐪嬫姇鏀炬槑缁嗕笌鏁堟灉</div>
        <div class="empty-state__desc">鏀寔杩芥函鍙戞斁鎬绘暟銆佷娇鐢ㄥ垎甯冦€佷細鍛樻槑缁?/div>
      </div>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/member-center.js"></script>
  <script>
    new Vue({
      el: '#detail-app',
      data() {
        return {
          templateId: null,
          templateOptions: [],
          selected: false,
          // 鎶曟斁鏁堟灉
          effectLoading: false,
          effectData: {
            totalCount: 0, remainCount: 0, issuedCount: 0,
            usedCount: 0, unusedCount: 0, expiredCount: 0,
            issueRate: '0%', usageRate: '0%', activeRate: '0%',
            discountAmount: 0, conditionAmount: 0
          },
          // 浼氬憳鏄庣粏琛ㄦ牸
          tableLoading: false,
          page: 1,
          pageSize: 10,
          counts: 0,
          tableData: [],
          columns: [
            { prop: 'memberName', label: '浼氬憳濮撳悕', width: 110 },
            { prop: 'memberPhone', label: '浼氬憳鎵嬫満', width: 140 },
            { prop: 'levelName', label: '浼氬憳绛夌骇', width: 110 },
            { prop: 'couponStatus', label: '鐢ㄥ埜鐘舵€?, slot: true, width: 100, align: 'center' },
            { prop: 'createdTime', label: '棰嗗彇鏃堕棿', width: 180, align: 'center',
              formatter: function(row) { return row.createdTime || '-' } },
            { prop: 'usedTime', label: '浣跨敤鏃堕棿', width: 180, align: 'center',
              formatter: function(row) { return row.usedTime || '-' } },
            { prop: 'expireTime', label: '杩囨湡鏃堕棿', width: 180, align: 'center',
              formatter: function(row) { return row.expireTime || '-' } }
          ]
        }
      },
      created() {
        this.loadTemplates()
      },
      filters: {
        toDecimal(val) {
          if (val == null) return '0.00'
          return Number(val).toFixed(2)
        }
      },
      methods: {
        statusLabel(status) {
          if (status === 'used') return '宸蹭娇鐢?
          if (status === 'unused') return '鏈娇鐢?
          if (status === 'expired') return '宸茶繃鏈?
          return status || '-'
        },
        async loadTemplates() {
          try {
            const res = await couponTemplateList()
            if (String(res.code) === '1') {
              const records = res.data.records || []
              this.templateOptions = records.map(function(t) {
                return {
                  value: t.id,
                  label: t.name,
                  totalCount: t.totalCount || 0,
                  remainCount: t.remainCount || 0,
                  status: t.status
                }
              })
            }
          } catch (e) {
            console.warn('鍔犺浇妯℃澘鍒楄〃澶辫触:', e)
          }
        },
        onTemplateChange() {
          if (!this.templateId) {
            this.selected = false
            return
          }
          this.selected = true
          this.page = 1
          this.loadEffect()
          this.loadTable()
        },
        async loadEffect() {
          if (!this.templateId) return
          this.effectLoading = true
          try {
            const res = await couponEffect(this.templateId)
            if (String(res.code) === '1' && res.data) {
              const d = res.data
              this.effectData = {
                totalCount: d.totalCount || 0,
                remainCount: d.remainCount || 0,
                issuedCount: d.issuedCount || 0,
                usedCount: d.usedCount || 0,
                unusedCount: d.unusedCount || 0,
                expiredCount: d.expiredCount || 0,
                issueRate: d.issueRate || '0%',
                usageRate: d.usageRate || '0%',
                activeRate: d.activeRate || '0%',
                discountAmount: d.discountAmount || 0,
                conditionAmount: d.conditionAmount || 0
              }
            }
          } catch (e) {
            console.warn('鍔犺浇鎶曟斁鏁堟灉澶辫触:', e)
          } finally {
            this.effectLoading = false
          }
        },
        async loadTable() {
          if (!this.templateId) return
          this.tableLoading = true
          try {
            var params = {
              page: this.page,
              pageSize: this.pageSize
            }
            const res = await couponIssued(this.templateId, params)
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
            } else {
              this.tableData = []
              this.counts = 0
              ReggieUI.error(res.msg || '鍔犺浇澶辫触')
            }
          } catch (e) {
            console.warn('鍔犺浇浼氬憳鏄庣粏澶辫触:', e)
          } finally {
            this.tableLoading = false
          }
        },
        onPageChange(payload) {
          this.page = payload.page
          this.loadTable()
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.loadTable()
        }
      }
    })
  </script>
</body>
</html>
