<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
    .info-box { margin: -15px -44px 20px; }
    .info-box .item-box { display: flex; height: 20px; line-height: 20px; font-size: 14px; font-weight: 400; color: #666666; text-align: left; margin-bottom: 14px; }
    .info-box .item-box:last-child { margin-bottom: 0; }
    .info-box .item-box .label { width: 96px; }
    .info-box .item-box .des { flex: 1; color: #333333; }
  </style>
</head>
<body>
  <div class="dashboard-container" id="member-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        @search="onSearch"
        @reset="onReset"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="200"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-balance="{ row }">
          <span>￥{{ row.balance }}</span>
        </template>
        <template #col-totalConsumption="{ row }">
          <span>￥{{ row.totalConsumption }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="viewDetail(row)">查看详情</el-button>
          <el-button type="text" size="small" class="btn-view" @click="showRecharge(row)">充值</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 查看详情弹框 -->
    <crud-dialog
      title="会员详情"
      :visible.sync="detailDialogVisible"
      width="500px"
      :show-submit="false"
      cancel-text="关 闭"
    >
      <div class="info-box">
        <div class="item-box"><span class="label">会员名称：</span><span class="des">{{ detail.name }}</span></div>
        <div class="item-box"><span class="label">手机号：</span><span class="des">{{ detail.phone }}</span></div>
        <div class="item-box"><span class="label">会员等级：</span><span class="des">{{ detail.levelName }}</span></div>
        <div class="item-box"><span class="label">积分：</span><span class="des">{{ detail.points }}</span></div>
        <div class="item-box"><span class="label">余额：</span><span class="des">￥{{ detail.balance }}</span></div>
        <div class="item-box"><span class="label">累计消费：</span><span class="des">￥{{ detail.totalConsumption }}</span></div>
        <div class="item-box"><span class="label">注册时间：</span><span class="des">{{ detail.createdTime }}</span></div>
      </div>
    </crud-dialog>

    <!-- 充值弹框 -->
    <crud-dialog
      title="会员充值"
      :visible.sync="rechargeDialogVisible"
      width="500px"
      @submit="submitRecharge"
      @close="rechargeDialogVisible = false"
    >
      <el-form label-width="120px">
        <el-form-item label="会员名称："><span>{{ rechargeMember.name }}</span></el-form-item>
        <el-form-item label="充值金额：">
          <el-input v-model="rechargeForm.amount" type="number" placeholder="请输入充值金额" />
        </el-form-item>
        <el-form-item label="赠送金额：">
          <el-input v-model="rechargeForm.giftAmount" type="number" placeholder="请输入赠送金额" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/member-center.js"></script>
  <script>
    new Vue({
      el: '#member-app',
      data: function() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 搜索条件
          searchConfig: [
            { type: 'input', field: 'name', placeholder: '请输入会员名称', width: '200px' },
            { type: 'input', field: 'phone', placeholder: '请输入手机号', width: '180px', hideSearchIcon: true },
            { type: 'select', field: 'levelId', placeholder: '请选择会员等级', width: '180px',
              options: [] }
          ],
          // 统计卡片配置
          stats: { totalMembers: 0, goldMembers: 0, silverMembers: 0, newMembersThisMonth: 0 },
          activeFilter: '',
          levelOptions: [],
          // 表格列配置
          columns: [
            { prop: 'name', label: '会员名称' },
            { prop: 'phone', label: '手机号' },
            { prop: 'levelName', label: '会员等级' },
            { prop: 'points', label: '积分' },
            { prop: 'balance', label: '余额', slot: true },
            { prop: 'totalConsumption', label: '累计消费', slot: true },
            { prop: 'createdTime', label: '注册时间' }
          ],
          // 弹窗数据
          detailDialogVisible: false,
          detail: {},
          rechargeDialogVisible: false,
          rechargeMember: {},
          rechargeForm: { amount: '', giftAmount: '0' },
          // 缓存搜索参数
          searchInput: { name: '', phone: '', levelId: '' }
        }
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: 'all', icon: '👥', label: '会员总数', value: self.stats.totalMembers, color: 'primary', clickable: true, active: self.activeFilter === 'all' },
            { key: 'gold', icon: '⭐', label: '金牌会员', value: self.stats.goldMembers, color: 'success', clickable: true, active: self.activeFilter === 'gold' },
            { key: 'silver', icon: '🥈', label: '银牌会员', value: self.stats.silverMembers, color: 'warning', clickable: true, active: self.activeFilter === 'silver' },
            { key: 'new', icon: '🆕', label: '本月新增', value: self.stats.newMembersThisMonth, color: 'danger' }
          ]
        }
      },
      created: function() {
        this.init()
        this.loadLevels()
      },
      methods: {
        async init() {
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            name: this.searchInput.name || undefined,
            phone: this.searchInput.phone || undefined,
            levelId: this.searchInput.levelId || undefined
          }
          var self = this
          var results = await Promise.all([
            memberPage(params),
            self.loadMemberStats()
          ])
          var memberRes = results[0]
          var statsRes = results[1]
          if (String(memberRes.code) === '1') {
            self.tableData = memberRes.data.records || []
            self.counts = memberRes.data.total
          }
          if (statsRes && String(statsRes.code) === '1') {
            self.stats = statsRes.data || self.stats
          }
        },
        async loadMemberStats() {
          try {
            var res = await memberPage({ page: 1, pageSize: 1000 })
            var levelRes = await levelPage({ page: 1, pageSize: 100 })
            if (String(res.code) === '1') {
              var records = res.data.records || []
              var total = res.data.total || 0
              var goldLevelIds = []
              var silverLevelIds = []
              if (levelRes.code === 1) {
                var levels = levelRes.data.records || []
                goldLevelIds = levels.filter(function(l) { return l.name && l.name.indexOf('黄金') !== -1 }).map(function(l) { return l.id })
                silverLevelIds = levels.filter(function(l) { return l.name && (l.name.indexOf('白银') !== -1 || l.name.indexOf('银牌') !== -1) }).map(function(l) { return l.id })
              }
              var goldCount = records.filter(function(m) { return goldLevelIds.indexOf(m.levelId) !== -1 }).length
              var silverCount = records.filter(function(m) { return silverLevelIds.indexOf(m.levelId) !== -1 }).length
              var now = new Date()
              var thisMonth = records.filter(function(m) {
                if (!m.createdTime) return false
                var created = new Date(m.createdTime)
                return created.getMonth() === now.getMonth() && created.getFullYear() === now.getFullYear()
              }).length
              return { code: 1, data: { totalMembers: total, goldMembers: goldCount, silverMembers: silverCount, newMembersThisMonth: thisMonth } }
            }
          } catch (err) { console.warn('加载会员统计数据失败:', err) }
          return { code: 0 }
        },
        loadLevels: function() {
          var self = this
          levelPage({ page: 1, pageSize: 100 }).then(function(res) {
            if (String(res.code) === '1') {
              self.levelOptions = res.data.records || []
              // 同步选项到 searchConfig
              self.searchConfig[2].options = self.levelOptions.map(function(l) { return { label: l.name, value: l.id } })
            }
          }).catch(function(err) { self.$message.error('请求失败：' + err) })
        },
        // stat-cards 点击回调
        onCardClick: function(payload) {
          if (!payload.activeKey) {
            this.activeFilter = ''
            this.searchInput.levelId = ''
          } else if (payload.key === 'all') {
            this.activeFilter = 'all'
            this.searchInput.levelId = ''
          } else if (payload.key === 'gold') {
            this.activeFilter = 'gold'
            var goldLevel = this.levelOptions.find(function(l) { return l.name && l.name.indexOf('黄金') !== -1 })
            this.searchInput.levelId = goldLevel ? goldLevel.id : ''
          } else if (payload.key === 'silver') {
            this.activeFilter = 'silver'
            var silverLevel = this.levelOptions.find(function(l) { return l.name && (l.name.indexOf('白银') !== -1 || l.name.indexOf('银牌') !== -1) })
            this.searchInput.levelId = silverLevel ? silverLevel.id : ''
          }
          this.searchInput.name = ''
          this.searchInput.phone = ''
          this.page = 1
          this.init()
        },
        // table-bar 回调
        onSearch: function(searchParams) {
          this.searchInput = { name: searchParams.name || '', phone: searchParams.phone || '', levelId: searchParams.levelId || '' }
          this.activeFilter = ''
          this.page = 1
          this.init()
        },
        onReset: function() {
          this.searchInput = { name: '', phone: '', levelId: '' }
          this.activeFilter = ''
          this.page = 1
          this.init()
        },
        onPageChange: function(payload) {
          this.page = payload.page
          this.init()
        },
        onSizeChange: function(payload) {
          this.pageSize = payload.pageSize
          this.init()
        },
        viewDetail: function(row) {
          var self = this
          getMember(row.id).then(function(res) {
            if (String(res.code) === '1') { self.detail = res.data; self.detailDialogVisible = true }
            else { self.$message.error(res.msg || '操作失败') }
          }).catch(function(err) { self.$message.error('请求失败：' + err) })
        },
        showRecharge: function(row) {
          this.rechargeMember = row
          this.rechargeForm = { amount: '', giftAmount: '0' }
          this.rechargeDialogVisible = true
        },
        submitRecharge: function() {
          if (!this.rechargeForm.amount || this.rechargeForm.amount <= 0) { this.$message.error('请输入有效的充值金额'); return }
          var self = this
          memberRecharge({
            memberId: self.rechargeMember.id,
            amount: self.rechargeForm.amount,
            giftAmount: self.rechargeForm.giftAmount || 0
          }).then(function(res) {
            if (res.code === 1) { self.$message.success('充值成功！'); self.rechargeDialogVisible = false; self.init() }
            else { self.$message.error(res.msg || '操作失败') }
          }).catch(function(err) { self.$message.error('请求失败：' + err) })
        }
      }
    })
  </script>
</body>
</html>
