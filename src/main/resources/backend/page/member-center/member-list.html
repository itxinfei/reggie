<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    .search-btn { margin-left: 10px; }
    .tableBar { justify-content: flex-start !important; }
    .info-box { margin: -15px -44px 20px; }
    .info-box .item-box { display: flex; height: 20px; line-height: 20px; font-size: 14px; font-weight: 400; color: #666666; text-align: left; margin-bottom: 14px; }
    .info-box .item-box:last-child { margin-bottom: 0; }
    .info-box .item-box .label { width: 96px; }
    .info-box .item-box .des { flex: 1; color: #333333; }
  </style>
</head>
<body>
  <div class="dashboard-container" id="member-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="input.name" placeholder="请输入会员名称" style="width: 200px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-input v-model="input.phone" placeholder="请输入手机号" style="width: 200px; margin-left: 10px" clearable @keyup.enter.native="handleQuery"></el-input>
        <el-select v-model="input.levelId" placeholder="请选择会员等级" style="width: 200px; margin-left: 10px" clearable @change="handleQuery">
          <el-option v-for="item in levelOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
        </el-select>
        <el-button type="primary" class="search-btn" @click="handleQuery">查询</el-button>
      </div>
      <el-table :data="tableData" stripe class="tableBox">
        <el-table-column prop="name" label="会员名称"></el-table-column>
        <el-table-column prop="phone" label="手机号"></el-table-column>
        <el-table-column prop="levelName" label="会员等级"></el-table-column>
        <el-table-column prop="points" label="积分"></el-table-column>
        <el-table-column prop="balance" label="余额">
          <template slot-scope="scope">
            <span>￥{{ scope.row.balance }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="totalConsumption" label="累计消费">
          <template slot-scope="scope">
            <span>￥{{ scope.row.totalConsumption }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="createdTime" label="注册时间"></el-table-column>
        <el-table-column label="操作" width="200" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="viewDetail(scope.row)">查看详情</el-button>
            <el-button type="text" size="small" class="blueBug" @click="showRecharge(scope.row)">充值</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 查看详情弹框 -->
    <el-dialog title="会员详情" :visible.sync="detailDialogVisible" width="40%" :before-close="handleClose">
      <div class="info-box">
        <div class="item-box">
          <span class="label">会员名称：</span>
          <span class="des">{{ detail.name }}</span>
        </div>
        <div class="item-box">
          <span class="label">手机号：</span>
          <span class="des">{{ detail.phone }}</span>
        </div>
        <div class="item-box">
          <span class="label">会员等级：</span>
          <span class="des">{{ detail.levelName }}</span>
        </div>
        <div class="item-box">
          <span class="label">积分：</span>
          <span class="des">{{ detail.points }}</span>
        </div>
        <div class="item-box">
          <span class="label">余额：</span>
          <span class="des">￥{{ detail.balance }}</span>
        </div>
        <div class="item-box">
          <span class="label">累计消费：</span>
          <span class="des">￥{{ detail.totalConsumption }}</span>
        </div>
        <div class="item-box">
          <span class="label">注册时间：</span>
          <span class="des">{{ detail.createdTime }}</span>
        </div>
      </div>
    </el-dialog>

    <!-- 充值弹框 -->
    <el-dialog title="会员充值" :visible.sync="rechargeDialogVisible" width="30%" :before-close="handleClose">
      <el-form label-width="100px">
        <el-form-item label="会员名称：">
          <span>{{ rechargeMember.name }}</span>
        </el-form-item>
        <el-form-item label="充值金额：">
          <el-input v-model="rechargeForm.amount" type="number" placeholder="请输入充值金额"></el-input>
        </el-form-item>
        <el-form-item label="赠送金额：">
          <el-input v-model="rechargeForm.giftAmount" type="number" placeholder="请输入赠送金额"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="rechargeDialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitRecharge">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member-center.js"></script>
    <script>
      new Vue({
        el: '#member-app',
        data() {
          return {
            input: { name: '', phone: '', levelId: '' },
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            levelOptions: [],
            detailDialogVisible: false,
            detail: {},
            rechargeDialogVisible: false,
            rechargeMember: {},
            rechargeForm: { amount: '', giftAmount: '0' }
          }
        },
        created() {
          this.init()
          this.loadLevels()
        },
        methods: {
          async init() {
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input.name || undefined,
              phone: this.input.phone || undefined,
              levelId: this.input.levelId || undefined
            }
            await memberPage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          loadLevels() {
            levelPage({ page: 1, pageSize: 100 }).then(res => {
              if (String(res.code) === '1') {
                this.levelOptions = res.data.records || []
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          viewDetail(row) {
            getMember(row.id).then(res => {
              if (String(res.code) === '1') {
                this.detail = res.data
                this.detailDialogVisible = true
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          showRecharge(row) {
            this.rechargeMember = row
            this.rechargeForm = { amount: '', giftAmount: '0' }
            this.rechargeDialogVisible = true
          },
          submitRecharge() {
            if (!this.rechargeForm.amount || this.rechargeForm.amount <= 0) {
              this.$message.error('请输入有效的充值金额')
              return
            }
            memberRecharge({
              memberId: this.rechargeMember.id,
              amount: this.rechargeForm.amount,
              giftAmount: this.rechargeForm.giftAmount || 0
            }).then(res => {
              if (res.code === 1) {
                this.$message.success('充值成功！')
                this.rechargeDialogVisible = false
                this.init()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          handleClose() {
            this.detailDialogVisible = false
            this.rechargeDialogVisible = false
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
