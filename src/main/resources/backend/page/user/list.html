<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="user-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：卡片可点击筛选，点击后自动设置状态筛选项并查询 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterByStatus('')">
          <div class="stat-icon">👥</div>
          <div class="stat-label">用户总数</div>
          <div class="stat-value">{{ stats.totalUsers || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === 1 }" @click="filterByStatus(1)">
          <div class="stat-icon">✅</div>
          <div class="stat-label">正常用户</div>
          <div class="stat-value">{{ stats.activeUsers || 0 }}</div>
        </div>
        <div class="stat-card warning clickable" :class="{ active: activeFilter === 0 }" @click="filterByStatus(0)">
          <div class="stat-icon">🚫</div>
          <div class="stat-label">已禁用</div>
          <div class="stat-value">{{ stats.disabledUsers || 0 }}</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon">🆕</div>
          <div class="stat-label">本月新增</div>
          <div class="stat-value">{{ stats.newUsersThisMonth || 0 }}</div>
        </div>
      </div>

      <!-- 搜索项 -->
      <div class="tableBar">
        <el-input
          v-model="input.name"
          placeholder="请输入用户姓名"
          clearable
          @keyup.enter.native="handleQuery"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="handleQuery"
          ></i>
        </el-input>
        <el-input
          v-model="input.phone"
          placeholder="请输入手机号"
          clearable
          @keyup.enter.native="handleQuery"
        ></el-input>
        <el-select v-model="input.status" placeholder="请选择状态" style="width: 150px" clearable @change="handleQuery">
          <el-option label="正常" :value="1"></el-option>
          <el-option label="禁用" :value="0"></el-option>
        </el-select>
        <el-button type="primary" @click="handleQuery">查询</el-button>
        <el-button @click="reset">重置</el-button>
      </div>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
      >
        <el-table-column
          prop="name"
          label="姓名"
        ></el-table-column>
        <el-table-column
          prop="phone"
          label="手机号"
        ></el-table-column>
        <el-table-column
          prop="sex"
          label="性别"
        >
          <template slot-scope="scope">
            {{ scope.row.sex === '1' ? '男' : scope.row.sex === '0' ? '女' : '未知' }}
          </template>
        </el-table-column>
        <el-table-column
          prop="idNumber"
          label="身份证号"
          show-overflow-tooltip
        ></el-table-column>
        <el-table-column label="头像" align="center" width="80">
          <template slot-scope="scope">
            <el-image
              v-if="scope.row.avatar"
              style="width: 50px; height: 50px; border-radius: 50%;"
              :src="scope.row.avatar"
              fit="cover"
            ></el-image>
            <span v-else>-</span>
          </template>
        </el-table-column>
        <el-table-column label="状态" align="center" width="100">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status == 1 ? 'success' : 'danger'" size="small">
              {{ scope.row.status == 1 ? '正常' : '禁用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column
          prop="createTime"
          label="注册时间"
          width="160"
        ></el-table-column>
        <el-table-column label="操作" align="center" width="160">
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="statusHandle(scope.row)"
            >{{ scope.row.status == 1 ? '禁用' : '启用' }}</el-button>
            <el-button
              type="text"
              size="small"
              class="delBut non"
              @click="deleteHandle(scope.row.id)"
            >删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 禁用/启用确认对话框 -->
    <el-dialog
      :title="statusDialog.title"
      :visible.sync="statusDialog.visible"
      width="30%"
      :before-close="handleStatusClose"
    >
      <span>{{ statusDialog.message }}</span>
      <span slot="footer" class="dialog-footer">
        <el-button @click="handleStatusClose">取 消</el-button>
        <el-button type="primary" @click="confirmStatus">确 定</el-button>
      </span>
    </el-dialog>
  </div>

  <!-- JS依赖 -->
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script>
    new Vue({
      el: '#user-app',
      data() {
        return {
          input: {
            name: '',
            phone: '',
            status: null  // 修改点：初始值改为null，避免空字符串引发参数类型问题
          },
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          loading: false,
          // 数据统计
          stats: {
            totalUsers: 0,
            activeUsers: 0,
            disabledUsers: 0,
            newUsersThisMonth: 0
          },
          // 修改点：当前激活的筛选器值，对应 stats-card
          activeFilter: '',
          // 状态切换对话框
          statusDialog: {
            visible: false,
            title: '',
            message: '',
            userId: null,
            newStatus: null
          }
        }
      },
      created() {
        this.init()
      },
      mounted() {
      },
      methods: {
        // 初始化加载
        async init () {
          this.loading = true
          // 并行加载用户列表和统计数据
          const [userRes, statsRes] = await Promise.all([
            this.getUserPage(),
            this.loadUserStats()
          ])

          // 处理用户列表数据
          if (String(userRes.code) === '1') {
            this.tableData = userRes.data.records || []
            this.counts = userRes.data.total
          } else {
            this.$message.error(userRes.msg || '查询失败')
          }

          // 处理统计数据
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }

          this.loading = false
        },

        // 获取用户分页列表
        async getUserPage() {
          try {
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input.name || undefined,
              phone: this.input.phone || undefined,
              status: this.input.status != null ? this.input.status : undefined  // 修改点：适配null初始值
            }
            const res = await $axios.get('/user/page', { params })
            return res
          } catch (err) {
            this.$message.error('请求失败：' + err)
            return { code: 0, msg: '请求失败' }
          }
        },

        // 加载用户统计数据
        // 修改点：/user/stats 接口不存在，改用 /user/page 获取全量数据后前端计算
        async loadUserStats() {
          try {
            const res = await $axios.get('/user/page', { params: { page: 1, pageSize: 1000 } })
            if (String(res.code) === '1') {
              const records = res.data.records || []
              const total = res.data.total || 0
              // 后端 User.status 为 Integer，JSON 序列化为数字 1/0
              const activeCount = records.filter(item => item.status === 1).length
              const disabledCount = records.filter(item => item.status === 0).length
              // 本月新增
              const now = new Date()
              const newThisMonth = records.filter(function(m) {
                if (!m.createTime) return false
                const created = new Date(m.createTime)
                return created.getMonth() === now.getMonth() && created.getFullYear() === now.getFullYear()
              }).length
              return {
                code: 1,
                data: {
                  totalUsers: total,
                  activeUsers: activeCount,
                  disabledUsers: disabledCount,
                  newUsersThisMonth: newThisMonth
                }
              }
            }
          } catch (err) {
            console.warn('加载用户统计数据失败:', err)
          }
          return { code: 0 }
        },

          // 查询
        handleQuery() {
          // 修改点：搜索时清空卡片筛选状态并复位状态下拉
          this.activeFilter = ''
          this.input.status = null
          this.page = 1;
          this.init();
        },
        // 重置搜索条件，恢复表格初始状态
        reset() {
          this.input.name = ''
          this.input.phone = ''
          this.input.status = null
          this.activeFilter = ''
          this.page = 1
          this.init()
        },
        // 修改点：stats-card 点击切换筛选状态（同步修改 search 区域的 status 下拉框，清空其他搜索）
        filterByStatus(status) {
          if (this.activeFilter === status) {
            this.activeFilter = ''
            this.input.status = null
          } else {
            this.activeFilter = status
            this.input.status = status
          }
          // 修改点：卡片筛选时清空姓名/手机搜索条件
          this.input.name = ''
          this.input.phone = ''
          this.page = 1
          this.init()
        },

        // 状态切换（禁用/启用）
        statusHandle(row) {
          this.statusDialog.userId = row.id
          this.statusDialog.newStatus = row.status == 1 ? 0 : 1
          this.statusDialog.title = this.statusDialog.newStatus == 0 ? '禁用用户' : '启用用户'
          this.statusDialog.message = `确认要${this.statusDialog.title}「${row.name}」吗？`
          this.statusDialog.visible = true
        },

        // 确认状态切换
        async confirmStatus() {
          try {
            const res = await $axios.put('/user/status', null, {
              params: {
                id: this.statusDialog.userId,
                status: this.statusDialog.newStatus
              }
            })
            if (String(res.code) === '1') {
              this.$message.success(res.msg || '操作成功')
              this.handleStatusClose()
              this.init()
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          } catch (err) {
            this.$message.error('请求失败：' + err)
          }
        },

        // 关闭状态对话框
        handleStatusClose() {
          this.statusDialog.visible = false
          this.statusDialog.userId = null
          this.statusDialog.newStatus = null
        },

        // 删除用户
        deleteHandle(id) {
          this.$confirm('确认删除该用户吗？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(async () => {
            try {
              const res = await $axios.delete('/user', {
                params: { id }
              })
              if (String(res.code) === '1') {
                this.$message.success('删除成功')
                this.init()
              } else {
                this.$message.error(res.msg || '删除失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
          }).catch(() => {})
        },

        // 分页
        handleSizeChange (val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange (val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
