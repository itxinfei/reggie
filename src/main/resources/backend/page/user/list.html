<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->

  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="user-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">用户管理</h1>
          <p class="ds-page-header__subtitle">管理C端注册用户与账号状态</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 修改点：使用 <stat-cards> 统一组件，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件 -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="actionConfig"
        @search="handleQuery"
        @reset="reset"
        @action="onAction">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="请选择用户姓名" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading" :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')" @visible-change="onFilterDropdownVisible">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
          <el-select v-model="input.phone" placeholder="请选择手机号" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading" :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')" @visible-change="onFilterDropdownVisible">
            <el-option v-for="p in filterOptions.phones" :key="p" :label="p" :value="p"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination，columns 配置化，内置分页 -->
      <crud-table
        empty-hint="试试调整筛选条件"
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="240"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-sex="{ row }">
          {{ row.sex === '1' ? '男' : row.sex === '0' ? '女' : '未知' }}
        </template>
        <template #col-idNumber="{ row }">
          <span v-if="row.idNumber">{{ maskIdNumber(row.idNumber) }}</span>
          <span v-else>-</span>
        </template>
        <template #col-avatar="{ row }">
          <el-image
            v-if="row.avatar"
            style="width: 50px; height: 50px; border-radius: 50%;"
            :src="row.avatar"
            fit="cover"
            alt="用户头像"
          ></el-image>
          <span v-else>-</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status == 1 ? 'success' : 'danger'" size="small">
            {{ row.status == 1 ? '正常' : '禁用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button
            type="text"
            size="small"
            class="btn-view"
            @click="statusHandle(row)"
          >{{ row.status == 1 ? '禁用' : '启用' }}</el-button>
          <el-button
            type="text"
            size="small"
            class="btn-delete"
            @click="deleteHandle(row.id)"
          >删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 修改点：使用 <crud-dialog :show-submit="true" :show-cancel="true"> 统一组件替代手写 el-dialog，默认 footer 提供"取消/确定" -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      :title="statusDialog.title"
      :visible.sync="statusDialog.visible"
      :submit-loading="submitting"
      size="sm"
      @submit="confirmStatus"
      @close="handleStatusClose"
    >
      <span>{{ statusDialog.message }}</span>
    </crud-dialog>
  </div>

  <!-- JS依赖 -->
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/user.js"></script>
  <script src="../../api/export.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#user-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
      data() {
        return {
          submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
          input: {
            name: '',
            phone: '',
            status: null  // 修改点：初始值改为null，避免空字符串引发参数类型问题
          },
          // 修改点：搜索下拉框动态选项（从数据库加载用户姓名和手机号）
          filterOptions: { names: [], phones: [] },
          optionsLoading: false,
          optionsLoadError: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          loading: false,
          // 数据统计
          stats: {
            totalUsers: 0,
            activeUsers: 0,
            disabledUsers: 0,
            newUsersThisMonth: 0
          },
          // 修改点：当前激活的筛选器值，对应 <stat-cards> 组件
          activeFilter: '',
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [
            { type: 'select', field: 'status', placeholder: '用户状态', options: [
              { label: '全部', value: '' },
              { label: '正常', value: '1' },
              { label: '禁用', value: '0' }
            ], width: 130 }
          ],
          tableActions: [],
          // 修改点：列表操作区按钮（导出），与 table-bar 的 @action 事件联动
          actionConfig: [
            { key: 'exportExcel', text: '导出Excel', type: 'success', icon: 'el-icon-download' },
            { key: 'exportPdf', text: '导出PDF', type: 'danger', icon: 'el-icon-document' }
          ],
          // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
          columns: [
            { prop: 'name', label: '姓名', width: 80 },
            { prop: 'phone', label: '手机号', width: 120, align: 'center' },
            { prop: 'sex', label: '性别', width: 60, align: 'center', slot: true },
            { prop: 'idNumber', label: '身份证号', minWidth: 150 },
            { prop: 'status', label: '状态', width: 70, align: 'center', slot: true },
            { prop: 'createTime', label: '注册时间', width: 160, align: 'center' }
          ],
          // 状态切换对话框
          statusDialog: {
            visible: false,
            title: '',
            message: '',
            userId: null,
            newStatus: null
          }
        }
      },
      created() {
        this.loadFilterOptions()
        this.fetchData()
        // 修改点：F9 — 全局统计仅初始化加载一次，避免翻页/筛选重复请求
        this.loadUserStats()
      },
      mounted() {
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          const self = this;
          return [
            { key: '', icon: 'ri-group-line', label: '用户总数', value: self.stats.totalUsers || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: '1', icon: 'ri-checkbox-circle-line', label: '正常用户', value: self.stats.activeUsers || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
            { key: '0', icon: 'ri-forbid-line', label: '已禁用', value: self.stats.disabledUsers || 0, color: 'warning', clickable: true, active: self.activeFilter === '0' },
            { key: 'new', icon: 'ri-user-add-line', label: '本月新增', value: self.stats.newUsersThisMonth || 0, color: 'danger' }
          ]
        }
      },
      methods: {
        // 身份证号脱敏：保留前6位和后4位
        maskIdNumber: function(idNumber) {
          if (!idNumber || idNumber.length < 10) return idNumber
          return idNumber.substring(0, 6) + '********' + idNumber.substring(idNumber.length - 4)
        },
        // 修改点：<stat-cards> 组件统一卡片点击分发
        // <stat-cards> 点击（使用 payload.activeKey 判断，避免 .sync 导致的 toggle 反转）
        onCardClick: function(payload) {
          const s = this.lastSearch || {}
          if (payload.activeKey !== '' && payload.activeKey != null) {
            // 有激活卡片：按卡片 key 过滤
            this.lastSearch = { status: payload.activeKey === '' ? undefined : Number(payload.activeKey) }
          } else {
            // 全部（无筛选）
            this.lastSearch = {}
          }
          this.input.name = ''
          this.input.phone = ''
          this.page = 1
          this.fetchData()
        },
        // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await userOptions()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.names || []
              this.filterOptions.phones = res.data.phones || []
            } else {
              this.optionsLoadError = true
              ReggieUI.warning('加载用户选项失败：' + (res.msg || '接口返回异常'))
            }
          } catch (err) {
            // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
            if (err.message === 'NOTLOGIN') {
              return
            }
            this.optionsLoadError = true
            ReggieUI.error('加载筛选选项失败，请刷新页面重试')
          } finally {
            this.optionsLoading = false
          }
        },
        // 修改点：下拉框打开时若之前加载失败，自动重试
        onFilterDropdownVisible(visible) {
            if (visible && this.optionsLoadError) {
                this.loadFilterOptions()
            }
        },
        // 初始化加载
        async fetchData() {
          this.loading = true
          try {
            // 修改点：F9 性能 — 列表查询与全局统计分离，此处仅加载分页列表
            const userRes = await this.getUserPage()
            if (String(userRes.code) === '1') {
              this.tableData = userRes.data.records || []
              this.counts = userRes.data.total
            } else {
              ReggieUI.error(userRes.msg || '查询失败')
            }
          } catch (err) {
            ReggieUI.error('请求失败：' + err)
          } finally {
            this.loading = false
          }
        },

        // 修改点：F9 性能 — 列表 + 全局统计一起刷新，仅用于数据突变（启用/禁用、删除）后
        async refreshAll() {
          await Promise.all([this.fetchData(), this.loadUserStats()])
        },

        // 获取用户分页列表（优先使用 lastSearch，回退到 input）
        async getUserPage() {
          try {
            const s = this.lastSearch || {};
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: s.name || this.input.name || undefined,
              phone: s.phone || this.input.phone || undefined,
              status: s.status != null ? (s.status === '' ? undefined : Number(s.status)) : (this.input.status != null ? this.input.status : undefined)
            }
            return await userPage(params)
          } catch (err) {
            // 修改点：异常不在 getter 内弹错——fetchData 会基于 {code:0} 的返回统一提示一次，
            // 此处再弹会与 else 分支的双重 toast 叠加，网络失败时用户看到两次相同错误
            return { code: 0, msg: '请求失败：' + (err.message || err) }
          }
        },

        // 加载用户统计数据
        // 修改点：改为调用后端 /user/stats 聚合接口（count 查询），避免 pageSize:1000 全量拉取与截断风险
        async loadUserStats() {
          try {
            const res = await userStats()
            if (String(res.code) === '1') {
              this.stats = res.data
              return res
            }
          } catch (err) {
            console.warn('加载用户统计数据失败:', err)
          }
          return { code: 0 }
        },

        // 查询（由 <table-bar> @search 触发，searchParams 包含 table-bar 管理的搜索条件）
        handleQuery(searchParams) {
          this.activeFilter = ''
          this.page = 1
          this.lastSearch = Object.assign({}, searchParams, {
            name: this.input.name || undefined,
            phone: this.input.phone || undefined
          })
          this.fetchData()
        },
        // 重置搜索条件，恢复表格初始状态
        reset() {
          this.input.name = ''
          this.input.phone = ''
          this.input.status = null
          this.activeFilter = ''
          this.page = 1
          this.fetchData()
        },
        // filterByStatus 已迁移至 onCardClick

        // 状态切换（禁用/启用）
        statusHandle(row) {
          this.statusDialog.userId = row.id
          this.statusDialog.newStatus = row.status == 1 ? 0 : 1
          this.statusDialog.title = this.statusDialog.newStatus == 0 ? '禁用用户' : '启用用户'
          this.statusDialog.message = `确认要${this.statusDialog.title}「${row.name}」吗？`
          this.statusDialog.visible = true
        },

        // 确认状态切换
        async confirmStatus() {
          if (this.submitting) return // 提交防重
          this.submitting = true
          try {
            const res = await userStatus({
              id: this.statusDialog.userId,
              status: this.statusDialog.newStatus
            })
            this.submitting = false
            if (String(res.code) === '1') {
              ReggieUI.success(res.msg || '操作成功')
              this.handleStatusClose()
              this.refreshAll()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } catch (err) {
            this.submitting = false
            ReggieUI.error('请求失败：' + err)
          }
        },

        // 关闭状态对话框
        handleStatusClose() {
          this.statusDialog.visible = false
          this.statusDialog.userId = null
          this.statusDialog.newStatus = null
        },

        // 删除用户
        deleteHandle(id) {
          ReggieUI.confirm('确认删除该用户吗？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(async () => {
            try {
              const res = await userDelete(id)
              if (String(res.code) === '1') {
                ReggieUI.success('删除成功')
                this.refreshAll()
              } else {
                ReggieUI.error(res.msg || '删除失败')
              }
            } catch (err) {
              ReggieUI.error('请求失败：' + err)
            }
          }).catch((err) => { console.warn('[user] 删除用户操作取消或失败:', err) })
        },

        // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除

        // 列表操作区按钮分发（导出Excel/PDF）
        onAction: function(payload) {
          if (payload.key === 'exportExcel') this.exportUsers('excel')
          else if (payload.key === 'exportPdf') this.exportUsers('pdf')
        },
        // 导出C端用户数据（Excel/PDF）
        exportUsers: async function(format) {
          try {
            const ext = format === 'excel' ? 'xlsx' : 'pdf'
            const apiCall = format === 'excel' ? exportApi.exportUsersExcel({}) : exportApi.exportUsersPdf({})
            await exportApi.downloadFile(apiCall, '用户数据.' + ext)
            ReggieUI.success('导出成功，文件已开始下载')
          } catch (err) {
            ReggieUI.error('导出失败：' + (err.message || err))
          }
        }
      }
    })
  </script>
</body>
</html>
