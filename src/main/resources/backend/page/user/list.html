<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="user-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件 -->
      <table-bar
        :search-items="tableSearchItems"
        @search="handleQuery"
        @reset="reset">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="请选择用户姓名" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading" :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')" @visible-change="onFilterDropdownVisible">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
          <el-select v-model="input.phone" placeholder="请选择手机号" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading" :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')" @visible-change="onFilterDropdownVisible">
            <el-option v-for="p in filterOptions.phones" :key="p" :label="p" :value="p"></el-option>
          </el-select>
        </template>
      </table-bar>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
      >
        <el-table-column
          prop="name"
          label="姓名"
        ></el-table-column>
        <el-table-column
          prop="phone"
          label="手机号"
        ></el-table-column>
        <el-table-column
          prop="sex"
          label="性别"
        >
          <template slot-scope="scope">
            {{ scope.row.sex === '1' ? '男' : scope.row.sex === '0' ? '女' : '未知' }}
          </template>
        </el-table-column>
        <el-table-column label="身份证号" show-overflow-tooltip>
          <template slot-scope="scope">
            <span v-if="scope.row.idNumber">{{ maskIdNumber(scope.row.idNumber) }}</span>
            <span v-else>-</span>
          </template>
        </el-table-column>
        <el-table-column label="头像" align="center" width="80">
          <template slot-scope="scope">
            <el-image
              v-if="scope.row.avatar"
              style="width: 50px; height: 50px; border-radius: 50%;"
              :src="scope.row.avatar"
              fit="cover"
            ></el-image>
            <span v-else>-</span>
          </template>
        </el-table-column>
        <el-table-column label="状态" align="center" width="100">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status == 1 ? 'success' : 'danger'" size="small">
              {{ scope.row.status == 1 ? '正常' : '禁用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column
          prop="createTime"
          label="注册时间"
          width="160"
        ></el-table-column>
        <el-table-column label="操作" align="center" width="160">
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="btn-view"
              @click="statusHandle(scope.row)"
            >{{ scope.row.status == 1 ? '禁用' : '启用' }}</el-button>
            <el-button
              type="text"
              size="small"
              class="btn-delete"
              @click="deleteHandle(scope.row.id)"
            >删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 禁用/启用确认对话框 -->
    <el-dialog
      :title="statusDialog.title"
      :visible.sync="statusDialog.visible"
      width="30%"
      :before-close="handleStatusClose"
    >
      <span>{{ statusDialog.message }}</span>
      <span slot="footer" class="dialog-footer">
        <el-button @click="handleStatusClose">取 消</el-button>
        <el-button type="primary" @click="confirmStatus">确 定</el-button>
      </span>
    </el-dialog>
  </div>

  <!-- JS依赖 -->
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#user-app',
      data() {
        return {
          input: {
            name: '',
            phone: '',
            status: null  // 修改点：初始值改为null，避免空字符串引发参数类型问题
          },
          // 修改点：搜索下拉框动态选项（从数据库加载用户姓名和手机号）
          filterOptions: { names: [], phones: [] },
          optionsLoading: false,
          optionsLoadError: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          loading: false,
          // 数据统计
          stats: {
            totalUsers: 0,
            activeUsers: 0,
            disabledUsers: 0,
            newUsersThisMonth: 0
          },
          // 修改点：当前激活的筛选器值，对应 <stat-cards> 组件
          activeFilter: '',
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [
            { type: 'select', field: 'status', placeholder: '用户状态', options: [
              { label: '全部', value: '' },
              { label: '正常', value: '1' },
              { label: '禁用', value: '0' }
            ], width: 130 }
          ],
          tableActions: [],
          // 状态切换对话框
          statusDialog: {
            visible: false,
            title: '',
            message: '',
            userId: null,
            newStatus: null
          }
        }
      },
      created() {
        this.loadFilterOptions()
        this.init()
      },
      mounted() {
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: '', icon: '👥', label: '用户总数', value: self.stats.totalUsers || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: '1', icon: '✅', label: '正常用户', value: self.stats.activeUsers || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
            { key: '0', icon: '🚫', label: '已禁用', value: self.stats.disabledUsers || 0, color: 'warning', clickable: true, active: self.activeFilter === '0' },
            { key: 'new', icon: '🆕', label: '本月新增', value: self.stats.newUsersThisMonth || 0, color: 'danger' }
          ]
        }
      },
      methods: {
        // 身份证号脱敏：保留前6位和后4位
        maskIdNumber: function(idNumber) {
          if (!idNumber || idNumber.length < 10) return idNumber
          return idNumber.substring(0, 6) + '********' + idNumber.substring(idNumber.length - 4)
        },
        // 修改点：<stat-cards> 组件统一卡片点击分发
        // <stat-cards> 点击（使用 payload.activeKey 判断，避免 .sync 导致的 toggle 反转）
        onCardClick: function(payload) {
          var s = this.lastSearch || {}
          if (payload.activeKey !== '' && payload.activeKey != null) {
            // 有激活卡片：按卡片 key 过滤
            this.lastSearch = { status: payload.activeKey === '' ? undefined : Number(payload.activeKey) }
          } else {
            // 全部（无筛选）
            this.lastSearch = {}
          }
          this.input.name = ''
          this.input.phone = ''
          this.page = 1
          this.init()
        },
        // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await $axios({ url: '/user/options', method: 'get' })
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.names || []
              this.filterOptions.phones = res.data.phones || []
            } else {
              this.optionsLoadError = true
              this.$message.warning('加载用户选项失败：' + (res.msg || '接口返回异常'))
            }
          } catch (err) {
            // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
            if (err.message === 'NOTLOGIN') {
              return
            }
            this.optionsLoadError = true
            console.error('加载用户选项失败:', err)
            this.$message.error('加载筛选选项失败，请刷新页面重试')
          } finally {
            this.optionsLoading = false
          }
        },
        // 修改点：下拉框打开时若之前加载失败，自动重试
        onFilterDropdownVisible(visible) {
            if (visible && this.optionsLoadError) {
                this.loadFilterOptions()
            }
        },
        // 初始化加载
        async init () {
          this.loading = true
          // 并行加载用户列表和统计数据
          const [userRes, statsRes] = await Promise.all([
            this.getUserPage(),
            this.loadUserStats()
          ])

          // 处理用户列表数据
          if (String(userRes.code) === '1') {
            this.tableData = userRes.data.records || []
            this.counts = userRes.data.total
          } else {
            this.$message.error(userRes.msg || '查询失败')
          }

          // 处理统计数据
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }

          this.loading = false
        },

        // 获取用户分页列表（优先使用 lastSearch，回退到 input）
        async getUserPage() {
          try {
            const s = this.lastSearch || {}
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: s.name || this.input.name || undefined,
              phone: s.phone || this.input.phone || undefined,
              status: s.status != null ? (s.status === '' ? undefined : Number(s.status)) : (this.input.status != null ? this.input.status : undefined)
            }
            const res = await $axios.get('/user/page', { params })
            return res
          } catch (err) {
            this.$message.error('请求失败：' + err)
            return { code: 0, msg: '请求失败' }
          }
        },

        // 加载用户统计数据
        // 修改点：/user/stats 接口不存在，改用 /user/page 获取全量数据后前端计算
        async loadUserStats() {
          try {
            const res = await $axios.get('/user/page', { params: { page: 1, pageSize: 1000 } })
            if (String(res.code) === '1') {
              const records = res.data.records || []
              const total = res.data.total || 0
              // 后端 User.status 为 Integer，JSON 序列化为数字 1/0
              const activeCount = records.filter(item => item.status === 1).length
              const disabledCount = records.filter(item => item.status === 0).length
              // 本月新增
              const now = new Date()
              const newThisMonth = records.filter(function(m) {
                if (!m.createTime) return false
                const created = new Date(m.createTime)
                return created.getMonth() === now.getMonth() && created.getFullYear() === now.getFullYear()
              }).length
              return {
                code: 1,
                data: {
                  totalUsers: total,
                  activeUsers: activeCount,
                  disabledUsers: disabledCount,
                  newUsersThisMonth: newThisMonth
                }
              }
            }
          } catch (err) {
            console.warn('加载用户统计数据失败:', err)
          }
          return { code: 0 }
        },

        // 查询（由 <table-bar> @search 触发，searchParams 包含 table-bar 管理的搜索条件）
        handleQuery(searchParams) {
          this.activeFilter = ''
          this.page = 1
          this.lastSearch = Object.assign({}, searchParams, {
            name: this.input.name || undefined,
            phone: this.input.phone || undefined
          })
          this.init()
        },
        // 重置搜索条件，恢复表格初始状态
        reset() {
          this.input.name = ''
          this.input.phone = ''
          this.input.status = null
          this.activeFilter = ''
          this.page = 1
          this.init()
        },
        // filterByStatus 已迁移至 onCardClick

        // 状态切换（禁用/启用）
        statusHandle(row) {
          this.statusDialog.userId = row.id
          this.statusDialog.newStatus = row.status == 1 ? 0 : 1
          this.statusDialog.title = this.statusDialog.newStatus == 0 ? '禁用用户' : '启用用户'
          this.statusDialog.message = `确认要${this.statusDialog.title}「${row.name}」吗？`
          this.statusDialog.visible = true
        },

        // 确认状态切换
        async confirmStatus() {
          try {
            const res = await $axios.put('/user/status', null, {
              params: {
                id: this.statusDialog.userId,
                status: this.statusDialog.newStatus
              }
            })
            if (String(res.code) === '1') {
              this.$message.success(res.msg || '操作成功')
              this.handleStatusClose()
              this.init()
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          } catch (err) {
            this.$message.error('请求失败：' + err)
          }
        },

        // 关闭状态对话框
        handleStatusClose() {
          this.statusDialog.visible = false
          this.statusDialog.userId = null
          this.statusDialog.newStatus = null
        },

        // 删除用户
        deleteHandle(id) {
          this.$confirm('确认删除该用户吗？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(async () => {
            try {
              const res = await $axios.delete('/user', {
                params: { id }
              })
              if (String(res.code) === '1') {
                this.$message.success('删除成功')
                this.init()
              } else {
                this.$message.error(res.msg || '删除失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
          }).catch(() => {})
        },

        // 分页
        handleSizeChange (val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange (val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
