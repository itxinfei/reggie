<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鏁版嵁瀵煎嚭 - 鐟炲悏澶栧崠绠＄悊绔?/title>
    <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-page); color: var(--el-text-primary); font-family: var(--font-family-base); }

        .page-header { margin-bottom: var(--space-5); }
        .page-header h2 { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); color: var(--text-primary); margin: 0; }
        .page-header p { font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: var(--space-1); }

        /* 鍗＄墖缃戞牸 */
        .export-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

        .export-card {
            background: var(--bg-surface); border-radius: var(--radius-md); padding: 24px;
            box-shadow: var(--shadow-xs); border: 1px solid var(--el-border-light);
            transition: box-shadow 0.2s;
        }
        .export-card:hover { box-shadow: var(--shadow-md); }

        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .card-icon {
            width: 40px; height: 40px; border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size:var(--font-size-2xl); flex-shrink: 0;
        }
        .icon-order { background: var(--el-color-primary-lighter); color: var(--el-color-primary); }
        .icon-dish  { background: var(--orange-50b); color: var(--color-warning); }
        .icon-emp   { background: var(--color-success-light); color: var(--color-success); }
        .icon-report{ background: var(--purple-50); color: var(--purple-legacy2); }

        .card-title { font-size:var(--font-size-md); font-weight: 600; }
        .card-desc  { font-size:var(--font-size-xs); color: var(--color-info); margin-top: 2px; }

        /* 绛涢€夊尯 */
        .filter-section { margin-bottom: 16px; padding: 12px; background: var(--el-bg-ghost); border-radius: var(--radius-md); }
        .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-label { font-size:var(--font-size-sm); color: var(--el-text-regular); white-space: nowrap; min-width: 50px; }

        .filter-row input, .filter-row select {
            padding: 6px 10px; border: 1px solid var(--el-border-default); border-radius: var(--radius-sm);
            font-size:var(--font-size-sm); outline: none; transition: border-color 0.2s;
        }
        .filter-row input:focus, .filter-row select:focus { border-color: var(--el-color-primary); }

        .quick-range { display: flex; gap: 4px; }
        .quick-range span {
            padding: 4px 10px; font-size:var(--font-size-xs); border-radius: var(--radius-sm);
            background: var(--bg-surface); border: 1px solid var(--el-border-default); cursor: pointer;
            transition: all 0.2s; color: var(--el-text-regular);
        }
        .quick-range span:hover { color: var(--el-color-primary); border-color: var(--el-color-primary); }
        .quick-range span.active { background: var(--el-color-primary); color: var(--bg-surface); border-color: var(--el-color-primary); }

        /* 鎸夐挳琛?*/
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Loading 閬僵 */
        .btn-loading {
            position: relative; overflow: hidden;
        }
        .btn-loading::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px; margin: -7px 0 0 -7px;
            border: 2px solid transparent; border-top-color: currentColor;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 瀵煎嚭璁板綍 */
        .history-section { margin-top: 24px; }
        .history-title { font-size:var(--font-size-base); font-weight: 600; margin-bottom: 12px; color: var(--el-text-regular); }
        .history-list { background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--el-border-light); }
        .history-item {
            display: flex; align-items: center; padding: 12px 20px;
            border-bottom: 1px solid var(--el-bg-lighter); font-size:var(--font-size-sm);
        }
        .history-item:last-child { border-bottom: none; }
        .history-icon { font-size:var(--font-size-xl); margin-right: 12px; }
        .history-info { flex: 1; }
        .history-name { font-weight: 500; color: var(--el-text-primary); }
        .history-meta { font-size:var(--font-size-xs); color: var(--color-info); margin-top: 2px; }
        .history-size { font-size:var(--font-size-xs); color: var(--color-success); margin-left: 12px; white-space: nowrap; }
        .history-status {
            padding: 3px 10px; border-radius: var(--radius-md); font-size:var(--font-size-xs); font-weight: 500;
        }
        .history-status.success { background: var(--color-success-light); color: var(--color-success); }
        .history-status.fail { background: var(--color-danger-light); color: var(--color-danger); }

        .empty-history { text-align: center; padding: 40px; color: var(--el-border-base); font-size:var(--font-size-sm); }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: var(--radius-md);
            color: var(--bg-surface); font-size:var(--font-size-base); z-index: 9999; max-width: 400px;
            box-shadow: var(--shadow-lg); animation: slideIn 0.3s;
            display: none;
        }
        .toast-success { background: var(--color-success); }
        .toast-error { background: var(--color-danger); }
        .toast-info { background: var(--el-color-primary); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(100%); }
        }

        @media (max-width: 1200px) {
            .export-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 閿洏鐢ㄦ埛锛氳烦杞埌涓诲唴瀹癸紙WCAG 2.4.1锛?-->
    <a href="#app" class="skip-link">璺宠浆鍒颁富鍐呭</a>
    <div id="app" role="main" aria-label="椤甸潰涓昏鍐呭">
            <h2>鏁版嵁瀵煎嚭</h2>
            <p>鏀寔灏嗕笟鍔℃暟鎹鍑轰负 Excel(.xlsx) 鍜?PDF 鏍煎紡锛屾枃浠惰嚜鍔ㄥ寘鍚鍑烘椂闂存埑</p>
        </div>

        <div class="export-cards">
            <!-- 璁㈠崟瀵煎嚭 -->
            <div class="export-card">
                <div class="card-header">
                    <div class="card-icon icon-order">&#128203;</div>
                    <div>
                        <div class="card-title">璁㈠崟鏁版嵁瀵煎嚭</div>
                        <div class="card-desc">瀵煎嚭璁㈠崟鍙枫€佺敤鎴枫€侀噾棰濄€佺姸鎬併€佹椂闂寸瓑淇℃伅</div>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-row">
                        <span class="filter-label">鏃ユ湡鑼冨洿</span>
                        <input type="date" v-model="orderFilter.startDate" />
                        <span style="color:var(--el-border-base);">鑷?/span>
                        <input type="date" v-model="orderFilter.endDate" />
                        <div class="quick-range">
                            <span :class="{active: orderRange === 'today'}" role="button" tabindex="0" @click="setOrderRange('today')" @keydown.enter="setOrderRange('today')" :aria-pressed="orderRange === 'today'">浠婂ぉ</span>
                            <span :class="{active: orderRange === 'week'}" role="button" tabindex="0" @click="setOrderRange('week')" @keydown.enter="setOrderRange('week')" :aria-pressed="orderRange === 'week'">杩?澶?/span>
                            <span :class="{active: orderRange === 'month'}" role="button" tabindex="0" @click="setOrderRange('month')" @keydown.enter="setOrderRange('month')" :aria-pressed="orderRange === 'month'">杩?0澶?/span>
                        </div>
                    </div>
                    <div class="filter-row">
                        <span class="filter-label">璁㈠崟鐘舵€?/span>
                        <select v-model="orderFilter.status">
                            <option value="">鍏ㄩ儴鐘舵€?/option>
                            <option value="2">寰呮帴鍗?/option>
                            <option value="3">宸叉帴鍗?/option>
                            <option value="4">娲鹃€佷腑</option>
                            <option value="5">宸插畬鎴?/option>
                            <option value="6">宸插彇娑?/option>
                        </select>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="app-btn app-btn-excel" :class="{'btn-loading': orderExport.loading}" :disabled="orderExport.loading" @click="exportOrder('excel')">瀵煎嚭 Excel</button>
                    <button class="app-btn app-btn-pdf" :class="{'btn-loading': orderExport.loading}" :disabled="orderExport.loading" @click="exportOrder('pdf')">瀵煎嚭 PDF</button>
                </div>
            </div>

            <!-- 鑿滃搧瀵煎嚭 -->
            <div class="export-card">
                <div class="card-header">
                    <div class="card-icon icon-dish">&#127834;</div>
                    <div>
                        <div class="card-title">鑿滃搧鏁版嵁瀵煎嚭</div>
                        <div class="card-desc">瀵煎嚭鑿滃搧鍚嶇О銆佸垎绫汇€佷环鏍笺€佸敭鍗栫姸鎬佺瓑淇℃伅</div>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-row">
                        <span class="filter-label">鏁版嵁鑼冨洿</span>
                        <span style="font-size:var(--font-size-sm);color:var(--color-info);">鍏ㄩ儴鍦ㄥ敭鑿滃搧锛堝惈鍋滃敭锛?/span>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="app-btn app-btn-excel" :class="{'btn-loading': dishExport.loading}" :disabled="dishExport.loading" @click="exportDish('excel')">瀵煎嚭 Excel</button>
                    <button class="app-btn app-btn-pdf" :class="{'btn-loading': dishExport.loading}" :disabled="dishExport.loading" @click="exportDish('pdf')">瀵煎嚭 PDF</button>
                </div>
            </div>

            <!-- 鍛樺伐瀵煎嚭 -->
            <div class="export-card">
                <div class="card-header">
                    <div class="card-icon icon-emp">&#128101;</div>
                    <div>
                        <div class="card-title">鍛樺伐鏁版嵁瀵煎嚭</div>
                        <div class="card-desc">瀵煎嚭鍛樺伐濮撳悕銆佽处鍙枫€佹墜鏈哄彿銆佹€у埆銆佺姸鎬併€佸叆鑱屾椂闂?/div>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-row">
                        <span class="filter-label">鏁版嵁鑼冨洿</span>
                        <span style="font-size:var(--font-size-sm);color:var(--color-info);">鍏ㄩ儴鍛樺伐鏁版嵁</span>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="app-btn app-btn-excel" :class="{'btn-loading': empExport.loading}" :disabled="empExport.loading" @click="exportEmp('excel')">瀵煎嚭 Excel</button>
                    <button class="app-btn app-btn-pdf" :class="{'btn-loading': empExport.loading}" :disabled="empExport.loading" @click="exportEmp('pdf')">瀵煎嚭 PDF</button>
                </div>
            </div>

            <!-- 缁忚惀鎶ヨ〃瀵煎嚭 -->
            <div class="export-card">
                <div class="card-header">
                    <div class="card-icon icon-report">&#128200;</div>
                    <div>
                        <div class="card-title">缁忚惀鎶ヨ〃瀵煎嚭</div>
                        <div class="card-desc">瀵煎嚭姣忔棩缁忚惀姹囨€伙紝鍚惀涓氶銆佽鍗曢噺銆佸鍗曚环绛夋牳蹇冩寚鏍?/div>
                    </div>
                </div>
                <div class="filter-section">
                    <div class="filter-row">
                        <span class="filter-label">鏃ユ湡鑼冨洿</span>
                        <input type="date" v-model="reportFilter.startDate" />
                        <span style="color:var(--el-border-base);">鑷?/span>
                        <input type="date" v-model="reportFilter.endDate" />
                        <div class="quick-range">
                            <span :class="{active: reportRange === 'today'}" role="button" tabindex="0" @click="setReportRange('today')" @keydown.enter="setReportRange('today')" :aria-pressed="reportRange === 'today'">浠婂ぉ</span>
                            <span :class="{active: reportRange === 'week'}" role="button" tabindex="0" @click="setReportRange('week')" @keydown.enter="setReportRange('week')" :aria-pressed="reportRange === 'week'">杩?澶?/span>
                            <span :class="{active: reportRange === 'month'}" role="button" tabindex="0" @click="setReportRange('month')" @keydown.enter="setReportRange('month')" :aria-pressed="reportRange === 'month'">杩?0澶?/span>
                        </div>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="app-btn app-btn-excel" :class="{'btn-loading': reportExport.loading}" :disabled="reportExport.loading" @click="exportReport('excel')">瀵煎嚭 Excel</button>
                    <button class="app-btn app-btn-pdf" :class="{'btn-loading': reportExport.loading}" :disabled="reportExport.loading" @click="exportReport('pdf')">瀵煎嚭 PDF</button>
                </div>
            </div>
        </div>

        <!-- 瀵煎嚭璁板綍 -->
        <div class="history-section">
            <div class="history-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>&#128197; 瀵煎嚭璁板綍 <span style="font-size:var(--font-size-xs);color:var(--el-border-base);font-weight:400;">锛堟渶杩?{{ history.length }} 鏉★級</span></span>
                <button v-if="history.length > 0" @click="clearHistory" class="app-btn app-btn-danger app-btn-sm">娓呯┖璁板綍</button>
            </div>
            <div class="history-list" v-if="history.length > 0">
                <div class="history-item" v-for="(item, idx) in history" :key="idx">
                    <span class="history-icon">{{ item.icon }}</span>
                    <div class="history-info">
                        <div class="history-name">{{ item.name }}</div>
                        <div class="history-meta">{{ item.time }}</div>
                    </div>
                    <span class="history-size">{{ item.size }}</span>
                    <span class="history-status" :class="item.success ? 'success' : 'fail'">
                        {{ item.success ? '鉁?鎴愬姛' : '鉁?澶辫触' }}
                    </span>
                </div>
            </div>
            <div class="history-list empty-history" v-else>
                <div style="font-size: var(--font-size-4xl);margin-bottom:8px;">馃摜</div>
                鏆傛棤瀵煎嚭璁板綍锛岀偣鍑讳笂鏂规寜閽紑濮嬪鍑?
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
    <script src="../../api/export.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                orderFilter: { startDate: '', endDate: '', status: '' },
                orderRange: 'week',
                orderExport: { loading: false },

                dishExport: { loading: false },

                empExport: { loading: false },

                reportFilter: { startDate: '', endDate: '' },
                reportRange: 'week',
                reportExport: { loading: false },

                history: []
            },
            mounted: function() {
                this.setOrderRange('week');
                this.setReportRange('week');
            },
            methods: {
                // ==================== 鏃ユ湡蹇嵎閫夋嫨 ====================
                setOrderRange(range) {
                    this.orderRange = range;
                    const now = new Date();
                    if (range === 'today') {
                        this.orderFilter.startDate = this.formatDate(now);
                        this.orderFilter.endDate = this.formatDate(now);
                    } else if (range === 'week') {
                        const d = new Date(now.getTime() - 6 * 86400000);
                        this.orderFilter.startDate = this.formatDate(d);
                        this.orderFilter.endDate = this.formatDate(now);
                    } else if (range === 'month') {
                        const d = new Date(now.getTime() - 29 * 86400000);
                        this.orderFilter.startDate = this.formatDate(d);
                        this.orderFilter.endDate = this.formatDate(now);
                    }
                },
                setReportRange(range) {
                    this.reportRange = range;
                    const now = new Date();
                    if (range === 'today') {
                        this.reportFilter.startDate = this.formatDate(now);
                        this.reportFilter.endDate = this.formatDate(now);
                    } else if (range === 'week') {
                        const d = new Date(now.getTime() - 6 * 86400000);
                        this.reportFilter.startDate = this.formatDate(d);
                        this.reportFilter.endDate = this.formatDate(now);
                    } else if (range === 'month') {
                        const d = new Date(now.getTime() - 29 * 86400000);
                        this.reportFilter.startDate = this.formatDate(d);
                        this.reportFilter.endDate = this.formatDate(now);
                    }
                },
                formatDate(d) {
                    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                },

                // ==================== 瀵煎嚭鎿嶄綔 ====================
                exportOrder(format) {
                    const self = this;
                    self.orderExport.loading = true;
                    const params = {$2};
                    if (self.orderFilter.startDate) params.startDate = self.orderFilter.startDate;
                    if (self.orderFilter.endDate) params.endDate = self.orderFilter.endDate;
                    if (self.orderFilter.status) params.status = self.orderFilter.status;

                    const ext = format === 'excel' ? 'xlsx' : 'pdf';
                    const apiCall = format === 'excel'
                        ? exportApi.exportOrdersExcel(params)
                        : exportApi.exportOrdersPdf(params);

                    const label = '璁㈠崟鏁版嵁 (' + self.orderFilter.startDate + '~' + self.orderFilter.endDate + ')';
                    exportApi.downloadFile(apiCall, '璁㈠崟鏁版嵁.' + ext)
                        .then(function() {
                            self.addHistory(label, '&#128203;', ext, true);
                            showToast('璁㈠崟鏁版嵁瀵煎嚭鎴愬姛锛屾枃浠跺凡寮€濮嬩笅杞?, 'success');
                        })
                        .catch(function(err) {
                            self.addHistory(label, '&#128203;', ext, false);
                            showToast(err.message || '璁㈠崟鏁版嵁瀵煎嚭澶辫触', 'error');
                        })
                        .finally(function() { self.orderExport.loading = false; });
                },

                exportDish(format) {
                    const self = this;
                    self.dishExport.loading = true;
                    const ext = format === 'excel' ? 'xlsx' : 'pdf';
                    var apiCall = format === 'excel'
                        ? exportApi.exportDishesExcel({})
                        : exportApi.exportDishesPdf({});

                    exportApi.downloadFile(apiCall, '鑿滃搧鏁版嵁.' + ext)
                        .then(function() {
                            self.addHistory('鑿滃搧鏁版嵁', '&#127834;', ext, true);
                            showToast('鑿滃搧鏁版嵁瀵煎嚭鎴愬姛', 'success');
                        })
                        .catch(function(err) {
                            self.addHistory('鑿滃搧鏁版嵁', '&#127834;', ext, false);
                            showToast(err.message || '鑿滃搧鏁版嵁瀵煎嚭澶辫触', 'error');
                        })
                        .finally(function() { self.dishExport.loading = false; });
                },

                exportEmp(format) {
                    const self = this;
                    self.empExport.loading = true;
                    const ext = format === 'excel' ? 'xlsx' : 'pdf';
                    var apiCall = format === 'excel'
                        ? exportApi.exportEmployeesExcel({})
                        : exportApi.exportEmployeesPdf({});

                    exportApi.downloadFile(apiCall, '鍛樺伐鏁版嵁.' + ext)
                        .then(function() {
                            self.addHistory('鍛樺伐鏁版嵁', '&#128101;', ext, true);
                            showToast('鍛樺伐鏁版嵁瀵煎嚭鎴愬姛', 'success');
                        })
                        .catch(function(err) {
                            self.addHistory('鍛樺伐鏁版嵁', '&#128101;', ext, false);
                            showToast(err.message || '鍛樺伐鏁版嵁瀵煎嚭澶辫触', 'error');
                        })
                        .finally(function() { self.empExport.loading = false; });
                },

                exportReport(format) {
                    const self = this;
                    self.reportExport.loading = true;
                    const params = {$2};
                    if (self.reportFilter.startDate) params.startDate = self.reportFilter.startDate;
                    if (self.reportFilter.endDate) params.endDate = self.reportFilter.endDate;
                    const ext = format === 'excel' ? 'xlsx' : 'pdf';
                    const apiCall = format === 'excel'
                        ? exportApi.exportReportExcel(params)
                        : exportApi.exportReportPdf(params);

                    const label = '缁忚惀鎶ヨ〃 (' + self.reportFilter.startDate + '~' + self.reportFilter.endDate + ')';
                    exportApi.downloadFile(apiCall, '缁忚惀鎶ヨ〃.' + ext)
                        .then(function() {
                            self.addHistory(label, '&#128200;', ext, true);
                            showToast('缁忚惀鎶ヨ〃瀵煎嚭鎴愬姛', 'success');
                        })
                        .catch(function(err) {
                            self.addHistory(label, '&#128200;', ext, false);
                            showToast(err.message || '缁忚惀鎶ヨ〃瀵煎嚭澶辫触', 'error');
                        })
                        .finally(function() { self.reportExport.loading = false; });
                },

                // ==================== 瀵煎嚭璁板綍 ====================
                addHistory(name, icon, ext, success) {
                    const now = new Date();
                    const time = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0')
                        + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
                    this.history.unshift({
                        name: name + '.' + ext,
                        icon: icon,
                        time: time,
                        size: ext.toUpperCase() + ' 鏂囦欢',
                        success: success
                    });
                    if (this.history.length > 50) this.history.pop();
                },
                clearHistory() {
                    this.history = [];
                    showToast('瀵煎嚭璁板綍宸叉竻绌?, 'info');
                }
            }
        });

        const toastTimer = $2;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast toast-' + type;
            toast.style.display = 'block';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(function() { toast.style.display = 'none'; toast.style.animation = ''; }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
