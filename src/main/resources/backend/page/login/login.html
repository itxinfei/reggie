<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 瑞吉外卖管理端</title>
  <link rel="shortcut icon" href="../../favicon.ico">
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css">
  <link rel="stylesheet" href="../../styles/login.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />

</head> 

<body class="login-page">
  <div class="login" id="login-app">
    <div class="login-box">
      <img src="../../images/login/login-l.png" alt="">
      <div class="login-form">
        <el-form ref="loginForm" :model="loginForm" :rules="loginRules" >
          <div class="login-form-title">
            <img src="../../images/login/logo.png" style="width:160px;height:50px;" alt="瑞吉外卖" />
          </div>
          <el-form-item prop="username">
            <el-input v-model="loginForm.username" type="text" auto-complete="off" placeholder="账号" maxlength="20"
              prefix-icon="ri-user-3-line" />
          </el-form-item>
          <el-form-item prop="password">
            <el-input v-model="loginForm.password" type="password" placeholder="密码" prefix-icon="ri-lock-line" maxlength="20"
              @keyup.enter.native="handleLogin" />
          </el-form-item>
          <el-form-item style="width:100%;">
            <el-button :loading="loading" class="login-btn" size="medium" type="primary" style="width:100%;"
              @click.native.prevent="handleLogin">
              <span v-if="!loading">登录</span>
              <span v-else>登录中...</span>
            </el-button>
          </el-form-item>
          <div style="text-align: right; margin-top: -10px; margin-bottom: 10px;">
            <el-button type="text" class="text-info" style="padding: 0;" @click="showForgotPassword">忘记密码？</el-button>
          </div>
        </el-form>
      </div>
    </div>

    <!-- 忘记密码弹窗 -->
    <el-dialog title="重置密码" :visible.sync="forgotVisible" width="420px" :close-on-click-modal="false">
      <el-form :model="forgotForm" :rules="forgotRules" ref="forgotForm" label-width="100px">
        <el-form-item label="用户名" prop="username">
          <el-input v-model="forgotForm.username" placeholder="请输入用户名" maxlength="20"></el-input>
        </el-form-item>
        <el-form-item label="手机号" prop="phone">
          <el-input v-model="forgotForm.phone" placeholder="请输入注册手机号" maxlength="11"></el-input>
        </el-form-item>
        <el-form-item label="新密码" prop="password">
          <el-input v-model="forgotForm.password" type="password" placeholder="请输入新密码（6位以上）" maxlength="20"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button @click="forgotVisible = false">取 消</el-button>
        <el-button type="primary" @click="submitForgotPassword" :loading="forgotLoading">确 定</el-button>
      </span>
    </el-dialog>
  </div>

  <!-- 开发环境版本，包含了有帮助的命令行警告 -->
  <script src="../../plugins/vue/vue.js"></script>
  <!-- 引入组件库 -->
  <script src="../../plugins/element-ui/index.js"></script>
  <!-- 引入axios -->
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/validate.js"></script>
  <script src="../../api/login.js"></script>

  <script>
    // 忘记密码 API
    async function submitForgotPassword(formData) {
      return await forgotPasswordApi(formData)
    }

    new Vue({
      el: '#login-app',
      data() {
        return {
          loginForm:{
            username: '',
            password: ''
          },
          loading: false,
          // 忘记密码
          forgotVisible: false,
          forgotLoading: false,
          forgotForm: {
            username: '',
            phone: '',
            password: ''
          }
        }
      },
      computed: {
        loginRules() {
          return {
            'username': [{ 'validator': this.validateUsername, 'trigger': 'blur' }],
            'password': [{ 'validator': this.validatePassword, 'trigger': 'blur' }]
          }
        },
        forgotRules() {
          return {
            username: [{ 'required': true, 'message': '请输入用户名', 'trigger': 'blur' }],
            phone: [{ 'validator': this.validatePhone, 'trigger': 'blur' }],
            password: [{ 'validator': this.validatePassword, 'trigger': 'blur' }]
          }
        },
      },
      created() {
      },
      methods: {
        // 修改点：将 validator 函数提升到 methods，使 loginRules 和 forgotRules 均可通过 this 访问
        validateUsername(rule, value, callback) {
          if (value.length < 1) {
            callback(new Error('请输入用户名'))
          } else {
            callback()
          }
        },
        validatePassword(rule, value, callback) {
          if (value.length < 6) {
            callback(new Error('密码必须在6位以上'))
          } else {
            callback()
          }
        },
        validatePhone(rule, value, callback) {
          if (!value) {
            callback(new Error('请输入手机号'))
          } else if (!/^1[3-9]\d{9}$/.test(value)) {
            callback(new Error('手机号格式不正确'))
          } else {
            callback()
          }
        },
        async handleLogin() {
          this.$refs.loginForm.validate(async (valid) => {
            if (valid) {
              this.loading = true
              let res = await loginApi(this.loginForm)
              if (String(res.code) === '1') {//1表示登录成功
                localStorage.setItem('userInfo',JSON.stringify(res.data))
                window.location.href= '/backend/index.html'
              } else {
                this.$message.error(res.msg)
                this.loading = false
              }
            }
          })
        },
        showForgotPassword() {
          this.forgotVisible = true
          this.forgotForm = { username: '', phone: '', password: '' }
          if (this.$refs.forgotForm) {
            this.$refs.forgotForm.clearValidate()
          }
        },
        async submitForgotPassword() {
          this.$refs.forgotForm.validate(async (valid) => {
            if (valid) {
              this.forgotLoading = true
              try {
                const res = await forgotPasswordApi(this.forgotForm)
                if (String(res.code) === '1') {
                  this.$message.success(res.msg || '密码重置成功')
                  this.forgotVisible = false
                } else {
                  this.$message.error(res.msg || '重置失败')
                }
              } catch (err) {
                this.$message.error('请求失败：' + err)
              } finally {
                this.forgotLoading = false
              }
            }
          })
        }
      }
    })
  </script>
</body>

</html>
