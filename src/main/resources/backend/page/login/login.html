<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 瑞吉外卖管理端</title>
  <link rel="shortcut icon" href="../../favicon.ico">
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css">
  <!-- 修改点：补设计令牌（全站后台页均已加载，登录页此前漏链，导致 login.css 内 var(--color-brand-500)/var(--color-white) 等令牌 undefined、配色错乱） -->
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/login.css">
  <link href="../../plugins/remixicon/remixicon.css" rel="stylesheet" />
</head>

<body class="login-page">
  <!-- 动画背景层 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>
    <div class="bg-orb c"></div>
    <div class="bg-orb d"></div>
    <div class="bg-grid"></div>
  </div>

  <div id="login-app">
    <div class="login-shell">
      <!-- 左侧品牌区 -->
      <div class="shell-left" aria-hidden="true">
        <div class="left-mask"></div>
        <div class="left-ring"></div>
        <div class="left-inner">
          <div class="left-brand">
            <span class="brand-icon"><i class="ri-restaurant-2-fill"></i></span>
            <span class="brand-name">瑞吉外卖</span>
          </div>
          <h1 class="left-heading">智能餐饮管理平台</h1>
          <p class="left-sub">门店经营 · 菜品管理 · 订单履约 · 数据分析</p>
        </div>
      </div>

      <!-- 右侧登录表单 -->
      <div class="shell-right">
        <div class="login-card" :class="{ in: loaded }">
          <div class="card-top">
            <span class="card-badge"><i class="ri-shield-user-line"></i></span>
            <h2 class="card-h2">管理员登录</h2>
            <p class="card-p">请输入您的账号信息</p>
          </div>

          <el-form ref="loginForm" :model="form" :rules="rules" class="login-form"
                   @submit.native.prevent="doLogin">
            <!-- 用户名 -->
            <el-form-item prop="username" class="fi">
              <div class="inp-wrap" :class="{ on: focus === 'u', ok: form.username && !err('username'), bad: err('username') }">
                <span class="inp-icon"><i class="ri-user-3-line"></i></span>
                <el-input v-model="form.username" placeholder="用户名" maxlength="50"
                          autocomplete="username" aria-label="用户名"
                          @focus="focus='u'" @blur="focus=''"
                          @keyup.enter.native="focusPass" />
                <span class="inp-ok" v-show="form.username && !err('username')"><i class="ri-check-line"></i></span>
              </div>
            </el-form-item>

            <!-- 密码 -->
            <el-form-item prop="password" class="fi">
              <div class="inp-wrap" :class="{ on: focus === 'p', bad: err('password') }">
                <span class="inp-icon"><i class="ri-lock-2-line"></i></span>
                <el-input v-model="form.password" :type="seePass ? 'text' : 'password'"
                          placeholder="密码" maxlength="20"
                          autocomplete="current-password" aria-label="密码"
                          @focus="focus='p'" @blur="focus=''"
                          @keyup.enter.native="doLogin" />
                <button type="button" class="inp-eye" :aria-label="seePass?'隐藏密码':'显示密码'"
                        @click="seePass=!seePass">
                  <i :class="seePass ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                </button>
              </div>
            </el-form-item>

            <!-- 登录按钮 -->
            <el-form-item class="fi-btn">
              <button type="button" :disabled="loading" class="btn-login"
                      :class="{ spin: loading }" @click="doLogin" aria-label="登录">
                <span v-if="!loading"><i class="ri-login-box-line"></i> 登 录</span>
                <span v-else><i class="btn-dot"></i> 验证中...</span>
              </button>
            </el-form-item>
          </el-form>

          <div class="card-foot">
            <a class="forgot-link" @click.prevent="showForgot">忘记密码？</a>
            <span class="foot-divider">|</span>
            <span>&copy; 2026 瑞吉外卖</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 忘记密码弹窗 -->
    <el-dialog title="重置密码" :visible.sync="fpShow"
               custom-class="el-dialog--sm unified-dialog fp-dialog"
               :close-on-click-modal="false" :append-to-body="true">
      <el-form :model="fpForm" :rules="fpRules" ref="fpFormRef" label-width="80px"
               @submit.native.prevent="doForgot">
        <el-form-item label="用户名" prop="username">
          <el-input v-model="fpForm.username" placeholder="请输入用户名" maxlength="50"></el-input>
        </el-form-item>
        <el-form-item label="手机号" prop="phone">
          <el-input v-model="fpForm.phone" placeholder="请输入注册手机号" maxlength="11" type="tel"></el-input>
        </el-form-item>
        <el-form-item label="新密码" prop="newPassword">
          <el-input v-model="fpForm.newPassword" type="password" placeholder="至少6位" maxlength="20"></el-input>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="fpShow=false">取消</el-button>
        <el-button type="primary" size="medium" @click="doForgot" :loading="fpLoading">确定</el-button>
      </span>
    </el-dialog>

    <!-- 主题切换 -->
    <button class="theme-btn" :title="dark ? '浅色模式' : '深色模式'"
            :aria-label="dark ? '浅色模式' : '深色模式'" @click="toggleTheme">
      <i :class="dark ? 'ri-sun-line' : 'ri-moon-line'"></i>
    </button>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/validate.js"></script>
  <script src="../../api/login.js"></script>

  <script>
    new Vue({
      el: '#login-app',
      data: function() {
        return {
          form:     { username: '', password: '' },
          loading:  false,
          loaded:   false,
          focus:    '',
          seePass:  false,
          dark:     false,
          fpShow:   false,
          fpLoading: false,
          fpForm:   { username: '', phone: '', newPassword: '' }
        }
      },
      computed: {
        rules: function() {
          return {
            username: [{ validator: this.chkUser, trigger: 'blur' }],
            password: [{ validator: this.chkPass, trigger: 'blur' }]
          }
        },
        fpRules: function() {
          return {
            username:   [{ required: true, message: '请输入用户名', trigger: 'blur' }],
            phone:      [{ required: true, message: '请输入手机号', trigger: 'blur' },
                         { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }],
            newPassword: [{ validator: this.chkPass, trigger: 'blur' }]
          }
        }
      },
      created: function() {
        var t = localStorage.getItem('login-theme')
        this.dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches)
        this.setTheme()
        // 记住上次用户名
        var u = localStorage.getItem('login-username')
        if (u) this.form.username = u
      },
      mounted: function() {
        var self = this
        setTimeout(function() { self.loaded = true }, 120)
      },
      methods: {
        chkUser: function(rule, v, cb) {
          cb(v && v.length >= 1 ? undefined : new Error('请输入用户名'))
        },
        chkPass: function(rule, v, cb) {
          cb(v && v.length >= 6 ? undefined : new Error('密码至少6位'))
        },
        err: function(field) {
          var fs = this.$refs.loginForm ? this.$refs.loginForm.fields : null
          if (!fs) return false
          for (var i = 0; i < fs.length; i++) {
            if (fs[i].prop === field) return fs[i].validateState === 'error'
          }
          return false
        },
        setTheme: function() {
          document.documentElement.classList.toggle('dark-theme', this.dark)
          document.documentElement.classList.toggle('light-theme', !this.dark)
        },
        toggleTheme: function() {
          this.dark = !this.dark
          localStorage.setItem('login-theme', this.dark ? 'dark' : 'light')
          this.setTheme()
        },
        focusPass: function() {
          var el = this.$refs.loginForm.$el.querySelector('input[type="password"]')
          if (el) el.focus()
        },
        doLogin: function() {
          var self = this
          this.$refs.loginForm.validate(function(ok) {
            if (!ok || self.loading) return
            self.loading = true
            localStorage.setItem('login-username', self.form.username)

            loginApi(self.form).then(function(res) {
              if (String(res.code) === '1') {
                localStorage.setItem('userInfo', JSON.stringify(res.data))
                window.location.href = '/backend/index.html'
              } else {
                self.$message.error(res.msg || '登录失败')
                self.loading = false
              }
            }).catch(function() {
              self.loading = false
            })
          })
        },
        showForgot: function() {
          this.fpShow = true
          this.fpForm = { username: '', phone: '', newPassword: '' }
          var self = this
          this.$nextTick(function() {
            if (self.$refs.fpFormRef) self.$refs.fpFormRef.clearValidate()
          })
        },
        doForgot: function() {
          var self = this
          this.$refs.fpFormRef.validate(function(ok) {
            if (!ok) return
            self.fpLoading = true
            forgotPasswordApi(self.fpForm).then(function(res) {
              if (String(res.code) === '1') {
                self.$message.success(res.msg || '密码重置成功')
                self.fpShow = false
              } else {
                self.$message.error(res.msg || '重置失败')
              }
            }).finally(function() {
              self.fpLoading = false
            })
          })
        }
      }
    })
  </script>
</body>
</html>
