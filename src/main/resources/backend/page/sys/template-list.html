<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知模板 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
  <style>
    .content-preview {
      background: var(--el-bg-subtle);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--el-text-regular);
      font-family: 'Courier New', monospace;
      line-height: 1.6;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .biz-type-tag {
      font-weight: 500;
      font-size: 12px;
    }
    .channel-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .channel-badge .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="template-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="200"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-bizType="{ row }">
          <span class="biz-type-tag" :style="{ color: bizTypeColor(row.bizType) }">
            <i :class="bizTypeIcon(row.bizType)" style="margin-right:4px;"></i>{{ bizTypeName(row.bizType) }}
          </span>
        </template>
        <template #col-channel="{ row }">
          <el-tag size="small" :type="channelTagType(row.channel)" effect="plain">
            {{ channelName(row.channel) }}
          </el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'danger'" size="small" effect="plain">
            {{ row.status === 1 ? '启用' : '停用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-edit" @click="openDialog(row)">编辑</el-button>
          <el-button type="text" size="small" class="btn-view" @click="toggleStatus(row)">
            {{ row.status === 1 ? '停用' : '启用' }}
          </el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 编辑弹窗 -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="650px"
      @submit="submitForm"
      @close="formData.dialogVisible = false"
    >
      <!-- 修改点：补全 ref/:model/:rules 与 prop，启用 Element 校验（原 required 无 prop 不生效） -->
      <el-form ref="templateForm" :model="formData" :rules="templateRules" label-width="90px" size="small">
        <el-form-item label="模板名称" prop="templateName">
          <el-input v-model="formData.templateName" placeholder="如：订单确认通知"></el-input>
        </el-form-item>
        <el-form-item label="业务类型" prop="bizType">
          <el-select v-model="formData.bizType" style="width:100%">
            <el-option label="订单通知" value="ORDER_NOTICE"></el-option>
            <el-option label="营销推送" value="PROMOTION"></el-option>
            <el-option label="验证码" value="VERIFY_CODE"></el-option>
            <el-option label="系统通知" value="SYSTEM"></el-option>
            <el-option label="工作通知" value="JOB_NOTICE"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="发送渠道" prop="channel">
          <el-select v-model="formData.channel" style="width:100%">
            <el-option label="短信" :value="1"></el-option>
            <el-option label="APP推送" :value="2"></el-option>
            <el-option label="短信+APP推送" :value="3"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="模板内容" prop="content">
          <el-input v-model="formData.content" type="textarea" :rows="4"
            placeholder="尊敬的${userName}，您的订单${orderNo}已确认。"></el-input>
        </el-form-item>
        <el-form-item label="状态">
          <el-radio-group v-model="formData.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">停用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/sys.js"></script>
  <script>
    new Vue({
      el: '#template-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { total: 0, enabled: 0, disabled: 0, sms: 0 },
          activeFilter: '',
          lastSearch: {},
          submitting: false,
          // 搜索配置
          searchConfig: [
            { type: 'select', field: 'bizType', placeholder: '业务类型', width: '140px',
              options: [
                { label: '订单通知', value: 'ORDER_NOTICE' },
                { label: '营销推送', value: 'PROMOTION' },
                { label: '验证码', value: 'VERIFY_CODE' },
                { label: '系统通知', value: 'SYSTEM' },
                { label: '工作通知', value: 'JOB_NOTICE' }
              ] },
            { type: 'select', field: 'channel', placeholder: '发送渠道', width: '130px',
              options: [
                { label: '短信', value: '1' },
                { label: 'APP推送', value: '2' },
                { label: '短信+推送', value: '3' }
              ] },
            { type: 'select', field: 'status', placeholder: '状态', width: '100px',
              options: [
                { label: '启用', value: '1' },
                { label: '停用', value: '0' }
              ] }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'add', text: '+ 新增模板', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'templateName', label: '模板名称', minWidth: 160, align: 'center' },
            { prop: 'templateCode', label: '外部编码', width: 130, align: 'center' },
            { prop: 'bizType', label: '业务类型', width: 110, align: 'center', slot: true },
            { prop: 'channel', label: '渠道', width: 100, align: 'center', slot: true },
            { prop: 'title', label: '推送标题', minWidth: 130, align: 'center' },
            { prop: 'content', label: '内容预览', minWidth: 220, showOverflowTooltip: true, align: 'center' },
            { prop: 'signName', label: '短信签名', width: 100, align: 'center' },
            { prop: 'remark', label: '备注', minWidth: 130, showOverflowTooltip: true },
            { prop: 'status', label: '状态', width: 80, align: 'center', slot: true },
            { prop: 'updateTime', label: '更新时间', width: 160, align: 'center' }
          ],
          // 弹窗表单
          formData: {
            title: '新增模板',
            dialogVisible: false,
            id: null, templateName: '', bizType: 'ORDER_NOTICE', channel: 1,
            content: '', status: 1
          },
          // 修改点：模板表单校验规则（配合 el-form :rules + validate()）
          templateRules: {
            templateName: [{ required: true, message: '请输入模板名称', trigger: 'blur' }],
            bizType: [{ required: true, message: '请选择业务类型', trigger: 'change' }],
            channel: [{ required: true, message: '请选择发送渠道', trigger: 'change' }],
            content: [{ required: true, message: '请输入模板内容', trigger: 'blur' }]
          }
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '📋', label: '模板总数', value: self.stats.total || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'enabled', icon: '✅', label: '已启用', value: self.stats.enabled || 0, color: 'success', clickable: true, active: self.activeFilter === 'enabled' },
            { key: 'disabled', icon: '⏸️', label: '已停用', value: self.stats.disabled || 0, color: 'warning', clickable: true, active: self.activeFilter === 'disabled' },
            { key: 'sms', icon: '💬', label: '短信模板', value: self.stats.sms || 0, color: 'info', clickable: true, active: self.activeFilter === 'sms' }
          ]
        }
      },
      methods: {
        async init(reloadStats = true) {
          this.loading = true
          var ls = this.lastSearch || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            bizType: ls.bizType || undefined,
            channel: ls.channel || undefined,
            status: ls.status || undefined
          }
          var requests = [sysApi.templatePage(params)]
          if (reloadStats) { requests.push(this.loadTemplateStats()) }
          var results = await Promise.all(requests)
          var tplRes = results[0]
          var statsRes = results[1]
          if (tplRes && tplRes.code === 1) {
            this.tableData = tplRes.data.records || []
            this.counts = tplRes.data.total || 0
          }
          if (reloadStats && statsRes && statsRes.code === 1) {
            this.stats = Object.assign({}, this.stats, statsRes.data || {})
          }
          this.loading = false
        },
        async loadTemplateStats() {
          try {
            // 修改点：改用 pageSize:1 多状态/渠道并发查询取 total，避免 pageSize:1000 拉全量导致统计截断
            var r1 = await sysApi.templatePage({ page: 1, pageSize: 1 })
            var r2 = await sysApi.templatePage({ page: 1, pageSize: 1, status: 1 })
            var r3 = await sysApi.templatePage({ page: 1, pageSize: 1, status: 0 })
            var r4 = await sysApi.templatePage({ page: 1, pageSize: 1, channel: 1 })
            var r5 = await sysApi.templatePage({ page: 1, pageSize: 1, channel: 3 })
            if (String(r1.code) === '1') {
              var sms = (r4.data.total || 0) + (r5.data.total || 0)
              return { code: 1, data: {
                total: r1.data.total || 0,
                enabled: r2.data.total || 0,
                disabled: r3.data.total || 0,
                sms: sms
              }}
            }
          } catch (err) { console.warn('加载模板统计失败:', err) }
          return { code: 0 }
        },
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.lastSearch = this.activeFilter ? this.buildFilterParams(this.activeFilter) : {}
          this.page = 1
          this.init(false)
        },
        buildFilterParams(key) {
          if (key === 'enabled') return { status: '1' }
          if (key === 'disabled') return { status: '0' }
          return {}
        },
        // table-bar 回调
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init(false)
        },
        onAction(payload) {
          if (payload.key === 'add') this.openDialog()
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.init(false)
        },
        bizTypeName(type) {
          var map = { 'ORDER_NOTICE': '订单通知', 'PROMOTION': '营销推送', 'VERIFY_CODE': '验证码', 'SYSTEM': '系统通知', 'JOB_NOTICE': '工作通知' }
          return map[type] || type
        },
        bizTypeColor(type) {
          var map = { 'ORDER_NOTICE': '#409eff', 'PROMOTION': '#e6a23c', 'VERIFY_CODE': '#67c23a', 'SYSTEM': '#909399', 'JOB_NOTICE': '#f56c6c' }
          return map[type] || '#606266'
        },
        bizTypeIcon(type) {
          var map = { 'ORDER_NOTICE': 'ri-file-list-3-line', 'PROMOTION': 'ri-megaphone-line', 'VERIFY_CODE': 'ri-shield-check-line', 'SYSTEM': 'ri-settings-3-line', 'JOB_NOTICE': 'ri-notification-3-line' }
          return map[type] || 'ri-file-text-line'
        },
        channelName(ch) {
          var map = { 1: '短信', 2: 'APP推送', 3: '短信+推送' }
          return map[ch] || '未知'
        },
        channelTagType(ch) {
          if (ch === 1) return 'info'
          if (ch === 2) return 'warning'
          if (ch === 3) return 'success'
          return 'info'
        },
        openDialog(row) {
          if (row) {
            this.formData.title = '编辑模板'
            this.formData = Object.assign({}, this.formData, { title: '编辑模板', dialogVisible: true }, JSON.parse(JSON.stringify(row)))
          } else {
            this.formData.title = '新增模板'
            this.formData = { title: '新增模板', dialogVisible: true, id: null, templateName: '', bizType: 'ORDER_NOTICE', channel: 1, content: '', status: 1 }
          }
        },
        submitForm() {
          var self = this
          self.$refs.templateForm.validate(function(valid) {
            if (!valid) {
              self.$message.warning('请完善表单必填项')
              return
            }
            self.submitting = true
          var api = self.formData.id ? sysApi.templateUpdate(self.formData) : sysApi.templateAdd(self.formData)
          api.then(function(res) {
            if (res && res.code === 1) {
              self.$message.success(res.msg || '操作成功')
              self.formData.dialogVisible = false
              self.init()
            } else {
              self.$message.error(res ? res.msg : '操作失败')
            }
            }).catch(function() { self.$message.error('操作失败') })
              .finally(function() { self.submitting = false })
          })
        },
        toggleStatus(row) {
          var self = this
          var newStatus = row.status === 1 ? 0 : 1
          sysApi.templateToggle(row.id, newStatus).then(function(res) {
            if (res && res.code === 1) {
              row.status = newStatus
              self.$message.success(res.msg || '操作成功')
            }
          })
        },
        deleteHandle(id) {
          var self = this
          ReggieUI.confirm('确定删除该模板吗？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              sysApi.templateDelete(id).then(function(res) {
                if (res && res.code === 1) {
                  self.$message.success('删除成功')
                  self.init()
                }
              })
            }).catch(function() {})
        }
      }
    })
  </script>
</body>
</html>
