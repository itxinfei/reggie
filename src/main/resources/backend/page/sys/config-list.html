<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统配置 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
</head>
<body>
  <div class="dashboard-container" id="config-app">
    <div class="container">
      <!-- 面包屑导航 -->
      <nav class="ds-breadcrumb" aria-label="面包屑导航">
        <span class="ds-breadcrumb__item">首页</span>
        <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
        <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">系统配置</span>
      </nav>
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :show-actions="true"
        :actions-width="180"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-configType="{ row }">
          <el-tag size="small" :type="typeTagType(row.configType)">{{ typeName(row.configType) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-edit" @click="editRow(row)">编辑</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 编辑弹窗 -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="500px"
      @submit="submitForm"
      @close="formData.dialogVisible = false"
    >
      <!-- 修改点：补全 ref/:model/:rules 与 prop，启用 Element 校验（原 required 无 prop 不生效） -->
      <el-form ref="configForm" :model="formData" :rules="configRules" label-width="100px" size="small">
        <el-form-item label="配置键" prop="configKey">
          <el-input v-model="formData.configKey" :disabled="!!formData.id" placeholder="如：store_name"></el-input>
        </el-form-item>
        <el-form-item label="配置值" prop="configValue">
          <el-input v-model="formData.configValue" placeholder="配置值"></el-input>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="formData.configType" style="width:100%">
            <el-option label="功能开关" :value="1"></el-option>
            <el-option label="运营参数" :value="2"></el-option>
            <el-option label="显示设置" :value="3"></el-option>
            <el-option label="其他" :value="4"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="说明">
          <el-input v-model="formData.description" type="textarea" :rows="2"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/sys.js"></script>
  <script>
    new Vue({
      el: '#config-app',
      data() {
        return {
          loading: false,
          tableData: [],
          // 统计数据
          stats: { total: 0, type1: 0, type2: 0, type3: 0, type4: 0 },
          activeFilter: '',
          lastSearch: {},
          submitting: false,
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'configKey', placeholder: '配置键', width: '180px' },
            { type: 'select', field: 'configType', placeholder: '配置类型', width: '140px',
              options: [
                { label: '功能开关', value: '1' },
                { label: '运营参数', value: '2' },
                { label: '显示设置', value: '3' },
                { label: '其他', value: '4' }
              ] },
            { type: 'input', field: 'keyword', placeholder: '配置值/说明', width: '200px' }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'add', text: '+ 新增配置', type: 'primary' },
            { key: 'refresh', text: '刷新', type: 'default' }
          ],
          // 表格列配置
          columns: [
            { prop: 'configKey', label: '配置键', width: 200, showOverflowTooltip: true, align: 'center' },
            { prop: 'configValue', label: '配置值', minWidth: 300, showOverflowTooltip: true, align: 'center' },
            { prop: 'configType', label: '类型', width: 100, align: 'center', slot: true },
            { prop: 'description', label: '说明', showOverflowTooltip: true, minWidth: 180, align: 'center' }
          ],
          // 弹窗表单
          formData: {
            title: '新增配置',
            dialogVisible: false,
            id: null, configKey: '', configValue: '', configType: 1, description: ''
          },
          // 修改点：配置表单校验规则（配合 el-form :rules + validate()）
          configRules: {
            configKey: [{ required: true, message: '请输入配置键', trigger: 'blur' }],
            configValue: [{ required: true, message: '请输入配置值', trigger: 'blur' }]
          }
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          var self = this
          var typeLabels = { type1: '功能开关', type2: '运营参数', type3: '显示设置', type4: '其他' }
          var typeKeys = ['type1', 'type2', 'type3', 'type4']
          return [
            { key: '', icon: '⚙️', label: '配置总数', value: self.stats.total || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'type1', icon: '🔘', label: '功能开关', value: self.stats.type1 || 0, color: 'success', clickable: true, active: self.activeFilter === 'type1' },
            { key: 'type2', icon: '📊', label: '运营参数', value: self.stats.type2 || 0, color: 'warning', clickable: true, active: self.activeFilter === 'type2' },
            { key: 'type3', icon: '🎨', label: '显示设置', value: self.stats.type3 || 0, color: 'info', clickable: true, active: self.activeFilter === 'type3' }
          ]
        }
      },
      methods: {
        async init(reloadStats = true) {
          this.loading = true
          var ls = this.lastSearch || {}
          var params = {
            configKey: ls.configKey || undefined,
            configType: ls.configType || undefined,
            keyword: ls.keyword || undefined
          }
          var requests = [sysApi.configList()]
          if (reloadStats) { requests.push(this.loadConfigStats()) }
          var results = await Promise.all(requests)
          var listRes = results[0]
          var statsRes = results[1]
          if (listRes && listRes.code === 1) {
            var all = listRes.data || []
            // 客户端分页（configList返回全量数据）
            this.counts = all.length
            var start = ((this.page - 1) * this.pageSize)
            var end = Math.min(start + this.pageSize, all.length)
            this.tableData = all.slice(start, end).map(function(item) {
              return Object.assign({}, item, { _editing: false })
            })
          }
          if (reloadStats && statsRes && statsRes.code === 1) {
            this.stats = Object.assign({}, this.stats, statsRes.data || {})
          }
          this.loading = false
        },
        async loadConfigStats() {
          try {
            var res = await sysApi.configList()
            if (res && res.code === 1) {
              var list = res.data || []
              var stats = { total: list.length, type1: 0, type2: 0, type3: 0, type4: 0 }
              list.forEach(function(item) {
                var t = String(item.configType || '4')
                if (stats.hasOwnProperty('type' + t)) stats['type' + t]++
              })
              return { code: 1, data: stats }
            }
          } catch (err) { console.warn('加载配置统计失败:', err) }
          return { code: 0 }
        },
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.lastSearch = this.activeFilter ? this.buildFilterParams(this.activeFilter) : {}
          this.page = 1
          this.init(false)
        },
        buildFilterParams(key) {
          var map = { type1: '1', type2: '2', type3: '3' }
          return map[key] ? { configType: map[key] } : {}
        },
        // table-bar 回调
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init(false)
        },
        onAction(payload) {
          if (payload.key === 'add') this.openDialog()
          if (payload.key === 'refresh') this.init(true)
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.init(false)
        },
        typeName(type) {
          var map = { 1: '功能开关', 2: '运营参数', 3: '显示设置', 4: '其他' }
          return map[type] || '其他'
        },
        typeTagType(type) {
          var map = { 1: 'success', 2: 'warning', 3: 'info', 4: '' }
          return map[type] || ''
        },
        openDialog() {
          this.formData.title = '新增配置'
          this.formData = { title: '新增配置', dialogVisible: true, id: null, configKey: '', configValue: '', configType: 1, description: '' }
        },
        editRow(row) {
          this.formData.title = '编辑配置'
          this.formData = Object.assign({}, this.formData, { title: '编辑配置', dialogVisible: true }, JSON.parse(JSON.stringify(row)))
        },
        submitForm() {
          var self = this
          self.$refs.configForm.validate(function(valid) {
            if (!valid) {
              self.$message.warning('请完善表单必填项')
              return
            }
            self.submitting = true
          var api = self.formData.id ? sysApi.configUpdate(self.formData) : sysApi.configAdd(self.formData)
          api.then(function(res) {
            if (res && res.code === 1) {
              self.$message.success(res.msg || '操作成功')
              self.formData.dialogVisible = false
              self.init()
            } else {
              self.$message.error(res ? res.msg : '操作失败')
            }
            }).catch(function() { self.$message.error('操作失败') })
            .finally(function() { self.submitting = false })
          })
        },
        deleteHandle(id) {
          var self = this
          ReggieUI.confirm('确定删除该配置吗？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              sysApi.configDelete(id).then(function(res) {
                if (res && res.code === 1) {
                  self.$message.success('删除成功')
                  self.init()
                }
              })
            }).catch(function() {})
        }
      }
    })
  </script>
</body>
</html>
