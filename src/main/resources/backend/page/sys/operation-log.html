<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="log-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">操作日志</h1>
          <p class="ds-page-header__subtitle">查看系统操作审计记录</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        @search="onSearch"
        @reset="onReset"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        empty-hint="试试调整筛选条件"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="false"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-operationType="{ row }">
          <el-tag size="small" :type="opTypeTag(row.operationType)">{{ row.operationType }}</el-tag>
        </template>
        <template #col-requestMethod="{ row }">
          <el-tag size="mini" effect="plain" :type="methodTag(row.requestMethod)">{{ row.requestMethod }}</el-tag>
        </template>
        <template #col-isSuccess="{ row }">
          <i class="el-icon-circle-check" style="color:var(--color-success);font-size:var(--font-size-lg);" v-if="row.isSuccess === 1"></i>
          <i class="el-icon-circle-close" style="color:var(--color-danger);font-size:var(--font-size-lg);" v-else-if="row.isSuccess === 0"></i>
          <span v-else>-</span>
        </template>
        <template #col-operatorName="{ row }">
          <el-tag size="small" type="info">{{ row.operatorName || '-' }}</el-tag>
        </template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/sys.js"></script>
  <script>
    new Vue({
      el: '#log-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { todayCount: 0, totalCount: 0, successCount: 0, errorCount: 0 },
          activeFilter: '',
          lastSearch: {},
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'module', placeholder: '操作模块', width: '150px' },
            { type: 'select', field: 'operationType', placeholder: '操作类型', width: '120px',
              options: [
                { label: '新增', value: 'INSERT' },
                { label: '修改', value: 'UPDATE' },
                { label: '删除', value: 'DELETE' },
                { label: '其他', value: 'OTHER' }
              ] },
            { type: 'input', field: 'operatorName', placeholder: '操作人', width: '140px' },
            { type: 'date', field: 'dateRange', placeholder: '选择日期范围', width: '360px',
              beginField: 'beginTime', endField: 'endTime' }
          ],
          // 表格列配置
          columns: [
            { prop: 'id', label: 'ID', width: 70, align: 'center' },
            { prop: 'operatorId', label: '操作人ID', width: 80, align: 'center' },
            { prop: 'operatorIp', label: '操作IP', width: 120, align: 'center' },
            { prop: 'operatorName', label: '操作人', width: 90, slot: true, align: 'center' },
            { prop: 'module', label: '操作模块', width: 105, align: 'center' },
            { prop: 'operationType', label: '操作类型', width: 80, align: 'center', slot: true },
            { prop: 'description', label: '操作描述', minWidth: 120, align: 'center' },
            { prop: 'requestUrl', label: '请求地址', minWidth: 120, align: 'center' },
            { prop: 'requestMethod', label: '方法', width: 65, align: 'center', slot: true },
            { prop: 'duration', label: '耗时(ms)', width: 85, type: 'number' },
            { prop: 'isSuccess', label: '状态', width: 65, align: 'center', slot: true },
            { prop: 'errorMsg', label: '错误信息', minWidth: 120, align: 'center' },
            { prop: 'createTime', label: '操作时间', width: 150, align: 'center' }
          ]
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          const self = this
          return [
            { key: '', icon: 'ri-file-list-3-line', label: '今日操作', value: self.stats.todayCount || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'total', icon: 'ri-bar-chart-2-line', label: '累计操作', value: self.stats.totalCount || 0, color: 'success', clickable: true, active: self.activeFilter === 'total' },
            { key: 'success', icon: 'ri-checkbox-circle-line', label: '操作成功', value: self.stats.successCount || 0, color: 'info', clickable: true, active: self.activeFilter === 'success' },
            { key: 'error', icon: 'ri-close-circle-line', label: '操作失败', value: self.stats.errorCount || 0, color: 'danger', clickable: true, active: self.activeFilter === 'error' }
          ]
        }
      },
      methods: {
        // 修改点：F9 性能 — 全局操作日志统计不随翻页重算，仅 reloadStats 时纳入 Promise.all
        async init(reloadStats = true) {
          this.loading = true
          const ls = this.lastSearch || {}
          const params = Object.assign({}, ls, { page: this.page, pageSize: this.pageSize })
          const requests = [sysApi.logPage(params)]
          if (reloadStats) { requests.push(this.loadStats()) }
          const results = await Promise.all(requests)
          const logRes = results[0]
          if (logRes && logRes.code === 1) {
            this.tableData = logRes.data.records || []
            this.counts = logRes.data.total || 0
          }
          if (reloadStats) {
            const statsRes = results[1]
            if (statsRes && statsRes.code === 1) {
              this.stats = Object.assign({}, this.stats, statsRes.data || {})
            }
          }
          this.loading = false
        },
        async loadStats() {
          try {
            // 修改点：success/error 改用 pageSize:1 按 isSuccess 过滤取 total，避免 pageSize:999 拉全量导致统计截断
            const [statsRes, successRes, errorRes] = await Promise.all([
              sysApi.logStats(),
              sysApi.logPage({ page: 1, pageSize: 1, isSuccess: 1 }),
              sysApi.logPage({ page: 1, pageSize: 1, isSuccess: 0 })
            ])
            let data = {}
            if (statsRes && String(statsRes.code) === '1') {
              data = Object.assign({}, data, statsRes.data  || {})
            }
            if (successRes && String(successRes.code) === '1') {
              data.successCount = successRes.data.total || 0
            }
            if (errorRes && String(errorRes.code) === '1') {
              data.errorCount = errorRes.data.total || 0
            }
            return { code: 1, data: data }
          } catch (err) {
            console.warn('加载日志统计数据失败:', err)
          }
          return { code: 0 }
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          const self = this
          if (payload.key === '') {
            self.activeFilter = ''
          } else {
            this.activeFilter = payload.activeKey
          }
          self.lastSearch = self.activeFilter ? this.buildFilterParams(self.activeFilter) : {}
          self.page = 1
          this.init(false)
        },
        buildFilterParams(key) {
          if (key === 'success') return { isSuccess: '1' }
          if (key === 'error') return { isSuccess: '0' }
          return {}
        },
        // table-bar 回调
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init(false)
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.init(false)
        },
        opTypeTag(type) {
          const map = { CREATE: 'success', UPDATE: 'warning', DELETE: 'danger', EXPORT: 'info', LOGIN: 'primary' }
          return map[type] || 'info'
        },
        methodTag(method) {
          const map = { GET: 'info', POST: 'success', PUT: 'warning', DELETE: 'danger' }
          return map[method] || 'info'
        }
      }
    })
  </script>
</body>
</html>
