<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    .perm-tree-dialog .el-tree { max-height: 400px; overflow-y: auto; border: 1px solid var(--el-border-light); border-radius: 4px; padding: 10px; }
    .perm-tree-dialog .el-tree-node__content { height: 32px; }
    .perm-tree-dialog .el-tree-node__label { font-size: 13px; }
    .perm-header { display: flex; align-items: center; gap: 8px; }
    .perm-header .el-tag { margin: 0; }
  </style>
</head>
<body>
  <div class="dashboard-container" id="role-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="260"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-roleKey="{ row }">
          <el-tag size="small" type="info">{{ row.roleKey }}</el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status == 1 ? 'success' : 'danger'" size="small">
            {{ row.status == 1 ? '启用' : '禁用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="openPermDialog(row)">权限分配</el-button>
          <el-button type="text" size="small" class="btn-edit" @click="openDialog(row)">编辑</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 新增/编辑弹窗 -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="500px"
      @submit="submitForm"
      @close="formData.dialogVisible = false"
    >
      <!-- 修改点：补全 ref/:model/:rules，启用 Element 校验（原仅手写 if 判断，属"假必填"） -->
      <el-form ref="roleForm" :model="formData" :rules="roleRules" label-width="100px" size="small">
        <el-form-item label="角色名称" prop="roleName">
          <el-input v-model="formData.roleName" placeholder="如：店长"></el-input>
        </el-form-item>
        <el-form-item label="角色标识" prop="roleKey">
          <el-input v-model="formData.roleKey" placeholder="如：manager（英文）"></el-input>
        </el-form-item>
        <el-form-item label="描述">
          <el-input v-model="formData.description" type="textarea" :rows="2"></el-input>
        </el-form-item>
        <el-form-item label="排序">
          <el-input-number v-model="formData.sort" :min="0" :max="999"></el-input-number>
        </el-form-item>
        <el-form-item label="状态">
          <el-radio-group v-model="formData.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 权限分配弹窗 -->
    <el-dialog title="权限分配" :visible.sync="permDialogVisible" custom-class="el-dialog--md unified-dialog perm-tree-dialog"
      :close-on-click-modal="false" :append-to-body="true" :modal-append-to-body="true">
      <div style="margin-bottom: 12px; font-size: 13px; color: var(--el-text-regular);">
        当前角色：<strong>{{ currentRole ? currentRole.roleName : '' }}</strong>
        <span style="margin-left: 12px;">已选 <el-tag type="success" size="mini">{{ checkedPerms.length }}</el-tag> 项权限</span>
      </div>
      <el-tree
        ref="permTree"
        :data="permTreeData"
        show-checkbox
        node-key="id"
        :default-expand-all="true"
        :default-checked-keys="checkedPerms"
        :props="{ children: 'children', label: 'permissionName' }"
        @check-change="handleCheckChange">
        <template slot-scope="{ node, data }">
          <span class="perm-header">
            <i class="el-icon-folder" v-if="data.children && data.children.length" style="color:var(--el-color-primary);margin-right:4px;"></i>
            <i class="el-icon-document" v-else style="color:var(--color-info);margin-right:4px;"></i>
            <span>{{ data.permissionName }}</span>
            <el-tag v-if="data.permissionKey" type="info" size="mini" effect="plain">{{ data.permissionKey }}</el-tag>
          </span>
        </template>
      </el-tree>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="permDialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitPerms" :loading="permSubmitting">保存权限</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/sys.js"></script>
  <script>
    new Vue({
      el: '#role-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { total: 0, enabled: 0, disabled: 0, withPerms: 0 },
          activeFilter: '',
          lastSearch: {},
          submitting: false,
          // 搜索配置
          searchConfig: [
            { type: 'select', field: 'roleName', placeholder: '角色名称', width: '180px',
              options: [],
              loading: false,
              filterable: true,
              dynamicOptions: true }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'add', text: '+ 新增角色', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'roleName', label: '角色名称', width: 150, align: 'center' },
            { prop: 'roleKey', label: '角色标识', width: 120, slot: true, align: 'center' },
            { prop: 'description', label: '描述', showOverflowTooltip: true, align: 'center' },
            { prop: 'sort', label: '排序', width: 80, align: 'center' },
            { prop: 'status', label: '状态', width: 100, align: 'center', slot: true }
          ],
          // 弹窗表单
          formData: {
            title: '新增角色',
            dialogVisible: false,
            id: null, roleName: '', roleKey: '', description: '', sort: 0, status: 1
          },
          // 修改点：角色表单校验规则（配合 el-form :rules + validate()）
          roleRules: {
            roleName: [{ required: true, whitespace: true, message: '请输入角色名称', trigger: 'blur' }],
            roleKey: [{ required: true, whitespace: true, message: '请输入角色标识', trigger: 'blur' }]
          },
          // 权限分配
          permDialogVisible: false,
          permSubmitting: false,
          currentRole: null,
          permTreeData: [],
          checkedPerms: []
        }
      },
      created() {
        this.loadData()
        this.loadRoleOptions()
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '👥', label: '角色总数', value: self.stats.total || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'enabled', icon: '✅', label: '已启用', value: self.stats.enabled || 0, color: 'success', clickable: true, active: self.activeFilter === 'enabled' },
            { key: 'disabled', icon: '⏸️', label: '已禁用', value: self.stats.disabled || 0, color: 'warning', clickable: true, active: self.activeFilter === 'disabled' },
            { key: 'withPerms', icon: '🔐', label: '已分配权限', value: self.stats.withPerms || 0, color: 'info', clickable: true, active: self.activeFilter === 'withPerms' }
          ]
        }
      },
      methods: {
        // 修改点：F9 性能 — 全局角色统计不随翻页重算，仅 reloadStats 时纳入 Promise.all
        async init(reloadStats = true) {
          this.loading = true
          var ls = this.lastSearch || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            roleName: ls.roleName || undefined,
            status: ls.status || undefined
          }
          var requests = [sysApi.rolePage(params)]
          if (reloadStats) { requests.push(this.loadRoleStats()) }
          var results = await Promise.all(requests)
          var roleRes = results[0]
          if (roleRes && roleRes.code === 1) {
            this.tableData = roleRes.data.records || []
            this.counts = roleRes.data.total || 0
          }
          if (reloadStats) {
            var statsRes = results[1]
            if (statsRes && statsRes.code === 1) {
              this.stats = Object.assign({}, this.stats, statsRes.data || {})
            }
          }
          this.loading = false
        },
        async loadRoleStats() {
          try {
            // 修改点：改为调用后端 /sys/role/stats SQL 聚合接口，避免 pageSize:999 拉全量遍历 withPerms
            var res = await sysApi.roleStats()
            if (String(res.code) === '1' && res.data) {
              var d = res.data
              return {
                code: 1,
                data: {
                  total: Number(d.total) || 0,
                  enabled: Number(d.enabled) || 0,
                  disabled: Number(d.disabled) || 0,
                  withPerms: Number(d.withPerms) || 0
                }
              }
            }
          } catch (err) { console.warn('加载角色统计失败:', err) }
          return { code: 0 }
        },
        async loadRoleOptions() {
          var self = this
          var searchItem = self.searchConfig.find(function(s) { return s.field === 'roleName' })
          if (searchItem) searchItem.loading = true
          try {
            var res = await sysApi.roleOptions()
            if (String(res.code) === '1' && res.data) {
              var options = (res.data.names || []).map(function(n) {
                return { label: n, value: n }
              })
              if (searchItem) searchItem.options = options
            }
          } catch (err) {
            if (err.message !== 'NOTLOGIN') console.error('加载角色选项失败:', err)
          } finally {
            if (searchItem) searchItem.loading = false
          }
        },
        loadData() {
          this.init(true)
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          var self = this
          if (payload.key === '') {
            self.activeFilter = ''
          } else {
            self.activeFilter = payload.activeKey
          }
          self.lastSearch = self.activeFilter ? this.buildFilterParams(self.activeFilter) : {}
          self.page = 1
          this.init(false)
        },
        buildFilterParams(key) {
          if (key === 'enabled') return { status: '1' }
          if (key === 'disabled') return { status: '0' }
          return {}
        },
        // table-bar 回调
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init(false)
        },
        onAction(payload) {
          if (payload.key === 'add') this.openDialog()
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.init(false)
        },
        openDialog(row) {
          if (row) {
            this.formData.title = '编辑角色'
            this.formData = Object.assign({}, this.formData, JSON.parse(JSON.stringify(row)))
          } else {
            this.formData.title = '新增角色'
            this.formData = { title: '新增角色', dialogVisible: true, id: null, roleName: '', roleKey: '', description: '', sort: 0, status: 1 }
          }
          this.formData.dialogVisible = true
        },
        submitForm() {
          const self = this
          let passed = false
          self.$refs.roleForm.validate(function(valid) { passed = valid })
          if (!passed) {
            self.$message.warning('请填写角色名称和标识')
            return
          }
          self.submitting = true
          var api = self.formData.id ? sysApi.roleUpdate(self.formData) : sysApi.roleAdd(self.formData)
          api.then(function(res) {
            if (res && res.code === 1) {
              self.$message.success(res.msg || '操作成功')
              self.formData.dialogVisible = false
              self.init()
            } else {
              self.$message.error(res ? res.msg : '操作失败')
            }
          }).catch(function() { self.$message.error('操作失败') })
            .finally(function() { self.submitting = false })
        },
        deleteHandle(id) {
          var self = this
          ReggieUI.confirm('确定删除该角色吗？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              sysApi.roleDelete(id).then(function(res) {
                if (res && res.code === 1) {
                  self.$message.success('删除成功')
                  self.init()
                }
              })
            }).catch(function() {})
        },
        // ========== 权限分配 ==========
        openPermDialog(row) {
          this.currentRole = row
          this.permDialogVisible = true
          this.loadPermTree()
          this.loadRolePerms(row.id)
        },
        loadPermTree() {
          var self = this
          sysApi.permissionTree().then(function(res) {
            if (res && res.code === 1) {
              self.permTreeData = self.buildTree(res.data || [])
            }
          })
        },
        buildTree(flatList) {
          var map = new Map()
          var roots = []
          flatList.forEach(function(item) {
            map.set(item.id, Object.assign({}, item, { children: [] }))
          })
          flatList.forEach(function(item) {
            if (item.parentId == 0) {
              roots.push(map.get(item.id))
            } else {
              var parent = map.get(item.parentId)
              if (parent) {
                parent.children.push(map.get(item.id))
              }
            }
          })
          return roots
        },
        loadRolePerms(roleId) {
          var self = this
          sysApi.rolePermissions(roleId).then(function(res) {
            if (res && res.code === 1) {
              self.checkedPerms = res.data || []
              self.$nextTick(function() {
                if (self.$refs.permTree) {
                  self.$refs.permTree.setCheckedKeys(self.checkedPerms)
                }
              })
            }
          })
        },
        handleCheckChange() {
          if (this.$refs.permTree) {
            this.checkedPerms = this.$refs.permTree.getCheckedKeys()
          }
        },
        submitPerms() {
          var keys = this.$refs.permTree ? this.$refs.permTree.getCheckedKeys() : this.checkedPerms
          this.permSubmitting = true
          var self = this
          sysApi.assignPermissions(this.currentRole.id, keys).then(function(res) {
            if (res && res.code === 1) {
              self.$message.success('权限分配成功')
              self.permDialogVisible = false
            } else {
              self.$message.error(res ? res.msg : '操作失败')
            }
          }).catch(function() { self.$message.error('操作失败') })
            .finally(function() { self.permSubmitting = false })
        }
      }
    })
  </script>
</body>
</html>
