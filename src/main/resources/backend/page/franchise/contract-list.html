<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加盟合同管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <div class="dashboard-container" id="contract-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">加盟合同管理</h1>
          <p class="ds-page-header__subtitle">维护加盟合同与抽成规则，支撑分账结算</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="180"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-commissionType="{ row }">
          <el-tag :type="row.commissionType === 1 ? 'success' : 'warning'" size="small">
            {{ row.commissionType === 1 ? '按比例' : '固定金额' }}
          </el-tag>
        </template>
        <template #col-commission="{ row }">
          <span v-if="row.commissionType === 1">{{ (row.commissionRate * 100).toFixed(2) }}%</span>
          <span v-else>{{ formatMoney(row.commissionAmount) }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'info'" size="small">
            {{ row.status === 1 ? '生效中' : '已终止' }}
          </el-tag>
        </template>
        <template #col-franchisee="{ row }">
          {{ franchiseeName(row.franchiseeId) }}
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 新增/编辑弹窗 -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      :submit-loading="submitting"
      width="45%"
      @submit="submitForm"
      @close="handleClose"
    >
      <el-form ref="contractForm" :model="formData" :rules="formRules" label-width="110px" size="small">
        <el-form-item label="加盟商：" prop="franchiseeId">
          <el-select v-model="formData.franchiseeId" placeholder="请选择加盟商" filterable style="width: 100%">
            <el-option v-for="f in franchiseeOptions" :key="f.id" :label="f.name" :value="f.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="合同编号：" prop="contractNo">
          <el-input v-model="formData.contractNo" placeholder="请输入合同编号" maxlength="50"></el-input>
        </el-form-item>
        <el-form-item label="合同起止：">
          <el-date-picker
            v-model="formData.dateRange"
            type="daterange"
            range-separator="至"
            start-placeholder="开始日期"
            end-placeholder="结束日期"
            value-format="yyyy-MM-dd"
            style="width: 100%"
          ></el-date-picker>
        </el-form-item>
        <el-form-item label="抽成方式：" prop="commissionType">
          <el-radio-group v-model="formData.commissionType">
            <el-radio :label="1">按营业额比例</el-radio>
            <el-radio :label="2">固定金额/月</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="抽成比例：" prop="commissionRate" v-if="formData.commissionType === 1">
          <el-input v-model="formData.commissionRate" placeholder="请输入抽成比例，如 5 表示 5%" maxlength="8">
            <template slot="append">%</template>
          </el-input>
          <div class="el-form-item__help" style="color: var(--text-secondary); font-size: var(--font-size-xs); line-height: 1.5; margin-top: 4px;">按营业额的比例抽成，示例：5 = 抽取营业额的 5%</div>
        </el-form-item>
        <el-form-item label="固定抽成：" prop="commissionAmount" v-if="formData.commissionType === 2">
          <el-input v-model="formData.commissionAmount" placeholder="请输入每周期固定抽成金额（元）" maxlength="12">
            <template slot="prepend">¥</template>
          </el-input>
          <div class="el-form-item__help" style="color: var(--text-secondary); font-size: var(--font-size-xs); line-height: 1.5; margin-top: 4px;">每结算周期向加盟商收取的固定金额（元）</div>
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="1">生效中</el-radio>
            <el-radio :label="0">已终止</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="备注：">
          <el-input v-model="formData.remark" type="textarea" :rows="2" placeholder="请输入备注" maxlength="500"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/franchise.js"></script>
  <script>
    new Vue({
      el: '#contract-app',
      data() {
        return {
          loading: false,
          submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
          action: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          franchiseeOptions: [], // 加盟商下拉（含表格名称回显）
          franchiseeMap: {},
          // 搜索配置
          searchConfig: [
            { type: 'select', field: 'franchiseeId', placeholder: '请选择加盟商', width: '200px',
              options: [] },
            { type: 'select', field: 'status', placeholder: '请选择状态', width: '150px',
              options: [
                { label: '生效中', value: '1' },
                { label: '已终止', value: '0' }
              ] }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'add', text: '+ 新增加盟合同', type: 'primary' }
          ],
          // 表格列配置（对齐由 components.js resolveColAlign 统一控制：文本居中、金额/数字右对齐）
          columns: [
            { prop: 'contractNo', label: '合同编号', width: 160, showOverflowTooltip: true },
            { prop: 'franchiseeId', label: '加盟商', slot: true, minWidth: 120, showOverflowTooltip: true },
            { prop: 'commissionType', label: '抽成方式', slot: true, width: 100 },
            { prop: 'commission', label: '抽成规则', slot: true, minWidth: 120 },
            { prop: 'startDate', label: '开始日期', width: 110 },
            { prop: 'endDate', label: '结束日期', width: 110 },
            { prop: 'status', label: '状态', slot: true, width: 90 },
            { prop: 'remark', label: '备注', minWidth: 120, showOverflowTooltip: true }
          ],
          // 弹窗表单
          formData: {
            title: '新增加盟合同',
            dialogVisible: false,
            id: '',
            franchiseeId: '',
            contractNo: '',
            dateRange: [],
            commissionType: 1,
            commissionRate: '',
            commissionAmount: '',
            status: 1,
            remark: ''
          },
          formRules: {
            franchiseeId: [{ required: true, message: '请选择加盟商', trigger: 'change' }],
            contractNo: [{ required: true, whitespace: true, message: '请输入合同编号', trigger: 'blur' }]
          },
          searchValues: {}
        }
      },
      created() {
        this.loadFranchisees()
        this.init()
      },
      methods: {
        formatMoney(v) {
          if (v === null || v === undefined || v === '') return '-'
          return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        },
        franchiseeName(id) {
          const f = this.franchiseeMap[id]
          return f ? f.name : (id || '-')
        },
        // 加载加盟商下拉（供搜索框与表单使用）
        async loadFranchisees() {
          try {
            const res = await franchiseeList()
            if (String(res.code) === '1') {
              const list = res.data || []
              this.franchiseeOptions = list
              var map = {}
              list.forEach(function(f) { map[f.id] = f })
              this.franchiseeMap = map
              // 同步搜索下拉选项
              this.searchConfig[0].options = list.map(function(f) { return { label: f.name, value: String(f.id) } })
            }
          } catch (err) {
            console.warn('加载加盟商下拉失败:', err)
          }
        },
        async init() {
          this.loading = true
          var sv = this.searchValues || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            franchiseeId: sv.franchiseeId || undefined,
            status: sv.status || undefined
          }
          try {
            const res = await contractPage(params)
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } catch (err) {
            ReggieUI.error('请求失败：' + err)
          }
          this.loading = false
        },
        // table-bar 回调
        onSearch(searchParams) {
          this.searchValues = searchParams
          this.page = 1
          this.init()
        },
        onReset() {
          this.searchValues = {}
          this.page = 1
          this.init()
        },
        onAction(payload) {
          if (payload.key === 'add') this.addHandle()
        },
        // 分页
        onPageChange(payload) {
          this.page = payload.page
          this.init()
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.init()
        },
        // CRUD 操作
        addHandle() {
          this.action = 'add'
          this.formData.title = '新增加盟合同'
          this.formData.id = ''
          this.formData.franchiseeId = ''
          this.formData.contractNo = ''
          this.formData.dateRange = []
          this.formData.commissionType = 1
          this.formData.commissionRate = ''
          this.formData.commissionAmount = ''
          this.formData.status = 1
          this.formData.remark = ''
          this.formData.dialogVisible = true
        },
        editHandle(row) {
          this.action = 'edit'
          this.formData.title = '修改加盟合同'
          this.formData.id = row.id
          this.formData.franchiseeId = row.franchiseeId
          this.formData.contractNo = row.contractNo
          this.formData.dateRange = (row.startDate && row.endDate) ? [row.startDate, row.endDate] : []
          this.formData.commissionType = row.commissionType
          // 比例抽成：数据库存小数(0.05)，界面展示百分比(5)
          this.formData.commissionRate = row.commissionType === 1 && row.commissionRate != null
            ? (row.commissionRate * 100).toString() : ''
          this.formData.commissionAmount = row.commissionAmount != null ? row.commissionAmount : ''
          this.formData.status = row.status
          this.formData.remark = row.remark
          this.formData.dialogVisible = true
        },
        submitForm() {
          if (this.submitting) return // 提交防重
          const self = this
          const passed = false
          self.$refs.contractForm.validate(function(valid) { passed = valid })
          if (!passed) {
            ReggieUI.warning('请完善表单必填项')
            return
          }
          if (!self.formData.franchiseeId) {
            ReggieUI.error('请选择加盟商'); return
          }
          if (!self.formData.contractNo || !self.formData.contractNo.trim()) {
            ReggieUI.error('请输入合同编号'); return
          }
          var data = {
            franchiseeId: self.formData.franchiseeId,
            contractNo: self.formData.contractNo,
            commissionType: self.formData.commissionType,
            settleCycle: 1, // 月结
            status: self.formData.status,
            remark: self.formData.remark || null
          }
          if (self.formData.dateRange && self.formData.dateRange.length === 2) {
            data.startDate = self.formData.dateRange[0]
            data.endDate = self.formData.dateRange[1]
          }
          if (self.formData.commissionType === 1) {
            const rate = Number(self.formData.commissionRate)
            if (!self.formData.commissionRate || isNaN(rate) || rate <= 0 || rate >= 100) {
              ReggieUI.error('抽成比例必须在 0~100 之间'); return
            }
            // 界面百分比 → 数据库小数（5 → 0.0500）
            data.commissionRate = (rate / 100).toFixed(4)
            data.commissionAmount = null
          } else {
            const amt = Number(self.formData.commissionAmount)
            if (!self.formData.commissionAmount || isNaN(amt) || amt < 0) {
              ReggieUI.error('请输入有效的固定抽成金额'); return
            }
            data.commissionAmount = amt
            data.commissionRate = null
          }
          self.submitting = true
          if (this.action === 'add') {
            addContract(data).then(res => {
              self.submitting = false
              if (res.code === 1) {
                ReggieUI.success('加盟合同添加成功！')
                self.formData.dialogVisible = false
                self.init()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => { self.submitting = false; ReggieUI.error('请求失败：' + err) })
          } else {
            data.id = self.formData.id
            updateContract(data).then(res => {
              self.submitting = false
              if (res.code === 1) {
                ReggieUI.success('加盟合同修改成功！')
                self.formData.dialogVisible = false
                self.init()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => { self.submitting = false; ReggieUI.error('请求失败：' + err) })
          }
        },
        deleteHandle(id) {
          const self = this
          ReggieUI.confirm('此操作将删除该加盟合同, 是否继续?', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(function() {
            deleteContract(id).then(res => {
              if (res.code === 1) {
                ReggieUI.success('删除成功！')
                self.init()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => { ReggieUI.error('请求失败：' + err) })
          })
        },
        handleClose() {
          this.formData.dialogVisible = false
        }
      }
    })
  </script>
</body>
</html>
