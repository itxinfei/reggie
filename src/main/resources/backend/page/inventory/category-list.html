<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食材分类管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="category-app">
    <div class="container">
      <div class="tableBar">
        <el-button type="primary" class="continue" @click="addHandle">
          + 新增食材分类
        </el-button>
      </div>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="分类名称" /></el-table-column>
        <el-table-column prop="sort" label="排序" /></el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination class="pageList" :page-sizes="[10,20,30,40]" :page-size="pageSize" layout="total, sizes, prev, pager, next, jumper" :total="counts" :current-page.sync="page" @size-change="handleSizeChange" @current-change="handleCurrentChange"></el-pagination>
    </div>
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="600px" :before-close="handleClose">
      <el-form class="demo-form-inline" label-width="120px">
        <el-form-item label="分类名称：">
          <el-input v-model="formData.name" placeholder="请输入分类名称" maxlength="14" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="排序：">
          <el-input v-model="formData.sort" type="number" placeholder="请输入排序" style="width: 293px;" />
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/inventory.js"></script>
    <script>
      new Vue({
        el: '#category-app',
        data() {
          return {
            loading: false,
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            formData: {
              title: '新增食材分类',
              dialogVisible: false,
              id: '',
              name: '',
              sort: ''
            }
          }
        },
        created() {
          this.init()
        },
        methods: {
          async init() {
            const params = { page: this.page, pageSize: this.pageSize }
            await matCategoryPage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records
                this.counts = Number(res.data.total)
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增食材分类'
            this.formData.name = ''
            this.formData.sort = ''
            this.formData.id = ''
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改食材分类'
            this.formData.name = row.name
            this.formData.sort = row.sort
            this.formData.id = row.id
            this.formData.dialogVisible = true
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该分类, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteMatCategory(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          submitForm() {
            const fd = this.formData
            if (!fd.name && fd.name !== 0) {
              this.$message.error('请输入分类名称')
              return
            }
            if (fd.sort === '' && fd.sort !== 0) {
              this.$message.error('请输入排序')
              return
            }
            const reg = /^\d+$/
            if (!reg.test(String(fd.sort))) {
              this.$message.error('排序只能输入数字类型')
              return
            }
            if (this.action === 'add') {
              addMatCategory({ name: fd.name, sort: fd.sort }).then(res => {
                if (res.code === 1) {
                  this.$message.success('分类添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              updateMatCategory({ id: fd.id, name: fd.name, sort: fd.sort }).then(res => {
                if (res.code === 1) {
                  this.$message.success('分类修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
