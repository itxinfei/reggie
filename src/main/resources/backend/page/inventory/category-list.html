<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食材分类管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
</head>
<body>
  <div class="dashboard-container" id="category-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="分类名称" class="el-select--narrow-xs" clearable filterable @change="handleQuery">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
        </template>
      </table-bar>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-materialCount="{ row }">
          <span style="color: #606266; font-weight: 500;">{{ row.materialCount || 0 }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 修改点：使用 <crud-dialog> 统一弹窗组件替代手写 el-dialog -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="480px"
      @submit="submitForm"
      @close="handleClose"
    >
      <el-form class="demo-form-inline" label-width="120px" size="small">
        <el-form-item label="分类名称：">
          <el-input v-model="formData.name" placeholder="请输入分类名称" maxlength="14" style="width: 240px;" />
        </el-form-item>
        <el-form-item label="排序：">
          <el-input v-model="formData.sort" type="number" placeholder="数值越小越靠前" style="width: 240px;" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#category-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 修改点：crud-table 列配置（替代手写 el-table-column）
          columns: [
            { prop: 'name', label: '分类名称', minWidth: 160, showOverflowTooltip: true },
            { prop: 'sort', label: '排序', width: 100, align: 'center' },
            { prop: 'materialCount', label: '食材数量', width: 120, align: 'center', slot: true }
          ],
          stats: { totalCategories: 0 },
          // 搜索条件
          input: { name: '' },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增食材分类', type: 'primary' }
          ],
          // 动态下拉选项
          filterOptions: { names: [] },
          optionsLoading: false,
          optionsLoadError: false,
          formData: {
            title: '新增食材分类',
            dialogVisible: false,
            id: '',
            name: '',
            sort: ''
          }
        }
      },
      created() {
        this.fetchData()
        this.loadFilterOptions()
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          return [
            { key: 'total', icon: '📂', label: '食材分类总数', value: this.stats.totalCategories || 0, color: 'primary' }
          ]
        }
      },
      methods: {
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        // 修改点：统一方法名 fetchData（供 crud-table 分页事件调用）
        async fetchData() {
          const params = { page: this.page, pageSize: this.pageSize }
          if (this.input.name) params.name = this.input.name

          // 并行加载列表和统计
          const [pageRes, statsRes] = await Promise.all([
            matCategoryPage(params),
            this.loadStats()
          ])

          if (String(pageRes.code) === '1') {
            this.tableData = pageRes.data.records || []
            this.counts = Number(pageRes.data.total) || 0
          } else {
            this.$message.error(pageRes.msg || '操作失败')
          }

          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
        },
        // 加载分类下拉选项
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await matCategoryList()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.map(function(c) { return c.name })
            }
          } catch (err) {
            this.optionsLoadError = true
          } finally {
            this.optionsLoading = false
          }
        },
        // 加载统计
        async loadStats() {
          try {
            const res = await matCategoryList()
            if (String(res.code) === '1') {
              return {
                code: 1,
                data: { totalCategories: (res.data || []).length }
              }
            }
          } catch (err) {
            console.warn('加载分类统计失败:', err)
          }
          return { code: 0 }
        },
        handleQuery() {
          this.page = 1
          this.fetchData()
        },
        reset() {
          this.input.name = ''
          this.page = 1
          this.fetchData()
        },
        addHandle() {
          this.formData = {
            title: '新增食材分类',
            dialogVisible: true,
            id: '',
            name: '',
            sort: ''
          }
        },
        editHandle(row) {
          this.formData = {
            title: '修改食材分类',
            dialogVisible: true,
            id: row.id,
            name: row.name,
            sort: row.sort
          }
        },
        handleClose() {
          this.formData.dialogVisible = false
        },
        submitForm() {
          const fd = this.formData
          if (!fd.name && fd.name !== 0) {
            this.$message.error('请输入分类名称')
            return
          }
          if (fd.sort === '' && fd.sort !== 0) {
            this.$message.error('请输入排序')
            return
          }
          const reg = /^\d+$/
          if (!reg.test(String(fd.sort))) {
            this.$message.error('排序只能输入数字类型')
            return
          }
          const action = this.formData.id ? updateMatCategory : addMatCategory
          const params = this.formData.id
            ? { id: fd.id, name: fd.name, sort: fd.sort }
            : { name: fd.name, sort: fd.sort }

          action(params).then(res => {
            if (res.code === 1) {
              this.$message.success(this.formData.id ? '分类修改成功！' : '分类添加成功！')
              this.formData.dialogVisible = false
              this.fetchData()
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          })
        },
        deleteHandle(id) {
          this.$confirm('此操作将永久删除该分类, 是否继续?', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(() => {
            deleteMatCategory(id).then(res => {
              if (res.code === 1) {
                this.$message.success('删除成功！')
                // 当前页删除后为空则回退
                if (this.tableData.length === 1 && this.page > 1) {
                  this.page--
                }
                this.fetchData()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        // 修改点：分页处理改为 crud-table 事件驱动（参考 supplier-list 已验证模式）
        onPageChange({ page, pageSize }) {
          this.page = page
          this.pageSize = pageSize
          this.fetchData()
        },
        onSizeChange(val) {
          this.pageSize = val
          this.page = 1
          this.fetchData()
        }
      }
    })
  </script>
</body>
</html>
