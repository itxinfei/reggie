<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食材分类管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="category-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">食材分类</h1>
          <p class="ds-page-header__subtitle">管理食材分类与排序</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="分类名称" class="el-select--narrow-xs" clearable filterable @change="handleQuery">
            <el-option v-for="(n, index) in filterOptions.names" :key="index" :label="n" :value="n"></el-option>
          </el-select>
        </template>
      </table-bar>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-actions="true"
        :actions-width="240"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-materialCount="{ row }">
          <span style="color: var(--el-text-regular); font-weight: 500;">{{ row.materialCount || 0 }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 修改点：使用 <crud-dialog> 统一弹窗组件替代手写 el-dialog -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      :submit-loading="submitting"
      size="sm"
      @submit="submitForm"
      @close="handleClose"
    >
      <!-- 修改点：移除误导性死 class demo-form-inline；label-width 120→80（"分类名称/排序"短标签） -->
      <!-- 修改点：补全 ref/:model/:rules，启用 Element 校验；移除 240px 魔数宽度，统一弹窗内 100% 自适应 -->
      <el-form ref="categoryForm" :model="formData" :rules="categoryRules" label-width="80px" size="small">
        <el-form-item label="分类名称：" prop="name">
          <el-input v-model="formData.name" placeholder="请输入分类名称" maxlength="14" />
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input v-model="formData.sort" type="number" placeholder="数值越小越靠前" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#category-app',
      data() {
        return {
          loading: false,
          submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 修改点：crud-table 列配置（替代手写 el-table-column）
          columns: [
            { prop: 'name', label: '分类名称', minWidth: 160 },
            { prop: 'sort', label: '排序', width: 70, align: 'center' },
            { prop: 'materialCount', label: '食材数量', width: 90, slot: true, type: 'number' }
          ],
          stats: { totalCategories: 0 },
          // 搜索条件
          input: { name: '' },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增食材分类', type: 'primary' }
          ],
          // 动态下拉选项
          filterOptions: { names: [] },
          optionsLoading: false,
          optionsLoadError: false,
          formData: {
            title: '新增食材分类',
            dialogVisible: false,
            id: '',
            name: '',
            sort: ''
          },
          // 修改点：分类表单校验规则（配合 el-form :rules + validate()）
          categoryRules: {
            name: [{ required: true, whitespace: true, message: '请输入分类名称', trigger: 'blur' }],
            sort: [
              { required: true, message: '请输入排序', trigger: 'blur' },
              { validator: function(rule, value, callback) {
                  if (value === '' || value === null || value === undefined) { callback(); return }
                  if (!/^\d+$/.test(String(value))) { callback(new Error('排序只能输入数字类型')); return }
                  callback()
                }, trigger: 'blur' }
            ]
          }
        }
      },
      created() {
        this.fetchData(true)
        this.loadFilterOptions()
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          return [
            { key: 'total', icon: 'ri-folder-line', label: '食材分类总数', value: this.stats.totalCategories || 0, color: 'primary' }
          ]
        }
      },
      methods: {
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
          // 修改点：统一方法名 fetchData（供 crud-table 分页事件调用）；reloadStats=true 才重算全局统计
          async fetchData(reloadStats = true) {
          const params = { page: this.page, pageSize: this.pageSize }
          if (this.input.name) params.name = this.input.name

          // 修改点：F9 性能 — 列表只查当前页，全局统计仅 reloadStats 时重算
          const requests = [matCategoryPage(params)]
          if (reloadStats) { requests.push(this.loadStats()) }
          const results = await Promise.all(requests)
          const pageRes = results[0]
          if (String(pageRes.code) === '1') {
            this.tableData = pageRes.data.records || []
            this.counts = Number(pageRes.data.total) || 0
          } else {
            ReggieUI.error(pageRes.msg || '操作失败')
          }

          if (reloadStats) {
            const statsRes = results[1]
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
        },
        // 加载分类下拉选项
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await matCategoryList()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.map(function(c) { return c.name })
            }
          } catch (err) {
            this.optionsLoadError = true
          } finally {
            this.optionsLoading = false
          }
        },
        // 加载统计
        async loadStats() {
          try {
            const res = await matCategoryList()
            if (String(res.code) === '1') {
              return {
                code: 1,
                data: { totalCategories: (res.data || []).length }
              }
            }
          } catch (err) {
            console.warn('加载分类统计失败:', err)
          }
          return { code: 0 }
        },
        handleQuery() {
          this.page = 1
          this.fetchData(false)
        },
        reset() {
          this.input.name = ''
          this.page = 1
          this.fetchData(false)
        },
        addHandle() {
          this.formData = {
            title: '新增食材分类',
            dialogVisible: true,
            id: '',
            name: '',
            sort: ''
          }
        },
        editHandle(row) {
          this.formData = {
            title: '修改食材分类',
            dialogVisible: true,
            id: row.id,
            name: row.name,
            sort: row.sort
          }
        },
        handleClose() {
          this.formData.dialogVisible = false
        },
        async submitForm() {
          if (this.submitting) return // 提交防重
          const self = this
          const valid = await new Promise(function(resolve) {
            self.$refs.categoryForm.validate(function(v) { resolve(v) })
          })
          if (!valid) { ReggieUI.warning('请完善表单必填项'); return }
          self.submitting = true
          const fd = self.formData
          const action = fd.id ? updateMatCategory : addMatCategory
          const params = this.formData.id
            ? { id: fd.id, name: fd.name, sort: fd.sort }
            : { name: fd.name, sort: fd.sort }

          action(params).then(res => {
            self.submitting = false
            if (res.code === 1) {
              ReggieUI.success(this.formData.id ? '分类修改成功！' : '分类添加成功！')
              this.formData.dialogVisible = false
              this.fetchData(true)
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(err => {
            self.submitting = false
            ReggieUI.error('请求失败：' + err)
          })
        },
        deleteHandle(id) {
          ReggieUI.confirm('此操作将永久删除该分类, 是否继续?', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(() => {
            deleteMatCategory(id).then(res => {
              if (res.code === 1) {
                ReggieUI.success('删除成功！')
                // 当前页删除后为空则回退
                if (this.tableData.length === 1 && this.page > 1) {
                  this.page--
                }
                this.fetchData(true)
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => {
              ReggieUI.error('请求失败：' + err)
            })
          })
        },
        // 修改点：分页处理改为 crud-table 事件驱动（参考 supplier-list 已验证模式）
        onPageChange({ page, pageSize }) {
          this.page = page
          this.pageSize = pageSize
          this.fetchData(false)
        },
        onSizeChange(val) {
          this.pageSize = val
          this.page = 1
          this.fetchData(false)
        }
      }
    })
  </script>
</body>
</html>
