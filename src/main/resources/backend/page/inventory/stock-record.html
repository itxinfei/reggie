<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存记录 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
</head>
<body>
  <div class="dashboard-container" id="stock-record-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset">
        <template slot="search-extra">
          <el-select v-model="input.materialId" placeholder="食材" class="el-select--narrow" clearable filterable @change="handleQuery">
            <el-option v-for="item in materialOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
          <el-select v-model="input.type" placeholder="类型" class="el-select--narrow-xs" clearable @change="handleQuery">
            <el-option label="入库" value="IN"></el-option>
            <el-option label="出库" value="OUT"></el-option>
            <el-option label="盘点" value="CHECK"></el-option>
          </el-select>
          <el-date-picker v-model="input.dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd" class="el-date-editor--md" @change="handleQuery" size="small"></el-date-picker>
        </template>
      </table-bar>

      <!-- ========== 数据表格 ========== -->
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column label="食材名称" min-width="140">
          <template slot-scope="scope">{{ scope.row.materialName }}</template>
        </el-table-column>
        <el-table-column label="类型" width="90" align="center">
          <template slot-scope="scope">
            <el-tag :type="scope.row.type == 'IN' ? 'success' : scope.row.type == 'OUT' ? 'danger' : 'info'" size="small">
              {{ scope.row.type == 'IN' ? '入库' : scope.row.type == 'OUT' ? '出库' : '盘点' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="quantity" label="数量" width="100" align="center" /></el-table-column>
        <el-table-column label="单价" width="100" align="right">
          <template slot-scope="scope">￥{{ scope.row.unitPrice }}</template>
        </el-table-column>
        <el-table-column label="总金额" width="120" align="right">
          <template slot-scope="scope">￥{{ scope.row.totalAmount }}</template>
        </el-table-column>
        <el-table-column prop="remark" label="备注" min-width="150" show-overflow-tooltip /></el-table-column>
        <el-table-column prop="createdTime" label="操作时间" width="170" /></el-table-column>
      </el-table>
      <el-pagination class="pageList" :page-sizes="[10,20,30,40]" :page-size="pageSize" layout="total, sizes, prev, pager, next, jumper" :total="counts" :current-page.sync="page" @size-change="handleSizeChange" @current-change="handleCurrentChange"></el-pagination>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#stock-record-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计
          stats: { totalRecords: 0, inCount: 0, outCount: 0, checkCount: 0 },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [],
          input: { materialId: '', type: '', dateRange: '' },
          materialOptions: []
        }
      },
      created() {
        this.init()
        this.loadMaterialOptions()
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: 'total', icon: '📝', label: '总记录数', value: self.stats.totalRecords || 0, color: 'primary' },
            { key: 'in', icon: '📥', label: '入库次数', value: self.stats.inCount || 0, color: 'success' },
            { key: 'out', icon: '📤', label: '出库次数', value: self.stats.outCount || 0, color: 'danger' },
            { key: 'check', icon: '📋', label: '盘点次数', value: self.stats.checkCount || 0, color: 'info' }
          ]
        }
      },
      methods: {
        async init() {
          const params = { page: this.page, pageSize: this.pageSize }
          if (this.input.materialId) params.materialId = this.input.materialId
          if (this.input.type) params.type = this.input.type
          if (this.input.dateRange) {
            params.startDate = this.input.dateRange[0]
            params.endDate = this.input.dateRange[1]
          }

          // 并行加载列表和统计
          const [pageRes, statsRes] = await Promise.all([
            stockRecordPage(params),
            this.loadStats()
          ])

          if (String(pageRes.code) === '1') {
            this.tableData = pageRes.data.records || []
            this.counts = Number(pageRes.data.total) || 0
          } else {
            this.$message.error(pageRes.msg || '操作失败')
          }

          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
        },
        // 加载统计
        async loadStats() {
          try {
            const res = await stockRecordPage({ page: 1, pageSize: 1000 })
            if (String(res.code) === '1') {
              const records = res.data.records || []
              const inCount = records.filter(function(r) { return r.type === 'IN' }).length
              const outCount = records.filter(function(r) { return r.type === 'OUT' }).length
              const checkCount = records.filter(function(r) { return r.type === 'CHECK' }).length
              return {
                code: 1,
                data: {
                  totalRecords: res.data.total || 0,
                  inCount: inCount,
                  outCount: outCount,
                  checkCount: checkCount
                }
              }
            }
          } catch (err) {
            console.warn('加载库存记录统计失败:', err)
          }
          return { code: 0 }
        },
        loadMaterialOptions() {
          if (this.materialOptions.length > 0) return
          materialList().then(res => {
            if (res.code === 1) this.materialOptions = res.data
          })
        },
        handleQuery() {
          this.page = 1
          this.init()
        },
        reset() {
          this.input.materialId = ''
          this.input.type = ''
          this.input.dateRange = ''
          this.page = 1
          this.init()
        },
        handleSizeChange(val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
