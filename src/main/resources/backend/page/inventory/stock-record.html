<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存记录 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <div class="dashboard-container" id="stock-record-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">库存流水</h1>
          <p class="ds-page-header__subtitle">查看食材出入库记录</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset">
        <template slot="search-extra">
          <el-select v-model="input.materialId" placeholder="食材" class="el-select--narrow" clearable filterable @change="handleQuery">
            <el-option v-for="item in materialOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
          <el-select v-model="input.type" placeholder="类型" class="el-select--narrow-xs" clearable @change="handleQuery">
            <el-option label="入库" value="IN"></el-option>
            <el-option label="出库" value="OUT"></el-option>
            <el-option label="盘点" value="CHECK"></el-option>
          </el-select>
          <el-date-picker v-model="input.dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd" class="el-date-editor--md" @change="handleQuery" size="small"></el-date-picker>
        </template>
      </table-bar>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        empty-hint="试试调整筛选条件"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-actions="false"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-type="{ row }">
          <el-tag :type="row.type == 'IN' ? 'success' : row.type == 'OUT' ? 'danger' : 'info'" size="small">
            {{ row.type == 'IN' ? '入库' : row.type == 'OUT' ? '出库' : '盘点' }}
          </el-tag>
        </template>
        <template #col-unitPrice="{ row }">￥{{ row.unitPrice }}</template>
        <template #col-totalAmount="{ row }">￥{{ row.totalAmount }}</template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#stock-record-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 修改点：crud-table 列配置（替代手写 el-table-column）
          columns: [
            { prop: 'materialName', label: '食材名称', width: 120, showOverflowTooltip: true },
            { prop: 'type', label: '类型', width: 70, align: 'center', slot: true },
            { prop: 'quantity', label: '数量', width: 70, type: 'number' },
            { prop: 'unitPrice', label: '单价', width: 80, align: 'right', slot: true, type: 'money' },
            { prop: 'totalAmount', label: '总金额', width: 90, align: 'right', slot: true, type: 'money' },
            
            { prop: 'operator', label: '操作员', width: 80, align: 'center' },
            { prop: 'remark', label: '备注', width: 100, showOverflowTooltip: true },
            { prop: 'createdTime', label: '操作时间', width: 140, align: 'center' }
          ],
          // 统计
          stats: { totalRecords: 0, inCount: 0, outCount: 0, checkCount: 0 },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [],
          input: { materialId: '', type: '', dateRange: '' },
          materialOptions: []
        }
      },
      created() {
        this.fetchData(true)
        this.loadMaterialOptions()
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: 'total', icon: '📝', label: '总记录数', value: self.stats.totalRecords || 0, color: 'primary' },
            { key: 'in', icon: '📥', label: '入库次数', value: self.stats.inCount || 0, color: 'success' },
            { key: 'out', icon: '📤', label: '出库次数', value: self.stats.outCount || 0, color: 'danger' },
            { key: 'check', icon: '📋', label: '盘点次数', value: self.stats.checkCount || 0, color: 'info' }
          ]
        }
      },
      methods: {
        // 修改点：统一方法名 fetchData（供 crud-table 分页事件调用）；reloadStats=true 才重算全局统计
        async fetchData(reloadStats = true) {
          const params = { page: this.page, pageSize: this.pageSize }
          if (this.input.materialId) params.materialId = this.input.materialId
          if (this.input.type) params.type = this.input.type
          if (this.input.dateRange) {
            params.startDate = this.input.dateRange[0]
            params.endDate = this.input.dateRange[1]
          }

          // 修改点：F9 性能 — 列表只查当前页，全局统计仅 reloadStats 时重算
          var requests = [stockRecordPage(params)]
          if (reloadStats) { requests.push(this.loadStats()) }
          var results = await Promise.all(requests)
          var pageRes = results[0]

          if (String(pageRes.code) === '1') {
            this.tableData = pageRes.data.records || []
            this.counts = Number(pageRes.data.total) || 0
          } else {
            ReggieUI.error(pageRes.msg || '操作失败')
          }

          if (reloadStats) {
            var statsRes = results[1]
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
        },
        // 加载统计
        // 修改点：使用 pageSize=1 × 4 轻量查询替代 pageSize=1000 拉全量再前端过滤，避免超过 1000 条时数据截断
        async loadStats() {
          try {
            const [totalRes, inRes, outRes, checkRes] = await Promise.all([
              stockRecordPage({ page: 1, pageSize: 1 }),
              stockRecordPage({ page: 1, pageSize: 1, type: 'IN' }),
              stockRecordPage({ page: 1, pageSize: 1, type: 'OUT' }),
              stockRecordPage({ page: 1, pageSize: 1, type: 'CHECK' })
            ])
            return {
              code: 1,
              data: {
                totalRecords: (String(totalRes.code) === '1') ? (totalRes.data.total || 0) : 0,
                inCount: (String(inRes.code) === '1') ? (inRes.data.total || 0) : 0,
                outCount: (String(outRes.code) === '1') ? (outRes.data.total || 0) : 0,
                checkCount: (String(checkRes.code) === '1') ? (checkRes.data.total || 0) : 0
              }
            }
          } catch (err) {
            console.warn('加载库存记录统计失败:', err)
          }
          return { code: 0 }
        },
        loadMaterialOptions() {
          if (this.materialOptions.length > 0) return
          materialList().then(res => {
            if (res.code === 1) this.materialOptions = res.data
          })
        },
        handleQuery() {
          this.page = 1
          this.fetchData(false)
        },
        reset() {
          this.input.materialId = ''
          this.input.type = ''
          this.input.dateRange = ''
          this.page = 1
          this.fetchData(false)
        },
        // 修改点：分页处理改为 crud-table 事件驱动（参考 supplier-list 已验证模式）
        onPageChange({ page, pageSize }) {
          this.page = page
          this.pageSize = pageSize
          this.fetchData(false)
        },
        onSizeChange(val) {
          this.pageSize = val
          this.page = 1
          this.fetchData(false)
        }
      }
    })
  </script>
</body>
</html>
