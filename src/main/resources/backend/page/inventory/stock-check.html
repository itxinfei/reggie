<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存盘点 - 瑞吉外卖管理端</title>

  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    .sub-table { margin: 8px 0; width: 100%; }
    .sub-table .el-table__body-wrapper { background: var(--el-bg-ghost); }
    .empty-expand { text-align: center; padding: 24px; color: var(--text-muted); font-size:var(--font-size-sm); }
    .check-detail-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
    .detail-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px; background: var(--el-bg-ghost); border-radius: var(--radius-md); border: 1px solid var(--el-border-light); }
    .detail-row .el-input--narrow-md { width: 120px; }
    .btn-remove { padding: 6px 12px; }
    .btn-add-detail { align-self: flex-start; margin-top: 8px; }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="stock-check-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">库存盘点</h1>
          <p class="ds-page-header__subtitle">管理食材盘点记录与盈亏</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-date-picker v-model="input.dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd" class="el-date-editor--md" @change="handleQuery" size="small"></el-date-picker>
        </template>
      </table-bar>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination（与库存流水页一致，修复表格样式不一致） -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :expand="true"
        row-key="id"
        :show-actions="true"
        :actions-width="180"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        @expand-change="loadDetails">
        <template #expand="{ row }">
          <el-table aria-label="数据表格" :data="row.details" stripe class="tableBox sub-table" v-if="row.details && row.details.length">
            <el-table-column label="食材名称" min-width="140" align="center">
              <template slot-scope="scope">{{ scope.row.materialName }}</template>
            </el-table-column>
            <el-table-column prop="materialId" label="食材ID" width="100" align="center" :header-align="'center'" :show-overflow-tooltip="true" />
            <el-table-column prop="bookQty" label="账面数量" width="140" align="center" :header-align="'center'" :show-overflow-tooltip="true" />
            <el-table-column prop="actualQty" label="实际数量" width="140" align="center" :header-align="'center'" :show-overflow-tooltip="true" />
            <el-table-column prop="diffQty" label="差异数量" width="140" align="center" :header-align="'center'" :show-overflow-tooltip="true" />
            <el-table-column label="差异" width="100" align="center" :header-align="'center'" :show-overflow-tooltip="true">
              <template slot-scope="scope">
                <span :style="scope.row.diff < 0 ? 'color: var(--color-danger); font-weight: 600' : scope.row.diff > 0 ? 'color: var(--color-success); font-weight: 600' : 'color: var(--color-info)'">
                  {{ scope.row.diff }}
                </span>
              </template>
            </el-table-column>
            <el-table-column prop="remark" label="备注" min-width="120" align="center" />
          </el-table>
          <div v-else class="empty-expand">暂无明细数据</div>
        </template>
        <template #col-profitLoss="{ row }">
          <span :style="row.profitLoss < 0 ? 'color: var(--color-danger); font-weight: 600' : 'color: var(--el-text-primary)'">{{ row.profitLoss }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 'IN_PROGRESS' ? 'warning' : 'success'" size="small">
            {{ row.status === 'IN_PROGRESS' ? '进行中' : '已完成' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-complete" @click="enterCheck(row)" v-if="row.status === 'IN_PROGRESS'">录入数据</el-button>
          <!-- 修改点：补充删除（后端限制仅草稿/已取消可删，已完成的盘点单已生成库存差异，禁止删除） -->
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row)" v-if="row.status !== 'DONE'">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 新增盘点对话框（操作人 + 备注） -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      title="新增盘点单"
      :visible.sync="formData.dialogVisible"
      size="md"
      :submit-loading="submitting"
      :close-on-click-modal="false"
      @submit="submitCreate"
      @close="formData.dialogVisible = false"
    >
      <!-- 修改点：移除误导性死 class demo-form-inline（label-width 80 合适，保持不变） -->
      <!-- 修改点：补全 ref/:model/:rules 启用 Element 校验（原仅手写 if 判断，属"假必填"） -->
      <el-form ref="createForm" :model="formData" :rules="createRules" label-width="80px" size="small">
        <el-form-item label="操作人：" prop="operator">
          <el-input v-model="formData.operator" placeholder="请输入操作人姓名" style="width:293px" />
        </el-form-item>
        <el-form-item label="备注：">
          <el-input v-model="formData.remark" placeholder="盘点备注（可选）" />
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 录入盘点数据并完成对话框 -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      title="录入盘点数据"
      :visible.sync="entryDialogVisible"
      size="lg"
      :submit-loading="entrySubmitting"
      :close-on-click-modal="false"
      @submit="submitEntry"
      @close="entryDialogVisible = false"
    >
      <div v-if="entryMaterials.length === 0" style="text-align:center;padding:40px;color:var(--text-muted);">
        暂无食材数据，请先添加盘点项
      </div>
      <!-- 修改点：label-width 120→90（"盘点明细"4字标签） -->
      <el-form v-else label-width="90px" size="small">
        <el-form-item label="盘点明细：">
          <div class="check-detail-list">
            <div v-for="(item, index) in entryForm.details" :key="item.id" class="detail-row">
              <span style="width:160px;flex-shrink:0;font-weight:500;">{{ item.materialName }}</span>
              <span style="color:var(--color-info);font-size:var(--font-size-xs);width:80px;">账面：{{ item.bookQty }}</span>
              <el-input v-model="item.actualStock" placeholder="实际库存" type="number" style="width:140px" />
            </div>
          </div>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#stock-check-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          stats: { totalChecks: 0, pendingChecks: 0, completedChecks: 0, diffCount: 0 },
          activeFilter: '',
          // 修改点：crud-table 列配置（替代手写 el-table-column）
          columns: [
            { prop: 'checkNo', label: '盘点单号', width: 140 },
            { prop: 'operator', label: '操作员', width: 90, align: 'center' },
            { prop: 'itemCount', label: '盘点项数', width: 90, type: 'number' },
            { prop: 'totalDiffAmount', label: '总差异金额', width: 115, align: 'center', slot: true, type: 'money' },
            { prop: 'profitLoss', label: '盈亏金额', width: 115, align: 'center', slot: true, type: 'money' },
            { prop: 'remark', label: '备注', minWidth: 90 },
            { prop: 'status', label: '状态', width: 90, align: 'center', slot: true },
            { prop: 'createdTime', label: '创建时间', width: 155 }
          ],
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增盘点', type: 'primary' }
          ],
          input: { status: '', dateRange: '' },
          materialOptions: [],
          // 新增盘点单弹窗
          formData: {
            dialogVisible: false,
            operator: '',
            remark: ''
          },
          // 修改点：盘点创建表单校验规则（配合 el-form :rules + validate()）
          createRules: {
            operator: [{ required: true, whitespace: true, message: '请输入操作人', trigger: 'blur' }]
          },
          // 录入数据弹窗
          entryDialogVisible: false,
          // 修改点：补声明两个提交中标志 —— 模板 :submit-loading="submitting" /
          // "entrySubmitting" 引用了它们但从未定义，导致 Vue 渲染告警且提交按钮
          // 无 loading 态（可重复点击造成重复创建盘点单／重复完成盘点）
          submitting: false,
          entrySubmitting: false,
          entryCheckId: null,
          entryMaterials: [],
          entryForm: { details: [] }
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          const self = this;
          return [
            { key: '', icon: 'ri-file-list-3-line', label: '盘点单总数', value: self.stats.totalChecks || 0, color: 'primary', active: self.activeFilter === '' },
            { key: 'IN_PROGRESS', icon: 'ri-time-line', label: '进行中', value: self.stats.pendingChecks || 0, color: 'warning', active: self.activeFilter === 'IN_PROGRESS' },
            { key: 'DONE', icon: 'ri-checkbox-circle-line', label: '已完成', value: self.stats.completedChecks || 0, color: 'success', active: self.activeFilter === 'DONE' },
            { key: 'diff', icon: 'ri-error-warning-line', label: '存在差异项', value: self.stats.diffCount || 0, color: 'info' }
          ]
        }
      },
      methods: {
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.page = 1
          this.init(false)
        },
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        async init(reloadStats = true) {
          const self = this
          const params = {}
          if (this.input.status) params.status = this.input.status
          if (this.input.dateRange) {
            params.startDate = this.input.dateRange[0]
            params.endDate = this.input.dateRange[1]
          }
          if (this.activeFilter !== '') params.status = this.activeFilter

          this.loading = true
          try {
            const pageRes = await stockCheckPage(params)
            if (String(pageRes.code) === '1') {
              self.tableData = pageRes.data.records || []
              self.counts = Number(pageRes.data.total) || 0
            } else {
              ReggieUI.error(pageRes.msg || '操作失败')
            }
            if (reloadStats) { self.loadStats() }
          } catch (err) {
            ReggieUI.error('请求失败：' + err)
          } finally {
            self.loading = false
          }
        },
        async loadStats() {
          try {
            const self = this
            const totalRes = await stockCheckPage({ page: 1, pageSize: 1 })
            const pendingRes = await stockCheckPage({ page: 1, pageSize: 1, status: 'IN_PROGRESS' })
            const doneRes = await stockCheckPage({ page: 1, pageSize: 1, status: 'DONE' })
            self.stats.totalChecks = (String(totalRes.code) === '1' && totalRes.data) ? (totalRes.data.total || 0) : 0
            self.stats.pendingChecks = (String(pendingRes.code) === '1' && pendingRes.data) ? (pendingRes.data.total || 0) : 0
            self.stats.completedChecks = (String(doneRes.code) === '1' && doneRes.data) ? (doneRes.data.total || 0) : 0
            // diffCount: 查询已完成的盘点，检查是否有差异项
            self.stats.diffCount = 0
            try {
              const diffRes = await stockCheckPage({ page: 1, pageSize: 100, status: 'DONE' })
              if (String(diffRes.code) === '1' && diffRes.data && diffRes.data.records) {
                const records = diffRes.data.records
                for (let i = 0; i < records.length; i++) {
                  const details = records[i].details
                  if (details && details.some(function(d) { return d.diff != null && d.diff !== 0 })) {
                    self.stats.diffCount++
                  }
                }
              }
            } catch (e) { /* diffCount 查询失败不影响其他统计 */ }
          } catch (e) { console.warn('加载盘点统计失败:', e) }
        },
        loadMaterialOptions() {
          if (this.materialOptions.length > 0) return
          const self = this
          materialList().then(function(res) {
            if (res.code === 1) self.materialOptions = res.data
          })
        },
        loadDetails(row) {
          if (!row.id || row.details) return
          const self = this
          stockCheckPage({ page: 1, pageSize: 100, id: row.id }).then(function(res) {
            if (res.code === 1 && res.data && res.data.records && res.data.records.length > 0) {
              const details = res.data.records[0].details || []
              self.$set(row, 'details', details)
            } else {
              self.$set(row, 'details', [])
            }
          }).catch(function(err) {
            ReggieUI.error('加载明细失败：' + err)
            self.$set(row, 'details', [])
          })
        },
        handleQuery() {
          this.page = 1
          this.init(false)
        },
        reset() {
          this.input.status = ''
          this.input.dateRange = ''
          this.page = 1
          this.init(false)
        },
        addHandle() {
          this.formData = {
            dialogVisible: true,
            operator: '',
            remark: ''
          }
        },
        async submitCreate() {
          const self = this
          if (self.submitting) return // 修改点：防重复提交
          // 修改点：原写法在 .catch 中 return 无法中断外层 async 函数，
          // 校验失败仍会继续发创建请求；改用标志位显式中断
          let valid = true
          await new Promise(function(resolve, reject) {
            self.$refs.createForm.validate(function(ok) { ok ? resolve() : reject() })
          }).catch(function() { valid = false })
          if (!valid) { ReggieUI.error('请输入操作人'); return }

          const fd = self.formData
          self.submitting = true // 修改点：接入按钮 loading
          try {
            const res = await addStockCheck({ operator: fd.operator.trim(), remark: (fd.remark || '').trim() })
            if (res.code === 1) {
              ReggieUI.success('盘点单创建成功！')
              self.formData.dialogVisible = false
              // 创建后打开录入数据弹窗
              self.openEntryDialog(res.data.id)
            } else {
              ReggieUI.error(res.msg || '创建失败')
            }
          } catch (err) {
            ReggieUI.error('请求失败：' + (err && err.message ? err.message : err))
          } finally {
            self.submitting = false
          }
        },
        // 打开录入数据弹窗，加载食材列表供用户选择
        enterCheck: function(row) {
          this.openEntryDialog(row.id)
        },
        // 修改点：删除盘点单（后端限制仅草稿/已取消可删，失败时提示后端原因）
        deleteHandle: function(row) {
          const self = this
          ReggieUI.confirm('确认删除盘点单「' + (row.checkNo || row.id) + '」？', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(function() {
            deleteStockCheck(row.id).then(function(res) {
              if (res.code === 1) { ReggieUI.success('删除成功！'); self.init() }
              else ReggieUI.error(res.msg || '删除失败')
            }).catch(function(err) { ReggieUI.error('请求失败：' + err) })
          }).catch(function(err) { console.warn('[inventory] 删除盘点单操作取消或失败:', err) })
        },
        openEntryDialog: function(checkId) {
          const self = this
          this.entryCheckId = checkId
          this.loadMaterialOptions()
          // 加载食材列表，每条食材的账面数量从 Material.stockQty 读取
          materialList().then(function(res) {
            if (res.code === 1) {
              const materials = res.data || []
              self.entryMaterials = materials
              self.entryForm = {
                details: materials.map(function(m) {
                  return {
                    id: m.id,
                    materialId: m.id,
                    materialName: m.name,
                    bookQty: (m.stockQty || 0),
                    systemStock: (m.stockQty || 0),
                    actualStock: ''
                  }
                })
              }
              self.entryDialogVisible = true
            } else {
              ReggieUI.error('加载食材列表失败')
            }
          }).catch(function(err) {
            ReggieUI.error('请求失败：' + err)
          })
        },
        submitEntry: function() {
          const self = this
          var items = this.entryForm.details.filter(function(d) {
            return d.actualStock !== '' && d.actualStock !== null && d.actualStock !== undefined
          }).map(function(d) {
            return {
              materialId: d.materialId,
              systemStock: Number(d.systemStock || d.bookQty || 0),
              actualStock: Number(d.actualStock)
            }
          })
          if (items.length === 0) {
            ReggieUI.warning('请至少填写一条盘点项的实际库存')
            return
          }
          if (self.entrySubmitting) return // 修改点：防重复提交
          self.entrySubmitting = true      // 修改点：接入按钮 loading
          completeStockCheck(this.entryCheckId, { items: items }).then(function(res) {
            if (res.code === 1) {
              ReggieUI.success('盘点完成！')
              self.entryDialogVisible = false
              self.entryCheckId = null
              self.entryMaterials = []
              self.entryForm = { details: [] }
              self.init(true)
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            ReggieUI.error('请求失败：' + err)
          }).then(function() {
            self.entrySubmitting = false // 修改点：无论成功/失败都复位，避免按钮卡在 loading
          })
        },
        // 修改点：分页处理改为 crud-table 事件驱动（与库存流水页一致）
        onPageChange: function(payload) {
          this.page = payload.page
          this.pageSize = payload.pageSize
          this.init(false)
        },
        onSizeChange: function(val) {
          this.pageSize = val
          this.page = 1
          this.init(false)
        }
      }
    })
  </script>
</body>
</html>
