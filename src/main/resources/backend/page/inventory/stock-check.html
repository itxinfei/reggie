<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存盘点 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
  <style>
    .sub-table { margin: 8px 0; width: 100%; }
    .sub-table .el-table__body-wrapper { background: var(--el-bg-ghost); }
    .empty-expand { text-align: center; padding: 24px; color: var(--el-border-base); font-size: 13px; }
    .check-detail-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
    .detail-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px; background: var(--el-bg-ghost); border-radius: 6px; border: 1px solid var(--el-border-light); }
    .detail-row .el-input--narrow-md { width: 120px; }
    .btn-remove { padding: 6px 12px; }
    .btn-add-detail { align-self: flex-start; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="dashboard-container" id="stock-check-app">
    <div class="container">
      <!-- 面包屑导航 -->
      <nav class="ds-breadcrumb" aria-label="面包屑导航">
        <span class="ds-breadcrumb__item">首页</span>
        <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
        <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">库存盘点</span>
      </nav>
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-date-picker v-model="input.dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd" class="el-date-editor--md" @change="handleQuery" size="small"></el-date-picker>
        </template>
      </table-bar>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination（与库存流水页一致，修复表格样式不一致） -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :expand="true"
        row-key="id"
        :show-actions="true"
        :actions-width="140"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        @expand-change="loadDetails">
        <template #expand="{ row }">
          <el-table :data="row.details" stripe class="tableBox sub-table" v-if="row.details && row.details.length">
            <el-table-column label="食材名称" min-width="140">
              <template slot-scope="scope">{{ scope.row.materialName }}</template>
            </el-table-column>
            <el-table-column prop="materialId" label="食材ID" width="80" align="center" />
            <el-table-column prop="bookQty" label="账面数量" width="110" align="center" />
            <el-table-column prop="actualQty" label="实际数量" width="110" align="center" />
            <el-table-column prop="diffQty" label="差异数量" width="100" align="center" />
            <el-table-column label="差异" width="90" align="center">
              <template slot-scope="scope">
                <span :style="scope.row.diff < 0 ? 'color: var(--color-danger); font-weight: 600' : scope.row.diff > 0 ? 'color: var(--color-success); font-weight: 600' : 'color: var(--color-info)'">
                  {{ scope.row.diff }}
                </span>
              </template>
            </el-table-column>
            <el-table-column prop="remark" label="备注" min-width="120" show-overflow-tooltip />
          </el-table>
          <div v-else class="empty-expand">暂无明细数据</div>
        </template>
        <template #col-profitLoss="{ row }">
          <span :style="row.profitLoss < 0 ? 'color: var(--color-danger); font-weight: 600' : 'color: var(--el-text-primary)'">{{ row.profitLoss }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 'IN_PROGRESS' ? 'warning' : 'success'" size="small">
            {{ row.status === 'IN_PROGRESS' ? '进行中' : '已完成' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-complete" @click="enterCheck(row)" v-if="row.status === 'IN_PROGRESS'">录入数据</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 新增盘点对话框（操作人 + 备注） -->
    <el-dialog title="新增盘点单" :visible.sync="formData.dialogVisible" custom-class="el-dialog--md unified-dialog"
      :close-on-click-modal="false" :append-to-body="true" :modal-append-to-body="true">
      <!-- 修改点：移除误导性死 class demo-form-inline（label-width 80 合适，保持不变） -->
      <!-- 修改点：补全 ref/:model/:rules 启用 Element 校验（原仅手写 if 判断，属"假必填"） -->
      <el-form ref="createForm" :model="formData" :rules="createRules" label-width="80px" size="small">
        <el-form-item label="操作人：" prop="operator">
          <el-input v-model="formData.operator" placeholder="请输入操作人姓名" style="width:240px" />
        </el-form-item>
        <el-form-item label="备注：">
          <el-input v-model="formData.remark" placeholder="盘点备注（可选）" />
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitCreate()">确 定</el-button>
      </span>
    </el-dialog>

    <!-- 录入盘点数据并完成对话框 -->
    <el-dialog title="录入盘点数据" :visible.sync="entryDialogVisible" custom-class="el-dialog--lg unified-dialog"
      :close-on-click-modal="false" :append-to-body="true" :modal-append-to-body="true">
      <div v-if="entryMaterials.length === 0" style="text-align:center;padding:40px;color:var(--el-border-base);">
        暂无食材数据，请先添加盘点项
      </div>
      <!-- 修改点：label-width 120→90（"盘点明细"4字标签） -->
      <el-form v-else label-width="90px" size="small">
        <el-form-item label="盘点明细：">
          <div class="check-detail-list">
            <div v-for="(item, index) in entryForm.details" :key="item.id" class="detail-row">
              <span style="width:160px;flex-shrink:0;font-weight:500;">{{ item.materialName }}</span>
              <span style="color:var(--color-info);font-size:12px;width:80px;">账面：{{ item.bookQty }}</span>
              <el-input v-model="item.actualStock" placeholder="实际库存" type="number" style="width:120px" />
            </div>
          </div>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="entryDialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitEntry()">保存并完成</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#stock-check-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          stats: { totalChecks: 0, pendingChecks: 0, completedChecks: 0, diffCount: 0 },
          activeFilter: '',
          // 修改点：crud-table 列配置（替代手写 el-table-column）
          columns: [
            { prop: 'checkNo', label: '盘点单号', width: 160 },
            { prop: 'operator', label: '操作员', width: 100, align: 'center' },
            { prop: 'itemCount', label: '盘点项数', width: 100, align: 'center' },
            { prop: 'totalDiffAmount', label: '总差异金额', width: 120, align: 'right', slot: true, type: 'money' },
            { prop: 'profitLoss', label: '盈亏金额', width: 120, align: 'right', slot: true, type: 'money' },
            { prop: 'remark', label: '备注', minWidth: 120, showOverflowTooltip: true },
            { prop: 'status', label: '状态', width: 100, align: 'center', slot: true },
            { prop: 'createdTime', label: '创建时间', width: 170 }
          ],
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增盘点', type: 'primary' }
          ],
          input: { status: '', dateRange: '' },
          materialOptions: [],
          // 新增盘点单弹窗
          formData: {
            dialogVisible: false,
            operator: '',
            remark: ''
          },
          // 修改点：盘点创建表单校验规则（配合 el-form :rules + validate()）
          createRules: {
            operator: [{ required: true, whitespace: true, message: '请输入操作人', trigger: 'blur' }]
          },
          // 录入数据弹窗
          entryDialogVisible: false,
          entryCheckId: null,
          entryMaterials: [],
          entryForm: { details: [] }
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          var self = this;
          return [
            { key: '', icon: '📋', label: '盘点单总数', value: self.stats.totalChecks || 0, color: 'primary', active: self.activeFilter === '' },
            { key: 'IN_PROGRESS', icon: '⏳', label: '进行中', value: self.stats.pendingChecks || 0, color: 'warning', active: self.activeFilter === 'IN_PROGRESS' },
            { key: 'DONE', icon: '✅', label: '已完成', value: self.stats.completedChecks || 0, color: 'success', active: self.activeFilter === 'DONE' },
            { key: 'diff', icon: '⚠️', label: '存在差异项', value: self.stats.diffCount || 0, color: 'info' }
          ]
        }
      },
      methods: {
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.page = 1
          this.init(false)
        },
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        async init(reloadStats = true) {
          var self = this
          var params = { page: this.page, pageSize: this.pageSize }
          if (this.input.status) params.status = this.input.status
          if (this.input.dateRange) {
            params.startDate = this.input.dateRange[0]
            params.endDate = this.input.dateRange[1]
          }
          if (this.activeFilter !== '') params.status = this.activeFilter

          this.loading = true
          try {
            var pageRes = await stockCheckPage(params)
            if (String(pageRes.code) === '1') {
              self.tableData = pageRes.data.records || []
              self.counts = Number(pageRes.data.total) || 0
            } else {
              self.$message.error(pageRes.msg || '操作失败')
            }
            if (reloadStats) { self.loadStats() }
          } catch (err) {
            self.$message.error('请求失败：' + err)
          } finally {
            self.loading = false
          }
        },
        async loadStats() {
          try {
            var self = this
            var totalRes = await stockCheckPage({ page: 1, pageSize: 1 })
            var pendingRes = await stockCheckPage({ page: 1, pageSize: 1, status: 'IN_PROGRESS' })
            var doneRes = await stockCheckPage({ page: 1, pageSize: 1, status: 'DONE' })
            self.stats.totalChecks = (String(totalRes.code) === '1' && totalRes.data) ? (totalRes.data.total || 0) : 0
            self.stats.pendingChecks = (String(pendingRes.code) === '1' && pendingRes.data) ? (pendingRes.data.total || 0) : 0
            self.stats.completedChecks = (String(doneRes.code) === '1' && doneRes.data) ? (doneRes.data.total || 0) : 0
            // diffCount: 查询已完成的盘点，检查是否有差异项
            self.stats.diffCount = 0
            try {
              var diffRes = await stockCheckPage({ page: 1, pageSize: 100, status: 'DONE' })
              if (String(diffRes.code) === '1' && diffRes.data && diffRes.data.records) {
                var records = diffRes.data.records
                for (var i = 0; i < records.length; i++) {
                  var details = records[i].details
                  if (details && details.some(function(d) { return d.diff != null && d.diff !== 0 })) {
                    self.stats.diffCount++
                  }
                }
              }
            } catch (e) { /* diffCount 查询失败不影响其他统计 */ }
          } catch (e) { console.warn('加载盘点统计失败:', e) }
        },
        loadMaterialOptions() {
          if (this.materialOptions.length > 0) return
          var self = this
          materialList().then(function(res) {
            if (res.code === 1) self.materialOptions = res.data
          })
        },
        loadDetails(row) {
          if (!row.id || row.details) return
          var self = this
          stockCheckPage({ page: 1, pageSize: 100, id: row.id }).then(function(res) {
            if (res.code === 1 && res.data && res.data.records && res.data.records.length > 0) {
              var details = res.data.records[0].details || []
              self.$set(row, 'details', details)
            } else {
              self.$set(row, 'details', [])
            }
          }).catch(function(err) {
            self.$message.error('加载明细失败：' + err)
            self.$set(row, 'details', [])
          })
        },
        handleQuery() {
          this.page = 1
          this.init(false)
        },
        reset() {
          this.input.status = ''
          this.input.dateRange = ''
          this.page = 1
          this.init(false)
        },
        addHandle() {
          this.formData = {
            dialogVisible: true,
            operator: '',
            remark: ''
          }
        },
        submitCreate() {
          var self = this
          var passed = false
          self.$refs.createForm.validate(function(valid) { passed = valid })
          if (!passed) {
            self.$message.error('请输入操作人')
            return
          }
          var fd = self.formData
          addStockCheck({ operator: fd.operator.trim(), remark: (fd.remark || '').trim() }).then(function(res) {
            if (res.code === 1) {
              self.$message.success('盘点单创建成功！')
              self.formData.dialogVisible = false
              // 创建后打开录入数据弹窗
              self.openEntryDialog(res.data.id)
            } else {
              self.$message.error(res.msg || '创建失败')
            }
          }).catch(function(err) {
            self.$message.error('请求失败：' + err)
          })
        },
        // 打开录入数据弹窗，加载食材列表供用户选择
        enterCheck: function(row) {
          this.openEntryDialog(row.id)
        },
        openEntryDialog: function(checkId) {
          var self = this
          this.entryCheckId = checkId
          this.loadMaterialOptions()
          // 加载食材列表，每条食材的账面数量从 Material.stockQty 读取
          materialList().then(function(res) {
            if (res.code === 1) {
              var materials = res.data || []
              self.entryMaterials = materials
              self.entryForm = {
                details: materials.map(function(m) {
                  return {
                    id: m.id,
                    materialId: m.id,
                    materialName: m.name,
                    bookQty: (m.stockQty || 0),
                    systemStock: (m.stockQty || 0),
                    actualStock: ''
                  }
                })
              }
              self.entryDialogVisible = true
            } else {
              self.$message.error('加载食材列表失败')
            }
          }).catch(function(err) {
            self.$message.error('请求失败：' + err)
          })
        },
        submitEntry: function() {
          var self = this
          var items = this.entryForm.details.filter(function(d) {
            return d.actualStock !== '' && d.actualStock !== null && d.actualStock !== undefined
          }).map(function(d) {
            return {
              materialId: d.materialId,
              systemStock: Number(d.systemStock || d.bookQty || 0),
              actualStock: Number(d.actualStock)
            }
          })
          if (items.length === 0) {
            ReggieUI.warning('请至少填写一条盘点项的实际库存')
            return
          }
          completeStockCheck(this.entryCheckId, { items: items }).then(function(res) {
            if (res.code === 1) {
              self.$message.success('盘点完成！')
              self.entryDialogVisible = false
              self.entryCheckId = null
              self.entryMaterials = []
              self.entryForm = { details: [] }
              self.init(true)
            } else {
              self.$message.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            self.$message.error('请求失败：' + err)
          })
        },
        // 修改点：分页处理改为 crud-table 事件驱动（与库存流水页一致）
        onPageChange: function(payload) {
          this.page = payload.page
          this.pageSize = payload.pageSize
          this.init(false)
        },
        onSizeChange: function(val) {
          this.pageSize = val
          this.page = 1
          this.init(false)
        }
      }
    })
  </script>
</body>
</html>
