<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="supplier-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="input.name" placeholder="供应商名称" style="width: 180px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-input v-model="input.contact" placeholder="联系人" style="width: 150px; margin-left: 10px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-button type="primary" style="margin-left: 10px" @click="handleQuery">查询</el-button>
        <el-button style="margin-left: 10px" @click="reset">重置</el-button>
        <el-button type="primary" @click="addHandle">+ 新增供应商</el-button>
      </div>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="供应商名称" /></el-table-column>
        <el-table-column prop="contact" label="联系人" /></el-table-column>
        <el-table-column prop="phone" label="联系电话" /></el-table-column>
        <el-table-column prop="address" label="地址" /></el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status == '1' ? 'success' : 'info'" size="small">
              {{ scope.row.status == '1' ? '启用' : '禁用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination class="pageList" :page-sizes="[10,20,30,40]" :page-size="pageSize" layout="total, sizes, prev, pager, next, jumper" :total="counts" :current-page.sync="page" @size-change="handleSizeChange" @current-change="handleCurrentChange"></el-pagination>
    </div>
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="40%" :before-close="handleClose">
      <el-form class="demo-form-inline" label-width="120px">
        <el-form-item label="供应商名称：">
          <el-input v-model="formData.name" placeholder="请输入供应商名称" />
        </el-form-item>
        <el-form-item label="联系人：">
          <el-input v-model="formData.contact" placeholder="请输入联系人" />
        </el-form-item>
        <el-form-item label="联系电话：">
          <el-input v-model="formData.phone" placeholder="请输入联系电话" />
        </el-form-item>
        <el-form-item label="地址：">
          <el-input v-model="formData.address" placeholder="请输入地址" />
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="'1'">启用</el-radio>
            <el-radio :label="'0'">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/inventory.js"></script>
    <script>
      new Vue({
        el: '#supplier-app',
        data() {
          return {
            loading: false,
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            input: {
              name: '',
              contact: ''
            },
            formData: {
              title: '新增供应商',
              dialogVisible: false,
              id: '',
              name: '',
              contact: '',
              phone: '',
              address: '',
              status: '1'
            }
          }
        },
        created() {
          this.init()
        },
        methods: {
          async init() {
            const params = { page: this.page, pageSize: this.pageSize }
            if (this.input.name) params.name = this.input.name
            if (this.input.contact) params.contact = this.input.contact
            await supplierPage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records
                this.counts = Number(res.data.total)
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          reset() {
            this.input.name = ''
            this.input.contact = ''
            this.page = 1
            this.init()
          },
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增供应商'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.contact = ''
            this.formData.phone = ''
            this.formData.address = ''
            this.formData.status = '1'
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改供应商'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.contact = row.contact
            this.formData.phone = row.phone
            this.formData.address = row.address
            this.formData.status = String(row.status)
            this.formData.dialogVisible = true
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该供应商, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteSupplier(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          submitForm() {
            const fd = this.formData
            if (!fd.name) {
              this.$message.error('请输入供应商名称')
              return
            }
            if (this.action === 'add') {
              addSupplier({ name: fd.name, contact: fd.contact, phone: fd.phone, address: fd.address, status: fd.status }).then(res => {
                if (res.code === 1) {
                  this.$message.success('添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              updateSupplier({ id: fd.id, name: fd.name, contact: fd.contact, phone: fd.phone, address: fd.address, status: fd.status }).then(res => {
                if (res.code === 1) {
                  this.$message.success('修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
