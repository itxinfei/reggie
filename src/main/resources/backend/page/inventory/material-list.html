<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食材管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
</head>
<body>
  <div class="dashboard-container" id="material-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="食材名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')"
            @visible-change="onFilterDropdownVisible">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
          <el-select v-model="input.categoryId" placeholder="食材分类" class="el-select--narrow" clearable @change="handleQuery">
            <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-stockQty="{ row }">
          <span :style="row.stockQty <= row.minStock ? 'color: red; font-weight: bold' : ''">{{ row.stockQty }}</span>
        </template>
        <template #col-unitPrice="{ row }">￥{{ row.unitPrice }}</template>
        <template #col-status="{ row }">
          <el-tag :type="row.status == '1' ? 'success' : 'info'" size="small">
            {{ row.status == '1' ? '启用' : '禁用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>
    <!-- 修改点：使用 <crud-dialog> 统一弹窗组件替代手写 el-dialog -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="600px"
      @submit="submitForm"
      @close="handleClose"
    >
      <el-form class="demo-form-inline" label-width="120px">
        <el-form-item label="食材名称：">
          <el-input v-model="formData.name" placeholder="请输入食材名称" />
        </el-form-item>
        <el-form-item label="食材分类：">
          <el-select v-model="formData.categoryId" placeholder="请选择" style="width: 100%">
            <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="单位：">
          <el-input v-model="formData.unit" placeholder="如：斤、个、箱" />
        </el-form-item>
        <el-form-item label="库存数量：">
          <el-input v-model="formData.stockQty" type="number" placeholder="请输入库存数量" />
        </el-form-item>
        <el-form-item label="最低库存：">
          <el-input v-model="formData.minStock" type="number" placeholder="请输入最低库存预警值" />
        </el-form-item>
        <el-form-item label="单价：">
          <el-input v-model="formData.unitPrice" type="number" placeholder="请输入单价" />
        </el-form-item>
        <el-form-item label="供应商：">
          <el-select v-model="formData.supplierId" placeholder="请选择" style="width: 100%" clearable>
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="条码：">
          <el-input v-model="formData.barcode" placeholder="请输入条码" />
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="'1'">启用</el-radio>
            <el-radio :label="'0'">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </crud-dialog>
    <!-- 修改点：使用 <crud-dialog> 统一弹窗组件替代手写 el-dialog（仅展示，隐藏确认按钮） -->
    <crud-dialog title="库存预警" :visible.sync="warningDialogVisible" size="lg" :show-submit="false" cancel-text="关 闭">
      <el-table :data="warningData" stripe class="tableBox">
        <el-table-column prop="name" label="食材名称" /></el-table-column>
        <el-table-column label="食材分类">
          <template slot-scope="scope">{{ scope.row.categoryName }}</template>
        </el-table-column>
        <el-table-column prop="unit" label="单位" width="80" /></el-table-column>
        <el-table-column label="库存数量">
          <template slot-scope="scope">
            <span style="color: red; font-weight: bold">{{ scope.row.stockQty }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="minStock" label="最低库存" width="100" /></el-table-column>
      </el-table>
    </crud-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/inventory.js"></script>
    <script src="../../js/components.js"></script>
    <script>
      new Vue({
        el: '#material-app',
        data() {
          return {
            loading: false,
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            // 修改点：crud-table 列配置（替代手写 el-table-column）
            columns: [
              { prop: 'name', label: '食材名称', minWidth: 140, showOverflowTooltip: true },
              { prop: 'categoryName', label: '食材分类', width: 120, align: 'center' },
              { prop: 'unit', label: '单位', width: 80, align: 'center' },
              { prop: 'stockQty', label: '库存数量', width: 120, align: 'center', slot: true },
              { prop: 'minStock', label: '最低库存', width: 100, align: 'center' },
              { prop: 'unitPrice', label: '单价', width: 100, align: 'right', slot: true },
              { prop: 'supplierName', label: '供应商', width: 140, align: 'center' },
              { prop: 'barcode', label: '条码', width: 120, align: 'center' },
              { prop: 'status', label: '状态', width: 100, align: 'center', slot: true }
            ],
            // 数据统计
            stats: {
              totalMaterials: 0,
              activeMaterials: 0,
              lowStockMaterials: 0,
              totalCategories: 0
            },
            // 修改点：当前激活的筛选器值，空字符串=全部
            activeFilter: '',
            // 修改点：<table-bar> 统一组件配置
            tableSearchItems: [],
            tableActions: [
              { key: 'add', text: '+ 新增食材', type: 'primary' },
              { key: 'warning', text: '库存预警', type: 'warning' }
            ],
            input: {
              name: '',
              categoryId: ''
            },
            // 修改点：搜索下拉框动态选项（从数据库加载）
            filterOptions: { names: [] },
            // 修改点：下拉选项加载状态
            optionsLoading: false,
            optionsLoadError: false,
            categoryOptions: [],
            supplierOptions: [],
            formData: {
              title: '新增食材',
              dialogVisible: false,
              id: '',
              name: '',
              categoryId: '',
              unit: '',
              stockQty: '',
              minStock: '',
              unitPrice: '',
              supplierId: '',
              barcode: '',
              status: '1'
            },
            warningDialogVisible: false,
            warningData: []
          }
        },
        created() {
          this.fetchData()
          this.loadOptions()
          this.loadFilterOptions()
        },
        computed: {
          // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
          statsCards: function() {
            var self = this;
            return [
              { key: '', icon: '🥬', label: '食材总数', value: self.stats.totalMaterials || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
              { key: '1', icon: '✅', label: '启用中', value: self.stats.activeMaterials || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
              { key: 'low', icon: '⚠️', label: '库存预警', value: self.stats.lowStockMaterials || 0, color: 'warning', clickable: true, active: self.activeFilter === 'low' },
              { key: 'categories', icon: '📦', label: '分类数量', value: self.stats.totalCategories || 0, color: 'danger' }
            ]
          }
        },
        methods: {
          // 修改点：<stat-cards> 组件统一卡片点击分发
          onCardClick: function(payload) {
            var key = payload.activeKey;
            this.activeFilter = key;
            // 卡片筛选时清空搜索输入
            this.input.name = '';
            this.input.categoryId = '';
            this.page = 1;
            this.fetchData();
          },
          // 修改点：<table-bar> 组件统一操作分发
          onTableAction: function(payload) {
            if (payload.key === 'add') { this.addHandle(); }
            else if (payload.key === 'warning') { this.warningHandle(); }
          },
          // 修改点：统一方法名 fetchData（供 crud-table 分页事件调用）
          async fetchData() {
            const params = { page: this.page, pageSize: this.pageSize }
            if (this.input.name) params.name = this.input.name
            if (this.input.categoryId) params.categoryId = this.input.categoryId
            // 修改点：传递状态筛选参数到后端
            if (this.activeFilter && this.activeFilter !== 'low') params.status = this.activeFilter

            // 并行加载食材列表和统计数据
            const [materialRes, statsRes] = await Promise.all([
              materialPage(params),
              this.loadMaterialStats()
            ])
            // 修改点：库存预警在前端过滤
            if (materialRes && materialRes.data && materialRes.data.records && this.activeFilter === 'low') {
              var records = materialRes.data.records
              materialRes.data.records = records.filter(function(r) { return r.stockQty <= r.minStock })
              materialRes.data.total = materialRes.data.records.length
            }

            // 处理食材列表数据
            if (String(materialRes.code) === '1') {
              this.tableData = materialRes.data.records
              this.counts = Number(materialRes.data.total)
            } else {
              this.$message.error(materialRes.msg || '操作失败')
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          },
          // 加载食材统计数据
          async loadMaterialStats() {
            try {
              // 修改点：使用 pageSize=1 多状态并发查询替代 pageSize=1000 拉全量，避免数据截断
              // 库存预警数通过 materialWarning API 直接获取
              const [totalRes, activeRes, warningRes, categoryRes] = await Promise.all([
                materialPage({ page: 1, pageSize: 1 }),
                materialPage({ page: 1, pageSize: 1, status: '1' }),
                materialWarning(),
                matCategoryList()
              ])
              return {
                code: 1,
                data: {
                  totalMaterials: (String(totalRes.code) === '1' && totalRes.data) ? (totalRes.data.total || 0) : 0,
                  activeMaterials: (String(activeRes.code) === '1' && activeRes.data) ? (activeRes.data.total || 0) : 0,
                  lowStockMaterials: (String(warningRes.code) === '1' && warningRes.data) ? warningRes.data.length : 0,
                  totalCategories: (String(categoryRes.code) === '1' && categoryRes.data) ? categoryRes.data.length : 0
                }
              }
            } catch (err) {
              console.warn('加载食材统计数据失败:', err)
            }
            return { code: 0 }
          },
          loadOptions() {
            matCategoryList().then(res => {
              if (res.code === 1) this.categoryOptions = res.data
            })
            supplierList().then(res => {
              if (res.code === 1) this.supplierOptions = res.data
            })
          },
          // 修改点：加载搜索下拉框选项（从数据库动态查询）
          async loadFilterOptions() {
            this.optionsLoading = true
            this.optionsLoadError = false
            try {
              const res = await materialList()  // 修改点：list 接口本身就返回全量，传递分页参数无效
              if (String(res.code) === '1' && res.data) {
                const names = new Set()
                ;(res.data.records || []).forEach(function(r) {
                  if (r.name) names.add(r.name)
                })
                this.filterOptions.names = Array.from(names)
              } else {
                this.optionsLoadError = true
              }
            } catch (err) {
              this.optionsLoadError = true
              console.warn('加载食材筛选选项失败:', err)
            } finally {
              this.optionsLoading = false
            }
          },
          // 修改点：下拉框显示/隐藏时自动加载选项
          async onFilterDropdownVisible(visible) {
            if (visible && (!this.filterOptions.names || this.filterOptions.names.length === 0)) {
              await this.loadFilterOptions()
            }
          },
          handleQuery() {
            // 修改点：搜索时清空卡片筛选状态
            this.activeFilter = ''
            this.page = 1
            this.fetchData()
          },
          reset() {
            this.input.name = ''
            this.input.categoryId = ''
            this.activeFilter = ''
            this.page = 1
            this.fetchData()
          },
          // 修改点：stats-card 点击切换筛选状态 — 已迁移至 onCardClick，保留兼容
          // filterBy 已由 onCardClick 替代
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增食材'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.categoryId = ''
            this.formData.unit = ''
            this.formData.stockQty = ''
            this.formData.minStock = ''
            this.formData.unitPrice = ''
            this.formData.supplierId = ''
            this.formData.barcode = ''
            this.formData.status = '1'
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改食材'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.categoryId = row.categoryId
            this.formData.unit = row.unit
            this.formData.stockQty = row.stockQty
            this.formData.minStock = row.minStock
            this.formData.unitPrice = row.unitPrice
            this.formData.supplierId = row.supplierId
            this.formData.barcode = row.barcode
            this.formData.status = String(row.status)
            this.formData.dialogVisible = true
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该食材, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteMaterial(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          warningHandle() {
            materialWarning().then(res => {
              if (res.code === 1) {
                this.warningData = res.data
                this.warningDialogVisible = true
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          },
          submitForm() {
            const fd = this.formData
            if (!fd.name) {
              this.$message.error('请输入食材名称')
              return
            }
            const params = {
              name: fd.name,
              categoryId: fd.categoryId,
              unit: fd.unit,
              stockQty: fd.stockQty,
              minStock: fd.minStock,
              unitPrice: fd.unitPrice,
              supplierId: fd.supplierId || undefined,
              barcode: fd.barcode,
              status: fd.status
            }
            if (this.action === 'add') {
              addMaterial(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              params.id = fd.id
              updateMaterial(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          },
          // 修改点：分页处理改为 crud-table 事件驱动（参考 supplier-list 已验证模式）
          onPageChange({ page, pageSize }) {
            this.page = page
            this.pageSize = pageSize
            this.fetchData()
          },
          onSizeChange(val) {
            this.pageSize = val
            this.page = 1
            this.fetchData()
          }
        }
      })
    </script>
</body>
</html>
