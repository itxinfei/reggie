<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食材管理 - 瑞吉外卖管理端</title>

  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <div class="dashboard-container" id="material-app">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <!-- 页头：标题 + 副标题 + 页级操作 -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">食材管理</h1>
          <p class="ds-page-header__subtitle">管理食材库存和采购预警</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="食材名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')"
            @visible-change="onFilterDropdownVisible">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
          <el-select v-model="input.categoryId" placeholder="食材分类" class="el-select--narrow" clearable @change="handleQuery">
            <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-actions="true"
        :actions-width="180"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-stockQty="{ row }">
          <span :style="row.stockQty <= row.minStock ? 'color: red; font-weight: bold' : ''">{{ row.stockQty }}</span>
        </template>
        <template #col-unitPrice="{ row }">￥{{ row.unitPrice }}</template>
        <template #col-status="{ row }">
          <el-tag :type="row.status == '1' ? 'success' : 'info'" size="small">
            {{ row.status == '1' ? '启用' : '禁用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </main>
    <!-- 修改点：使用 <crud-dialog> 统一弹窗组件替代手写 el-dialog -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      :submit-loading="submitting"
      size="lg"
      @submit="submitForm"
      @close="handleClose"
    >
      <!-- 修改点：移除误导性死 class demo-form-inline；label-width 120→90（"库存数量"等4字标签） -->
      <!-- 修改点：补全 ref/:model/:rules，启用 Element 校验（原仅手写 if 判断，属"假必填"） -->
      <el-form ref="materialForm" :model="formData" :rules="materialRules" label-width="90px">
        <el-form-item label="食材名称：" prop="name">
          <el-input v-model="formData.name" placeholder="请输入食材名称" />
        </el-form-item>
        <el-form-item label="食材分类：">
          <el-select v-model="formData.categoryId" placeholder="请选择" style="width: 100%">
            <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="单位：">
          <el-input v-model="formData.unit" placeholder="如：斤、个、箱" />
        </el-form-item>
        <el-form-item label="库存数量：">
          <el-input v-model="formData.stockQty" type="number" placeholder="请输入库存数量" />
        </el-form-item>
        <el-form-item label="最低库存：">
          <el-input v-model="formData.minStock" type="number" placeholder="请输入最低库存预警值" />
        </el-form-item>
        <el-form-item label="单价：">
          <el-input v-model="formData.unitPrice" type="number" placeholder="请输入单价" />
        </el-form-item>
        <el-form-item label="供应商：">
          <el-select v-model="formData.supplierId" placeholder="请选择" style="width: 100%" clearable>
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="条码：">
          <el-input v-model="formData.barcode" placeholder="请输入条码" />
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="'1'">启用</el-radio>
            <el-radio :label="'0'">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </crud-dialog>
    <!-- 修改点：使用 <crud-dialog> 统一弹窗组件替代手写 el-dialog（仅展示，隐藏确认按钮） -->
    <crud-dialog title="库存预警" :visible.sync="warningDialogVisible" size="lg" :show-submit="false" cancel-text="关 闭">
      <el-table aria-label="数据表格" :data="warningData" stripe class="tableBox">
        <el-table-column prop="name" label="食材名称" min-width="160" align="center"></el-table-column>
        <el-table-column label="食材分类" width="140" align="center" :header-align="'center'" :show-overflow-tooltip="true">
          <template slot-scope="scope">{{ scope.row.categoryName }}</template>
        </el-table-column>
        <el-table-column prop="unit" label="单位" width="100" align="center" :header-align="'center'" :show-overflow-tooltip="true"></el-table-column>
        <el-table-column label="库存数量" width="140" align="center" :header-align="'center'" :show-overflow-tooltip="true">
          <template slot-scope="scope">
            <span :style="{ color: 'var(--color-danger)', fontWeight: 'var(--font-weight-bold)' }">{{ scope.row.stockQty }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="minStock" label="最低库存" width="140" align="center" :header-align="'center'" :show-overflow-tooltip="true"></el-table-column>
      </el-table>
      <template #footer>
        <el-button size="medium" @click="warningDialogVisible = false">关 闭</el-button>
        <el-button type="primary" size="medium" icon="el-icon-shopping-cart-2" @click="goReplenish">一键转补货单</el-button>
      </template>
    </crud-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
    <script src="../../api/inventory.js"></script>
    <script src="../../js/components.js"></script>
    <script>
      new Vue({
        el: '#material-app',
        data() {
          return {
            loading: false,
            submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            // 数据统计
            stats: {
              totalMaterials: 0,
              activeMaterials: 0,
              lowStockMaterials: 0,
              totalCategories: 0
            },
            // 修改点：当前激活的筛选器值，空字符串=全部
            activeFilter: '',
            // 修改点：<table-bar> 统一组件配置
            tableSearchItems: [],
            tableActions: [
              { key: 'add', text: '+ 新增食材', type: 'primary' },
              { key: 'warning', text: '库存预警', type: 'warning' }
            ],
            input: {
              name: '',
              categoryId: ''
            },
            // 修改点：搜索下拉框动态选项（从数据库加载）
            filterOptions: { names: [] },
            // 修改点：下拉选项加载状态
            optionsLoading: false,
            optionsLoadError: false,
            categoryOptions: [],
            supplierOptions: [],
            formData: {
              title: '新增食材',
              dialogVisible: false,
              id: '',
              name: '',
              categoryId: '',
              unit: '',
              stockQty: '',
              minStock: '',
              unitPrice: '',
              supplierId: '',
              barcode: '',
              status: '1'
            },
            // 修改点：食材表单校验规则（配合 el-form :rules + validate()）
            materialRules: {
              name: [{ required: true, whitespace: true, message: '请输入食材名称', trigger: 'blur' }]
            },
            warningDialogVisible: false,
            warningData: []
          }
        },
        created() {
          this.fetchData(true)
          this.loadOptions()
          this.loadFilterOptions()
        },
        computed: {
          // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
          statsCards: function() {
            const self = this;
            return [
              { key: '', icon: 'ri-leaf-line', label: '食材总数', value: self.stats.totalMaterials || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
              { key: '1', icon: 'ri-checkbox-circle-line', label: '启用中', value: self.stats.activeMaterials || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
              { key: 'low', icon: 'ri-error-warning-line', label: '库存预警', value: self.stats.lowStockMaterials || 0, color: 'warning', clickable: true, active: self.activeFilter === 'low' },
              { key: 'categories', icon: 'ri-box-3-line', label: '分类数量', value: self.stats.totalCategories || 0, color: 'danger' }
            ]
          },
          // 修改点：列配置改为 computed，关联分类/供应商名称通过已加载的 options 映射，
          // 避免列表接口仅返回 categoryId/supplierId 导致“分类/供应商”列空白（编辑弹窗因下拉回填故有值）
          columns: function () {
            var self = this
            function mapName(options, id) {
              if (id == null) return ''
              var sid = String(id)
              for (var i = 0; i < options.length; i++) {
                if (String(options[i].id) === sid) return options[i].name
              }
              return ''
            }
            return [
              { prop: 'name', label: '食材名称', minWidth: 120 },
              { prop: 'categoryName', label: '分类', width: 80, align: 'center', formatter: function (v, row) {
                return mapName(self.categoryOptions, row.categoryId) || v || '-'
              } },
              { prop: 'unit', label: '单位', width: 60, align: 'center' },
              { prop: 'stockQty', label: '库存', width: 80, slot: true, type: 'number' },
              { prop: 'minStock', label: '最低库存', width: 80, type: 'number' },
              { prop: 'unitPrice', label: '单价', width: 110, align: 'center', slot: true, type: 'money' },
              { prop: 'supplierName', label: '供应商', width: 100, align: 'center', formatter: function (v, row) {
                return mapName(self.supplierOptions, row.supplierId) || v || '-'
              } },
              { prop: 'status', label: '状态', width: 70, align: 'center', slot: true }
            ]
          }
        },
        methods: {
          // 修改点：<stat-cards> 组件统一卡片点击分发
          onCardClick: function(payload) {
            const key = payload.activeKey;
            this.activeFilter = key;
            // 卡片筛选时清空搜索输入
            this.input.name = '';
            this.input.categoryId = '';
            this.page = 1;
            this.fetchData(false);
          },
          // 修改点：<table-bar> 组件统一操作分发
          onTableAction: function(payload) {
            if (payload.key === 'add') { this.addHandle(); }
            else if (payload.key === 'warning') { this.warningHandle(); }
          },
          // 修改点：统一方法名 fetchData（供 crud-table 分页事件调用）；reloadStats=true 才重算全局统计
          async fetchData(reloadStats = true) {
            const params = { page: this.page, pageSize: this.pageSize }
            if (this.input.name) params.name = this.input.name
            if (this.input.categoryId) params.categoryId = this.input.categoryId
            // 修改点：传递状态筛选参数到后端
            if (this.activeFilter && this.activeFilter !== 'low') params.status = this.activeFilter

            // 修改点：F9 性能 — 列表只查当前页，全局统计仅 reloadStats 时重算
            const requests = [materialPage(params)]
            if (reloadStats) { requests.push(this.loadMaterialStats()) }
            const results = await Promise.all(requests)
            const materialRes = results[0]
            // 修改点：库存预警在前端过滤
            if (materialRes && materialRes.data && materialRes.data.records && this.activeFilter === 'low') {
              const records = materialRes.data.records
              materialRes.data.records = records.filter(function(r) { return r.stockQty <= r.minStock })
              materialRes.data.total = materialRes.data.records.length
            }

            // 处理食材列表数据
            if (String(materialRes.code) === '1') {
              this.tableData = materialRes.data.records
              this.counts = Number(materialRes.data.total)
            } else {
              ReggieUI.error(materialRes.msg || '操作失败')
            }

            // 处理统计数据（仅 reloadStats 时）
            if (reloadStats) {
              const statsRes = results[1]
              if (statsRes && String(statsRes.code) === '1') {
                this.stats = statsRes.data || this.stats
              }
            }
          },
          // 加载食材统计数据
          async loadMaterialStats() {
            try {
              // 修改点：使用 pageSize=1 多状态并发查询替代 pageSize=1000 拉全量，避免数据截断
              // 库存预警数通过 materialWarning API 直接获取
              const [totalRes, activeRes, warningRes, categoryRes] = await Promise.all([
                materialPage({ page: 1, pageSize: 1 }),
                materialPage({ page: 1, pageSize: 1, status: '1' }),
                materialWarning(),
                matCategoryList()
              ])
              return {
                code: 1,
                data: {
                  totalMaterials: (String(totalRes.code) === '1' && totalRes.data) ? (totalRes.data.total || 0) : 0,
                  activeMaterials: (String(activeRes.code) === '1' && activeRes.data) ? (activeRes.data.total || 0) : 0,
                  lowStockMaterials: (String(warningRes.code) === '1' && warningRes.data) ? warningRes.data.length : 0,
                  totalCategories: (String(categoryRes.code) === '1' && categoryRes.data) ? categoryRes.data.length : 0
                }
              }
            } catch (err) {
              console.warn('加载食材统计数据失败:', err)
            }
            return { code: 0 }
          },
          loadOptions() {
            matCategoryList().then(res => {
              if (res.code === 1) this.categoryOptions = res.data
            })
            supplierList().then(res => {
              if (res.code === 1) this.supplierOptions = res.data
            })
          },
          // 修改点：加载搜索下拉框选项（从数据库动态查询）
          async loadFilterOptions() {
            this.optionsLoading = true
            this.optionsLoadError = false
            try {
              const res = await materialList()  // 修改点：list 接口本身就返回全量，传递分页参数无效
              if (String(res.code) === '1' && res.data) {
                const names = new Set()
                ;(res.data.records || []).forEach(function(r) {
                  if (r.name) names.add(r.name)
                })
                this.filterOptions.names = Array.from(names)
              } else {
                this.optionsLoadError = true
              }
            } catch (err) {
              this.optionsLoadError = true
              console.warn('加载食材筛选选项失败:', err)
            } finally {
              this.optionsLoading = false
            }
          },
          // 修改点：下拉框显示/隐藏时自动加载选项
          async onFilterDropdownVisible(visible) {
            if (visible && (!this.filterOptions.names || this.filterOptions.names.length === 0)) {
              await this.loadFilterOptions()
            }
          },
          handleQuery() {
            // 修改点：搜索时清空卡片筛选状态
            this.activeFilter = ''
            this.page = 1
            this.fetchData(false)
          },
          reset() {
            this.input.name = ''
            this.input.categoryId = ''
            this.activeFilter = ''
            this.page = 1
            this.fetchData(false)
          },
          // 修改点：stats-card 点击切换筛选状态 — 已迁移至 onCardClick，保留兼容
          // filterBy 已由 onCardClick 替代
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增食材'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.categoryId = ''
            this.formData.unit = ''
            this.formData.stockQty = ''
            this.formData.minStock = ''
            this.formData.unitPrice = ''
            this.formData.supplierId = ''
            this.formData.barcode = ''
            this.formData.status = '1'
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改食材'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.categoryId = row.categoryId
            this.formData.unit = row.unit
            this.formData.stockQty = row.stockQty
            this.formData.minStock = row.minStock
            this.formData.unitPrice = row.unitPrice
            this.formData.supplierId = row.supplierId
            this.formData.barcode = row.barcode
            this.formData.status = String(row.status)
            this.formData.dialogVisible = true
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          deleteHandle(id) {
            ReggieUI.confirm('此操作将永久删除该食材, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteMaterial(id).then(res => {
                if (res.code === 1) {
                  ReggieUI.success('删除成功！')
                  this.activeFilter = ''
                  this.page = 1
                  this.fetchData(true)
                } else {
                  ReggieUI.error(res.msg || '操作失败')
                }
              }).catch(err => {
                ReggieUI.error('请求失败：' + err)
              })
            })
          },
          warningHandle() {
            materialWarning().then(res => {
              if (res.code === 1) {
                this.warningData = res.data
                this.warningDialogVisible = true
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => {
              ReggieUI.error('请求失败：' + err)
            })
          },
          // 修改点：8.3.1 一键转采购 —— 跳转智能补货页生成补货单
          goReplenish() {
            this.warningDialogVisible = false
            window.location.href = 'material-warning.html'
          },
          async submitForm() {
            if (this.submitting) return // 提交防重
            const self = this
            await new Promise(function(resolve, reject) {
              self.$refs.materialForm.validate(function(valid) { valid ? resolve() : reject() })
            }).catch(function() {
              ReggieUI.warning('请完善表单必填项')
              return
            })
            self.submitting = true
            const fd = self.formData
            const params = {
              name: fd.name,
              categoryId: fd.categoryId,
              unit: fd.unit,
              stockQty: fd.stockQty,
              minStock: fd.minStock,
              unitPrice: fd.unitPrice,
              supplierId: fd.supplierId || undefined,
              barcode: fd.barcode,
              status: fd.status
            }
            if (this.action === 'add') {
              addMaterial(params).then(res => {
                self.submitting = false
                if (res.code === 1) {
                  ReggieUI.success('添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  ReggieUI.error(res.msg || '操作失败')
                }
              }).catch(err => {
                self.submitting = false
                ReggieUI.error('请求失败：' + err)
              })
            } else {
              params.id = fd.id
              updateMaterial(params).then(res => {
                self.submitting = false
                if (res.code === 1) {
                  ReggieUI.success('修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  ReggieUI.error(res.msg || '操作失败')
                }
              }).catch(err => {
                ReggieUI.error('请求失败：' + err)
              })
            }
          },
          // 修改点：分页处理改为 crud-table 事件驱动（参考 supplier-list 已验证模式）
          onPageChange({ page, pageSize }) {
            this.page = page
            this.pageSize = pageSize
            this.fetchData(false)
          },
          onSizeChange(val) {
            this.pageSize = val
            this.page = 1
            this.fetchData(false)
          }
        }
      })
    </script>
</body>
</html>
