<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="material-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="input.name" placeholder="食材名称" style="width: 180px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-select v-model="input.categoryId" placeholder="食材分类" style="width: 150px; margin-left: 10px" clearable @change="handleQuery">
          <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
        </el-select>
        <el-button type="primary" style="margin-left: 10px" @click="handleQuery">查询</el-button>
        <el-button type="primary" @click="addHandle">+ 新增食材</el-button>
        <el-button type="warning" @click="warningHandle">库存预警</el-button>
      </div>
      <el-table :data="tableData" stripe class="tableBox">
        <el-table-column prop="name" label="食材名称" /></el-table-column>
        <el-table-column label="食材分类">
          <template slot-scope="scope">{{ scope.row.categoryName }}</template>
        </el-table-column>
        <el-table-column prop="unit" label="单位" width="80" /></el-table-column>
        <el-table-column label="库存数量">
          <template slot-scope="scope">
            <span :style="scope.row.stockQty <= scope.row.minStock ? 'color: red; font-weight: bold' : ''">{{ scope.row.stockQty }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="minStock" label="最低库存" width="100" /></el-table-column>
        <el-table-column label="单价">
          <template slot-scope="scope">￥{{ scope.row.unitPrice }}</template>
        </el-table-column>
        <el-table-column label="供应商">
          <template slot-scope="scope">{{ scope.row.supplierName }}</template>
        </el-table-column>
        <el-table-column prop="barcode" label="条码" width="120" /></el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <span>{{ scope.row.status == '1' ? '启用' : '禁用' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination class="pageList" :page-sizes="[10,20,30,40]" :page-size="pageSize" layout="total, sizes, prev, pager, next, jumper" :total="counts" @size-change="handleSizeChange" @current-change="handleCurrentChange"></el-pagination>
    </div>
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="40%" :before-close="handleClose">
      <el-form class="demo-form-inline" label-width="120px">
        <el-form-item label="食材名称：">
          <el-input v-model="formData.name" placeholder="请输入食材名称" />
        </el-form-item>
        <el-form-item label="食材分类：">
          <el-select v-model="formData.categoryId" placeholder="请选择" style="width: 100%">
            <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="单位：">
          <el-input v-model="formData.unit" placeholder="如：斤、个、箱" />
        </el-form-item>
        <el-form-item label="库存数量：">
          <el-input v-model="formData.stockQty" type="number" placeholder="请输入库存数量" />
        </el-form-item>
        <el-form-item label="最低库存：">
          <el-input v-model="formData.minStock" type="number" placeholder="请输入最低库存预警值" />
        </el-form-item>
        <el-form-item label="单价：">
          <el-input v-model="formData.unitPrice" type="number" placeholder="请输入单价" />
        </el-form-item>
        <el-form-item label="供应商：">
          <el-select v-model="formData.supplierId" placeholder="请选择" style="width: 100%" clearable>
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="条码：">
          <el-input v-model="formData.barcode" placeholder="请输入条码" />
        </el-form-item>
        <el-form-item label="状态：">
          <el-radio-group v-model="formData.status">
            <el-radio :label="'1'">启用</el-radio>
            <el-radio :label="'0'">禁用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
      </span>
    </el-dialog>
    <el-dialog title="库存预警" :visible.sync="warningDialogVisible" width="50%">
      <el-table :data="warningData" stripe class="tableBox">
        <el-table-column prop="name" label="食材名称" /></el-table-column>
        <el-table-column label="食材分类">
          <template slot-scope="scope">{{ scope.row.categoryName }}</template>
        </el-table-column>
        <el-table-column prop="unit" label="单位" width="80" /></el-table-column>
        <el-table-column label="库存数量">
          <template slot-scope="scope">
            <span style="color: red; font-weight: bold">{{ scope.row.stockQty }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="minStock" label="最低库存" width="100" /></el-table-column>
      </el-table>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="warningDialogVisible = false">关 闭</el-button>
      </span>
    </el-dialog>
  </div>
    <script src="../../plugins/vue/vue.js"></script>
    <script src="../../plugins/element-ui/index.js"></script>
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/inventory.js"></script>
    <script>
      new Vue({
        el: '#material-app',
        data() {
          return {
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            input: {
              name: '',
              categoryId: ''
            },
            categoryOptions: [],
            supplierOptions: [],
            formData: {
              title: '新增食材',
              dialogVisible: false,
              id: '',
              name: '',
              categoryId: '',
              unit: '',
              stockQty: '',
              minStock: '',
              unitPrice: '',
              supplierId: '',
              barcode: '',
              status: '1'
            },
            warningDialogVisible: false,
            warningData: []
          }
        },
        created() {
          this.init()
          this.loadOptions()
        },
        methods: {
          async init() {
            const params = { page: this.page, pageSize: this.pageSize }
            if (this.input.name) params.name = this.input.name
            if (this.input.categoryId) params.categoryId = this.input.categoryId
            await materialPage(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records
                this.counts = Number(res.data.total)
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          loadOptions() {
            matCategoryList().then(res => {
              if (res.code === 1) this.categoryOptions = res.data
            })
            supplierList().then(res => {
              if (res.code === 1) this.supplierOptions = res.data
            })
          },
          handleQuery() {
            this.page = 1
            this.init()
          },
          addHandle() {
            this.action = 'add'
            this.formData.title = '新增食材'
            this.formData.id = ''
            this.formData.name = ''
            this.formData.categoryId = ''
            this.formData.unit = ''
            this.formData.stockQty = ''
            this.formData.minStock = ''
            this.formData.unitPrice = ''
            this.formData.supplierId = ''
            this.formData.barcode = ''
            this.formData.status = '1'
            this.formData.dialogVisible = true
          },
          editHandle(row) {
            this.action = 'edit'
            this.formData.title = '修改食材'
            this.formData.id = row.id
            this.formData.name = row.name
            this.formData.categoryId = row.categoryId
            this.formData.unit = row.unit
            this.formData.stockQty = row.stockQty
            this.formData.minStock = row.minStock
            this.formData.unitPrice = row.unitPrice
            this.formData.supplierId = row.supplierId
            this.formData.barcode = row.barcode
            this.formData.status = String(row.status)
            this.formData.dialogVisible = true
          },
          handleClose() {
            this.formData.dialogVisible = false
          },
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该食材, 是否继续?', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              deleteMaterial(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求出错了：' + err)
              })
            })
          },
          warningHandle() {
            materialWarning().then(res => {
              if (res.code === 1) {
                this.warningData = res.data
                this.warningDialogVisible = true
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          },
          submitForm() {
            const fd = this.formData
            if (!fd.name) {
              this.$message.error('请输入食材名称')
              return
            }
            const params = {
              name: fd.name,
              categoryId: fd.categoryId,
              unit: fd.unit,
              stockQty: fd.stockQty,
              minStock: fd.minStock,
              unitPrice: fd.unitPrice,
              supplierId: fd.supplierId || undefined,
              barcode: fd.barcode,
              status: fd.status
            }
            if (this.action === 'add') {
              addMaterial(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('添加成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求出错了：' + err)
              })
            } else {
              params.id = fd.id
              updateMaterial(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('修改成功！')
                  this.formData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求出错了：' + err)
              })
            }
          },
          handleSizeChange(val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange(val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
