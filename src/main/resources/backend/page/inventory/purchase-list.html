<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购入库 - 瑞吉外卖管理端</title>

  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css?v=20260915c" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260915c" />
  <script src="../../plugins/echarts/echarts.min.js"></script>
  <style>
    /* ========== 采购管理专用样式 ========== */
    /* 采购趋势卡片：标题头 + 图表主体（紧凑档内边距，与全站卡片一致） */
    .purchase-chart { background: var(--bg-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-3) var(--space-2); box-shadow: var(--shadow-sm); margin-bottom: var(--space-3); }
    .purchase-chart__head { display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: 4px; }
    .purchase-chart__title { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-base); font-weight: 600; color: var(--text-primary); }
    .purchase-chart__title i { color: var(--color-brand-500); font-size: var(--font-size-base); }
    .purchase-chart__sub { font-size: var(--font-size-sm, 12px); color: var(--text-muted); }
    .purchase-chart__body { height: 280px; }
    .purchase-chart__empty { height: 280px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: var(--font-size-sm, 12px); }
    .detail-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  
    /* 采购管理表单宽度工具类（弹窗内表单用：page.css 的 --narrow* 仅限 .container .tableBar 搜索区，不可复用于弹窗）
       rg-w-full 全宽 / rg-w-220 操作员 / rg-w-160 明细食材 / rg-w-100 明细数量单价 */
    .rg-w-full { width: 100% !important; }
    .rg-w-220 { width: 220px !important; }
    .rg-w-160 { width: 160px !important; }
    .rg-w-100 { width: 100px !important; }

    /* ========== 展开行：采购明细卡片（#purchase-app 作用域，不影响盘点/评价页展开行） ========== */
    /* 收紧 Element 默认 20px 50px 的展开区内边距，浅灰底把展开区与主表行分层 */
    #purchase-app .el-table__expanded-cell[class*="cell"] { padding: 8px 12px; }
    #purchase-app .el-table__expanded-cell { background-color: var(--bg-page); }
    .purchase-detail {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .purchase-detail__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border-default);
    }
    .purchase-detail__title {
      display: flex; align-items: center; gap: 6px;
      font-size: var(--font-size-base); font-weight: 500; color: var(--text-primary);
    }
    .purchase-detail__title i { color: var(--text-muted); font-size: var(--font-size-base); }
    .purchase-detail__count { font-size: var(--font-size-sm, 12px); color: var(--text-muted); }
    /* 明细表：小尺寸、去掉外框与底部伪元素线（卡片已提供边框），避免表中表的双线堆叠 */
    .purchase-detail__table { width: 100%; border: 0 !important; }
    .purchase-detail__table::before { display: none !important; }
    .purchase-detail__empty {
      text-align: center; padding: 16px;
      color: var(--text-muted); font-size: var(--font-size-sm, 12px);
    }
</style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="purchase-app">
    <main class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="cardFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.supplierId" placeholder="供应商" class="el-select--narrow" clearable @change="handleQuery">
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
          <el-select v-model="input.status" placeholder="状态" class="el-select--narrow-sm" clearable @change="handleQuery">
            <el-option label="草稿" value="DRAFT"></el-option>
            <el-option label="已下单" value="ORDERED"></el-option>
            <el-option label="部分收货" value="PARTIAL"></el-option>
            <el-option label="已收货" value="RECEIVED"></el-option>
            <el-option label="已取消" value="CANCELLED"></el-option>
          </el-select>
        </template>
      </table-bar>

      <!-- 采购趋势：近30天每日新建采购单的金额（柱）与单数（线），全局统计不随上方筛选变化 -->
      <div class="purchase-chart">
        <div class="purchase-chart__head">
          <span class="purchase-chart__title"><i class="ri-line-chart-line"></i>近30天采购趋势</span>
          <span class="purchase-chart__sub">按天统计新建采购单金额与单数（含全部状态，不受上方筛选影响）</span>
        </div>
        <div class="purchase-chart__body" id="purchaseTrendChart" v-show="!trendEmpty"></div>
        <div class="purchase-chart__empty" v-if="trendEmpty">近30天暂无采购数据</div>
      </div>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination（与库存流水页一致，修复表格样式不一致） -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :expand="true"
        row-key="id"
        :show-actions="true" :viewable="true"
        :actions-width="280"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        @expand-change="loadDetails">
        <template #expand="{ row }">
          <div class="purchase-detail">
            <div class="purchase-detail__head">
              <span class="purchase-detail__title"><i class="ri-file-list-3-line"></i>采购明细</span>
              <span class="purchase-detail__count" v-if="row.details && row.details.length">共 {{ row.details.length }} 项</span>
            </div>
            <div v-if="row.detailLoading" class="purchase-detail__empty"><i class="el-icon-loading"></i> 明细加载中...</div>
            <el-table v-else-if="row.details && row.details.length" aria-label="采购明细" :data="row.details" stripe size="small" class="purchase-detail__table">
              <el-table-column prop="materialName" label="食材名称" min-width="140" align="center" :header-align="'center'" />
              <el-table-column prop="materialId" label="食材ID" width="100" align="center" :header-align="'center'" :show-overflow-tooltip="true" />
              <el-table-column prop="qty" label="数量" width="100" align="center" :header-align="'center'" :show-overflow-tooltip="true" />
              <el-table-column label="单价" width="100" align="center" :header-align="'center'" :show-overflow-tooltip="true">
                <template slot-scope="scope">￥{{ scope.row.unitPrice }}</template>
              </el-table-column>
              <el-table-column label="已收货" width="120" align="center" :header-align="'center'" :show-overflow-tooltip="true">
                <template slot-scope="scope">{{ scope.row.receivedQty || 0 }}</template>
              </el-table-column>
              <el-table-column label="小计" width="110" align="center">
                <template slot-scope="scope">￥{{ scope.row.amount }}</template>
              </el-table-column>
              <el-table-column prop="remark" label="备注" min-width="120" align="center" :header-align="'center'" />
            </el-table>
            <div v-else class="purchase-detail__empty">暂无明细数据</div>
          </div>
        </template>
        <template #col-totalAmount="{ row }">￥{{ (row.totalAmount || 0).toString() }}</template>
        <template #col-status="{ row }">
          <el-tag :type="statusType(row.status)" size="small">{{ statusLabel(row.status) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="approveHandle(row)" v-if="row.status === 'DRAFT'">审核</el-button>
          <el-button type="text" size="small" class="btn-view" @click="receiveHandle(row)" v-if="row.status === 'ORDERED' || row.status === 'PARTIAL'">收货</el-button>
          <!-- 修改点：补充编辑（草稿/已下单/部分收货可改）与删除（仅草稿/已取消可删，与后端约束一致） -->
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)" v-if="row.status === 'DRAFT' || row.status === 'ORDERED' || row.status === 'PARTIAL'">编辑</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row)" v-if="row.status === 'DRAFT' || row.status === 'CANCELLED'">删除</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row)" v-if="row.status === 'DRAFT' || row.status === 'ORDERED'">取消</el-button>
        </template>
      </crud-table>
    </main>

    <!-- 新增采购单对话框 -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      size="lg"
      :submit-loading="submitting"
      :close-on-click-modal="false"
      @submit="submitForm"
      @close="handleClose"
    >
      <!-- 修改点：移除误导性死 class demo-form-inline（label-width 100 可接受，保持不变） -->
      <el-form ref="purchaseForm" :model="formData" :rules="purchaseRules" label-width="100px">
        <el-form-item label="供应商：" prop="supplierId">
          <el-select v-model="formData.supplierId" placeholder="请选择供应商" class="rg-w-full">
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="操作员：" prop="operator">
          <el-input v-model="formData.operator" placeholder="请输入操作员姓名" class="rg-w-220" />
        </el-form-item>
        <el-form-item label="备注：">
          <el-input v-model="formData.remark" placeholder="采购备注（可选）" />
        </el-form-item>
        <el-form-item label="采购明细：">
          <div v-for="(item, index) in formData.details" :key="index" class="detail-row">
            <el-select v-model="item.materialId" placeholder="食材" class="rg-w-160" filterable>
              <el-option v-for="m in materialOptions" :key="m.id" :label="m.name" :value="m.id"></el-option>
            </el-select>
            <el-input v-model="item.qty" placeholder="数量" type="number" class="rg-w-100" />
            <el-input v-model="item.unitPrice" placeholder="单价" type="number" class="rg-w-100" />
            <el-button type="danger" size="mini" @click="removeDetail(index)">删除</el-button>
          </div>
          <el-button type="primary" size="mini" @click="addDetail">+ 添加明细</el-button>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 修改点：编辑采购单弹窗（后端 PUT 仅允许修改供应商/操作员/备注，明细不在此改动） -->
    <crud-dialog
      title="编辑采购单"
      :visible.sync="editDialogVisible"
      size="sm"
      :submit-loading="submitting"
      :close-on-click-modal="false"
      @submit="submitEdit"
      @close="editDialogVisible = false"
    >
      <el-form ref="editForm" :model="editForm" :rules="editRules" label-width="100px" size="small">
        <el-form-item label="采购单号：">
          <span style="font-weight:600;">{{ editForm.orderNo }}</span>
        </el-form-item>
        <el-form-item label="供应商：" prop="supplierId">
          <el-select v-model="editForm.supplierId" placeholder="请选择" class="rg-w-full">
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="操作员：" prop="operator">
          <el-input v-model="editForm.operator" placeholder="请输入操作员姓名" class="rg-w-full" />
        </el-form-item>
        <el-form-item label="备注：">
          <el-input v-model="editForm.remark" placeholder="采购备注（可选）" />
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 修改点：部分收货弹窗——按明细指定收货数量 -->
    <crud-dialog
      :visible.sync="partialDialogVisible"
      title="收货确认"
      size="lg"
      :show-submit="true"
      submit-text="确认收货"
      :submit-loading="partialLoading"
      @submit="submitPartialReceive"
    >
      <el-alert type="info" :closable="false" style="margin-bottom:16px;">
        <div slot="title">修改「本次收货」数量，支持部分收货。未收货的明细可在下次继续收货。</div>
      </el-alert>
      <el-table :data="partialItems" border size="small" style="width:100%;">
        <el-table-column prop="materialId" label="食材ID" width="100" align="center" :header-align="'center'" />
        <el-table-column label="采购数量" width="100" align="center" :header-align="'center'">
          <template slot-scope="scope">{{ scope.row.qty }}</template>
        </el-table-column>
        <el-table-column label="已收货" width="100" align="center" :header-align="'center'">
          <template slot-scope="scope">{{ scope.row.receivedQty }}</template>
        </el-table-column>
        <el-table-column label="剩余" width="100" align="center" :header-align="'center'">
          <template slot-scope="scope">{{ scope.row.remainQty }}</template>
        </el-table-column>
        <el-table-column label="本次收货" min-width="150" align="center" :header-align="'center'">
          <template slot-scope="scope">
            <el-input-number v-model="scope.row.receiveQty" :min="0" :max="scope.row.remainQty" size="small" controls-position="right" style="width:120px;" />
          </template>
        </el-table-column>
      </el-table>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260915c"></script>
  <script src="../../js/accessibility-utils.js?v=20260915c"></script>
  <script src="../../js/performance-utils.js?v=20260915c"></script>
  <script src="../../api/inventory.js?v=20260915c"></script>
  <script src="../../js/components.js?v=20260915c"></script>
  <script>
    new Vue({
      el: '#purchase-app',
      data() {
        return {
          loading: false, counts: 0, page: 1, pageSize: 10, tableData: [],
          // 修改点：补声明 submitting —— 模板 :submit-loading="submitting" 引用了它但从未定义，
          // 导致 Vue 渲染告警且提交按钮无 loading 态（可重复点击造成重复下单）
          submitting: false,
          // 修改点：分离卡片筛选和下拉筛选，避免冲突
          cardFilter: '',
          // 修改点：crud-table 列配置（替代手写 el-table-column）
          columns: [
            { prop: 'orderNo', label: '采购单号', minWidth: 140, align: 'center' },
            { prop: 'supplierName', label: '供应商', minWidth: 120, align: 'center' },
            { prop: 'totalAmount', label: '总金额', width: 110, align: 'center', slot: true, type: 'money' },
            { prop: 'status', label: '状态', width: 70, align: 'center', slot: true },
            { prop: 'operator', label: '操作员', width: 80, align: 'center' },
            { prop: 'remark', label: '备注', minWidth: 100, align: 'center' },
            { prop: 'createdTime', label: '创建时间', width: 160, align: 'center' }
          ],
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增采购单', type: 'primary' }
          ],
          input: { supplierId: '', status: '' },
          supplierOptions: [], materialOptions: [],
          trendChart: null,
          trendEmpty: false,
          formData: {
            title: '新增采购单', dialogVisible: false,
            supplierId: '', operator: '', remark: '',
            details: [{ materialId: '', qty: '', unitPrice: '' }]
          },
          // 修改点：编辑采购单表单（仅供应商/操作员/备注，明细与金额不在此修改）
          editDialogVisible: false,
          editForm: { id: null, orderNo: '', supplierId: '', operator: '', remark: '' },
          // 修改点：编辑表单必填校验（supplierId/operator 为必填）
          editRules: {
            supplierId: [{ required: true, message: '请选择供应商', trigger: 'change' }],
            operator: [{ required: true, whitespace: true, message: '请输入操作员', trigger: 'blur' }]
          },
          // 修改点：采购表单校验规则（配合 el-form :rules + validate()）
          purchaseRules: {
            supplierId: [{ required: true, message: '请选择供应商', trigger: 'change' }],
            operator: [{ required: true, whitespace: true, message: '请输入操作员', trigger: 'blur' }]
          },
          // 修改点：部分收货弹窗
          partialDialogVisible: false,
          partialOrderId: null,
          partialItems: [],
          partialLoading: false
        }
      },
      created() { this.init() },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          const self = this;
          const s = self.stats  || {}
          return [
            { key: '', icon: 'ri-box-3-line', label: '采购单总数', value: s.totalOrders || 0, color: 'primary', clickable: true, active: self.cardFilter === '' },
            { key: 'DRAFT', icon: 'ri-edit-2-line', label: '待审核', value: s.pendingApprove || 0, color: 'warning', clickable: true, active: self.cardFilter === 'DRAFT' },
            { key: 'ORDERED', icon: 'ri-truck-line', label: '待收货', value: s.pendingReceive || 0, color: 'info', clickable: true, active: self.cardFilter === 'ORDERED' },
            { key: 'monthAmount', icon: 'ri-money-cny-circle-line', label: '本月采购金额', value: '¥' + self.formatMoney(s.monthAmount), color: 'success', prefix: '' }
          ]
        }
      },
      // 修改点：resize 回调存引用，否则 beforeDestroy 无法解绑（原匿名函数导致监听器泄漏）
      mounted() {
        this.resizeHandler = () => {
          if (this.trendChart && !this.trendChart.isDisposed()) this.trendChart.resize()
        }
        window.addEventListener('resize', this.resizeHandler)
      },
      beforeDestroy() {
        if (this.resizeHandler) window.removeEventListener('resize', this.resizeHandler)
        if (this.trendChart && !this.trendChart.isDisposed()) {
          try { this.trendChart.dispose() } catch (e) {}
        }
      },
      methods: {
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.cardFilter = payload.activeKey
          this.page = 1
          this.init()
        },
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        async init() {
          this.loadSupplierOptions()
          // 加载统计
          try {
            const statsRes = await inventoryStatsOverview()
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = {
                totalOrders: statsRes.data.monthPOCount || 0,
                // 待审核数只能取 DRAFT 状态计数（下方单独查询），不可先用本月单数占位，否则草稿查询失败时显示错误数字
                pendingApprove: 0,
                pendingReceive: statsRes.data.pendingReceiveCount || 0,
                monthAmount: statsRes.data.monthPOAmount || 0
              }
              // 获取待审核数量
              try {
                const draftRes = await purchasePage({ page: 1, pageSize: 1, status: 'DRAFT' })
                if (draftRes && String(draftRes.code) === '1') this.stats.pendingApprove = Number(draftRes.data.total) || 0
              } catch (e) {}
            }
          } catch (e) { console.warn('获取统计失败:', e) }

          // 加载列表
          const params = { page: this.page, pageSize: this.pageSize }
          params.status = this.cardFilter || this.input.status || undefined
          if (this.input.supplierId) params.supplierId = this.input.supplierId
          try {
            const res = await purchasePage(params)
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = Number(res.data.total) || 0
              // 无筛选条件时用总数作为采购单总数
              if (!this.cardFilter && !this.input.status) {
                this.stats.totalOrders = this.counts
              }
            }
          } catch (err) { ReggieUI.error('请求失败：' + (err.message || err)) }

          // 加载趋势图
          this.$nextTick(() => this.renderTrendChart())
        },
        async renderTrendChart() {
          const dom = document.getElementById('purchaseTrendChart')
          if (!dom) return
          // echarts 为本地 plugins 引入；异常缺失时在空态位给出提示，不渲染空白块
          if (typeof echarts === 'undefined') {
            this.trendEmpty = true
            return
          }
          let dates = [], amounts = [], counts = []
          try {
            const res = await inventoryPurchaseTrend()
            if (res && String(res.code) === '1' && Array.isArray(res.data)) {
              res.data.forEach(d => {
                dates.push(d.date)
                amounts.push(Number(d.amount) || 0)
                counts.push(Number(d.count) || 0)
              })
            }
          } catch (e) { console.warn('趋势图加载失败:', e) }
          // 本月无任何采购单：显示空态，不渲染 0 值假日柱子
          const hasData = amounts.some(v => v > 0) || counts.some(v => v > 0)
          this.trendEmpty = !hasData
          if (!hasData) return
          await this.$nextTick()
          if (!this.trendChart) this.trendChart = echarts.init(dom)
          const P = window.RgPalette
          const moneyFmt = window.RgFormat ? window.RgFormat.formatMoney : function(v) { return Number(v).toFixed(2) }
          this.trendChart.setOption({
            color: [P.brand, P.success],
            tooltip: {
              trigger: 'axis', axisPointer: { type: 'shadow' },
              formatter: function(params) {
                let html = params[0].axisValue + '<br/>'
                params.forEach(p => {
                  const val = p.seriesName === '采购金额' ? ('¥' + moneyFmt(p.value)) : (p.value + ' 单')
                  html += p.marker + p.seriesName + '：' + val + '<br/>'
                })
                return html
              }
            },
            legend: { data: ['采购金额', '采购单数'], bottom: 0, itemWidth: 14, itemHeight: 8, textStyle: { color: P.textSecondary } },
            grid: { left: 56, right: 48, top: 24, bottom: 38, containLabel: true },
            xAxis: {
              type: 'category', data: dates,
              axisLabel: { rotate: dates.length > 20 ? 45 : 0, fontSize: 11, color: P.textSecondary },
              axisLine: { lineStyle: { color: P.borderLighter } }, axisTick: { show: false }
            },
            yAxis: [
              {
                type: 'value', name: '金额(元)', nameTextStyle: { color: P.textSecondary, align: 'left' },
                axisLabel: { color: P.textSecondary, formatter: function(v) { return Math.abs(v) >= 10000 ? (v / 10000) + '万' : v } },
                splitLine: { lineStyle: { type: 'dashed', color: P.borderLighter } }
              },
              {
                type: 'value', name: '单数', minInterval: 1, nameTextStyle: { color: P.textSecondary, align: 'right' },
                axisLabel: { color: P.textSecondary }, splitLine: { show: false }
              }
            ],
            series: [
              { name: '采购金额', type: 'bar', data: amounts, barMaxWidth: 22, itemStyle: { borderRadius: [P.radiusMd, P.radiusMd, 0, 0], color: P.brand } },
              { name: '采购单数', type: 'line', yAxisIndex: 1, data: counts, smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { width: 2, color: P.success }, itemStyle: { color: P.success } }
            ]
          })
          // 容器在 v-show 由隐藏切显示后需校正一次尺寸
          this.trendChart.resize()
        },
        filterByStatus(status) {
          this.cardFilter = this.cardFilter === status ? '' : status
          this.page = 1; this.init()
        },
        loadSupplierOptions() { supplierList().then(res => { if (res.code === 1) this.supplierOptions = res.data }) },
        loadMaterialOptions() { materialList().then(res => { if (res.code === 1) this.materialOptions = res.data }) },
        loadDetails(row) {
          // 已加载或正在加载时不重复请求；展开区按 loading/有数据/空 三态渲染
          if (!row.id || row.details || row.detailLoading) return
          this.$set(row, 'detailLoading', true)
          purchaseDetailList(row.id).then(res => {
            if (res.code === 1) this.$set(row, 'details', res.data || [])
          }).catch(err => { ReggieUI.error('请求失败：' + err) })
            .finally(() => { this.$set(row, 'detailLoading', false) })
        },
        handleQuery() { this.page = 1; this.init() },
        reset() { this.input.supplierId = ''; this.input.status = ''; this.cardFilter = ''; this.page = 1; this.init() },
        addHandle() {
          this.formData = {
            title: '新增采购单', dialogVisible: true,
            supplierId: '', operator: '', remark: '',
            details: [{ materialId: '', qty: '', unitPrice: '' }]
          }
          this.loadSupplierOptions(); this.loadMaterialOptions()
        },
        handleClose() { this.formData.dialogVisible = false },
        addDetail() {
            this.formData.details.push({ materialId: '', qty: '', unitPrice: '' })
          },
        removeDetail(index) { this.formData.details.splice(index, 1) },
        // 修改点：审核采购单
        approveHandle(row) {
          ReggieUI.confirm('确认审核通过该采购单? 审核后将进入待收货状态。', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'info'
          }).then(() => {
            approvePurchase(row.id).then(res => {
              if (res.code === 1) { ReggieUI.success('审核通过！'); this.handleQuery() }
              else ReggieUI.error(res.msg || '操作失败')
            }).catch(err => { ReggieUI.error('请求失败：' + err) })
          }).catch((err) => { console.warn('[purchase-list] 审核操作取消或失败:', err) })
        },
        // 修改点：收货——展示部分收货弹窗，支持按明细指定数量收货
        async receiveHandle(row) {
          const self = this;
          self.partialOrderId = row.id;
          self.partialItems = [];
          self.partialDialogVisible = true;
          try {
            const res = await getPurchase(row.id);
            if (res.code === 1 && res.data) {
              const details = res.data.details || [];
              self.partialItems = details.map(function(d) {
                var qty = Number(d.qty) || 0;
                var received = Number(d.receivedQty) || 0;
                var remain = Math.max(0, qty - received);
                return {
                  id: d.id,
                  materialId: d.materialId,
                  qty: qty,
                  receivedQty: received,
                  remainQty: remain,
                  receiveQty: remain // 默认收满剩余数量
                };
              });
            }
          } catch (e) {
            ReggieUI.error('加载采购明细失败');
            self.partialDialogVisible = false;
          }
        },
        // 修改点：提交部分收货
        async submitPartialReceive() {
          const self = this;
          var hasQty = self.partialItems.some(function(it) { return it.receiveQty > 0; });
          if (!hasQty) {
            ReggieUI.warning('请至少填写一项收货数量');
            return;
          }
          self.partialLoading = true;
          try {
            var qtys = {};
            self.partialItems.forEach(function(it) {
              if (it.receiveQty > 0) { qtys[it.id] = it.receiveQty; }
            });
            var res = await receivePartialPurchase(self.partialOrderId, qtys);
            if (String(res.code) === '1') {
              ReggieUI.success('收货成功！库存已更新');
              self.partialDialogVisible = false;
              self.handleQuery();
            } else {
              ReggieUI.error(res.msg || '收货失败');
            }
          } catch (e) {
            ReggieUI.error('请求失败：' + (e.message || e));
          } finally {
            self.partialLoading = false;
          }
        },
        cancelHandle(row) {
          ReggieUI.confirm('确认取消该采购单?', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(() => {
            cancelPurchase(row.id).then(res => {
              if (res.code === 1) { ReggieUI.success('取消成功！'); this.handleQuery() }
              else ReggieUI.error(res.msg || '操作失败')
            }).catch(err => { ReggieUI.error('请求失败：' + err) })
          }).catch((err) => { console.warn('[purchase-list] 取消操作取消或失败:', err) })
        },
        // 修改点：打开编辑弹窗（仅改基本信息，明细不属于本接口职责）
        editHandle(row) {
          this.editForm = {
            id: row.id,
            orderNo: row.orderNo || '',
            supplierId: row.supplierId || '',
            operator: row.operator || '',
            remark: row.remark || ''
          }
          this.loadSupplierOptions()
          this.editDialogVisible = true
        },
        // 修改点：提交编辑（走 el-form 校验，错误 inline 显示）
        submitEdit() {
          const self = this
          if (self.submitting) return
          self.$refs.editForm.validate(function(valid) {
            if (!valid) {
              ReggieUI.warning('请完善表单必填项')
              return
            }
            self.submitting = true
            updatePurchase({
              id: self.editForm.id,
              supplierId: self.editForm.supplierId,
              operator: self.editForm.operator,
              remark: self.editForm.remark
            }).then(function(res) {
              self.submitting = false
              if (res.code === 1) {
                ReggieUI.success('修改成功！')
                self.editDialogVisible = false
                self.handleQuery()
              } else {
                ReggieUI.error(res.msg || '修改失败')
              }
            }).catch(function(err) {
              self.submitting = false
              ReggieUI.error('请求失败：' + err)
            })
          })
        },
        // 修改点：删除采购单（后端限制仅草稿/已取消可删）
        deleteHandle(row) {
          ReggieUI.confirm('确认删除采购单「' + (row.orderNo || row.id) + '」？', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(() => {
            deletePurchase(row.id).then(res => {
              if (res.code === 1) { ReggieUI.success('删除成功！'); this.handleQuery() }
              else ReggieUI.error(res.msg || '删除失败')
            }).catch(err => { ReggieUI.error('请求失败：' + err) })
          }).catch((err) => { console.warn('[purchase-list] 删除操作取消或失败:', err) })
        },
        async submitForm() {
          const self = this
          if (self.submitting) return // 修改点：防重复提交
          // 修改点：原写法在 .catch 里 return 并不能中断外层 async 函数，
          // 校验失败仍会继续走创建请求；改为用标志位显式中断
          let valid = true
          await new Promise(function(resolve, reject) {
            self.$refs.purchaseForm.validate(function(ok) { ok ? resolve() : reject() })
          }).catch(function() { valid = false })
          if (!valid) { ReggieUI.warning('请完善表单必填项'); return }

          const fd = self.formData
          if (!fd.details.length || !fd.details[0].materialId) { ReggieUI.error('请添加至少一条采购明细'); return }

          // 修改点：全流程包裹 submitting，保证按钮 loading 与最终复位
          self.submitting = true
          try {
            const res = await addPurchase({ supplierId: fd.supplierId, operator: fd.operator, remark: fd.remark })
            if (res.code !== 1) { ReggieUI.error(res.msg || '创建失败'); return }
            const orderId = res.data.id || res.data
            const details = fd.details.filter(function(d) { return d.materialId && d.qty })
            await Promise.all(details.map(function(d) {
              return addPurchaseDetail({ orderId: orderId, materialId: d.materialId, qty: Number(d.qty), unitPrice: Number(d.unitPrice) })
            }))
            ReggieUI.success('采购单创建成功！')
            self.formData.dialogVisible = false
            self.handleQuery()
          } catch (err) {
            ReggieUI.error('请求失败：' + (err && err.message ? err.message : err))
          } finally {
            self.submitting = false
          }
        },
        statusType(status) {
          const map = { DRAFT: 'info', ORDERED: 'warning', PARTIAL: 'warning', RECEIVED: 'success', CANCELLED: 'danger' }
          return map[status] || 'info'
        },
        statusLabel(status) {
          const map = { DRAFT: '草稿', ORDERED: '已下单', PARTIAL: '部分收货', RECEIVED: '已收货', CANCELLED: '已取消' }
          return map[status] || '未知状态'
        },
        formatMoney(val) {
          if (val === null || val === undefined) return '0.00'
          return Number(val).toFixed(2)
        },
        // 修改点：分页处理改为 crud-table 事件驱动（与库存流水页一致）
        onPageChange(payload) { this.page = payload.page; this.pageSize = payload.pageSize; this.init() },
        onSizeChange(val) { this.pageSize = val; this.page = 1; this.init() }
      }
    })
  </script>
</body>
</html>
