<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购入库 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    /* ========== 采购管理专用样式 ========== */
    .purchase-chart { background: #fff; border-radius: 14px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; height: 340px; }
    .detail-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    @media (max-width: 1200px) {
      .stats-cards { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="purchase-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="cardFilter" @card-click="onCardClick"></stat-cards>

      <!-- 采购趋势图 -->
      <div class="purchase-chart" id="purchaseTrendChart"></div>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.supplierId" placeholder="供应商" class="el-select--narrow" clearable @change="handleQuery">
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
          <el-select v-model="input.status" placeholder="状态" class="el-select--narrow-sm" clearable @change="handleQuery">
            <el-option label="草稿" value="DRAFT"></el-option>
            <el-option label="已下单" value="ORDERED"></el-option>
            <el-option label="部分收货" value="PARTIAL"></el-option>
            <el-option label="已收货" value="RECEIVED"></el-option>
            <el-option label="已取消" value="CANCELLED"></el-option>
          </el-select>
        </template>
      </table-bar>

      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox" row-key="id" @expand-change="loadDetails">
        <el-table-column type="expand">
          <template slot-scope="props">
            <el-table :data="props.row.details" stripe class="tableBox" v-if="props.row.details && props.row.details.length">
              <el-table-column prop="materialName" label="食材名称" />
              <el-table-column prop="qty" label="数量" />
              <el-table-column label="单价">
                <template slot-scope="scope">￥{{ scope.row.unitPrice }}</template>
              </el-table-column>
              <el-table-column label="已收货">
                <template slot-scope="scope">{{ scope.row.receivedQty || 0 }}</template>
              </el-table-column>
              <el-table-column label="小计">
                <template slot-scope="scope">￥{{ scope.row.amount }}</template>
              </el-table-column>
            </el-table>
            <div v-else style="text-align:center;padding:16px;color:#c0c4cc;">暂无明细数据</div>
          </template>
        </el-table-column>
        <el-table-column prop="orderNo" label="采购单号" width="160" />
        <el-table-column label="供应商">
          <template slot-scope="scope">{{ scope.row.supplierName }}</template>
        </el-table-column>
        <el-table-column label="总金额">
          <template slot-scope="scope">￥{{ (scope.row.totalAmount || 0).toString() }}</template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template slot-scope="scope">
            <el-tag :type="statusType(scope.row.status)" size="small">{{ statusLabel(scope.row.status) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="operator" label="操作员" width="100" />
        <el-table-column prop="createdTime" label="创建时间" width="160" />
        <el-table-column label="操作" width="220" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-view" @click="approveHandle(scope.row)" v-if="scope.row.status === 'DRAFT'">审核</el-button>
            <el-button type="text" size="small" class="btn-view" @click="receiveHandle(scope.row)" v-if="scope.row.status === 'ORDERED' || scope.row.status === 'PARTIAL'">收货</el-button>
            <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(scope.row)" v-if="scope.row.status === 'DRAFT' || scope.row.status === 'ORDERED'">取消</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination class="pageList" :page-sizes="[10,20,30,40]" :page-size="pageSize" layout="total, sizes, prev, pager, next, jumper" :total="counts" :current-page.sync="page" @size-change="handleSizeChange" @current-change="handleCurrentChange"></el-pagination>
    </div>

    <!-- 新增采购单对话框 -->
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="680px" :before-close="handleClose">
      <el-form class="demo-form-inline" label-width="100px">
        <el-form-item label="供应商：">
          <el-select v-model="formData.supplierId" placeholder="请选择" style="width:100%">
            <el-option v-for="item in supplierOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="操作员：">
          <el-input v-model="formData.operator" placeholder="请输入操作员姓名" style="width:220px" />
        </el-form-item>
        <el-form-item label="备注：">
          <el-input v-model="formData.remark" placeholder="采购备注（可选）" />
        </el-form-item>
        <el-form-item label="采购明细：">
          <div v-for="(item, index) in formData.details" :key="index" class="detail-row">
            <el-select v-model="item.materialId" placeholder="食材" style="width:160px" filterable>
              <el-option v-for="m in materialOptions" :key="m.id" :label="m.name" :value="m.id"></el-option>
            </el-select>
            <el-input v-model="item.qty" placeholder="数量" type="number" style="width:100px" />
            <el-input v-model="item.unitPrice" placeholder="单价" type="number" style="width:100px" />
            <el-button type="danger" size="mini" @click="removeDetail(index)">删除</el-button>
          </div>
          <el-button type="primary" size="mini" @click="addDetail">+ 添加明细</el-button>
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#purchase-app',
      data() {
        return {
          loading: false, counts: 0, page: 1, pageSize: 10, tableData: [],
          // 修改点：分离卡片筛选和下拉筛选，避免冲突
          cardFilter: '',
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增采购单', type: 'primary' }
          ],
          input: { supplierId: '', status: '' },
          supplierOptions: [], materialOptions: [],
          trendChart: null,
          formData: {
            title: '新增采购单', dialogVisible: false,
            supplierId: '', operator: '', remark: '',
            details: [{ materialId: '', qty: '', unitPrice: '' }]
          }
        }
      },
      created() { this.init() },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          var s = self.stats || {};
          return [
            { key: '', icon: '📦', label: '采购单总数', value: s.totalOrders || 0, color: 'primary', clickable: true, active: self.cardFilter === '' },
            { key: 'DRAFT', icon: '📝', label: '待审核', value: s.pendingApprove || 0, color: 'warning', clickable: true, active: self.cardFilter === 'DRAFT' },
            { key: 'ORDERED', icon: '🚚', label: '待收货', value: s.pendingReceive || 0, color: 'info', clickable: true, active: self.cardFilter === 'ORDERED' },
            { key: 'monthAmount', icon: '💵', label: '本月采购金额', value: '¥' + self.formatMoney(s.monthAmount), color: 'success' }
          ]
        }
      },
      mounted() { window.addEventListener('resize', () => { if (this.trendChart) this.trendChart.resize() }) },
      beforeDestroy() { if (this.trendChart) this.trendChart.dispose() },
      methods: {
        // 修改点：<stat-cards> 组件统一卡片点击分发
        onCardClick: function(payload) {
          this.cardFilter = this.cardFilter === payload.key ? '' : payload.key;
          this.page = 1;
          this.init();
        },
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        async init() {
          this.loadSupplierOptions()
          // 加载统计
          try {
            const statsRes = await inventoryStatsOverview()
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = {
                totalOrders: statsRes.data.monthPOCount || 0,
                pendingApprove: (statsRes.data.monthPOCount || 0),
                pendingReceive: statsRes.data.pendingReceiveCount || 0,
                monthAmount: statsRes.data.monthPOAmount || 0
              }
              // 获取待审核数量
              try {
                const draftRes = await purchasePage({ page: 1, pageSize: 1, status: 'DRAFT' })
                if (draftRes && String(draftRes.code) === '1') this.stats.pendingApprove = Number(draftRes.data.total) || 0
              } catch (e) {}
            }
          } catch (e) { console.warn('获取统计失败:', e) }

          // 加载列表
          const params = { page: this.page, pageSize: this.pageSize }
          params.status = this.cardFilter || this.input.status || undefined
          if (this.input.supplierId) params.supplierId = this.input.supplierId
          try {
            const res = await purchasePage(params)
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = Number(res.data.total) || 0
              // 无筛选条件时用总数作为采购单总数
              if (!this.cardFilter && !this.input.status) {
                this.stats.totalOrders = this.counts
              }
            }
          } catch (err) { this.$message.error('请求失败：' + (err.message || err)) }

          // 加载趋势图
          this.$nextTick(() => this.renderTrendChart())
        },
        async renderTrendChart() {
          if (typeof echarts === 'undefined') return
          const dom = document.getElementById('purchaseTrendChart')
          if (!dom) return
          if (!this.trendChart) this.trendChart = echarts.init(dom)
          try {
            const res = await inventoryPurchaseTrend()
            let dates = [], amounts = [], counts = []
            if (res && String(res.code) === '1' && res.data) {
              res.data.forEach(d => {
                dates.push(d.date); amounts.push(Number(d.amount) || 0); counts.push(d.count || 0)
              })
            }
            if (dates.length === 0) { dates = ['暂无']; amounts = [0]; counts = [0] }
            this.trendChart.setOption({
              color: ['#409eff', '#67c23a'],
              tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
              legend: { data: ['采购金额', '采购单数'], bottom: 0 },
              grid: { left: 60, right: 60, top: 30, bottom: 40 },
              xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 11 } },
              yAxis: [
                { type: 'value', name: '金额(元)', axisLabel: { formatter: '¥{value}' }, splitLine: { lineStyle: { type: 'dashed' } } },
                { type: 'value', name: '单数' }
              ],
              series: [
                { name: '采购金额', type: 'bar', data: amounts, barWidth: 14, itemStyle: { borderRadius: [6,6,0,0], color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#6c9df8'},{offset:1,color:'#409eff'}]) } },
                { name: '采购单数', type: 'line', yAxisIndex: 1, data: counts, smooth: true, lineStyle: { width: 2, color: '#67c23a' }, symbol: 'circle', symbolSize: 6 }
              ]
            })
          } catch (e) { console.warn('趋势图加载失败:', e) }
        },
        filterByStatus(status) {
          this.cardFilter = this.cardFilter === status ? '' : status
          this.page = 1; this.init()
        },
        loadSupplierOptions() { supplierList().then(res => { if (res.code === 1) this.supplierOptions = res.data }) },
        loadMaterialOptions() { materialList().then(res => { if (res.code === 1) this.materialOptions = res.data }) },
        loadDetails(row) {
          if (!row.id || row.details) return
          purchaseDetailList(row.id).then(res => {
            if (res.code === 1) this.$set(row, 'details', res.data || [])
          }).catch(err => { this.$message.error('请求失败：' + err) })
        },
        handleQuery() { this.page = 1; this.init() },
        reset() { this.input.supplierId = ''; this.input.status = ''; this.cardFilter = ''; this.page = 1; this.init() },
        addHandle() {
          this.formData = {
            title: '新增采购单', dialogVisible: true,
            supplierId: '', operator: '', remark: '',
            details: [{ materialId: '', qty: '', unitPrice: '' }]
          }
          this.loadSupplierOptions(); this.loadMaterialOptions()
        },
        handleClose() { this.formData.dialogVisible = false },
        addDetail() { this.formData.details.push({ materialId: '', qty: '', unitPrice: '' }) },
        removeDetail(index) { this.formData.details.splice(index, 1) },
        // 修改点：审核采购单
        approveHandle(row) {
          this.$confirm('确认审核通过该采购单? 审核后将进入待收货状态。', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'info'
          }).then(() => {
            approvePurchase(row.id).then(res => {
              if (res.code === 1) { this.$message.success('审核通过！'); this.handleQuery() }
              else this.$message.error(res.msg || '操作失败')
            }).catch(err => { this.$message.error('请求失败：' + err) })
          }).catch(() => {})
        },
        receiveHandle(row) {
          this.$confirm('确认收货该采购单? 收货后将自动入库增加库存。', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(() => {
            receivePurchase(row.id).then(res => {
              if (res.code === 1) { this.$message.success('收货成功！库存已更新'); this.handleQuery() }
              else this.$message.error(res.msg || '操作失败')
            }).catch(err => { this.$message.error('请求失败：' + err) })
          }).catch(() => {})
        },
        cancelHandle(row) {
          this.$confirm('确认取消该采购单?', '提示', {
            confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
          }).then(() => {
            cancelPurchase(row.id).then(res => {
              if (res.code === 1) { this.$message.success('取消成功！'); this.handleQuery() }
              else this.$message.error(res.msg || '操作失败')
            }).catch(err => { this.$message.error('请求失败：' + err) })
          }).catch(() => {})
        },
        submitForm() {
          const fd = this.formData
          if (!fd.supplierId) { this.$message.error('请选择供应商'); return }
          if (!fd.operator) { this.$message.error('请输入操作员'); return }
          if (!fd.details.length || !fd.details[0].materialId) { this.$message.error('请添加至少一条采购明细'); return }
          // 创建采购单
          addPurchase({ supplierId: fd.supplierId, operator: fd.operator, remark: fd.remark }).then(res => {
            if (res.code === 1) {
              const orderId = res.data.id || res.data
              const detailPromises = fd.details.filter(d => d.materialId && d.qty).map(d =>
                addPurchaseDetail({ orderId: orderId, materialId: d.materialId, qty: Number(d.qty), unitPrice: Number(d.unitPrice) })
              )
              Promise.all(detailPromises).then(() => {
                this.$message.success('采购单创建成功！')
                this.formData.dialogVisible = false
                this.handleQuery()
              }).catch(err => { this.$message.error('添加明细出错：' + err) })
            } else this.$message.error(res.msg || '创建失败')
          }).catch(err => { this.$message.error('请求失败：' + err) })
        },
        statusType(status) {
          const map = { DRAFT: 'info', ORDERED: 'warning', PARTIAL: '', RECEIVED: 'success', CANCELLED: 'danger' }
          return map[status] || 'info'
        },
        statusLabel(status) {
          const map = { DRAFT: '草稿', ORDERED: '已下单', PARTIAL: '部分收货', RECEIVED: '已收货', CANCELLED: '已取消' }
          return map[status] || status
        },
        formatMoney(val) {
          if (val === null || val === undefined) return '0.00'
          return Number(val).toFixed(2)
        },
        handleSizeChange(val) { this.pageSize = val; this.init() },
        handleCurrentChange(val) { this.page = val; this.init() }
      }
    })
  </script>
</body>
</html>
