<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搴撳瓨棰勮 - 鐟炲悏澶栧崠绠＄悊绔?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    .warn-container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-5) }

    /* 绛涢€夋爮 */
    .filter-bar { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap }
    .filter-bar__label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .filter-bar__col { display: flex; flex-direction: column; gap: 4px }
    .filter-bar__input { height: 36px }
    .filter-bar__btn { height: 36px; font-size: var(--font-size-base) }

    /* 缁熻鍗＄墖琛?*/
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-6) }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 520px) { .stats-grid { grid-template-columns: 1fr } }
    .stat-card { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: var(--space-4) }
    .stat-card__icon { font-size: var(--font-size-3xl); line-height: 1 }
    .stat-card__body { flex: 1 }
    .stat-card__label { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 4px }
    .stat-card__value { font-size: var(--font-size-3xl); font-weight: 600; color: var(--text-primary); line-height: 1.2 }
    .stat-card__sub { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 2px }
    .stat-card.danger .stat-card__value { color: var(--color-danger) }
    .stat-card.warning .stat-card__value { color: var(--color-warning) }
    .stat-card.success .stat-card__value { color: var(--color-success) }
    .stat-card.brand .stat-card__value { color: var(--color-brand-500) }

    /* 鎵归噺琛ヨ揣鎸夐挳琛?*/
    .batch-bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap }
    .batch-bar__tip { font-size: var(--font-size-xs); color: var(--text-muted) }

    /* 闃堝€兼瘮渚嬭繘搴︽潯 */
    .ratio-cell { display: flex; align-items: center; gap: 8px; width: 160px }
    .ratio-bar { flex: 1; height: 6px; background: var(--border-default); border-radius: var(--radius-sm); overflow: hidden }
    .ratio-bar__fill { height: 100%; border-radius: var(--radius-sm); transition: width 0.3s }
    .ratio-text { font-size: var(--font-size-xs); font-weight: 500; min-width: 42px; text-align: right; font-variant-numeric: tabular-nums }

    /* 琛ヨ揣寤鸿寮圭獥鏄庣粏琛?*/
    .suggest-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-default); gap: 12px }
    .suggest-item:last-child { border-bottom: none }
    .suggest-item__name { width: 100px; font-weight: 500; color: var(--text-primary); font-size: var(--font-size-base) }
    .suggest-item__label { font-size: var(--font-size-xs); color: var(--text-muted); width: 70px }
    .suggest-item__value { font-size: var(--font-size-base); color: var(--text-primary); width: 60px; text-align: right; font-variant-numeric: tabular-nums }
    .suggest-item__qty { width: 90px }

    /* 绌烘€?*/
    .empty-state { text-align: center; padding: 60px var(--space-4); color: var(--text-muted); font-size: var(--font-size-base) }
    .empty-state__icon { font-size: var(--font-size-4xl); line-height: 1; margin-bottom: var(--space-4) }
    .empty-state__desc { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-2) }

    /* 涓ラ噸搴︽爣绛炬牱寮忓井璋?*/
    .severity-tag { font-weight: 500 }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>
  <div class="dashboard-container" id="warn-app">
    <div class="container warn-container" id="main-content" role="main" aria-label="搴撳瓨棰勮鐪嬫澘">
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">搴撳瓨棰勮</h1>
          <p class="ds-page-header__subtitle">浣庡簱瀛橀鏉愰璀︺€佽ˉ璐у缓璁笌涓€閿ˉ璐?/p>
        </div>
      </header>

      <!-- 绛涢€夋爮 -->
      <div class="filter-bar">
        <div class="filter-bar__col">
          <span class="filter-bar__label">椋熸潗鍒嗙被锛?/span>
          <el-select v-model="categoryId" class="filter-bar__input" style="width:200px" filterable clearable @change="onFilterChange" aria-label="椋熸潗鍒嗙被" placeholder="鍏ㄩ儴鍒嗙被">
            <el-option v-for="c in categoryOptions" :key="c.value" :label="c.label" :value="c.value"></el-option>
          </el-select>
        </div>
        <div class="filter-bar__col">
          <span class="filter-bar__label">涓ラ噸搴︼細</span>
          <el-select v-model="severity" class="filter-bar__input" style="width:160px" clearable @change="onFilterChange" aria-label="涓ラ噸搴? placeholder="鍏ㄩ儴涓ラ噸搴?>
            <el-option :value="'CRITICAL'" label="涓ラ噸"></el-option>
            <el-option :value="'WARNING'" label="璀﹀憡"></el-option>
            <el-option :value="'LOW'" label="浣庡嵄"></el-option>
          </el-select>
        </div>
        <div class="filter-bar__col">
          <span class="filter-bar__label">缁熻澶╂暟锛?/span>
          <el-select v-model="suggestDays" class="filter-bar__input" style="width:120px" @change="loadSuggest" aria-label="缁熻澶╂暟">
            <el-option :value="7" label="7澶?></el-option>
            <el-option :value="30" label="30澶?></el-option>
            <el-option :value="60" label="60澶?></el-option>
          </el-select>
        </div>
        <el-button type="primary" size="small" @click="onFilterChange" class="filter-bar__btn">鏌ヨ</el-button>
        <el-button size="small" @click="refreshAll">鍒锋柊鍏ㄩ儴</el-button>
      </div>

      <!-- 缁熻鍗＄墖 -->
      <div class="stats-grid" v-loading="statsLoading">
        <div class="stat-card danger">
          <div class="stat-card__icon">馃毃</div>
          <div class="stat-card__body">
            <div class="stat-card__label">涓ラ噸锛?lt;30%闃堝€硷級</div>
            <div class="stat-card__value">{{ statsData.bySeverity ? statsData.bySeverity.CRITICAL : 0 }}</div>
            <div class="stat-card__sub">鎬ラ渶琛ヨ揣</div>
          </div>
        </div>
        <div class="stat-card warning">
          <div class="stat-card__icon">鈿狅笍</div>
          <div class="stat-card__body">
            <div class="stat-card__label">璀﹀憡锛?0-80%锛?/div>
            <div class="stat-card__value">{{ statsData.bySeverity ? statsData.bySeverity.WARNING : 0 }}</div>
            <div class="stat-card__sub">寤鸿鍏虫敞</div>
          </div>
        </div>
        <div class="stat-card success">
          <div class="stat-card__icon">馃挕</div>
          <div class="stat-card__body">
            <div class="stat-card__label">浣庡嵄锛?0-100%锛?/div>
            <div class="stat-card__value">{{ statsData.bySeverity ? statsData.bySeverity.LOW : 0 }}</div>
            <div class="stat-card__sub">鎺ヨ繎闃堝€?/div>
          </div>
        </div>
        <div class="stat-card brand">
          <div class="stat-card__icon">馃摝</div>
          <div class="stat-card__body">
            <div class="stat-card__label">棰勮椋熸潗鎬绘暟</div>
            <div class="stat-card__value">{{ statsData.totalCount || 0 }}</div>
            <div class="stat-card__sub">娑夊強鍒嗙被 {{ statsData.byCategory ? statsData.byCategory.length : 0 }} 涓?/div>
          </div>
        </div>
      </div>

      <!-- 鎵归噺琛ヨ揣鎸夐挳 -->
      <div class="batch-bar" v-if="counts > 0">
        <el-button
          type="primary"
          size="small"
          :disabled="selectedRows.length === 0"
          @click="openRestockDialog"
        >鎵归噺琛ヨ揣</el-button>
        <el-button type="info" size="small" @click="openSuggestDialog">鏌ョ湅琛ヨ揣寤鸿</el-button>
        <span class="batch-bar__tip" v-if="selectedRows.length > 0">宸查€?{{ selectedRows.length }} 鏉★紝鍙竴閿敓鎴愰噰璐崟骞惰嚜鍔ㄥ叆搴?/span>
        <span class="batch-bar__tip" v-else>鍕鹃€夐璀﹂鏉愶紝鍙壒閲忚ˉ璐?/span>
      </div>

      <!-- 鏄庣粏琛ㄦ牸 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="tableLoading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :selection="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        @selection-change="onSelectionChange"
      >
        <template #col-severity="{ row }">
          <el-tag :type="row.severity === 'CRITICAL' ? 'danger' : row.severity === 'WARNING' ? 'warning' : 'success'" size="small" class="severity-tag">
            {{ row.severity === 'CRITICAL' ? '涓ラ噸' : row.severity === 'WARNING' ? '璀﹀憡' : '浣庡嵄' }}
          </el-tag>
        </template>
        <template #col-warningRatio="{ row }">
          <div class="ratio-cell">
            <div class="ratio-bar">
              <div class="ratio-bar__fill" :style="{ width: (row.warningRatio || 0) + '%', background: severityColor(row.severity) }"></div>
            </div>
            <span class="ratio-text" :style="{ color: severityColor(row.severity) }">
              {{ row.warningRatio | toPercent }}
            </span>
          </div>
        </template>
        <template #col-stockQty="{ row }">
          <span style="font-weight:500; font-variant-numeric:tabular-nums">{{ row.stockQty }} <span style="font-size: var(--font-size-xs);color:var(--text-muted)">{{ row.unit }}</span></span>
        </template>
        <template #col-minStock="{ row }">
          <span style="font-variant-numeric:tabular-nums;color:var(--text-muted)">{{ row.minStock }} {{ row.unit }}</span>
        </template>
        <template #col-unitPrice="{ row }">
          <span style="font-variant-numeric:tabular-nums">楼{{ row.unitPrice | toDecimal }}</span>
        </template>
      </crud-table>

      <div v-if="counts === 0 && !tableLoading" class="empty-state">
        <div class="empty-state__icon">鉁?/div>
        <div>鏆傛棤搴撳瓨棰勮椋熸潗</div>
        <div class="empty-state__desc">鎵€鏈夐鏉愬簱瀛樺厖瓒筹紝鏃犻渶琛ヨ揣</div>
      </div>
    </div>

    <!-- 鎵归噺琛ヨ揣寮圭獥 -->
    <crud-dialog
      :title="restockForm.title"
      :visible.sync="restockForm.dialogVisible"
      :submit-loading="restockLoading"
      width="560px"
      @submit="submitRestock"
      @close="handleRestockClose"
    >
      <el-form :model="restockForm" :rules="restockRules" ref="restockFormRef" label-width="90px">
        <el-form-item label="宸查€夐鏉?>
          <el-input-number v-model="restockForm.selectedCount" :min="0" :max="9999" disabled></el-input-number>
          <span style="margin-left:8px; font-size: var(--font-size-xs); color:var(--text-muted)">鏉￠璀﹂鏉?/span>
        </el-form-item>
        <el-divider></el-divider>
        <div style="margin-bottom:12px">
          <div style="font-size: var(--font-size-xs);color:var(--text-muted);margin-bottom:8px">琛ヨ揣鏁伴噺锛堢郴缁熷凡鎸夊缓璁～鍏咃紝鍙墜鍔ㄨ皟鏁达級锛?/div>
          <div v-for="(item, idx) in restockForm.items" :key="item.materialId" class="suggest-item">
            <span class="suggest-item__name">{{ item.materialName || ('椋熸潗'+idx) }}</span>
            <span class="suggest-item__label">寤鸿:</span>
            <span class="suggest-item__value" style="color:var(--text-muted)">{{ item.suggestQty || 0 }}</span>
            <span class="suggest-item__label">琛ヨ揣:</span>
            <el-input-number
              v-model="item.qty"
              :min="1"
              :max="99999"
              :precision="2"
              class="suggest-item__qty"
              @change="onRestockQtyChange(idx)"
            ></el-input-number>
            <span style="font-size: var(--font-size-xs);color:var(--text-muted);margin-left:4px">{{ item.unit || '' }}</span>
          </div>
        </div>
        <el-form-item label="澶囨敞">
          <el-input v-model="restockForm.remark" type="textarea" :rows="2" placeholder="琛ヨ揣澶囨敞锛堝彲閫夛級"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 琛ヨ揣寤鸿寮圭獥 -->
    <crud-dialog
      title="琛ヨ揣寤鸿"
      :visible.sync="suggestDialogVisible"
      width="600px"
      :show-submit="false"
      submit-text="鍏?闂?
    >
      <div style="margin-bottom:var(--space-3); padding:var(--space-2) var(--space-3); background:var(--el-bg-ghost); border-radius:var(--radius-sm); font-size:var(--font-size-xs); color:var(--text-muted); line-height:1.6">
        鍩轰簬杩?<strong style="color:var(--text-primary)">{{ suggestDays }}</strong> 澶╁嚭搴撻噺璁＄畻鏃ュ潎娑堣€楋紝琛ヨ揣鍛ㄦ湡榛樿 14 澶┿€?br>
        寤鸿閲囪喘閲?= 鏃ュ潎娑堣€?脳 14 + 鏈€浣庡簱瀛?- 褰撳墠搴撳瓨
      </div>
      <div v-loading="suggestLoading" style="max-height:56vh; overflow-y:auto">
        <div v-for="(item, idx) in suggestList" :key="idx" class="suggest-item">
          <span class="suggest-item__name">{{ item.materialName }}</span>
          <span class="suggest-item__label">鏃ュ潎娑堣€?</span>
          <span class="suggest-item__value" style="color:var(--text-muted)">{{ (item.dailyUsage || 0).toFixed(2) }}</span>
          <span class="suggest-item__label">搴撳瓨:</span>
          <span class="suggest-item__value" style="color:var(--text-muted)">{{ item.stockQty }}</span>
          <span class="suggest-item__label">鏈€浣?</span>
          <span class="suggest-item__value" style="color:var(--text-muted)">{{ item.minStock }}</span>
          <span class="suggest-item__label" style="font-weight:500;color:var(--text-primary)">寤鸿:</span>
          <span class="suggest-item__value" :style="{ color: item.suggestQty > 0 ? 'var(--color-danger)' : 'var(--color-success)', fontWeight: 600 }">{{ (item.suggestQty || 0).toFixed(2) }} {{ item.unit || '' }}</span>
        </div>
        <div v-if="suggestList.length === 0 && !suggestLoading" style="text-align:center;padding:30px;color:var(--text-muted);font-size:var(--font-size-base)">
          鏆傛棤棰勮椋熸潗锛屾棤闇€琛ヨ揣寤鸿
        </div>
      </div>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/inventory.js"></script>
  <script>
    new Vue({
      el: '#warn-app',
      data() {
        return {
          // 绛涢€?          categoryId: null,
          severity: null,
          suggestDays: 30,
          categoryOptions: [],
          // 缁熻
          statsLoading: false,
          statsData: {
            totalCount: 0,
            bySeverity: { CRITICAL: 0, WARNING: 0, LOW: 0 },
            byCategory: []
          },
          // 琛ㄦ牸
          tableLoading: false,
          page: 1,
          pageSize: 10,
          counts: 0,
          tableData: [],
          selectedRows: [],
          columns: [
            { prop: 'name', label: '椋熸潗鍚嶇О', width: 130 },
            { prop: 'categoryName', label: '鍒嗙被', width: 110 },
            { prop: 'supplierName', label: '渚涘簲鍟?, width: 120 },
            { prop: 'severity', label: '涓ラ噸搴?, slot: true, width: 90, align: 'center' },
            { prop: 'warningRatio', label: '闃堝€兼瘮渚?, slot: true, width: 170 },
            { prop: 'stockQty', label: '褰撳墠搴撳瓨', slot: true, width: 90, align: 'right' },
            { prop: 'minStock', label: '鏈€浣庡簱瀛?, slot: true, width: 90, align: 'right' },
            { prop: 'unitPrice', label: '鍗曚环', slot: true, width: 90, align: 'right' }
          ],
          // 琛ヨ揣寮圭獥
          restockLoading: false,
          restockForm: {
            title: '鎵归噺琛ヨ揣',
            dialogVisible: false,
            selectedCount: 0,
            items: [],
            remark: ''
          },
          restockRules: {},
          // 寤鸿寮圭獥
          suggestLoading: false,
          suggestDialogVisible: false,
          suggestList: []
        }
      },
      created() {
        this.loadCategories()
        this.loadStats()
        this.loadTable()
        this.loadSuggest()
      },
      filters: {
        toPercent(val) {
          if (val == null) return '0%'
          return Number(val).toFixed(1) + '%'
        },
        toDecimal(val) {
          if (val == null) return '0.00'
          return Number(val).toFixed(2)
        }
      },
      methods: {
        severityColor(severity) {
          if (severity === 'CRITICAL') return 'var(--color-danger)'
          if (severity === 'WARNING') return 'var(--color-warning)'
          return 'var(--color-success)'
        },
        onFilterChange() {
          this.page = 1
          this.tableData = []
          this.counts = 0
          this.selectedRows = []
          this.loadTable()
        },
        refreshAll() {
          this.loadCategories()
          this.loadStats()
          this.loadTable()
          this.loadSuggest()
        },
        onPageChange(payload) {
          this.page = payload.page
          this.loadTable()
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.loadTable()
        },
        onSelectionChange(payload) {
          this.selectedRows = (payload && payload.rows) || payload || []
        },
        async loadCategories() {
          try {
            const res = await matCategoryList()
            if (String(res.code) === '1') {
              const records = res.data || (res.data && res.data.records) || []
              if (res.data && res.data.records) records = res.data.records
              this.categoryOptions = records.map(function(c) {
                return { value: c.id, label: c.name }
              })
            }
          } catch (e) {
            console.warn('鍔犺浇鍒嗙被鍒楄〃澶辫触:', e)
          }
        },
        async loadStats() {
          this.statsLoading = true
          try {
            const res = await materialWarningStats()
            if (String(res.code) === '1' && res.data) {
              const d = res.data
              var bySev = d.bySeverity || {}
              this.statsData = {
                totalCount: d.totalCount || 0,
                bySeverity: {
                  CRITICAL: bySev.CRITICAL || 0,
                  WARNING: bySev.WARNING || 0,
                  LOW: bySev.LOW || 0
                },
                byCategory: d.byCategory || []
              }
            }
          } catch (e) {
            console.warn('鍔犺浇棰勮缁熻澶辫触:', e)
          } finally {
            this.statsLoading = false
          }
        },
        async loadTable() {
          this.tableLoading = true
          try {
            const params = {$2}
            if (this.categoryId) params.categoryId = this.categoryId
            if (this.severity) params.severity = this.severity
            const res = await materialWarningPage(params)
            if (String(res.code) === '1') {
              var data = res.data || {}
              this.tableData = data.records || []
              this.counts = data.total || 0
            } else {
              this.tableData = []
              this.counts = 0
              this.$message.error(res.msg || '鍔犺浇澶辫触')
            }
          } catch (e) {
            console.warn('鍔犺浇棰勮鏄庣粏澶辫触:', e)
            this.tableData = []
            this.counts = 0
          } finally {
            this.tableLoading = false
          }
        },
        async loadSuggest() {
          this.suggestLoading = true
          try {
            const res = await materialReplenishSuggest({$3})
            if (String(res.code) === '1') {
              this.suggestList = res.data || []
            } else {
              this.suggestList = []
            }
          } catch (e) {
            console.warn('鍔犺浇琛ヨ揣寤鸿澶辫触:', e)
            this.suggestList = []
          } finally {
            this.suggestLoading = false
          }
        },
        openSuggestDialog() {
          this.suggestDialogVisible = true
        },
        openRestockDialog() {
          if (this.selectedRows.length === 0) {
            this.$message.warning('鏈嬀閫変换浣曢鏉?)
            return
          }
          // 鍖归厤琛ヨ揣寤鸿锛屽～鍏呭缓璁噰璐噺
          const self = this
          const items = []
          for (let i = 0; i < this.selectedRows.length; i++) {
            const row = this.selectedRows[i]
            const suggestItem = this.findSuggestItem(row.id)
            const qty = suggestItem && Number(suggestItem.suggestQty) > 0
              ? Number(suggestItem.suggestQty)
              : Number((Number(row.minStock) - Number(row.stockQty)).toFixed(2))
            if (Number(qty) < 1) qty = 1
            items.push({
              materialId: row.id,
              materialName: row.name,
              unit: row.unit,
              suggestQty: suggestItem ? (Number(suggestItem.suggestQty) || 0).toFixed(2) : '0.00',
              qty: qty
            })
          }
          this.restockForm.items = items
          this.restockForm.selectedCount = this.selectedRows.length
          this.restockForm.remark = ''
          this.restockForm.dialogVisible = true
        },
        findSuggestItem(materialId) {
          for (let i = 0; i < this.suggestList.length; i++) {
            if (this.suggestList[i].materialId === materialId) {
              return this.suggestList[i]
            }
          }
          return null
        },
        onRestockQtyChange(idx) {
          const item = this.restockForm.items[idx]
          if (item && item.qty != null && Number(item.qty) < 1) {
            item.qty = '1.00'
          }
        },
        async submitRestock() {
          if (this.restockForm.items.length === 0) {
            this.$message.warning('鏃犺ˉ璐ф槑缁?)
            return
          }
          const self = this
          const items = []
          for (let i = 0; i < this.restockForm.items.length; i++) {
            const it = this.restockForm.items[i]
            items.push({
              materialId: it.materialId,
              qty: String(it.qty)
            })
          }
          this.restockLoading = true
          try {
            var res = await materialBatchRestock({
              materialIds: this.selectedRows.map(function(r) { return r.id }),
              items: items,
              remark: this.restockForm.remark
            })
            if (String(res.code) === '1') {
              this.$message.success('琛ヨ揣鎴愬姛锛氬凡鐢熸垚閲囪喘鍗曞苟鑷姩鍏ュ簱锛岄噰璐崟ID=' + res.data)
              this.restockForm.dialogVisible = false
              this.selectedRows = []
              this.loadTable()
              this.loadStats()
              this.loadSuggest()
            } else {
              this.$message.error(res.msg || '琛ヨ揣澶辫触')
            }
          } catch (e) {
            console.warn('鎵归噺琛ヨ揣澶辫触:', e)
            this.$message.error('鎿嶄綔澶辫触锛岃閲嶈瘯')
          } finally {
            this.restockLoading = false
          }
        },
        handleRestockClose() {
          this.restockForm.items = []
          this.restockForm.selectedCount = 0
          this.restockForm.remark = ''
        }
      }
    })
  </script>
</body>
</html>
