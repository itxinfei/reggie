<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜品管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    #food-add-app .uploadImg .el-form-item__label::before{
          content: '*';
          color: #F56C6C;
          margin-right: 4px;
      }

    /* 口味编辑样式 */
    .flavorBox {
      border: 1px solid #ebeef5;
      border-radius: 8px;
      padding: 16px;
      background: #fafbfc;
    }
    .flavor-empty {
      text-align: center;
      padding: 24px;
      color: #c0c4cc;
    }
    .flavor-empty .el-button {
      color: #409eff;
    }
    .flavor-item {
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
      transition: all 0.2s;
    }
    .flavor-item:hover {
      border-color: #c0c4cc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .flavor-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .flavor-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #409eff;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .flavor-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .flavor-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      padding: 8px;
      background: #f5f7fa;
      border-radius: 6px;
    }
    .flavor-presets .el-tag {
      cursor: pointer;
      transition: all 0.2s;
    }
    .flavor-presets .el-tag:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(64, 158, 255, 0.2);
    }
  </style>
</head>
<body>
   <div class="addBrand-container" id="food-add-app">
    <div class="container">
      <el-form
        ref="ruleForm"
        :model="ruleForm"
        :rules="rules"
        :inline="false"
        label-width="180px"
        class="demo-ruleForm"
      >
        <el-form-item
          label="菜品名称:"
          prop="name"
        >
          <el-input
            v-model="ruleForm.name"
            placeholder="请填写菜品名称"
            maxlength="20"
          />
        </el-form-item>
        <el-form-item
          label="菜品分类:"
          prop="categoryId"
        >
          <el-select
            v-model="ruleForm.categoryId"
            placeholder="请选择菜品分类"
          >
            <el-option v-for="(item,index) in dishList" :key="index" :label="item.name" :value="item.id" />
          </el-select>
        </el-form-item>
        <el-form-item
          label="菜品价格:"
          prop="price"
        >
          <el-input
            v-model="ruleForm.price"
            placeholder="请设置菜品价格"
          />
        </el-form-item>
        <el-form-item label="口味做法配置:">
          <div class="flavorBox">
            <div v-if="dishFlavors.length === 0" class="flavor-empty">
              <el-button type="text" icon="el-icon-plus" @click="addFlavore">添加口味配置</el-button>
            </div>
            <div v-else class="flavor-list">
              <div v-for="(item, index) in dishFlavors" :key="index" class="flavor-item">
                <div class="flavor-header">
                  <span class="flavor-index">{{ index + 1 }}</span>
                  <el-input
                    v-model="item.name"
                    size="small"
                    placeholder="口味名称（如：辣度、温度）"
                    maxlength="10"
                    style="width: 160px;"
                    @focus="selectFlavor(true, index)"
                    @blur="outSelect(false, index)"
                  ></el-input>
                  <el-button type="text" size="small" class="btn-delete" @click="delFlavor(index)">删除此口味</el-button>
                </div>
                <!-- 预定义标签快捷选择 -->
                <div class="flavor-presets" v-if="item.showOption && dishFlavorsData.length > 0">
                  <el-tag
                    v-for="(preset, pIdx) in getPresetOptions(index)"
                    :key="pIdx"
                    size="mini"
                    effect="plain"
                    style="cursor: pointer; margin: 2px 4px 2px 0;"
                    @click.native="applyPreset(index, preset)"
                  >{{ preset }}</el-tag>
                </div>
                <div class="flavor-tags">
                  <el-tag
                    v-for="(tag, tIdx) in item.value"
                    :key="tIdx"
                    size="small"
                    closable
                    type="info"
                    @close="delFlavorLabel(index, tIdx)"
                  >{{ tag }}</el-tag>
                  <el-input
                    v-if="item.inputVisible"
                    v-model="item.inputValue"
                    size="mini"
                    :ref="'tagInput' + index"
                    style="width: 90px;"
                    maxlength="10"
                    @keyup.enter.native="handleTagInputConfirm(index)"
                    @blur="handleTagInputConfirm(index)"
                  ></el-input>
                  <el-button v-else size="small" type="text" icon="el-icon-plus" @click="showTagInput(index)">添加标签</el-button>
                </div>
              </div>
              <el-button type="text" icon="el-icon-plus" @click="addFlavore" style="margin-top: 8px;">添加新口味</el-button>
            </div>
          </div>
        </el-form-item>
        <el-form-item
          label="菜品图片:"
          prop="region"
          class="uploadImg"
        >
            <el-upload
              class="avatar-uploader"
              action="/common/upload"
              :show-file-list="false"
              :on-success="handleAvatarSuccess"
              :on-change="onChange"
              ref="upload"
            >
              <img
                v-if="imageUrl"
                :src="imageUrl"
                class="avatar"
              ></img>
              <i
                v-else
                class="el-icon-plus avatar-uploader-icon"
              ></i>
            </el-upload>
          </el-form-item>
        <div class="address">
          <el-form-item
            label="菜品描述:"
            prop="region"
          >
            <el-input
              v-model="ruleForm.description"
              type="textarea"
              :rows="3"
              placeholder="菜品描述，最长200字"
              maxlength="200"
            />
          </el-form-item>
        </div>
        <div class="subBox address">
          <el-form-item>
            <el-button @click="goBack()">
              取消
            </el-button>
            <el-button
              type="primary"
              @click="submitForm('ruleForm')"
            >
              保存
            </el-button>
            <el-button
              v-if="actionType == 'add'"
              type="primary"
              class="continue"
              @click="submitForm('ruleForm','goAnd')"
            >
              保存并继续添加菜品
            </el-button>
          </el-form-item>
        </div>
      </el-form>
    </div>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../js/validate.js"></script>
    <script src="../../js/index.js"></script>
    <script src="../../api/food.js"></script>
    <script>
      new Vue({
        el: '#food-add-app',
        data() {
          return {
            id: '',
            restKey: 0,
            textarea: '',
            value: '',
            imageUrl: '',
            actionType: '',
            dishList: [],
            dishFlavorsData: [],
            dishFlavors: [],
            vueRest : '1',
            index : 0,
            inputStyle  : {'flex':1},
            ruleForm  : {
              'name': '',
              'id': '',
              'price': '',
              'code': '',
              'image': '',
              'description': '',
              'dishFlavors': [],
              'status': true,
              categoryId: ''
            },
            mak: false
          }
        },
        computed: {
          rules () {
            return {
              'name': [
                {'required': true, 'message': '请填写菜品名称', 'trigger': 'blur'}
              ],
              'categoryId': [
                {'required': true, 'message': '请选择菜品分类', 'trigger': 'change'}
              ],
              'price': [
                {
                  'required': true,
                  // 'message': '请填写菜品价格',
                  validator: (rules, value, callback) => {
                    if (!value) {
                      callback(new Error('请填写菜品价格'))
                    } else {
                      const reg = /^\d+(\.\d{0,2})?$/
                      if (reg.test(value)) {
                        if(value < 10000){
                          callback()
                        }else{
                          callback(new Error('菜品价格小于10000'))
                        }
                      } else {
                        callback(new Error('菜品价格格式只能为数字,且最多保留两位小数'))
                      }
                    }
                  },
                  'trigger': 'blur'
                }
              ],
            }
          }
        },
        created() {
          this.getDishList()
          // 口味临时数据
          this.getFlavorListHand()
          this.id = requestUrlParam('id')
          this.actionType = this.id ? 'edit' : 'add'
          if (this.id) {
            this.init()
          }
        },
        mounted() {
        },
        methods: {
          async init () {
            queryDishById(this.id).then(res => {
              if (String(res.code) === '1') {
                this.ruleForm = { ...res.data }
                this.ruleForm.price = String(res.data.price/100)
                this.ruleForm.status = String(res.data.status) === '1'
                // 修改点：安全的 JSON.parse，兼容数据库中 value 为非 JSON 的情况
                this.dishFlavors = res.data.flavors && res.data.flavors.map(obj => {
                  let parsedValue = []
                  if (obj.value) {
                    try {
                      parsedValue = JSON.parse(obj.value)
                    } catch(e) {
                      parsedValue = typeof obj.value === 'string' ? obj.value.split(',').map(s => s.trim()).filter(Boolean) : [obj.value]
                    }
                  }
                  return { ...obj, value: parsedValue, showOption: false, inputVisible: false, inputValue: '' }
                })
                // this.ruleForm.id = res.data.data.categoryId
                // this.imageUrl = res.data.data.image
                this.imageUrl = `/common/download?name=${res.data.image}`
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            })
          },
          // 按钮 - 添加口味
          addFlavore () {
            this.dishFlavors.push({
              'name': '',
              'value': [],
              showOption: false,
              inputVisible: false,
              inputValue: ''
            })
          },

          // 按钮 - 删除口味
          delFlavor (ind) {
            this.dishFlavors.splice(ind, 1)
          },

          // 按钮 - 删除口味标签
          delFlavorLabel (index, ind) {
            this.dishFlavors[index].value.splice(ind, 1)
          },

          // 口味位置记录
          flavorPosition (index) {
            this.index = index
          },

          // 添加口味标签（旧方法，保留兼容）
          keyDownHandle (val, index) {
            const evt = val.originalEvent || event
            if (evt) {
              evt.cancelBubble = true
              evt.preventDefault()
              evt.stopPropagation()
            }
            if (val.target.innerText.trim() !== '') {
              this.dishFlavors[index].value.push(val.target.innerText)
              val.target.innerText = ''
            }
          },

          // 获取菜品分类
          getDishList () {
            getCategoryList({ 'type': 1 }).then(res => {
              if (res.code === 1) {
                this.dishList = res.data
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            })
          },

          // 获取口味列表
          getFlavorListHand () {
            // flavor flavorData
            this.dishFlavorsData = [
              {'name':'甜味','value':['无糖','少糖','半糖','多糖','全糖']},
              {'name':'温度','value':['热饮','常温','去冰','少冰','多冰']},
              {'name':'忌口','value':['不要葱','不要蒜','不要香菜','不要辣']},
              {'name':'辣度','value':['不辣','微辣','中辣','重辣']}
            ]
          },

          selectFlavor(st,index){
            const obj = JSON.parse(JSON.stringify(this.dishFlavors[index]))
            obj.showOption = st
            this.dishFlavors.splice(index,1,obj)
            // this.dishFlavors[index].showOption = st
          },

          outSelect(st,index){
            const _this = this
            setTimeout(()=> {
              const obj = JSON.parse(JSON.stringify(_this.dishFlavors[index]))
              obj.showOption = st
              _this.dishFlavors.splice(index,1,obj)
            }, 200)
          },

          inputHandle(val,index){
            // this.selectFlavor(false,index)
          },

          checkOption(val, ind, index){
            this.selectHandle(val.name, index, ind)
            this.dishFlavors[index].name = val.name
          },

          selectHandle(val, key, ind){
            const arrDate = [...this.dishFlavors]
            arrDate[key] = JSON.parse(JSON.stringify(this.dishFlavorsData[ind]))
            this.dishFlavors = arrDate
          },

          // 显示标签输入框
          showTagInput(index) {
            this.dishFlavors[index].inputVisible = true
            this.$nextTick(() => {
              const ref = this.$refs['tagInput' + index]
              if (ref && ref[0]) ref[0].$refs.input.focus()
            })
          },

          // 确认添加标签
          handleTagInputConfirm(index) {
            const inputValue = this.dishFlavors[index].inputValue
            if (inputValue && inputValue.trim()) {
              const trimmed = inputValue.trim()
              // 避免重复
              if (!this.dishFlavors[index].value.includes(trimmed)) {
                this.dishFlavors[index].value.push(trimmed)
              }
            }
            this.dishFlavors[index].inputVisible = false
            this.dishFlavors[index].inputValue = ''
          },

          // 获取预设标签选项（匹配当前口味名）
          getPresetOptions(index) {
            const flavorName = (this.dishFlavors[index].name || '').toLowerCase()
            const matched = this.dishFlavorsData.filter(f => {
              const name = (f.name || '').toLowerCase()
              return name.includes(flavorName) || flavorName.includes(name) || flavorName === ''
            })
            // 返回所有预设的 value 选项（扁平化）
            const allValues = []
            const used = new Set(this.dishFlavors[index].value)
            matched.forEach(f => {
              f.value.forEach(v => {
                if (!used.has(v)) allValues.push(v)
              })
            })
            return allValues.slice(0, 8)
          },

          // 应用预设标签
          applyPreset(index, presetValue) {
            if (!this.dishFlavors[index].value.includes(presetValue)) {
              this.dishFlavors[index].value.push(presetValue)
            }
          },

          submitForm(formName, st) {
            this.$refs[formName].validate((valid) => {
              if (valid) {
                let params = {...this.ruleForm}
                // params.flavors = this.dishFlavors
                params.status = this.ruleForm.status ? 1 : 0
                params.price *= 100
                params.categoryId = this.ruleForm.categoryId
                params.flavors = this.dishFlavors.map(obj => ({ ...obj, value: JSON.stringify(obj.value) }))
                delete params.dishFlavors
                if(!this.imageUrl){
                  this.$message.error('请上传菜品图片')
                  return 
                }
                if (this.actionType === 'add') {
                  delete params.id
                  addDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品添加成功！')
                      if (!st) {
                        this.goBack()
                      } else {
                        this.dishFlavors = []
                        // this.dishFlavorsData = []
                        this.imageUrl = ''
                        this.ruleForm = {
                          'name': '',
                          'id': '',
                          'price': '',
                          'code': '',
                          'image': '',
                          'description': '',
                          'dishFlavors': [],
                          'status': true,
                          categoryId: ''
                        }
                      }
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                } else {
                  delete params.updateTime
                  editDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品修改成功！')
                      this.goBack()
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                }
              } else {
                return false
              }
            })
          },

          handleAvatarSuccess (response, file, fileList) {
            // 拼接down接口预览
            if(response.code === 0 && response.msg === '未登录'){
              window.top.location.href = '/backend/page/login/login.html'
            }else{
              this.imageUrl = `/common/download?name=${response.data}`
              this.ruleForm.image = response.data
            }
          },

          onChange (file) {
            if(file){
              const suffix = file.name.split('.')[1]
              const size = file.size / 1024 / 1024 < 2
              if(['png','jpeg','jpg'].indexOf(suffix) < 0){
                this.$message.error('上传图片只支持 png、jpeg、jpg 格式！')
                this.$refs.upload.clearFiles()
                return false
              }
              if(!size){
                this.$message.error('上传文件大小不能超过 2MB!')
                return false
              }
              return file
            }
          },
          
          goBack(){
            window.parent.menuHandle({
              id: '4',
              url: '/backend/page/food/list.html',
              name: '菜品管理'
            },false)
          }
        }
      })
    </script>
</body>
</html>
