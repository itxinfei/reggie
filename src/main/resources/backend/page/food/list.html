<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鑿滃搧绠＄悊 - 鐟炲悏澶栧崠绠＄悊绔?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    body { overflow-x: visible; }
  </style>
</head>
<body>
  <!-- 閿洏鐢ㄦ埛锛氳烦杞埌涓诲唴瀹癸紙WCAG 2.4.1锛?-->
  <a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>

  <div class="dashboard-container" id="food-app">
    <main class="container ds-page" id="main-content" role="main">
      <!-- 椤靛ご锛氭爣棰?+ 鍓爣棰橈紙涓庡叏绔?ds-page-header 瑙勮寖涓€鑷达級 -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">鑿滃搧绠＄悊</h1>
          <p class="ds-page-header__subtitle">绠＄悊鑿滃搧淇℃伅銆佸簱瀛樹笌鍞崠鐘舵€?/p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 鏁版嵁缁熻鍗＄墖 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 鎼滅储 + 鎿嶄綔鏍忥紙鎵归噺鎸夐挳 + 鏂板 + 瀵煎嚭閫氳繃 actions 浼犲叆锛?-->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 鏁版嵁琛ㄦ牸锛堝閫?+ 鑷畾涔夊浘鐗?鐘舵€?搴撳瓨鍒?+ 鎿嶄綔鍒楋級 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :selection="true"
        :show-actions="true"
        :actions-width="260"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        @selection-change="onSelection"
        aria-label="鑿滃搧鍒楄〃"
      >
        <!-- 鍥剧墖鍒?-->
        <template #col-image="{ row }">
          <el-image class="cell-img"
            :src="getImage(row.image)"
            :preview-src-list="[getImage(row.image)]">
            <div slot="error" class="image-slot">
              <img src="./../../images/noImg.png" class="cell-img" alt="鏆傛棤鍥剧墖">
            </div>
          </el-image>
        </template>
        <!-- 鍞环鍒楋紙淇敼鐐癸細F10 鐢?formatMoney 缁熶竴涓や綅灏忔暟鏄剧ず锛?-->
        <template #col-price="{ row }">
          <span>锟{ formatMoney(row.price) }}</span>
        </template>
        <!-- 鐘舵€佸垪 -->
        <template #col-status="{ row }">
          <el-tag :type="row.status == '0' ? 'info' : 'success'" size="small">
            {{ row.status == '0' ? '鍋滃敭' : '鍚敭' }}
          </el-tag>
        </template>
        <!-- 搴撳瓨鍒?-->
        <template #col-stock="{ row }">
          <span :style="{ color: row.stockQty != null && row.minStock != null && row.stockQty <= row.minStock ? 'var(--color-danger)' : 'var(--el-text-primary)', fontWeight: row.stockQty != null && row.minStock != null && row.stockQty <= row.minStock ? '600' : '400' }">
            {{ row.stockQty != null ? row.stockQty : '-' }}
          </span>
          <el-tag v-if="row.stockQty != null && row.minStock != null && row.stockQty <= row.minStock && row.stockQty > 0" type="danger" size="mini" effect="plain" style="margin-left:4px;">浣?/el-tag>
          <el-tag v-if="row.stockQty != null && row.stockQty == 0" type="danger" size="mini">鍞絼</el-tag>
        </template>
        <!-- 鎿嶄綔鎸夐挳 -->
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="addFoodtype(row.id)">淇敼</el-button>
          <el-button type="text" size="small" class="btn-view" @click="statusHandle(row)">{{ row.status == '0' ? '鍚敭' : '鍋滃敭' }}</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle('鍗曞垹', row.id)">鍒犻櫎</el-button>
          <el-button type="text" size="small" @click="editStock(row)">搴撳瓨</el-button>
          <el-button type="text" size="small" @click="editBOM(row)">閰嶆柟</el-button>
        </template>
      </crud-table>
    </main>

    <!-- 鏂板/淇敼鑿滃搧寮圭獥锛堢粺涓€ crud-dialog 缁勪欢锛孧2锛?-->
    <crud-dialog
      :size="'xl'"
      :title="dishDialog.title"
      :visible.sync="dishDialog.visible"
      :close-on-click-modal="false"
      :submit-loading="submitting"
      custom-class="dish-dialog"
      @submit="submitDishForm"
    >
      <el-form ref="dishForm" :model="dishForm" :rules="dishRules" label-width="100px" size="small">
        <el-form-item label="鑿滃搧鍚嶇О:" prop="name">
          <el-input v-model="dishForm.name" placeholder="璇峰～鍐欒彍鍝佸悕绉? maxlength="20" />
        </el-form-item>
        <el-form-item label="鍟嗗搧鐮?" prop="code">
          <el-input v-model="dishForm.code" placeholder="璇疯緭鍏ュ晢鍝佺爜锛堝鏉″舰鐮侊級" maxlength="64" />
        </el-form-item>
        <el-form-item label="鑿滃搧鍒嗙被:" prop="categoryId">
          <el-select v-model="dishForm.categoryId" placeholder="璇烽€夋嫨鑿滃搧鍒嗙被">
            <el-option v-for="item in dishList" :key="item.id" :label="item.name" :value="item.id" />
          </el-select>
        </el-form-item>
        <el-form-item label="鑿滃搧浠锋牸:" prop="price" size="small">
          <el-input v-model="dishForm.price" placeholder="璇疯缃彍鍝佷环鏍? />
        </el-form-item>
        <el-form-item label="鎺掑簭:" prop="sort">
          <el-input-number v-model="dishForm.sort" :min="0" :max="999" placeholder="鎺掑簭鍊硷紝瓒婂皬瓒婇潬鍓? />
        </el-form-item>
        <el-form-item label="褰撳墠搴撳瓨:">
          <el-input-number v-model="dishForm.stockQty" :min="0" :precision="0" placeholder="涓嶉檺搴撳瓨鍒欎笉濉? style="width: 100%;" />
        </el-form-item>
        <el-form-item label="鏈€浣庡簱瀛橀璀?">
          <el-input-number v-model="dishForm.minStock" :min="0" :precision="0" placeholder="搴撳瓨浣庝簬姝ゅ€兼椂棰勮" style="width: 100%;" />
        </el-form-item>
        <el-form-item label="鑿滃搧鍥剧墖:" prop="image" class="uploadImg">
          <el-upload
            class="avatar-uploader"
            action="/common/upload"
            name="file"
            :show-file-list="false"
            :on-success="handleAvatarSuccess"
            :on-change="onChange"
            ref="upload"
          >
            <img v-if="dishForm.imageUrl" :src="dishForm.imageUrl" class="avatar" style="border-radius: var(--radius-sm);" alt="鑿滃搧鍥剧墖">
            <i v-else class="el-icon-plus avatar-uploader-icon"></i>
          </el-upload>
        </el-form-item>
        <el-form-item label="鑿滃搧鎻忚堪:">
          <el-input v-model="dishForm.description" type="textarea" :rows="3" placeholder="鑿滃搧鎻忚堪锛屾渶闀?00瀛? maxlength="200" />
        </el-form-item>
        <el-form-item label="鍙ｅ懗鍋氭硶:">
          <div class="flavorBox-dialog">
            <div v-if="dishFlavors.length === 0" class="flavor-empty-dialog">
              <el-button type="text" icon="el-icon-plus" @click="addDialogFlavor">娣诲姞鍙ｅ懗閰嶇疆</el-button>
            </div>
            <div v-else class="flavor-list-dialog">
              <div v-for="(item, index) in dishFlavors" :key="index" class="flavor-item-dialog">
                <div class="flavor-header-dialog">
                  <span class="flavor-index">{{ index + 1 }}</span>
                  <el-input v-model="item.name" size="small" placeholder="鍙ｅ懗鍚嶇О锛堝锛氳荆搴︺€佹俯搴︼級" maxlength="10" style="width: 140px;"></el-input>
                  <el-button type="text" size="small" class="btn-delete" @click="delDialogFlavor(index)">鍒犻櫎</el-button>
                </div>
                <div class="flavor-tags-dialog">
                  <el-tag v-for="(tag, tIdx) in item.value" :key="tIdx" size="small" closable type="info"
                    @close="delDialogFlavorLabel(index, tIdx)">{{ tag }}</el-tag>
                  <el-input v-if="item.inputVisible" v-model="item.inputValue" size="mini"
                    :ref="'dialogTagInput' + index" style="width: 80px;" maxlength="10"
                    @keyup.enter.native="confirmDialogTag(index)" @blur="confirmDialogTag(index)"></el-input>
                  <el-button v-else size="mini" type="text" icon="el-icon-plus" @click="showDialogTagInput(index)">娣诲姞鏍囩</el-button>
                </div>
              </div>
              <el-button type="text" icon="el-icon-plus" size="small" @click="addDialogFlavor" style="margin-top: 8px;">娣诲姞鏂板彛鍛?/el-button>
            </div>
          </div>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 搴撳瓨缂栬緫寮圭獥锛堢粺涓€ crud-dialog 缁勪欢锛孧2锛?-->
    <crud-dialog
      :size="'sm'"
      title="缂栬緫搴撳瓨"
      :visible.sync="stockDialog.visible"
      :close-on-click-modal="false"
      @submit="submitStockForm"
    >
      <!-- 淇敼鐐癸細琛ュ叏 ref/:rules 鍚敤 Element 鏍￠獙锛堝師浠呮墜鍐?if 鍒ゆ柇锛屽睘"鍋囧繀濉?锛?-->
      <el-form ref="stockEditForm" :model="stockForm" :rules="stockEditRules" label-width="80px" size="small">
        <el-form-item label="鑿滃搧鍚嶇О">
          <span>{{ stockForm.name }}</span>
        </el-form-item>
        <el-form-item label="褰撳墠搴撳瓨">
          <span>{{ stockForm.stockQty }}</span>
        </el-form-item>
        <el-form-item label="搴撳瓨鏁伴噺" prop="newStockQty">
          <el-input v-model="stockForm.newStockQty" type="number" placeholder="璇疯緭鍏ュ簱瀛樻暟閲? />
        </el-form-item>
        <el-form-item label="鏈€浣庡簱瀛橀璀? prop="newMinStock">
          <el-input v-model="stockForm.newMinStock" type="number" placeholder="璇疯緭鍏ユ渶浣庡簱瀛橀璀﹀€? />
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 閰嶆柟缂栬緫寮圭獥锛堢粺涓€ crud-dialog 缁勪欢锛孧2锛?-->
    <crud-dialog
      :size="'lg'"
      :title="'缂栬緫閰嶆柟 - ' + (bomDialog.dishName || '')"
      :visible.sync="bomDialog.visible"
      :close-on-click-modal="false"
      :submit-loading="bomSubmitting"
      custom-class="bom-dialog"
      @submit="submitBOM"
    >
      <div style="margin-bottom: 12px;">
        <el-button type="primary" size="small" icon="el-icon-plus" @click="addBOMItem">娣诲姞椋熸潗</el-button>
        <el-button size="small" @click="loadBOMItems">鍒锋柊</el-button>
      </div>
      <el-table :data="bomItems" size="small" border style="width: 100%;">
        <el-table-column label="椋熸潗鍚嶇О" width="180">
          <template slot-scope="scope">
            <el-select v-model="scope.row.materialId" placeholder="璇烽€夋嫨椋熸潗" size="small" filterable
              @change="onMaterialChange(scope.row, $event)" style="width: 100%;">
              <el-option v-for="m in materialOptions" :key="m.id" :label="m.name" :value="m.id">
                <span>{{ m.name }}</span>
                <span style="color: var(--text-muted); margin-left: 8px; font-size: var(--font-size-xs);">{{ m.unit }}</span>
              </el-option>
            </el-select>
          </template>
        </el-table-column>
        <el-table-column label="鐢ㄩ噺" width="140" align="right">
          <template slot-scope="scope">
            <el-input-number v-model="scope.row.usageQty" :min="0.001" :precision="3"
              controls-position="right" size="small" style="width: 100%;" />
          </template>
        </el-table-column>
        <el-table-column label="鍗曚綅" width="80" align="center">
          <template slot-scope="scope">
            <span style="color: var(--text-secondary);">{{ scope.row.materialUnit || '-' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="鎿嶄綔" align="center" width="80">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-delete" @click="delBOMItem(scope.$index)">鍒犻櫎</el-button>
          </template>
        </el-table-column>
      </el-table>
      <div style="margin-top: 12px; color: var(--text-muted); font-size: var(--font-size-xs);">
        鎻愮ず锛氱偣鍑?淇濆瓨"灏嗘彁浜ゅ叏閮ㄩ鏉愰厤鏂癸紙宸蹭繚瀛樼殑鏇存柊銆佹柊澧炵殑鍒涘缓銆佸垹闄ょ殑绉婚櫎锛夈€?
      </div>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/food.js"></script>
  <script src="../../api/inventory.js"></script>
  <script src="../../api/export.js"></script>
  <script>
    new Vue({
      el: '#food-app',
      data: function() {
        return {
          counts: 0,
          submitting: false, // 鎻愪氦闃查噸锛氳姹傛湡闂撮攣瀹氬脊绐楃‘璁ゆ寜閽?
          page: 1,
          pageSize: 10,
          tableData: [],
          loading: false,
          dishState: '',
          checkList: [],
          // 缁熻
          stats: { totalDishes: 0, activeDishes: 0, inactiveDishes: 0, deletedDishes: 0 },
          activeFilter: '',
          categoryId: '',
          categoryOptions: [],
          // 鎼滅储閰嶇疆
          searchConfig: [
            { type: 'input', field: 'name', placeholder: '璇疯緭鍏ヨ彍鍝佸悕绉?, width: '200px' },
            { type: 'input', field: 'code', placeholder: '璇疯緭鍏ュ晢鍝佺爜', width: '160px' },
            { type: 'select', field: 'categoryId', placeholder: '鍏ㄩ儴鍒嗙被', width: '160px', options: [] }
          ],
          // 鎿嶄綔鎸夐挳閰嶇疆
          actionConfig: [
            { key: 'batchDelete', text: '鎵归噺鍒犻櫎', type: 'danger' },
            { key: 'batchStart', text: '鎵归噺鍚敭', type: 'success' },
            { key: 'batchStop', text: '鎵归噺鍋滃敭', type: 'warning' },
            { key: 'add', text: '+ 鏂板缓鑿滃搧', type: 'primary' },
            { key: 'export', text: '瀵煎嚭', type: 'success', icon: 'el-icon-download' }
          ],
          // 琛ㄦ牸鍒楅厤缃?
          columns: [
            { prop: 'name', label: '鑿滃搧鍚嶇О', width: 140, showOverflowTooltip: true },
            { prop: 'categoryName', label: '鍒嗙被', width: 80, align: 'center' },
            { prop: 'price', label: '鍞环', slot: true, width: 80, type: 'money' },
            { prop: 'status', label: '鐘舵€?, slot: true, width: 70, align: 'center' },
            { prop: 'stock', label: '搴撳瓨', slot: true, width: 70, type: 'number' },
            { prop: 'sort', label: '鎺掑簭', width: 60, type: 'number' },
            { prop: 'description', label: '鎻忚堪', width: 120, showOverflowTooltip: true },
            { prop: 'updateTime', label: '鏇存柊鏃堕棿', width: 140 }
          ],
          // 缂撳瓨鎼滅储鍙傛暟
          lastSearch: {},
          // 寮圭獥鐩稿叧
          dishDialog: { title: '娣诲姞鑿滃搧', visible: false, actionType: 'add', loading: false },
          dishForm: { name: '', code: '', categoryId: '', price: '', sort: 0, image: '', imageUrl: '', description: '', status: true },
          dishList: [],
          dishFlavors: [],
          dishFlavorsData: [],
          inputStyle: { 'flex': 1 },
          index: 0,
          // 搴撳瓨缂栬緫
          stockDialog: { visible: false },
          stockForm: { id: '', name: '', stockQty: '', minStock: '', newStockQty: '', newMinStock: '' },
          // 淇敼鐐癸細搴撳瓨缂栬緫琛ㄥ崟鏍￠獙瑙勫垯锛堥厤鍚?el-form :rules + validate()锛?
          stockEditRules: {
            newStockQty: [{ required: true, message: '璇疯緭鍏ュ簱瀛樻暟閲?, trigger: 'blur' }],
            newMinStock: [{ required: true, message: '璇疯緭鍏ユ渶浣庡簱瀛橀璀﹀€?, trigger: 'blur' }]
          },
          // 閰嶆柟缂栬緫
          bomDialog: { visible: false, dishId: null, dishName: '' },
          bomItems: [],
          materialOptions: [],
          bomSubmitting: false
        }
      },
      computed: {
        statsCards: function() {
        const self = this
        return [
          { key: '', icon: 'ri-restaurant-line', label: '鑿滃搧鎬绘暟', value: self.stats.totalDishes, color: 'primary', clickable: true, active: self.activeFilter === '' },
          { key: '1', icon: 'ri-checkbox-circle-line', label: '宸插惎鍞?, value: self.stats.activeDishes, color: 'success', clickable: true, active: self.activeFilter === '1' },
          { key: '0', icon: 'ri-pause-circle-line', label: '宸插仠鍞?, value: self.stats.inactiveDishes, color: 'warning', clickable: true, active: self.activeFilter === '0' },
          { key: 'deleted', icon: 'ri-delete-bin-line', label: '宸插垹闄?, value: self.stats.deletedDishes, color: 'danger', clickable: true, active: self.activeFilter === 'deleted' }
        ]
      },
        dishRules: function() {
          const self = this
          return {
            name: [{ required: true, message: '璇峰～鍐欒彍鍝佸悕绉?, trigger: 'blur' }],
            categoryId: [{ required: true, message: '璇烽€夋嫨鑿滃搧鍒嗙被', trigger: 'change' }],
            price: [{
              required: true,
              validator: function(rule, value, callback) {
                if (!value) { callback(new Error('璇峰～鍐欒彍鍝佷环鏍?)); return }
                var reg = /^\d+(\.\d{0,2})?$/
                if (!reg.test(value)) { callback(new Error('鑿滃搧浠锋牸鏍煎紡鍙兘涓烘暟瀛?涓旀渶澶氫繚鐣欎袱浣嶅皬鏁?)); return }
                if (value >= 10000) { callback(new Error('鑿滃搧浠锋牸灏忎簬10000')); return }
                callback()
              }, trigger: 'blur'
            }]
          }
        }
      },
      created: function() { this.init(); this.loadDishStats() },
      mounted: function() { this.loadCategoryOptions() },
      methods: {
        // 淇敼鐐癸細F9 鎬ц兘鈥斺€斿垪琛ㄥ彧鏌ュ綋鍓嶉〉鏁版嵁锛岀粺璁′负鍏ㄥ眬鑱氬悎鐢?loadDishStats 鐙珛鍔犺浇锛屼笉闅忕炕椤?绛涢€夐噸绠?
        async init() {
          this.loading = true
          const self = this
          const params = {$2}
          if (self.activeFilter && self.activeFilter !== '') { params.status = self.activeFilter }
          try {
            const dishRes = await getDishPage(params)
            if (String(dishRes.code) === '1') { self.tableData = dishRes.data.records || []; self.counts = dishRes.data.total }
          } catch (err) { ReggieUI.error('鍔犺浇鑿滃搧鍒楄〃澶辫触:') }
          self.loading = false
        },
        // 淇敼鐐癸細F9 鍒楄〃 + 缁熻涓€璧峰埛鏂帮紙浠呭湪澧炲垹鏀?涓婁笅鏋剁瓑浼氭敼鍙樺叏灞€璁℃暟鐨勬搷浣滃悗璋冪敤锛?
        refreshAll: function() {
          this.init()
          this.loadDishStats()
        },
        async loadDishStats() {
          try {
            // 淇敼鐐癸細骞惰鏌ヨ鍚勭姸鎬佽彍鍝佹€绘暟锛屾浛浠ｇ‖缂栫爜 deletedDishes=0锛涚粨鏋滆嚜璧嬪€硷紝璋冪敤鏂规棤闇€鍐嶅彇杩斿洖鍊?
            const results = await Promise.all([
              getDishPage({ page: 1, pageSize: 1, status: '1' }),
              getDishPage({ page: 1, pageSize: 1, status: '0' }),
              getDishPage({ page: 1, pageSize: 1, isDeleted: 1 })
            ])
            const activeCount = (String(results[0].code) === '1') ? (results[0].data.total || 0) : 0
            const inactiveCount = (String(results[1].code) === '1') ? (results[1].data.total || 0) : 0
            const deletedCount = (String(results[2].code) === '1') ? (results[2].data.total || 0) : 0
            const stats = {$2}
            this.stats = stats
            return { code: 1, data: stats }
          } catch (err) { console.warn('鍔犺浇鑿滃搧缁熻鏁版嵁澶辫触:', err) }
          return { code: 0 }
        },
        loadCategoryOptions: function() {
          const self = this
          getCategoryList({ type: 1 }).then(function(res) {
            if (res.code === 1) { self.categoryOptions = res.data || []; self.searchConfig[1].options = self.categoryOptions.map(function(c) { return { label: c.name, value: c.id } }) }
          }).catch(function(err) { ReggieUI.error('鍔犺浇鍒嗙被閫夐」澶辫触:') })
        },
        getDishList: function() {
          const self = this
          getCategoryList({ type: 1 }).then(function(res) { if (res.code === 1) { self.dishList = res.data || [] } }).catch(function(err) { ReggieUI.error('鍔犺浇鑿滃搧鍒嗙被澶辫触:') })
        },
        getImage: function(image) { return '/common/download?name=' + image },
        // stat-cards 鐐瑰嚮
        onCardClick: function(payload) {
          const self = this
          self.activeFilter = payload.activeKey
          self.lastSearch = {}
          self.page = 1; self.init()
        },
        // table-bar 鍥炶皟
        onSearch: function(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1; this.init()
        },
        onReset: function() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1; this.init()
        },
        onAction: function(payload) {
          const self = this
          switch (payload.key) {
            case 'batchDelete': self.deleteHandle('鎵归噺', null); break
            case 'batchStart': self.statusHandle('1'); break
            case 'batchStop': self.statusHandle('0'); break
            case 'add': self.addFoodtype('add'); break
            case 'export': self.exportDishes('excel'); break
          }
        },
        onPageChange: function(payload) { this.page = payload.page; this.init() },
        onSizeChange: function(payload) { this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload; this.page = 1; this.init() },
        onSelection: function(payload) { this.checkList = payload.ids || [] },
        // ========== 鑿滃搧寮圭獥 ==========
        addFoodtype: function(st) {
          this.resetDishForm()
          if (st === 'add') { this.dishDialog.title = '娣诲姞鑿滃搧'; this.dishDialog.actionType = 'add'; this.dishDialog.visible = true; this.getDishList() }
          else { this.dishDialog.title = '淇敼鑿滃搧'; this.dishDialog.actionType = 'edit'; this.dishDialog.visible = true; this.getDishList(); this.initDishForm(st) }
        },
        async initDishForm(id) {
          const self = this
          try {
            const res = await queryDishById(id)
            if (String(res.code) === '1') {
              const data = res.data
              self.dishForm = { id: data.id, name: data.name, code: data.code || '', categoryId: data.categoryId, price: String(data.price), sort: data.sort || 0, stockQty: data.stockQty != null ? String(data.stockQty) : '', minStock: data.minStock != null ? String(data.minStock) : '', image: data.image, imageUrl: '/common/download?name=' + data.image, description: data.description || '', status: String(data.status) === '1' }
              self.dishFlavors = data.flavors && data.flavors.map(function(obj) {
                const parsedValue = []
                if (obj.value) {
                  try { parsedValue = JSON.parse(obj.value) }
                  catch (e) { parsedValue = typeof obj.value === 'string' ? obj.value.split(',').map(function(s) { return s.trim() }).filter(Boolean) : [obj.value] }
                }
                return { name: obj.name, value: parsedValue, showOption: false, inputVisible: false, inputValue: '' }
              }) || []
            } else { ReggieUI.error(res.msg || '鑾峰彇鑿滃搧淇℃伅澶辫触') }
          } catch (err) { ReggieUI.error('璇锋眰澶辫触锛? + err) }
        },
        resetDishForm: function() {
          this.dishForm = { name: '', code: '', categoryId: '', price: '', sort: 0, stockQty: '', minStock: '', image: '', imageUrl: '', description: '', status: true }
          this.dishFlavors = []
          if (this.$refs.dishForm) { this.$refs.dishForm.resetFields() }
        },
        handleDialogClose: function() { this.dishDialog.visible = false; this.resetDishForm() },
        // ========== 搴撳瓨缂栬緫 ==========
        editStock: function(row) {
          this.stockForm = {
            id: row.id,
            name: row.name,
            stockQty: row.stockQty != null ? row.stockQty : 0,
            minStock: row.minStock != null ? row.minStock : 0,
            newStockQty: row.stockQty != null ? row.stockQty : 0,
            newMinStock: row.minStock != null ? row.minStock : 0
          }
          this.stockDialog.visible = true
        },
        async submitStockForm() {
          if (this.submitting) return // 鎻愪氦闃查噸
          const self = this
          const passed = false
          self.$refs.stockEditForm.validate(function(valid) { passed = valid })
          if (!passed) {
            ReggieUI.warning('璇峰畬鍠勮〃鍗曞繀濉」')
            return
          }
          const form = self.stockForm
          self.submitting = true
          try {
            var res = await updateDishStock(form.id, { stockQty: form.newStockQty, minStock: form.newMinStock })
            self.submitting = false
            if (res.code === 1) { ReggieUI.success('搴撳瓨鏇存柊鎴愬姛'); self.stockDialog.visible = false; self.refreshAll() }
            else { ReggieUI.error(res.msg || '搴撳瓨鏇存柊澶辫触') }
          } catch (err) { self.submitting = false; ReggieUI.error('璇锋眰澶辫触锛? + err) }
        },
        // 鍙ｅ懗缂栬緫鏂规硶
        addDialogFlavor: function() { this.dishFlavors.push({ name: '', value: [], inputVisible: false, inputValue: '' }) },
        delDialogFlavor: function(index) { this.dishFlavors.splice(index, 1) },
        delDialogFlavorLabel: function(index, tIdx) { this.dishFlavors[index].value.splice(tIdx, 1) },
        showDialogTagInput: function(index) {
          this.dishFlavors[index].inputVisible = true
          const self = this
          this.$nextTick(function() { const ref = self.$refs['dialogTagInput' + index]; if (ref && ref[0]) ref[0].$refs.input.focus() })
        },
        confirmDialogTag: function(index) {
          const inputValue = this.dishFlavors[index].inputValue
          if (inputValue && inputValue.trim()) { const trimmed = inputValue.trim(); if (!this.dishFlavors[index].value.includes(trimmed)) { this.dishFlavors[index].value.push(trimmed) } }
          this.dishFlavors[index].inputVisible = false; this.dishFlavors[index].inputValue = ''
        },
        submitDishForm: function(st) {
          if (this.submitting) return // 鎻愪氦闃查噸
          const self = this
          this.$refs.dishForm.validate(function(valid) {
            if (!valid) return
            self.submitting = true
            const params = {$2}
            params.flavors = self.dishFlavors.map(function(obj) { return { name: obj.name, value: JSON.stringify(obj.value) } })
            if (self.dishForm.stockQty !== null && self.dishForm.stockQty !== undefined && self.dishForm.stockQty !== '') { params.stockQty = parseFloat(self.dishForm.stockQty) }
            if (self.dishForm.minStock !== null && self.dishForm.minStock !== undefined && self.dishForm.minStock !== '') { params.minStock = parseFloat(self.dishForm.minStock) }
            if (!params.image) { self.submitting = false; ReggieUI.error('璇蜂笂浼犺彍鍝佸浘鐗?); return }
            if (self.dishDialog.actionType === 'add') {
              addDish(params).then(function(res) {
                self.submitting = false
                if (res.code === 1) {
                  ReggieUI.success('鑿滃搧娣诲姞鎴愬姛锛?)
                  self.dishDialog.visible = false
                  self.refreshAll()
                  if (st === 'continue') { self.resetDishForm(); self.dishDialog.visible = true }
                } else { ReggieUI.error(res.msg || '鎿嶄綔澶辫触') }
              }).catch(function(err) { self.submitting = false; ReggieUI.error('璇锋眰澶辫触锛? + err) })
            } else {
              params.id = self.dishForm.id
              editDish(params).then(function(res) {
                self.submitting = false
                if (res.code === 1) { ReggieUI.success('鑿滃搧淇敼鎴愬姛锛?); self.dishDialog.visible = false; self.refreshAll() }
                else { ReggieUI.error(res.msg || '鎿嶄綔澶辫触') }
              }).catch(function(err) { self.submitting = false; ReggieUI.error('璇锋眰澶辫触锛? + err) })
            }
          })
        },
        handleAvatarSuccess: function(response) {
          if (response.code === 0 && response.msg === '鏈櫥褰?) { window.top.location.href = '/backend/page/login/login.html' }
          else { this.dishForm.imageUrl = '/common/download?name=' + response.data; this.dishForm.image = response.data }
        },
        onChange: function(file) {
          if (file) {
            const suffix = file.name.split('.')[1]; const size = file.size / 1024 / 1024 < 2
            if (['png', 'jpeg', 'jpg'].indexOf(suffix) < 0) { ReggieUI.error('涓婁紶鍥剧墖鍙敮鎸?png銆乯peg銆乯pg 鏍煎紡锛?); this.$refs.upload.clearFiles(); return false }
            if (!size) { ReggieUI.error('涓婁紶鏂囦欢澶у皬涓嶈兘瓒呰繃 2MB!'); return false }
            return file
          }
        },
        deleteHandle: function(type, id) {
          const self = this
          if (type === '鎵归噺' && id === null) { if (self.checkList.length === 0) { ReggieUI.error('璇烽€夋嫨鍒犻櫎瀵硅薄'); return } }
          ReggieUI.confirm('纭鍒犻櫎璇ヨ彍鍝? 鏄惁缁х画?', '纭畾鍒犻櫎', { confirmButtonText: '纭畾', cancelButtonText: '鍙栨秷', type: 'warning' })
            .then(function() {
              deleteDish(type === '鎵归噺' ? self.checkList.join(',') : id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('鍒犻櫎鎴愬姛锛?); self.refreshAll() }
                else { ReggieUI.error(res.msg || '鎿嶄綔澶辫触') }
              }).catch(function(err) { ReggieUI.error('璇锋眰澶辫触锛? + err) })
            })
        },
        statusHandle: function(row) {
          const self = this
          const params = {$2}
          if (typeof row === 'string') {
            if (self.checkList.length === 0) { ReggieUI.error('鎵归噺鎿嶄綔锛岃鍏堝嬀閫夋搷浣滆彍鍝侊紒'); return false }
            params.id = self.checkList.join(','); params.status = row
          } else { params.id = row.id; params.status = row.status ? '0' : '1' }
          self.dishState = params
          ReggieUI.confirm('纭鏇存敼璇ヨ彍鍝佺姸鎬?', '鎻愮ず', { confirmButtonText: '纭畾', cancelButtonText: '鍙栨秷', type: 'warning' })
            .then(function() {
              dishStatusByStatus(self.dishState).then(function(res) {
                if (res.code === 1) { ReggieUI.success('鑿滃搧鐘舵€佸凡缁忔洿鏀规垚鍔燂紒'); self.refreshAll() }
                else { ReggieUI.error(res.msg || '鎿嶄綔澶辫触') }
              }).catch(function(err) { ReggieUI.error('璇锋眰澶辫触锛? + err) })
            })
        },
        exportDishes: function(format) {
          try {
            const ext = format === 'excel' ? 'xlsx' : 'pdf'
            var apiCall = format === 'excel' ? exportApi.exportDishesExcel({}) : exportApi.exportDishesPdf({})
            exportApi.downloadFile(apiCall, '鑿滃搧鏁版嵁.' + ext)
            ReggieUI.success('瀵煎嚭鎴愬姛锛屾枃浠跺凡寮€濮嬩笅杞?)
          } catch (err) { ReggieUI.error('瀵煎嚭澶辫触锛? + (err.message || err)) }
        },
        // ========== 閰嶆柟缂栬緫 ==========
        editBOM: function(row) {
          const self = this
          self.bomDialog = { visible: true, dishId: row.id, dishName: row.name }
          self.loadMaterialOptions()
          self.loadBOMItems()
        },
        loadMaterialOptions: function() {
          const self = this
          materialList().then(function(res) {
            if (res.code === 1) { self.materialOptions = res.data || [] }
          }).catch(function(err) { ReggieUI.error('鍔犺浇椋熸潗鍒楄〃澶辫触锛? + err) })
        },
        loadBOMItems: function() {
          const self = this
          const dishId = self.bomDialog.dishId
          if (!dishId) { return }
          dishMaterialListByDish(dishId).then(function(res) {
            if (res.code === 1) {
              const data = res.data || []
              self.bomItems = data.map(function(item) {
                return {
                  id: item.id || null,
                  dishId: item.dishId || dishId,
                  materialId: item.materialId || null,
                  usageQty: item.usageQty != null ? parseFloat(item.usageQty) : 0.001,
                  sort: item.sort || 0,
                  materialUnit: item.materialUnit || ''
                }
              })
              if (self.bomItems.length === 0) { self.addBOMItem() }
            } else { ReggieUI.error(res.msg || '鍔犺浇閰嶆柟澶辫触') }
          }).catch(function(err) { ReggieUI.error('璇锋眰澶辫触锛? + err) })
        },
        addBOMItem: function() {
          this.bomItems.push({
            id: null,
            dishId: this.bomDialog.dishId,
            materialId: null,
            usageQty: 0.001,
            sort: this.bomItems.length,
            materialUnit: ''
          })
        },
        delBOMItem: function(index) {
          if (this.bomItems.length <= 1) { ReggieUI.warning('鑷冲皯淇濈暀涓€鏉?); return }
          this.bomItems.splice(index, 1)
        },
        onMaterialChange: function(row, value) {
          for (let i = 0; i < this.materialOptions.length; i++) {
            if (this.materialOptions[i].id === value) {
              row.materialUnit = this.materialOptions[i].unit || ''
              break
            }
          }
        },
        submitBOM: function() {
          if (this.bomSubmitting) return
          const self = this
          // 鏍￠獙锛氭墍鏈夎蹇呴』閫夐鏉愪笖鐢ㄩ噺 > 0
          for (let i = 0; i < self.bomItems.length; i++) {
            const item = self.bomItems[i]
            if (!item.materialId) { ReggieUI.warning('绗?' + (i + 1) + ' 琛屾湭閫夋嫨椋熸潗'); return }
            if (!item.usageQty || item.usageQty <= 0) { ReggieUI.warning('绗?' + (i + 1) + ' 琛岀敤閲忓繀椤诲ぇ浜?0'); return }
          }
          var items = self.bomItems.map(function(it) {
            return {
              dishId: self.bomDialog.dishId,
              materialId: it.materialId,
              usageQty: it.usageQty,
              sort: it.sort
            }
          })
          const params = {$2}
          self.bomSubmitting = true
          dishMaterialBatchSave(params).then(function(res) {
            self.bomSubmitting = false
            if (res.code === 1) {
              ReggieUI.success('閰嶆柟淇濆瓨鎴愬姛锛?)
              self.bomDialog.visible = false
              self.bomItems = []
            } else { ReggieUI.error(res.msg || '淇濆瓨澶辫触') }
          }).catch(function(err) { self.bomSubmitting = false; ReggieUI.error('璇锋眰澶辫触锛? + err) })
        }
      }
    })
  </script>
</body>
