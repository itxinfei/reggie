<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜品管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    /* ========== 数据统计卡片 ========== */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid #f0f2f5;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient);
    }

    .stat-card .stat-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 42px;
      opacity: 0.08;
    }

    .stat-card .stat-label {
      font-size: 13px;
      color: #909399;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-card .stat-value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card.primary { --gradient: linear-gradient(135deg, #409eff 0%, #66b1ff 100%); }
    .stat-card.success { --gradient: linear-gradient(135deg, #67c23a 0%, #85ce61 100%); }
    .stat-card.warning { --gradient: linear-gradient(135deg, #e6a23c 0%, #ebb563 100%); }
    .stat-card.danger  { --gradient: linear-gradient(135deg, #f56c6c 0%, #f78989 100%); }
    .stat-card.info    { --gradient: linear-gradient(135deg, #909399 0%, #a6a9ad 100%); }

    @media (max-width: 1400px) {
      .stats-cards { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .stats-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
   <div class="dashboard-container" id="food-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <div class="stats-cards">
        <div class="stat-card primary">
          <div class="stat-icon">🍽️</div>
          <div class="stat-label">菜品总数</div>
          <div class="stat-value">{{ stats.totalDishes || 0 }}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">✅</div>
          <div class="stat-label">已启售</div>
          <div class="stat-value">{{ stats.activeDishes || 0 }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">⏸️</div>
          <div class="stat-label">已停售</div>
          <div class="stat-value">{{ stats.inactiveDishes || 0 }}</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon">🗑️</div>
          <div class="stat-label">已删除</div>
          <div class="stat-value">{{ stats.deletedDishes || 0 }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-input
          v-model="input"
          placeholder="请输入菜品名称"
          style="width: 250px"
          clearable
          @keyup.enter.native="handleQuery"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="handleQuery"
          ></i>
        </el-input>
        <div class="tableLab">
          <el-button type="primary" size="small" @click="deleteHandle('批量', null)">批量删除</el-button>
          <el-button type="primary" size="small" @click="statusHandle('1')">批量启售</el-button>
          <el-button type="primary" size="small" @click="statusHandle('0')">批量停售</el-button>
          <el-button type="primary" size="small" @click="addFoodtype('add')">
            + 新建菜品
          </el-button>
        </div>
      </div>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
        @selection-change="handleSelectionChange"
      >
        <el-table-column
          type="selection"
          align="center"
          width="50"
        ></el-table-column>
        <el-table-column
          prop="name"
          label="菜品名称"
        ></el-table-column>
        <el-table-column prop="image" label="图片" align="center">
          <template slot-scope="{ row }">
            <el-image style="width: auto; height: 40px; border:none;cursor: pointer; border-radius: 4px;"
            :src="getImage(row.image)"
            :preview-src-list="[ `/common/download?name=${row.image}` ]" >
            <div slot="error" class="image-slot">
              <img src="./../../images/noImg.png"  style="width: auto; height: 40px; border:none; border-radius: 4px;" >
            </div>
          </el-image>
          </template>
        </el-table-column>
        <el-table-column
          prop="categoryName"
          label="菜品分类"
        ></el-table-column>
        <el-table-column label="售价">
          <template slot-scope="scope">
            <span style="margin-right: 10px;">￥{{ scope.row.price/100 }}</span>
          </template>
        </el-table-column>
        <el-table-column label="售卖状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status == '0' ? 'info' : 'success'" size="small">
              {{ scope.row.status == '0' ? '停售' : '启售' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column
          prop="updateTime"
          label="最后操作时间"
        >
        </el-table-column>
        <el-table-column
          label="操作"
          align="center"
          width="200"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="addFoodtype(scope.row.id)"
            >修改</el-button>
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="statusHandle(scope.row)"
            >{{ scope.row.status == '0' ? '启售' : '停售' }}</el-button>
            <el-button
              type="text"
              size="small"
              class="delBut non"
              @click="deleteHandle('单删', scope.row.id)"
            >删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 新增/修改菜品弹窗 -->
    <el-dialog
      :title="dishDialog.title"
      :visible.sync="dishDialog.visible"
      width="800px"
      :before-close="handleDialogClose"
      :close-on-click-modal="false"
    >
      <el-form
        ref="dishForm"
        :model="dishForm"
        :rules="dishRules"
        label-width="120px"
      >
        <el-form-item label="菜品名称:" prop="name">
          <el-input v-model="dishForm.name" placeholder="请填写菜品名称" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="菜品分类:" prop="categoryId">
          <el-select v-model="dishForm.categoryId" placeholder="请选择菜品分类" style="width: 293px;">
            <el-option v-for="item in dishList" :key="item.id" :label="item.name" :value="item.id" />
          </el-select>
        </el-form-item>
        <el-form-item label="菜品价格:" prop="price">
          <el-input v-model="dishForm.price" placeholder="请设置菜品价格" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="菜品图片:" prop="image" class="uploadImg">
          <el-upload
            class="avatar-uploader"
            action="/common/upload"
            :show-file-list="false"
            :on-success="handleAvatarSuccess"
            :on-change="onChange"
            ref="upload"
          >
            <img v-if="dishForm.imageUrl" :src="dishForm.imageUrl" class="avatar" style="border-radius: 4px;"></img>
            <i v-else class="el-icon-plus avatar-uploader-icon"></i>
          </el-upload>
        </el-form-item>
        <el-form-item label="菜品描述:">
          <el-input v-model="dishForm.description" type="textarea" :rows="3" placeholder="菜品描述，最长200字" maxlength="200" style="width: 293px;" />
        </el-form-item>
      </el-form>
      <div slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleDialogClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitDishForm()">确 定</el-button>
        <el-button v-if="dishDialog.actionType == 'add'" type="primary" size="medium" class="continue" @click="submitDishForm('continue')">保存并继续添加</el-button>
      </div>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/food.js"></script>
    <script>
      new Vue({
        el: '#food-app',
        data() {
          return {
             input: '',
             counts: 0,
             page: 1,
             pageSize: 10,
             tableData : [],
             loading: false,
             dishState : '',
             checkList: [],
             // 数据统计
             stats: {
               totalDishes: 0,
               activeDishes: 0,
               inactiveDishes: 0,
               deletedDishes: 0
             },
             // 菜品弹窗相关
             dishDialog: {
               title: '添加菜品',
               visible: false,
               actionType: 'add',
               loading: false
             },
             dishForm: {
               name: '',
               categoryId: '',
               price: '',
               image: '',
               imageUrl: '',
               description: ''
             },
             dishList: [],
             dishFlavors: [],
             dishFlavorsData: [],
             inputStyle: {'flex': 1},
             index: 0
          }
        },
        computed: {
          dishRules() {
            return {
              name: [
                {required: true, message: '请填写菜品名称', trigger: 'blur'}
              ],
              categoryId: [
                {required: true, message: '请选择菜品分类', trigger: 'change'}
              ],
              price: [
                {
                  required: true,
                  validator: (rule, value, callback) => {
                    if (!value) {
                      callback(new Error('请填写菜品价格'))
                    } else {
                      const reg = /^\d+(\.\d{0,2})?$/
                      if (reg.test(value)) {
                        if(value < 10000) {
                          callback()
                        } else {
                          callback(new Error('菜品价格小于10000'))
                        }
                      } else {
                        callback(new Error('菜品价格格式只能为数字,且最多保留两位小数'))
                      }
                    }
                  },
                  trigger: 'blur'
                }
              ]
            }
          }
        },
        created() {
          this.init()
        },
        mounted() {
        },
        methods: {
          async init () {
            this.loading = true
            // 并行加载菜品列表和统计数据
            const [dishRes, statsRes] = await Promise.all([
              getDishPage({ page: this.page, pageSize: this.pageSize, name: this.input ? this.input : undefined }),
              this.loadDishStats()
            ])

            // 处理菜品列表数据
            if (String(dishRes.code) === '1') {
              this.tableData = dishRes.data.records || []
              this.counts = dishRes.data.total
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }

            this.loading = false
          },
          // 加载菜品统计数据
          async loadDishStats() {
            try {
              const res = await getDishPage({ page: 1, pageSize: 1 })
              if (String(res.code) === '1') {
                return {
                  code: 1,
                  data: {
                    totalDishes: res.data.total || 0,
                    activeDishes: 0,
                    inactiveDishes: 0,
                    deletedDishes: 0
                  }
                }
              }
            } catch (err) {
              console.warn('加载菜品统计数据失败:', err)
            }
            return { code: 0 }
          },
          // 加载菜品分类下拉列表
          getDishList () {
            getCategoryList({ type: 1 }).then(res => {
              if (res.code === 1) {
                this.dishList = res.data || []
              }
            }).catch(err => {
              console.error('加载菜品分类失败:', err)
            })
          },
          getImage (image) {
            return `/common/download?name=${image}`
          },
          handleQuery() {
            this.page = 1;
            this.init();
          },
          // 打开菜品弹窗
          addFoodtype (st) {
            this.resetDishForm()
            if (st === 'add') {
              this.dishDialog.title = '添加菜品'
              this.dishDialog.actionType = 'add'
              this.dishDialog.visible = true
              this.getDishList()
            } else {
              this.dishDialog.title = '修改菜品'
              this.dishDialog.actionType = 'edit'
              this.dishDialog.visible = true
              this.getDishList()
              this.initDishForm(st)
            }
          },
          // 初始化表单（修改时）
          async initDishForm(id) {
            try {
              const res = await queryDishById(id)
              if (String(res.code) === '1') {
                const data = res.data
                this.dishForm = {
                  id: data.id,
                  name: data.name,
                  categoryId: data.categoryId,
                  price: String(data.price / 100),
                  image: data.image,
                  imageUrl: `/common/download?name=${data.image}`,
                  description: data.description || ''
                }
                this.dishFlavors = data.flavors && data.flavors.map(obj => ({
                  ...obj,
                  value: JSON.parse(obj.value),
                  showOption: false
                }))
              } else {
                this.$message.error(res.msg || '获取菜品信息失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
          },
          // 重置表单
          resetDishForm() {
            this.dishForm = {
              name: '',
              categoryId: '',
              price: '',
              image: '',
              imageUrl: '',
              description: ''
            }
            this.dishFlavors = []
            if (this.$refs.dishForm) {
              this.$refs.dishForm.resetFields()
            }
          },
          // 关闭弹窗
          handleDialogClose() {
            this.dishDialog.visible = false
            this.resetDishForm()
          },
          // 提交菜品表单
          submitDishForm(st) {
            this.$refs.dishForm.validate((valid) => {
              if (valid) {
                let params = { ...this.dishForm }
                params.price = params.price * 100
                params.categoryId = params.categoryId
                params.flavors = this.dishFlavors.map(obj => ({
                  ...obj,
                  value: JSON.stringify(obj.value)
                }))
                params.status = 1

                if (!params.image) {
                  this.$message.error('请上传菜品图片')
                  return
                }

                if (this.dishDialog.actionType === 'add') {
                  addDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品添加成功！')
                      this.dishDialog.visible = false
                      this.handleQuery()
                      if (st === 'continue') {
                        this.resetDishForm()
                        this.dishDialog.visible = true
                      }
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                } else {
                  editDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品修改成功！')
                      this.dishDialog.visible = false
                      this.handleQuery()
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                }
              }
            })
          },
          // 图片上传成功
          handleAvatarSuccess(response) {
            if (response.code === 0 && response.msg === '未登录') {
              window.top.location.href = '/backend/page/login/login.html'
            } else {
              this.dishForm.imageUrl = `/common/download?name=${response.data}`
              this.dishForm.image = response.data
            }
          },
          // 图片上传校验
          onChange(file) {
            if (file) {
              const suffix = file.name.split('.')[1]
              const size = file.size / 1024 / 1024 < 2
              if (['png', 'jpeg', 'jpg'].indexOf(suffix) < 0) {
                this.$message.error('上传图片只支持 png、jpeg、jpg 格式！')
                this.$refs.upload.clearFiles()
                return false
              }
              if (!size) {
                this.$message.error('上传文件大小不能超过 2MB!')
                return false
              }
              return file
            }
          },

          // 删除
          deleteHandle (type, id) {
            if (type === '批量' && id === null) {
              if (this.checkList.length === 0) {
                this.$message.error('请选择删除对象')
                return
              }
            }
            this.$confirm('确认删除该菜品, 是否继续?', '确定删除', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
            }).then(() => {
              deleteDish(type === '批量' ? this.checkList.join(',') : id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },

          //状态更改
          statusHandle (row) {
            let params = {}
            if (typeof row === 'string' ) {
              if (this.checkList.length === 0) {
                this.$message.error('批量操作，请先勾选操作菜品！')
                return false
              }
              params.id = this.checkList.join(',')
              params.status = row
            } else {
              params.id = row.id
              params.status = row.status ? '0' : '1'
            }
            this.dishState = params
            this.$confirm('确认更改该菜品状态?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
            }).then(() => {
              // 起售停售---批量起售停售接口
              dishStatusByStatus(this.dishState).then(res => {
                if (res.code === 1) {
                  this.$message.success('菜品状态已经更改成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                  this.$message.error('请求失败：' + err)
              })
            })
          },

          // 全部操作
          handleSelectionChange (val){
            let checkArr = []
            val.forEach((n) => {
              checkArr.push(n.id)
            })
            this.checkList = checkArr
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
