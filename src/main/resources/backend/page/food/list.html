<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜品管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
    /* 弹窗口味编辑样式 */
    .flavorBox-dialog {
      border: 1px solid #ebeef5;
      border-radius: 8px;
      padding: 12px;
      background: #fafbfc;
    }
    .flavor-empty-dialog {
      text-align: center;
      padding: 16px;
      color: #c0c4cc;
    }
    .flavor-item-dialog {
      border: 1px solid #e4e7ed;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fff;
    }
    .flavor-header-dialog {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .flavor-header-dialog .flavor-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #409eff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .flavor-tags-dialog {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding-left: 30px;
    }
  </style>
</head>
<body>
   <div class="dashboard-container" id="food-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：卡片可点击筛选，点击后高亮并按对应状态过滤列表 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterBy('status', '')">
          <div class="stat-icon">🍽️</div>
          <div class="stat-label">菜品总数</div>
          <div class="stat-value">{{ stats.totalDishes || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === '1' }" @click="filterBy('status', '1')">
          <div class="stat-icon">✅</div>
          <div class="stat-label">已启售</div>
          <div class="stat-value">{{ stats.activeDishes || 0 }}</div>
        </div>
        <div class="stat-card warning clickable" :class="{ active: activeFilter === '0' }" @click="filterBy('status', '0')">
          <div class="stat-icon">⏸️</div>
          <div class="stat-label">已停售</div>
          <div class="stat-value">{{ stats.inactiveDishes || 0 }}</div>
        </div>
        <div class="stat-card danger clickable" :class="{ active: activeFilter === 'deleted' }" @click="filterBy('status', 'deleted')">
          <div class="stat-icon">🗑️</div>
          <div class="stat-label">已删除</div>
          <div class="stat-value">{{ stats.deletedDishes || 0 }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-input
          v-model="input"
          placeholder="请输入菜品名称"
          class="el-input--wide"
          clearable
          @keyup.enter.native="handleQuery"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="handleQuery"
          ></i>
        </el-input>
        <el-select v-model="categoryId" placeholder="全部分类" clearable style="width: 160px; margin-left: 10px;" @change="handleQuery">
          <el-option v-for="item in categoryOptions" :key="item.id" :label="item.name" :value="item.id"></el-option>
        </el-select>
        <el-button type="primary" size="small" @click="handleQuery">查询</el-button>
        <el-button size="small" @click="reset">重置</el-button>
        <div class="tableLab">
          <el-button type="danger" size="small" @click="deleteHandle('批量', null)">批量删除</el-button>
          <el-button type="success" size="small" @click="statusHandle('1')">批量启售</el-button>
          <el-button type="warning" size="small" @click="statusHandle('0')">批量停售</el-button>
          <el-button type="primary" size="small" @click="addFoodtype('add')">+ 新建菜品</el-button>
          <el-button type="success" size="small" icon="el-icon-download" @click="exportDishes('excel')">导出</el-button>
        </div>
      </div>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
        @selection-change="handleSelectionChange"
      >
        <el-table-column
          type="selection"
          align="center"
          width="50"
        ></el-table-column>
        <el-table-column
          prop="name"
          label="菜品名称"
        ></el-table-column>
        <el-table-column prop="image" label="图片" align="center">
          <template slot-scope="{ row }">
            <el-image style="width: auto; height: 40px; border:none;cursor: pointer; border-radius: 4px;"
            :src="getImage(row.image)"
            :preview-src-list="[ `/common/download?name=${row.image}` ]" >
            <div slot="error" class="image-slot">
              <img src="./../../images/noImg.png"  style="width: auto; height: 40px; border:none; border-radius: 4px;" >
            </div>
          </el-image>
          </template>
        </el-table-column>
        <el-table-column
          prop="categoryName"
          label="菜品分类"
        ></el-table-column>
        <el-table-column label="售价">
          <template slot-scope="scope">
            <span style="margin-right: 10px;">￥{{ scope.row.price/100 }}</span>
          </template>
        </el-table-column>
        <el-table-column label="售卖状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status == '0' ? 'info' : 'success'" size="small">
              {{ scope.row.status == '0' ? '停售' : '启售' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="库存" width="100" align="center">
          <template slot-scope="scope">
            <span :style="{ color: scope.row.stockQty != null && scope.row.minStock != null && scope.row.stockQty <= scope.row.minStock ? '#f56c6c' : '#303133', fontWeight: scope.row.stockQty != null && scope.row.minStock != null && scope.row.stockQty <= scope.row.minStock ? '600' : '400' }">
              {{ scope.row.stockQty != null ? scope.row.stockQty : '-' }}
            </span>
            <el-tag v-if="scope.row.stockQty != null && scope.row.minStock != null && scope.row.stockQty <= scope.row.minStock && scope.row.stockQty > 0" type="danger" size="mini" effect="plain" style="margin-left:4px;">低</el-tag>
            <el-tag v-if="scope.row.stockQty != null && scope.row.stockQty == 0" type="danger" size="mini">售罄</el-tag>
          </template>
        </el-table-column>
        <el-table-column
          prop="updateTime"
          label="最后操作时间"
        >
        </el-table-column>
        <el-table-column
          label="操作"
          align="center"
          width="200"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="addFoodtype(scope.row.id)"
            >修改</el-button>
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="statusHandle(scope.row)"
            >{{ scope.row.status == '0' ? '启售' : '停售' }}</el-button>
            <el-button
              type="text"
              size="small"
              class="delBut non"
              @click="deleteHandle('单删', scope.row.id)"
            >删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 新增/修改菜品弹窗 -->
    <el-dialog
      :title="dishDialog.title"
      :visible.sync="dishDialog.visible"
      width="800px"
      :before-close="handleDialogClose"
      :close-on-click-modal="false"
    >
      <el-form
        ref="dishForm"
        :model="dishForm"
        :rules="dishRules"
        label-width="120px"
      >
        <el-form-item label="菜品名称:" prop="name">
          <el-input v-model="dishForm.name" placeholder="请填写菜品名称" maxlength="20" />
        </el-form-item>
        <el-form-item label="菜品分类:" prop="categoryId">
          <el-select v-model="dishForm.categoryId" placeholder="请选择菜品分类">
            <el-option v-for="item in dishList" :key="item.id" :label="item.name" :value="item.id" />
          </el-select>
        </el-form-item>
        <el-form-item label="菜品价格:" prop="price">
          <el-input v-model="dishForm.price" placeholder="请设置菜品价格" />
        </el-form-item>
        <el-form-item label="菜品图片:" prop="image" class="uploadImg">
          <el-upload
            class="avatar-uploader"
            action="/common/upload"
            :show-file-list="false"
            :on-success="handleAvatarSuccess"
            :on-change="onChange"
            ref="upload"
          >
            <img v-if="dishForm.imageUrl" :src="dishForm.imageUrl" class="avatar" style="border-radius: 4px;"></img>
            <i v-else class="el-icon-plus avatar-uploader-icon"></i>
          </el-upload>
        </el-form-item>
        <el-form-item label="菜品描述:">
          <el-input v-model="dishForm.description" type="textarea" :rows="3" placeholder="菜品描述，最长200字" maxlength="200" />
        </el-form-item>
        <el-form-item label="口味做法:">
          <div class="flavorBox-dialog">
            <div v-if="dishFlavors.length === 0" class="flavor-empty-dialog">
              <el-button type="text" icon="el-icon-plus" @click="addDialogFlavor">添加口味配置</el-button>
            </div>
            <div v-else class="flavor-list-dialog">
              <div v-for="(item, index) in dishFlavors" :key="index" class="flavor-item-dialog">
                <div class="flavor-header-dialog">
                  <span class="flavor-index">{{ index + 1 }}</span>
                  <el-input
                    v-model="item.name"
                    size="small"
                    placeholder="口味名称（如：辣度、温度）"
                    maxlength="10"
                    style="width: 140px;"
                  ></el-input>
                  <el-button type="text" size="small" class="btn-delete" @click="delDialogFlavor(index)">删除</el-button>
                </div>
                <div class="flavor-tags-dialog">
                  <el-tag
                    v-for="(tag, tIdx) in item.value"
                    :key="tIdx"
                    size="small"
                    closable
                    type="info"
                    @close="delDialogFlavorLabel(index, tIdx)"
                  >{{ tag }}</el-tag>
                  <el-input
                    v-if="item.inputVisible"
                    v-model="item.inputValue"
                    size="mini"
                    :ref="'dialogTagInput' + index"
                    style="width: 80px;"
                    maxlength="10"
                    @keyup.enter.native="confirmDialogTag(index)"
                    @blur="confirmDialogTag(index)"
                  ></el-input>
                  <el-button v-else size="mini" type="text" icon="el-icon-plus" @click="showDialogTagInput(index)">添加标签</el-button>
                </div>
              </div>
              <el-button type="text" icon="el-icon-plus" size="small" @click="addDialogFlavor" style="margin-top: 8px;">添加新口味</el-button>
            </div>
          </div>
        </el-form-item>
      </el-form>
      <div slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleDialogClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitDishForm()">确 定</el-button>
        <el-button v-if="dishDialog.actionType == 'add'" type="primary" size="medium" class="continue" @click="submitDishForm('continue')">保存并继续添加</el-button>
      </div>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/food.js"></script>
    <script src="../../api/export.js"></script>
    <script>
      new Vue({
        el: '#food-app',
        data() {
          return {
             input: '',
             counts: 0,
             page: 1,
             pageSize: 10,
             tableData : [],
             loading: false,
             dishState : '',
             checkList: [],
             // 数据统计
             stats: {
               totalDishes: 0,
               activeDishes: 0,
               inactiveDishes: 0,
               deletedDishes: 0
             },
             // 修改点：当前激活的筛选器值，空字符串=全部，对应 stats-card 点击
             activeFilter: '',
             // 搜索分类筛选
             categoryId: '',
             categoryOptions: [],
             // 菜品弹窗相关
             dishDialog: {
               title: '添加菜品',
               visible: false,
               actionType: 'add',
               loading: false
             },
             dishForm: {
               name: '',
               categoryId: '',
               price: '',
               image: '',
               imageUrl: '',
               description: ''
             },
             dishList: [],
             dishFlavors: [],
             dishFlavorsData: [],
             inputStyle: {'flex': 1},
             index: 0
          }
        },
        computed: {
          dishRules() {
            return {
              name: [
                {required: true, message: '请填写菜品名称', trigger: 'blur'}
              ],
              categoryId: [
                {required: true, message: '请选择菜品分类', trigger: 'change'}
              ],
              price: [
                {
                  required: true,
                  validator: (rule, value, callback) => {
                    if (!value) {
                      callback(new Error('请填写菜品价格'))
                    } else {
                      const reg = /^\d+(\.\d{0,2})?$/
                      if (reg.test(value)) {
                        if(value < 10000) {
                          callback()
                        } else {
                          callback(new Error('菜品价格小于10000'))
                        }
                      } else {
                        callback(new Error('菜品价格格式只能为数字,且最多保留两位小数'))
                      }
                    }
                  },
                  trigger: 'blur'
                }
              ]
            }
          }
        },
        created() {
          this.init()
        },
        mounted() {
          this.loadCategoryOptions()
        },
        methods: {
          async init () {
            this.loading = true
            // 并行加载菜品列表和统计数据
            // 修改点：传递 activeFilter 状态参数到后端
            var params = { page: this.page, pageSize: this.pageSize, name: this.input ? this.input : undefined }
            if (this.activeFilter) { params.status = this.activeFilter }
            if (this.categoryId) { params.categoryId = this.categoryId }
            const [dishRes, statsRes] = await Promise.all([
              getDishPage(params),
              this.loadDishStats()
            ])

            // 处理菜品列表数据
            if (String(dishRes.code) === '1') {
              this.tableData = dishRes.data.records || []
              this.counts = dishRes.data.total
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }

            this.loading = false
          },
          // 加载菜品统计数据
          // 修改点：通过拉取全量数据后按状态过滤，获取真实的已启售/已停售/已删除数量
          async loadDishStats() {
            try {
              const [totalRes, listRes] = await Promise.all([
                getDishPage({ page: 1, pageSize: 1 }),
                getDishPage({ page: 1, pageSize: 1000 })
              ])
              if (String(totalRes.code) === '1') {
                var records = listRes.data.records || []
                return {
                  code: 1,
                  data: {
                    totalDishes: totalRes.data.total || 0,
                    // 修改点：后端 Dish.status 为 Integer，JSON 序列化为数字 1/0
                    activeDishes: records.filter(function(r) { return r.status === 1 }).length,
                    inactiveDishes: records.filter(function(r) { return r.status === 0 }).length,
                    deletedDishes: 0  // 逻辑删除，分页接口仅查询未删除数据
                  }
                }
              }
            } catch (err) {
              console.warn('加载菜品统计数据失败:', err)
            }
            return { code: 0 }
          },
          // 加载菜品分类下拉列表（用于表单）
          getDishList () {
            getCategoryList({ type: 1 }).then(res => {
              if (res.code === 1) {
                this.dishList = res.data || []
              }
            }).catch(err => {
              console.error('加载菜品分类失败:', err)
            })
          },
          // 加载搜索筛选的分类选项
          loadCategoryOptions () {
            getCategoryList({ type: 1 }).then(res => {
              if (res.code === 1) {
                this.categoryOptions = res.data || []
              }
            }).catch(err => {
              console.error('加载分类选项失败:', err)
            })
          },
          getImage (image) {
            return `/common/download?name=${image}`
          },
          handleQuery() {
            // 修改点：搜索时清空卡片筛选状态
            this.activeFilter = ''
            this.page = 1;
            this.init();
          },
          // 重置搜索条件，恢复表格初始状态
          reset() {
            this.input = ''
            this.categoryId = ''
            this.activeFilter = ''
            this.page = 1
            this.init()
          },
          // 修改点：stats-card 点击切换筛选状态（清空搜索框避免冲突）
          filterBy(type, value) {
            if (this.activeFilter === value) {
              this.activeFilter = ''  // 再次点击取消筛选，显示全部
            } else {
              this.activeFilter = value
            }
            // 修改点：卡片筛选时清空搜索条件
            this.input = ''
            this.page = 1
            this.init()
          },
          // 打开菜品弹窗
          addFoodtype (st) {
            this.resetDishForm()
            if (st === 'add') {
              this.dishDialog.title = '添加菜品'
              this.dishDialog.actionType = 'add'
              this.dishDialog.visible = true
              this.getDishList()
            } else {
              this.dishDialog.title = '修改菜品'
              this.dishDialog.actionType = 'edit'
              this.dishDialog.visible = true
              this.getDishList()
              this.initDishForm(st)
            }
          },
          // 初始化表单（修改时）
          async initDishForm(id) {
            try {
              const res = await queryDishById(id)
              if (String(res.code) === '1') {
                const data = res.data
                this.dishForm = {
                  id: data.id,
                  name: data.name,
                  categoryId: data.categoryId,
                  price: String(data.price / 100),
                  image: data.image,
                  imageUrl: `/common/download?name=${data.image}`,
                  description: data.description || ''
                }
                // 修改点：安全的 JSON.parse，兼容数据库中 value 为非 JSON 的情况
                this.dishFlavors = data.flavors && data.flavors.map(obj => {
                  let parsedValue = []
                  if (obj.value) {
                    try {
                      parsedValue = JSON.parse(obj.value)
                    } catch(e) {
                      parsedValue = typeof obj.value === 'string' ? obj.value.split(',').map(function(s) { return s.trim() }).filter(Boolean) : [obj.value]
                    }
                  }
                  return { ...obj, value: parsedValue, showOption: false, inputVisible: false, inputValue: '' }
                })
              } else {
                this.$message.error(res.msg || '获取菜品信息失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
          },
          // 重置表单
          resetDishForm() {
            this.dishForm = {
              name: '',
              categoryId: '',
              price: '',
              image: '',
              imageUrl: '',
              description: ''
            }
            this.dishFlavors = []
            if (this.$refs.dishForm) {
              this.$refs.dishForm.resetFields()
            }
          },
          // 关闭弹窗
          handleDialogClose() {
            this.dishDialog.visible = false
            this.resetDishForm()
          },
          // ========== 弹窗口味编辑方法 ==========
          addDialogFlavor() {
            this.dishFlavors.push({ name: '', value: [], inputVisible: false, inputValue: '' })
          },
          delDialogFlavor(index) {
            this.dishFlavors.splice(index, 1)
          },
          delDialogFlavorLabel(index, tIdx) {
            this.dishFlavors[index].value.splice(tIdx, 1)
          },
          showDialogTagInput(index) {
            this.dishFlavors[index].inputVisible = true
            this.$nextTick(() => {
              const ref = this.$refs['dialogTagInput' + index]
              if (ref && ref[0]) ref[0].$refs.input.focus()
            })
          },
          confirmDialogTag(index) {
            const inputValue = this.dishFlavors[index].inputValue
            if (inputValue && inputValue.trim()) {
              const trimmed = inputValue.trim()
              if (!this.dishFlavors[index].value.includes(trimmed)) {
                this.dishFlavors[index].value.push(trimmed)
              }
            }
            this.dishFlavors[index].inputVisible = false
            this.dishFlavors[index].inputValue = ''
          },
          // 提交菜品表单
          submitDishForm(st) {
            this.$refs.dishForm.validate((valid) => {
              if (valid) {
                let params = { ...this.dishForm }
                params.price = params.price * 100
                params.categoryId = params.categoryId
                params.flavors = this.dishFlavors.map(obj => ({
                  ...obj,
                  value: JSON.stringify(obj.value)
                }))
                params.status = 1

                if (!params.image) {
                  this.$message.error('请上传菜品图片')
                  return
                }

                if (this.dishDialog.actionType === 'add') {
                  addDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品添加成功！')
                      this.dishDialog.visible = false
                      this.handleQuery()
                      if (st === 'continue') {
                        this.resetDishForm()
                        this.dishDialog.visible = true
                      }
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                } else {
                  editDish(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('菜品修改成功！')
                      this.dishDialog.visible = false
                      this.handleQuery()
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                }
              }
            })
          },
          // 图片上传成功
          handleAvatarSuccess(response) {
            if (response.code === 0 && response.msg === '未登录') {
              window.top.location.href = '/backend/page/login/login.html'
            } else {
              this.dishForm.imageUrl = `/common/download?name=${response.data}`
              this.dishForm.image = response.data
            }
          },
          // 图片上传校验
          onChange(file) {
            if (file) {
              const suffix = file.name.split('.')[1]
              const size = file.size / 1024 / 1024 < 2
              if (['png', 'jpeg', 'jpg'].indexOf(suffix) < 0) {
                this.$message.error('上传图片只支持 png、jpeg、jpg 格式！')
                this.$refs.upload.clearFiles()
                return false
              }
              if (!size) {
                this.$message.error('上传文件大小不能超过 2MB!')
                return false
              }
              return file
            }
          },

          // 删除
          deleteHandle (type, id) {
            if (type === '批量' && id === null) {
              if (this.checkList.length === 0) {
                this.$message.error('请选择删除对象')
                return
              }
            }
            this.$confirm('确认删除该菜品, 是否继续?', '确定删除', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
            }).then(() => {
              deleteDish(type === '批量' ? this.checkList.join(',') : id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },

          //状态更改
          statusHandle (row) {
            let params = {}
            if (typeof row === 'string' ) {
              if (this.checkList.length === 0) {
                this.$message.error('批量操作，请先勾选操作菜品！')
                return false
              }
              params.id = this.checkList.join(',')
              params.status = row
            } else {
              params.id = row.id
              params.status = row.status ? '0' : '1'
            }
            this.dishState = params
            this.$confirm('确认更改该菜品状态?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
            }).then(() => {
              // 起售停售---批量起售停售接口
              dishStatusByStatus(this.dishState).then(res => {
                if (res.code === 1) {
                  this.$message.success('菜品状态已经更改成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                  this.$message.error('请求失败：' + err)
              })
            })
          },

          // 全部操作
          handleSelectionChange (val){
            let checkArr = []
            val.forEach((n) => {
              checkArr.push(n.id)
            })
            this.checkList = checkArr
          },
          // 导出菜品
          exportDishes(format) {
            try {
              var ext = format === 'excel' ? 'xlsx' : 'pdf'
              var apiCall = format === 'excel'
                ? exportApi.exportDishesExcel({})
                : exportApi.exportDishesPdf({})
              exportApi.downloadFile(apiCall, '菜品数据.' + ext)
              this.$message.success('导出成功，文件已开始下载')
            } catch (err) {
              this.$message.error('导出失败：' + (err.message || err))
            }
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
