<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
  <style>
    #member-app  .notAdmin::after{
      border: 0 !important;

    }

  </style>
</head>
<body>
  <div class="dashboard-container" id="member-app">
    <div class="container">
      <!-- 面包屑导航 -->
      <nav class="ds-breadcrumb" aria-label="面包屑导航">
        <span class="ds-breadcrumb__item">首页</span>
        <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
        <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">员工管理</span>
      </nav>
      <!-- ========== 数据统计卡片（统一组件） ========== -->
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input" placeholder="请选择员工姓名" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading" :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')" @visible-change="onFilterDropdownVisible">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="String(row.status) === '0' ? 'danger' : 'success'" size="small">
            {{ String(row.status) === '0' ? '已禁用' : '正常' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button
            type="text"
            size="small"
            class="btn-view"
            @click="addMemberHandle(row.id)"
            :class="{notAdmin:user !== 'admin'}"
          >编辑</el-button>
          <el-button
            type="text"
            size="small"
            class="btn-delete"
            @click="statusHandle(row)"
            v-if="user === 'admin'"
          >{{ row.status == '1' ? '禁用' : '启用' }}</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 新增/修改员工弹窗 -->
    <!-- 修改点：使用 <crud-dialog> 统一组件替代手写 el-dialog，footer 插槽保留"保存并继续添加" -->
    <crud-dialog
      :title="memberDialog.title"
      :visible.sync="memberDialog.visible"
      size="md"
      :close-on-click-modal="false"
    >
      <el-form
        ref="memberForm"
        :model="memberForm"
        :rules="memberRules"
        label-width="90px"
      >
        <el-form-item label="账号:" prop="username">
          <el-input v-model="memberForm.username" placeholder="请输入账号" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="员工姓名:" prop="name">
          <el-input v-model="memberForm.name" placeholder="请输入员工姓名" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="手机号:" prop="phone">
          <el-input v-model="memberForm.phone" placeholder="请输入手机号" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="性别:" prop="sex">
          <el-radio-group v-model="memberForm.sex">
            <el-radio label="男">男</el-radio>
            <el-radio label="女">女</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="身份证号:" prop="idNumber">
          <el-input v-model="memberForm.idNumber" placeholder="请输入身份证号" maxlength="20" style="width: 293px;" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button size="medium" @click="handleDialogClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitMemberForm()">确 定</el-button>
        <el-button v-if="memberDialog.actionType == 'add'" type="primary" size="medium" class="continue" @click="submitMemberForm('continue')">保存并继续添加</el-button>
      </template>
    </crud-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member.js"></script>
    <script src="../../api/export.js"></script>
    <script src="../../js/validate.js"></script>
    <script src="../../js/components.js"></script>
    <script>
      new Vue({
        el: '#member-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
        data() {
          return {
             input: '',
             // 修改点：搜索下拉框动态选项（从数据库加载员工姓名）
             filterOptions: { names: [] },
             optionsLoading: false,
             optionsLoadError: false,
             counts: 0,
             page: 1,
             pageSize: 10,
             tableData : [],
             // 修改点：<table-bar> 组件配置
             tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 添加员工', type: 'primary' },
            { key: 'export', text: '导出', type: 'success', icon: 'el-icon-download' }
          ],
          // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
          columns: [
            { prop: 'name', label: '员工姓名', minWidth: 100 },
            { prop: 'username', label: '账号', minWidth: 120 },
            { prop: 'phone', label: '手机号', minWidth: 130 },
            { prop: 'status', label: '账号状态', width: 120, align: 'center', slot: true }
          ],
             id : '',
             status : '',
             user : '',
             // 数据统计
             stats: {
               totalEmployees: 0,
               activeEmployees: 0,
               disabledEmployees: 0,
               newThisMonth: 0      // 修改点：本月新入职员工数
             },
             // 修改点：当前激活的筛选器值，空字符串=全部
             activeFilter: '',
             // 员工弹窗相关
             memberDialog: {
               title: '添加员工',
               visible: false,
               actionType: 'add',
               loading: false
             },
             memberForm: {
               username: '',
               name: '',
               phone: '',
               sex: '男',
               idNumber: ''
             }
          }
        },
        computed: {
          memberRules() {
            return {
              username: [
                {required: true, validator: checkUserName, trigger: 'blur'}
              ],
              name: [
                {required: true, validator: checkName, trigger: 'blur'}
              ],
              phone: [
                {required: true, validator: checkPhone, trigger: 'blur'}
              ],
              idNumber: [
                {required: true, validator: validID, trigger: 'blur'}
              ]
            }
          },
          // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
          statsCards() {
            var self = this
            return [
              { key: '',  icon: '👥', label: '员工总数', value: self.stats.totalEmployees || 0, color: 'primary', clickable: true },
              { key: '1', icon: '✅', label: '在职员工', value: self.stats.activeEmployees || 0, color: 'success', clickable: true },
              { key: '0', icon: '🚫', label: '已禁用', value: self.stats.disabledEmployees || 0, color: 'danger', clickable: true },
              { key: '新增', icon: '🆕', label: '本月新入职', value: self.stats.newThisMonth || 0, color: 'info', clickable: false }
            ]
          }
        },
        created() {
          this.loadFilterOptions()
          this.fetchData()
          try {
            const userInfo = localStorage.getItem('userInfo')
            if (userInfo) {
              this.user = JSON.parse(userInfo).username
            }
          } catch (e) {
            console.warn('解析用户信息失败:', e)
          }
        },
        mounted() {
        },
        methods: {
          // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
          async loadFilterOptions() {
            this.optionsLoading = true
            this.optionsLoadError = false
            try {
              const res = await employeeOptions()
              if (String(res.code) === '1' && res.data) {
                this.filterOptions.names = res.data.names || []
              } else {
                this.optionsLoadError = true
                ReggieUI.warning('加载员工选项失败：' + (res.msg || '接口返回异常'))
              }
            } catch (err) {
              // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
              if (err.message === 'NOTLOGIN') {
                return
              }
              this.optionsLoadError = true
              console.error('加载员工选项失败:', err)
              ReggieUI.error('加载筛选选项失败，请刷新页面重试')
            } finally {
              this.optionsLoading = false
            }
          },
          // 修改点：下拉框打开时若之前加载失败，自动重试
          onFilterDropdownVisible(visible) {
              if (visible && this.optionsLoadError) {
                  this.loadFilterOptions()
              }
          },
          async fetchData() {
            // 修改点：传递 activeFilter 状态参数到后端
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input ? this.input : undefined
            }
            if (this.activeFilter) { params.status = this.activeFilter }

            // 并行加载员工列表和统计数据
            const [memberRes, statsRes] = await Promise.all([
              getMemberList(params),
              this.loadMemberStats()
            ])

            // 处理员工列表数据
            if (String(memberRes.code) === '1') {
              this.tableData = memberRes.data.records || []
              this.counts = memberRes.data.total
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          },
          // 加载员工统计数据
          // 修改点：改为调用后端 /employee/stats 聚合接口（count 查询），避免 pageSize:1000 全量拉取与截断风险
          async loadMemberStats() {
            try {
              const res = await getMemberStats()
              if (String(res.code) === '1') {
                return res
              }
            } catch (err) {
              console.warn('加载员工统计数据失败:', err)
            }
            return { code: 0 }
          },
          handleQuery() {
            // 修改点：搜索时清空卡片筛选状态
            this.activeFilter = ''
            this.page = 1;
            this.fetchData();
          },
          // 修改点：<table-bar> 组件 action 按钮事件处理
          onTableAction(payload) {
            if (payload.key === 'add') { this.addMemberHandle('add') }
            else if (payload.key === 'export') { this.exportEmployees('excel') }
          },
          // 重置搜索条件，恢复表格初始状态
          reset() {
            this.input = ''
            this.activeFilter = ''
            this.page = 1
            this.fetchData()
          },
          // 修改点：stat-cards 组件卡片点击事件（替代原 filterBy）
          onCardClick(payload) {
            this.activeFilter = payload.activeKey
            this.input = ''
            this.page = 1
            this.fetchData()
          },
          // 打开员工弹窗
          addMemberHandle (st) {
            this.resetMemberForm()
            if (st === 'add') {
              this.memberDialog.title = '添加员工'
              this.memberDialog.actionType = 'add'
              this.memberDialog.visible = true
            } else {
              this.memberDialog.title = '修改员工'
              this.memberDialog.actionType = 'edit'
              this.memberDialog.visible = true
              this.initMemberForm(st)
            }
          },
          // 初始化表单（修改时）
          async initMemberForm(id) {
            try {
              const res = await queryEmployeeById(id)
              if (String(res.code) === '1') {
                const data = res.data
                this.memberForm = {
                  id: data.id,
                  username: data.username,
                  name: data.name,
                  phone: data.phone,
                  sex: data.sex === '0' ? '女' : '男',
                  idNumber: data.idNumber
                }
              } else {
                ReggieUI.error(res.msg || '获取员工信息失败')
              }
            } catch (err) {
              ReggieUI.error('请求失败：' + err)
            }
          },
          // 重置表单
          resetMemberForm() {
            this.memberForm = {
              username: '',
              name: '',
              phone: '',
              sex: '男',
              idNumber: ''
            }
            if (this.$refs.memberForm) {
              this.$refs.memberForm.resetFields()
            }
          },
          // 关闭弹窗
          handleDialogClose() {
            this.memberDialog.visible = false
            this.resetMemberForm()
          },
          // 提交员工表单
          submitMemberForm(st) {
            this.$refs.memberForm.validate((valid) => {
              if (valid) {
                const params = {
                  ...this.memberForm,
                  sex: this.memberForm.sex === '女' ? '0' : '1'
                }

                if (this.memberDialog.actionType === 'add') {
                  addEmployee(params).then(res => {
                    if (res.code === 1) {
                      ReggieUI.success('员工添加成功！')
                      this.memberDialog.visible = false
                      this.handleQuery()
                      if (st === 'continue') {
                        this.resetMemberForm()
                        this.memberDialog.visible = true
                      }
                    } else {
                      ReggieUI.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    ReggieUI.error('请求失败：' + err)
                  })
                } else {
                  editEmployee(params).then(res => {
                    if (res.code === 1) {
                      ReggieUI.success('员工信息修改成功！')
                      this.memberDialog.visible = false
                      this.handleQuery()
                    } else {
                      ReggieUI.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    ReggieUI.error('请求失败：' + err)
                  })
                }
              }
            })
          },
          //状态修改
          statusHandle (row) {
            this.id = row.id
            this.status = row.status
            ReggieUI.confirm('确认调整该账号的状态?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
              }).then(() => {
              enableOrDisableEmployee({ 'id': this.id, 'status': this.status === '1' ? 0 : 1 }).then(res => {
                if (String(res.code) === '1') {
                  ReggieUI.success('账号状态更改成功！')
                  this.handleQuery()
                }
              }).catch(err => {
                ReggieUI.error('请求失败：' + err)
              })
            })
          },
          // 导出员工数据
          exportEmployees(format) {
            try {
              var ext = format === 'excel' ? 'xlsx' : 'pdf'
              var apiCall = format === 'excel'
                ? exportApi.exportEmployeesExcel({})
                : exportApi.exportEmployeesPdf({})
              exportApi.downloadFile(apiCall, '员工数据.' + ext)
              ReggieUI.success('导出成功，文件已开始下载')
            } catch (err) {
              ReggieUI.error('导出失败：' + (err.message || err))
            }
          },

          // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除
        }
      })
    </script>
</body>
</html>
