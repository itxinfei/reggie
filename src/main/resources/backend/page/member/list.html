<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
    #member-app  .notAdmin::after{
      border: 0 !important;

    }

  </style>
</head>
<body>
  <div class="dashboard-container" id="member-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：卡片可点击筛选，点击后高亮并按对应状态过滤列表 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterBy('status', '')">
          <div class="stat-icon">👥</div>
          <div class="stat-label">员工总数</div>
          <div class="stat-value">{{ stats.totalEmployees || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === '1' }" @click="filterBy('status', '1')">
          <div class="stat-icon">✅</div>
          <div class="stat-label">在职员工</div>
          <div class="stat-value">{{ stats.activeEmployees || 0 }}</div>
        </div>
        <div class="stat-card danger clickable" :class="{ active: activeFilter === '0' }" @click="filterBy('status', '0')">
          <div class="stat-icon">🚫</div>
          <div class="stat-label">已禁用</div>
          <div class="stat-value">{{ stats.disabledEmployees || 0 }}</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">🆕</div>
          <div class="stat-label">本月新入职</div>
          <div class="stat-value">{{ stats.newThisMonth || 0 }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-input
          v-model="input"
          placeholder="请输入员工姓名"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="handleQuery"
          ></i>
        </el-input>
        <el-button type="primary" size="small" class="btn-query" @click="handleQuery">查询</el-button>
        <el-button size="small" class="btn-reset" @click="reset">重置</el-button>
        <el-button
          type="primary"
          @click="addMemberHandle('add')"
        >
          + 添加员工
        </el-button>
        <el-button type="success" size="small" @click="exportEmployees('excel')" icon="el-icon-download">导出</el-button>
      </div>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
      >
        <el-table-column
          prop="name"
          label="员工姓名"
        ></el-table-column>
        <el-table-column
          prop="username"
          label="账号"
        ></el-table-column>
        <el-table-column
          prop="phone"
          label="手机号"
        ></el-table-column>
        <el-table-column label="账号状态">
          <template slot-scope="scope">
            <el-tag :type="String(scope.row.status) === '0' ? 'danger' : 'success'" size="small">
              {{ String(scope.row.status) === '0' ? '已禁用' : '正常' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column
          label="操作"
          width="160"
          align="center"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="btn-view"
              @click="addMemberHandle(scope.row.id)"
              :class="{notAdmin:user !== 'admin'}"
            >编辑</el-button>
            <el-button
              type="text"
              size="small"
              class="btn-delete"
              @click="statusHandle(scope.row)"
              v-if="user === 'admin'"
            >{{ scope.row.status == '1' ? '禁用' : '启用' }}</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 新增/修改员工弹窗 -->
    <el-dialog
      :title="memberDialog.title"
      :visible.sync="memberDialog.visible"
      width="560px"
      :before-close="handleDialogClose"
      :close-on-click-modal="false"
    >
      <el-form
        ref="memberForm"
        :model="memberForm"
        :rules="memberRules"
        label-width="120px"
      >
        <el-form-item label="账号:" prop="username">
          <el-input v-model="memberForm.username" placeholder="请输入账号" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="员工姓名:" prop="name">
          <el-input v-model="memberForm.name" placeholder="请输入员工姓名" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="手机号:" prop="phone">
          <el-input v-model="memberForm.phone" placeholder="请输入手机号" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="性别:" prop="sex">
          <el-radio-group v-model="memberForm.sex">
            <el-radio label="男">男</el-radio>
            <el-radio label="女">女</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="身份证号:" prop="idNumber">
          <el-input v-model="memberForm.idNumber" placeholder="请输入身份证号" maxlength="20" style="width: 293px;" />
        </el-form-item>
      </el-form>
      <div slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleDialogClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitMemberForm()">确 定</el-button>
        <el-button v-if="memberDialog.actionType == 'add'" type="primary" size="medium" class="continue" @click="submitMemberForm('continue')">保存并继续添加</el-button>
      </div>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member.js"></script>
    <script src="../../api/export.js"></script>
    <script src="../../js/validate.js"></script>
    <script>
      new Vue({
        el: '#member-app',
        data() {
          return {
             input: '',
             counts: 0,
             page: 1,
             pageSize: 10,
             tableData : [],
             id : '',
             status : '',
             user : '',
             // 数据统计
             stats: {
               totalEmployees: 0,
               activeEmployees: 0,
               disabledEmployees: 0,
               newThisMonth: 0      // 修改点：本月新入职员工数
             },
             // 修改点：当前激活的筛选器值，空字符串=全部
             activeFilter: '',
             // 员工弹窗相关
             memberDialog: {
               title: '添加员工',
               visible: false,
               actionType: 'add',
               loading: false
             },
             memberForm: {
               username: '',
               name: '',
               phone: '',
               sex: '男',
               idNumber: ''
             }
          }
        },
        computed: {
          memberRules() {
            return {
              username: [
                {required: true, validator: checkUserName, trigger: 'blur'}
              ],
              name: [
                {required: true, validator: checkName, trigger: 'blur'}
              ],
              phone: [
                {required: true, validator: checkPhone, trigger: 'blur'}
              ],
              idNumber: [
                {required: true, validator: validID, trigger: 'blur'}
              ]
            }
          }
        },
        created() {
          this.init()
          try {
            const userInfo = localStorage.getItem('userInfo')
            if (userInfo) {
              this.user = JSON.parse(userInfo).username
            }
          } catch (e) {
            console.warn('解析用户信息失败:', e)
          }
        },
        mounted() {
        },
        methods: {
          async init () {
            // 修改点：传递 activeFilter 状态参数到后端
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input ? this.input : undefined
            }
            if (this.activeFilter) { params.status = this.activeFilter }

            // 并行加载员工列表和统计数据
            const [memberRes, statsRes] = await Promise.all([
              getMemberList(params),
              this.loadMemberStats()
            ])

            // 处理员工列表数据
            if (String(memberRes.code) === '1') {
              this.tableData = memberRes.data.records || []
              this.counts = memberRes.data.total
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          },
          // 加载员工统计数据
          async loadMemberStats() {
            try {
              const res = await getMemberList({ page: 1, pageSize: 1000 })
              if (String(res.code) === '1') {
                const records = res.data.records || []
                const total = res.data.total || 0
                // 修改点：后端 Employee.status 为 Integer，JSON 序列化为数字 1/0
                const activeCount = records.filter(item => item.status === 1).length
                const disabledCount = records.filter(item => item.status === 0).length
                // 修改点：计算本月新入职（根据 createTime）
                const now = new Date()
                const monthPrefix = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0')
                const newThisMonth = records.filter(item => {
                  return item.createTime && String(item.createTime).startsWith(monthPrefix)
                }).length
                return {
                  code: 1,
                  data: {
                    totalEmployees: total,
                    activeEmployees: activeCount,
                    disabledEmployees: disabledCount,
                    newThisMonth: newThisMonth
                  }
                }
              }
            } catch (err) {
              console.warn('加载员工统计数据失败:', err)
            }
            return { code: 0 }
          },
          handleQuery() {
            // 修改点：搜索时清空卡片筛选状态
            this.activeFilter = ''
            this.page = 1;
            this.init();
          },
          // 重置搜索条件，恢复表格初始状态
          reset() {
            this.input = ''
            this.activeFilter = ''
            this.page = 1
            this.init()
          },
          // 修改点：stats-card 点击切换筛选状态（清空搜索框避免冲突）
          filterBy(type, value) {
            if (this.activeFilter === value) {
              this.activeFilter = ''  // 再次点击取消筛选，显示全部
            } else {
              this.activeFilter = value
            }
            // 修改点：卡片筛选时清空搜索条件
            this.input = ''
            this.page = 1
            this.init()
          },
          // 打开员工弹窗
          addMemberHandle (st) {
            this.resetMemberForm()
            if (st === 'add') {
              this.memberDialog.title = '添加员工'
              this.memberDialog.actionType = 'add'
              this.memberDialog.visible = true
            } else {
              this.memberDialog.title = '修改员工'
              this.memberDialog.actionType = 'edit'
              this.memberDialog.visible = true
              this.initMemberForm(st)
            }
          },
          // 初始化表单（修改时）
          async initMemberForm(id) {
            try {
              const res = await queryEmployeeById(id)
              if (String(res.code) === '1') {
                const data = res.data
                this.memberForm = {
                  id: data.id,
                  username: data.username,
                  name: data.name,
                  phone: data.phone,
                  sex: data.sex === '0' ? '女' : '男',
                  idNumber: data.idNumber
                }
              } else {
                this.$message.error(res.msg || '获取员工信息失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
          },
          // 重置表单
          resetMemberForm() {
            this.memberForm = {
              username: '',
              name: '',
              phone: '',
              sex: '男',
              idNumber: ''
            }
            if (this.$refs.memberForm) {
              this.$refs.memberForm.resetFields()
            }
          },
          // 关闭弹窗
          handleDialogClose() {
            this.memberDialog.visible = false
            this.resetMemberForm()
          },
          // 提交员工表单
          submitMemberForm(st) {
            this.$refs.memberForm.validate((valid) => {
              if (valid) {
                const params = {
                  ...this.memberForm,
                  sex: this.memberForm.sex === '女' ? '0' : '1'
                }

                if (this.memberDialog.actionType === 'add') {
                  addEmployee(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('员工添加成功！')
                      this.memberDialog.visible = false
                      this.handleQuery()
                      if (st === 'continue') {
                        this.resetMemberForm()
                        this.memberDialog.visible = true
                      }
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                } else {
                  editEmployee(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('员工信息修改成功！')
                      this.memberDialog.visible = false
                      this.handleQuery()
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                }
              }
            })
          },
          //状态修改
          statusHandle (row) {
            this.id = row.id
            this.status = row.status
            this.$confirm('确认调整该账号的状态?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
              }).then(() => {
              enableOrDisableEmployee({ 'id': this.id, 'status': this.status === '1' ? 0 : 1 }).then(res => {
                if (String(res.code) === '1') {
                  this.$message.success('账号状态更改成功！')
                  this.handleQuery()
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          // 导出员工数据
          exportEmployees(format) {
            try {
              var ext = format === 'excel' ? 'xlsx' : 'pdf'
              var apiCall = format === 'excel'
                ? exportApi.exportEmployeesExcel({})
                : exportApi.exportEmployeesPdf({})
              exportApi.downloadFile(apiCall, '员工数据.' + ext)
              this.$message.success('导出成功，文件已开始下载')
            } catch (err) {
              this.$message.error('导出失败：' + (err.message || err))
            }
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
