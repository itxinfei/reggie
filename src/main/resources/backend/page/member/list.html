<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    #member-app  .notAdmin::after{
      border: 0 !important;

    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="member-app">
    <div class="container">
      <div class="tableBar">
        <el-input
          v-model="input"
          placeholder="请输入员工姓名"
          style="width: 250px"
          clearable
           @keyup.enter.native="handleQuery"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="handleQuery"
          ></i>
        </el-input>
        <el-button
          type="primary"
          @click="addMemberHandle('add')"
        >
          + 添加员工
        </el-button>
      </div>
      <el-table
        :data="tableData"
        stripe
        border
        class="tableBox"
      >
        <el-table-column
          prop="name"
          label="员工姓名"
        ></el-table-column>
        <el-table-column
          prop="username"
          label="账号"
        ></el-table-column>
        <el-table-column
          prop="phone"
          label="手机号"
        ></el-table-column>
        <el-table-column label="账号状态">
          <template slot-scope="scope">
            <el-tag :type="String(scope.row.status) === '0' ? 'danger' : 'success'" size="small">
              {{ String(scope.row.status) === '0' ? '已禁用' : '正常' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column
          label="操作"
          width="160"
          align="center"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="addMemberHandle(scope.row.id)"
              :class="{notAdmin:user !== 'admin'}"
            >
              编辑
            </el-button>
            <el-button
              type="text"
              size="small"
              class="delBut non"
              @click="statusHandle(scope.row)"
              v-if="user === 'admin'"
            >
              {{ scope.row.status == '1' ? '禁用' : '启用' }}
            </el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <!-- 新增/修改员工弹窗 -->
    <el-dialog
      :title="memberDialog.title"
      :visible.sync="memberDialog.visible"
      width="500px"
      :before-close="handleDialogClose"
      :close-on-click-modal="false"
    >
      <el-form
        ref="memberForm"
        :model="memberForm"
        :rules="memberRules"
        label-width="120px"
      >
        <el-form-item label="账号:" prop="username">
          <el-input v-model="memberForm.username" placeholder="请输入账号" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="员工姓名:" prop="name">
          <el-input v-model="memberForm.name" placeholder="请输入员工姓名" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="手机号:" prop="phone">
          <el-input v-model="memberForm.phone" placeholder="请输入手机号" maxlength="20" style="width: 293px;" />
        </el-form-item>
        <el-form-item label="性别:" prop="sex">
          <el-radio-group v-model="memberForm.sex">
            <el-radio label="男">男</el-radio>
            <el-radio label="女">女</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="身份证号:" prop="idNumber">
          <el-input v-model="memberForm.idNumber" placeholder="请输入身份证号" maxlength="20" style="width: 293px;" />
        </el-form-item>
      </el-form>
      <div slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleDialogClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitMemberForm()">确 定</el-button>
        <el-button v-if="memberDialog.actionType == 'add'" type="primary" size="medium" class="continue" @click="submitMemberForm('continue')">保存并继续添加</el-button>
      </div>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/member.js"></script>
    <script>
      new Vue({
        el: '#member-app',
        data() {
          return {
             input: '',
             counts: 0,
             page: 1,
             pageSize: 10,
             tableData : [],
             id : '',
             status : '',
             user : '',
             // 员工弹窗相关
             memberDialog: {
               title: '添加员工',
               visible: false,
               actionType: 'add',
               loading: false
             },
             memberForm: {
               username: '',
               name: '',
               phone: '',
               sex: '男',
               idNumber: ''
             }
          }
        },
        computed: {
          memberRules() {
            return {
              username: [
                {required: true, validator: checkUserName, trigger: 'blur'}
              ],
              name: [
                {required: true, validator: checkName, trigger: 'blur'}
              ],
              phone: [
                {required: true, validator: checkPhone, trigger: 'blur'}
              ],
              idNumber: [
                {required: true, validator: validID, trigger: 'blur'}
              ]
            }
          }
        },
        created() {
          this.init()
          this.user = JSON.parse(localStorage.getItem('userInfo')).username
        },
        mounted() {
        },
        methods: {
          async init () {
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: this.input ? this.input : undefined
            }
            await getMemberList(params).then(res => {
              if (String(res.code) === '1') {
                this.tableData = res.data.records || []
                this.counts = res.data.total
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          },
          handleQuery() {
            this.page = 1;
            this.init();
          },
          // 打开员工弹窗
          addMemberHandle (st) {
            this.resetMemberForm()
            if (st === 'add') {
              this.memberDialog.title = '添加员工'
              this.memberDialog.actionType = 'add'
              this.memberDialog.visible = true
            } else {
              this.memberDialog.title = '修改员工'
              this.memberDialog.actionType = 'edit'
              this.memberDialog.visible = true
              this.initMemberForm(st)
            }
          },
          // 初始化表单（修改时）
          async initMemberForm(id) {
            try {
              const res = await queryEmployeeById(id)
              if (String(res.code) === '1') {
                const data = res.data
                this.memberForm = {
                  id: data.id,
                  username: data.username,
                  name: data.name,
                  phone: data.phone,
                  sex: data.sex === '0' ? '女' : '男',
                  idNumber: data.idNumber
                }
              } else {
                this.$message.error(res.msg || '获取员工信息失败')
              }
            } catch (err) {
              this.$message.error('请求失败：' + err)
            }
          },
          // 重置表单
          resetMemberForm() {
            this.memberForm = {
              username: '',
              name: '',
              phone: '',
              sex: '男',
              idNumber: ''
            }
            if (this.$refs.memberForm) {
              this.$refs.memberForm.resetFields()
            }
          },
          // 关闭弹窗
          handleDialogClose() {
            this.memberDialog.visible = false
            this.resetMemberForm()
          },
          // 提交员工表单
          submitMemberForm(st) {
            this.$refs.memberForm.validate((valid) => {
              if (valid) {
                const params = {
                  ...this.memberForm,
                  sex: this.memberForm.sex === '女' ? '0' : '1'
                }

                if (this.memberDialog.actionType === 'add') {
                  addEmployee(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('员工添加成功！')
                      this.memberDialog.visible = false
                      this.handleQuery()
                      if (st === 'continue') {
                        this.resetMemberForm()
                        this.memberDialog.visible = true
                      }
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                } else {
                  editEmployee(params).then(res => {
                    if (res.code === 1) {
                      this.$message.success('员工信息修改成功！')
                      this.memberDialog.visible = false
                      this.handleQuery()
                    } else {
                      this.$message.error(res.msg || '操作失败')
                    }
                  }).catch(err => {
                    this.$message.error('请求失败：' + err)
                  })
                }
              }
            })
          },
          //状态修改
          statusHandle (row) {
            this.id = row.id
            this.status = row.status
            this.$confirm('确认调整该账号的状态?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
              }).then(() => {
              enableOrDisableEmployee({ 'id': this.id, 'status': !this.status ? 1 : 0 }).then(res => {
                if (String(res.code) === '1') {
                  this.$message.success('账号状态更改成功！')
                  this.handleQuery()
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
