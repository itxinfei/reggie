<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐补管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />
  <link rel="stylesheet" href="../../styles/tokens.css?v=20260926" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260926" />
  <style>
    .grant-tabs { margin-bottom: 4px; }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="subsidy-app">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <h1 class="sr-only" id="page-title">餐补管理</h1>

      <!-- 汇总统计卡片 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
        :show-refresh="true"
        @refresh="loadData()"
      >
        <template slot="search-extra">
          <el-select v-model="departmentId" placeholder="按部门筛选" clearable size="small" class="el-select--narrow-xs" @change="onSearch(lastSearch)">
            <el-option v-for="d in departments" :key="d.id" :label="d.name" :value="d.id"></el-option>
          </el-select>
        </template>
      </table-bar>

      <!-- 账户表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="110"
        row-key="id"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-userName="{ row }">
          <span>{{ row.userName || ('用户#' + row.userId) }}</span>
        </template>
        <template #col-departmentName="{ row }">
          <el-tag v-if="row.departmentName" size="small" type="info">{{ row.departmentName }}</el-tag>
          <span v-else>-</span>
        </template>
        <template #col-balance="{ row }">
          <span style="font-weight:600;">¥{{ Number(row.balance || 0).toFixed(2) }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status == 1 ? 'success' : 'danger'" size="small">
            {{ row.status == 1 ? '正常' : '冻结' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="openGrant(row)">发放</el-button>
          <el-button type="text" size="small" class="btn-view" @click="openRecords(row)">流水</el-button>
        </template>
      </crud-table>
    </main>

    <!-- 发放弹窗 -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      :title="grantForm.title"
      :visible.sync="grantForm.visible"
      :submit-loading="grantSubmitting"
      size="sm"
      @submit="submitGrant"
      @close="grantForm.visible = false"
    >
      <el-form ref="grantFormRef" :model="grantForm" :rules="grantRules" label-width="100px" size="small">
        <el-form-item label="发放对象">
          <el-radio-group v-model="grantForm.mode" class="grant-tabs" :disabled="grantForm.lockTarget">
            <el-radio label="user">单个用户</el-radio>
            <el-radio label="department">按部门</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item v-if="grantForm.mode === 'user'" label="用户" prop="userId">
          <span>{{ grantForm.userName }}</span>
        </el-form-item>
        <el-form-item v-if="grantForm.mode === 'department'" label="部门" prop="departmentId">
          <el-select v-model="grantForm.departmentId" placeholder="选择部门" filterable style="width:100%">
            <el-option v-for="d in departments" :key="d.id" :label="d.name" :value="d.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="发放金额" prop="amount">
          <el-input-number v-model="grantForm.amount" :min="0.01" :precision="2" :step="10"></el-input-number>
          <span class="form-tip">元/人。</span>
        </el-form-item>
        <el-form-item label="备注" prop="remark">
          <el-input v-model="grantForm.remark" type="textarea" :rows="2" placeholder="选填，如：10月餐补" maxlength="200"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 流水弹窗 -->
    <crud-dialog
      :title="recordForm.title"
      :visible.sync="recordForm.visible"
      size="lg"
      :show-submit="false"
      @close="recordForm.visible = false"
    >
      <el-table :data="recordForm.rows" size="small" max-height="380" v-loading="recordForm.loading">
        <el-table-column prop="createTime" label="时间" width="150">
          <template slot-scope="{ row }">{{ (row.createTime || '').replace('T', ' ').substring(0, 19) }}</template>
        </el-table-column>
        <el-table-column prop="recordType" label="类型" width="80" align="center">
          <template slot-scope="{ row }">
            <el-tag size="small" :type="recordTagType(row.recordType)">{{ recordLabel(row.recordType) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="amount" label="金额" width="90" align="center">
          <template slot-scope="{ row }">¥{{ Number(row.amount || 0).toFixed(2) }}</template>
        </el-table-column>
        <el-table-column prop="balanceAfter" label="交易后余额" width="100" align="center">
          <template slot-scope="{ row }">¥{{ Number(row.balanceAfter || 0).toFixed(2) }}</template>
        </el-table-column>
        <el-table-column prop="orderId" label="关联订单" width="90" align="center">
          <template slot-scope="{ row }">{{ row.orderId || '-' }}</template>
        </el-table-column>
        <el-table-column prop="remark" label="备注" min-width="120">
          <template slot-scope="{ row }">{{ row.remark || '-' }}</template>
        </el-table-column>
      </el-table>
    </crud-dialog>
    <!-- 部门对账弹窗：日期范围聚合预览 + Excel 导出 -->
    <crud-dialog
      title="部门对账"
      :visible.sync="reconDialog.visible"
      size="lg"
      :show-submit="false"
      @close="reconDialog.visible = false"
    >
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <el-date-picker v-model="reconDialog.range" type="daterange" size="small"
          value-format="yyyy-MM-dd" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期"
          :clearable="false"></el-date-picker>
        <el-button size="small" type="primary" :loading="reconDialog.loading" @click="loadRecon">查询</el-button>
        <el-button size="small" :disabled="!reconDialog.rows.length" @click="exportRecon">
          <i class="ri-download-2-line"></i> 导出Excel
        </el-button>
      </div>
      <el-table :data="reconDialog.rows" size="small" max-height="380" v-loading="reconDialog.loading">
        <el-table-column prop="departmentName" label="部门" min-width="110"></el-table-column>
        <el-table-column prop="orderCount" label="订单数" width="80" align="center"></el-table-column>
        <el-table-column label="订单金额" width="110" align="center">
          <template slot-scope="{ row }">¥{{ Number(row.orderAmount || 0).toFixed(2) }}</template>
        </el-table-column>
        <el-table-column label="餐补发放" width="110" align="center">
          <template slot-scope="{ row }">¥{{ Number(row.subsidyGranted || 0).toFixed(2) }}</template>
        </el-table-column>
        <el-table-column label="餐补核销" width="110" align="center">
          <template slot-scope="{ row }">¥{{ Number(row.subsidyUsed || 0).toFixed(2) }}</template>
        </el-table-column>
        <el-table-column label="企业自付" width="130" align="center">
          <template slot-scope="{ row }">¥{{ Number(row.selfPay || 0).toFixed(2) }}</template>
        </el-table-column>
      </el-table>
      <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">
        统计口径：有效订单（待接单/配送中/已完成）；企业自付 = 订单金额 − 餐补核销。未挂部门的顾客计入「未分配」。
      </div>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260930"></script>
  <script src="../../js/accessibility-utils.js?v=20260927"></script>
  <script src="../../js/performance-utils.js?v=20260926"></script>
  <script src="../../js/components.js?v=20261002"></script>
  <script src="../../api/subsidy.js?v=20261006"></script>
  <script src="../../api/sys.js?v=20261006"></script>
  <script>
    new Vue({
      el: '#subsidy-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          lastSearch: {},
          departmentId: null,
          departments: [],
          stats: { accountCount: 0, totalBalance: 0, totalGranted: 0, totalUsed: 0 },
          // 搜索配置：手机号模糊
          searchConfig: [
            { type: 'input', field: 'phone', placeholder: '顾客手机号', width: '180px' }
          ],
          actionConfig: [
            { key: 'grant', text: '+ 发放餐补', type: 'primary' },
            { key: 'recon', text: '部门对账', type: 'default' }
          ],
          columns: [
            { prop: 'userName', label: '顾客', width: 110, slot: true },
            { prop: 'phone', label: '手机号', width: 120 },
            { prop: 'departmentName', label: '部门', width: 100, slot: true },
            { prop: 'balance', label: '余额', width: 100, slot: true },
            { prop: 'totalGranted', label: '累计发放', width: 100, align: 'center' },
            { prop: 'totalUsed', label: '累计核销', width: 100, align: 'center' },
            { prop: 'status', label: '状态', width: 80, slot: true }
          ],
          // 发放弹窗
          grantForm: {
            title: '发放餐补', visible: false, mode: 'user', lockTarget: false,
            userId: null, userName: '', departmentId: null, amount: 50, remark: ''
          },
          grantSubmitting: false,
          grantRules: {
            amount: [{ required: true, message: '请输入发放金额', trigger: 'blur' }]
          },
          // 流水弹窗
          recordForm: { title: '餐补流水', visible: false, loading: false, rows: [] },
          // 部门对账弹窗
          reconDialog: {
            visible: false, loading: false, rows: [],
            range: (function () {
              const today = new Date()
              const first = new Date(today.getFullYear(), today.getMonth(), 1)
              const fmt = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
              return [fmt(first), fmt(today)]
            })()
          }
        }
      },
      computed: {
        statsCards: function() {
          const s = this.stats
          return [
            { key: 'accountCount', icon: 'ri-user-heart-line', label: '补贴账户', value: s.accountCount || 0, color: 'primary', clickable: false },
            { key: 'totalBalance', icon: 'ri-wallet-3-line', label: '余额合计', value: '¥' + Number(s.totalBalance || 0).toFixed(2), color: 'success', clickable: false },
            { key: 'totalGranted', icon: 'ri-hand-coin-line', label: '累计发放', value: '¥' + Number(s.totalGranted || 0).toFixed(2), color: 'warning', clickable: false },
            { key: 'totalUsed', icon: 'ri-shopping-bag-3-line', label: '累计核销', value: '¥' + Number(s.totalUsed || 0).toFixed(2), color: 'info', clickable: false }
          ]
        }
      },
      created() {
        this.loadData()
        this.loadStats()
        this.loadDepartments()
      },
      methods: {
        loadData() {
          this.loading = true
          const params = Object.assign({}, this.lastSearch || {}, {
            page: this.page, pageSize: this.pageSize,
            departmentId: this.departmentId || undefined
          })
          subsidyApi.accountPage(params).then((res) => {
            if (res && res.code === 1) {
              this.tableData = (res.data.records || [])
              this.counts = res.data.total || 0
            } else {
              ReggieUI.error((res && res.msg) || '加载餐补账户失败')
            }
          }).catch((err) => {
            if (err.message !== 'NOTLOGIN') ReggieUI.error('加载餐补账户失败，请刷新重试')
          }).finally(() => { this.loading = false })
        },
        loadStats() {
          subsidyApi.accountStats().then((res) => {
            if (res && res.code === 1 && res.data) this.stats = res.data
          }).catch(function () {})
        },
        loadDepartments() {
          sysApi.departmentList().then((res) => {
            if (res && res.code === 1) this.departments = res.data || []
          }).catch(function () {})
        },
        onSearch(params) {
          this.lastSearch = params || {}
          this.page = 1
          this.loadData()
        },
        onReset() {
          this.lastSearch = {}
          this.departmentId = null
          this.page = 1
          this.loadData()
        },
        onAction(key) {
          if (key === 'grant') this.openGrant(null)
          if (key === 'recon') this.openRecon()
        },
        onPageChange(page) {
          this.page = page
          this.loadData()
        },
        onSizeChange(size) {
          this.pageSize = size
          this.page = 1
          this.loadData()
        },
        openGrant(row) {
          this.grantForm.visible = true
          this.grantForm.amount = 50
          this.grantForm.remark = ''
          if (row) {
            // 从账户行发起：锁定单个用户
            this.grantForm.title = '发放餐补'
            this.grantForm.mode = 'user'
            this.grantForm.lockTarget = true
            this.grantForm.userId = row.userId
            this.grantForm.userName = row.userName || ('用户#' + row.userId)
          } else {
            this.grantForm.title = '批量发放餐补'
            this.grantForm.mode = 'department'
            this.grantForm.lockTarget = false
            this.grantForm.userId = null
            this.grantForm.userName = ''
            this.grantForm.departmentId = null
          }
        },
        submitGrant() {
          const self = this
          this.$refs.grantFormRef.validate((valid) => {
            if (!valid) return
            self.grantSubmitting = true
            const payload = {
              amount: self.grantForm.amount,
              remark: self.grantForm.remark || null
            }
            if (self.grantForm.mode === 'department') {
              if (!self.grantForm.departmentId) {
                self.grantSubmitting = false
                ReggieUI.error('请选择部门')
                return
              }
              payload.departmentId = self.grantForm.departmentId
            } else {
              payload.userId = self.grantForm.userId
            }
            subsidyApi.grant(payload).then((res) => {
              self.grantSubmitting = false
              if (res && res.code === 1) {
                ReggieUI.success(res.data || '发放成功')
                self.grantForm.visible = false
                self.loadData()
                self.loadStats()
              } else {
                ReggieUI.error((res && res.msg) || '发放失败')
              }
            }).catch((err) => {
              self.grantSubmitting = false
              if (err.message !== 'NOTLOGIN') ReggieUI.error(err.message || '发放失败，请重试')
            })
          })
        },
        openRecords(row) {
          this.recordForm.title = '餐补流水 · ' + (row.userName || ('用户#' + row.userId))
          this.recordForm.visible = true
          this.recordForm.loading = true
          this.recordForm.rows = []
          subsidyApi.recordPage({ page: 1, pageSize: 50, userId: row.userId }).then((res) => {
            this.recordForm.loading = false
            if (res && res.code === 1) this.recordForm.rows = res.data.records || []
          }).catch(() => { this.recordForm.loading = false })
        },
        recordLabel(type) {
          return { GRANT: '发放', CONSUME: '核销', REFUND: '回充', ADJUST: '调整' }[type] || type
        },
        recordTagType(type) {
          return { GRANT: 'success', CONSUME: 'warning', REFUND: 'info', ADJUST: 'primary' }[type] || 'info'
        },
        openRecon() {
          this.reconDialog.visible = true
          this.loadRecon()
        },
        loadRecon() {
          if (!this.reconDialog.range || this.reconDialog.range.length !== 2) {
            ReggieUI.error('请选择日期范围')
            return
          }
          this.reconDialog.loading = true
          this.reconDialog.rows = []
          subsidyApi.reconciliation({
            startDate: this.reconDialog.range[0],
            endDate: this.reconDialog.range[1]
          }).then((res) => {
            this.reconDialog.loading = false
            if (res && res.code === 1) {
              this.reconDialog.rows = res.data || []
            } else {
              ReggieUI.error((res && res.msg) || '对账数据加载失败')
            }
          }).catch((err) => {
            this.reconDialog.loading = false
            if (err.message !== 'NOTLOGIN') ReggieUI.error(err.message || '对账数据加载失败')
          })
        },
        exportRecon() {
          if (!this.reconDialog.range || this.reconDialog.range.length !== 2) return
          // 同源下载：携带登录会话由 @RequireEmployee 校验
          window.location.href = '/export/subsidy-department/excel?startDate='
            + this.reconDialog.range[0] + '&endDate=' + this.reconDialog.range[1]
        }
      }
    })
  </script>
</body>
</html>
