<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品平台映射 - 瑞吉外卖管理端</title>
  <!-- 修改点：补入 main.css 统一样式入口（原缺失导致全局样式与响应式断点失效） -->
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
</head>
<body>
<a href="#main-content" class="skip-link">跳转到主内容</a>
<div class="dashboard-container" id="dish-mapping-app">
  <div class="container" id="main-content" role="main" aria-label="页面主要内容">
    <!-- 页头：标题 + 营业状态同步 -->
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title">商品平台映射</h1>
        <p class="ds-page-header__subtitle">管理菜品与外卖平台的映射关系，并手动触发上/下架、库存与营业状态同步</p>
      </div>
      <div class="ds-page-header__actions">
        <span class="ds-action-label">营业状态同步：</span>
        <el-select v-model="businessPlatform" placeholder="选择平台" size="small" style="width:130px;margin-right:8px;">
          <el-option label="美团" value="MEITUAN"></el-option>
          <el-option label="饿了么" value="ELEME"></el-option>
          <el-option label="抖音" value="DOUYIN"></el-option>
          <el-option label="自营" value="SELF"></el-option>
          <el-option label="其他" value="OTHER"></el-option>
        </el-select>
        <el-button size="small" type="success" :loading="bizLoading" @click="syncBusiness(true)">设为营业</el-button>
        <el-button size="small" @click="syncBusiness(false)">设为休息</el-button>
      </div>
    </header>

    <!-- 修改点：统计卡片支持点击筛选（点击总数/已上架/已下架按状态过滤数据） -->
    <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

    <!-- 筛选区 -->
    <el-card shadow="never" class="ds-card ds-card--filter">
      <el-form :inline="true" :model="filters" @submit.native.prevent class="ds-filter-form">
        <el-form-item label="平台">
          <el-select v-model="filters.platformType" placeholder="全部平台" clearable size="small" style="width:140px;">
            <el-option label="美团" value="MEITUAN"></el-option>
            <el-option label="饿了么" value="ELEME"></el-option>
            <el-option label="抖音" value="DOUYIN"></el-option>
            <el-option label="自营" value="SELF"></el-option>
            <el-option label="其他" value="OTHER"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="菜品ID">
          <el-input v-model="filters.dishId" placeholder="本系统菜品ID" size="small" clearable style="width:160px;"></el-input>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" size="small" @click="search">查询</el-button>
          <el-button size="small" @click="resetFilters">重置</el-button>
        </el-form-item>
      </el-form>
    </el-card>

    <!-- 映射表格 -->
    <el-card shadow="never" class="ds-card">
      <crud-table
        v-if="loading || tableData.length > 0"
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="200"
        :actions-fixed="true"
        @page-change="handlePageChange"
        @size-change="handleSizeChange"
      >
        <template #col-platformType="{ row }">
          <el-tag size="mini">{{ platformTypeText(row.platformType) }}</el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'info'" size="mini">
            {{ row.status === 1 ? '上架' : '下架' }}
          </el-tag>
        </template>
        <template #col-price="{ row }">
          <span class="ds-money">{{ row.price != null ? '￥' + row.price.toFixed(2) : '-' }}</span>
        </template>
        <template #actions="{ row }">
          <el-button v-if="row.status !== 1" size="mini" type="text" class="btn-view" @click="syncDish(row, 'on_shelf')">上架</el-button>
          <el-button v-if="row.status === 1" size="mini" type="text" class="btn-warning" @click="syncDish(row, 'off_shelf')">下架</el-button>
        </template>
      </crud-table>

      <div v-if="!loading && tableData.length === 0" class="ds-empty">
        暂无菜品平台映射，请先在菜品编辑中建立平台映射
      </div>
    </el-card>
  </div>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/components.js"></script>
<script src="../../api/platform.js"></script>
<script>
  new Vue({
    el: '#dish-mapping-app',
    mixins: [window.ReggieListMixin],
    data() {
      return {
        // 修改点：补声明 tableData —— ReggieListMixin 只提供 page/pageSize/counts/loading，
        // 不含 tableData；此前模板与 statsCards 计算属性直接访问 this.tableData.filter(...)，
        // 首次渲染时为 undefined 触发 TypeError，导致整页渲染失败（白屏）
        tableData: [],
        // 修改点：当前激活的统计卡片 key（'' 全部 / '1' 已上架 / '0' 已下架），点击卡片按状态筛选
        activeFilter: '',
        // 修改点：菜品平台映射统计（总数/已上架/已下架/覆盖平台数），由 /admin/platform/mapping/stats 加载
        stats: {},
        filters: { platformType: '', dishId: '' },
        columns: [
          { prop: 'platformType', label: '平台', width: 100, align: 'center', slot: true },
          { prop: 'dishId', label: '菜品ID', width: 100, align: 'center' },
          { prop: 'platformDishId', label: '平台菜品ID', minWidth: 160, align: 'center' },
          { prop: 'platformShopId', label: '平台门店ID', minWidth: 140, align: 'center' },
          { prop: 'price', label: '平台价', width: 110, align: 'center', type: 'money', slot: true },
          { prop: 'status', label: '状态', width: 80, align: 'center', slot: true }
        ],
        businessPlatform: 'MEITUAN',
        bizLoading: false
      }
    },
    created() {
      this.fetchData()
    },
    computed: {
      // 修改点：4 张可点击统计卡片（总数/已上架/已下架/覆盖平台），点击按状态/维度筛选数据
      statsCards() {
        var s = this.stats || {}
        return [
          { key: '', icon: 'el-icon-shopping-cart-full', label: '映射总数', value: s.total || 0, color: 'primary', clickable: true, active: this.activeFilter === '' },
          { key: '1', icon: 'el-icon-circle-check', label: '已上架', value: s.onlineCount || 0, color: 'success', clickable: true, active: this.activeFilter === '1' },
          { key: '0', icon: 'el-icon-circle-close', label: '已下架', value: s.offlineCount || 0, color: 'info', clickable: true, active: this.activeFilter === '0' },
          { key: '', icon: 'el-icon-office-building', label: '覆盖平台', value: s.platformCount || 0, color: 'warning' }
        ]
      }
    },
    methods: {
      // 修改点：列表数据拉取（后端分页，返回 records/total），reloadStats 控制是否重载统计卡片
      async fetchData(reloadStats) {
        if (reloadStats === undefined) { reloadStats = true }
        this.loading = true
        // 状态筛选：统计卡片 activeFilter（'' 全部 / '1' 已上架 / '0' 已下架）
        var status = this.activeFilter === '' ? undefined : Number(this.activeFilter)
        var params = { page: this.page, pageSize: this.pageSize }
        if (this.filters.platformType) params.platformType = this.filters.platformType
        if (this.filters.dishId) params.dishId = this.filters.dishId
        if (status !== undefined) { params.status = status }
        try {
          var requests = [window.platformApi.mappingPage(params)]
          if (reloadStats) { requests.push(this.loadMappingStats()) }
          var results = await Promise.all(requests)
          var res = results[0]
          if (String(res.code) === '1' && res.data) {
            this.tableData = res.data.records || []
            this.counts = Number(res.data.total) || 0
          } else {
            ReggieUI.error((res && res.msg) || '加载映射失败')
          }
          if (reloadStats) {
            var statsRes = results[1]
            if (statsRes && statsRes.code === 1 && statsRes.data) {
              this.stats = statsRes.data
            }
          }
        } catch (err) {
          if (err.message !== 'NOTLOGIN') {
            ReggieUI.error('加载映射失败，请刷新重试')
          }
        } finally {
          this.loading = false
        }
      },
      // 修改点：加载菜品平台映射统计（总数/已上架/已下架/覆盖平台数），供统计卡片展示
      async loadMappingStats() {
        try {
          var res = await window.platformApi.mappingStats()
          if (res && String(res.code) === '1' && res.data) {
            return { code: 1, data: res.data }
          }
        } catch (err) {
          if (err.message !== 'NOTLOGIN') {
            console.warn('加载映射统计失败:', err)
          }
        }
        return { code: 0 }
      },
      // 修改点：统计卡片点击 — 按状态筛选数据
      onCardClick(payload) {
        this.activeFilter = payload.activeKey
        this.page = 1
        this.fetchData(false)
      },
      search() {
        this.page = 1
        this.fetchData(false)
      },
      resetFilters() {
        this.filters = { platformType: '', dishId: '' }
        this.page = 1
        this.fetchData()
      },
      handlePageChange(p) {
        this.page = p
        this.fetchData(false)
      },
      handleSizeChange(s) {
        this.pageSize = s
        this.page = 1
        this.fetchData(false)
      },
      platformTypeText(type) {
        const map = { MEITUAN: '美团', ELEME: '饿了么', DOUYIN: '抖音', SELF: '自营', OTHER: '其他' }
        return map[type] || type
      },
      // 修改点：同步菜品上/下架到平台（带二次确认 + 成功后更新本地状态）
      syncDish(row, action) {
        const self = this
        const tip = action === 'on_shelf' ? '确认将该菜品上架到 ' + this.platformTypeText(row.platformType) + '？' : '确认将该菜品下架？'
        ReggieUI.confirm(tip, '商品同步', { type: 'warning' }).then(async () => {
          try {
            const res = await window.platformApi.syncDish(row.platformType, row.dishId, action)
            if (res && String(res.code) === '1') {
              ReggieUI.success(action === 'on_shelf' ? '已上架并回传平台' : '已下架并回传平台')
              row.status = action === 'on_shelf' ? 1 : 0
            } else {
              ReggieUI.error((res && res.msg) || '同步失败')
            }
          } catch (err) {
            ReggieUI.error('同步失败，请检查网络或平台配置')
          }
        }).catch((err) => { console.warn('[菜品映射] 菜品同步操作取消或失败:', err) })
      },
      // 修改点：同步营业状态到平台
      async syncBusiness(open) {
        if (!this.businessPlatform) {
          ReggieUI.warning('请先选择平台')
          return
        }
        this.bizLoading = true
        try {
          const res = await window.platformApi.syncBusiness(this.businessPlatform, open)
          if (res && String(res.code) === '1') {
            ReggieUI.success(open ? '已设为营业并同步平台' : '已设为休息并同步平台')
          } else {
            ReggieUI.error((res && res.msg) || '同步失败')
          }
        } catch (err) {
          ReggieUI.error('营业状态同步失败')
        } finally {
          this.bizLoading = false
        }
      }
    }
  })
</script>
<style>
  .ds-filter-form { padding: 4px 0; }
  .ds-action-label { font-size: 14px; color: var(--el-text-secondary); }
  .ds-money { font-variant-numeric: tabular-nums; color: var(--el-text-primary); }
  .ds-empty {
    text-align: center;
    padding: 40px 0;
    color: var(--el-text-secondary);
    font-size: 14px;
  }
</style>
</body>
</html>
