<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="printer-config-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">打印配置</h1>
          <p class="ds-page-header__subtitle">管理打印机设备与纸张</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- ========== 数据统计卡片（统一组件） ========== -->
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="search"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="query.name" placeholder="名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据，请确认已添加打印机')"
            
            @change="search">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
          <el-select v-model="query.brand" placeholder="品牌" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据，请确认已添加打印机')"
            
            @change="search">
            <el-option v-for="b in filterOptions.brands" :key="b" :label="b" :value="b"></el-option>
          </el-select>
          <el-select v-model="query.type" placeholder="连接类型" class="el-select--narrow-xs" clearable size="small"
            @change="search">
            <el-option label="USB" value="USB"></el-option>
            <el-option label="TCP" value="TCP"></el-option>
            <el-option label="CLOUD" value="CLOUD"></el-option>
            <el-option label="BLUETOOTH" value="BLUETOOTH"></el-option>
          </el-select>
          <el-select v-model="query.status" placeholder="状态" class="el-select--narrow-xxs" clearable size="small"
            @change="search">
            <el-option label="启用" :value="1"></el-option>
            <el-option label="停用" :value="0"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10, 20, 30]"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-printTypes="{ row }">
          <el-tag v-for="(t, i) in getPrintTypeTags(row.printTypes)" :key="i"
            size="mini" :type="t.type" style="margin-right:4px;">{{ t.label }}</el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'info'">
            {{ row.status === 1 ? '启用' : '停用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="showEdit(row)">编辑</el-button>
          <el-button type="text" size="small" class="btn-view" @click="handleTest(row)">测试连接</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="handleDelete(row)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 修改点：使用 <crud-dialog> 统一组件替代手写 el-dialog，默认 footer 提供"取消/确定" -->
    <crud-dialog :title="dialog.title" :visible.sync="dialog.visible" :submit-loading="submitting" size="lg" @submit="submit" @close="cancel">
      <el-form ref="form" :model="form" :rules="rules" label-width="100px">
        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" placeholder="请输入打印机名称，如：前台收银机"></el-input>
        </el-form-item>
        <el-form-item label="连接类型" prop="type">
          <el-select v-model="form.type" placeholder="请选择连接类型" style="width:auto;min-width:60%" @change="onTypeChange">
            <el-option label="USB（系统打印机）" value="USB"></el-option>
            <el-option label="TCP（网络打印机）" value="TCP"></el-option>
            <el-option label="CLOUD（云打印）" value="CLOUD"></el-option>
            <el-option label="BLUETOOTH（蓝牙）" value="BLUETOOTH"></el-option>
          </el-select>
        </el-form-item>

        <!-- USB / 系统打印机：从系统已安装列表选择 -->
        <el-form-item v-if="form.type === 'USB'" label="系统打印机" prop="systemPrinterName">
          <div style="display:flex;gap:8px;">
            <el-select v-model="form.systemPrinterName" placeholder="请选择系统已安装的打印机"
              style="flex:1" filterable :loading="loadingPrinters" no-data-text="未找到打印机，请先在系统安装驱动">
              <el-option v-for="p in systemPrinters" :key="p.name" :label="p.name" :value="p.name">
                <span>{{ p.name }}</span>
              </el-option>
            </el-select>
            <el-button @click="fetchSystemPrinters" :loading="loadingPrinters" icon="el-icon-refresh">刷新</el-button>
          </div>
          <div style="color:var(--color-info);font-size:var(--font-size-xs);margin-top:4px;">
            打印机需先在 Windows「设备和打印机」中安装驱动并能正常打印测试页
          </div>
        </el-form-item>

        <!-- TCP：填 IP + 端口 -->
        <template v-if="form.type === 'TCP'">
          <el-form-item label="IP 地址" prop="ipAddress">
            <el-input v-model="form.ipAddress" placeholder="如：192.168.1.100"></el-input>
          </el-form-item>
          <el-form-item label="端口" prop="port">
            <el-input v-model.number="form.port" placeholder="如：9100（大多数热敏打印机默认端口）" type="number"></el-input>
          </el-form-item>
        </template>

        <el-form-item label="品牌型号">
          <el-input v-model="form.brand" placeholder="如：佳博 GP-80250IIN、芯烨 XP-N160II"></el-input>
        </el-form-item>
        <el-form-item label="设备ID">
          <el-input v-model="form.deviceId" placeholder="可选，用于标识设备"></el-input>
        </el-form-item>
        <el-form-item label="纸张大小" prop="paperSize">
          <el-radio-group v-model="form.paperSize">
            <el-radio label="58mm">58mm（小票机常见）</el-radio>
            <el-radio label="80mm">80mm（收银机常见）</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="打印类型">
          <el-checkbox-group v-model="form.printTypeList">
            <el-checkbox label="BILL">小票（收银）</el-checkbox>
            <el-checkbox label="KITCHEN">厨房单</el-checkbox>
            <el-checkbox label="DELIVERY">配送单</el-checkbox>
          </el-checkbox-group>
          <div style="color:var(--color-info);font-size:var(--font-size-xs);margin-top:4px;">勾选后该打印机会接收对应类型的打印任务</div>
        </el-form-item>
        <el-form-item label="排序">
          <el-input-number v-model="form.sort" :min="0" :max="999" controls-position="right"></el-input-number>
        </el-form-item>
        <el-form-item label="状态">
          <el-radio-group v-model="form.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">停用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/printer.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#printer-config-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
      data() {
        return {
          loading: false,
          submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
          query: {
            name: '',
            brand: '',
            type: '',
            status: ''
          },
          counts: 0,
          tableData: [],
          // 数据统计
          // 修改点：<table-bar> 组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增打印机', type: 'primary' }
          ],
          // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
          columns: [
            { prop: 'name', label: '名称', width: 120, showOverflowTooltip: true },
            { prop: 'brand', label: '品牌', width: 80, align: 'center' },
            { prop: 'type', label: '类型', width: 80, align: 'center' },
            { prop: 'ipAddress', label: 'IP地址', width: 120, align: 'center' },
            { prop: 'port', label: '端口', width: 60, align: 'center' },
            { prop: 'printTypes', label: '打印类型', width: 120, slot: true, showOverflowTooltip: true },
            { prop: 'status', label: '状态', width: 70, align: 'center', slot: true }
          ],
          stats: {
            totalPrinters: 0,
            activePrinters: 0,
            inactivePrinters: 0,
            typeCount: 0        // 修改点：连接类型种类数
          },
          // 修改点：当前激活的卡片筛选器值，与 query.status 同步
          activeFilter: '',
          // 修改点：搜索下拉框动态选项（从数据库加载）
          filterOptions: {
            names: [],
            brands: []
          },
          // 修改点：下拉选项加载状态（控制 loading 动画和 no-data-text 提示）
          optionsLoading: false,
          // 修改点：下拉选项加载失败标记（用户可见的错误提示）
          optionsLoadError: false,
          dialog: {
            title: '',
            visible: false,
            action: ''
          },
          systemPrinters: [],
          loadingPrinters: false,
          form: {
            name: '',
            type: 'USB',
            brand: '',
            deviceId: '',
            ipAddress: '',
            port: 9100,
            paperSize: '80mm',
            systemPrinterName: '',
            printTypeList: [],
            sort: 0,
            status: 1
          },
          rules: {
            name: [{ required: true, message: '请输入名称', trigger: 'blur' }],
            type: [{ required: true, message: '请选择连接类型', trigger: 'change' }],
            paperSize: [{ required: true, message: '请选择纸张大小', trigger: 'change' }],
            systemPrinterName: [{ required: false }],
            ipAddress: [{ required: false }]
          }
        }
      },
      created() {
        this.loadFilterOptions()
        this.fetchData(true)
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards() {
          var self = this
          return [
            { key: '', icon: '🖨️', label: '打印机总数', value: self.stats.totalPrinters || 0, color: 'primary', clickable: true },
            { key: '1', icon: '✅', label: '已启用', value: self.stats.activePrinters || 0, color: 'success', clickable: true },
            { key: '0', icon: '⏸️', label: '已停用', value: self.stats.inactivePrinters || 0, color: 'danger', clickable: true },
            { key: '类型', icon: '🔌', label: '连接类型数', value: self.stats.typeCount || 0, color: 'info', clickable: false }
          ]
        }
      },
      methods: {
        // 修改点：加载筛选下拉框选项（名称+品牌，从数据库动态查询）
        // 通用优化方案：设置 loading 状态 + 区分"空数据"与"加载失败" + 提供重试入口
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await printerConfigOptions()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.names || []
              this.filterOptions.brands = res.data.brands || []
            } else {
              this.optionsLoadError = true
              ReggieUI.warning('加载筛选选项失败：' + (res.msg || '接口返回异常'))
            }
          } catch (err) {
            // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
            if (err.message === 'NOTLOGIN') {
              return
            }
            this.optionsLoadError = true
            ReggieUI.error('加载打印机筛选选项失败，请刷新页面重试')
          } finally {
            this.optionsLoading = false
          }
        },
        async fetchData(reloadStats = true) {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            name: this.query.name || undefined,
            brand: this.query.brand || undefined,
            type: this.query.type || undefined,
            status: this.query.status !== '' ? this.query.status : undefined
          }

          // 修改点：F9 性能 — 全局统计与分页列表分离，仅数据突变后重载，翻页/搜索不重算
          const requests = [printerConfigPage(params)]
          if (reloadStats) { requests.push(this.loadPrinterStats()) }
          const results = await Promise.all(requests)
          const printerRes = results[0]

          // 处理打印机列表数据
          if (String(printerRes.code) === '1') {
            this.tableData = printerRes.data.records || []
            this.counts = printerRes.data.total
          } else {
            ReggieUI.error(printerRes.msg || '操作失败')
          }

          if (reloadStats) {
            const statsRes = results[1]
            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
        },
        // 加载打印机统计数据
        // 修改点：改为调用后端 /printer/config/stats SQL 聚合接口，避免 pageSize:1000 拉全量后 filter/Set 统计
        async loadPrinterStats() {
          try {
            const res = await printerConfigStats()
            if (String(res.code) === '1' && res.data) {
              const d = res.data
              return {
                code: 1,
                data: {
                  totalPrinters: Number(d.totalPrinters) || 0,
                  activePrinters: Number(d.activePrinters) || 0,
                  inactivePrinters: Number(d.inactivePrinters) || 0,
                  typeCount: Number(d.typeCount) || 0
                }
              }
            }
          } catch (err) {
            console.warn('加载打印机统计数据失败:', err)
          }
          return { code: 0 }
        },
        search() {
        // 修改点：搜索时清空卡片筛选状态
        this.activeFilter = ''
        this.page = 1
        this.fetchData(false)
      },
        // 修改点：<table-bar> 组件 action 按钮事件处理
        onTableAction(payload) {
          if (payload.key === 'add') { this.showAdd() }
        },
        // 修改点：stat-cards 组件卡片点击事件（替代原 filterByStatus）
        onCardClick(payload) {
          var key = payload.activeKey
          this.activeFilter = key
          // 修改点：query.status 保持为数字类型（后端期望数值型状态参数）
          this.query.status = key === '' ? '' : Number(key)
          this.query.name = ''
          this.query.brand = ''
          this.query.type = ''
          this.page = 1
          this.fetchData(false)
        },
        reset() {
          this.query.name = ''
          this.query.brand = ''
          this.query.type = ''
          this.query.status = ''
          this.search()
        },
        showAdd() {
          this.dialog.title = '新增打印机'
          this.dialog.action = 'add'
          this.resetForm({
            name: '', type: 'USB', brand: '', deviceId: '',
            ipAddress: '', port: 9100, paperSize: '80mm',
            systemPrinterName: '', printTypeList: [], sort: 0, status: 1
          })
          this.dialog.visible = true
          this.fetchSystemPrinters()
        },
        showEdit(row) {
          this.dialog.title = '编辑打印机'
          this.dialog.action = 'edit'
          this.resetForm({
            id: row.id,
            name: row.name,
            type: row.type || 'USB',
            brand: row.brand,
            deviceId: row.deviceId,
            ipAddress: row.ipAddress,
            port: row.port || 9100,
            paperSize: row.paperSize || '80mm',
            systemPrinterName: row.systemPrinterName || '',
            printTypeList: row.printTypes ? row.printTypes.split(',') : [],
            sort: row.sort || 0,
            status: row.status
          })
          this.dialog.visible = true
          if (this.form.type === 'USB') this.fetchSystemPrinters()
        },
        resetForm(defaults) {
          var self = this
          Object.keys(defaults).forEach(function(k) { self.form[k] = defaults[k] })
        },
        fetchSystemPrinters() {
          this.loadingPrinters = true
          var self = this
          listSystemPrinters().then(function(res) {
            if (res && res.code === 1) {
              self.systemPrinters = res.data || []
              if (!self.systemPrinters.length) {
                ReggieUI.warning('未检测到已安装的打印机，请先在 Windows「设备和打印机」安装驱动')
              }
            } else {
              ReggieUI.warning(res ? res.msg : '获取系统打印机失败')
            }
          }).catch(function() {
            ReggieUI.error('获取系统打印机列表失败，请检查后端服务')
          }).finally(function() { self.loadingPrinters = false })
        },
        onTypeChange(val) {
          if (val === 'USB') this.fetchSystemPrinters()
        },
        submit() {
          if (this.submitting) return // 提交防重
          this.$refs.form.validate(valid => {
            if (!valid) return
            this.submitting = true
            const params = {
              name: this.form.name,
              type: this.form.type,
              brand: this.form.brand,
              deviceId: this.form.deviceId,
              systemPrinterName: this.form.systemPrinterName || '',
              ipAddress: this.form.ipAddress,
              port: this.form.port,
              paperSize: this.form.paperSize,
              printTypes: this.form.printTypeList.join(','), // 后端字段: printTypes
              sort: this.form.sort,
              status: this.form.status
            }
            if (this.dialog.action === 'add') {
              addPrinterConfig(params).then(res => {
                this.submitting = false
                if (res.code === 1) {
                  ReggieUI.success('新增成功！')
                  this.dialog.visible = false
                  this.search()
                } else {
                  ReggieUI.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.submitting = false
                ReggieUI.error('请求失败：' + err)
              })
            } else {
              params.id = this.form.id
              updatePrinterConfig(params).then(res => {
                if (res.code === 1) {
                  ReggieUI.success('修改成功！')
                  this.dialog.visible = false
                  this.search()
                } else {
                  ReggieUI.error(res.msg || '操作失败')
                }
              }).catch(err => {
                ReggieUI.error('请求失败：' + err)
              })
            }
          })
        },
        handleTest(row) {
          printerTest(row.id).then(res => {
            if (res.code === 1) {
              ReggieUI.success('连接测试成功！')
            } else {
              ReggieUI.error(res.msg || '连接测试失败')
            }
          }).catch(err => {
            ReggieUI.error('请求失败：' + err)
          })
        },
        handleDelete(row) {
          ReggieUI.confirm('此操作将永久删除该打印机配置, 是否继续?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            deletePrinterConfig(row.id).then(res => {
              if (res.code === 1) {
                ReggieUI.success('删除成功！')
                this.search()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => {
              ReggieUI.error('请求失败：' + err)
            })
          })
        },
        cancel() {
          this.dialog.visible = false
          this.$refs.form.resetFields()
        },
        // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除
        getPrintTypeTags(printTypes) {
          if (!printTypes) return []
          const MAP = {
            'BILL': { label: '小票', type: 'success' },
            'KITCHEN': { label: '厨房', type: 'warning' },
            'DELIVERY': { label: '配送', type: 'primary' }
          }
          return printTypes.split(',').map(t => MAP[t.trim()] || { label: t, type: 'info' })
        }
      }
    })
  </script>
</body>
</html>
