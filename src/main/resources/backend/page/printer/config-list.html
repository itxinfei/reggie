<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="printer-config-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：卡片可点击筛选，点击后同步设置状态下拉框并过滤列表 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterByStatus('')">
          <div class="stat-icon">🖨️</div>
          <div class="stat-label">打印机总数</div>
          <div class="stat-value">{{ stats.totalPrinters || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === 1 }" @click="filterByStatus(1)">
          <div class="stat-icon">✅</div>
          <div class="stat-label">已启用</div>
          <div class="stat-value">{{ stats.activePrinters || 0 }}</div>
        </div>
        <div class="stat-card danger clickable" :class="{ active: activeFilter === 0 }" @click="filterByStatus(0)">
          <div class="stat-icon">⏸️</div>
          <div class="stat-label">已停用</div>
          <div class="stat-value">{{ stats.inactivePrinters || 0 }}</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">🔌</div>
          <div class="stat-label">连接类型数</div>
          <div class="stat-value">{{ stats.typeCount || 0 }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-input v-model="query.name" placeholder="名称" class="el-input--narrow-md" clearable size="small"></el-input>
        <el-input v-model="query.brand" placeholder="品牌" class="el-input--narrow-sm" clearable size="small"></el-input>
        <el-select v-model="query.type" placeholder="连接类型" class="el-select--narrow-sm" clearable size="small">
          <el-option label="USB" value="USB"></el-option>
          <el-option label="TCP" value="TCP"></el-option>
          <el-option label="CLOUD" value="CLOUD"></el-option>
          <el-option label="BLUETOOTH" value="BLUETOOTH"></el-option>
        </el-select>
        <el-select v-model="query.status" placeholder="状态" class="el-select--narrow-xs" clearable size="small">
          <el-option label="启用" :value="1"></el-option>
          <el-option label="停用" :value="0"></el-option>
        </el-select>
        <el-button type="primary" size="small" @click="search">查询</el-button>
        <el-button size="small" @click="reset">重置</el-button>
        <div class="tableLab">
          <el-button type="primary" size="small" @click="showAdd">+ 新增打印机</el-button>
        </div>
      </div>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="名称"></el-table-column>
        <el-table-column prop="brand" label="品牌"></el-table-column>
        <el-table-column prop="type" label="连接类型"></el-table-column>
        <el-table-column prop="ipAddress" label="IP地址"></el-table-column>
        <el-table-column prop="port" label="端口"></el-table-column>
        <el-table-column prop="paperSize" label="纸张大小"></el-table-column>
        <el-table-column label="打印类型">
          <template slot-scope="scope">
            <el-tag v-for="(t, i) in getPrintTypeTags(scope.row.printTypes)" :key="i"
              size="mini" :type="t.type" style="margin-right:4px;">{{ t.label }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 1 ? 'success' : 'info'">
              {{ scope.row.status === 1 ? '启用' : '停用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="240" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="showEdit(scope.row)">编辑</el-button>
            <el-button type="text" size="small" class="blueBug" @click="handleTest(scope.row)">测试连接</el-button>
            <el-button type="text" size="small" class="delBut non" @click="handleDelete(scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30]"
        :page-size="query.pageSize"
        :current-page.sync="query.page"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <el-dialog :title="dialog.title" :visible.sync="dialog.visible" width="720px" :before-close="cancel">
      <el-form ref="form" :model="form" :rules="rules" label-width="120px">
        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" placeholder="请输入打印机名称，如：前台收银机"></el-input>
        </el-form-item>
        <el-form-item label="连接类型" prop="type">
          <el-select v-model="form.type" placeholder="请选择连接类型" style="width:100%" @change="onTypeChange">
            <el-option label="USB（系统打印机）" value="USB"></el-option>
            <el-option label="TCP（网络打印机）" value="TCP"></el-option>
            <el-option label="CLOUD（云打印）" value="CLOUD"></el-option>
            <el-option label="BLUETOOTH（蓝牙）" value="BLUETOOTH"></el-option>
          </el-select>
        </el-form-item>

        <!-- USB / 系统打印机：从系统已安装列表选择 -->
        <el-form-item v-if="form.type === 'USB'" label="系统打印机" prop="systemPrinterName">
          <div style="display:flex;gap:8px;">
            <el-select v-model="form.systemPrinterName" placeholder="请选择系统已安装的打印机"
              style="flex:1" filterable :loading="loadingPrinters" no-data-text="未找到打印机，请先在系统安装驱动">
              <el-option v-for="p in systemPrinters" :key="p.name" :label="p.name" :value="p.name">
                <span>{{ p.name }}</span>
              </el-option>
            </el-select>
            <el-button @click="fetchSystemPrinters" :loading="loadingPrinters" icon="el-icon-refresh">刷新</el-button>
          </div>
          <div style="color:#909399;font-size:12px;margin-top:4px;">
            打印机需先在 Windows「设备和打印机」中安装驱动并能正常打印测试页
          </div>
        </el-form-item>

        <!-- TCP：填 IP + 端口 -->
        <template v-if="form.type === 'TCP'">
          <el-form-item label="IP 地址" prop="ipAddress">
            <el-input v-model="form.ipAddress" placeholder="如：192.168.1.100"></el-input>
          </el-form-item>
          <el-form-item label="端口" prop="port">
            <el-input v-model.number="form.port" placeholder="如：9100（大多数热敏打印机默认端口）" type="number"></el-input>
          </el-form-item>
        </template>

        <el-form-item label="品牌型号">
          <el-input v-model="form.brand" placeholder="如：佳博 GP-80250IIN、芯烨 XP-N160II"></el-input>
        </el-form-item>
        <el-form-item label="设备ID">
          <el-input v-model="form.deviceId" placeholder="可选，用于标识设备"></el-input>
        </el-form-item>
        <el-form-item label="纸张大小" prop="paperSize">
          <el-radio-group v-model="form.paperSize">
            <el-radio label="58mm">58mm（小票机常见）</el-radio>
            <el-radio label="80mm">80mm（收银机常见）</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="打印类型">
          <el-checkbox-group v-model="form.printTypeList">
            <el-checkbox label="BILL">小票（收银）</el-checkbox>
            <el-checkbox label="KITCHEN">厨房单</el-checkbox>
            <el-checkbox label="DELIVERY">配送单</el-checkbox>
          </el-checkbox-group>
          <div style="color:#909399;font-size:12px;margin-top:4px;">勾选后该打印机会接收对应类型的打印任务</div>
        </el-form-item>
        <el-form-item label="排序">
          <el-input-number v-model="form.sort" :min="0" :max="999" controls-position="right"></el-input-number>
        </el-form-item>
        <el-form-item label="状态">
          <el-radio-group v-model="form.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">停用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
      <div slot="footer">
        <el-button @click="cancel">取消</el-button>
        <el-button type="primary" @click="submit">确定</el-button>
      </div>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/printer.js"></script>
  <script>
    new Vue({
      el: '#printer-config-app',
      data() {
        return {
          loading: false,
          query: {
            page: 1,
            pageSize: 10,
            name: '',
            brand: '',
            type: '',
            status: ''
          },
          counts: 0,
          tableData: [],
          // 数据统计
          stats: {
            totalPrinters: 0,
            activePrinters: 0,
            inactivePrinters: 0,
            typeCount: 0        // 修改点：连接类型种类数
          },
          // 修改点：当前激活的卡片筛选器值，与 query.status 同步
          activeFilter: '',
          dialog: {
            title: '',
            visible: false,
            action: ''
          },
          systemPrinters: [],
          loadingPrinters: false,
          form: {
            name: '',
            type: 'USB',
            brand: '',
            deviceId: '',
            ipAddress: '',
            port: 9100,
            paperSize: '80mm',
            systemPrinterName: '',
            printTypeList: [],
            sort: 0,
            status: 1
          },
          rules: {
            name: [{ required: true, message: '请输入名称', trigger: 'blur' }],
            type: [{ required: true, message: '请选择连接类型', trigger: 'change' }],
            paperSize: [{ required: true, message: '请选择纸张大小', trigger: 'change' }],
            systemPrinterName: [{ required: false }],
            ipAddress: [{ required: false }]
          }
        }
      },
      created() {
        this.init()
      },
      methods: {
        async init() {
          const params = {
            page: this.query.page,
            pageSize: this.query.pageSize,
            name: this.query.name || undefined,
            brand: this.query.brand || undefined,
            type: this.query.type || undefined,
            status: this.query.status !== '' ? this.query.status : undefined
          }

          // 并行加载打印机列表和统计数据
          const [printerRes, statsRes] = await Promise.all([
            printerConfigPage(params),
            this.loadPrinterStats()
          ])

          // 处理打印机列表数据
          if (String(printerRes.code) === '1') {
            this.tableData = printerRes.data.records || []
            this.counts = printerRes.data.total
          } else {
            this.$message.error(printerRes.msg || '操作失败')
          }

          // 处理统计数据
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
        },
        // 加载打印机统计数据
        async loadPrinterStats() {
          try {
            const res = await printerConfigPage({ page: 1, pageSize: 1000 })
            if (String(res.code) === '1') {
              const records = res.data.records || []
              const total = res.data.total || 0
              const activeCount = records.filter(item => item.status === 1).length
              const inactiveCount = records.filter(item => item.status === 0).length
              // 修改点：统计连接类型种类数
              const types = new Set()
              records.forEach(function(r) {
                if (r.type) { types.add(r.type) }
              })
              return {
                code: 1,
                data: {
                  totalPrinters: total,
                  activePrinters: activeCount,
                  inactivePrinters: inactiveCount,
                  typeCount: types.size
                }
              }
            }
          } catch (err) {
            console.warn('加载打印机统计数据失败:', err)
          }
          return { code: 0 }
        },
        search() {
          // 修改点：搜索时清空卡片筛选状态
          this.activeFilter = ''
          this.query.page = 1
          this.init()
        },
        // 修改点：stats-card 点击切换启用/停用筛选（清空其他搜索条件，同步状态下拉框）
        filterByStatus(status) {
          if (this.activeFilter === status) {
            this.activeFilter = ''
            this.query.status = ''
          } else {
            this.activeFilter = status
            this.query.status = status
          }
          // 修改点：卡片筛选时清空其他搜索条件
          this.query.name = ''
          this.query.brand = ''
          this.query.type = ''
          this.query.page = 1
          this.init()
        },
        reset() {
          this.query.name = ''
          this.query.brand = ''
          this.query.type = ''
          this.query.status = ''
          this.search()
        },
        showAdd() {
          this.dialog.action = 'add'
          this.dialog.title = '新增打印机'
          this.dialog.visible = true
          this.form = {
            name: '', type: 'USB', brand: '', deviceId: '',
            ipAddress: '', port: 9100, paperSize: '80mm',
            systemPrinterName: '', printTypeList: [], sort: 0, status: 1
          }
          this.fetchSystemPrinters()
        },
        showEdit(row) {
          this.dialog.action = 'edit'
          this.dialog.title = '编辑打印机'
          this.dialog.visible = true
          this.form = {
            id: row.id,
            name: row.name,
            type: row.type || 'USB',
            brand: row.brand,
            deviceId: row.deviceId,
            ipAddress: row.ipAddress,
            port: row.port || 9100,
            paperSize: row.paperSize || '80mm',
            systemPrinterName: row.systemPrinterName || '',
            printTypeList: row.printTypes ? row.printTypes.split(',') : [],
            sort: row.sort || 0,
            status: row.status
          }
          if (this.form.type === 'USB') this.fetchSystemPrinters()
        },
        fetchSystemPrinters() {
          this.loadingPrinters = true
          listSystemPrinters().then(res => {
            if (res.code === 1) {
              this.systemPrinters = res.data || []
              if (!this.systemPrinters.length) {
                this.$message.warning('未检测到已安装的打印机，请先在 Windows「设备和打印机」安装驱动')
              }
            }
          }).catch(() => {}).finally(() => { this.loadingPrinters = false })
        },
        onTypeChange(val) {
          if (val === 'USB') this.fetchSystemPrinters()
        },
        submit() {
          this.$refs.form.validate(valid => {
            if (!valid) return
            const params = {
              name: this.form.name,
              type: this.form.type,
              brand: this.form.brand,
              deviceId: this.form.deviceId,
              systemPrinterName: this.form.systemPrinterName || '',
              ipAddress: this.form.ipAddress,
              port: this.form.port,
              paperSize: this.form.paperSize,
              printTypes: this.form.printTypeList.join(','), // 后端字段: printTypes
              sort: this.form.sort,
              status: this.form.status
            }
            if (this.dialog.action === 'add') {
              addPrinterConfig(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('新增成功！')
                  this.dialog.visible = false
                  this.search()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              params.id = this.form.id
              updatePrinterConfig(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('修改成功！')
                  this.dialog.visible = false
                  this.search()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          })
        },
        handleTest(row) {
          printerTest(row.id).then(res => {
            if (res.code === 1) {
              this.$message.success('连接测试成功！')
            } else {
              this.$message.error(res.msg || '连接测试失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          })
        },
        handleDelete(row) {
          this.$confirm('此操作将永久删除该打印机配置, 是否继续?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            deletePrinterConfig(row.id).then(res => {
              if (res.code === 1) {
                this.$message.success('删除成功！')
                this.search()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        cancel() {
          this.dialog.visible = false
          this.$refs.form.resetFields()
        },
        handleSizeChange(val) {
          this.query.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.query.page = val
          this.init()
        },
        getPrintTypeTags(printTypes) {
          if (!printTypes) return []
          const MAP = {
            'BILL': { label: '小票', type: 'success' },
            'KITCHEN': { label: '厨房', type: 'warning' },
            'DELIVERY': { label: '配送', type: 'primary' }
          }
          return printTypes.split(',').map(t => MAP[t.trim()] || { label: t, type: 'info' })
        }
      }
    })
  </script>
</body>
</html>
