<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="printer-config-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="query.name" placeholder="名称" style="width: 160px" clearable></el-input>
        <el-input v-model="query.brand" placeholder="品牌" style="width: 160px;margin-left:10px" clearable></el-input>
        <el-select v-model="query.type" placeholder="连接类型" style="width: 140px;margin-left:10px" clearable>
          <el-option label="USB" value="USB"></el-option>
          <el-option label="TCP" value="TCP"></el-option>
          <el-option label="CLOUD" value="CLOUD"></el-option>
          <el-option label="BLUETOOTH" value="BLUETOOTH"></el-option>
        </el-select>
        <el-select v-model="query.status" placeholder="状态" style="width: 120px;margin-left:10px" clearable>
          <el-option label="启用" :value="1"></el-option>
          <el-option label="停用" :value="0"></el-option>
        </el-select>
        <el-button type="primary" class="search-btn" @click="search">查询</el-button>
        <el-button @click="reset">重置</el-button>
        <el-button type="primary" @click="showAdd">+ 新增打印机</el-button>
      </div>
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="name" label="名称"></el-table-column>
        <el-table-column prop="brand" label="品牌"></el-table-column>
        <el-table-column prop="type" label="连接类型"></el-table-column>
        <el-table-column prop="ipAddress" label="IP地址"></el-table-column>
        <el-table-column prop="port" label="端口"></el-table-column>
        <el-table-column prop="paperSize" label="纸张大小"></el-table-column>
        <el-table-column prop="printType" label="打印类型"></el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 1 ? 'success' : 'info'">
              {{ scope.row.status === 1 ? '启用' : '停用' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="240" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="showEdit(scope.row)">编辑</el-button>
            <el-button type="text" size="small" class="blueBug" @click="handleTest(scope.row)">测试连接</el-button>
            <el-button type="text" size="small" class="delBut non" @click="handleDelete(scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30]"
        :page-size="query.pageSize"
        :current-page.sync="query.page"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>

    <el-dialog :title="dialog.title" :visible.sync="dialog.visible" width="500px" :before-close="cancel">
      <el-form ref="form" :model="form" :rules="rules" label-width="100px">
        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" placeholder="请输入名称"></el-input>
        </el-form-item>
        <el-form-item label="连接类型" prop="type">
          <el-select v-model="form.type" placeholder="请选择连接类型" style="width:100%">
            <el-option label="USB" value="USB"></el-option>
            <el-option label="TCP" value="TCP"></el-option>
            <el-option label="CLOUD" value="CLOUD"></el-option>
            <el-option label="BLUETOOTH" value="BLUETOOTH"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="品牌" prop="brand">
          <el-input v-model="form.brand" placeholder="请输入品牌"></el-input>
        </el-form-item>
        <el-form-item label="设备ID">
          <el-input v-model="form.deviceId" placeholder="请输入设备ID"></el-input>
        </el-form-item>
        <el-form-item label="IP地址">
          <el-input v-model="form.ipAddress" placeholder="请输入IP地址"></el-input>
        </el-form-item>
        <el-form-item label="端口">
          <el-input v-model.number="form.port" placeholder="请输入端口" type="number"></el-input>
        </el-form-item>
        <el-form-item label="纸张大小" prop="paperSize">
          <el-select v-model="form.paperSize" placeholder="请选择纸张大小" style="width:100%">
            <el-option label="58mm" value="58mm"></el-option>
            <el-option label="80mm" value="80mm"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="打印类型">
          <el-checkbox-group v-model="form.printTypeList">
            <el-checkbox label="receipt">小票</el-checkbox>
            <el-checkbox label="order">订单</el-checkbox>
            <el-checkbox label="kitchen">厨房</el-checkbox>
          </el-checkbox-group>
        </el-form-item>
        <el-form-item label="排序">
          <el-input v-model.number="form.sort" placeholder="请输入排序" type="number"></el-input>
        </el-form-item>
        <el-form-item label="状态">
          <el-radio-group v-model="form.status">
            <el-radio :label="1">启用</el-radio>
            <el-radio :label="0">停用</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
      <div slot="footer">
        <el-button @click="cancel">取消</el-button>
        <el-button type="primary" @click="submit">确定</el-button>
      </div>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/printer.js"></script>
  <script>
    new Vue({
      el: '#printer-config-app',
      data() {
        return {
          query: {
            page: 1,
            pageSize: 10,
            name: '',
            brand: '',
            type: '',
            status: ''
          },
          counts: 0,
          tableData: [],
          dialog: {
            title: '',
            visible: false,
            action: ''
          },
          form: {
            name: '',
            type: '',
            brand: '',
            deviceId: '',
            ipAddress: '',
            port: '',
            paperSize: '',
            printTypeList: [],
            sort: '',
            status: 1
          },
          rules: {
            name: [{ required: true, message: '请输入名称', trigger: 'blur' }],
            type: [{ required: true, message: '请选择连接类型', trigger: 'change' }],
            brand: [{ required: true, message: '请输入品牌', trigger: 'blur' }],
            paperSize: [{ required: true, message: '请选择纸张大小', trigger: 'change' }]
          }
        }
      },
      created() {
        this.init()
      },
      methods: {
        async init() {
          const params = {
            page: this.query.page,
            pageSize: this.query.pageSize,
            name: this.query.name || undefined,
            brand: this.query.brand || undefined,
            type: this.query.type || undefined,
            status: this.query.status !== '' ? this.query.status : undefined
          }
          await printerConfigPage(params).then(res => {
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          })
        },
        search() {
          this.query.page = 1
          this.init()
        },
        reset() {
          this.query.name = ''
          this.query.brand = ''
          this.query.type = ''
          this.query.status = ''
          this.search()
        },
        showAdd() {
          this.dialog.action = 'add'
          this.dialog.title = '新增打印机'
          this.dialog.visible = true
          this.form = {
            name: '',
            type: '',
            brand: '',
            deviceId: '',
            ipAddress: '',
            port: '',
            paperSize: '',
            printTypeList: [],
            sort: '',
            status: 1
          }
        },
        showEdit(row) {
          this.dialog.action = 'edit'
          this.dialog.title = '编辑打印机'
          this.dialog.visible = true
          this.form = {
            id: row.id,
            name: row.name,
            type: row.type,
            brand: row.brand,
            deviceId: row.deviceId,
            ipAddress: row.ipAddress,
            port: row.port,
            paperSize: row.paperSize,
            printTypeList: row.printType ? row.printType.split(',') : [],
            sort: row.sort,
            status: row.status
          }
        },
        submit() {
          this.$refs.form.validate(valid => {
            if (!valid) return
            const params = {
              name: this.form.name,
              type: this.form.type,
              brand: this.form.brand,
              deviceId: this.form.deviceId,
              ipAddress: this.form.ipAddress,
              port: this.form.port,
              paperSize: this.form.paperSize,
              printType: this.form.printTypeList.join(','),
              sort: this.form.sort,
              status: this.form.status
            }
            if (this.dialog.action === 'add') {
              addPrinterConfig(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('新增成功！')
                  this.dialog.visible = false
                  this.search()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              params.id = this.form.id
              updatePrinterConfig(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('修改成功！')
                  this.dialog.visible = false
                  this.search()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          })
        },
        handleTest(row) {
          printerTest(row.id).then(res => {
            if (res.code === 1) {
              this.$message.success('连接测试成功！')
            } else {
              this.$message.error(res.msg || '连接测试失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          })
        },
        handleDelete(row) {
          this.$confirm('此操作将永久删除该打印机配置, 是否继续?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            deletePrinterConfig(row.id).then(res => {
              if (res.code === 1) {
                this.$message.success('删除成功！')
                this.search()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        cancel() {
          this.dialog.visible = false
          this.$refs.form.resetFields()
        },
        handleSizeChange(val) {
          this.query.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.query.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
