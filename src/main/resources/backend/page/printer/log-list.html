<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印日志 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
</head>
<body>
  <div class="dashboard-container" id="printer-log-app">
    <div class="container">
      <!-- 修改点：使用 <stat-cards> 统一组件，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件 -->
      <table-bar
        :search-items="tableSearchItems"
        @search="search"
        @reset="reset">
        <template slot="search-extra">
          <el-input v-model="query.orderId" placeholder="订单号" clearable @keyup.enter.native="search">
            <i slot="prefix" class="el-input__icon el-icon-search" style="cursor:pointer" @click="search"></i>
          </el-input>
          <el-select v-model="query.printType" placeholder="打印类型" clearable @change="search">
            <el-option label="小票" value="BILL"></el-option>
            <el-option label="厨房单" value="KITCHEN"></el-option>
            <el-option label="配送单" value="DELIVERY"></el-option>
          </el-select>
          <el-select v-model="query.status" placeholder="打印状态" clearable @change="search">
            <el-option label="成功" :value="1"></el-option>
            <el-option label="失败" :value="0"></el-option>
          </el-select>
          <el-date-picker v-model="query.dateRange" clearable value-format="yyyy-MM-dd"
            type="daterange" range-separator="至" start-placeholder="开始" end-placeholder="结束" size="small">
          </el-date-picker>
        </template>
      </table-bar>

      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="orderId" label="订单号" width="160"></el-table-column>
        <el-table-column label="打印类型" width="100" align="center">
          <template slot-scope="scope">
            <el-tag :type="printTypeTag(scope.row.printType).type" size="small">
              {{ printTypeTag(scope.row.printType).label }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="printerId" label="打印机ID" width="100" align="center"></el-table-column>
        <el-table-column label="状态" width="90" align="center">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 1 ? 'success' : 'danger'" size="small">
              {{ scope.row.status === 1 ? '成功' : '失败' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="errorMsg" label="错误信息" show-overflow-tooltip></el-table-column>
        <el-table-column prop="createdTime" label="打印时间" width="170"></el-table-column>
        <el-table-column label="操作" width="120" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-view"
              @click="handleReprint(scope.row)">重新打印</el-button>
          </template>
        </el-table-column>
      </el-table>

      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30]"
        :page-size="query.pageSize"
        :current-page.sync="query.page"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/printer.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    const PRINT_TYPE_MAP = {
      'BILL':     { label: '小票',  type: 'success' },
      'KITCHEN':  { label: '厨房单', type: 'warning' },
      'DELIVERY': { label: '配送单', type: 'primary'  }
    }

    new Vue({
      el: '#printer-log-app',
      data() {
        return {
          loading: false,
          query: {
            page: 1,
            pageSize: 10,
            orderId: '',
            printType: '',
            status: '',
            dateRange: []
          },
          counts: 0,
          tableData: [],
          stats: {
            total: 0,
            successCount: 0,
            failCount: 0,
            typeCount: 0
          },
          activeFilter: '',
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: []
        }
      },
      created() {
        this.init()
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: '', icon: '🖨️', label: '打印总次数', value: self.stats.total || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: '1', icon: '✅', label: '打印成功', value: self.stats.successCount || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
            { key: '0', icon: '❌', label: '打印失败', value: self.stats.failCount || 0, color: 'danger', clickable: true, active: self.activeFilter === '0' },
            { key: 'type', icon: '📊', label: '打印类型数', value: self.stats.typeCount || 0, color: 'warning' }
          ]
        }
      },
      methods: {
        // 修改点：<stat-cards> 组件统一卡片点击分发
        onCardClick: function(payload) {
          var key = payload.key;
          if (this.activeFilter === key) {
            this.activeFilter = '';
            this.query.status = '';
          } else {
            this.activeFilter = key;
            this.query.status = key === '' ? '' : Number(key);
          }
          this.search();
        },
        async init() {
          this.loading = true
          var self = this
          var params = {
            page: this.query.page,
            pageSize: this.query.pageSize,
            orderId:   this.query.orderId   || undefined,
            printType: this.query.printType || undefined,
            status:    this.query.status !== '' ? this.query.status : undefined,
            beginTime: this.query.dateRange && this.query.dateRange[0] ? this.query.dateRange[0] : undefined,
            endTime:   this.query.dateRange && this.query.dateRange[1] ? this.query.dateRange[1] : undefined
          }
          try {
            var results = await Promise.all([
              printerLogPage(params),
              self.loadLogStats()
            ])
            var logRes = results[0]
            var statsRes = results[1]
            if (String(logRes.code) === '1') {
              self.tableData = logRes.data.records || []
              self.counts = logRes.data.total
            } else {
              self.$message.error(logRes.msg || '操作失败')
            }
            if (statsRes && String(statsRes.code) === '1') {
              self.stats = statsRes.data || self.stats
            }
          } catch (err) {
            self.$message.error('请求失败：' + (err.message || err))
          }
          self.loading = false
        },
        async loadLogStats() {
          try {
            // 独立查询全部记录以计算准确统计（最多取2000条）
            var res = await printerLogPage({ page: 1, pageSize: 2000 })
            if (String(res.code) === '1') {
              var records = res.data.records || []
              var total = res.data.total || 0
              var successCount = 0, failCount = 0
              var types = {}
              records.forEach(function(r) {
                if (r.status === 1) successCount++
                if (r.status === 0) failCount++
                if (r.printType) types[r.printType] = true
              })
              return { code: 1, data: { total: total, successCount: successCount, failCount: failCount, typeCount: Object.keys(types).length } }
            }
          } catch (err) { console.warn('加载打印日志统计数据失败:', err) }
          return { code: 0 }
        },
        // filterByStatus 已迁移至 onCardClick
        search() {
          this.query.page = 1
          this.init()
        },
        reset() {
          this.query.orderId = ''
          this.query.printType = ''
          this.query.status = ''
          this.query.dateRange = []
          this.activeFilter = ''
          this.search()
        },
        handleReprint(row) {
          var self = this
          this.$confirm('确认重新打印订单 ' + row.orderId + ' 的' + this.printTypeTag(row.printType).label + '？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(function() {
            printerPrint(row.orderId, row.printType).then(function(res) {
              if (res && res.code === 1) {
                self.$message.success('打印任务已发送')
                self.init()
              } else {
                self.$message.error(res ? res.msg : '打印失败')
              }
            }).catch(function(err) {
              self.$message.error('请求失败：' + (err.message || err))
            })
          }).catch(function() { /* 用户取消 */ })
        },
        printTypeTag(type) {
          return PRINT_TYPE_MAP[type] || { label: type || '未知', type: 'info' }
        },
        handleSizeChange(val) {
          this.query.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.query.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
