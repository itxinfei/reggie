<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印日志 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
</head>
<body>
  <div class="dashboard-container" id="printer-log-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterByStatus('')">
          <div class="stat-icon">🖨️</div>
          <div class="stat-label">打印总次数</div>
          <div class="stat-value">{{ stats.total || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === 1 }" @click="filterByStatus(1)">
          <div class="stat-icon">✅</div>
          <div class="stat-label">打印成功</div>
          <div class="stat-value">{{ stats.successCount || 0 }}</div>
        </div>
        <div class="stat-card danger clickable" :class="{ active: activeFilter === 0 }" @click="filterByStatus(0)">
          <div class="stat-icon">❌</div>
          <div class="stat-label">打印失败</div>
          <div class="stat-value">{{ stats.failCount || 0 }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">📊</div>
          <div class="stat-label">打印类型数</div>
          <div class="stat-value">{{ stats.typeCount || 0 }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-input v-model="query.orderId" placeholder="订单号" clearable
          @keyup.enter.native="search">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor:pointer" @click="search"></i>
        </el-input>
        <el-select v-model="query.printType" placeholder="打印类型" clearable>
          <el-option label="小票" value="BILL"></el-option>
          <el-option label="厨房单" value="KITCHEN"></el-option>
          <el-option label="配送单" value="DELIVERY"></el-option>
        </el-select>
        <el-select v-model="query.status" placeholder="打印状态" clearable>
          <el-option label="成功" :value="1"></el-option>
          <el-option label="失败" :value="0"></el-option>
        </el-select>
        <el-date-picker v-model="query.dateRange"
          clearable
          value-format="yyyy-MM-dd"
          type="daterange"
          range-separator="至"
          start-placeholder="开始"
          end-placeholder="结束"
        ></el-date-picker>
        <el-button type="primary" class="btn-query" @click="search">查询</el-button>
        <el-button class="btn-reset" @click="reset">重置</el-button>
      </div>

      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="orderId" label="订单号" width="160"></el-table-column>
        <el-table-column label="打印类型" width="100" align="center">
          <template slot-scope="scope">
            <el-tag :type="printTypeTag(scope.row.printType).type" size="small">
              {{ printTypeTag(scope.row.printType).label }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="printerId" label="打印机ID" width="100" align="center"></el-table-column>
        <el-table-column label="状态" width="90" align="center">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 1 ? 'success' : 'danger'" size="small">
              {{ scope.row.status === 1 ? '成功' : '失败' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="errorMsg" label="错误信息" show-overflow-tooltip></el-table-column>
        <el-table-column prop="createdTime" label="打印时间" width="170"></el-table-column>
        <el-table-column label="操作" width="120" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-view"
              @click="handleReprint(scope.row)">重新打印</el-button>
          </template>
        </el-table-column>
      </el-table>

      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30]"
        :page-size="query.pageSize"
        :current-page.sync="query.page"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/printer.js"></script>
  <script>
    const PRINT_TYPE_MAP = {
      'BILL':     { label: '小票',  type: 'success' },
      'KITCHEN':  { label: '厨房单', type: 'warning' },
      'DELIVERY': { label: '配送单', type: 'primary'  }
    }

    new Vue({
      el: '#printer-log-app',
      data() {
        return {
          loading: false,
          query: {
            page: 1,
            pageSize: 10,
            orderId: '',
            printType: '',
            status: '',
            dateRange: []
          },
          counts: 0,
          tableData: [],
          stats: {
            total: 0,
            successCount: 0,
            failCount: 0,
            typeCount: 0
          },
          activeFilter: ''
        }
      },
      created() {
        this.init()
      },
      methods: {
        async init() {
          this.loading = true
          const params = {
            page: this.query.page,
            pageSize: this.query.pageSize,
            orderId:   this.query.orderId   || undefined,
            printType: this.query.printType || undefined,
            status:    this.query.status !== '' ? this.query.status : undefined,
            beginTime: this.query.dateRange && this.query.dateRange[0] ? this.query.dateRange[0] : undefined,
            endTime:   this.query.dateRange && this.query.dateRange[1] ? this.query.dateRange[1] : undefined
          }
          await printerLogPage(params).then(res => {
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
              this.computeStats(res.data.total, res.data.records)
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          }).finally(() => {
            this.loading = false
          })
        },
        computeStats(total, records) {
          var successCount = 0
          var failCount = 0
          var types = new Set()
          records.forEach(function(r) {
            if (r.status === 1) { successCount++ }
            if (r.status === 0) { failCount++ }
            if (r.printType) { types.add(r.printType) }
          })
          this.stats = {
            total: total,
            successCount: successCount,
            failCount: failCount,
            typeCount: types.size
          }
        },
        filterByStatus(status) {
          this.activeFilter = status
          this.query.status = status
          this.search()
        },
        search() {
          this.query.page = 1
          this.init()
        },
        reset() {
          this.query.orderId = ''
          this.query.printType = ''
          this.query.status = ''
          this.query.dateRange = []
          this.activeFilter = ''
          this.search()
        },
        handleReprint(row) {
          this.$confirm(`确认重新打印订单 ${row.orderId} 的${this.printTypeTag(row.printType).label}？`, '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            printerPrint(row.orderId, row.printType).then(res => {
              if (res.code === 1) {
                this.$message.success('打印任务已发送')
                this.init()
              } else {
                this.$message.error(res.msg || '打印失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        printTypeTag(type) {
          return PRINT_TYPE_MAP[type] || { label: type || '未知', type: 'info' }
        },
        handleSizeChange(val) {
          this.query.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.query.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
