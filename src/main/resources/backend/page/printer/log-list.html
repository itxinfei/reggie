<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印日志 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
</head>
<body>
  <div class="dashboard-container" id="printer-log-app">
    <div class="container">
      <!-- 面包屑导航 -->
      <nav class="ds-breadcrumb" aria-label="面包屑导航">
        <span class="ds-breadcrumb__item">首页</span>
        <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
        <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">打印日志</span>
      </nav>
      <!-- 修改点：使用 <stat-cards> 统一组件，支持点击过滤 -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件 -->
      <table-bar
        :search-items="tableSearchItems"
        @search="search"
        @reset="reset">
        <template slot="search-extra">
          <el-input v-model="query.orderId" placeholder="订单号" clearable @keyup.enter.native="search">
            <i slot="prefix" class="el-input__icon el-icon-search" style="cursor:pointer" @click="search"></i>
          </el-input>
          <el-select v-model="query.printType" placeholder="打印类型" clearable @change="search">
            <el-option label="小票" value="ORDER"></el-option>
            <el-option label="收据" value="RECEIPT"></el-option>
            <el-option label="厨房单" value="KITCHEN"></el-option>
            <el-option label="账单" value="BILL"></el-option>
            <el-option label="配送单" value="DELIVERY"></el-option>
          </el-select>
          <el-select v-model="query.status" placeholder="打印状态" clearable @change="search">
            <el-option label="成功" :value="1"></el-option>
            <el-option label="失败" :value="0"></el-option>
          </el-select>
          <el-date-picker v-model="query.dateRange" clearable value-format="yyyy-MM-dd"
            type="daterange" range-separator="至" start-placeholder="开始" end-placeholder="结束" size="small">
          </el-date-picker>
        </template>
      </table-bar>

      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10, 20, 30]"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="120"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-printType="{ row }">
          <el-tag :type="printTypeTag(row.printType).type" size="small">
            {{ printTypeTag(row.printType).label }}
          </el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'danger'" size="small">
            {{ row.status === 1 ? '成功' : '失败' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view"
            @click="handleReprint(row)">重新打印</el-button>
        </template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/printer.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    // 修改点：补充 ORDER/RECEIPT 类型，使下拉筛选与实际数据库值一致
    const PRINT_TYPE_MAP = {
      'ORDER':    { label: '小票',  type: 'success' },
      'RECEIPT':  { label: '收据',  type: 'warning' },
      'KITCHEN':  { label: '厨房单', type: 'danger'  },
      'BILL':     { label: '账单',  type: 'info' },
      'DELIVERY': { label: '配送单', type: 'primary'  }
    }

    new Vue({
      el: '#printer-log-app',
      // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
      mixins: [window.ReggieListMixin],
      data() {
        return {
          loading: false,
          query: {
            orderId: '',
            printType: '',
            status: '',
            dateRange: []
          },
          counts: 0,
          tableData: [],
          stats: {
            total: 0,
            successCount: 0,
            failCount: 0,
            typeCount: 0
          },
          activeFilter: '',
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [],
          // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
          columns: [
            { prop: 'orderId', label: '订单号', width: 160 },
            { prop: 'printType', label: '打印类型', width: 100, align: 'center', slot: true },
            { prop: 'printerId', label: '打印机ID', width: 100, align: 'center' },
            { prop: 'status', label: '状态', width: 90, align: 'center', slot: true },
            { prop: 'errorMsg', label: '错误信息', minWidth: 160, showOverflowTooltip: true },
            { prop: 'createdTime', label: '打印时间', width: 170 }
          ],
        }
      },
      created() {
        this.fetchData(true)
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards: function() {
          var self = this;
          return [
            { key: '', icon: '🖨️', label: '打印总次数', value: self.stats.total || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: '1', icon: '✅', label: '打印成功', value: self.stats.successCount || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
            { key: '0', icon: '❌', label: '打印失败', value: self.stats.failCount || 0, color: 'danger', clickable: true, active: self.activeFilter === '0' },
            { key: 'type', icon: '📊', label: '打印类型数', value: self.stats.typeCount || 0, color: 'warning' }
          ]
        }
      },
      methods: {
        // 修改点：<stat-cards> 组件统一卡片点击分发（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          var key = payload.activeKey
          this.activeFilter = key
          this.query.status = key === '' ? '' : Number(key)
          this.search()
        },
        // 修改点：F9 性能 — 列表查询与全局统计分离，reloadStats=true 才重算
        async fetchData(reloadStats = true) {
          this.loading = true
          var self = this
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            orderId:   this.query.orderId   || undefined,
            printType: this.query.printType || undefined,
            status:    this.query.status !== '' ? this.query.status : undefined,
            beginTime: this.query.dateRange && this.query.dateRange[0] ? this.query.dateRange[0] : undefined,
            endTime:   this.query.dateRange && this.query.dateRange[1] ? this.query.dateRange[1] : undefined
          }
          try {
          var requests = [printerLogPage(params)]
          if (reloadStats) { requests.push(self.loadLogStats()) }
          var results = await Promise.all(requests)
            var logRes = results[0]
            var statsRes = results[1]
            if (String(logRes.code) === '1') {
              self.tableData = logRes.data.records || []
              self.counts = logRes.data.total
            } else {
              self.$message.error(logRes.msg || '操作失败')
            }
            if (reloadStats) {
              var statsRes = results[1]
              if (statsRes && String(statsRes.code) === '1') {
                self.stats = statsRes.data || self.stats
              }
            }
          } catch (err) {
            self.$message.error('请求失败：' + (err.message || err))
          }
          self.loading = false
        },
        async loadLogStats() {
          try {
            // 修改点：使用 pageSize=1 × 3 并发查询替代 pageSize=2000 拉全量，避免数据截断
            var results = await Promise.all([
              printerLogPage({ page: 1, pageSize: 1 }),
              printerLogPage({ page: 1, pageSize: 1, status: 1 }),
              printerLogPage({ page: 1, pageSize: 1, status: 0 })
            ])
            var totalRes = results[0], successRes = results[1], failRes = results[2]
            var total = 0, successCount = 0, failCount = 0
            if (String(totalRes.code) === '1' && totalRes.data) total = totalRes.data.total || 0
            if (String(successRes.code) === '1' && successRes.data) successCount = successRes.data.total || 0
            if (String(failRes.code) === '1' && failRes.data) failCount = failRes.data.total || 0
            // 类型数：需要单独查询所有打印类型（轻量 distinct 查询由后端支持更佳，此处做简化处理）
            var allRes = await printerLogPage({ page: 1, pageSize: 1 })
            var typeCount = 0  // 暂用后端 distinct 查询，如果数据量大可在后端加 /stats 接口
            if (String(allRes.code) === '1' && allRes.data) {
              // 简单估算：至少有1条数据就至少有1种类型，精确值需后端统计接口
              typeCount = (allRes.data.total || 0) > 0 ? 1 : 0
            }
            return { code: 1, data: { total: total, successCount: successCount, failCount: failCount, typeCount: typeCount } }
          } catch (err) { console.warn('加载打印日志统计数据失败:', err) }
          return { code: 0 }
        },
        // filterByStatus 已迁移至 onCardClick
        search() {
          this.page = 1
          this.fetchData(false)
        },
        reset() {
          this.query.orderId = ''
          this.query.printType = ''
          this.query.status = ''
          this.query.dateRange = []
          this.activeFilter = ''
          this.search()
        },
        handleReprint(row) {
          var self = this
          ReggieUI.confirm('确认重新打印订单 ' + row.orderId + ' 的' + this.printTypeTag(row.printType).label + '？', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(function() {
            printerPrint(row.orderId, row.printType).then(function(res) {
              if (res && res.code === 1) {
                self.$message.success('打印任务已发送')
                self.fetchData(false)
              } else {
                self.$message.error(res ? res.msg : '打印失败')
              }
            }).catch(function(err) {
              self.$message.error('请求失败：' + (err.message || err))
            })
          }).catch(function() { /* 用户取消 */ })
        },
        printTypeTag(type) {
          return PRINT_TYPE_MAP[type] || { label: type || '未知', type: 'info' }
        },
        // 修改点：覆盖 ReggieListMixin 的 onPageChange，传 false 避免翻页时重算全局统计
        onPageChange: function(payload) {
          this.page = payload.page
          this.pageSize = payload.pageSize
          if (typeof this.fetchData === 'function') this.fetchData(false)
        },
        // 修改点：覆盖 ReggieListMixin 的 onSizeChange，因 crud-table 的 size-change 事件只传数字而非 {pageSize: number}；翻页不重算统计
        onSizeChange: function(val) {
          // crud-table 的 size-change 事件 emit 的是纯数字，需要手动设置 pageSize
          this.pageSize = val
          this.page = 1
          if (typeof this.fetchData === 'function') this.fetchData(false)
        },
      }
    })
  </script>
</body>
</html>
