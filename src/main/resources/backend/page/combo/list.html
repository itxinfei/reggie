<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套餐管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/design-system.css" />
</head>
<body>
<div class="dashboard-container" id="combo-app">
  <div class="container">
    <!-- 面包屑导航 -->
    <nav class="ds-breadcrumb" aria-label="面包屑导航">
      <span class="ds-breadcrumb__item">首页</span>
      <span class="ds-breadcrumb__sep" aria-hidden="true">/</span>
      <span class="ds-breadcrumb__item ds-breadcrumb__item--current" aria-current="page">套餐管理</span>
    </nav>
    <!-- 修改点：使用 <stat-cards> 统一组件，支持点击过滤 -->
    <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

    <!-- 修改点：使用 <table-bar> 统一组件 -->
    <table-bar
      :search-items="tableSearchItems"
      :actions="tableActions"
      @search="handleQuery"
      @reset="reset"
      @action="onTableAction">
      <template slot="search-extra">
        <!-- 修改点：修复 el-select 标签缺失闭合 >，添加 @change 触发查询 -->
        <el-select v-model="input" placeholder="请选择套餐名称" class="el-select--narrow-xs" clearable filterable size="small"
          :loading="optionsLoading"
          :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')"
          @change="handleQuery">
          <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
        </el-select>
      </template>
    </table-bar>

    <!-- ========== 数据表格 ========== -->
    <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination，支持多选(@selection-change) -->
    <crud-table
      :data="tableData"
      :columns="columns"
      :page="page"
      :page-size="pageSize"
      :total="counts"
      :loading="loading"
      :selection="true"
      :show-actions="true"
      :actions-width="200"
      @selection-change="handleSelectionChange"
      @page-change="onPageChange"
      @size-change="onSizeChange"
    >
      <template #col-image="{ row }">
        <el-image
          style="width: auto; height: 40px; border: none; cursor: pointer; border-radius: 4px;"
          :src="getImage(row.image)"
          :preview-src-list="[`/common/download?name=${row.image}`]"
        >
          <div slot="error" class="image-slot">
            <img src="./../../images/noImg.png" style="width: auto; height: 40px; border: none; border-radius: 4px;">
          </div>
        </el-image>
      </template>
      <template #col-price="{ row }">
        <span>￥{{ row.price }}</span>
      </template>
      <template #col-description="{ row }">
        <span :title="row.description || ''" style="display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ row.description || '-' }}</span>
      </template>
      <template #col-status="{ row }">
        <el-tag :type="row.status == '0' ? 'info' : 'success'" size="small">
          {{ row.status == '0' ? '停售' : '启售' }}
        </el-tag>
      </template>
      <template #actions="{ row }">
        <el-button type="text" size="small" class="btn-view" @click="addSetMeal(row.id)">修改</el-button>
        <el-button type="text" size="small" class="btn-view" @click="statusHandle(row)">
          {{ row.status == '0' ? '启售' : '停售' }}
        </el-button>
        <el-button type="text" size="small" class="btn-delete" @click="deleteHandle('单删', row.id)">删除</el-button>
      </template>
    </crud-table>
  </div>

  <!-- ========== 新增/修改套餐弹窗 ========== -->
  <!-- 修改点：使用 <crud-dialog> 统一组件替代手写 el-dialog，footer 插槽保留"保存并继续添加" -->
  <crud-dialog
    :title="comboDialog.title"
    :visible.sync="comboDialog.visible"
    size="xl"
    :close-on-click-modal="false"
  >
    <el-form ref="comboForm" :model="comboForm" :rules="comboRules" label-width="90px">
      <el-form-item label="套餐名称:" prop="name">
        <el-input v-model="comboForm.name" placeholder="请填写套餐名称" maxlength="20" />
      </el-form-item>
      <el-form-item label="套餐分类:" prop="categoryId">
        <el-select v-model="comboForm.categoryId" placeholder="请选择套餐分类">
          <el-option v-for="item in comboCategoryList" :key="item.id" :label="item.name" :value="item.id" />
        </el-select>
      </el-form-item>
      <el-form-item label="套餐价格:" prop="price">
        <el-input v-model="comboForm.price" placeholder="请设置套餐价格" />
      </el-form-item>
      <el-form-item label="套餐菜品:" prop="dishList">
        <div class="addDish">
          <span v-if="comboDishTable.length == 0" class="addBut" @click="openDishSelectDialog">+ 添加菜品</span>
          <div v-if="comboDishTable.length != 0" class="content">
            <div class="addBut addBut-mb" @click="openDishSelectDialog">+ 添加菜品</div>
            <div class="table">
              <el-table :data="comboDishTable" border size="small" class="tableBox">
                <el-table-column prop="name" label="名称" width="180" align="center"></el-table-column>
                <el-table-column prop="price" label="原价" width="180">
                  <template slot-scope="scope">￥{{ scope.row.price }}</template>
                </el-table-column>
                <el-table-column prop="copies" label="份数" align="center">
                  <template slot-scope="scope">
                    <el-input-number v-model="scope.row.copies" size="small" :min="1" :max="99" controls-position="right" />
                  </template>
                </el-table-column>
                <el-table-column label="操作" width="120" align="center">
                  <template slot-scope="scope">
                    <el-button type="text" size="small" class="btn-delete" @click="removeComboDish(scope.$index)">删除</el-button>
                  </template>
                </el-table-column>
              </el-table>
            </div>
          </div>
        </div>
      </el-form-item>
      <el-form-item label="套餐图片:" prop="image" class="uploadImg">
        <el-upload
          class="avatar-uploader"
          action="/common/upload"
          :show-file-list="false"
          :on-success="handleComboAvatarSuccess"
          :on-change="onChange"
          ref="comboUpload"
        >
          <img v-if="comboForm.imageUrl" :src="comboForm.imageUrl" class="avatar" style="border-radius: 4px;">
          <i v-else class="el-icon-plus avatar-uploader-icon"></i>
        </el-upload>
      </el-form-item>
      <el-form-item label="套餐描述:">
        <el-input v-model="comboForm.description" type="textarea" :rows="3" placeholder="套餐描述，最长200字" maxlength="200" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button size="medium" @click="handleDialogClose">取 消</el-button>
      <el-button type="primary" size="medium" @click="submitComboForm()">确 定</el-button>
      <el-button v-if="comboDialog.actionType == 'add'" type="primary" size="medium" class="continue" @click="submitComboForm('continue')">保存并继续添加</el-button>
    </template>
  </crud-dialog>

  <!-- ========== 菜品选择弹窗 ========== -->
  <!-- 修改点：使用 <crud-dialog> 统一组件替代手写 el-dialog，footer 插槽保留"取消/确定" -->
  <crud-dialog
    title="添加菜品"
    class="dishSelectDialog"
    :visible.sync="dishSelectDialog.visible"
    size="xl"
    @close="handleDishSelectClose"
  >
    <el-input
      v-model="dishSearchKey"
      class="search-input"
      placeholder="请输入菜品名称进行搜索"
      size="small"
      clearable
      style="width: 250px; margin-bottom: 15px;"
      @input="debounceSearch"
      @keydown.esc="handleSearchEsc"
    >
      <i slot="prefix" class="el-input__icon el-icon-search" @click="searchDish"></i>
    </el-input>

    <div class="dishSelectContent">
      <!-- 左侧：菜品选择区 -->
      <div class="leftCont">
        <div v-show="!dishSearchKey.trim()" class="tabBut">
          <span
            v-for="(item, index) in dishTypeList"
            :key="index"
            :class="{ act: index === activeDishTypeIndex }"
            @click="selectDishType(index, item.id)"
          >{{ item.name }}</span>
        </div>
        <div class="tabList">
          <div class="table">
            <div v-if="dishSelectList.length == 0" class="empty-tip">暂无菜品!</div>
            <el-checkbox-group
              v-if="dishSelectList.length > 0"
              v-model="selectedDishList"
              @change="onDishSelectionChange"
            >
              <div v-for="(item, index) in dishSelectList" :key="index" class="items">
                <el-checkbox :label="item" :key="index">
                  <div class="item">
                    <span class="item-name">{{ item.dishName }}</span>
                    <span>{{ item.status == 0 ? '停售' : '在售' }}</span>
                    <span>￥{{ item.price }}</span>
                  </div>
                </el-checkbox>
              </div>
            </el-checkbox-group>
          </div>
        </div>
      </div>
      <!-- 右侧：已选菜品预览 -->
      <div class="ritCont">
        <div class="tit">已选菜品({{ selectedDishList.length }})</div>
        <div class="items">
          <div v-for="(item, ind) in selectedDishList" :key="ind" class="item">
            <span>{{ item.dishName }}</span>
            <span class="price">￥{{ item.price }}</span>
            <span class="del" @click="removeSelectedDish(ind)">
              <img src="../../images/icons/btn_clean@2x.png" alt="">
            </span>
          </div>
        </div>
      </div>
    </div>

    <template #footer>
      <el-button size="medium" @click="handleDishSelectClose">取 消</el-button>
      <el-button type="primary" size="medium" @click="confirmDishSelection">确 定</el-button>
    </template>
  </crud-dialog>
</div>

<!-- JS 依赖 -->
<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/combo.js"></script>
<script src="../../api/food.js"></script>
<script src="../../js/components.js"></script>

<script>
new Vue({
  el: '#combo-app',
  // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
  mixins: [window.ReggieListMixin],
  data() {
    return {
      input: '',
      // 修改点：搜索下拉框动态选项（从数据库加载套餐名称）
      filterOptions: { names: [] },
      optionsLoading: false,
      optionsLoadError: false,
      counts: 0,
      page: 1,
      pageSize: 10,
      tableData: [],
      loading: false,
      dishState: '',
      checkList: [],
      // 数据统计
      stats: {
        totalCombos: 0,
        activeCombos: 0,
        inactiveCombos: 0,
        comboCategories: 0
      },
      // 当前激活的筛选器值，空字符串 = 全部
      activeFilter: '',
      // 修改点：<table-bar> 统一组件配置
      tableSearchItems: [],
      tableActions: [
        { key: 'batchDelete', text: '批量删除', type: 'danger' },
        { key: 'batchOn', text: '批量启售', type: 'success' },
        { key: 'batchOff', text: '批量停售', type: 'warning' },
        { key: 'add', text: '+ 新建套餐', type: 'primary' }
      ],
      // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
      columns: [
        { prop: 'name', label: '套餐名称', minWidth: 120 },
        { prop: 'image', label: '图片', width: 80, align: 'center', slot: true },
        { prop: 'categoryName', label: '套餐分类', minWidth: 100 },
        { prop: 'price', label: '套餐价', width: 100, align: 'center', slot: true, type: 'money' },
        { prop: 'description', label: '套餐描述', minWidth: 200, slot: true },
        { prop: 'status', label: '售卖状态', width: 100, align: 'center', slot: true },
        { prop: 'updateTime', label: '最后操作时间', minWidth: 160 }
      ],
      // 套餐弹窗
      comboDialog: {
        title: '添加套餐',
        visible: false,
        actionType: 'add',
        loading: false
      },
      comboForm: {
        name: '',
        categoryId: '',
        price: '',
        image: '',
        imageUrl: '',
        description: ''
      },
      comboCategoryList: [],
      comboDishTable: [],
      // 菜品选择弹窗
      dishSelectDialog: {
        visible: false
      },
      dishSearchKey: '',
      dishTypeList: [],
      dishSelectList: [],
      selectedDishList: [],
      activeDishTypeIndex: 0,
      // 搜索防抖定时器
      searchTimer: null
    }
  },
  computed: {
    // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
    statsCards: function() {
      var self = this;
      return [
        { key: '', icon: '🍱', label: '套餐总数', value: self.stats.totalCombos || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
        { key: '1', icon: '✅', label: '已启售', value: self.stats.activeCombos || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
        { key: '0', icon: '⏸️', label: '已停售', value: self.stats.inactiveCombos || 0, color: 'warning', clickable: true, active: self.activeFilter === '0' },
        { key: 'cat', icon: '📊', label: '套餐分类数', value: self.stats.comboCategories || 0, color: 'info' }
      ]
    },
    comboRules() {
      return {
        name: [
          { required: true, message: '请输入套餐名称', trigger: 'blur' }
        ],
        categoryId: [
          { required: true, message: '请选择套餐分类', trigger: 'change' }
        ],
        price: [
          {
            required: true,
            validator: (rule, value, callback) => {
              if (!value) {
                callback(new Error('请设置套餐价格'))
              } else {
                const reg = /^\d+(\.\d{0,2})?$/
                if (reg.test(value)) {
                  if (value < 10000) {
                    callback()
                  } else {
                    callback(new Error('套餐价格小于10000'))
                  }
                } else {
                  callback(new Error('价格格式只能为数字,且最多保留两位小数'))
                }
              }
            },
            trigger: 'blur'
          }
        ]
      }
    }
  },
  created() {
    this.loadFilterOptions()
    this.fetchData()
  },
  methods: {
    // 修改点：<stat-cards> 点击（payload.activeKey 为 .sync 更新后的值）
    onCardClick: function(payload) {
      this.activeFilter = payload.activeKey
      this.input = ''
      this.page = 1
      this.fetchData()
    },
    // 修改点：<table-bar> 组件统一操作分发
    onTableAction: function(payload) {
      if (payload.key === 'batchDelete') { this.deleteHandle('批量'); }
      else if (payload.key === 'batchOn') { this.statusHandle('1'); }
      else if (payload.key === 'batchOff') { this.statusHandle('0'); }
      else if (payload.key === 'add') { this.addSetMeal('add'); }
    },
    // 修改点：通用优化方案 — 加载筛选下拉框选项，带本地缓存
    async loadFilterOptions() {
      // 如果已加载过数据，直接使用缓存
      if (this.filterOptions.names.length > 0) {
        this.optionsLoading = false
        return
      }
      this.optionsLoading = true
      this.optionsLoadError = false
      try {
        const res = await setmealOptions()
        if (String(res.code) === '1' && res.data) {
          this.filterOptions.names = res.data.names || []
        } else {
          this.optionsLoadError = true
          ReggieUI.warning('加载套餐选项失败：' + (res.msg || '接口返回异常'))
        }
      } catch (err) {
        if (err.message === 'NOTLOGIN') {
          return
        }
        this.optionsLoadError = true
        console.error('加载套餐选项失败:', err)
        ReggieUI.error('加载筛选选项失败，请刷新页面重试')
      } finally {
        this.optionsLoading = false
      }
    },
    // ========== 数据加载 ==========
    async fetchData() {
      this.loading = true
      var params = {
        page: this.page,
        pageSize: this.pageSize,
        name: this.input ? this.input : undefined
      }
      if (this.activeFilter) {
        params.status = this.activeFilter
      }
      // 并行加载套餐列表 + 统计数据
      const [comboRes] = await Promise.all([
        getSetmealPage(params),
        this.loadComboStats()
      ])
      if (String(comboRes.code) === '1') {
        this.tableData = comboRes.data.records || []
        this.counts = comboRes.data.total
      }
      this.loading = false
    },

    /**
     * 加载套餐统计数据
     */
    async loadComboStats() {
      try {
        var self = this
        // 修改点：改用 pageSize:1 多状态并发查询取 total，避免 pageSize:1000 拉全量导致统计截断
        const [totalRes, activeRes, inactiveRes, catRes] = await Promise.all([
          getSetmealPage({ page: 1, pageSize: 1 }),
          getSetmealPage({ page: 1, pageSize: 1, status: 1 }),
          getSetmealPage({ page: 1, pageSize: 1, status: 0 }),
          getCategoryList({ type: 2 })
        ])
        if (String(totalRes.code) === '1') {
          var catCount = 0
          try {
            catCount = catRes ? (catRes.data || []).length : 0
          } catch (e) {
            catCount = 0
          }
          this.stats = {
            totalCombos: totalRes.data.total || 0,
            activeCombos: activeRes.data.total || 0,
            inactiveCombos: inactiveRes.data.total || 0,
            comboCategories: catCount
          }
        }
      } catch (err) {
        console.warn('加载套餐统计数据失败:', err)
      }
    },

    getImage(image) {
      return `/common/download?name=${image}`
    },

    // ========== 搜索与筛选 ==========
    handleQuery() {
      this.activeFilter = ''
      this.page = 1
      this.fetchData()
    },

    reset() {
      this.input = ''
      this.activeFilter = ''
      this.page = 1
      this.fetchData()
    },

    // filterBy 已迁移至 onCardClick

    // ========== 分页 ==========
    // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除

    // ========== 多选 ==========
    // 修改点：<crud-table> 多选事件 payload 为 { rows, ids, count }，直接取 ids
    handleSelectionChange(val) {
      this.checkList = val.ids || []
    },

    // ========== 删除 ==========
    deleteHandle(type, id) {
      if (type === '批量' && id === null) {
        if (this.checkList.length === 0) {
          ReggieUI.error('请选择删除对象')
          return
        }
      }
      ReggieUI.confirm('确定删除该套餐, 是否继续?', '确定删除', {
        confirmButtonText: '确定',
        cancelButtonText: '取消',
        type: 'warning'
      }).then(() => {
        deleteSetmeal(type === '批量' ? this.checkList.join(',') : id).then(res => {
          if (res.code === 1) {
            ReggieUI.success('删除成功！')
            this.handleQuery()
          } else {
            ReggieUI.error(res.msg || '操作失败')
          }
        }).catch(err => {
          ReggieUI.error('请求失败：' + err)
        })
      })
    },

    // ========== 状态变更（启售 / 停售） ==========
    statusHandle(row) {
      var params = {}
      if (typeof row === 'string') {
        if (this.checkList.length === 0) {
          ReggieUI.error('批量操作，请先勾选操作套餐！')
          return false
        }
        params.ids = this.checkList.join(',')
        params.status = row
      } else {
        params.ids = row.id
        params.status = row.status ? '0' : '1'
      }
      ReggieUI.confirm('确认更改该套餐状态?', '提示', {
        confirmButtonText: '确定',
        cancelButtonText: '取消',
        type: 'warning'
      }).then(() => {
        setmealStatusByStatus(params).then(res => {
          if (res.code === 1) {
            ReggieUI.success('套餐状态已经更改成功！')
            this.handleQuery()
          } else {
            ReggieUI.error(res.msg || '操作失败')
          }
        }).catch(err => {
          ReggieUI.error('请求失败：' + err)
        })
      })
    },

    // ========== 新增 / 修改套餐弹窗 ==========
    addSetMeal(st) {
      this.resetComboForm()
      if (st === 'add') {
        this.comboDialog.title = '添加套餐'
        this.comboDialog.actionType = 'add'
        this.comboDialog.visible = true
        this.getComboCategoryList()
      } else {
        this.comboDialog.title = '修改套餐'
        this.comboDialog.actionType = 'edit'
        this.comboDialog.visible = true
        this.getComboCategoryList()
        this.initComboForm(st)
      }
    },

    resetComboForm() {
      this.comboForm = {
        name: '',
        categoryId: '',
        price: '',
        image: '',
        imageUrl: '',
        description: ''
      }
      this.comboDishTable = []
      if (this.$refs.comboForm) {
        this.$refs.comboForm.resetFields()
      }
    },

    async initComboForm(id) {
      try {
        const res = await querySetmealById(id)
        if (String(res.code) === '1') {
          var data = res.data
          this.comboForm = {
            id: data.id,
            name: data.name,
            categoryId: data.categoryId,
            price: String(data.price),
            image: data.image,
            imageUrl: `/common/download?name=${data.image}`,
            description: data.description || ''
          }
          this.comboDishTable = (data.setmealDishes || []).map(function (obj) {
            return {
              copies: obj.copies,
              dishId: obj.dishId || obj.id,
              name: obj.name,
              price: obj.price
            }
          })
        } else {
          ReggieUI.error(res.msg || '获取套餐信息失败')
        }
      } catch (err) {
        ReggieUI.error('请求失败：' + err)
      }
    },

    handleDialogClose() {
      this.comboDialog.visible = false
      this.resetComboForm()
    },

    submitComboForm(st) {
      var self = this
      this.$refs.comboForm.validate(function (valid) {
        if (valid) {
          var params = { ...self.comboForm }
          params.setmealDishes = self.comboDishTable.map(function (obj) {
            return {
              copies: obj.copies,
              dishId: obj.dishId || obj.id,
              name: obj.name,
              price: obj.price
            }
          })
          params.status = 1

          if (params.setmealDishes.length < 1) {
            self.$message.error('请选择菜品！')
            return
          }
          if (!params.image) {
            self.$message.error('请上传套餐图片')
            return
          }

          if (self.comboDialog.actionType === 'add') {
            addSetmeal(params).then(function (res) {
              if (res.code === 1) {
                self.$message.success('套餐添加成功！')
                self.comboDialog.visible = false
                self.handleQuery()
                if (st === 'continue') {
                  self.resetComboForm()
                  self.comboDialog.visible = true
                }
              } else {
                self.$message.error(res.msg || '操作失败')
              }
            }).catch(function (err) {
              self.$message.error('请求失败：' + err)
            })
          } else {
            editSetmeal(params).then(function (res) {
              if (res.code === 1) {
                self.$message.success('套餐修改成功！')
                self.comboDialog.visible = false
                self.handleQuery()
              } else {
                self.$message.error(res.msg || '操作失败')
              }
            }).catch(function (err) {
              self.$message.error('请求失败：' + err)
            })
          }
        }
      })
    },

    // ========== 图片上传 ==========
    handleComboAvatarSuccess(response) {
      if (response.code === 0 && response.msg === '未登录') {
        window.top.location.href = '/backend/page/login/login.html'
      } else {
        this.comboForm.imageUrl = `/common/download?name=${response.data}`
        this.comboForm.image = response.data
      }
    },

    onChange(file) {
      if (file) {
        var suffix = file.name.split('.')[1]
        var size = file.size / 1024 / 1024 < 2
        if (['png', 'jpeg', 'jpg'].indexOf(suffix) < 0) {
          ReggieUI.error('上传图片只支持 png、jpeg、jpg 格式！')
          this.$refs.comboUpload.clearFiles()
          return false
        }
        if (!size) {
          ReggieUI.error('上传文件大小不能超过 2MB!')
          return false
        }
        return file
      }
    },

    // ========== 菜品选择弹窗 ==========
    openDishSelectDialog() {
      this.dishSearchKey = ''
      this.selectedDishList = []
      this.dishSelectDialog.visible = true
      this.activeDishTypeIndex = 0
      this.getDishTypeList()
    },

    handleDishSelectClose() {
      this.dishSelectDialog.visible = false
      this.dishSearchKey = ''
      this.selectedDishList = []
    },

    getComboCategoryList() {
      var self = this
      getCategoryList({ type: 2 }).then(function (res) {
        if (res.code === 1) {
          self.comboCategoryList = res.data
        } else {
          self.$message.error(res.msg || '获取分类失败')
        }
      }).catch(function (err) {
        self.$message.error('请求失败：' + err)
      })
    },

    getDishTypeList() {
      var self = this
      getCategoryList({ type: 1 }).then(function (res) {
        if (res.code === 1) {
          self.dishTypeList = res.data
          if (res.data.length > 0) {
            self.getDishList(res.data[0].id)
          }
        } else {
          self.$message.error(res.msg || '获取菜品分类失败')
        }
      }).catch(function (err) {
        self.$message.error('请求失败：' + err)
      })
    },

    getDishList(categoryId) {
      var self = this
      queryDishList({ categoryId: categoryId }).then(function (res) {
        if (res.code === 1) {
          if (res.data.length === 0) {
            self.dishSelectList = []
            return
          }
          self.dishSelectList = res.data.map(function (item) {
            return {
              dishId: item.id,
              dishName: item.name,
              copies: 1,
              price: item.price,
              status: item.status
            }
          })
        } else {
          self.$message.error(res.msg || '获取菜品列表失败')
        }
      }).catch(function (err) {
        self.$message.error('请求失败：' + err)
      })
    },

    debounceSearch() {
      var self = this
      if (this.searchTimer) { clearTimeout(this.searchTimer) }
      this.searchTimer = setTimeout(function() {
        self.searchDish()
      }, 400)
    },

    handleSearchEsc() {
      var self = this
      if (this.searchTimer) { clearTimeout(this.searchTimer) }
      // 搜索框清空时恢复原始分类列表
      if (!this.dishSearchKey.trim() && self.dishTypeList.length > 0) {
        self.getDishList(self.dishTypeList[0].id)
      }
    },

    searchDish() {
      var self = this
      var name = this.dishSearchKey.trim()
      if (name) {
        queryDishList({ name: name }).then(function (res) {
          if (res.code === 1) {
            self.dishSelectList = res.data.map(function (item) {
              return {
                dishId: item.id,
                dishName: item.name,
                copies: 1,
                price: item.price,
                status: item.status
              }
            })
          } else {
            self.$message.error(res.msg || '搜索失败')
          }
        }).catch(function (err) {
          self.$message.error('请求失败：' + err)
        })
      } else {
        if (self.dishTypeList.length > 0) {
          self.getDishList(self.dishTypeList[0].id)
        }
      }
    },

    selectDishType(index, id) {
      this.activeDishTypeIndex = index
      this.getDishList(id)
    },

    onDishSelectionChange(value) {
      this.selectedDishList = value
    },

    removeSelectedDish(index) {
      this.selectedDishList.splice(index, 1)
    },

    confirmDishSelection() {
      if (this.selectedDishList.length === 0) {
        ReggieUI.warning('请至少选择一道菜品')
        return
      }
      var existingIds = new Set(this.comboDishTable.map(function (item) { return item.dishId || item.id }))
      var self = this
      this.selectedDishList.forEach(function (item) {
        if (!existingIds.has(item.dishId)) {
          self.comboDishTable.push({
            dishId: item.dishId,
            name: item.dishName,
            price: item.price,
            copies: 1
          })
        }
      })
      this.dishSelectDialog.visible = false
      ReggieUI.success('添加成功！')
    },

    removeComboDish(index) {
      this.comboDishTable.splice(index, 1)
    }
  }
})
</script>
</body>
</html>
