<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单明细 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
</head>
<body>
  <div class="dashboard-container" id="order-app" v-loading="loading">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏（导出按钮内联在 tableBar 中） -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="false"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="240"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="getOrderTagType(row)" size="small">{{ getOrderType(row) }}</el-tag>
        </template>
        <template #col-amount="{ row }">
          <span>￥{{ row.amount }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" @click="goDetail(row)" class="btn-view">查看</el-button>
          <el-button v-if="row.status === 2" type="text" @click="cancelOrDeliveryOrComplete(3, row.id)" class="btn-view">派送</el-button>
          <el-button v-if="row.status === 3" type="text" @click="cancelOrDeliveryOrComplete(4, row.id)" class="btn-view">完成</el-button>
          <el-button v-if="row.status === 4" type="text" class="btn-delete" @click="openRefund(row)">退款</el-button>
          <el-button v-if="row.status === 2 || row.status === 3" type="text" class="btn-warning" @click="cancelOrder(row)">取消</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 查看弹框 -->
    <el-dialog
      title="订单详情"
      :visible.sync="dialogVisible"
      width="600px"
      :close-on-click-modal="true"
      @closed="diaForm = {}"
    >
      <el-descriptions v-if="diaForm" :column="2" border size="small">
        <el-descriptions-item label="订单号">{{ diaForm.number }}</el-descriptions-item>
        <el-descriptions-item label="订单状态">
          <el-tag :type="getOrderTagType(diaForm)" size="mini">{{ getOrderType(diaForm) }}</el-tag>
        </el-descriptions-item>
        <el-descriptions-item label="收货人">{{ diaForm.consignee }}</el-descriptions-item>
        <el-descriptions-item label="联系电话">{{ diaForm.phone }}</el-descriptions-item>
        <el-descriptions-item label="地址" :span="2">{{ diaForm.address }}</el-descriptions-item>
        <el-descriptions-item label="支付金额">
          <b style="color:#f56c6c">￥{{ diaForm.amount }}</b>
        </el-descriptions-item>
        <el-descriptions-item label="下单时间">{{ diaForm.orderTime }}</el-descriptions-item>
      </el-descriptions>
      <!-- 菜品明细 -->
      <div v-if="diaForm.orderDetails && diaForm.orderDetails.length > 0" style="margin-top:16px;">
        <div style="font-size:14px;font-weight:600;color:#303133;margin-bottom:12px;">菜品明细</div>
        <el-table :data="diaForm.orderDetails" size="small" border style="width:100%;">
          <el-table-column prop="name" label="菜品" min-width="120"></el-table-column>
          <el-table-column prop="image" label="图片" width="60" align="center">
            <template slot-scope="scope">
              <el-image v-if="scope.row.image" :src="scope.row.image" style="width:40px;height:40px;border-radius:4px;" fit="cover"></el-image>
              <span v-else style="color:#c0c4cc;">-</span>
            </template>
          </el-table-column>
          <el-table-column prop="dishFlavor" label="口味" width="100" align="center">
            <template slot-scope="scope">
              <span v-if="scope.row.dishFlavor">{{ scope.row.dishFlavor }}</span>
              <span v-else style="color:#c0c4cc;">-</span>
            </template>
          </el-table-column>
          <el-table-column prop="number" label="数量" width="70" align="center"></el-table-column>
          <el-table-column prop="amount" label="小计" width="100" align="right">
            <template slot-scope="scope">
              <span style="color:#f56c6c;font-weight:600;">￥{{ scope.row.amount }}</span>
            </template>
          </el-table-column>
        </el-table>
      </div>
      <div v-else style="margin-top:16px;text-align:center;padding:20px;color:#c0c4cc;font-size:13px;">暂无菜品明细</div>
      <span slot="footer" class="dialog-footer">
        <el-button @click="dialogVisible = false">关 闭</el-button>
      </span>
    </el-dialog>

    <!-- 退款弹框 -->
    <crud-dialog
      title="订单退款"
      :visible.sync="refundVisible"
      width="420px"
      :submit-loading="refundLoading"
      submit-text="确认退款"
      @submit="submitRefund"
      @close="refundVisible = false"
    >
      <div style="padding:10px 0;">
        <div class="item-box" style="margin-bottom:14px;">
          <span class="label" style="width:80px;">订单号：</span><span class="des">{{ refundForm.number }}</span>
        </div>
        <div class="item-box" style="margin-bottom:14px;">
          <span class="label" style="width:80px;">订单金额：</span><span class="des" style="color:#f56c6c;font-weight:600;">￥{{ refundForm.amount }}</span>
        </div>
        <div class="item-box" style="margin-bottom:14px;">
          <span class="label" style="width:80px;">退款金额：</span>
          <el-input v-model="refundForm.amount" type="number" style="width:160px" size="small" :max="refundForm.maxAmount" :min="0.01" :step="0.01"></el-input>
        </div>
        <div class="item-box" style="margin-bottom:14px;">
          <span class="label" style="width:80px;">退款原因：</span>
          <el-select v-model="refundForm.reasonType" style="width:160px" size="small">
            <el-option label="口味问题" value="口味问题"></el-option>
            <el-option label="配送超时" value="配送超时"></el-option>
            <el-option label="商品不符" value="商品不符"></el-option>
            <el-option label="用户取消" value="用户取消"></el-option>
            <el-option label="其他原因" value="其他原因"></el-option>
          </el-select>
        </div>
        <div class="item-box" v-if="refundForm.reasonType === '其他原因'">
          <span class="label" style="width:80px;">详细说明：</span>
          <el-input v-model="refundForm.reasonDetail" type="textarea" :rows="2" style="width:220px" size="small" placeholder="请填写退款原因"></el-input>
        </div>
      </div>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/order.js"></script>
  <script src="../../api/payment.js"></script>
  <script src="../../api/export.js"></script>
  <script>
    new Vue({
      el: '#order-app',
      data: function() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { todayOrders: 0, todayRevenue: 0, pendingOrders: 0, totalOrders: 0 },
          activeFilter: '',
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'number', placeholder: '请输入订单号', width: '200px' },
            { type: 'date', field: 'orderTime', placeholder: '选择日期', width: '360px',
              beginField: 'beginTime', endField: 'endTime' }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'exportExcel', text: '导出Excel', type: 'success', icon: 'el-icon-download' },
            { key: 'exportPdf', text: '导出PDF', type: 'danger', icon: 'el-icon-document' }
          ],
          // 表格列配置
          columns: [
            { prop: 'number', label: '订单号', minWidth: '110' },
            { prop: 'status', label: '订单状态', slot: true, width: 100 },
            { prop: 'userName', label: '用户' },
            { prop: 'phone', label: '手机号' },
            { prop: 'address', label: '地址', showOverflowTooltip: true },
            { prop: 'orderTime', label: '下单时间', minWidth: '100' },
            { prop: 'amount', label: '实收金额', slot: true, width: 100 }
          ],
          // 缓存搜索参数
          lastSearch: {},
          // 弹窗数据
          dialogVisible: false,
          diaForm: {},
          refundVisible: false,
          refundLoading: false,
          refundForm: { id: null, number: '', amount: 0, maxAmount: 0, reasonType: '', reasonDetail: '' }
        }
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: 'today', icon: '📋', label: '今日订单数', value: self.stats.todayOrders, color: 'primary' },
            { key: 'revenue', icon: '💰', label: '今日营业额 (元)', value: self.formatMoney(self.stats.todayRevenue), color: 'success' },
            { key: 'pending', icon: '⏳', label: '待处理订单', value: self.stats.pendingOrders, color: 'warning', clickable: true, active: self.activeFilter === 'pending' },
            { key: 'all', icon: '📊', label: '总订单数', value: self.stats.totalOrders, color: 'danger', clickable: true, active: self.activeFilter === 'all' }
          ]
        }
      },
      created: function() { this.init() },
      methods: {
        async init() {
          this.loading = true
          var self = this
          var params = {
            page: self.page, pageSize: self.pageSize,
            number: self.lastSearch.number || undefined,
            beginTime: self.lastSearch.beginTime || undefined,
            endTime: self.lastSearch.endTime || undefined
          }
          if (self.activeFilter === 'pending') params.status = 2
          var results = await Promise.all([getOrderDetailPage(params), self.loadOrderStats()])
          var orderRes = results[0]
          var statsRes = results[1]
          if (String(orderRes.code) === '1') { self.tableData = orderRes.data.records || []; self.counts = orderRes.data.total }
          if (statsRes && String(statsRes.code) === '1') { self.stats = statsRes.data || self.stats }
          self.loading = false
        },
        async loadOrderStats() {
          try {
            var results = await Promise.all([
              $axios.get('/api/dashboard/all', { params: { hotDishLimit: 10 } }),
              getOrderDetailPage({ page: 1, pageSize: 1 })
            ])
            var dashRes = results[0]
            var orderTotalRes = results[1]
            if (String(dashRes.code) === '1') {
              var data = dashRes.data
              return { code: 1, data: {
                todayOrders: data.overview?.totalOrders || 0,
                todayRevenue: data.overview?.totalRevenue || 0,
                pendingOrders: data.overview?.pendingOrders || 0,
                totalOrders: (String(orderTotalRes.code) === '1') ? (orderTotalRes.data.total || 0) : 0
              }}
            }
          } catch (err) { console.warn('加载订单统计数据失败:', err) }
          return { code: 0 }
        },
        formatMoney: function(val) {
          if (val === null || val === undefined) return '0.00'
          return Number(val).toFixed(2)
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          var self = this
          if (payload.key === 'pending') {
            self.activeFilter = self.activeFilter === 'pending' ? '' : 'pending'
            if (self.activeFilter === 'pending') { self.lastSearch = {} }
          } else if (payload.key === 'all') {
            self.activeFilter = self.activeFilter === 'all' ? '' : 'all'
            self.lastSearch = {}
          }
          self.page = 1; self.init()
        },
        // table-bar 回调
        onSearch: function(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1; this.init()
        },
        onReset: function() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1; this.init()
        },
        onAction: function(payload) {
          if (payload.key === 'exportExcel') this.exportOrders('excel')
          else if (payload.key === 'exportPdf') this.exportOrders('pdf')
        },
        onPageChange: function(payload) { this.page = payload.page; this.init() },
        onSizeChange: function(payload) { this.pageSize = payload.pageSize; this.init() },
        // 状态工具方法
        getOrderType: function(row) {
          var map = { 1: '待付款', 2: '待接单', 3: '配送中', 4: '已完成', 5: '已取消', 6: '已退款' }
          return map[row.status] || ''
        },
        getOrderTagType: function(row) {
          var map = { 1: 'warning', 2: 'warning', 3: 'primary', 4: 'success', 5: 'info', 6: 'danger' }
          return map[row.status] || 'info'
        },
        goDetail: function(row) {
          this.dialogVisible = true
          this.diaForm = { ...row, orderDetails: [] }
          var self = this
          $axios.get('/order/' + row.id).then(function(res) {
            if (res && res.code === 1 && res.data) { self.diaForm = res.data }
            else { self.diaForm = { ...row, orderDetails: [] } }
          }).catch(function() { self.diaForm = { ...row, orderDetails: [] } })
        },
        cancelOrder: function(row) {
          var self = this
          this.$confirm('确认取消该订单？', '提示', { confirmButtonText: '确定', cancelButtonText: '再想想', type: 'warning' })
            .then(function() {
              editOrderDetail({ id: row.id, status: 5 }).then(function(res) {
                if (res && res.code === 1) { self.$message.success('订单已取消'); self.init() }
                else { self.$message.error(res.msg || '取消失败') }
              }).catch(function(err) { self.$message.error('请求失败：' + err) })
            })
        },
        cancelOrDeliveryOrComplete: function(status, id) {
          var self = this
          this.$confirm('确认更改该订单状态?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              editOrderDetail({ status: status, id: id }).then(function(res) {
                if (res.code === 1) { self.$message.success(status === 3 ? '订单已派送' : '订单已完成'); self.init() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(function(err) { self.$message.error('请求失败：' + err) })
            })
        },
        openRefund: function(row) {
          this.refundForm = { id: row.id, number: row.number, amount: row.amount, maxAmount: row.amount, reasonType: '', reasonDetail: '' }
          this.refundVisible = true
        },
        async submitRefund() {
          var self = this
          if (!self.refundForm.amount || parseFloat(self.refundForm.amount) <= 0) { self.$message.warning('请输入有效的退款金额'); return }
          var reason = self.refundForm.reasonType
          if (!reason) { self.$message.warning('请选择退款原因'); return }
          if (reason === '其他原因') {
            if (!self.refundForm.reasonDetail) { self.$message.warning('请填写详细退款原因'); return }
            reason = self.refundForm.reasonDetail
          }
          self.refundLoading = true
          try {
            var paymentRes = await $axios.get('/api/payment/page', { params: { page: 1, pageSize: 1, orderId: self.refundForm.id } })
            var paymentOrderId = null
            if (paymentRes && paymentRes.code === 1 && paymentRes.data && paymentRes.data.records && paymentRes.data.records.length > 0) {
              paymentOrderId = paymentRes.data.records[0].id
            }
            if (!paymentOrderId) { self.$message.error('未找到对应支付订单，无法退款'); self.refundLoading = false; return }
            var res = await paymentRefund({ paymentOrderId: paymentOrderId, amount: parseFloat(self.refundForm.amount), reason: reason })
            if (res && res.code === 1) { self.$message.success('退款成功'); self.refundVisible = false; self.init() }
            else { self.$message.error(res ? res.msg : '退款失败') }
          } catch (err) { self.$message.error('退款请求失败：' + err) }
          self.refundLoading = false
        },
        exportOrders: async function(format) {
          var params = {}
          if (this.lastSearch.beginTime) params.startDate = this.lastSearch.beginTime
          if (this.lastSearch.endTime) params.endDate = this.lastSearch.endTime
          if (this.lastSearch.number) params.number = this.lastSearch.number
          try {
            var ext = format === 'excel' ? 'xlsx' : 'pdf'
            var apiCall = format === 'excel' ? exportApi.exportOrdersExcel(params) : exportApi.exportOrdersPdf(params)
            await exportApi.downloadFile(apiCall, '订单数据.' + ext)
            this.$message.success('导出成功，文件已开始下载')
          } catch (err) { this.$message.error('导出失败：' + (err.message || err)) }
        }
      }
    })
  </script>
</body>
</html>
