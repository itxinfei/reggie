<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闂ㄥ簵绠＄悊 - 鐟炲悏澶栧崠绠＄悊绔?/title>
    <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-page); padding: 20px; font-family: var(--font-family-base); }
        .dashboard-container { max-width: 1400px; margin: 0 auto; }
        .container { background: var(--bg-surface); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-xs); }

        /* 宸ュ叿鏍?*/
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--el-border-light); margin-bottom: var(--space-5); }
        .toolbar .el-input, .toolbar .el-select { width: 180px; }
        .toolbar .spacer { flex: 1; }

        /* 琛ㄦ牸 */
        .store-table { margin-top: 4px; }
        .store-table .cell-status { display: flex; align-items: center; gap: 6px; }
        .tag-active { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size:var(--font-size-xs); font-weight: 500; background: var(--color-success-light); color: var(--color-success); }
        .tag-inactive { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size:var(--font-size-xs); font-weight: 500; background: var(--color-danger-light); color: var(--color-danger); }
        .amount-highlight { color: var(--color-warning); font-weight: 600; }
        .order-count { font-weight: 600; color: var(--el-color-primary); }

        /* 缂栬緫寮圭獥 */
        .form-section-title { font-size:var(--font-size-base); font-weight: 600; color: var(--el-text-primary); margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--el-border-lighter2); }
        .form-section-title:first-child { margin-top: 0; }
        .footer-actions { text-align: right; padding-top: 8px; }

        /* 绌虹姸鎬?*/
        .empty-wrap { text-align: center; padding: 60px 0; color: var(--color-info); }

        .sync-section { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }

        /* 闂ㄥ簵璇︽儏寮圭獥 */
        .store-detail .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .store-detail .detail-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--el-text-primary); }
        .store-detail .detail-code { font-size: var(--font-size-xs); color: var(--text-muted); background: var(--bg-subtle); padding: 2px 8px; border-radius: var(--radius-sm); }
        .store-detail .form-section-title:first-of-type { margin-top: 4px; }
        /* 璇︽儏瀛楁缃戞牸锛堟浛浠ｆ湭娉ㄥ唽鐨?el-descriptions锛?*/
        .store-detail .detail-grid { border: 1px solid var(--el-border-extra-light); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 4px; }
        .store-detail .detail-grid .el-col {
            display: flex; align-items: center;
            padding: 9px 12px; border-bottom: 1px solid var(--el-border-extra-light);
            border-right: 1px solid var(--el-border-extra-light);
        }
        .store-detail .detail-grid .el-col:nth-child(2n) { border-right: none; }
        .store-detail .detail-grid .el-col:nth-last-child(-n+2) { border-bottom: none; }
        .store-detail .detail-grid .el-col[class*="span-24"],
        .store-detail .detail-grid .el-col:last-child:nth-child(odd) { border-right: none; }
        .store-detail .dt-label { flex: 0 0 84px; color: var(--text-muted); font-size: var(--font-size-sm); }
        .store-detail .dt-value { flex: 1; color: var(--el-text-primary); font-size: var(--font-size-sm); word-break: break-all; }
    </style>
</head>
<body>
<!-- 閿洏鐢ㄦ埛锛氳烦杞埌涓诲唴瀹癸紙WCAG 2.4.1锛?-->
<a href="#main-content" class="skip-link">璺宠浆鍒颁富鍐呭</a>
<div id="app">
    <div class="dashboard-container">
        <div class="container" id="main-content" role="main" aria-label="椤甸潰涓昏鍐呭">
            <!-- 椤靛ご锛氭爣棰?+ 鍓爣棰橈紙涓庡叏绔?ds-page-header 瑙勮寖涓€鑷达級 -->
            <header class="ds-page-header">
                <div class="ds-page-header__titles">
                    <h1 class="ds-page-header__title" id="page-title">闂ㄥ簵绠＄悊</h1>
                    <p class="ds-page-header__subtitle">绠＄悊闂ㄥ簵淇℃伅涓庤惀涓氱姸鎬?/p>
                </div>
                <div class="ds-page-header__actions"></div>
            </header>
            <!-- 淇敼鐐癸細浣跨敤 <stat-cards> 缁熶竴缁勪欢鏇夸唬鎵嬪啓 HTML锛屾敮鎸佺偣鍑昏繃婊?-->
            <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

            <!-- ===== 楂樼骇鎼滅储 + 鎿嶄綔鎸夐挳 ===== -->
            <div class="toolbar">
                <el-input v-model="search.keyword" placeholder="闂ㄥ簵鍚嶇О / 缂栫爜" clearable size="small" @clear="doSearch" @keyup.enter.native="doSearch">
                    <i slot="prefix" class="el-input__icon el-icon-search"></i>
                </el-input>
                <el-select v-model="search.storeType" placeholder="闂ㄥ簵绫诲瀷" clearable size="small" @change="doSearch">
                    <el-option label="鍏ㄩ儴绫诲瀷" :value="null"></el-option>
                    <el-option label="鐩磋惀鎬诲簵" :value="1"></el-option>
                    <el-option label="鐩磋惀鍒嗗簵" :value="2"></el-option>
                    <el-option label="鍔犵洘搴? :value="3"></el-option>
                </el-select>
                <el-select v-model="search.status" placeholder="闂ㄥ簵鐘舵€? clearable size="small" @change="doSearch">
                    <el-option label="鍏ㄩ儴鐘舵€? :value="null"></el-option>
                    <el-option label="宸插惎鐢? :value="1"></el-option>
                    <el-option label="宸插仠鐢? :value="0"></el-option>
                </el-select>
                <el-button size="small" type="primary" icon="el-icon-search" @click="doSearch">鎼滅储</el-button>
                <el-button size="small" icon="el-icon-refresh-left" @click="resetSearch">閲嶇疆</el-button>

                <span class="spacer"></span>

                <el-button size="small" type="success" icon="el-icon-plus" @click="openCreateDialog">鏂板缓闂ㄥ簵</el-button>
                <el-button size="small" type="warning" icon="el-icon-upload2" @click="batchEnable" :disabled="selection.length === 0">鎵归噺鍚敤</el-button>
                <el-button size="small" type="info" icon="el-icon-download" @click="batchDisable" :disabled="selection.length === 0">鎵归噺鍋滅敤</el-button>
                <el-button size="small" icon="el-icon-download" @click="doExport">瀵煎嚭鏁版嵁</el-button>
            </div>

            <!-- ===== 鏁版嵁琛ㄦ牸 ===== -->
            <div v-loading="loading" class="store-table">
                <el-table aria-label="鏁版嵁琛ㄦ牸"
                    :data="tableData"
                    border
                    stripe
                    size="small"
                    @selection-change="onSelectionChange"
                    @sort-change="onSortChange"
                    @row-click="onRowClick"
                    highlight-current-row
                    :default-sort="{prop: 'createTime', order: 'descending'}"
                    style="width:100%">
                    <el-table-column type="selection" width="45" fixed="left"></el-table-column>
                    <el-table-column label="搴忓彿" type="index" width="46" align="center"></el-table-column>
                    <el-table-column prop="storeName" label="闂ㄥ簵鍚嶇О" min-width="150" align="center" sortable="custom" show-overflow-tooltip>
                        <template slot-scope="{row}">
                            <el-tag :type="storeTypeTag(row.storeType)" size="mini" effect="plain">{{ storeTypeName(row.storeType) }}</el-tag>
                            <span style="margin-left:6px; font-weight:500;">{{ row.storeName }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column prop="storeCode" label="闂ㄥ簵缂栫爜" width="92" align="center" sortable="custom" show-overflow-tooltip></el-table-column>
                    <el-table-column label="鑱旂郴浜?/ 鐢佃瘽" min-width="140" align="center" show-overflow-tooltip>
                        <template slot-scope="{row}">
                            <span>{{ row.contactPerson || '鈥? }}</span>
                            <span style="margin-left:8px; color:var(--text-muted);">{{ row.contactPhone || '鈥? }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="鐘舵€? width="60" align="center">
                        <template slot-scope="{row}">
                            <el-switch
                                v-model="row.status"
                                :active-value="1"
                                :inactive-value="0"
                                @change="toggleSingleStatus(row)"
                                active-color="var(--color-success)"
                                inactive-color="var(--color-gray-300)">
                            </el-switch>
                        </template>
                    </el-table-column>
                    <el-table-column prop="todayOrders" label="浠婃棩璁㈠崟" width="80" align="center" sortable="custom">
                        <template slot-scope="{row}">
                            <span class="order-count">{{ row.todayOrders || 0 }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column prop="todayAmount" label="浠婃棩钀ユ敹" width="100" align="right" sortable="custom">
                        <template slot-scope="{row}">
                            <span class="amount-highlight">&yen;{{ fmtAmount(row.todayAmount) }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="鎿嶄綔" width="210" align="center" fixed="right">
                        <template slot-scope="{row}">
                            <el-button type="text" size="mini" icon="el-icon-document" @click.stop="openDetail(row)">璇︽儏</el-button>
                            <el-button type="text" size="mini" icon="el-icon-edit" @click.stop="openEditDialog(row)">缂栬緫</el-button>
                            <el-button type="text" size="mini" icon="el-icon-switch-button" @click.stop="switchToStore(row)">鍒囨崲</el-button>
                            <el-button type="text" size="mini" icon="el-icon-refresh" @click.stop="openSyncDialog(row)">鍚屾</el-button>
                        </template>
                    </el-table-column>
                </el-table>

                <!-- 鍒嗛〉 -->
                <el-pagination
                    v-if="pagination.total > 0"
                    style="margin-top:16px; text-align:right;"
                    :current-page="Number(pagination.current)"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="Number(pagination.size)"
                    :total="Number(pagination.total)"
                    layout="total, sizes, prev, pager, next, jumper"
                    @size-change="onPageSizeChange"
                    @current-change="onPageChange">
                </el-pagination>

                <!-- 绌虹姸鎬?-->
                <div v-if="!loading && tableData.length === 0" class="empty-wrap">
                    <i class="el-icon-s-shop" style="font-size: var(--font-size-4xl);"></i>
                    <p style="margin-top:12px;">鏆傛棤闂ㄥ簵鏁版嵁</p>
                    <el-button type="primary" size="small" style="margin-top:12px;" @click="openCreateDialog">鍒涘缓绗竴瀹堕棬搴?/el-button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 鏂板缓/缂栬緫闂ㄥ簵瀵硅瘽妗?===== -->
    <crud-dialog
      :title="dialogTitle"
      :visible.sync="formDialogVisible"
      size="lg"
      :submit-loading="submitting"
      :close-on-click-modal="false"
      @submit="submitForm"
      @close="resetForm"
    >
        <el-form :model="form" ref="formRef" label-width="100px" size="small" :rules="formRules">
            <div class="form-section-title">鍩烘湰淇℃伅</div>
            <el-row :gutter="16">
                <el-col :span="12">
                    <el-form-item label="闂ㄥ簵鍚嶇О" prop="storeName">
                        <el-input v-model="form.storeName" placeholder="濡傦細鐟炲悏澶栧崠-鏈濋槼搴? maxlength="100" />
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="闂ㄥ簵缂栫爜" prop="storeCode">
                        <el-input v-model="form.storeCode" placeholder="濡傦細BJ001" maxlength="32" />
                    </el-form-item>
                </el-col>
            </el-row>
            <el-row :gutter="16">
                <el-col :span="12">
                    <el-form-item label="闂ㄥ簵绫诲瀷" prop="storeType">
                        <el-select v-model="form.storeType" style="width:100%">
                            <el-option label="鐩磋惀鎬诲簵" :value="1" />
                            <el-option label="鐩磋惀鍒嗗簵" :value="2" />
                            <el-option label="鍔犵洘搴? :value="3" />
                        </el-select>
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="钀ヤ笟鏃堕棿" prop="businessHours">
                        <el-time-picker
                            v-model="form.businessHoursRange"
                            is-range
                            range-separator="鑷?
                            start-placeholder="寮€濮?
                            end-placeholder="缁撴潫"
                            format="HH:mm"
                            value-format="HH:mm"
                            style="width:100%"
                            placeholder="閫夋嫨钀ヤ笟鏃堕棿">
                        </el-time-picker>
                    </el-form-item>
                </el-col>
            </el-row>

            <div class="form-section-title">鑱旂郴淇℃伅</div>
            <el-row :gutter="16">
                <el-col :span="12">
                    <el-form-item label="鑱旂郴浜? prop="contactPerson">
                        <el-input v-model="form.contactPerson" placeholder="闂ㄥ簵鑱旂郴浜? maxlength="64" />
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="鑱旂郴鐢佃瘽" prop="contactPhone">
                        <el-input v-model="form.contactPhone" placeholder="鑱旂郴鐢佃瘽" maxlength="20" />
                    </el-form-item>
                </el-col>
            </el-row>
            <el-form-item label="闂ㄥ簵鍦板潃" prop="address">
                <el-input v-model="form.address" placeholder="闂ㄥ簵璇︾粏鍦板潃" maxlength="200" />
            </el-form-item>

            <div class="form-section-title">杩愯惀璁剧疆</div>
            <el-row :gutter="16">
                <el-col :span="8">
                    <el-form-item label="閰嶉€佸崐寰?m)">
                        <el-input-number v-model="form.deliveryRadius" :min="500" :max="20000" :step="500" controls-position="right" style="width:100%" />
                    </el-form-item>
                </el-col>
                <el-col :span="8">
                    <el-form-item label="璧烽€侀噾棰?>
                        <el-input-number v-model="form.minDeliveryAmount" :min="0" :max="200" :precision="2" :step="1" controls-position="right" style="width:100%" />
                    </el-form-item>
                </el-col>
                <el-col :span="8">
                    <el-form-item label="閰嶉€佽垂">
                        <el-input-number v-model="form.deliveryFee" :min="0" :max="50" :precision="2" :step="0.5" controls-position="right" style="width:100%" />
                    </el-form-item>
                </el-col>
            </el-row>
            <el-row :gutter="16">
                <el-col :span="8">
                    <el-form-item label="鏀寔澶栧崠">
                        <el-switch v-model="form.isDeliveryEnabled" :active-value="1" :inactive-value="0" active-color="var(--legacy-13ce66)" />
                    </el-form-item>
                </el-col>
                <el-col :span="8">
                    <el-form-item label="鏀寔鍫傞">
                        <el-switch v-model="form.isDineInEnabled" :active-value="1" :inactive-value="0" active-color="var(--color-brand-500)" />
                    </el-form-item>
                </el-col>
                <el-col :span="8">
                    <el-form-item label="闂ㄥ簵鐘舵€?>
                        <el-switch v-model="form.status" :active-value="1" :inactive-value="0" active-text="鍚敤" inactive-text="鍋滅敤" />
                    </el-form-item>
                </el-col>
            </el-row>

            <!-- 鏂板缓鏃舵樉绀虹鐞嗗憳淇℃伅 -->
            <template v-if="isCreate">
                <div class="form-section-title">绠＄悊鍛樿处鍙?/div>
                <el-row :gutter="16">
                    <el-col :span="12">
                        <el-form-item label="绠＄悊鍛樿处鍙? prop="adminUsername">
                            <el-input v-model="form.adminUsername" placeholder="闂ㄥ簵绠＄悊鍛樼櫥褰曡处鍙? maxlength="32" />
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="绠＄悊鍛樺瘑鐮? prop="adminPassword">
                            <el-input v-model="form.adminPassword" type="password" placeholder="鍒濆瀵嗙爜锛岃嚦灏?浣? maxlength="32" show-password />
                        </el-form-item>
                    </el-col>
                </el-row>
            </template>
        </el-form>
    </crud-dialog>

    <!-- ===== 闂ㄥ簵璇︽儏瀵硅瘽妗嗭紙鐐瑰嚮琛?/ 璇︽儏鎸夐挳鎵撳紑锛屽睍绀哄畬鏁翠俊鎭紝閬垮厤鍒楄〃鍒楄繃澶氾級 ===== -->
    <crud-dialog
      title="闂ㄥ簵璇︽儏"
      :visible.sync="detailDialogVisible"
      size="lg"
      :show-submit="false"
      cancel-text="鍏?闂?
      :close-on-click-modal="true"
      @close="detailData=null">
        <div v-if="detailData" class="store-detail">
            <!-- 澶撮儴姒傝 -->
            <div class="detail-header">
                <el-tag :type="storeTypeTag(detailData.storeType)" size="small" effect="plain">{{ storeTypeName(detailData.storeType) }}</el-tag>
                <span class="detail-title">{{ detailData.storeName }}</span>
                <span class="detail-code">{{ detailData.storeCode }}</span>
                <el-tag :type="detailData.status === 1 ? 'success' : 'info'" size="small" effect="light">
                    {{ detailData.status === 1 ? '宸插惎鐢? : '宸插仠鐢? }}
                </el-tag>
            </div>

            <!-- 鍩烘湰淇℃伅 -->
            <div class="form-section-title">鍩烘湰淇℃伅</div>
            <el-row :gutter="0" class="detail-grid">
                <el-col :span="12"><span class="dt-label">闂ㄥ簵鍚嶇О</span><span class="dt-value">{{ detailData.storeName || '鈥? }}</span></el-col>
                <el-col :span="12"><span class="dt-label">闂ㄥ簵缂栫爜</span><span class="dt-value">{{ detailData.storeCode || '鈥? }}</span></el-col>
                <el-col :span="12"><span class="dt-label">闂ㄥ簵绫诲瀷</span><span class="dt-value">{{ storeTypeName(detailData.storeType) }}</span></el-col>
                <el-col :span="12"><span class="dt-label">钀ヤ笟鏃堕棿</span><span class="dt-value">{{ detailData.businessHours || '鈥? }}</span></el-col>
                <el-col :span="12"><span class="dt-label">鑱旂郴浜?/span><span class="dt-value">{{ detailData.contactPerson || '鈥? }}</span></el-col>
                <el-col :span="12"><span class="dt-label">鑱旂郴鐢佃瘽</span><span class="dt-value">{{ detailData.contactPhone || '鈥? }}</span></el-col>
                <el-col :span="24"><span class="dt-label">闂ㄥ簵鍦板潃</span><span class="dt-value">{{ detailData.address || '鈥? }}</span></el-col>
            </el-row>

            <!-- 杩愯惀璁剧疆 -->
            <div class="form-section-title">杩愯惀璁剧疆</div>
            <el-row :gutter="0" class="detail-grid">
                <el-col :span="8"><span class="dt-label">閰嶉€佸崐寰?/span><span class="dt-value">{{ detailData.deliveryRadius || 0 }} m</span></el-col>
                <el-col :span="8"><span class="dt-label">璧烽€侀噾棰?/span><span class="dt-value">&yen;{{ fmtAmount(detailData.minDeliveryAmount) }}</span></el-col>
                <el-col :span="8"><span class="dt-label">閰嶉€佽垂</span><span class="dt-value">&yen;{{ fmtAmount(detailData.deliveryFee) }}</span></el-col>
                <el-col :span="8">
                    <span class="dt-label">鏀寔澶栧崠</span>
                    <span class="dt-value"><el-tag :type="detailData.isDeliveryEnabled === 1 ? 'success' : 'info'" size="mini">{{ detailData.isDeliveryEnabled === 1 ? '鏀寔' : '涓嶆敮鎸? }}</el-tag></span>
                </el-col>
                <el-col :span="8">
                    <span class="dt-label">鏀寔鍫傞</span>
                    <span class="dt-value"><el-tag :type="detailData.isDineInEnabled === 1 ? 'success' : 'info'" size="mini">{{ detailData.isDineInEnabled === 1 ? '鏀寔' : '涓嶆敮鎸? }}</el-tag></span>
                </el-col>
                <el-col :span="8">
                    <span class="dt-label">鏁版嵁瀹屽杽搴?/span>
                    <span class="dt-value"><el-progress :percentage="toNumber(detailData.dataCompleteRate)" :stroke-width="12" :color="progressColor(detailData.dataCompleteRate)"></el-progress></span>
                </el-col>
            </el-row>

            <!-- 鏃堕棿淇℃伅 -->
            <div class="form-section-title">鏃堕棿淇℃伅</div>
            <el-row :gutter="0" class="detail-grid">
                <el-col :span="12"><span class="dt-label">鍒涘缓鏃堕棿</span><span class="dt-value">{{ formatDateTime(detailData.createTime) }}</span></el-col>
                <el-col :span="12"><span class="dt-label">鏇存柊鏃堕棿</span><span class="dt-value">{{ formatDateTime(detailData.updateTime) }}</span></el-col>
            </el-row>

            <div class="footer-actions">
                <el-button size="small" type="primary" icon="el-icon-edit" @click="openEditDialog(detailData)">缂栬緫</el-button>
                <el-button size="small" icon="el-icon-switch-button" @click="switchToStore(detailData)">鍒囨崲闂ㄥ簵</el-button>
                <el-button size="small" icon="el-icon-refresh" @click="openSyncDialog(detailData)">鏁版嵁鍚屾</el-button>
            </div>
        </div>
    </crud-dialog>

    <!-- ===== 鏁版嵁鍚屾瀵硅瘽妗?===== -->
    <crud-dialog
      title="鏁版嵁鍚屾"
      :visible.sync="syncDialogVisible"
      size="md"
      :show-submit="false"
      cancel-text="鍏?闂?
      :close-on-click-modal="true"
      @close="syncResult=null"
    >
        <p style="margin-bottom:14px; color:var(--el-text-regular); font-size:var(--font-size-sm);">
            灏嗘€婚儴鏁版嵁鍚屾鍒?<b style="color:var(--el-text-primary);">{{ syncTargetName }}</b>
        </p>
        <div class="sync-section">
            <el-button size="small" type="primary" @click="doSync('dishes')" :loading="syncing.dishes" icon="el-icon-sell">鍚屾鑿滃搧</el-button>
            <el-button size="small" type="success" @click="doSync('categories')" :loading="syncing.categories" icon="el-icon-menu">鍚屾鍒嗙被</el-button>
            <el-button size="small" type="warning" @click="doSync('setmeals')" :loading="syncing.setmeals" icon="el-icon-s-grid">鍚屾濂楅</el-button>
        </div>
        <el-alert
            v-if="syncResult"
            :title='鍚屾瀹屾垚锛氭垚鍔?' + syncResult.synced + ' 鏉★紝澶辫触 ' + syncResult.failed + ' 鏉?
            :type="syncResult.failed > 0 ? 'warning' : 'success'"
            :closable="false"
            style="margin-top:14px;">
        </el-alert>
        <template v-if="syncResult && syncResult.errors && syncResult.errors.length > 0">
          <p v-for="(err, i) in syncResult.errors" :key="i"
             style="font-size:var(--font-size-xs); color:var(--color-danger); margin-top:4px;">{{ err }}</p>
        </template>
    </crud-dialog>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/accessibility-utils.js"></script>
<script src="../../js/performance-utils.js"></script>
<script src="../../api/store.js"></script>
<script src="../../js/components.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
        loading: false,
        submitting: false,
        // 琛ㄦ牸鏁版嵁
        tableData: [],
        selection: [],           // 宸查€夎
        // 缁熻
        stats: { totalStores: 0, activeStores: 0, inactiveStores: 0, todayTotalStores: 0 },
        activeFilter: '',
        // 鎼滅储鏉′欢
        search: { keyword: '', storeType: null, status: null },
        // 鎺掑簭
        sort: { sortBy: 'createTime', sortOrder: 'desc' },
        // 鍒嗛〉
        pagination: { current: 1, size: 10, total: 0, pages: 0 },
        // 琛ㄥ崟
        formDialogVisible: false,
        isCreate: true,
        editTenantId: null,
        // 璇︽儏
        detailDialogVisible: false,
        detailData: null,
        form: {
            storeName: '', storeCode: '', storeType: 2,
            contactPerson: '', contactPhone: '', address: '',
            businessHours: '', businessHoursRange: null,
            deliveryRadius: 3000, minDeliveryAmount: 20.00, deliveryFee: 0.00,
            isDeliveryEnabled: 1, isDineInEnabled: 1, status: 1,
            adminUsername: '', adminPassword: ''
        },
        formRules: {
            storeName: [{ required: true, message: '璇疯緭鍏ラ棬搴楀悕绉?, trigger: 'blur' }],
            storeCode: [{ required: true, message: '璇疯緭鍏ラ棬搴楃紪鐮?, trigger: 'blur' }],
            storeType: [{ required: true, message: '璇烽€夋嫨闂ㄥ簵绫诲瀷', trigger: 'change' }],
            contactPhone: [
                { pattern: /^1[3-9]\d{9}$/, message: '璇疯緭鍏ユ纭殑鎵嬫満鍙?, trigger: 'blur' }
            ],
            adminUsername: [{ required: true, message: '璇疯緭鍏ョ鐞嗗憳璐﹀彿', trigger: 'blur' }],
            adminPassword: [
                { required: true, message: '璇疯緭鍏ョ鐞嗗憳瀵嗙爜', trigger: 'blur' },
                { min: 6, message: '瀵嗙爜鑷冲皯6浣?, trigger: 'blur' }
            ]
        },
        // 鍚屾
        syncDialogVisible: false,
        syncTargetId: null,
        syncTargetName: '',
        syncing: { dishes: false, categories: false, setmeals: false },
        syncResult: null
    },
    computed: {
        dialogTitle: function() { return this.isCreate ? '鏂板缓闂ㄥ簵' : '缂栬緫闂ㄥ簵'; },
        // 淇敼鐐癸細statsCards 缁熶竴鍗＄墖閰嶇疆锛堜緵 <stat-cards> 缁勪欢浣跨敤锛?
        statsCards: function() {
            var self = this;
            return [
                { key: '', icon: '馃彔', label: '闂ㄥ簵鎬绘暟', value: self.stats.totalStores, color: 'primary', clickable: true, active: self.activeFilter === '' },
                { key: 'active', icon: '鉁?, label: '宸插惎鐢?, value: self.stats.activeStores, color: 'success', clickable: true, active: self.activeFilter === 'active' },
                { key: 'inactive', icon: '鈴?, label: '宸插仠鐢?, value: self.stats.inactiveStores, color: 'warning', clickable: true, active: self.activeFilter === 'inactive' },
                { key: 'today', icon: '馃挵', label: '浠婃棩鏈夎惀鏀堕棬搴?, value: self.stats.todayTotalStores, color: 'info', unit: '瀹? }
            ]
        }
    },
    created: function() { this.loadData(true); },
    methods: {
        // ========== 鏁版嵁鍔犺浇 ==========
        loadData: function(reloadStats) {
            if (reloadStats === undefined) { reloadStats = true; }
            var self = this;
            self.loading = true;
            var params = {
                keyword: self.search.keyword || null,
                storeType: self.search.storeType,
                status: self.search.status,
                page: self.pagination.current,
                pageSize: self.pagination.size,
                sortBy: self.sort.sortBy,
                sortOrder: self.sort.sortOrder
            };
            // 濡傛灉閫変簡缁熻鍗＄墖绛涢€夛紝瑕嗙洊status
            if (self.activeFilter === 'active') { params.status = 1; }
            else if (self.activeFilter === 'inactive') { params.status = 0; }

            pageStores(params).then(function(res) {
                if (res && res.code === 1 && res.data) {
                    self.tableData = (res.data.records || []).map(function(r) {
                        // 淇敼鐐癸細鍓嶇琛ュ叏"鏁版嵁瀹屽杽搴?鐧惧垎姣旓紙0-100 鏁存暟锛夛紝渚?el-progress 灞曠ず
                        r.dataCompleteRate = self.calcCompleteRate(r);
                        return r;
                    });
                    // 淇敼鐐癸細鍒嗛〉瀛楁寮哄埗 Number锛岄伩鍏嶅悗绔繑鍥炲瓧绗︿覆瀵艰嚧 ElPagination 绫诲瀷鏍￠獙澶辫触
                    self.pagination.total = Number(res.data.total) || 0;
                    self.pagination.pages = Number(res.data.pages) || 0;
                    self.pagination.current = Number(res.data.current) || 1;
                    self.pagination.size = Number(res.data.size) || 10;
                    // 淇敼鐐癸細F9 鎬ц兘 鈥?鍏ㄥ眬缁熻涓庡垎椤靛垪琛ㄥ垎绂伙紝浠呮暟鎹獊鍙樺悗閲嶈浇锛岀炕椤?鎼滅储涓嶉噸绠?
                    if (reloadStats) { self.updateStats(); }
                }
            }).catch(function(err) {
                ReggieUI.error('鍔犺浇闂ㄥ簵鏁版嵁澶辫触');
            }).finally(function() { self.loading = false; });
        },
        updateStats: function() {
            var self = this;
            // 淇敼鐐癸細鏀逛负璋冪敤鍚庣 /store/stats SQL 鑱氬悎鎺ュ彛锛屾浛浠?listStores 鎷夊叏閲忓悗 filter 缁熻锛堟秷闄?N+1 涓庡叏閲忓唴瀛樿绠楋級
            storeStats().then(function(res) {
                if (res && res.code === 1 && res.data) {
                    var d = res.data;
                    self.stats.totalStores = Number(d.totalStores) || 0;
                    self.stats.activeStores = Number(d.activeStores) || 0;
                    self.stats.inactiveStores = Number(d.inactiveStores) || 0;
                    self.stats.todayTotalStores = Number(d.todayTotalStores) || 0;
                }
            }).catch(function() {});
        },

        // 淇敼鐐癸細stat-cards 鐐瑰嚮锛坧ayload.activeKey 涓?.sync 鏇存柊鍚庣殑鍊硷級
        onCardClick: function(payload) {
            this.activeFilter = payload.activeKey
            this.pagination.current = 1
            this.loadData(false)
        },
        // ========== 鎼滅储 ==========
        doSearch: function() {
            this.pagination.current = 1;
            this.activeFilter = '';
            this.loadData(false);
        },
        resetSearch: function() {
            this.search = { keyword: '', storeType: null, status: null };
            this.sort = { sortBy: 'createTime', sortOrder: 'desc' };
            this.activeFilter = '';
            this.pagination.current = 1;
            this.loadData(false);
        },

        // ========== 鎺掑簭 ==========
        onSortChange: function(sortInfo) {
            if (sortInfo.prop) {
                this.sort.sortBy = sortInfo.prop;
                this.sort.sortOrder = sortInfo.order === 'ascending' ? 'asc' : 'desc';
            } else {
                this.sort = { sortBy: 'createTime', sortOrder: 'desc' };
            }
            this.loadData(false);
        },

        // ========== 鍒嗛〉 ==========
        onPageChange: function(page) {
            this.pagination.current = page;
            this.loadData(false);
        },
        onPageSizeChange: function(size) {
            this.pagination.size = size;
            this.pagination.current = 1;
            this.loadData(false);
        },

        // ========== 閫夋嫨 ==========
        onSelectionChange: function(val) { this.selection = val; },

        // ========== 鎵归噺鎿嶄綔 ==========
        batchEnable: function() {
            this.batchConfirm(1, '鎵归噺鍚敤');
        },
        batchDisable: function() {
            this.batchConfirm(0, '鎵归噺鍋滅敤');
        },
        batchConfirm: function(status, label) {
            var self = this;
            var ids = self.selection.map(function(r) { return r.tenantId; });
            if (ids.length === 0) { ReggieUI.warning('璇烽€夋嫨闂ㄥ簵'); return; }
            ReggieUI.confirm('纭' + label + '宸查€夌殑 ' + ids.length + ' 涓棬搴楀悧锛?, '鎻愮ず', {
                confirmButtonText: '纭畾', cancelButtonText: '鍙栨秷', type: 'warning'
            }).then(function() {
                batchUpdateStatus(ids, status).then(function(res) {
                    if (res && res.code === 1) {
                        var result = res.data;
                        ReggieUI.success(label + '鎴愬姛锛? + result.successCount + '/' + result.total);
                        self.loadData();
                    } else {
                        ReggieUI.error(label + '澶辫触');
                    }
                }).catch(function() { ReggieUI.error(label + '澶辫触'); });
            }).catch(function() {});
        },
        doExport: function() {
            var self = this;
            var params = {
                keyword: self.search.keyword || null,
                storeType: self.search.storeType,
                status: self.search.status
            };
            ReggieUI.message({ message: '姝ｅ湪瀵煎嚭锛岃绋嶅€?..', type: 'info', duration: 2000 });
            exportStores(params).then(function(res) {
                var blob = new Blob([res], { type: 'text/csv;charset=utf-8' });
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'store_export_' + new Date().toISOString().slice(0,10) + '.csv';
                a.click();
                window.URL.revokeObjectURL(url);
                ReggieUI.success('瀵煎嚭鎴愬姛');
            }).catch(function() {
                ReggieUI.error('瀵煎嚭澶辫触');
            });
        },

        // ========== 鍗曡鎿嶄綔 ==========
        toggleSingleStatus: function(row) {
            var self = this;
            updateStatus(row.tenantId, row.status).then(function(res) {
                if (res && res.code === 1) {
                    ReggieUI.success('鐘舵€佸凡鏇存柊');
                }
            }).catch(function() { self.loadData(); });
        },
        switchToStore: function(row) {
            var self = this;
            switchStore(row.tenantId).then(function(res) {
                if (res && res.code === 1) {
                    ReggieUI.success('宸插垏鎹㈠埌闂ㄥ簵锛? + row.storeName);
                    self.loadData();
                }
            });
        },

        // ========== 璇︽儏 ==========
        openDetail: function(row) {
            var self = this;
            // 淇鐐癸細鍒楄〃鏁版嵁鍙兘涓嶅惈鍏ㄩ儴瀛楁锛岀粺涓€璧?/store/detail 鑾峰彇瀹屾暣淇℃伅
            getStoreDetail(row.tenantId).then(function(res) {
                if (res && res.code === 1 && res.data) {
                    var d = res.data;
                    d.dataCompleteRate = self.calcCompleteRate(d);
                    self.detailData = d;
                    self.detailDialogVisible = true;
                } else {
                    ReggieUI.error('鑾峰彇闂ㄥ簵璇︽儏澶辫触');
                }
            }).catch(function() {
                ReggieUI.error('鑾峰彇闂ㄥ簵璇︽儏澶辫触');
            });
        },
        // 鐐瑰嚮琛屾墦寮€璇︽儏锛堟帓闄ょ偣鍑绘搷浣滄寜閽?/ 澶嶉€夋 / 鐘舵€佸紑鍏崇瓑浜や簰鍏冪礌鏃剁殑璇Е鍙戯級
        onRowClick: function(row, column, event) {
            if (!event || !event.target) return;
            var t = event.target;
            if (t.closest('.el-button') || t.closest('.el-checkbox') || t.closest('.el-switch') || t.closest('.cell')) {
                // 鎿嶄綔鍒?/ 閫夋嫨鍒?/ 鐘舵€佸垪鐐瑰嚮涓嶈Е鍙戣鎯咃紙cell 鍐呭彲鑳藉惈鎸夐挳锛?
            }
            // 浠呭綋鐐瑰嚮鐨勬槸涓绘暟鎹崟鍏冩牸锛堥潪鎿嶄綔/閫夋嫨/鐘舵€佸垪锛夋椂鎵撳紑璇︽儏
            var cell = t.closest('.el-table__row td');
            if (!cell) return;
            var cls = cell.getAttribute('class') || '';
            if (cls.indexOf('el-table-column--selection') > -1) return;
            if (cls.indexOf('crud-actions-col') > -1) return;
            if (t.closest('.el-switch')) return;
            this.openDetail(row);
        },

        // ========== 缂栬緫 ==========
        openEditDialog: function(row) {
            var self = this;
            self.isCreate = false;
            self.editTenantId = row.tenantId;
            getStoreDetail(row.tenantId).then(function(res) {
                if (res && res.code === 1 && res.data) {
                    var d = res.data;
                    self.form = {
                        storeName: d.storeName || '',
                        storeCode: d.storeCode || '',
                        storeType: d.storeType || 2,
                        contactPerson: d.contactPerson || '',
                        contactPhone: d.contactPhone || '',
                        address: d.address || '',
                        businessHours: d.businessHours || '',
                        businessHoursRange: self.parseBusinessHours(d.businessHours),
                        deliveryRadius: d.deliveryRadius || 3000,
                        minDeliveryAmount: d.minDeliveryAmount || 20.00,
                        deliveryFee: d.deliveryFee || 0.00,
                        isDeliveryEnabled: d.isDeliveryEnabled || 1,
                        isDineInEnabled: d.isDineInEnabled || 1,
                        status: d.status || 1,
                        adminUsername: '', adminPassword: ''
                    };
                    self.formDialogVisible = true;
                }
            }).catch(function() {
                ReggieUI.error('鑾峰彇闂ㄥ簵璇︽儏澶辫触');
            });
        },

        // ========== 鏂板缓 ==========
        openCreateDialog: function() {
            this.isCreate = true;
            this.editTenantId = null;
            this.resetForm();
            this.formDialogVisible = true;
        },
        resetForm: function() {
            this.form = {
                storeName: '', storeCode: '', storeType: 2,
                contactPerson: '', contactPhone: '', address: '',
                businessHours: '', businessHoursRange: null,
                deliveryRadius: 3000, minDeliveryAmount: 20.00, deliveryFee: 0.00,
                isDeliveryEnabled: 1, isDineInEnabled: 1, status: 1,
                adminUsername: '', adminPassword: ''
            };
            if (this.$refs.formRef) this.$refs.formRef.clearValidate();
        },
        submitForm: function() {
            var self = this;
            self.$refs.formRef.validate(function(valid) {
                if (!valid) return;
                self.submitting = true;

                // 澶勭悊钀ヤ笟鏃堕棿
                var businessHours = self.form.businessHours;
                if (self.form.businessHoursRange && self.form.businessHoursRange.length === 2) {
                    businessHours = self.form.businessHoursRange[0] + '-' + self.form.businessHoursRange[1];
                }

                var payload = {
                    storeName: self.form.storeName,
                    storeCode: self.form.storeCode,
                    storeType: self.form.storeType,
                    contactPerson: self.form.contactPerson,
                    contactPhone: self.form.contactPhone,
                    address: self.form.address,
                    businessHours: businessHours,
                    deliveryRadius: self.form.deliveryRadius,
                    minDeliveryAmount: self.form.minDeliveryAmount,
                    deliveryFee: self.form.deliveryFee,
                    isDeliveryEnabled: self.form.isDeliveryEnabled,
                    isDineInEnabled: self.form.isDineInEnabled,
                    status: self.form.status
                };

                var apiCall;
                if (self.isCreate) {
                    payload.adminUsername = self.form.adminUsername;
                    payload.adminPassword = self.form.adminPassword;
                    apiCall = createStore(payload);
                } else {
                    apiCall = updateStore(self.editTenantId, payload);
                }

                apiCall.then(function(res) {
                    if (res && res.code === 1) {
                        ReggieUI.success(self.isCreate ? '闂ㄥ簵鍒涘缓鎴愬姛' : '缂栬緫鎴愬姛');
                        self.formDialogVisible = false;
                        self.loadData();
                    } else {
                        ReggieUI.error(res.msg || '鎿嶄綔澶辫触');
                    }
                }).catch(function(err) {
                    ReggieUI.error('鎿嶄綔澶辫触: ' + (err.response && err.response.data && err.response.data.msg || err.message));
                }).finally(function() { self.submitting = false; });
            });
        },

        // ========== 鍚屾 ==========
        openSyncDialog: function(row) {
            this.syncTargetId = row.tenantId;
            this.syncTargetName = row.storeName;
            this.syncResult = null;
            this.syncDialogVisible = true;
        },
        doSync: function(type) {
            var self = this;
            var sourceTenantId = null;
            if (self.tableData.length > 0) sourceTenantId = self.tableData[0].tenantId;
            var apiMap = {
                dishes: syncDishes({ sourceTenantId: sourceTenantId, targetTenantId: self.syncTargetId, dishIds: null, operatorId: 1 }),
                categories: syncCategories({ sourceTenantId: sourceTenantId, targetTenantId: self.syncTargetId, operatorId: 1 }),
                setmeals: syncSetmeals({ sourceTenantId: sourceTenantId, targetTenantId: self.syncTargetId, setmealIds: null, operatorId: 1 })
            };
            var apiCall = apiMap[type];
            if (!apiCall) return;
            self.syncing[type] = true;
            apiCall.then(function(res) {
                if (res && res.code === 1) {
                    self.syncResult = res.data;
                    ReggieUI.success('鍚屾瀹屾垚');
                }
            }).catch(function() {
                ReggieUI.error('鍚屾澶辫触');
            }).finally(function() { self.syncing[type] = false; });
        },

        // ========== 宸ュ叿鏂规硶 ==========
        storeTypeTag: function(type) {
            return type === 1 ? 'danger' : type === 2 ? 'success' : 'warning';
        },
        storeTypeName: function(type) {
            var map = { 1: '鎬诲簵', 2: '鐩磋惀', 3: '鍔犵洘' };
            return map[type] || String(type);
        },
        fmtAmount: function(val) {
            if (val === null || val === undefined) return '0.00';
            if (typeof val === 'number') return val.toFixed(2);
            return Number(val).toFixed(2);
        },
        // 淇敼鐐癸細缁熶竴绫诲瀷杞崲宸ュ叿锛岃В鍐崇粍浠跺睘鎬х被鍨嬫牎楠屽け璐ラ棶棰?
        // 灏嗕换鎰忓€硷紙瀛楃涓?鏁板瓧/绌猴級杞崲涓?Number锛汦lProgress.percentage 蹇呴』 Number
        toNumber: function(val) {
            var n = Number(val);
            if (isNaN(n)) return 0;
            return n;
        },
        // 淇敼鐐癸細鍒涘缓鏃堕棿瀹夊叏鏍煎紡鍖栵紝鍏煎鍚庣杩斿洖鐨勫绉嶅舰鎬?
        // 鍚庣 LocalDateTime(t.create_time) 缁?Jackson 搴忓垪鍖栧彲鑳戒负锛氬瓧绗︿覆 / 鏃堕棿鎴虫暟瀛?/ 鏁扮粍([骞?鏈?鏃?...]) / 瀵硅薄
        // 鐩存帴璋冪敤 substring 鍦ㄩ潪瀛楃涓插舰鎬佷笅浼氭姏 "row.createTime.substring is not a function"锛屾澶勭粺涓€杞崲
        formatDate: function(val) {
            if (val === null || val === undefined || val === '') return '';
            if (typeof val === 'string') return val.substring(0, 10);
            if (typeof val === 'number') return new Date(val).toISOString().substring(0, 10);
            if (Array.isArray(val)) {
                var p = function(n) { return (Number(n) < 10 ? '0' : '') + Number(n); };
                if (val.length >= 3) return val[0] + '-' + p(val[1]) + '-' + p(val[2]);
                return '';
            }
            return String(val).substring(0, 10);
        },
        // 淇敼鐐癸細璇︽儏寮圭獥鐢紝淇濈暀瀹屾暣鏃ユ湡鏃堕棿锛堝勾-鏈?鏃?鏃?鍒?绉掞級
        formatDateTime: function(val) {
            if (val === null || val === undefined || val === '') return '鈥?;
            if (typeof val === 'string') return val.replace('T', ' ').substring(0, 19);
            if (typeof val === 'number') return new Date(val).toISOString().replace('T', ' ').substring(0, 19);
            return String(val);
        },
        // 淇敼鐐癸細el-progress 棰滆壊闅忓畬鍠勫害鍙樺寲锛堢豢/姗?鐏帮級锛岀粺涓€璧拌涔変护鐗?
        progressColor: function(val) {
            var n = this.toNumber(val);
            if (n >= 80) return 'var(--color-success)';
            if (n >= 50) return 'var(--color-warning)';
            return 'var(--color-info)';
        },
        // 淇敼鐐癸細鏍规嵁瀛楁濉啓鎯呭喌璁＄畻鏁版嵁瀹屽杽搴︼紙0-100 鏁存暟锛夛紝椹卞姩 el-progress
        calcCompleteRate: function(row) {
            var fields = [
                row.storeName, row.storeCode, row.contactPerson, row.contactPhone,
                row.address, row.businessHours, row.deliveryRadius,
                row.minDeliveryAmount, row.deliveryFee,
                row.isDeliveryEnabled, row.isDineInEnabled
            ];
            var filled = 0;
            for (var i = 0; i < fields.length; i++) {
                if (fields[i] !== null && fields[i] !== undefined && fields[i] !== '') filled++;
            }
            return Math.round((filled / fields.length) * 100);
        },
        parseBusinessHours: function(val) {
            if (!val) return null;
            var parts = val.split('-');
            if (parts.length === 2) return [parts[0], parts[1]];
            return null;
        }
    }
});
</script>
