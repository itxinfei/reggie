<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="category-app">
    <div class="container">
      <!-- ========== 数据统计卡片（统一组件） ========== -->
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards" :active-key.sync="activeFilter" @card-click="onCardClick"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <!-- 修改点：动态下拉框通过 search-extra 插槽注入（数据从 API 加载） -->
        <template slot="search-extra">
          <el-select v-model="searchName" placeholder="请选择分类名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')"
            @visible-change="loadFilterOptions">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination，columns 配置化，内置分页 -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="120"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-type="{ row }">
          <span>{{ row.type == '1' ? '菜品分类' : '套餐分类' }}</span>
        </template>
        <template #actions="{ row }">
          <el-button
            type="text"
            size="small"
            class="btn-view"
            @click="editHandle(row)"
          >修改</el-button>
          <el-button
            type="text"
            size="small"
            class="btn-delete"
            @click="deleteHandle(row.id)"
          >删除</el-button>
        </template>
      </crud-table>
    </div>
    <!-- 修改点：使用 <crud-dialog> 统一组件替代手写 el-dialog，footer 插槽保留"保存并继续添加" -->
    <crud-dialog
      :title="classData.title"
      :visible.sync="classData.dialogVisible"
      size="md"
      :close-on-click-modal="false"
    >
      <el-form
        class="demo-form-inline"
        label-width="120px"
        size="small"
        :model="classData"
        ref="categoryForm"
      >
        <el-form-item label="分类名称：" prop="name">
          <el-input
            v-model="classData.name"
            placeholder="请输入分类名称"
            maxlength="14"
          />
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input-number
            v-model="classData.sort"
            :min="1"
            :max="9999"
            placeholder="不填则自动分配"
            style="width: 293px;"
          ></el-input-number>
          <span class="form-tip">不填则自动排列到最后</span>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button size="medium" @click="classData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
        <el-button
          v-if="action != 'edit'"
          type="primary"
          size="medium"
          class="continue"
          @click="submitForm('go')"
        > 保存并继续添加 </el-button>
      </template>
    </crud-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/category.js"></script>
    <script src="../../js/components.js"></script>
    <script>
      new Vue({
        el: '#category-app',
        // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
        mixins: [window.ReggieListMixin],
        data() {
          return {
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            loading: false,
            // 修改点：<table-bar> 组件配置
            tableSearchItems: [],
            tableActions: [
              { key: 'addFood', text: '+ 新增菜品分类', type: 'primary' },
              { key: 'addCombo', text: '+ 新增套餐分类', type: 'primary' }
            ],
            type :'',
            // 修改点：搜索条件，与卡片筛选互斥
            searchName: '',
            // 修改点：搜索下拉框动态选项（从数据库加载分类名称）
            filterOptions: { names: [] },
            optionsLoading: false,
            optionsLoadError: false,
            // 数据统计
            stats: {
              totalCategories: 0,
              foodCategories: 0,
              comboCategories: 0,
              todayNew: 0           // 修改点：今日新增分类数
            },
            // 修改点：当前激活的分类类型筛选器，空字符串=全部
            activeFilter: '',
            // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
            columns: [
              { prop: 'name', label: '分类名称', minWidth: 140 },
              { prop: 'type', label: '分类类型', width: 120, align: 'center', slot: true },
              { prop: 'updateTime', label: '操作时间', minWidth: 160 },
              { prop: 'sort', label: '排序', width: 80, align: 'center' }
            ],
            classData: {
              'title': '添加菜品分类',
              'dialogVisible': false,
              'categoryId': '',
              'id': '',             // 修改点：显式声明id字段，编辑时回填
              'name': '',
              sort: null            // 修改点：null 让 el-input-number 正常工作，不填则后端自动分配
            }
          }
        },
        computed: {
          // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
          statsCards() {
            var self = this
            return [
              { key: '', icon: '📂', label: '分类总数', value: self.stats.totalCategories || 0, color: 'primary', clickable: true, active: self.activeFilter === '' },
              { key: '1', icon: '🍽️', label: '菜品分类', value: self.stats.foodCategories || 0, color: 'success', clickable: true, active: self.activeFilter === '1' },
              { key: '2', icon: '🍱', label: '套餐分类', value: self.stats.comboCategories || 0, color: 'warning', clickable: true, active: self.activeFilter === '2' },
              { key: '新增', icon: '🆕', label: '今日新增', value: self.stats.todayNew || 0, color: 'info', clickable: false }
            ]
          }
        },
        created() {
          this.loadFilterOptions()
          this.fetchData()
        },
        mounted() {
        },
        methods: {
          // 修改点：通用优化方案 — 下拉框本地缓存，避免每次打开都发请求
          async loadFilterOptions() {
            // 如果已加载过数据，直接使用缓存
            if (this.filterOptions.names.length > 0) {
              this.optionsLoading = false
              return
            }
            this.optionsLoading = true
            this.optionsLoadError = false
            try {
              const res = await categoryOptions()
              if (String(res.code) === '1' && res.data) {
                this.filterOptions.names = res.data.names || []
              } else {
                this.optionsLoadError = true
                this.$message.warning('加载分类选项失败：' + (res.msg || '接口返回异常'))
              }
            } catch (err) {
              if (err.message === 'NOTLOGIN') {
                return
              }
              this.optionsLoadError = true
              console.error('加载分类选项失败:', err)
              this.$message.error('加载筛选选项失败，请刷新页面重试')
            } finally {
              this.optionsLoading = false
            }
          },
          async fetchData() {
            this.loading = true
            // 修改点：传递类型筛选参数 + 名称搜索参数到后端
            var params = {'page': this.page, 'pageSize': this.pageSize}
            if (this.activeFilter) { params.type = this.activeFilter }
            // 修改点：搜索名称去除首尾空格后传递，空字符串不传
            var name = (this.searchName || '').trim()
            if (name) { params.name = name }
            // 并行加载分类列表和统计数据
            const [categoryRes, statsRes] = await Promise.all([
              getCategoryPage(params),
              this.loadCategoryStats()
            ])

            // 处理分类列表数据
            if (String(categoryRes.code) === '1') {
              this.tableData = categoryRes.data.records
              this.counts = Number(categoryRes.data.total)
            } else {
              this.$message.error(categoryRes.msg || '操作失败')
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }

            this.loading = false
          },
          // 修改点：加载分类统计数据——使用后端 /stats 接口，数据100%准确
          async loadCategoryStats() {
            try {
              const res = await getCategoryStats()
              if (String(res.code) === '1' && res.data) {
                return { code: 1, data: res.data }
              }
            } catch (err) {
              console.warn('加载分类统计数据失败:', err)
            }
            return { code: 0 }
          },
          handleQuery() {
            // 修改点：搜索时复位卡片筛选，避免冲突
            this.activeFilter = ''
            this.page = 1;
            this.fetchData();
          },
          // 修改点：<table-bar> 组件 action 按钮事件处理
          onTableAction(payload) {
            if (payload.key === 'addFood') { this.addClass('class') }
            else if (payload.key === 'addCombo') { this.addClass('meal') }
          },
          // 修改点：stat-cards 组件卡片点击事件（替代原 filterByType）
          onCardClick(payload) {
            this.activeFilter = payload.activeKey
            this.searchName = ''
            this.page = 1
            this.fetchData()
          },
          // 重置搜索条件，恢复表格初始状态
          reset() {
            this.searchName = ''
            this.activeFilter = ''
            this.page = 1
            this.fetchData()
          },
           // 添加
          addClass(st) {
            if (st === 'class') {
              this.classData.title = '新增菜品分类'
              this.type = '1'
            } else {
              this.classData.title = '新增套餐分类'
              this.type = '2'
            }
            this.action = 'add'
            this.classData.name = ''
            this.classData.sort = null  // 修改点：null 表示不填则后端自动分配排序号
            this.classData.dialogVisible = true
          },
          editHandle(dat) {
            this.classData.title = '修改分类'
            this.action = 'edit'
            this.classData.name = dat.name
            this.classData.sort = dat.sort
            this.classData.id = dat.id
            this.type = dat.type
            this.classData.dialogVisible = true
          },
          // 关闭弹窗
          handleClose(st) {
            this.classData.dialogVisible = false
          },
          //删除
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该分类, 是否继续?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
            }).then(() => {
              deleCategory(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          // 修改点：数据提交——校验逻辑简化，排序为空则后端自动分配
          submitForm(st) {
            const classData = this.classData
            const name = (classData.name || '').trim()
            if (!name) {
              this.$message.error('请输入分类名称')
              return
            }
            if (name.length > 14) {
              this.$message.error('分类名称最多14个字符')
              return
            }
            // 排序号可选，如果填了则必须是正整数
            if (classData.sort !== null && classData.sort !== undefined && classData.sort !== '') {
              if (!/^\d+$/.test(String(classData.sort))) {
                this.$message.error('排序只能输入正整数')
                return
              }
            }
            const params = { name: name, type: this.type }
            if (classData.sort !== null && classData.sort !== undefined && classData.sort !== '') {
              params.sort = classData.sort
            }
            if (this.action === 'add') {
              addCategory(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('分类添加成功！')
                  if (!st) {
                    this.classData.dialogVisible = false
                  } else {
                    this.classData.name = ''
                    this.classData.sort = null
                  }
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            } else {
              params.id = this.classData.id
              editCategory(params).then(res => {
                if (res.code === 1) {
                  this.$message.success('分类修改成功！')
                  this.classData.dialogVisible = false
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            }
          },
          // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除
        }
      })
    </script>
</body>
</html>
