<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    /* ========== 数据统计卡片 ========== */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid #f0f2f5;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* 修改点：stats-card 可点击筛选 */
    .stat-card.clickable { cursor: pointer; user-select: none; }
    .stat-card.active {
      border-color: #409eff;
      box-shadow: 0 0 0 2px rgba(64,158,255,0.3);
      transform: translateY(-3px);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient);
    }

    .stat-card .stat-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 42px;
    }

    .stat-card .stat-label {
      font-size: 13px;
      color: #909399;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-card .stat-value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card.primary { --gradient: linear-gradient(135deg, #409eff 0%, #66b1ff 100%); }
    .stat-card.success { --gradient: linear-gradient(135deg, #67c23a 0%, #85ce61 100%); }
    .stat-card.warning { --gradient: linear-gradient(135deg, #e6a23c 0%, #ebb563 100%); }
    .stat-card.danger  { --gradient: linear-gradient(135deg, #f56c6c 0%, #f78989 100%); }
    .stat-card.info    { --gradient: linear-gradient(135deg, #909399 0%, #a6a9ad 100%); }

    @media (max-width: 768px) {
      .stats-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="category-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：卡片可点击筛选，点击后按分类类型过滤列表 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterByType('')">
          <div class="stat-icon">📂</div>
          <div class="stat-label">分类总数</div>
          <div class="stat-value">{{ stats.totalCategories || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === '1' }" @click="filterByType('1')">
          <div class="stat-icon">🍽️</div>
          <div class="stat-label">菜品分类</div>
          <div class="stat-value">{{ stats.foodCategories || 0 }}</div>
        </div>
        <div class="stat-card warning clickable" :class="{ active: activeFilter === '2' }" @click="filterByType('2')">
          <div class="stat-icon">🍱</div>
          <div class="stat-label">套餐分类</div>
          <div class="stat-value">{{ stats.comboCategories || 0 }}</div>
        </div>
      </div>

      <!-- 修改点：新增搜索框，支持按分类名称搜索 -->
      <div class="tableBar">
        <el-input
          v-model="searchName"
          placeholder="请输入分类名称"
          style="width: 250px"
          clearable
          @keyup.enter.native="handleQuery"
        >
          <i
            slot="prefix"
            class="el-input__icon el-icon-search"
            style="cursor: pointer"
            @click="handleQuery"
          ></i>
        </el-input>
        <el-button type="primary" size="small" @click="handleQuery">查询</el-button>
        <el-button size="small" @click="reset">重置</el-button>
        <el-button
          type="primary"
          class="continue"
          @click="addClass('class')"
        >
          + 新增菜品分类
        </el-button>
        <el-button
          type="primary"
          @click="addClass('meal')"
        >
          + 新增套餐分类
        </el-button>
      </div>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
      >
        <el-table-column
          prop="name"
          label="分类名称"
        ></el-table-column>
        <el-table-column
          prop="type"
          label="分类类型"
        >
          <template slot-scope="scope">
            <span>{{ scope.row.type == '1' ? '菜品分类': '套餐分类' }}</span>
          </template>
        </el-table-column>
        <el-table-column
          prop="updateTime"
          label="操作时间"
        >
        <template slot-scope="scope">
         {{scope.row.updateTime}}
        </template>
        </el-table-column>
        <el-table-column
          prop="sort"
          label="排序"
        ></el-table-column>
        <el-table-column
          label="操作"
          align="center"
          width="120"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="blueBug"
              @click="editHandle(scope.row)"
            >修改</el-button>
            <el-button
              type="text"
              size="small"
              class="delBut non"
              @click="deleteHandle(scope.row.id)"
            >删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog
      :title="classData.title"
      :visible.sync="classData.dialogVisible"
      width="500px"
      :before-close="handleClose"
      :close-on-click-modal="false"
    >
      <el-form
        class="demo-form-inline"
        label-width="120px"
        :model="classData"
        ref="categoryForm"
      >
        <el-form-item label="分类名称：" prop="name">
          <el-input
            v-model="classData.name"
            placeholder="请输入分类名称"
            maxlength="14"
            style="width: 293px;"
          />
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input-number
            v-model="classData.sort"
            :min="0"
            :max="9999"
            placeholder="请输入排序"
            style="width: 293px;"
          ></el-input-number>
        </el-form-item>
      </el-form>
      <div slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
        <el-button
          v-if="action != 'edit'"
          type="primary"
          size="medium"
          class="continue"
          @click="submitForm('go')"
        > 保存并继续添加 </el-button>
      </div>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/category.js"></script>
    <script>
      new Vue({
        el: '#category-app',
        data() {
          return {
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            loading: false,
            type :'',
            // 修改点：搜索条件，与卡片筛选互斥
            searchName: '',
            // 数据统计
            stats: {
              totalCategories: 0,
              foodCategories: 0,
              comboCategories: 0
            },
            // 修改点：当前激活的分类类型筛选器，空字符串=全部
            activeFilter: '',
            classData: {
              'title': '添加菜品分类',
              'dialogVisible': false,
              'categoryId': '',
              'name': '',
              sort: ''
            }
          }
        },
        computed: {},
        created() {
          this.init()
        },
        mounted() {
        },
        methods: {
          async init () {
            this.loading = true
            // 修改点：传递类型筛选参数 + 名称搜索参数到后端
            var params = {'page': this.page, 'pageSize': this.pageSize}
            if (this.activeFilter) { params.type = this.activeFilter }
            // 修改点：搜索名称去除首尾空格后传递，空字符串不传
            var name = (this.searchName || '').trim()
            if (name) { params.name = name }
            // 并行加载分类列表和统计数据
            const [categoryRes, statsRes] = await Promise.all([
              getCategoryPage(params),
              this.loadCategoryStats()
            ])

            // 处理分类列表数据
            if (String(categoryRes.code) === '1') {
              this.tableData = categoryRes.data.records
              this.counts = Number(categoryRes.data.total)
            } else {
              this.$message.error(categoryRes.msg || '操作失败')
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }

            this.loading = false
          },
          // 加载分类统计数据
          async loadCategoryStats() {
            try {
              const res = await getCategoryPage({'page': 1, 'pageSize': 1000})
              if (String(res.code) === '1') {
                const records = res.data.records || []
                const total = res.data.total || 0
                // 修改点：后端 type 是 Integer，JSON 序列化为数字 1/2，不能用字符串 '1'/'2' 做 === 比较
                const foodCount = records.filter(item => item.type === 1).length
                const comboCount = records.filter(item => item.type === 2).length
                return {
                  code: 1,
                  data: {
                    totalCategories: total,
                    foodCategories: foodCount,
                    comboCategories: comboCount
                  }
                }
              }
            } catch (err) {
              console.warn('加载分类统计数据失败:', err)
            }
            return { code: 0 }
          },
          handleQuery() {
            // 修改点：搜索时复位卡片筛选，避免冲突
            this.activeFilter = ''
            this.page = 1;
            this.init();
          },
          // 重置搜索条件，恢复表格初始状态
          reset() {
            this.searchName = ''
            this.activeFilter = ''
            this.page = 1
            this.init()
          },
          // 修改点：stats-card 点击切换分类类型筛选（清空搜索条件避免冲突）
          filterByType(type) {
            if (this.activeFilter === type) {
              this.activeFilter = ''  // 再次点击取消筛选
            } else {
              this.activeFilter = type
            }
            // 修改点：卡片筛选时清空搜索条件
            this.searchName = ''
            this.page = 1
            this.init()
          },
           // 添加
          addClass(st) {
            if (st === 'class') {
              this.classData.title = '新增菜品分类'
              this.type = '1'
            } else {
              this.classData.title = '新增套餐分类'
              this.type = '2'
            }
            this.action = 'add'
            this.classData.name = ''
            this.classData.sort = ''
            this.classData.dialogVisible = true
          },
          editHandle(dat) {
            this.classData.title = '修改分类'
            this.action = 'edit'
            this.classData.name = dat.name
            this.classData.sort = dat.sort
            this.classData.id = dat.id
            this.type = dat.type
            this.classData.dialogVisible = true
          },
          // 关闭弹窗
          handleClose(st) {
            this.classData.dialogVisible = false
          },
          //删除
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该文件, 是否继续?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
            }).then(() => {
              deleCategory(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          //数据提交
          submitForm(st) {
              const classData = this.classData
              const valid = (classData.name === 0 ||classData.name)  && (classData.sort === 0 || classData.sort)
              if (this.action === 'add') {
                if (valid) {
                  const reg = /^\d+$/
                  if (reg.test(classData.sort)) {
                    addCategory({'name': classData.name,'type':this.type, sort: classData.sort}).then(res => {
                      if (res.code === 1) {
                        this.$message.success('分类添加成功！')
                        if (!st) {
                          this.classData.dialogVisible = false
                        } else {
                          this.classData.name = ''
                          this.classData.sort = ''
                        }
                        this.handleQuery()
                      } else {
                        this.$message.error(res.msg || '操作失败')
                      }
                    }).catch(err => {
                      this.$message.error('请求失败：' + err)
                    })
                  } else {
                    this.$message.error('排序只能输入数字类型')
                  }
                  
              } else {
                  this.$message.error('请输入分类名称或排序')
              }
            } else if (valid) {
              const reg = /^\d+$/
              if (reg.test(this.classData.sort)) {
                // 修改点：编辑时也带上 type 字段
                editCategory({'id':this.classData.id,'name': this.classData.name, 'type': this.type, sort: this.classData.sort}).then(res => {
                  if (res.code === 1) {
                    this.$message.success('分类修改成功！')
                    this.classData.dialogVisible = false
                    this.handleQuery()
                  } else {
                    this.$message.error(res.msg || '操作失败')
                  }
                }).catch(err => {
                  this.$message.error('请求失败：' + err)
                })
              } else {
                this.$message.error('排序只能输入数字类型')
              }
            } else {
              this.$message.error('请输入分类名称或排序')
            }
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
