<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 - 瑞吉外卖管理端</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="category-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：卡片可点击筛选，点击后按分类类型过滤列表 -->
      <div class="stats-cards">
        <div class="stat-card primary clickable" :class="{ active: activeFilter === '' }" @click="filterByType('')">
          <div class="stat-icon">📂</div>
          <div class="stat-label">分类总数</div>
          <div class="stat-value">{{ stats.totalCategories || 0 }}</div>
        </div>
        <div class="stat-card success clickable" :class="{ active: activeFilter === '1' }" @click="filterByType('1')">
          <div class="stat-icon">🍽️</div>
          <div class="stat-label">菜品分类</div>
          <div class="stat-value">{{ stats.foodCategories || 0 }}</div>
        </div>
        <div class="stat-card warning clickable" :class="{ active: activeFilter === '2' }" @click="filterByType('2')">
          <div class="stat-icon">🍱</div>
          <div class="stat-label">套餐分类</div>
          <div class="stat-value">{{ stats.comboCategories || 0 }}</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">🆕</div>
          <div class="stat-label">今日新增</div>
          <div class="stat-value">{{ stats.todayNew || 0 }}</div>
        </div>
      </div>

      <!-- 修改点：新增搜索框，支持按分类名称搜索 -->
      <div class="tableBar">
        <!-- 修改点：通用优化方案 — 文本输入框改为动态下拉框，选项从数据库加载 -->
        <el-select v-model="searchName" placeholder="请选择分类名称" class="el-select--narrow-xs" clearable filterable size="small"
          :loading="optionsLoading"
          :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')"
          @visible-change="onFilterDropdownVisible">
          <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
        </el-select>
        <el-button type="primary" size="small" class="btn-query" @click="handleQuery">查询</el-button>
        <el-button size="small" class="btn-reset" @click="reset">重置</el-button>
        <el-button
          type="primary"
          class="btn-add"
          @click="addClass('class')"
        >
          + 新增菜品分类
        </el-button>
        <el-button
          type="primary"
          class="btn-add"
          @click="addClass('meal')"
        >
          + 新增套餐分类
        </el-button>
      </div>
      <el-table
        v-loading="loading"
        :data="tableData"
        stripe
        border
        class="tableBox"
      >
        <el-table-column
          prop="name"
          label="分类名称"
        ></el-table-column>
        <el-table-column
          prop="type"
          label="分类类型"
        >
          <template slot-scope="scope">
            <span>{{ scope.row.type == '1' ? '菜品分类': '套餐分类' }}</span>
          </template>
        </el-table-column>
        <el-table-column
          prop="updateTime"
          label="操作时间"
        >
        <template slot-scope="scope">
         {{scope.row.updateTime}}
        </template>
        </el-table-column>
        <el-table-column
          prop="sort"
          label="排序"
        ></el-table-column>
        <el-table-column
          label="操作"
          align="center"
          width="120"
        >
          <template slot-scope="scope">
            <el-button
              type="text"
              size="small"
              class="btn-view"
              @click="editHandle(scope.row)"
            >修改</el-button>
            <el-button
              type="text"
              size="small"
              class="btn-delete"
              @click="deleteHandle(scope.row.id)"
            >删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog
      :title="classData.title"
      :visible.sync="classData.dialogVisible"
      width="560px"
      :before-close="handleClose"
      :close-on-click-modal="false"
    >
      <el-form
        class="demo-form-inline"
        label-width="120px"
        :model="classData"
        ref="categoryForm"
      >
        <el-form-item label="分类名称：" prop="name">
          <el-input
            v-model="classData.name"
            placeholder="请输入分类名称"
            maxlength="14"
          />
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input-number
            v-model="classData.sort"
            :min="0"
            :max="9999"
            placeholder="请输入排序"
            style="width: 293px;"
          ></el-input-number>
        </el-form-item>
      </el-form>
      <div slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
        <el-button
          v-if="action != 'edit'"
          type="primary"
          size="medium"
          class="continue"
          @click="submitForm('go')"
        > 保存并继续添加 </el-button>
      </div>
    </el-dialog>
  </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../plugins/axios/axios.min.js"></script>
    <script src="../../js/request.js"></script>
    <script src="../../api/category.js"></script>
    <script>
      new Vue({
        el: '#category-app',
        data() {
          return {
            action: '',
            counts: 0,
            page: 1,
            pageSize: 10,
            tableData: [],
            loading: false,
            type :'',
            // 修改点：搜索条件，与卡片筛选互斥
            searchName: '',
            // 修改点：搜索下拉框动态选项（从数据库加载分类名称）
            filterOptions: { names: [] },
            optionsLoading: false,
            optionsLoadError: false,
            // 数据统计
            stats: {
              totalCategories: 0,
              foodCategories: 0,
              comboCategories: 0,
              todayNew: 0           // 修改点：今日新增分类数
            },
            // 修改点：当前激活的分类类型筛选器，空字符串=全部
            activeFilter: '',
            classData: {
              'title': '添加菜品分类',
              'dialogVisible': false,
              'categoryId': '',
              'name': '',
              sort: ''
            }
          }
        },
        computed: {},
        created() {
          this.loadFilterOptions()
          this.init()
        },
        mounted() {
        },
        methods: {
          // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
          async loadFilterOptions() {
            this.optionsLoading = true
            this.optionsLoadError = false
            try {
              const res = await categoryOptions()
              if (String(res.code) === '1' && res.data) {
                this.filterOptions.names = res.data.names || []
              } else {
                this.optionsLoadError = true
                this.$message.warning('加载分类选项失败：' + (res.msg || '接口返回异常'))
              }
            } catch (err) {
              // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
              if (err.message === 'NOTLOGIN') {
                return
              }
              this.optionsLoadError = true
              console.error('加载分类选项失败:', err)
              this.$message.error('加载筛选选项失败，请刷新页面重试')
            } finally {
              this.optionsLoading = false
            }
          },
          async init () {
            this.loading = true
            // 修改点：传递类型筛选参数 + 名称搜索参数到后端
            var params = {'page': this.page, 'pageSize': this.pageSize}
            if (this.activeFilter) { params.type = this.activeFilter }
            // 修改点：搜索名称去除首尾空格后传递，空字符串不传
            var name = (this.searchName || '').trim()
            if (name) { params.name = name }
            // 并行加载分类列表和统计数据
            const [categoryRes, statsRes] = await Promise.all([
              getCategoryPage(params),
              this.loadCategoryStats()
            ])

            // 处理分类列表数据
            if (String(categoryRes.code) === '1') {
              this.tableData = categoryRes.data.records
              this.counts = Number(categoryRes.data.total)
            } else {
              this.$message.error(categoryRes.msg || '操作失败')
            }

            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }

            this.loading = false
          },
          // 加载分类统计数据
          async loadCategoryStats() {
            try {
              const res = await getCategoryPage({'page': 1, 'pageSize': 1000})
              if (String(res.code) === '1') {
                const records = res.data.records || []
                const total = res.data.total || 0
                // 修改点：后端 type 是 Integer，JSON 序列化为数字 1/2，不能用字符串 '1'/'2' 做 === 比较
                const foodCount = records.filter(item => item.type === 1).length
                const comboCount = records.filter(item => item.type === 2).length
                // 修改点：计算今日新增分类数
                const today = new Date().toISOString().slice(0, 10) // yyyy-MM-dd
                const todayNew = records.filter(item => {
                  return item.createTime && item.createTime.startsWith(today)
                }).length
                return {
                  code: 1,
                  data: {
                    totalCategories: total,
                    foodCategories: foodCount,
                    comboCategories: comboCount,
                    todayNew: todayNew
                  }
                }
              }
            } catch (err) {
              console.warn('加载分类统计数据失败:', err)
            }
            return { code: 0 }
          },
          handleQuery() {
            // 修改点：搜索时复位卡片筛选，避免冲突
            this.activeFilter = ''
            this.page = 1;
            this.init();
          },
          // 重置搜索条件，恢复表格初始状态
          reset() {
            this.searchName = ''
            this.activeFilter = ''
            this.page = 1
            this.init()
          },
          // 修改点：stats-card 点击切换分类类型筛选（清空搜索条件避免冲突）
          filterByType(type) {
            if (this.activeFilter === type) {
              this.activeFilter = ''  // 再次点击取消筛选
            } else {
              this.activeFilter = type
            }
            // 修改点：卡片筛选时清空搜索条件
            this.searchName = ''
            this.page = 1
            this.init()
          },
           // 添加
          addClass(st) {
            if (st === 'class') {
              this.classData.title = '新增菜品分类'
              this.type = '1'
            } else {
              this.classData.title = '新增套餐分类'
              this.type = '2'
            }
            this.action = 'add'
            this.classData.name = ''
            this.classData.sort = ''
            this.classData.dialogVisible = true
          },
          editHandle(dat) {
            this.classData.title = '修改分类'
            this.action = 'edit'
            this.classData.name = dat.name
            this.classData.sort = dat.sort
            this.classData.id = dat.id
            this.type = dat.type
            this.classData.dialogVisible = true
          },
          // 关闭弹窗
          handleClose(st) {
            this.classData.dialogVisible = false
          },
          //删除
          deleteHandle(id) {
            this.$confirm('此操作将永久删除该文件, 是否继续?', '提示', {
              'confirmButtonText': '确定',
              'cancelButtonText': '取消',
              'type': 'warning'
            }).then(() => {
              deleCategory(id).then(res => {
                if (res.code === 1) {
                  this.$message.success('删除成功！')
                  this.handleQuery()
                } else {
                  this.$message.error(res.msg || '操作失败')
                }
              }).catch(err => {
                this.$message.error('请求失败：' + err)
              })
            })
          },
          //数据提交
          submitForm(st) {
              const classData = this.classData
              const valid = (classData.name === 0 ||classData.name)  && (classData.sort === 0 || classData.sort)
              if (this.action === 'add') {
                if (valid) {
                  const reg = /^\d+$/
                  if (reg.test(classData.sort)) {
                    addCategory({'name': classData.name,'type':this.type, sort: classData.sort}).then(res => {
                      if (res.code === 1) {
                        this.$message.success('分类添加成功！')
                        if (!st) {
                          this.classData.dialogVisible = false
                        } else {
                          this.classData.name = ''
                          this.classData.sort = ''
                        }
                        this.handleQuery()
                      } else {
                        this.$message.error(res.msg || '操作失败')
                      }
                    }).catch(err => {
                      this.$message.error('请求失败：' + err)
                    })
                  } else {
                    this.$message.error('排序只能输入数字类型')
                  }
                  
              } else {
                  this.$message.error('请输入分类名称或排序')
              }
            } else if (valid) {
              const reg = /^\d+$/
              if (reg.test(this.classData.sort)) {
                // 修改点：编辑时也带上 type 字段
                editCategory({'id':this.classData.id,'name': this.classData.name, 'type': this.type, sort: this.classData.sort}).then(res => {
                  if (res.code === 1) {
                    this.$message.success('分类修改成功！')
                    this.classData.dialogVisible = false
                    this.handleQuery()
                  } else {
                    this.$message.error(res.msg || '操作失败')
                  }
                }).catch(err => {
                  this.$message.error('请求失败：' + err)
                })
              } else {
                this.$message.error('排序只能输入数字类型')
              }
            } else {
              this.$message.error('请输入分类名称或排序')
            }
          },
          handleSizeChange (val) {
            this.pageSize = val
            this.init()
          },
          handleCurrentChange (val) {
            this.page = val
            this.init()
          }
        }
      })
    </script>
</body>
</html>
