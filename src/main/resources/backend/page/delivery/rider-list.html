<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑手管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />
  <link rel="stylesheet" href="../../styles/tokens.css?v=20260926" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260926" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <div class="dashboard-container" id="rider-app">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <h1 class="sr-only" id="page-title">骑手管理</h1>

      <!-- 顶部统计 -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        :search-items="[]"
        :actions="tableActions"
        :show-refresh="true"
        @search="handleQuery"
        @reset="handleReset"
        @action="onTableAction"
        @refresh="fetchData(true)">
        <template slot="search-extra">
          <el-input
            v-model="keyword"
            placeholder="姓名 / 手机号"
            clearable
            size="small"
            class="el-select--narrow-xs"
            style="width:180px;"
            @keyup.enter.native="handleQuery"
            @clear="handleQuery"></el-input>
          <el-select v-model="statusFilter" placeholder="全部状态" clearable size="small"
            class="el-select--narrow-xs" style="width:120px;" @change="handleQuery">
            <el-option label="离线" :value="0"></el-option>
            <el-option label="在线" :value="1"></el-option>
            <el-option label="忙碌" :value="2"></el-option>
          </el-select>
        </template>
      </table-bar>

      <!-- 骑手列表 -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-index="true"
        index-label="#"
        :index-width="45"
        :show-actions="true"
        :actions-width="190"
        @page-change="onPageChange"
        @size-change="onSizeChange">
        <template #col-name="{ row }">
          <span style="font-weight:500;">{{ row.name }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag size="mini" :type="statusTagType(row.status)">{{ statusText(row.status) }}</el-tag>
        </template>
        <template #col-rating="{ row }">
          <span><i class="ri-star-fill" style="color:var(--el-color-warning);"></i> {{ formatRating(row.rating) }}</span>
        </template>
        <template #col-lastLocationTime="{ row }">
          <span>{{ formatTime(row.lastLocationTime) }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">编辑</el-button>
          <el-button type="text" size="small" @click="openResetDialog(row)">重置密码</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row)">删除</el-button>
        </template>
      </crud-table>
    </main>

    <!-- 新增 / 编辑骑手 -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      :title="dialog.title"
      :visible.sync="dialog.visible"
      :submit-loading="submitting"
      size="sm"
      @submit="submitForm">
      <el-form ref="form" :model="form" :rules="rules" label-width="90px" size="small">
        <el-form-item label="姓名：" prop="name">
          <el-input v-model="form.name" placeholder="请输入骑手姓名" maxlength="50" ></el-input>
        </el-form-item>
        <el-form-item label="手机号：" prop="phone">
          <el-input v-model="form.phone" placeholder="骑手登录账号（11 位手机号）" maxlength="11" ></el-input>
        </el-form-item>
        <el-form-item label="初始密码：" v-if="dialog.mode==='add'" prop="password">
          <el-input v-model="form.password" placeholder="6-20 位骑手端登录密码" show-password ></el-input>
        </el-form-item>
        <el-alert v-if="dialog.mode==='edit'" type="info" :closable="false" size="mini"
          title="骑手工作状态、在途单量与位置由骑手端实时上报，此处仅维护账号资料；如需改密码请使用「重置密码」。"
          style="margin-top:4px;"></el-alert>
      </el-form>
    </crud-dialog>

    <!-- 重置密码 -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      title="重置骑手密码"
      :visible.sync="pwdDialog.visible"
      :submit-loading="pwdSubmitting"
      size="sm"
      @submit="submitResetPassword">
      <el-form label-width="90px" size="small">
        <el-form-item label="骑手：">
          <span style="font-weight:600;">{{ pwdDialog.name }}（{{ pwdDialog.phone }}）</span>
        </el-form-item>
        <el-form-item label="新密码：">
          <el-input v-model="pwdDialog.password" placeholder="6-20 位新密码" show-password></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260930"></script>
  <script src="../../js/accessibility-utils.js?v=20260927"></script>
  <script src="../../js/performance-utils.js?v=20260926"></script>
  <script src="../../api/delivery.js?v=20260927"></script>
  <script src="../../js/components.js?v=20261002"></script>
  <script>
    new Vue({
      el: '#rider-app',
      mixins: [window.ReggieListMixin],
      data() {
        return {
          loading: false,
          submitting: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 搜索条件
          keyword: '',
          statusFilter: null,
          // 状态计数（全量骑手，用于顶部统计）
          statusCounts: { 0: 0, 1: 0, 2: 0 },
          tableActions: [
            { key: 'add', text: '+ 新增骑手', type: 'primary' }
          ],
          columns: [
            { prop: 'name', label: '姓名', width: 120 },
            { prop: 'phone', label: '手机号', width: 140 },
            { prop: 'status', label: '状态', width: 90 },
            { prop: 'currentOrderCount', label: '在途单', width: 90 },
            { prop: 'totalOrderCount', label: '累计单', width: 90 },
            { prop: 'rating', label: '评分', width: 100 },
            { prop: 'lastLocationTime', label: '最近定位时间', minWidth: 170 }
          ],
          // 新增/编辑弹窗
          dialog: { visible: false, title: '', mode: 'add' },
          form: { id: null, name: '', phone: '', password: '' },
          // 重置密码弹窗
          pwdDialog: { visible: false, id: null, name: '', phone: '', password: '' },
          pwdSubmitting: false
        }
      },
      computed: {
        statsCards() {
          return [
            { key: 'total', icon: 'ri-motorbike-line', label: '骑手总数', value: this.counts || 0, color: 'primary' },
            { key: 'online', icon: 'ri-checkbox-circle-line', label: '在线', value: this.statusCounts[1] || 0, color: 'success' },
            { key: 'busy', icon: 'ri-run-line', label: '配送中', value: this.statusCounts[2] || 0, color: 'warning' },
            { key: 'offline', icon: 'ri-moon-line', label: '离线', value: this.statusCounts[0] || 0, color: 'info' }
          ]
        },
        rules() {
          return {
            name: [{ required: true, whitespace: true, message: '请输入骑手姓名', trigger: 'blur' }],
            phone: [
              { required: true, message: '请输入手机号', trigger: 'blur' },
              { pattern: /^1\d{10}$/, message: '请输入正确的 11 位手机号', trigger: 'blur' }
            ],
            password: [
              { required: true, message: '请输入初始密码', trigger: 'blur' },
              { min: 6, max: 20, message: '密码长度需为 6-20 位', trigger: 'blur' }
            ]
          }
        }
      },
      created() {
        this.fetchData(true)
      },
      methods: {
        /* ========== 数据加载 ========== */
        async fetchData(reloadStats) {
          this.loading = true
          try {
            // 纯数字关键词按手机号模糊搜索，否则按姓名搜索（后端两条件为 AND，不可同时传）
            const kw = (this.keyword || '').trim()
            const isPhoneKw = kw !== '' && /^\d+$/.test(kw)
            const params = {
              page: this.page,
              pageSize: this.pageSize,
              name: isPhoneKw ? undefined : (kw || undefined),
              phone: isPhoneKw ? kw : undefined,
              status: this.statusFilter === '' || this.statusFilter === null ? undefined : this.statusFilter
            }
            const res = await riderPage(params)
            if (String(res.code) === '1' && res.data) {
              this.tableData = res.data.records || []
              this.counts = res.data.total || 0
            } else {
              ReggieUI.error(res.msg || '骑手列表加载失败')
            }
            // 关键词含纯数字时同时作为手机号模糊条件
            if (reloadStats) { this.loadStatusCounts() }
          } catch (err) {
            if (err && err.message === 'NOTLOGIN') return
            ReggieUI.error('骑手列表加载失败')
          } finally {
            this.loading = false
          }
        },
        // 全量骑手状态计数（骑手账号规模有限，用不分页接口统计在线/忙碌/离线）
        async loadStatusCounts() {
          try {
            const res = await getRiderListApi()
            if (String(res.code) === '1' && Array.isArray(res.data)) {
              const counts = { 0: 0, 1: 0, 2: 0 }
              res.data.forEach(function(r) { counts[r.status] = (counts[r.status] || 0) + 1 })
              this.statusCounts = counts
            }
          } catch (e) { /* 统计失败不阻塞列表 */ }
        },
        /* ========== 搜索 ========== */
        handleQuery() {
          this.page = 1
          this.fetchData(false)
        },
        handleReset() {
          this.keyword = ''
          this.statusFilter = null
          this.page = 1
          this.fetchData(false)
        },
        onTableAction(payload) {
          if (payload.key === 'add') { this.addHandle() }
        },
        /* ========== 新增 / 编辑 ========== */
        addHandle() {
          this.dialog = { visible: true, title: '新增骑手', mode: 'add' }
          this.form = { id: null, name: '', phone: '', password: '' }
          this.$nextTick(() => { if (this.$refs.form) this.$refs.form.clearValidate() })
        },
        editHandle(row) {
          this.dialog = { visible: true, title: '编辑骑手', mode: 'edit' }
          this.form = { id: row.id, name: row.name, phone: row.phone, password: '' }
          this.$nextTick(() => { if (this.$refs.form) this.$refs.form.clearValidate() })
        },
        submitForm() {
          if (this.submitting) return
          this.$refs.form.validate(async (valid) => {
            if (!valid) return
            this.submitting = true
            try {
              const isAdd = this.dialog.mode === 'add'
              // 纯数字关键词按手机号搜索，否则按姓名（后端两条件为 AND，不能同时传）
              const payload = isAdd
                ? { name: this.form.name.trim(), phone: this.form.phone.trim(), password: this.form.password }
                : { id: this.form.id, name: this.form.name.trim(), phone: this.form.phone.trim() }
              const res = isAdd ? await addRider(payload) : await updateRider(payload)
              if (String(res.code) === '1') {
                ReggieUI.success(isAdd ? '骑手创建成功，可使用手机号登录骑手端' : '骑手资料已更新')
                this.dialog.visible = false
                this.fetchData(true)
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            } catch (err) {
              if (err && err.message === 'NOTLOGIN') return
              ReggieUI.error('操作失败')
            } finally {
              this.submitting = false
            }
          })
        },
        /* ========== 重置密码 ========== */
        openResetDialog(row) {
          this.pwdDialog = { visible: true, id: row.id, name: row.name, phone: row.phone, password: '' }
        },
        async submitResetPassword() {
          if (this.pwdSubmitting) return
          const pwd = this.pwdDialog.password || ''
          if (pwd.length < 6 || pwd.length > 20) {
            ReggieUI.warning('新密码长度需为 6-20 位')
            return
          }
          this.pwdSubmitting = true
          try {
            const res = await resetRiderPassword(this.pwdDialog.id, pwd)
            if (String(res.code) === '1') {
              ReggieUI.success('密码已重置')
              this.pwdDialog.visible = false
            } else {
              ReggieUI.error(res.msg || '重置失败')
            }
          } catch (err) {
            if (err && err.message === 'NOTLOGIN') return
            ReggieUI.error('重置失败')
          } finally {
            this.pwdSubmitting = false
          }
        },
        /* ========== 删除 ========== */
        async deleteHandle(row) {
          try {
            await ReggieUI.confirm('确认删除骑手「' + row.name + '」？删除后该手机号将无法登录骑手端。', '删除确认', {
              confirmButtonText: '确认删除', cancelButtonText: '取消', type: 'warning'
            })
          } catch (e) { return }
          try {
            const res = await deleteRiderApi(row.id)
            if (String(res.code) === '1') {
              ReggieUI.success('删除成功')
              this.fetchData(true)
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          } catch (err) {
            if (err && err.message === 'NOTLOGIN') return
            ReggieUI.error('删除失败')
          }
        },
        /* ========== 展示工具 ========== */
        statusText(status) {
          return { 0: '离线', 1: '在线', 2: '配送中' }[status] || '未知'
        },
        statusTagType(status) {
          return { 0: 'info', 1: 'success', 2: 'warning' }[status] || 'info'
        },
        formatRating(rating) {
          return rating == null ? '5.0' : Number(rating).toFixed(1)
        },
        formatTime(t) {
          if (!t) return '-'
          return String(t).replace('T', ' ').substring(0, 19)
        }
      }
    })
  </script>
</body>
</html>
