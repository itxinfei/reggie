<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖平台订单</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <style>
    .tableBar .filter-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 1;
    }
    .tableBar .action-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .tableBar .el-select,
    .tableBar .el-date-editor {
      margin-right: 0 !important;
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="delivery-app">
    <div class="container">
      <div class="tableBar">
        <div class="filter-group">
          <el-select v-model="searchPlatform" placeholder="平台" clearable style="width:120px">
            <el-option label="美团" value="MEITUAN"></el-option>
            <el-option label="饿了么" value="ELEME"></el-option>
            <el-option label="抖音" value="DOUYIN"></el-option>
          </el-select>
          <el-select v-model="searchStatus" placeholder="状态" clearable style="width:120px">
            <el-option label="待处理" value="PENDING"></el-option>
            <el-option label="已接单" value="ACCEPTED"></el-option>
            <el-option label="已完成" value="COMPLETED"></el-option>
            <el-option label="已取消" value="CANCELLED"></el-option>
          </el-select>
          <el-date-picker
            v-model="searchDateRange"
            type="daterange"
            range-separator="至"
            start-placeholder="开始日期"
            end-placeholder="结束日期"
            value-format="yyyy-MM-dd"
            style="width:240px"
          ></el-date-picker>
          <el-button type="primary" @click="handleQuery">查询</el-button>
          <el-button @click="reset">重置</el-button>
        </div>
        <div class="action-group">
          <el-button type="primary" @click="syncMenu">同步菜品</el-button>
          <el-button type="primary" @click="syncStock">同步库存</el-button>
        </div>
      </div>
      <el-table :data="tableData" stripe border class="tableBox">
        <el-table-column prop="platformOrderId" label="平台订单号"></el-table-column>
        <el-table-column label="平台">
          <template slot-scope="scope">
            <el-tag v-if="scope.row.platform === 'MEITUAN'">美团</el-tag>
            <el-tag v-else-if="scope.row.platform === 'ELEME'" type="success">饿了么</el-tag>
            <el-tag v-else-if="scope.row.platform === 'DOUYIN'" type="warning">抖音</el-tag>
            <span v-else>{{ scope.row.platform }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="dishSummary" label="菜品摘要"></el-table-column>
        <el-table-column label="金额">
          <template slot-scope="scope">￥{{ scope.row.amount }}</template>
        </el-table-column>
        <el-table-column prop="userName" label="用户"></el-table-column>
        <el-table-column prop="address" label="地址"></el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <el-tag v-if="scope.row.status === 'PENDING'" type="warning">待处理</el-tag>
            <el-tag v-else-if="scope.row.status === 'ACCEPTED'" type="success">已接单</el-tag>
            <el-tag v-else-if="scope.row.status === 'COMPLETED'" type="info">已完成</el-tag>
            <el-tag v-else-if="scope.row.status === 'CANCELLED'" type="danger">已取消</el-tag>
            <span v-else>{{ scope.row.status }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="orderTime" label="下单时间"></el-table-column>
        <el-table-column label="操作" width="120" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="acceptOrder(scope.row)" v-if="scope.row.status === 'PENDING'">手动接单</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        :current-page.sync="page"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/delivery.js"></script>
  <script>
    new Vue({
      el: '#delivery-app',
      data() {
        return {
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          searchPlatform: '',
          searchStatus: '',
          searchDateRange: []
        }
      },
      mounted() {
        this.search()
      },
      methods: {
        async search() {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            platform: this.searchPlatform || undefined,
            status: this.searchStatus || undefined
          }
          if (this.searchDateRange && this.searchDateRange.length === 2) {
            params.startDate = this.searchDateRange[0]
            params.endDate = this.searchDateRange[1]
          }
          await deliveryOrderPage(params).then(res => {
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求出错了：' + err)
          })
        },
        handleQuery() {
          this.page = 1
          this.search()
        },
        reset() {
          this.searchPlatform = ''
          this.searchStatus = ''
          this.searchDateRange = []
          this.page = 1
          this.search()
        },
        async syncMenu() {
          await deliverySyncMenu().then(res => {
            if (String(res.code) === '1') {
              this.$message.success('同步菜品成功')
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求出错了：' + err)
          })
        },
        async syncStock() {
          await deliverySyncStock().then(res => {
            if (String(res.code) === '1') {
              this.$message.success('同步库存成功')
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求出错了：' + err)
          })
        },
        async acceptOrder(row) {
          this.$confirm('确认手动接单?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            deliveryAccept({ orderId: row.id }).then(res => {
              if (String(res.code) === '1') {
                this.$message.success('接单成功')
                this.search()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          })
        },
        handleSizeChange(val) {
          this.pageSize = val
          this.search()
        },
        handleCurrentChange(val) {
          this.page = val
          this.search()
        }
      }
    })
  </script>
</body>
</html>
