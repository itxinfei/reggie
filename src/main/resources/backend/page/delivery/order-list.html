<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖平台订单 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
</head>
<body>
  <div class="dashboard-container" id="delivery-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏（同步按钮通过 actions 属性传入） -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-actions="true"
        :actions-width="120"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-platform="{ row }">
          <el-tag v-if="row.platform === 'MEITUAN'">美团</el-tag>
          <el-tag v-else-if="row.platform === 'ELEME'" type="success">饿了么</el-tag>
          <el-tag v-else-if="row.platform === 'DOUYIN'" type="warning">抖音</el-tag>
          <span v-else>{{ row.platform }}</span>
        </template>
        <template #col-amount="{ row }">
          <span>￥{{ row.amount }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag v-if="row.status === 'PENDING'" type="warning">待处理</el-tag>
          <el-tag v-else-if="row.status === 'ACCEPTED'" type="success">已接单</el-tag>
          <el-tag v-else-if="row.status === 'COMPLETED'" type="info">已完成</el-tag>
          <el-tag v-else-if="row.status === 'CANCELLED'" type="danger">已取消</el-tag>
          <span v-else>{{ row.status }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="acceptOrder(row)" v-if="row.status === 'PENDING'">手动接单</el-button>
        </template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/delivery.js"></script>
  <script>
    new Vue({
      el: '#delivery-app',
      data: function() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { todayOrders: 0, completedOrders: 0, pendingOrders: 0, cancelledOrders: 0 },
          activeFilter: '',
          // 搜索配置
          searchConfig: [
            { type: 'select', field: 'platform', placeholder: '平台', width: '120px',
              options: [
                { label: '美团', value: 'MEITUAN' }, { label: '饿了么', value: 'ELEME' }, { label: '抖音', value: 'DOUYIN' }
              ] },
            { type: 'select', field: 'status', placeholder: '状态', width: '120px',
              options: [
                { label: '待处理', value: 'PENDING' }, { label: '已接单', value: 'ACCEPTED' },
                { label: '已完成', value: 'COMPLETED' }, { label: '已取消', value: 'CANCELLED' }
              ] },
            { type: 'date', field: 'dateRange', placeholder: '选择日期', width: '300px',
              beginField: 'startDate', endField: 'endDate' }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'syncMenu', text: '同步菜品', type: 'primary' },
            { key: 'syncStock', text: '同步库存', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'platformOrderId', label: '平台订单号' },
            { prop: 'platform', label: '平台', slot: true, width: 90 },
            { prop: 'dishSummary', label: '菜品摘要' },
            { prop: 'amount', label: '金额', slot: true, width: 100 },
            { prop: 'userName', label: '用户' },
            { prop: 'address', label: '地址' },
            { prop: 'status', label: '状态', slot: true, width: 90 },
            { prop: 'orderTime', label: '下单时间' }
          ],
          // 缓存搜索参数
          lastSearch: {}
        }
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: 'today', icon: '🛵', label: '今日订单', value: self.stats.todayOrders, color: 'primary' },
            { key: 'COMPLETED', icon: '✅', label: '已完成', value: self.stats.completedOrders, color: 'success', clickable: true, active: self.activeFilter === 'COMPLETED' },
            { key: 'PENDING', icon: '⏳', label: '待处理', value: self.stats.pendingOrders, color: 'warning', clickable: true, active: self.activeFilter === 'PENDING' },
            { key: 'CANCELLED', icon: '❌', label: '已取消', value: self.stats.cancelledOrders, color: 'danger', clickable: true, active: self.activeFilter === 'CANCELLED' }
          ]
        }
      },
      mounted: function() { this.search() },
      methods: {
        async search() {
          this.loading = true
          var self = this
          var params = {
            page: self.page, pageSize: self.pageSize,
            platform: self.lastSearch.platform || undefined,
            status: self.lastSearch.status || undefined,
            startDate: self.lastSearch.startDate || undefined,
            endDate: self.lastSearch.endDate || undefined
          }
          var results = await Promise.all([deliveryOrderPage(params), self.loadDeliveryStats(params)])
          var orderRes = results[0]
          var statsRes = results[1]
          if (String(orderRes.code) === '1') { self.tableData = orderRes.data.records || []; self.counts = orderRes.data.total }
          if (statsRes && String(statsRes.code) === '1') { self.stats = statsRes.data || self.stats }
          self.loading = false
        },
        async loadDeliveryStats(params) {
          try {
            var today = new Date()
            var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0')
            var statsParams = { page: 1, pageSize: 1000 }
            if (params.platform) statsParams.platform = params.platform
            if (params.startDate) statsParams.startDate = params.startDate
            if (params.endDate) statsParams.endDate = params.endDate
            var results = await Promise.all([
              deliveryOrderPage({ page: 1, pageSize: 1, beginTime: todayStr + ' 00:00:00', endTime: todayStr + ' 23:59:59' }),
              deliveryOrderPage(statsParams)
            ])
            var todayRes = results[0]
            var allRes = results[1]
            if (String(allRes.code) === '1') {
              var records = allRes.data.records || []
              return { code: 1, data: {
                todayOrders: (String(todayRes.code) === '1') ? (todayRes.data.total || 0) : 0,
                completedOrders: records.filter(function(r) { return r.status === 'COMPLETED' }).length,
                pendingOrders: records.filter(function(r) { return r.status === 'PENDING' }).length,
                cancelledOrders: records.filter(function(r) { return r.status === 'CANCELLED' }).length
              }}
            }
          } catch (err) { console.warn('加载外卖订单统计数据失败:', err) }
          return { code: 0 }
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          var self = this
          if (payload.key === 'COMPLETED' || payload.key === 'PENDING' || payload.key === 'CANCELLED') {
            if (self.activeFilter === payload.key) { self.activeFilter = ''; self.lastSearch = {} }
            else { self.activeFilter = payload.key; self.lastSearch = { status: payload.key } }
          }
          self.page = 1; self.search()
        },
        // table-bar 回调
        onSearch: function(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1; this.search()
        },
        onReset: function() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1; this.search()
        },
        onAction: function(payload) {
          if (payload.key === 'syncMenu') this.syncMenu()
          else if (payload.key === 'syncStock') this.syncStock()
        },
        onPageChange: function(payload) { this.page = payload.page; this.search() },
        onSizeChange: function(payload) { this.pageSize = payload.pageSize; this.search() },
        async syncMenu() {
          await deliverySyncMenu().then(function(res) {
            if (String(res.code) === '1') this.$message.success('同步菜品成功')
            else this.$message.error(res.msg || '操作失败')
          }.bind(this)).catch(function(err) { this.$message.error('请求失败：' + err) }.bind(this))
        },
        async syncStock() {
          await deliverySyncStock().then(function(res) {
            if (String(res.code) === '1') this.$message.success('同步库存成功')
            else this.$message.error(res.msg || '操作失败')
          }.bind(this)).catch(function(err) { this.$message.error('请求失败：' + err) }.bind(this))
        },
        acceptOrder: function(row) {
          var self = this
          this.$confirm('确认手动接单?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              deliveryAccept({ orderId: row.id }).then(function(res) {
                if (String(res.code) === '1') { self.$message.success('接单成功'); self.search() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(function(err) { self.$message.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
