<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配送范围管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      background: var(--el-bg-subtle);
    }
    .container {
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .tableBar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .tableBar .toolbar-spacer {
      flex: 1;
    }
    .table-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .range-type-tag {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size:var(--font-size-xs);
    }
    .range-type-tag.circle {
      background: var(--el-color-primary-lighter);
      color: var(--el-color-primary);
    }
    .range-type-tag.polygon {
      background: var(--el-color-success-lighter);
      color: var(--el-color-success);
    }
    .fee-type-tag {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size:var(--font-size-xs);
    }
    .fee-type-tag.fixed {
      background: var(--el-color-warning-lighter);
      color: var(--el-color-warning);
    }
    .fee-type-tag.step {
      background: var(--el-color-info-lighter);
      color: var(--el-color-info);
    }
    .fee-type-tag.dynamic {
      background: var(--el-color-danger-lighter);
      color: var(--el-color-danger);
    }
    .status-tag {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size:var(--font-size-xs);
    }
    .status-tag.active {
      background: var(--el-color-success-lighter);
      color: var(--el-color-success);
    }
    .status-tag.disabled {
      background: var(--el-color-danger-lighter);
      color: var(--el-color-danger);
    }
    .fee-info {
      font-size:var(--font-size-xs);
      color: var(--el-text-secondary);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#app" class="skip-link">跳转到主内容</a>
 <div id="app" class="container" role="main" aria-label="页面主要内容">
    <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title" id="page-title">配送范围管理</h1>
        <p class="ds-page-header__subtitle">管理配送区域与计费规则</p>
      </div>
      <div class="ds-page-header__actions"></div>
    </header>
    <!-- 搜索 + 操作栏 -->
    <table-bar
      :search-items="searchItems"
      :actions="actionItems"
      @search="onSearch"
      @reset="onReset"
      @action="onAction"
    ></table-bar>

    <!-- 数据表格 -->
    <crud-table
      :data="pagedData"
      :columns="columns"
      :loading="loading"
      :page="page"
      :page-size="pageSize"
      :total="allData.length"
      :show-actions="true"
      :actions-width="250"
      :actions-fixed="true"
      @page-change="onPageChange"
      @size-change="onSizeChange"
      aria-label="配送范围规则列表"
    >
      <!-- 范围类型列 -->
      <template #col-rangeType="{ row }">
        <el-tag :type="row.rangeType === 1 ? 'primary' : 'success'" size="small">
          {{ row.rangeType === 1 ? '圆形' : '多边形' }}
        </el-tag>
      </template>
      <!-- 范围参数列 -->
      <template #col-rangeParams="{ row }">
        <div v-if="row.rangeType === 1">
          <div>半径：{{ row.radius }}米</div>
          <div style="font-size: var(--font-size-xs); color: var(--text-muted);">中心：{{ row.centerLatitude }}, {{ row.centerLongitude }}</div>
        </div>
        <div v-else>
          <div>多边形范围</div>
          <div style="font-size: var(--font-size-xs); color: var(--text-muted);">坐标点数量：{{ getPolygonPointCount(row.polygonPoints) }}</div>
        </div>
      </template>
      <!-- 配送费类型列 -->
      <template #col-feeType="{ row }">
        <el-tag :type="getFeeTypeTag(row.feeType)" size="small">
          {{ getFeeTypeText(row.feeType) }}
        </el-tag>
      </template>
      <!-- 配送费信息列 -->
      <template #col-feeInfo="{ row }">
        <div v-if="row.feeType === 1">
          固定：¥{{ formatMoney(row.baseFee) }}
        </div>
        <div v-else-if="row.feeType === 2">
          阶梯计费
        </div>
        <div v-else>
          基础：¥{{ formatMoney(row.baseFee) }} + {{ row.feePerKm }}元/公里
        </div>
        <div v-if="row.freeThreshold" style="font-size: var(--font-size-xs); color: var(--text-muted);">
          满¥{{ formatMoney(row.freeThreshold) }}免配送费
        </div>
      </template>
      <!-- 状态列 -->
      <template #col-status="{ row }">
        <el-tag :type="row.status === 1 ? 'success' : 'danger'" size="small">
          {{ row.status === 1 ? '启用' : '禁用' }}
        </el-tag>
      </template>
      <!-- 操作按钮 -->
      <template #actions="{ row }">
        <el-button type="text" size="small" @click="handleEdit(row)">编辑</el-button>
        <el-button type="text" size="small" @click="handleFeeStep(row)">阶梯规则</el-button>
        <el-button type="text" size="small" @click="handleToggleStatus(row)">
          {{ row.status === 1 ? '禁用' : '启用' }}
        </el-button>
        <el-button type="text" size="small" class="btn-delete" @click="handleDelete(row)">删除</el-button>
      </template>
    </crud-table>

    <!-- 新增/编辑对话框 -->
    <crud-dialog :title="dialogTitle" :visible.sync="dialogVisible" size="lg" @submit="handleSubmit">
      <el-form :model="formData" :rules="formRules" ref="ruleForm" label-width="120px">
        <el-form-item label="规则名称" prop="ruleName">
          <el-input v-model="formData.ruleName" placeholder="请输入规则名称"></el-input>
        </el-form-item>
        <el-form-item label="范围类型" prop="rangeType">
          <el-radio-group v-model="formData.rangeType">
            <el-radio :label="1">圆形范围</el-radio>
            <el-radio :label="2">多边形范围</el-radio>
          </el-radio-group>
        </el-form-item>
        
        <!-- 圆形范围参数 -->
        <template v-if="formData.rangeType === 1">
          <el-form-item label="中心经度" prop="centerLongitude">
            <el-input-number v-model="formData.centerLongitude" :precision="8" :step="0.0001" style="width: 100%;"></el-input-number>
          </el-form-item>
          <el-form-item label="中心纬度" prop="centerLatitude">
            <el-input-number v-model="formData.centerLatitude" :precision="8" :step="0.0001" style="width: 100%;"></el-input-number>
          </el-form-item>
          <el-form-item label="半径（米）" prop="radius">
            <el-input-number v-model="formData.radius" :min="100" :max="50000" style="width: 100%;"></el-input-number>
          </el-form-item>
        </template>
        
        <!-- 多边形范围参数 -->
        <template v-if="formData.rangeType === 2">
          <el-form-item label="多边形坐标" prop="polygonPoints">
            <el-input v-model="formData.polygonPoints" type="textarea" :rows="4" 
              placeholder="请输入坐标点JSON，格式：[[lon1,lat1],[lon2,lat2],...]"></el-input>
            <div class="form-tip">
              至少需要3个坐标点，首尾点会自动闭合
            </div>
          </el-form-item>
        </template>

        <el-divider content-position="left">配送费设置</el-divider>
        
        <el-form-item label="配送费类型" prop="feeType">
          <el-radio-group v-model="formData.feeType">
            <el-radio :label="1">固定配送费</el-radio>
            <el-radio :label="2">距离阶梯</el-radio>
            <el-radio :label="3">基础费+距离费</el-radio>
          </el-radio-group>
        </el-form-item>
        
        <el-form-item v-if="formData.feeType === 1 || formData.feeType === 3" label="基础配送费">
          <el-input-number v-model="formData.baseFee" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        
        <el-form-item v-if="formData.feeType === 3" label="每公里费用">
          <el-input-number v-model="formData.feePerKm" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        
        <el-form-item label="最低配送费">
          <el-input-number v-model="formData.minFee" :precision="2" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">0表示不限制</div>
        </el-form-item>
        
        <el-form-item label="最高配送费">
          <el-input-number v-model="formData.maxFee" :precision="2" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">0表示不限制</div>
        </el-form-item>
        
        <el-form-item label="免费配送门槛">
          <el-input-number v-model="formData.freeThreshold" :precision="2" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">订单金额达到此值免配送费，0表示不启用</div>
        </el-form-item>

        <el-form-item label="排序">
          <el-input-number v-model="formData.sortOrder" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="状态">
          <el-switch v-model="formData.status" :active-value="1" :inactive-value="0"></el-switch>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="formData.remark" type="textarea" :rows="2" placeholder="请输入备注"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 阶梯规则对话框 -->
    <crud-dialog title="配送费阶梯规则" :visible.sync="feeStepVisible" size="xl" :show-submit="false">
      <div style="margin-bottom: 16px;">
        <el-button type="primary" size="small" icon="el-icon-plus" @click="handleAddFeeStep">新增阶梯</el-button>
      </div>
      <el-table aria-label="数据表格" :data="feeSteps" border stripe style="width: 100%">
        <el-table-column prop="startDistance" label="起始距离(米)" width="120" align="center"></el-table-column>
        <el-table-column prop="endDistance" label="结束距离(米)" width="120" align="center"></el-table-column>
        <el-table-column prop="fee" label="配送费(元)" width="100" align="right"></el-table-column>
        <el-table-column prop="incrementDistance" label="递增距离(米)" width="120" align="center"></el-table-column>
        <el-table-column prop="incrementFee" label="递增费用(元)" width="120" align="right"></el-table-column>
        <el-table-column label="操作" width="150" align="center" fixed="right">
          <template slot-scope="scope">
            <el-button type="text" size="small" @click="handleEditFeeStep(scope.row)">编辑</el-button>
            <el-button type="text" size="small" style="color: var(--el-color-danger);" @click="handleDeleteFeeStep(scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </crud-dialog>

    <!-- 阶梯规则编辑对话框 -->
    <crud-dialog :title="feeStepDialogTitle" :visible.sync="feeStepEditVisible" size="md" @submit="handleFeeStepSubmit">
      <el-form :model="feeStepForm" :rules="feeStepRules" ref="feeStepFormRef" label-width="100px">
        <el-form-item label="起始距离" prop="startDistance">
          <el-input-number v-model="feeStepForm.startDistance" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="结束距离" prop="endDistance">
          <el-input-number v-model="feeStepForm.endDistance" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="配送费" prop="fee">
          <el-input-number v-model="feeStepForm.fee" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="递增距离" prop="incrementDistance">
          <el-input-number v-model="feeStepForm.incrementDistance" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="递增费用" prop="incrementFee">
          <el-input-number v-model="feeStepForm.incrementFee" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../api/delivery-enhanced.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          loading: false,
          allData: [],
          page: 1,
          pageSize: 10,
          // 搜索配置
          searchItems: [
            { key: 'ruleName', label: '规则名称', type: 'input', placeholder: '请输入规则名称' },
            { key: 'rangeType', label: '范围类型', type: 'select', placeholder: '全部类型', options: [
              { label: '圆形', value: 1 },
              { label: '多边形', value: 2 }
            ]},
            { key: 'status', label: '状态', type: 'select', placeholder: '全部状态', options: [
              { label: '启用', value: 1 },
              { label: '禁用', value: 0 }
            ]}
          ],
          // 操作按钮配置
          actionItems: [
            { key: 'add', label: '新增配送范围规则', type: 'primary', icon: 'el-icon-plus' }
          ],
          // 表格列配置
          columns: [
            { prop: 'id', label: 'ID', width: 80, align: 'center' },
            { prop: 'ruleName', label: '规则名称', minWidth: 150, align: 'center' },
            { prop: 'rangeType', label: '范围类型', width: 120, align: 'center', slot: true },
            { prop: 'rangeParams', label: '范围参数', minWidth: 200, align: 'center', slot: true },
            { prop: 'feeType', label: '配送费类型', width: 120, align: 'center', slot: true },
            { prop: 'feeInfo', label: '配送费信息', minWidth: 200, align: 'center', slot: true },
            { prop: 'status', label: '状态', width: 100, align: 'center', slot: true }
          ],
          // 搜索参数
          searchParams: {},
          dialogVisible: false,
          dialogTitle: '新增配送范围规则',
          submitLoading: false,
          formData: {
            id: null,
            ruleName: '',
            rangeType: 1,
            centerLongitude: null,
            centerLatitude: null,
            radius: 3000,
            polygonPoints: '',
            feeType: 1,
            baseFee: 5,
            feePerKm: 1,
            minFee: 3,
            maxFee: 20,
            freeThreshold: 30,
            sortOrder: 0,
            status: 1,
            remark: ''
          },
          formRules: {
            ruleName: [{ required: true, message: '请输入规则名称', trigger: 'blur' }],
            rangeType: [{ required: true, message: '请选择范围类型', trigger: 'change' }],
            feeType: [{ required: true, message: '请选择配送费类型', trigger: 'change' }]
          },
          feeStepVisible: false,
          feeStepEditVisible: false,
          feeStepDialogTitle: '新增阶梯规则',
          currentRuleId: null,
          feeSteps: [],
          feeStepForm: {
            id: null,
            ruleId: null,
            startDistance: 0,
            endDistance: 1000,
            fee: 3,
            incrementDistance: 500,
            incrementFee: 1
          },
          feeStepRules: {
            startDistance: [{ required: true, message: '请输入起始距离', trigger: 'blur' }],
            endDistance: [{ required: true, message: '请输入结束距离', trigger: 'blur' }],
            fee: [{ required: true, message: '请输入配送费', trigger: 'blur' }],
            incrementDistance: [{ required: true, message: '请输入递增距离', trigger: 'blur' }],
            incrementFee: [{ required: true, message: '请输入递增费用', trigger: 'blur' }]
          }
        }
      },
      computed: {
        pagedData() {
          var start = (this.page - 1) * this.pageSize
          return this.filteredData.slice(start, start + this.pageSize)
        },
        filteredData() {
          var data = this.allData
          var params = this.searchParams
          if (params.ruleName) {
            data = data.filter(function(item) { return item.ruleName && item.ruleName.indexOf(params.ruleName) > -1 })
          }
          if (params.rangeType !== undefined && params.rangeType !== '') {
            data = data.filter(function(item) { return item.rangeType === params.rangeType })
          }
          if (params.status !== undefined && params.status !== '') {
            data = data.filter(function(item) { return item.status === params.status })
          }
          return data
        }
      },
      created() {
        this.fetchData()
      },
      methods: {
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        getPolygonPointCount(points) {
          if (!points) return 0
          try {
            const arr = JSON.parse(points)
            return Array.isArray(arr) ? arr.length : 0
          } catch (e) {
            return 0
          }
        },
        getFeeTypeClass(type) {
          const map = { 1: 'fixed', 2: 'step', 3: 'dynamic' }
          return map[type] || 'fixed'
        },
        getFeeTypeTag(type) {
          const map = { 1: 'warning', 2: 'info', 3: 'danger' }
          return map[type] || 'info'
        },
        getFeeTypeText(type) {
          const map = { 1: '固定', 2: '阶梯', 3: '动态' }
          return map[type] || '未知'
        },
        onPageChange(payload) {
          this.page = payload.page
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
        },
        onSearch(params) {
          this.searchParams = params
          this.page = 1
        },
        onReset() {
          this.searchParams = {}
          this.page = 1
        },
        onAction(payload) {
          if (payload.key === 'add') {
            this.handleAdd()
          }
        },
        async fetchData() {
          this.loading = true
          try {
            const res = await getRangeRules()
            if (res.code === 1) {
              this.allData = res.data || []
            }
          } catch (err) {
            ReggieUI.error('获取数据失败')
          } finally {
            this.loading = false
          }
        },
        handleAdd() {
          this.dialogTitle = '新增配送范围规则'
          this.formData = {
            id: null,
            ruleName: '',
            rangeType: 1,
            centerLongitude: null,
            centerLatitude: null,
            radius: 3000,
            polygonPoints: '',
            feeType: 1,
            baseFee: 5,
            feePerKm: 1,
            minFee: 3,
            maxFee: 20,
            freeThreshold: 30,
            sortOrder: 0,
            status: 1,
            remark: ''
          }
          this.dialogVisible = true
          this.$nextTick(() => {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          })
        },
        handleEdit(row) {
          this.dialogTitle = '编辑配送范围规则'
          this.formData = { ...row }
          this.dialogVisible = true
          this.$nextTick(() => {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          })
        },
        async handleToggleStatus(row) {
          try {
            const newStatus = row.status === 1 ? 0 : 1
            const res = await updateRangeRule({ ...row, status: newStatus })
            if (res.code === 1) {
              ReggieUI.success(newStatus === 1 ? '已启用' : '已禁用')
              this.fetchData()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } catch (err) {
            ReggieUI.error('操作失败')
          }
        },
        async handleDelete(row) {
          try {
            await ReggieUI.confirm('确定要删除该配送范围规则吗？', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            })
            
            const res = await deleteRangeRule(row.id)
            if (res.code === 1) {
              ReggieUI.success('删除成功')
              this.fetchData()
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          } catch (err) {
            if (err !== 'cancel') {
              ReggieUI.error('删除失败')
            }
          }
        },
        handleSubmit() {
          var self = this
          let passed = false
          this.$refs.ruleForm.validate(function(valid) { passed = valid })
          if (!passed) return

          self.submitLoading = true
          var apiCall = self.formData.id ? updateRangeRule(self.formData) : saveRangeRule(self.formData)
          apiCall.then(function(res) {
            if (res.code === 1) {
              ReggieUI.success(self.formData.id ? '更新成功' : '新增成功')
              self.dialogVisible = false
              self.fetchData()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            ReggieUI.error('操作失败')
          }).finally(function() {
            self.submitLoading = false
          })
        },
        async handleFeeStep(row) {
          this.currentRuleId = row.id
          this.feeStepVisible = true
          await this.fetchFeeSteps()
        },
        async fetchFeeSteps() {
          try {
            const res = await getFeeSteps({ ruleId: this.currentRuleId })
            if (res.code === 1) {
              this.feeSteps = res.data || []
            }
          } catch (err) {
            ReggieUI.error('获取阶梯规则失败')
          }
        },
        handleAddFeeStep() {
          this.feeStepDialogTitle = '新增阶梯规则'
          this.feeStepForm = {
            id: null,
            ruleId: this.currentRuleId,
            startDistance: 0,
            endDistance: 1000,
            fee: 3,
            incrementDistance: 500,
            incrementFee: 1
          }
          this.feeStepEditVisible = true
          this.$nextTick(() => {
            this.$refs.feeStepFormRef && this.$refs.feeStepFormRef.clearValidate()
          })
        },
        handleEditFeeStep(row) {
          this.feeStepDialogTitle = '编辑阶梯规则'
          this.feeStepForm = { ...row }
          this.feeStepEditVisible = true
          this.$nextTick(() => {
            this.$refs.feeStepFormRef && this.$refs.feeStepFormRef.clearValidate()
          })
        },
        async handleDeleteFeeStep(row) {
          try {
            await ReggieUI.confirm('确定要删除该阶梯规则吗？', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            })
            
            const res = await deleteFeeStep(row.id)
            if (res.code === 1) {
              ReggieUI.success('删除成功')
              await this.fetchFeeSteps()
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          } catch (err) {
            if (err !== 'cancel') {
              ReggieUI.error('删除失败')
            }
          }
        },
        async handleFeeStepSubmit() {
          let passed = false
          this.$refs.feeStepFormRef.validate(function(valid) { passed = valid })
          if (!passed) return

          var self = this
          var apiCall = self.feeStepForm.id ? updateFeeStep(self.feeStepForm) : saveFeeStep(self.feeStepForm)
          apiCall.then(function(res) {
            if (res.code === 1) {
              ReggieUI.success(self.feeStepForm.id ? '更新成功' : '新增成功')
              self.feeStepEditVisible = false
              self.fetchFeeSteps()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            ReggieUI.error('操作失败')
          })
        }
      }
    })
  </script>
</body>
</html>
