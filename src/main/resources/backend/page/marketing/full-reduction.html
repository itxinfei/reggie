<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>满减活动管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      background: var(--el-bg-subtle);
    }
    .container {
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .tableBar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-surface);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }
    .tableBar .toolbar-label {
      font-size:var(--font-size-base);
      color: var(--el-text-regular);
      font-weight: 500;
    }
    .tableBar .toolbar-spacer {
      flex: 1;
    }
    .table-card {
      background: var(--bg-surface);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }
    .rule-type-tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size:var(--font-size-xs);
    }
    .rule-type-tag.reduce {
      background: var(--el-color-primary-lighter);
      color: var(--el-color-primary);
    }
    .rule-type-tag.discount {
      background: var(--el-color-success-lighter);
      color: var(--el-color-success);
    }
    .rule-type-tag.gift {
      background: var(--el-color-warning-lighter);
      color: var(--el-color-warning);
    }
    .status-tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size:var(--font-size-xs);
    }
    .status-tag.active {
      background: var(--el-color-success-lighter);
      color: var(--el-color-success);
    }
    .status-tag.disabled {
      background: var(--el-color-danger-lighter);
      color: var(--el-color-danger);
    }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#app" class="skip-link">跳转到主内容</a>
 <div id="app" class="container" role="main" aria-label="页面主要内容">
    <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title" id="page-title">满减活动</h1>
        <p class="ds-page-header__subtitle">管理满减优惠活动</p>
      </div>
      <div class="ds-page-header__actions"></div>
    </header>
    <!-- 工具栏 -->
    <div class="tableBar">
      <span class="toolbar-label">活动ID：</span>
      <el-input v-model="searchCampaignId" placeholder="请输入活动ID" clearable style="width: 150px;"></el-input>
      <el-button type="primary" icon="el-icon-search" aria-label="搜索" @click="fetchData">查询</el-button>
      <el-button icon="el-icon-refresh" aria-label="重置" @click="resetSearch">重置</el-button>
      <div class="toolbar-spacer"></div>
      <el-button type="primary" icon="el-icon-plus" aria-label="新增" @click="handleAdd">新增满减规则</el-button>
    </div>

    <!-- 表格 -->
    <div class="table-card">
      <el-table aria-label="数据表格"
        :data="tableData"
        border
        stripe
        style="width: 100%"
        v-loading="loading">
        <el-table-column prop="id" label="ID" width="80" align="center"></el-table-column>
        <el-table-column prop="campaignId" label="活动ID" width="100" align="center"></el-table-column>
        <el-table-column prop="ruleName" label="规则名称" min-width="150" align="center"></el-table-column>
        <el-table-column prop="discountType" label="优惠类型" width="120" align="center">
          <template slot-scope="scope">
            <span class="rule-type-tag" :class="getDiscountTypeClass(scope.row.discountType)">
              {{ getDiscountTypeText(scope.row.discountType) }}
            </span>
          </template>
        </el-table-column>
        <el-table-column prop="minAmount" label="满减门槛" width="120" align="right">
          <template slot-scope="scope">
            满¥{{ formatMoney(scope.row.minAmount) }}
          </template>
        </el-table-column>
        <el-table-column prop="discountValue" label="优惠值" width="120" align="right">
          <template slot-scope="scope">
            <span v-if="scope.row.discountType === 1">减¥{{ formatMoney(scope.row.discountValue) }}</span>
            <span v-else-if="scope.row.discountType === 2">{{ (scope.row.discountValue * 10).toFixed(1) }}折</span>
            <span v-else>赠品</span>
          </template>
        </el-table-column>
        <el-table-column prop="maxDiscountAmount" label="最大优惠" width="120" align="right">
          <template slot-scope="scope">
            {{ scope.row.maxDiscountAmount ? '¥' + formatMoney(scope.row.maxDiscountAmount) : '不限' }}
          </template>
        </el-table-column>
        <el-table-column prop="perUserLimit" label="每人限用" width="100" align="center">
          <template slot-scope="scope">
            {{ scope.row.perUserLimit || '不限' }}
          </template>
        </el-table-column>
        <el-table-column prop="status" label="状态" width="100" align="center">
          <template slot-scope="scope">
            <span class="status-tag" :class="scope.row.status === 1 ? 'active' : 'disabled'">
              {{ scope.row.status === 1 ? '启用' : '禁用' }}
            </span>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="180" align="center" fixed="right">
          <template slot-scope="scope">
            <el-button type="text" size="small" @click="handleEdit(scope.row)">编辑</el-button>
            <el-button type="text" size="small" @click="handleToggleStatus(scope.row)">
              {{ scope.row.status === 1 ? '禁用' : '启用' }}
            </el-button>
            <el-button type="text" size="small" style="color: var(--el-color-danger);" @click="handleDelete(scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>

    <!-- 新增/编辑对话框 -->
    <crud-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="600px" @submit="handleSubmit">
      <el-form :model="formData" :rules="formRules" ref="ruleForm" label-width="120px">
        <el-form-item label="活动ID" prop="campaignId">
          <el-input-number v-model="formData.campaignId" :min="1" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="规则名称" prop="ruleName">
          <el-input v-model="formData.ruleName" placeholder="请输入规则名称"></el-input>
        </el-form-item>
        <el-form-item label="优惠类型" prop="discountType">
          <el-radio-group v-model="formData.discountType">
            <el-radio :label="1">减固定金额</el-radio>
            <el-radio :label="2">打折</el-radio>
            <el-radio :label="3">赠品</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="满减门槛" prop="minAmount">
          <el-input-number v-model="formData.minAmount" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item :label="formData.discountType === 2 ? '折扣率' : '优惠金额'" prop="discountValue">
          <el-input-number 
            v-model="formData.discountValue" 
            :precision="formData.discountType === 2 ? 4 : 2" 
            :min="0" 
            :max="formData.discountType === 2 ? 1 : 99999"
            style="width: 100%;">
          </el-input-number>
          <div v-if="formData.discountType === 2" class="form-tip">
            请输入折扣率，如8折请输入0.8
          </div>
        </el-form-item>
        <el-form-item v-if="formData.discountType === 2" label="最大优惠金额">
          <el-input-number v-model="formData.maxDiscountAmount" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="每人限用次数">
          <el-input-number v-model="formData.perUserLimit" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">0表示不限制</div>
        </el-form-item>
        <el-form-item label="排序">
          <el-input-number v-model="formData.sortOrder" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="状态">
          <el-switch v-model="formData.status" :active-value="1" :inactive-value="0"></el-switch>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../api/marketing.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          loading: false,
          searchCampaignId: '',
          tableData: [],
          dialogVisible: false,
          dialogTitle: '新增满减规则',
          submitLoading: false,
          formData: {
            id: null,
            campaignId: null,
            ruleName: '',
            discountType: 1,
            minAmount: 0,
            discountValue: 0,
            maxDiscountAmount: null,
            perUserLimit: 0,
            sortOrder: 0,
            status: 1
          },
          formRules: {
            campaignId: [{ required: true, message: '请输入活动ID', trigger: 'blur' }],
            ruleName: [{ required: true, message: '请输入规则名称', trigger: 'blur' }],
            discountType: [{ required: true, message: '请选择优惠类型', trigger: 'change' }],
            minAmount: [{ required: true, message: '请输入满减门槛', trigger: 'blur' }],
            discountValue: [{ required: true, message: '请输入优惠值', trigger: 'blur' }]
          }
        }
      },
      created() {
        this.fetchData()
      },
      methods: {
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        getDiscountTypeClass(type) {
          const map = { 1: 'reduce', 2: 'discount', 3: 'gift' }
          return map[type] || 'reduce'
        },
        getDiscountTypeText(type) {
          const map = { 1: '减固定金额', 2: '打折', 3: '赠品' }
          return map[type] || '未知'
        },
        async fetchData() {
          this.loading = true
          try {
            const params = {}
            if (this.searchCampaignId) {
              params.campaignId = this.searchCampaignId
            }
            const res = await getFullReductionRules(params)
            if (res.code === 1) {
              this.tableData = res.data || []
            }
          } catch (err) {
            console.error('获取满减规则列表失败', err)
            ReggieUI.error('获取数据失败')
          } finally {
            this.loading = false
          }
        },
        resetSearch() {
          this.searchCampaignId = ''
          this.fetchData()
        },
        handleAdd() {
          this.dialogTitle = '新增满减规则'
          this.formData = {
            id: null,
            campaignId: null,
            ruleName: '',
            discountType: 1,
            minAmount: 0,
            discountValue: 0,
            maxDiscountAmount: null,
            perUserLimit: 0,
            sortOrder: 0,
            status: 1
          }
          this.dialogVisible = true
          this.$nextTick(() => {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          })
        },
        handleEdit(row) {
          this.dialogTitle = '编辑满减规则'
          this.formData = { ...row }
          this.dialogVisible = true
          this.$nextTick(() => {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          })
        },
        async handleToggleStatus(row) {
          try {
            const newStatus = row.status === 1 ? 0 : 1
            const res = await updateFullReductionRule({ ...row, status: newStatus })
            if (res.code === 1) {
              ReggieUI.success(newStatus === 1 ? '已启用' : '已禁用')
              this.fetchData()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } catch (err) {
            console.error('操作失败', err)
            ReggieUI.error('操作失败')
          }
        },
        async handleDelete(row) {
          try {
            await this.$confirm('确定要删除该满减规则吗？', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            })
            
            const res = await deleteFullReductionRule(row.id)
            if (res.code === 1) {
              ReggieUI.success('删除成功')
              this.fetchData()
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          } catch (err) {
            if (err !== 'cancel') {
              console.error('删除失败', err)
              ReggieUI.error('删除失败')
            }
          }
        },
        handleSubmit() {
          this.$refs.ruleForm.validate(async (valid) => {
            if (!valid) return
            
            this.submitLoading = true
            try {
              let res
              if (this.formData.id) {
                res = await updateFullReductionRule(this.formData)
              } else {
                res = await saveFullReductionRule(this.formData)
              }
              
              if (res.code === 1) {
                ReggieUI.success(this.formData.id ? '更新成功' : '新增成功')
                this.dialogVisible = false
                this.fetchData()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            } catch (err) {
              console.error('提交失败', err)
              ReggieUI.error('操作失败')
            } finally {
              this.submitLoading = false
            }
          })
        }
      }
    })
  </script>
</body>
</html>
