<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>满减活动管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    body { overflow-x: visible; }
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <div class="dashboard-container" id="app">
    <main class="container ds-page" id="main-content" role="main">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">满减活动</h1>
          <p class="ds-page-header__subtitle">管理满减优惠活动</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>

      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :selection="false"
        :show-actions="true"
        :actions-width="180"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        aria-label="满减活动列表"
      >
        <!-- 优惠类型列 -->
        <template #col-discountType="{ row }">
          <el-tag :type="getDiscountTypeTagType(row.discountType)" size="small">
            {{ getDiscountTypeText(row.discountType) }}
          </el-tag>
        </template>
        <!-- 满减门槛列 -->
        <template #col-minAmount="{ row }">
          <span>满¥{{ formatMoney(row.minAmount) }}</span>
        </template>
        <!-- 优惠值列 -->
        <template #col-discountValue="{ row }">
          <span v-if="row.discountType === 1">减¥{{ formatMoney(row.discountValue) }}</span>
          <span v-else-if="row.discountType === 2">{{ (row.discountValue * 10).toFixed(1) }}折</span>
          <span v-else>赠品</span>
        </template>
        <!-- 最大优惠列 -->
        <template #col-maxDiscountAmount="{ row }">
          <span>{{ row.maxDiscountAmount ? '¥' + formatMoney(row.maxDiscountAmount) : '不限' }}</span>
        </template>
        <!-- 每人限用列 -->
        <template #col-perUserLimit="{ row }">
          <span>{{ row.perUserLimit || '不限' }}</span>
        </template>
        <!-- 状态列 -->
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'danger'" size="small">
            {{ row.status === 1 ? '启用' : '禁用' }}
          </el-tag>
        </template>
        <!-- 操作按钮 -->
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="handleEdit(row)">编辑</el-button>
          <el-button type="text" size="small" @click="handleToggleStatus(row)">
            {{ row.status === 1 ? '禁用' : '启用' }}
          </el-button>
          <el-button type="text" size="small" class="btn-delete" @click="handleDelete(row)">删除</el-button>
        </template>
      </crud-table>
    </main>

    <!-- 新增/编辑对话框 -->
    <crud-dialog
      :size="'md'"
      :title="dialogTitle"
      :visible.sync="dialogVisible"
      :close-on-click-modal="false"
      :submit-loading="submitLoading"
      @submit="handleSubmit"
    >
      <el-form :model="formData" :rules="formRules" ref="ruleForm" label-width="120px" size="small">
        <el-form-item label="活动ID" prop="campaignId">
          <el-input-number v-model="formData.campaignId" :min="1" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="规则名称" prop="ruleName">
          <el-input v-model="formData.ruleName" placeholder="请输入规则名称"></el-input>
        </el-form-item>
        <el-form-item label="优惠类型" prop="discountType">
          <el-radio-group v-model="formData.discountType">
            <el-radio :label="1">减固定金额</el-radio>
            <el-radio :label="2">打折</el-radio>
            <el-radio :label="3">赠品</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="满减门槛" prop="minAmount">
          <el-input-number v-model="formData.minAmount" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item :label="formData.discountType === 2 ? '折扣率' : '优惠金额'" prop="discountValue">
          <el-input-number
            v-model="formData.discountValue"
            :precision="formData.discountType === 2 ? 4 : 2"
            :min="0"
            :max="formData.discountType === 2 ? 1 : 99999"
            style="width: 100%;">
          </el-input-number>
          <div v-if="formData.discountType === 2" class="form-tip">
            请输入折扣率，如8折请输入0.8
          </div>
        </el-form-item>
        <el-form-item v-if="formData.discountType === 2" label="最大优惠金额">
          <el-input-number v-model="formData.maxDiscountAmount" :precision="2" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="每人限用次数">
          <el-input-number v-model="formData.perUserLimit" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">0表示不限制</div>
        </el-form-item>
        <el-form-item label="排序">
          <el-input-number v-model="formData.sortOrder" :min="0" style="width: 100%;"></el-input-number>
        </el-form-item>
        <el-form-item label="状态">
          <el-switch v-model="formData.status" :active-value="1" :inactive-value="0"></el-switch>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../api/marketing.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: function() {
        return {
          counts: 0,
          page: 1,
          pageSize: 10,
          loading: false,
          activeFilter: '',
          tableData: [],
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'campaignId', placeholder: '请输入活动ID', width: '150px' }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'add', text: '+ 新增满减规则', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'id', label: 'ID', width: 80, align: 'center' },
            { prop: 'campaignId', label: '活动ID', width: 100, align: 'center' },
            { prop: 'ruleName', label: '规则名称', width: 150, showOverflowTooltip: true },
            { prop: 'discountType', label: '优惠类型', slot: true, width: 120, align: 'center' },
            { prop: 'minAmount', label: '满减门槛', slot: true, width: 120, type: 'money' },
            { prop: 'discountValue', label: '优惠值', slot: true, width: 120, type: 'money' },
            { prop: 'maxDiscountAmount', label: '最大优惠', slot: true, width: 120, type: 'money' },
            { prop: 'perUserLimit', label: '每人限用', slot: true, width: 100, align: 'center' },
            { prop: 'status', label: '状态', slot: true, width: 100, align: 'center' }
          ],
          // 统计
          stats: { total: 0, active: 0, inactive: 0 },
          // 缓存搜索参数
          lastSearch: {},
          dialogVisible: false,
          dialogTitle: '新增满减规则',
          submitLoading: false,
          formData: {
            id: null,
            campaignId: null,
            ruleName: '',
            discountType: 1,
            minAmount: 0,
            discountValue: 0,
            maxDiscountAmount: null,
            perUserLimit: 0,
            sortOrder: 0,
            status: 1
          },
          formRules: {
            campaignId: [{ required: true, message: '请输入活动ID', trigger: 'blur' }],
            ruleName: [{ required: true, message: '请输入规则名称', trigger: 'blur' }],
            discountType: [{ required: true, message: '请选择优惠类型', trigger: 'change' }],
            minAmount: [{ required: true, message: '请输入满减门槛', trigger: 'blur' }],
            discountValue: [{ required: true, message: '请输入优惠值', trigger: 'blur' }]
          }
        }
      },
      computed: {
        statsCards: function() {
          const self = this
          return [
            { key: '', icon: 'ri-coupon-3-line', label: '全部规则', value: self.stats.total, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: '1', icon: 'ri-checkbox-circle-line', label: '已启用', value: self.stats.active, color: 'success', clickable: true, active: self.activeFilter === '1' },
            { key: '0', icon: 'ri-pause-circle-line', label: '已禁用', value: self.stats.inactive, color: 'warning', clickable: true, active: self.activeFilter === '0' }
          ]
        }
      },
      created: function() {
        this.init()
        this.loadStats()
      },
      methods: {
        formatMoney(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        getDiscountTypeTagType(type) {
          var map = { 1: '', 2: 'success', 3: 'warning' }
          return map[type] || ''
        },
        getDiscountTypeText(type) {
          var map = { 1: '减固定金额', 2: '打折', 3: '赠品' }
          return map[type] || '未知'
        },
        async init() {
          this.loading = true
          const self = this
          var params = { page: this.page, pageSize: this.pageSize }
          if (self.lastSearch.campaignId) {
            params.campaignId = self.lastSearch.campaignId
          }
          if (self.activeFilter && self.activeFilter !== '') {
            params.status = self.activeFilter
          }
          try {
            var res = await getFullReductionRules(params)
            if (String(res.code) === '1') {
              self.tableData = res.data || []
              self.counts = res.total || (res.data ? res.data.length : 0)
            }
          } catch (err) {
            ReggieUI.error('获取满减规则列表失败:')
          }
          self.loading = false
        },
        async loadStats() {
          try {
            var results = await Promise.all([
              getFullReductionRules({ page: 1, pageSize: 1, status: '1' }),
              getFullReductionRules({ page: 1, pageSize: 1, status: '0' })
            ])
            var activeCount = (String(results[0].code) === '1') ? (results[0].total || results[0].data.length || 0) : 0
            var inactiveCount = (String(results[1].code) === '1') ? (results[1].total || results[1].data.length || 0) : 0
            this.stats = {
              total: activeCount + inactiveCount,
              active: activeCount,
              inactive: inactiveCount
            }
          } catch (err) {
            console.warn('加载满减统计数据失败:', err)
          }
        },
        // stat-cards 点击
        onCardClick: function(payload) {
          const self = this
          self.activeFilter = payload.activeKey
          self.lastSearch = {}
          self.page = 1
          self.init()
        },
        // table-bar 回调
        onSearch: function(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init()
        },
        onReset: function() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init()
        },
        onAction: function(payload) {
          switch (payload.key) {
            case 'add': this.handleAdd(); break
          }
        },
        onPageChange: function(payload) {
          this.page = payload.page
          this.init()
        },
        onSizeChange: function(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.init()
        },
        handleAdd() {
          this.dialogTitle = '新增满减规则'
          this.formData = {
            id: null,
            campaignId: null,
            ruleName: '',
            discountType: 1,
            minAmount: 0,
            discountValue: 0,
            maxDiscountAmount: null,
            perUserLimit: 0,
            sortOrder: 0,
            status: 1
          }
          this.dialogVisible = true
          this.$nextTick(() => {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          })
        },
        handleEdit(row) {
          this.dialogTitle = '编辑满减规则'
          this.formData = Object.assign({}, row)
          this.dialogVisible = true
          this.$nextTick(() => {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          })
        },
        async handleToggleStatus(row) {
          try {
            var newStatus = row.status === 1 ? 0 : 1
            var res = await updateFullReductionRule(Object.assign({}, row, { status: newStatus }))
            if (res.code === 1) {
              ReggieUI.success(newStatus === 1 ? '已启用' : '已禁用')
              this.init()
              this.loadStats()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } catch (err) {
            ReggieUI.error('操作失败')
          }
        },
        async handleDelete(row) {
          try {
            await ReggieUI.confirm('确定要删除该满减规则吗？', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            })
            var res = await deleteFullReductionRule(row.id)
            if (res.code === 1) {
              ReggieUI.success('删除成功')
              this.init()
              this.loadStats()
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          } catch (err) {
            if (err !== 'cancel') {
              ReggieUI.error('删除失败')
            }
          }
        },
        handleSubmit() {
          const self = this
          let passed = false
          this.$refs.ruleForm.validate(function(valid) { passed = valid })
          if (!passed) return
          self.submitLoading = true
          var apiCall = self.formData.id ? updateFullReductionRule(self.formData) : saveFullReductionRule(self.formData)
          apiCall.then(function(res) {
            if (res.code === 1) {
              ReggieUI.success(self.formData.id ? '更新成功' : '新增成功')
              self.dialogVisible = false
              self.init()
              self.loadStats()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            ReggieUI.error('操作失败')
          }).finally(function() {
            self.submitLoading = false
          })
        }
      }
    })
  </script>
</body>
</html>
