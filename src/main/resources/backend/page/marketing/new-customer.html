<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新客优惠管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css?v=20260915c" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260915c" />
  <!-- ==================== 新客优惠管理 ==================== -->
  <!-- 功能说明：管理新客专享优惠活动，支持固定金额/按比例两种优惠类型，含起送金额/有效天数/启用禁用 -->
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <div class="dashboard-container" id="app">
    <main class="container ds-page" id="main-content" role="main" aria-labelledby="page-title">
      <h1 class="sr-only" id="page-title">新人优惠</h1>
      <!-- 统计卡片：全部/已启用/已禁用，点击可筛选 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索栏：按优惠名称搜索 + 新增新客优惠按钮 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        :show-refresh="true"
        @search="onSearch"
        @reset="onReset"
        @refresh="init()"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格：ID/优惠名称/优惠类型/优惠值/最大优惠/起送金额/有效天数/状态 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :selection="false"
        :show-actions="true" :viewable="true"
        :actions-width="180"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
        aria-label="新客优惠列表"
      >
        <template #col-discountType="{ row }">
          <el-tag :type="row.discountType === 2 ? 'success' : 'info'" size="small">
            {{ row.discountType === 1 ? '固定金额' : '按比例' }}
          </el-tag>
        </template>
        <template #col-discountValue="{ row }">
          <span v-if="row.discountType === 1">¥{{ formatMoney(row.discountValue) }}</span>
          <span v-else>{{ Number(row.discountValue).toFixed(1) }}%</span>
        </template>
        <template #col-maxDiscountAmount="{ row }">
          <span>{{ row.maxDiscountAmount ? '¥' + formatMoney(row.maxDiscountAmount) : '不限' }}</span>
        </template>
        <template #col-minOrderAmount="{ row }">
          <span>{{ row.minOrderAmount ? '满¥' + formatMoney(row.minOrderAmount) : '不限' }}</span>
        </template>
        <template #col-validDays="{ row }">
          <span>{{ row.validDays || '不限' }}</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="row.status === 1 ? 'success' : 'danger'" size="small">
            {{ row.status === 1 ? '启用' : '禁用' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="handleEdit(row)">编辑</el-button>
          <el-button type="text" size="small" :class="row.status === 1 ? 'btn-warning' : 'btn-success'" @click="handleToggleStatus(row)">
            {{ row.status === 1 ? '禁用' : '启用' }}
          </el-button>
          <el-button type="text" size="small" class="btn-delete" @click="handleDelete(row)">删除</el-button>
        </template>
      </crud-table>
    </main>

    <!-- 新增/编辑弹窗：优惠名称/类型/优惠值/最大优惠/起送金额/有效天数/备注/状态 -->
    <crud-dialog :show-submit="true" :show-cancel="true"
      :size="'md'"
      :title="dialogTitle"
      :visible.sync="dialogVisible"
      :close-on-click-modal="false"
      :submit-loading="submitLoading"
      @submit="handleSubmit"
    >
      <el-form :model="formData" :rules="formRules" ref="ruleForm" label-width="100px" size="small">
        <el-form-item label="优惠名称" prop="name">
          <el-input v-model="formData.name" placeholder="请输入优惠名称"></el-input>
        </el-form-item>
        <el-form-item label="优惠类型" prop="discountType">
          <el-radio-group v-model="formData.discountType">
            <el-radio :label="1">固定金额</el-radio>
            <el-radio :label="2">按比例</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item :label="formData.discountType === 1 ? '优惠金额(元)' : '优惠比例(%)'" prop="discountValue">
          <el-input-number
            v-model="formData.discountValue"
            :precision="2"
            :min="formData.discountType === 1 ? 0.01 : 1"
            :max="formData.discountType === 2 ? 99 : 99999"
            style="width: 100%;">
          </el-input-number>
        </el-form-item>
        <el-form-item v-if="formData.discountType === 2" label="最大优惠金额">
          <el-input-number v-model="formData.maxDiscountAmount" :precision="2" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">按比例时必填，防止大额订单优惠过高</div>
        </el-form-item>
        <el-form-item label="起送金额">
          <el-input-number v-model="formData.minOrderAmount" :precision="2" :min="0" style="width: 100%;"></el-input-number>
          <div class="form-tip">留空表示不限制</div>
        </el-form-item>
        <el-form-item label="有效天数" prop="validDays">
          <el-input-number v-model="formData.validDays" :min="1" :max="365" style="width: 100%;"></el-input-number>
          <div class="form-tip">用户注册后 N 天内有效</div>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="formData.remark" type="textarea" :rows="2" placeholder="请输入备注"></el-input>
        </el-form-item>
        <el-form-item label="状态">
          <el-switch v-model="formData.status" :active-value="1" :inactive-value="0"></el-switch>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260915c"></script>
  <script src="../../js/accessibility-utils.js?v=20260915c"></script>
  <script src="../../js/performance-utils.js?v=20260915c"></script>
  <script src="../../js/components.js?v=20260924"></script>
  <script src="../../js/common.js?v=20260915c"></script>
  <script src="../../api/marketing.js?v=20260915c"></script>
  <script>
    new Vue({
      el: '#app',
      data: function() {
        return {
          counts: 0,
          page: 1,
          pageSize: 10,
          loading: false,
          activeFilter: '',
          tableData: [],
          searchConfig: [
            { type: 'input', field: 'name', placeholder: '请输入优惠名称', width: '200px' }
          ],
          actionConfig: [
            { key: 'add', text: '+ 新增新客优惠', type: 'primary' }
          ],
          columns: [
            { prop: 'id', label: 'ID', width: 60, align: 'center' },
            { prop: 'name', label: '优惠名称', minWidth: 180 },
            { prop: 'discountType', label: '优惠类型', slot: true, width: 90, align: 'center' },
            { prop: 'discountValue', label: '优惠值', slot: true, width: 100, align: 'center', type: 'money' },
            { prop: 'maxDiscountAmount', label: '最大优惠', slot: true, width: 100, type: 'money' },
            { prop: 'minOrderAmount', label: '起送金额', slot: true, width: 100, type: 'money' },
            { prop: 'validDays', label: '有效天数', slot: true, width: 80, align: 'center' },
            { prop: 'status', label: '状态', slot: true, width: 80, align: 'center' }
          ],
          stats: { total: 0, active: 0, inactive: 0 },
          allData: [],
          filteredData: [],
          lastSearch: {},
          dialogVisible: false,
          dialogTitle: '新增新客优惠',
          submitLoading: false,
          formData: {
            id: null,
            name: '',
            discountType: 1,
            discountValue: 0,
            maxDiscountAmount: null,
            minOrderAmount: null,
            validDays: 7,
            status: 1,
            remark: ''
          },
          formRules: {
            name: [{ required: true, message: '请输入优惠名称', trigger: 'blur' }],
            discountType: [{ required: true, message: '请选择优惠类型', trigger: 'change' }],
            discountValue: [{ required: true, message: '请输入优惠值', trigger: 'blur' }],
            validDays: [{ required: true, message: '请输入有效天数', trigger: 'blur' }]
          }
        }
      },
      computed: {
        statsCards: function() {
          const self = this
          return [
            { key: '', icon: 'ri-user-add-line', label: '全部优惠', value: self.stats.total, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: '1', icon: 'ri-checkbox-circle-line', label: '已启用', value: self.stats.active, color: 'success', clickable: true, active: self.activeFilter === '1' },
            { key: '0', icon: 'ri-pause-circle-line', label: '已禁用', value: self.stats.inactive, color: 'warning', clickable: true, active: self.activeFilter === '0' }
          ]
        }
      },
      created: function() {
        this.init()
      },
      methods: {
        // ========== 辅助方法 ==========
        formatMoney: function(value) {
          if (!value && value !== 0) return '0.00'
          return Number(value).toFixed(2)
        },
        // ========== 数据加载 ==========
        async init() {
          this.loading = true
          const self = this
          const params = {}
          if (self.lastSearch.name) {
            params.name = self.lastSearch.name
          }
          try {
            const res = await getNewCustomerDiscounts(params)
            if (String(res.code) === '1' && res.data) {
              var d = res.data;
              // 后端返回裸数组，前端负责过滤和分页
              var all = Array.isArray(d) ? d : (d.records || []);
              self.allData = all;
              // 前端名称过滤 + 状态过滤（后端 list 返回全量、不支持 name 参数）
              var filtered = all;
              if (self.lastSearch.name) {
                var kw = String(self.lastSearch.name).toLowerCase();
                filtered = filtered.filter(function(item) {
                  return item.name && String(item.name).toLowerCase().indexOf(kw) !== -1;
                });
              }
              if (self.activeFilter && self.activeFilter !== '') {
                var statusVal = parseInt(self.activeFilter);
                filtered = filtered.filter(function(item) { return item.status === statusVal; });
              }
              self.filteredData = filtered;
              self.counts = filtered.length;
              // 前端分页
              self.tableData = filtered.slice((self.page - 1) * self.pageSize, self.page * self.pageSize);
              self.loadStats();
            }
          } catch (err) {
            ReggieUI.error('获取新客优惠列表失败')
          }
          self.loading = false
        },
        async loadStats() {
          // 前端统计：从 allData 计算，无需额外 API 请求
          var all = this.allData || [];
          var activeCount = all.filter(function(item) { return item.status === 1; }).length;
          var inactiveCount = all.filter(function(item) { return item.status === 0; }).length;
          this.stats = {
            total: all.length,
            active: activeCount,
            inactive: inactiveCount
          }
        },
        // ========== 筛选/分页事件 ==========
        onCardClick: function(payload) {
          const self = this
          self.activeFilter = payload.activeKey
          self.lastSearch = {}
          self.page = 1
          self.init()
        },
        onSearch: function(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init()
        },
        onReset: function() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init()
        },
        onAction: function(payload) {
          switch (payload.key) {
            case 'add': this.handleAdd(); break
          }
        },
        onPageChange: function(payload) {
          this.page = payload.page
          this.init()
        },
        onSizeChange: function(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.init()
        },
        // ========== 新增/编辑 ==========
        handleAdd: function() {
          this.dialogTitle = '新增新客优惠'
          this.formData = {
            id: null,
            name: '',
            discountType: 1,
            discountValue: 0,
            maxDiscountAmount: null,
            minOrderAmount: null,
            validDays: 7,
            status: 1,
            remark: ''
          }
          this.dialogVisible = true
          this.$nextTick(function() {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          }.bind(this))
        },
        handleEdit: function(row) {
          this.dialogTitle = '编辑新客优惠'
          this.formData = Object.assign({}, row)
          this.dialogVisible = true
          this.$nextTick(function() {
            this.$refs.ruleForm && this.$refs.ruleForm.clearValidate()
          }.bind(this))
        },
        // ========== 状态切换/删除 ==========
        async handleToggleStatus(row) {
          try {
            const newStatus = row.status === 1 ? 0 : 1
            // 启停直接影响线上活动可见性，二次确认防误触
            await ReggieUI.confirm(
              '确认' + (newStatus === 1 ? '启用' : '禁用') + '该新客优惠？' + (newStatus === 0 ? '禁用后新客将无法领取该优惠。' : ''),
              '提示', { type: 'warning' }
            )
            var res = await updateNewCustomerDiscount(Object.assign({}, row, { status: newStatus }))
            if (res.code === 1) {
              ReggieUI.success(newStatus === 1 ? '已启用' : '已禁用')
              this.init()
              this.loadStats()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } catch (err) {
            // 用户在确认框点取消/关闭时静默，不提示错误
            if (err !== 'cancel' && err !== 'close') ReggieUI.error('操作失败')
          }
        },
        async handleDelete(row) {
          try {
            await ReggieUI.confirm('确定要删除该新客优惠吗？', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            })
            const res = await deleteNewCustomerDiscount(row.id)
            if (res.code === 1) {
              ReggieUI.success('删除成功')
              this.init()
              this.loadStats()
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          } catch (err) {
            if (err === 'cancel') return
            console.warn('[new-customer] 删除失败:', err)
            ReggieUI.error('删除失败')
          }
        },
        // 修改点：`async X: function(){}` 是非法语法（整页 JS 解析失败导致白屏），改为合法的 async 方法简写
        async handleSubmit() {
          const self = this
          if (self.submitLoading) return // 提交防重
          // 校验失败须中断提交；此前 this 指向错误 + catch 吞错导致校验从未生效、空表单照常提交
          const valid = await new Promise(function(resolve) {
            self.$refs.ruleForm.validate(function(v) { resolve(v) })
          })
          if (!valid) return
          if (self.formData.discountType === 2 && (!self.formData.maxDiscountAmount || self.formData.maxDiscountAmount <= 0)) {
            ReggieUI.error('按比例优惠必须填写最大优惠金额')
            return
          }
          self.submitLoading = true
          const apiCall = self.formData.id ? updateNewCustomerDiscount(self.formData) : saveNewCustomerDiscount(self.formData)
          apiCall.then(function(res) {
            if (res.code === 1) {
              ReggieUI.success(self.formData.id ? '更新成功' : '新增成功')
              self.dialogVisible = false
              self.init()
              self.loadStats()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            ReggieUI.error('操作失败')
          }).finally(function() {
            self.submitLoading = false
          })
        }
      }
    })
  </script>
</body>
</html>
