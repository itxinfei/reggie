<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="reservation-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">桌台预订</h1>
          <p class="ds-page-header__subtitle">管理桌台预订记录</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        @search="onSearch"
        @reset="onReset"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        empty-hint="试试调整筛选条件"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-index="true"
        :show-actions="true"
        :actions-width="200"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="row.status === 'PENDING' ? 'warning' : row.status === 'CONFIRMED' ? 'success' : row.status === 'ARRIVED' ? 'primary' : 'info'" size="small">
            {{ row.status === 'PENDING' ? '待确认' : row.status === 'CONFIRMED' ? '已确认' : row.status === 'ARRIVED' ? '已到店' : '已取消' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="confirmHandle(row.id)" v-if="row.status === 'PENDING'">确认</el-button>
          <el-button type="text" size="small" class="btn-view" @click="arriveHandle(row.id)" v-if="row.status === 'CONFIRMED'">到店</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row.id)" v-if="row.status !== 'ARRIVED' && row.status !== 'CANCELLED'">取消</el-button>
        </template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#reservation-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { totalReservations: 0, pendingCount: 0, confirmedCount: 0, arrivedCount: 0, cancelledCount: 0 },
          activeFilter: '',
          // 搜索配置（日期范围拆分为 beginTime/endTime）
          searchConfig: [
            { type: 'input', field: 'customerName', placeholder: '请输入客户姓名', width: '200px' },
            { type: 'input', field: 'phone', placeholder: '请输入手机号', width: '180px', hideSearchIcon: true },
            { type: 'select', field: 'status', placeholder: '请选择状态', width: '140px',
              options: [
                { label: '待确认', value: 'PENDING' },
                { label: '已确认', value: 'CONFIRMED' },
                { label: '已到店', value: 'ARRIVED' },
                { label: '已取消', value: 'CANCELLED' }
              ] },
            { type: 'date', field: 'reserveTime', placeholder: '选择预订时间', width: '360px',
              beginField: 'beginTime', endField: 'endTime' }
          ],
          // 表格列配置
          columns: [
            { prop: 'customerName', label: '客户姓名', width: 100, align: 'center' },
            { prop: 'phone', label: '手机号', width: 120, align: 'center' },
            { prop: 'tableName', label: '桌台', width: 80, align: 'center' },
            { prop: 'reservedTime', label: '预订时间', width: 160, align: 'center' },
            { prop: 'seatCount', label: '人数', width: 60, type: 'number' },
            { prop: 'status', label: '状态', slot: true, width: 70, align: 'center' },
            { prop: 'remark', label: '备注', minWidth: 100 }
          ],
          lastSearch: {}
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          const self = this
          return [
            { key: '', icon: 'ri-file-list-3-line', label: '预约总数', value: self.stats.totalReservations, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'PENDING', icon: 'ri-time-line', label: '待确认', value: self.stats.pendingCount, color: 'warning', clickable: true, active: self.activeFilter === 'PENDING' },
            { key: 'CONFIRMED', icon: 'ri-checkbox-circle-line', label: '已确认', value: self.stats.confirmedCount, color: 'success', clickable: true, active: self.activeFilter === 'CONFIRMED' },
            { key: 'ARRIVED', icon: 'ri-map-pin-line', label: '已到店', value: self.stats.arrivedCount, color: 'info', clickable: true, active: self.activeFilter === 'ARRIVED' }
          ]
        }
      },
      methods: {
        async init(reloadStats = true) {
          this.loading = true
          const ls = this.lastSearch || {};
          const params = Object.assign({}, ls, { page: this.page, pageSize: this.pageSize })
          // 修改点：F9 性能 — 全局统计与分页列表分离，仅数据突变后重载，翻页/搜索不重算
          const requests = [reservationPage(params)]
          if (reloadStats) { requests.push(this.loadReservationStats()) }
          const results = await Promise.all(requests)
          const resvRes = results[0]
          if (String(resvRes.code) === '1') {
            this.tableData = resvRes.data.records || []
            this.counts = resvRes.data.total
          } else {
            ReggieUI.error(resvRes.msg || '操作失败')
          }
          if (reloadStats) {
            const statsRes = results[1]
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
          this.loading = false
        },
        async loadReservationStats() {
          try {
            // 修改点：使用 pageSize=1 × 5 轻量查询替代 pageSize=1000 拉全量，直接取 total 避免数据截断
            const results = await Promise.all([
              reservationPage({ page: 1, pageSize: 1 }),
              reservationPage({ page: 1, pageSize: 1, status: 'PENDING' }),
              reservationPage({ page: 1, pageSize: 1, status: 'CONFIRMED' }),
              reservationPage({ page: 1, pageSize: 1, status: 'ARRIVED' }),
              reservationPage({ page: 1, pageSize: 1, status: 'CANCELLED' })
            ])
            return { code: 1, data: {
              totalReservations: (String(results[0].code) === '1') ? (results[0].data.total || 0) : 0,
              pendingCount: (String(results[1].code) === '1') ? (results[1].data.total || 0) : 0,
              confirmedCount: (String(results[2].code) === '1') ? (results[2].data.total || 0) : 0,
              arrivedCount: (String(results[3].code) === '1') ? (results[3].data.total || 0) : 0,
              cancelledCount: (String(results[4].code) === '1') ? (results[4].data.total || 0) : 0
            }}
          } catch (err) { console.warn('加载预约统计失败:', err) }
          return { code: 0 }
        },
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.lastSearch = this.activeFilter ? { status: this.activeFilter } : {}
          this.page = 1
          this.init(false)
        },
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init(false)
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.init(false)
        },
        confirmHandle(id) {
          const self = this
          ReggieUI.confirm('确认该预订?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              confirmReservation(id).then(res => {
                if (res.code === 1) { ReggieUI.success('已确认！'); self.init() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(err => { ReggieUI.error('请求失败：' + err) })
            })
        },
        arriveHandle(id) {
          const self = this
          ReggieUI.confirm('确认该客户已到店?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              arriveReservation(id).then(res => {
                if (res.code === 1) { ReggieUI.success('已到店！'); self.init() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(err => { ReggieUI.error('请求失败：' + err) })
            })
        },
        cancelHandle(id) {
          const self = this
          ReggieUI.confirm('确认取消该预订?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              cancelReservation(id).then(res => {
                if (res.code === 1) { ReggieUI.success('已取消！'); self.init() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(err => { ReggieUI.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
