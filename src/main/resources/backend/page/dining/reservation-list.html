<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
</head>
<body>
  <div class="dashboard-container" id="reservation-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        @search="onSearch"
        @reset="onReset"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-index="true"
        :show-actions="true"
        :actions-width="280"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="row.status === 'PENDING' ? 'warning' : row.status === 'CONFIRMED' ? 'success' : row.status === 'ARRIVED' ? 'primary' : 'info'" size="small">
            {{ row.status === 'PENDING' ? '待确认' : row.status === 'CONFIRMED' ? '已确认' : row.status === 'ARRIVED' ? '已到店' : '已取消' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="confirmHandle(row.id)" v-if="row.status === 'PENDING'">确认</el-button>
          <el-button type="text" size="small" class="btn-view" @click="arriveHandle(row.id)" v-if="row.status === 'CONFIRMED'">到店</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row.id)" v-if="row.status !== 'ARRIVED' && row.status !== 'CANCELLED'">取消</el-button>
        </template>
      </crud-table>
    </div>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#reservation-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { totalReservations: 0, pendingCount: 0, confirmedCount: 0, arrivedCount: 0, cancelledCount: 0 },
          activeFilter: '',
          // 搜索配置（日期范围拆分为 beginTime/endTime）
          searchConfig: [
            { type: 'input', field: 'customerName', placeholder: '请输入客户姓名', width: '200px' },
            { type: 'input', field: 'phone', placeholder: '请输入手机号', width: '180px', hideSearchIcon: true },
            { type: 'select', field: 'status', placeholder: '请选择状态', width: '140px',
              options: [
                { label: '待确认', value: 'PENDING' },
                { label: '已确认', value: 'CONFIRMED' },
                { label: '已到店', value: 'ARRIVED' },
                { label: '已取消', value: 'CANCELLED' }
              ] },
            { type: 'date', field: 'reserveTime', placeholder: '选择预订时间', width: '360px',
              beginField: 'beginTime', endField: 'endTime' }
          ],
          // 表格列配置
          columns: [
            { prop: 'customerName', label: '客户姓名' },
            { prop: 'phone', label: '手机号' },
            { prop: 'tableName', label: '桌台' },
            { prop: 'reservedTime', label: '预订时间', minWidth: '100' },
            { prop: 'seatCount', label: '就餐人数', width: 90 },
            { prop: 'status', label: '状态', slot: true, width: 90 },
            { prop: 'remark', label: '备注', showOverflowTooltip: true }
          ],
          lastSearch: {}
        }
      },
      created() {
        this.init()
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '📋', label: '预约总数', value: self.stats.totalReservations, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'PENDING', icon: '⏳', label: '待确认', value: self.stats.pendingCount, color: 'warning', clickable: true, active: self.activeFilter === 'PENDING' },
            { key: 'CONFIRMED', icon: '✅', label: '已确认', value: self.stats.confirmedCount, color: 'success', clickable: true, active: self.activeFilter === 'CONFIRMED' },
            { key: 'ARRIVED', icon: '📍', label: '已到店', value: self.stats.arrivedCount, color: 'info', clickable: true, active: self.activeFilter === 'ARRIVED' }
          ]
        }
      },
      methods: {
        async init() {
          this.loading = true
          var ls = this.lastSearch || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            customerName: ls.customerName || undefined,
            phone: ls.phone || undefined,
            status: ls.status || undefined,
            beginTime: ls.beginTime || undefined,
            endTime: ls.endTime || undefined
          }
          var results = await Promise.all([reservationPage(params), this.loadReservationStats()])
          var resvRes = results[0]
          var statsRes = results[1]
          if (String(resvRes.code) === '1') {
            this.tableData = resvRes.data.records || []
            this.counts = resvRes.data.total
          } else {
            this.$message.error(resvRes.msg || '操作失败')
          }
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
          this.loading = false
        },
        async loadReservationStats() {
          try {
            var res = await reservationPage({ page: 1, pageSize: 1000 })
            if (String(res.code) === '1') {
              var records = res.data.records || []
              return { code: 1, data: {
                totalReservations: res.data.total || 0,
                pendingCount: records.filter(function(r) { return r.status === 'PENDING' }).length,
                confirmedCount: records.filter(function(r) { return r.status === 'CONFIRMED' }).length,
                arrivedCount: records.filter(function(r) { return r.status === 'ARRIVED' }).length,
                cancelledCount: records.filter(function(r) { return r.status === 'CANCELLED' }).length
              }}
            }
          } catch (err) { console.warn('加载预约统计失败:', err) }
          return { code: 0 }
        },
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.lastSearch = this.activeFilter ? { status: this.activeFilter } : {}
          this.page = 1
          this.init()
        },
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init()
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init()
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init()
        },
        onSizeChange(payload) {
          this.pageSize = payload.pageSize
          this.init()
        },
        confirmHandle(id) {
          var self = this
          this.$confirm('确认该预订?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              confirmReservation(id).then(res => {
                if (res.code === 1) { self.$message.success('已确认！'); self.init() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(err => { self.$message.error('请求失败：' + err) })
            })
        },
        arriveHandle(id) {
          var self = this
          this.$confirm('确认该客户已到店?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              arriveReservation(id).then(res => {
                if (res.code === 1) { self.$message.success('已到店！'); self.init() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(err => { self.$message.error('请求失败：' + err) })
            })
        },
        cancelHandle(id) {
          var self = this
          this.$confirm('确认取消该预订?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              cancelReservation(id).then(res => {
                if (res.code === 1) { self.$message.success('已取消！'); self.init() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(err => { self.$message.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
