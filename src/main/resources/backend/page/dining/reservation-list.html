<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="reservation-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="input" placeholder="请输入客户姓名" style="width: 200px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="init"></i>
        </el-input>
        <el-input v-model="phone" placeholder="请输入手机号" style="width: 200px; margin-left: 10px;" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="init"></i>
        </el-input>
        <el-select v-model="status" placeholder="请选择状态" clearable style="width: 150px; margin-left: 10px;" @change="init">
          <el-option label="待确认" value="PENDING"></el-option>
          <el-option label="已确认" value="CONFIRMED"></el-option>
          <el-option label="已到店" value="ARRIVED"></el-option>
          <el-option label="已取消" value="CANCELLED"></el-option>
        </el-select>
        <el-date-picker v-model="reserveTime"
          clearable
          value-format="yyyy-MM-dd HH:mm:ss"
          type="datetimerange"
          placeholder="选择预订时间"
          range-separator="至"
          start-placeholder="开始时间"
          end-placeholder="结束时间"
          :default-time="['00:00:00', '23:59:59']"
          style="width: 380px; margin-left: 10px;"
        ></el-date-picker>
        <el-button type="primary" style="margin-left: 10px;" @click="handleQuery">查询</el-button>
      </div>
      <el-table :data="tableData" stripe class="tableBox">
        <el-table-column type="index" label="序号" width="50"></el-table-column>
        <el-table-column prop="customerName" label="客户姓名"></el-table-column>
        <el-table-column prop="phone" label="手机号"></el-table-column>
        <el-table-column prop="tableName" label="桌台"></el-table-column>
        <el-table-column prop="reservedTime" label="预订时间" min-width="100"></el-table-column>
        <el-table-column prop="seatCount" label="就餐人数"></el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 'PENDING' ? 'warning' : scope.row.status === 'CONFIRMED' ? 'success' : scope.row.status === 'ARRIVED' ? 'primary' : 'info'">
              {{ scope.row.status === 'PENDING' ? '待确认' : scope.row.status === 'CONFIRMED' ? '已确认' : scope.row.status === 'ARRIVED' ? '已到店' : '已取消' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="remark" label="备注" show-overflow-tooltip></el-table-column>
        <el-table-column label="操作" width="280" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="confirmHandle(scope.row.id)" v-if="scope.row.status === 'PENDING'">确认</el-button>
            <el-button type="text" size="small" class="blueBug" @click="arriveHandle(scope.row.id)" v-if="scope.row.status === 'CONFIRMED'">到店</el-button>
            <el-button type="text" size="small" class="delBut non" @click="cancelHandle(scope.row.id)" v-if="scope.row.status !== 'ARRIVED' && scope.row.status !== 'CANCELLED'">取消</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#reservation-app',
      data() {
        return {
          input: '',
          phone: '',
          status: '',
          reserveTime: '',
          beginTime: '',
          endTime: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: []
        }
      },
      watch: {
        reserveTime(val) {
          if (val && val.length >= 2) {
            this.beginTime = val[0]
            this.endTime = val[1]
          } else {
            this.beginTime = ''
            this.endTime = ''
          }
        }
      },
      created() {
        this.init()
      },
      methods: {
        async init() {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            customerName: this.input || undefined,
            phone: this.phone || undefined,
            status: this.status || undefined,
            beginTime: this.beginTime || undefined,
            endTime: this.endTime || undefined
          }
          await reservationPage(params).then(res => {
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求出错了：' + err)
          })
        },
        handleQuery() {
          this.page = 1
          this.init()
        },
        confirmHandle(id) {
          this.$confirm('确认该预订?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            confirmReservation(id).then(res => {
              if (res.code === 1) {
                this.$message.success('已确认！')
                this.init()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          })
        },
        arriveHandle(id) {
          this.$confirm('确认该客户已到店?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            arriveReservation(id).then(res => {
              if (res.code === 1) {
                this.$message.success('已到店！')
                this.init()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          })
        },
        cancelHandle(id) {
          this.$confirm('确认取消该预订?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            cancelReservation(id).then(res => {
              if (res.code === 1) {
                this.$message.success('已取消！')
                this.init()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求出错了：' + err)
            })
          })
        },
        handleSizeChange(val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
