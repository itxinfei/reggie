<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="area-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <div class="stats-cards">
        <div class="stat-card primary">
          <div class="stat-icon">📍</div>
          <div class="stat-label">区域总数</div>
          <div class="stat-value">{{ stats.totalAreas || 0 }}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">🪑</div>
          <div class="stat-label">桌台总数</div>
          <div class="stat-value">{{ stats.totalTables || 0 }}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">👥</div>
          <div class="stat-label">平均桌台/区域</div>
          <div class="stat-value">{{ stats.avgTablesPerArea || 0 }}</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">🏢</div>
          <div class="stat-label">最大容量区域</div>
          <div class="stat-value" style="font-size: 20px">{{ stats.maxTablesArea || '-' }}</div>
        </div>
      </div>

      <div class="tableBar">
        <el-input v-model="input" placeholder="请输入区域名称" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-button type="primary" @click="handleQuery">查询</el-button>
        <el-button @click="reset">重置</el-button>
        <div class="tableLab">
          <el-button type="primary" @click="addHandle">+ 新增区域</el-button>
        </div>
      </div>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column type="index" label="序号" width="50"></el-table-column>
        <el-table-column prop="name" label="区域名称"></el-table-column>
        <el-table-column prop="sort" label="排序"></el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog :title="dialog.title" :visible.sync="dialog.visible" width="420px" :before-close="handleClose">
      <el-form ref="form" :model="form" label-width="100px">
        <el-form-item label="区域名称：">
          <el-input v-model="form.name" placeholder="请输入区域名称" maxlength="14" />
        </el-form-item>
        <el-form-item label="排序：">
          <el-input v-model="form.sort" type="number" placeholder="请输入排序" />
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm">确 定</el-button>
      </span>
    </el-dialog>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#area-app',
      data() {
        return {
          loading: false,
          input: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 数据统计
          stats: {
            totalAreas: 0,
            totalTables: 0,
            avgTablesPerArea: 0,
            maxTablesArea: '-'   // 修改点：桌台最多的区域名称
          },
          dialog: {
            title: '',
            visible: false
          },
          form: {
            id: '',
            name: '',
            sort: ''
          },
          action: ''
        }
      },
      created() {
        this.init()
      },
      methods: {
        async init() {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            name: this.input || undefined
          }

          // 并行加载区域列表和统计数据
          const [areaRes, statsRes] = await Promise.all([
            areaPage(params),
            this.loadAreaStats()
          ])

          // 处理区域列表数据
          if (String(areaRes.code) === '1') {
            this.tableData = areaRes.data.records || []
            this.counts = areaRes.data.total
          } else {
            this.$message.error(areaRes.msg || '操作失败')
          }

          // 处理统计数据
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
        },
        // 加载区域统计数据
        async loadAreaStats() {
          try {
            const [areaRes, tableRes] = await Promise.all([
              areaPage({ page: 1, pageSize: 1000 }),
              tablePage({ page: 1, pageSize: 1000 })
            ])

            const totalAreas = areaRes.data?.total || 0
            const totalTables = tableRes.data?.total || 0
            const avg = totalAreas > 0 ? (totalTables / totalAreas).toFixed(1) : 0

            // 修改点：按区域名称分组统计桌台数，找出最大容量区域
            const tableRecords = tableRes.data?.records || []
            const areaCountMap = {}
            tableRecords.forEach(function(t) {
              var name = t.areaName || '未知区域'
              areaCountMap[name] = (areaCountMap[name] || 0) + 1
            })
            var maxArea = '-'
            var maxCount = 0
            Object.keys(areaCountMap).forEach(function(k) {
              if (areaCountMap[k] > maxCount) {
                maxCount = areaCountMap[k]
                maxArea = k + '(' + maxCount + '桌)'
              }
            })

            return {
              code: 1,
              data: {
                totalAreas: totalAreas,
                totalTables: totalTables,
                avgTablesPerArea: avg,
                maxTablesArea: maxArea
              }
            }
          } catch (err) {
            console.warn('加载区域统计数据失败:', err)
          }
          return { code: 0 }
        },
        handleQuery() {
          this.page = 1
          this.init()
        },
        reset() {
          this.input = ''
          this.page = 1
          this.init()
        },
        addHandle() {
          this.action = 'add'
          this.dialog.title = '新增区域'
          this.form.id = ''
          this.form.name = ''
          this.form.sort = ''
          this.dialog.visible = true
        },
        editHandle(row) {
          this.action = 'edit'
          this.dialog.title = '修改区域'
          this.form.id = row.id
          this.form.name = row.name
          this.form.sort = row.sort
          this.dialog.visible = true
        },
        handleClose() {
          this.dialog.visible = false
        },
        submitForm() {
          if (!this.form.name && this.form.name !== 0) {
            this.$message.error('请输入区域名称')
            return
          }
          if (!this.form.sort && this.form.sort !== 0) {
            this.$message.error('请输入排序')
            return
          }
          const reg = /^\d+$/
          if (!reg.test(String(this.form.sort))) {
            this.$message.error('排序只能输入数字类型')
            return
          }
          if (this.action === 'add') {
            addArea({ name: this.form.name, sort: this.form.sort }).then(res => {
              if (res.code === 1) {
                this.$message.success('区域添加成功！')
                this.dialog.visible = false
                this.handleQuery()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          } else {
            updateArea({ id: this.form.id, name: this.form.name, sort: this.form.sort }).then(res => {
              if (res.code === 1) {
                this.$message.success('区域修改成功！')
                this.dialog.visible = false
                this.handleQuery()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          }
        },
        deleteHandle(id) {
          this.$confirm('确认删除该区域, 是否继续?', '确定删除', {
            confirmButtonText: '确定',
            cancelButtonText: '取消'
          }).then(() => {
            deleteArea(id).then(res => {
              if (res.code === 1) {
                this.$message.success('删除成功！')
                this.handleQuery()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        handleSizeChange(val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
