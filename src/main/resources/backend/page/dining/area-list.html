<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
  </style>
</head>
<body>
  <!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
 <a href="#main-content" class="skip-link">跳转到主内容</a>
 <div class="dashboard-container" id="area-app">
    <div class="container" id="main-content" role="main" aria-label="页面主要内容">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">区域管理</h1>
          <p class="ds-page-header__subtitle">管理桌台区域与排序</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input" placeholder="请选择区域名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
        </template>
      </table-bar>
      <!-- 修改点：使用 <crud-table> 统一组件替代手写 el-table + el-pagination -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-index="true"
        index-label="#"
        :index-width="45"
        :show-actions="true"
        :actions-width="240"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-name="{ row }">
          <span style="font-weight:500;">{{ row.name }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 修改点：使用 <crud-dialog> 统一组件替代手写 el-dialog -->
    <crud-dialog
      :title="dialog.title"
      :visible.sync="dialog.visible"
      :submit-loading="submitting"
      width="420px"
      @submit="submitForm"
    >
      <!-- 修改点：补全 :rules，启用 Element 校验（原仅手写 if 判断，属"假必填"） -->
      <el-form ref="form" :model="form" :rules="areaRules" label-width="100px" size="small">
        <el-form-item label="区域名称：" prop="name">
          <el-input v-model="form.name" placeholder="请输入区域名称" maxlength="14" />
        </el-form-item>
        <el-form-item label="排序：" prop="sort">
          <el-input v-model="form.sort" type="number" placeholder="请输入排序" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/dining.js"></script>
  <script src="../../js/components.js"></script>
  <script>
      new Vue({
        el: '#area-app',
        // 修改点：引入列表页通用 Mixin，自动提供分页(page/pageSize/counts/loading)与翻页处理
        mixins: [window.ReggieListMixin],
      data() {
        return {
          loading: false,
          submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
          input: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: {
            totalAreas: 0,
            totalTables: 0,
            avgTablesPerArea: 0,
            maxTablesArea: '-'   // 修改点：桌台最多的区域名称
          },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增区域', type: 'primary' }
          ],
          // 修改点：列配置（供 <crud-table> 组件使用，替代手写 el-table-column）
          columns: [
            { prop: 'name', label: '区域名称', width: 120, align: 'center' },
            { prop: 'sort', label: '排序', width: 60, align: 'center' }
          ],
          // 筛选下拉框配置
          filterOptions: { names: [] },
          optionsLoading: false,
          optionsLoadError: false,
          dialog: {
            title: '',
            visible: false
          },
          form: {
            id: '',
            name: '',
            sort: ''
          },
          // 修改点：区域表单校验规则（配合 el-form :rules + validate()）
          areaRules: {
            name: [{ required: true, whitespace: true, message: '请输入区域名称', trigger: 'blur' }],
            sort: [
              { required: true, message: '请输入排序', trigger: 'blur' },
              { validator: function(rule, value, callback) {
                  if (value === '' || value === null || value === undefined) { callback(); return }
                  if (!/^\d+$/.test(String(value))) { callback(new Error('排序只能输入数字类型')); return }
                  callback()
                }, trigger: 'blur' }
            ]
          },
          action: ''
        }
      },
      created() {
        this.loadFilterOptions()
        this.fetchData(true)
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards() {
          var self = this
          return [
            { key: '区域', icon: '📍', label: '区域总数', value: self.stats.totalAreas || 0, color: 'primary' },
            { key: '桌台', icon: '🪑', label: '桌台总数', value: self.stats.totalTables || 0, color: 'success' },
            { key: '平均', icon: '👥', label: '平均桌台/区域', value: self.stats.avgTablesPerArea || 0, color: 'warning' },
            { key: '最大', icon: '🏢', label: '最大容量区域', value: self.stats.maxTablesArea || '-', color: 'info' }
          ]
        }
      },
      methods: {
        // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await areaOptions()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.names || []
            } else {
              this.optionsLoadError = true
              ReggieUI.warning('加载区域选项失败：' + (res.msg || '接口返回异常'))
            }
          } catch (err) {
            // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
            if (err.message === 'NOTLOGIN') {
              return
            }
            this.optionsLoadError = true
            console.error('加载区域选项失败:', err)
            ReggieUI.error('加载筛选选项失败，请刷新页面重试')
          } finally {
            this.optionsLoading = false
          }
        },
        async fetchData(reloadStats = true) {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            name: this.input || undefined
          }

          // 修改点：F9 性能 — 全局统计与分页列表分离，仅数据突变后重载，翻页/搜索不重算
          const requests = [areaPage(params)]
          if (reloadStats) { requests.push(this.loadAreaStats()) }
          const results = await Promise.all(requests)
          const areaRes = results[0]

          // 处理区域列表数据
          if (String(areaRes.code) === '1') {
            this.tableData = areaRes.data.records || []
            this.counts = areaRes.data.total
          } else {
            ReggieUI.error(areaRes.msg || '操作失败')
          }

          if (reloadStats) {
            const statsRes = results[1]
            // 处理统计数据
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
        },
        // 加载区域统计数据
        async loadAreaStats() {
          try {
            // 修改点：区域总数用轻量 count 查询；桌台总数/最大容量区域改为后端 SQL 分组聚合，
            // 替代 pageSize:999 拉全量后前端分组统计（避免全表扫描与截断风险）
            const [areaRes, tableStatsRes] = await Promise.all([
              areaPage({ page: 1, pageSize: 1 }),
              tableAreaStats()
            ])
            var totalAreas = (areaRes && areaRes.data) ? (areaRes.data.total || 0) : 0
            var totalTables = 0
            var maxTablesArea = '-'
            if (String(tableStatsRes.code) === '1' && tableStatsRes.data) {
              totalTables = Number(tableStatsRes.data.totalTables) || 0
              maxTablesArea = tableStatsRes.data.maxTablesArea || '-'
            }
            var avg = totalAreas > 0 ? (totalTables / totalAreas).toFixed(1) : 0

            return {
              code: 1,
              data: {
                totalAreas: totalAreas,
                totalTables: totalTables,
                avgTablesPerArea: avg,
                maxTablesArea: maxTablesArea
              }
            }
          } catch (err) {
            console.warn('加载区域统计数据失败:', err)
          }
          return { code: 0 }
        },
        handleQuery() {
          this.page = 1
          this.fetchData(false)
        },
        // 修改点：通用优化方案 — 下拉框可重试加载
        onFilterDropdownVisible(flag) {
          if (flag && this.optionsLoadError) {
            this.optionsLoadError = false
            this.loadFilterOptions()
          }
        },
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction(payload) {
          if (payload.key === 'add') {
            this.addHandle()
          }
        },
        reset() {
          this.input = ''
          this.page = 1
          this.fetchData(false)
        },
        addHandle() {
          this.action = 'add'
          this.dialog.title = '新增区域'
          this.form.id = ''
          this.form.name = ''
          this.form.sort = ''
          this.dialog.visible = true
        },
        editHandle(row) {
          this.action = 'edit'
          this.dialog.title = '修改区域'
          this.form.id = row.id
          this.form.name = row.name
          this.form.sort = row.sort
          this.dialog.visible = true
        },
        submitForm() {
          if (this.submitting) return // 提交防重
          const self = this
          let passed = false
          self.$refs.form.validate(function(valid) { passed = valid })
          if (!passed) {
            ReggieUI.warning('请完善表单必填项')
            return
          }
          self.submitting = true
          if (self.action === 'add') {
            addArea({ name: this.form.name, sort: this.form.sort }).then(res => {
              self.submitting = false
              if (res.code === 1) {
                ReggieUI.success('区域添加成功！')
                this.dialog.visible = false
                this.handleQuery()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => {
              self.submitting = false
              ReggieUI.error('请求失败：' + err)
            })
          } else {
            updateArea({ id: this.form.id, name: this.form.name, sort: this.form.sort }).then(res => {
              self.submitting = false
              if (res.code === 1) {
                ReggieUI.success('区域修改成功！')
                this.dialog.visible = false
                this.handleQuery()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => {
              self.submitting = false
              ReggieUI.error('请求失败：' + err)
            })
          }
        },
        deleteHandle(id) {
          ReggieUI.confirm('确认删除该区域, 是否继续?', '确定删除', {
            confirmButtonText: '确定',
            cancelButtonText: '取消'
          }).then(() => {
            deleteArea(id).then(res => {
              if (res.code === 1) {
                ReggieUI.success('删除成功！')
                this.handleQuery()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(err => {
              ReggieUI.error('请求失败：' + err)
            })
          })
        },
        // 修改点：分页处理统一交由 ReggieListMixin 的 onPageChange / onSizeChange 处理，手写分页方法已移除
      }
    })
  </script>
</body>
</html>
