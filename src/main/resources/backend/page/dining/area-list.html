<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
  </style>
</head>
<body>
  <div class="dashboard-container" id="area-app">
    <div class="container">
      <!-- ========== 数据统计卡片 ========== -->
      <!-- 修改点：使用 <stat-cards> 统一组件替代手写 HTML -->
      <stat-cards :cards="statsCards"></stat-cards>

      <!-- 修改点：使用 <table-bar> 统一组件替代手写 HTML -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input" placeholder="请选择区域名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading"
            :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')">
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
        </template>
      </table-bar>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column type="index" label="序号" width="50"></el-table-column>
        <el-table-column prop="name" label="区域名称"></el-table-column>
        <el-table-column prop="sort" label="排序"></el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="btn-view" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog :title="dialog.title" :visible.sync="dialog.visible" width="420px" :before-close="handleClose">
      <el-form ref="form" :model="form" label-width="100px">
        <el-form-item label="区域名称：">
          <el-input v-model="form.name" placeholder="请输入区域名称" maxlength="14" />
        </el-form-item>
        <el-form-item label="排序：">
          <el-input v-model="form.sort" type="number" placeholder="请输入排序" />
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm">确 定</el-button>
      </span>
    </el-dialog>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/dining.js"></script>
  <script src="../../js/components.js"></script>
  <script>
    new Vue({
      el: '#area-app',
      data() {
        return {
          loading: false,
          input: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: {
            totalAreas: 0,
            totalTables: 0,
            avgTablesPerArea: 0,
            maxTablesArea: '-'   // 修改点：桌台最多的区域名称
          },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增区域', type: 'primary' }
          ],
          // 筛选下拉框配置
          filterOptions: { names: [] },
          optionsLoading: false,
          optionsLoadError: false,
          dialog: {
            title: '',
            visible: false
          },
          form: {
            id: '',
            name: '',
            sort: ''
          },
          action: ''
        }
      },
      created() {
        this.loadFilterOptions()
        this.init()
      },
      computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards() {
          var self = this
          return [
            { key: '区域', icon: '📍', label: '区域总数', value: self.stats.totalAreas || 0, color: 'primary' },
            { key: '桌台', icon: '🪑', label: '桌台总数', value: self.stats.totalTables || 0, color: 'success' },
            { key: '平均', icon: '👥', label: '平均桌台/区域', value: self.stats.avgTablesPerArea || 0, color: 'warning' },
            { key: '最大', icon: '🏢', label: '最大容量区域', value: self.stats.maxTablesArea || '-', color: 'info' }
          ]
        }
      },
      methods: {
        // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await areaOptions()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.names || []
            } else {
              this.optionsLoadError = true
              this.$message.warning('加载区域选项失败：' + (res.msg || '接口返回异常'))
            }
          } catch (err) {
            // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
            if (err.message === 'NOTLOGIN') {
              return
            }
            this.optionsLoadError = true
            console.error('加载区域选项失败:', err)
            this.$message.error('加载筛选选项失败，请刷新页面重试')
          } finally {
            this.optionsLoading = false
          }
        },
        async init() {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            name: this.input || undefined
          }

          // 并行加载区域列表和统计数据
          const [areaRes, statsRes] = await Promise.all([
            areaPage(params),
            this.loadAreaStats()
          ])

          // 处理区域列表数据
          if (String(areaRes.code) === '1') {
            this.tableData = areaRes.data.records || []
            this.counts = areaRes.data.total
          } else {
            this.$message.error(areaRes.msg || '操作失败')
          }

          // 处理统计数据
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
        },
        // 加载区域统计数据
        async loadAreaStats() {
          try {
            const [areaRes, tableRes] = await Promise.all([
              areaPage({ page: 1, pageSize: 1000 }),
              tablePage({ page: 1, pageSize: 1000 })
            ])

            const totalAreas = areaRes.data?.total || 0
            const totalTables = tableRes.data?.total || 0
            const avg = totalAreas > 0 ? (totalTables / totalAreas).toFixed(1) : 0

            // 修改点：按区域名称分组统计桌台数，找出最大容量区域
            const tableRecords = tableRes.data?.records || []
            const areaCountMap = {}
            tableRecords.forEach(function(t) {
              var name = t.areaName || '未知区域'
              areaCountMap[name] = (areaCountMap[name] || 0) + 1
            })
            var maxArea = '-'
            var maxCount = 0
            Object.keys(areaCountMap).forEach(function(k) {
              if (areaCountMap[k] > maxCount) {
                maxCount = areaCountMap[k]
                maxArea = k + '(' + maxCount + '桌)'
              }
            })

            return {
              code: 1,
              data: {
                totalAreas: totalAreas,
                totalTables: totalTables,
                avgTablesPerArea: avg,
                maxTablesArea: maxArea
              }
            }
          } catch (err) {
            console.warn('加载区域统计数据失败:', err)
          }
          return { code: 0 }
        },
        handleQuery() {
          this.page = 1
          this.init()
        },
        // 修改点：通用优化方案 — 下拉框可重试加载
        onFilterDropdownVisible(flag) {
          if (flag && this.optionsLoadError) {
            this.optionsLoadError = false
            this.loadFilterOptions()
          }
        },
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction(payload) {
          if (payload.key === 'add') {
            this.addHandle()
          }
        },
        reset() {
          this.input = ''
          this.page = 1
          this.init()
        },
        addHandle() {
          this.action = 'add'
          this.dialog.title = '新增区域'
          this.form.id = ''
          this.form.name = ''
          this.form.sort = ''
          this.dialog.visible = true
        },
        editHandle(row) {
          this.action = 'edit'
          this.dialog.title = '修改区域'
          this.form.id = row.id
          this.form.name = row.name
          this.form.sort = row.sort
          this.dialog.visible = true
        },
        handleClose() {
          this.dialog.visible = false
        },
        submitForm() {
          if (!this.form.name && this.form.name !== 0) {
            this.$message.error('请输入区域名称')
            return
          }
          if (!this.form.sort && this.form.sort !== 0) {
            this.$message.error('请输入排序')
            return
          }
          const reg = /^\d+$/
          if (!reg.test(String(this.form.sort))) {
            this.$message.error('排序只能输入数字类型')
            return
          }
          if (this.action === 'add') {
            addArea({ name: this.form.name, sort: this.form.sort }).then(res => {
              if (res.code === 1) {
                this.$message.success('区域添加成功！')
                this.dialog.visible = false
                this.handleQuery()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          } else {
            updateArea({ id: this.form.id, name: this.form.name, sort: this.form.sort }).then(res => {
              if (res.code === 1) {
                this.$message.success('区域修改成功！')
                this.dialog.visible = false
                this.handleQuery()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          }
        },
        deleteHandle(id) {
          this.$confirm('确认删除该区域, 是否继续?', '确定删除', {
            confirmButtonText: '确定',
            cancelButtonText: '取消'
          }).then(() => {
            deleteArea(id).then(res => {
              if (res.code === 1) {
                this.$message.success('删除成功！')
                this.handleQuery()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        handleSizeChange(val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
