<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排队管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="dashboard-container" id="queue-app">
    <div class="container">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">排队叫号</h1>
          <p class="ds-page-header__subtitle">管理堂食排队与叫号</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-index="true"
        :show-actions="true"
        :actions-width="180"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="row.status === 'WAITING' ? 'warning' : row.status === 'CALLED' ? 'primary' : row.status === 'SEATED' ? 'success' : 'info'" size="small">
            {{ row.status === 'WAITING' ? '等待中' : row.status === 'CALLED' ? '已叫号' : row.status === 'SEATED' ? '已入座' : '已取消' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="callHandle(row.id)" v-if="row.status === 'WAITING'">叫号</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row.id)" v-if="row.status !== 'SEATED' && row.status !== 'CANCELLED'">取消</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 取号弹窗 -->
    <crud-dialog
      title="取号"
      :visible.sync="dialog.visible"
      :submit-loading="submitting"
      width="420px"
      submit-text="确 定"
      @submit="submitTake"
      @close="dialog.visible = false"
    >
      <!-- 修改点：补全 :rules，启用 Element 校验（原仅手写 if 判断，属"假必填"） -->
      <el-form ref="form" :model="form" :rules="queueRules" label-width="100px">
        <el-form-item label="手机号：" prop="phone">
          <el-input v-model="form.phone" placeholder="请输入手机号" maxlength="11" />
        </el-form-item>
        <el-form-item label="就餐人数：" prop="seatCount">
          <el-input v-model="form.seatCount" type="number" placeholder="请输入就餐人数" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#queue-app',
      data() {
        return {
          loading: false,
          submitting: false, // 提交防重：请求期间锁定弹窗确认按钮
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { totalQueues: 0, waitingCount: 0, calledCount: 0, seatedCount: 0, cancelledCount: 0 },
          activeFilter: '',
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'phone', placeholder: '请输入手机号', width: '200px' },
            { type: 'select', field: 'status', placeholder: '请选择状态', width: '150px',
              options: [
                { label: '等待中', value: 'WAITING' },
                { label: '已叫号', value: 'CALLED' },
                { label: '已入座', value: 'SEATED' },
                { label: '已取消', value: 'CANCELLED' }
              ] }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'take', text: '+ 取号', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'queueNo', label: '排队号', width: 80, align: 'center' },
            { prop: 'phone', label: '手机号', width: 120, align: 'center' },
            { prop: 'seatCount', label: '人数', width: 60, align: 'center', type: 'number' },
            { prop: 'status', label: '状态', slot: true, width: 70, align: 'center' },
            { prop: 'createdTime', label: '取号时间', width: 140, align: 'center' }
          ],
          // 取号弹窗
          dialog: { visible: false },
          form: { phone: '', seatCount: '' },
          // 修改点：取号表单校验规则（配合 el-form :rules + validate()）
          queueRules: {
            phone: [
              { required: true, message: '请输入手机号', trigger: 'blur' },
              { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }
            ],
            seatCount: [{ required: true, message: '请输入就餐人数', trigger: 'blur' }]
          },
          lastSearch: {}
        }
      },
      created() {
        this.init(true)
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '📋', label: '排队总数', value: self.stats.totalQueues, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'CALLED', icon: '🔔', label: '已叫号', value: self.stats.calledCount, color: 'info', clickable: true, active: self.activeFilter === 'CALLED' },
            { key: 'SEATED', icon: '✅', label: '已入座', value: self.stats.seatedCount, color: 'success', clickable: true, active: self.activeFilter === 'SEATED' },
            { key: 'CANCELLED', icon: '❌', label: '已取消', value: self.stats.cancelledCount, color: 'danger', clickable: true, active: self.activeFilter === 'CANCELLED' }
          ]
        }
      },
      methods: {
        async init(reloadStats = true) {
          this.loading = true
          var ls = this.lastSearch || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            phone: ls.phone || undefined,
            status: ls.status || undefined
          }
          // 修改点：F9 性能 — 全局统计与分页列表分离，仅数据突变后重载，翻页/搜索不重算
          var requests = [queuePage(params)]
          if (reloadStats) { requests.push(this.loadQueueStats()) }
          var results = await Promise.all(requests)
          var queueRes = results[0]
          if (String(queueRes.code) === '1') {
            this.tableData = queueRes.data.records || []
            this.counts = queueRes.data.total
          } else {
            ReggieUI.error(queueRes.msg || '操作失败')
          }
          if (reloadStats) {
            var statsRes = results[1]
            if (statsRes && String(statsRes.code) === '1') {
              this.stats = statsRes.data || this.stats
            }
          }
          this.loading = false
        },
        async loadQueueStats() {
          try {
            // 修改点：使用 pageSize=1 × 5 轻量查询替代 pageSize=1000 拉全量，直接取 total 避免数据截断
            var results = await Promise.all([
              queuePage({ page: 1, pageSize: 1 }),
              queuePage({ page: 1, pageSize: 1, status: 'WAITING' }),
              queuePage({ page: 1, pageSize: 1, status: 'CALLED' }),
              queuePage({ page: 1, pageSize: 1, status: 'SEATED' }),
              queuePage({ page: 1, pageSize: 1, status: 'CANCELLED' })
            ])
            return { code: 1, data: {
              totalQueues: (String(results[0].code) === '1') ? (results[0].data.total || 0) : 0,
              waitingCount: (String(results[1].code) === '1') ? (results[1].data.total || 0) : 0,
              calledCount: (String(results[2].code) === '1') ? (results[2].data.total || 0) : 0,
              seatedCount: (String(results[3].code) === '1') ? (results[3].data.total || 0) : 0,
              cancelledCount: (String(results[4].code) === '1') ? (results[4].data.total || 0) : 0
            }}
          } catch (err) { console.warn('加载排队统计失败:', err) }
          return { code: 0 }
        },
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.lastSearch = this.activeFilter ? { status: this.activeFilter } : {}
          this.page = 1
          this.init(false)
        },
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init(false)
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init(false)
        },
        onAction(payload) {
          if (payload.key === 'take') {
            this.form.phone = ''
            this.form.seatCount = ''
            this.dialog.visible = true
          }
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init(false)
        },
        onSizeChange(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.init(false)
        },
        submitTake() {
          if (this.submitting) return // 提交防重
          const self = this
          let passed = false
          self.$refs.form.validate(function(valid) { passed = valid })
          if (!passed) {
            ReggieUI.warning('请完善表单必填项')
            return
          }
          self.submitting = true
          queueTake({ phone: self.form.phone, seatCount: self.form.seatCount }).then(res => {
            self.submitting = false
            if (res.code === 1) {
              ReggieUI.success('取号成功！排队号：' + (res.data ? res.data.queueNo : ''))
              self.dialog.visible = false
              self.init()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(err => { self.submitting = false; ReggieUI.error('请求失败：' + err) })
        },
        callHandle(id) {
          var self = this
          ReggieUI.confirm('确认叫号该排队记录?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              queueCall({ id: id }).then(res => {
                if (res.code === 1) { ReggieUI.success('叫号成功！'); self.init() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(err => { ReggieUI.error('请求失败：' + err) })
            })
        },
        cancelHandle(id) {
          var self = this
          ReggieUI.confirm('确认取消该排队?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              queueCancel(id).then(res => {
                if (res.code === 1) { ReggieUI.success('已取消！'); self.init() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(err => { ReggieUI.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
