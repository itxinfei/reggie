<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排队管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="queue-app">
    <div class="container">
      <div class="tableBar">
        <el-input v-model="input" placeholder="请输入手机号" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-select v-model="status" placeholder="请选择状态" clearable class="el-select--narrow" style="margin-left: 10px;" @change="handleQuery">
          <el-option label="等待中" value="WAITING"></el-option>
          <el-option label="已叫号" value="CALLED"></el-option>
          <el-option label="已入座" value="SEATED"></el-option>
          <el-option label="已取消" value="CANCELLED"></el-option>
        </el-select>
        <el-button type="primary" @click="handleQuery">查询</el-button>
        <el-button @click="reset">重置</el-button>
        <div class="tableLab">
          <el-button type="primary" @click="takeHandle">+ 取号</el-button>
        </div>
      </div>
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column type="index" label="序号" width="50"></el-table-column>
        <el-table-column prop="queueNo" label="排队号"></el-table-column>
        <el-table-column prop="phone" label="手机号"></el-table-column>
        <el-table-column prop="seatCount" label="就餐人数"></el-table-column>
        <el-table-column label="状态">
          <template slot-scope="scope">
            <el-tag :type="scope.row.status === 'WAITING' ? 'warning' : scope.row.status === 'CALLED' ? 'primary' : scope.row.status === 'SEATED' ? 'success' : 'info'">
              {{ scope.row.status === 'WAITING' ? '等待中' : scope.row.status === 'CALLED' ? '已叫号' : scope.row.status === 'SEATED' ? '已入座' : '已取消' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="createdTime" label="取号时间"></el-table-column>
        <el-table-column label="操作" width="200" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="callHandle(scope.row.id)" v-if="scope.row.status === 'WAITING'">叫号</el-button>
            <el-button type="text" size="small" class="delBut non" @click="cancelHandle(scope.row.id)" v-if="scope.row.status !== 'SEATED' && scope.row.status !== 'CANCELLED'">取消</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination
        class="pageList"
        :page-sizes="[10, 20, 30, 40]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="counts"
        @size-change="handleSizeChange"
        :current-page.sync="page"
        @current-change="handleCurrentChange"
      ></el-pagination>
    </div>
    <el-dialog title="取号" :visible.sync="dialog.visible" width="420px" :before-close="handleClose">
      <el-form ref="form" :model="form" label-width="100px">
        <el-form-item label="手机号：">
          <el-input v-model="form.phone" placeholder="请输入手机号" maxlength="11" />
        </el-form-item>
        <el-form-item label="就餐人数：">
          <el-input v-model="form.seatCount" type="number" placeholder="请输入就餐人数" />
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="handleClose">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitTake">确 定</el-button>
      </span>
    </el-dialog>
  </div>
  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#queue-app',
      data() {
        return {
          loading: false,
          input: '',
          status: '',
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          dialog: {
            visible: false
          },
          form: {
            phone: '',
            seatCount: ''
          }
        }
      },
      created() {
        this.init()
      },
      methods: {
        async init() {
          const params = {
            page: this.page,
            pageSize: this.pageSize,
            phone: this.input || undefined,
            status: this.status || undefined
          }
          await queuePage(params).then(res => {
            if (String(res.code) === '1') {
              this.tableData = res.data.records || []
              this.counts = res.data.total
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          })
        },
        handleQuery() {
          this.page = 1
          this.init()
        },
        reset() {
          this.input = ''
          this.status = ''
          this.page = 1
          this.init()
        },
        takeHandle() {
          this.form.phone = ''
          this.form.seatCount = ''
          this.dialog.visible = true
        },
        handleClose() {
          this.dialog.visible = false
        },
        submitTake() {
          if (!this.form.phone) {
            this.$message.error('请输入手机号')
            return
          }
          if (!this.form.seatCount) {
            this.$message.error('请输入就餐人数')
            return
          }
          queueTake({ phone: this.form.phone, seatCount: this.form.seatCount }).then(res => {
            if (res.code === 1) {
              this.$message.success('取号成功！排队号：' + (res.data ? res.data.queueNo : ''))
              this.dialog.visible = false
              this.handleQuery()
            } else {
              this.$message.error(res.msg || '操作失败')
            }
          }).catch(err => {
            this.$message.error('请求失败：' + err)
          })
        },
        callHandle(id) {
          this.$confirm('确认叫号该排队记录?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            queueCall({ id: id }).then(res => {
              if (res.code === 1) {
                this.$message.success('叫号成功！')
                this.init()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        cancelHandle(id) {
          this.$confirm('确认取消该排队?', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            queueCancel(id).then(res => {
              if (res.code === 1) {
                this.$message.success('已取消！')
                this.init()
              } else {
                this.$message.error(res.msg || '操作失败')
              }
            }).catch(err => {
              this.$message.error('请求失败：' + err)
            })
          })
        },
        handleSizeChange(val) {
          this.pageSize = val
          this.init()
        },
        handleCurrentChange(val) {
          this.page = val
          this.init()
        }
      }
    })
  </script>
</body>
</html>
