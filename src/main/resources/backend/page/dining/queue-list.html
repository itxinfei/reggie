<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排队叫号 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
  <style>
    .queue-container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-5) }

    /* 筛选栏 */
    .filter-bar { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap }
    .filter-bar__label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .filter-bar__col { display: flex; flex-direction: column; gap: 4px }
    .filter-bar__input { height: 36px }
    .filter-bar__btn { height: 36px; font-size: var(--font-size-base) }

    /* 叫号操作栏 */
    .call-bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; padding: var(--space-3) var(--space-4); background: var(--el-bg-ghost); border-radius: var(--radius-md) }
    .call-bar__seat { display: flex; align-items: center; gap: var(--space-2) }
    .call-bar__seat-label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .call-bar__tip { font-size: 12px; color: var(--text-muted) }
    .call-bar__reset { font-size: 12px }

    /* 取号弹窗 */
    .take-dialog__form { margin-top: var(--space-2) }

    /* 入座弹窗 */
    .seat-detail { padding: var(--space-3); background: var(--el-bg-ghost); border-radius: var(--radius-sm); margin-bottom: var(--space-3) }
    .seat-detail__row { display: flex; justify-content: space-between; padding: var(--space-1) 0; font-size: var(--font-size-base) }
    .seat-detail__label { color: var(--text-muted) }
    .seat-detail__value { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums }

    /* 空态 */
    .empty-state { text-align: center; padding: var(--space-15) var(--space-4); color: var(--text-muted); font-size: var(--font-size-base) }
    .empty-state__icon { font-size: 48px; line-height: 1; margin-bottom: var(--space-4) }
    .empty-state__desc { font-size: 12px; color: var(--text-muted); margin-top: var(--space-2) }

    /* 状态标签 */
    .status-tag { font-weight: 500 }

    /* 响应式筛选栏 */
    @media (max-width: 768px) {
      .filter-bar { flex-direction: column; align-items: stretch }
      .filter-bar__col { flex: 1 }
      .filter-bar__input { width: 100% }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <div class="dashboard-container" id="queue-app">
    <div class="container queue-container" id="main-content" role="main" aria-label="排队叫号看板">
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">排队叫号</h1>
          <p class="ds-page-header__subtitle">堂食排队取号、叫号、入座全流程管理</p>
        </div>
      </header>

      <!-- 统计卡片（固定 4 个） -->
      <stat-cards :cards="statsCards" :loading="statsLoading"></stat-cards>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-bar__col">
          <span class="filter-bar__label">手机号：</span>
          <el-input v-model="searchPhone" class="filter-bar__input" style="width:200px" clearable placeholder="请输入手机号" aria-label="手机号" @keyup.enter.native="onSearch"></el-input>
        </div>
        <div class="filter-bar__col">
          <span class="filter-bar__label">状态：</span>
          <el-select v-model="searchStatus" class="filter-bar__input" style="width:150px" clearable aria-label="状态" placeholder="全部状态">
            <el-option value="WAITING" label="等待中"></el-option>
            <el-option value="CALLED" label="已叫号"></el-option>
            <el-option value="SEATED" label="已入座"></el-option>
            <el-option value="CANCELLED" label="已取消"></el-option>
          </el-select>
        </div>
        <el-button type="primary" size="small" @click="onSearch" class="filter-bar__btn">查询</el-button>
        <el-button size="small" @click="onReset">重置</el-button>
      </div>

      <!-- 叫号操作栏 -->
      <div class="call-bar" v-if="stats.waitingCount > 0">
        <el-button
          type="primary"
          size="small"
          :loading="callLoading"
          :disabled="callLoading"
          @click="callNext"
        >叫下一位</el-button>
        <div class="call-bar__seat">
          <span class="call-bar__seat-label">按座位数：</span>
          <el-select v-model="callSeatCount" style="width:130px" clearable aria-label="按座位数筛选" size="small" placeholder="不限人数">
            <el-option :value="2" label="2人"></el-option>
            <el-option :value="4" label="4人"></el-option>
            <el-option :value="6" label="6人"></el-option>
            <el-option :value="8" label="8人"></el-option>
            <el-option :value="10" label="10人"></el-option>
            <el-option :value="12" label="12人"></el-option>
          </el-select>
        </div>
        <el-button type="text" size="small" @click="showTakeDialog" aria-label="新增取号">+ 取号</el-button>
        <el-button type="text" size="small" class="call-bar__reset" @click="callSeatCount = null">重置筛选</el-button>
        <span class="call-bar__tip" v-if="callSeatCount">按 {{ callSeatCount }} 人桌筛选下一位</span>
        <span class="call-bar__tip" v-else>呼叫等待队列中的下一位顾客</span>
      </div>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        empty-hint="暂无排队记录"
        :data="tableData"
        :columns="columns"
        :loading="tableLoading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-index="true"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="statusTagType(row.status)" size="small" class="status-tag">
            {{ statusLabel(row.status) }}
          </el-tag>
        </template>
        <template #col-phone="{ row }">
          <span v-if="row.phone">{{ row.phone.substring(0,3) }}****{{ row.phone.substring(7) }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" @click="seatHandle(row)" v-if="row.status === 'CALLED'" class="btn-brand-text" :aria-label="'安排入座 ' + (row.queueNo || '排队记录')">入座</el-button>
          <el-button type="text" size="small" @click="recallHandle(row)" v-if="row.status === 'CALLED'" :aria-label="'退回等待 ' + (row.queueNo || '')">退回</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row.id)" v-if="row.status === 'WAITING' || row.status === 'CALLED'" :aria-label="'取消排队 ' + (row.queueNo || '')">取消</el-button>
          <el-button type="text" size="small" @click="reactivateHandle(row.id)" v-if="row.status === 'CANCELLED'" :aria-label="'恢复排队 ' + (row.queueNo || '')" class="btn-warning-text">恢复</el-button>
        </template>
      </crud-table>

      <div v-if="counts === 0 && !tableLoading && tableData.length === 0" class="empty-state">
        <div class="empty-state__icon"><i class="ri-file-list-3-line" aria-hidden="true"></i></div>
        <div>暂无排队记录</div>
        <div class="empty-state__desc">点击上方"取号"为顾客创建排队记录</div>
      </div>
    </div>

    <!-- 取号弹窗 -->
    <crud-dialog
      title="取号"
      :visible.sync="takeForm.dialogVisible"
      :submit-loading="takeLoading"
      width="420px"
      submit-text="确 定"
      aria-label="取号表单"
      @submit="submitTake"
      @close="handleTakeClose"
    >
      <el-form ref="takeFormRef" :model="takeForm" :rules="takeRules" label-width="80px" class="take-dialog__form">
        <el-form-item label="手机号" prop="phone">
          <el-input v-model="takeForm.phone" placeholder="请输入顾客手机号" maxlength="11" size="small"></el-input>
        </el-form-item>
        <el-form-item label="就餐人数" prop="seatCount">
          <el-input-number v-model="takeForm.seatCount" :min="1" :max="20" size="small" style="width:180px"></el-input-number>
          <span class="ds-form-hint">人</span>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 入座弹窗 -->
    <crud-dialog
      title="安排入座"
      :visible.sync="seatForm.dialogVisible"
      :submit-loading="seatLoading"
      width="560px"
      submit-text="确 认 入 座"
      aria-label="安排入座表单"
      @submit="submitSeat"
      @close="handleSeatClose"
    >
      <div class="seat-detail">
        <div class="seat-detail__row">
          <span class="seat-detail__label">排队号</span>
          <span class="seat-detail__value">{{ seatForm.queueNo }}</span>
        </div>
        <div class="seat-detail__row">
          <span class="seat-detail__label">手机号</span>
          <span class="seat-detail__value">{{ seatForm.phoneDisplay }}</span>
        </div>
        <div class="seat-detail__row">
          <span class="seat-detail__label">就餐人数</span>
          <span class="seat-detail__value">{{ seatForm.seatCount }} 人</span>
        </div>
        <div class="seat-detail__row">
          <span class="seat-detail__label">取号时间</span>
          <span class="seat-detail__value">{{ seatForm.createdTimeDisplay }}</span>
        </div>
      </div>
      <el-form :model="seatForm" label-width="80px">
        <el-form-item label="关联桌台">
          <el-select v-model="seatForm.tableId" style="width:240px" clearable placeholder="选择桌台（可选）" size="small">
            <el-option
              v-for="t in tableOptions"
              :key="t.value"
              :label="t.label"
              :value="t.value"
              :disabled="t.disabled"
            ></el-option>
          </el-select>
          <span class="ds-form-hint">未选则不关联桌台</span>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#queue-app',
      data: function() {
        return {
          // 筛选
          searchPhone: '',
          searchStatus: '',
          // 统计
          statsLoading: false,
          stats: { totalQueues: 0, waitingCount: 0, calledCount: 0, seatedCount: 0, cancelledCount: 0 },
          // 表格
          tableLoading: false,
          page: 1,
          pageSize: 10,
          counts: 0,
          tableData: [],
          columns: [
            { prop: 'queueNo', label: '排队号', width: 90, align: 'center' },
            { prop: 'phone', label: '手机号', slot: true, width: 130, align: 'center' },
            { prop: 'seatCount', label: '人数', width: 70, align: 'center', type: 'number' },
            { prop: 'status', label: '状态', slot: true, width: 90, align: 'center' },
            { prop: 'createdTime', label: '取号时间', width: 160, align: 'center' }
          ],
          // 叫号
          callLoading: false,
          callSeatCount: null,
          // 取号弹窗
          takeLoading: false,
          takeForm: { dialogVisible: false, phone: '', seatCount: 2 },
          takeRules: {
            phone: [
              { required: true, message: '请输入手机号', trigger: 'blur' },
              { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }
            ],
            seatCount: [{ required: true, message: '请输入就餐人数', trigger: 'blur' }]
          },
          // 入座弹窗
          seatLoading: false,
          seatForm: {
            dialogVisible: false,
            queueId: null,
            queueNo: '',
            phoneDisplay: '',
            seatCount: 0,
            createdTimeDisplay: '',
            tableId: null
          },
          tableOptions: []
        }
      },
      computed: {
        // 统计卡片（固定 4 个：总数/等待中/已叫号/已入座，已取消并入总数说明）
        statsCards: function () {
          var s = this.stats || {}
          return [
            { key: 'total', icon: 'ri-file-list-3-line', label: '排队总数', value: s.totalQueues || 0, color: 'primary', subText: '今日累计 · 已取消 ' + (s.cancelledCount || 0) },
            { key: 'waiting', icon: 'ri-time-line', label: '等待中', value: s.waitingCount || 0, color: 'warning', subText: '尚未叫号' },
            { key: 'called', icon: 'ri-notification-3-line', label: '已叫号', value: s.calledCount || 0, color: 'danger', subText: '待安排入座' },
            { key: 'seated', icon: 'ri-checkbox-circle-line', label: '已入座', value: s.seatedCount || 0, color: 'success', subText: '完成就座' }
          ]
        }
      },
      created: function() {
        this.loadStats()
        this.loadTable()
        this.loadTableOptions()
      },
      methods: {
        // 状态标签映射
        statusTagType: function(status) {
          if (status === 'WAITING') return 'warning'
          if (status === 'CALLED') return 'danger'
          if (status === 'SEATED') return 'success'
          return 'info'
        },
        statusLabel: function(status) {
          var map = { WAITING: '等待中', CALLED: '已叫号', SEATED: '已入座', CANCELLED: '已取消' }
          return map[status] || '未知'
        },
        // 加载统计
        loadStats: function() {
          var self = this
          self.statsLoading = true
          queueStats().then(function(res) {
            self.statsLoading = false
            if (res.code === 1 && res.data) {
              self.stats = res.data
            }
          }).catch(function(err) {
            self.statsLoading = false
            console.warn('加载排队统计失败:', err)
          })
        },
        // 加载表格
        loadTable: function() {
          var self = this
          self.tableLoading = true
          var params = {
            page: self.page,
            pageSize: self.pageSize
          }
          if (self.searchPhone && self.searchPhone.trim()) { params.phone = self.searchPhone.trim() }
          if (self.searchStatus) { params.status = self.searchStatus }
          queuePage(params).then(function(res) {
            self.tableLoading = false
            if (res.code === 1) {
              self.tableData = res.data.records || []
              self.counts = res.data.total
            } else {
              ReggieUI.error(res.msg || '加载失败')
            }
          }).catch(function(err) {
            self.tableLoading = false
            ReggieUI.error('请求失败：' + err)
          })
        },
        // 加载桌台选项（入座弹窗用）
        loadTableOptions: function() {
          var self = this
          // 修改点：pageSize 由 200 收敛为 100 —— 后端 /dining/table/page 声明 @Max(100)，
          // 传 200 会触发参数校验 400，桌台下拉选项加载直接失败（且 PageUtils.cap 亦封顶 100）
          tablePage({ page: 1, pageSize: 100 }).then(function(res) {
            if (res.code === 1 && res.data && res.data.records) {
              self.tableOptions = res.data.records.map(function(t) {
                return {
                  value: t.id,
                  label: (t.name || '桌台') + '（' + (t.areaName || '未知区域') + '，' + (t.seatCount || 0) + '座）',
                  disabled: t.status !== 'FREE'
                }
              })
            }
          }).catch(function() { /* 桌台加载失败不影响主流程 */ })
        },
        // 筛选
        onSearch: function() {
          this.page = 1
          this.loadTable()
        },
        onReset: function() {
          this.searchPhone = ''
          this.searchStatus = ''
          this.page = 1
          this.loadTable()
        },
        onPageChange: function(payload) {
          this.page = payload.page
          this.loadTable()
        },
        onSizeChange: function(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.loadTable()
        },
        // 叫下一位
        callNext: function() {
          var self = this
          if (self.callLoading) return
          self.callLoading = true
          var body = {}
          if (self.callSeatCount) { body.seatCount = self.callSeatCount }
          queueCall(body).then(function(res) {
            self.callLoading = false
            if (res.code === 1 && res.data) {
              ReggieUI.success('叫号成功！排队号：' + res.data.queueNo)
              self.loadStats()
              self.loadTable()
            } else {
              ReggieUI.warning(res.msg || '没有等待中的顾客')
            }
          }).catch(function(err) {
            self.callLoading = false
            ReggieUI.error('请求失败：' + err)
          })
        },
        // 单独叫号（已移除行操作按钮，全局"叫下一位"按钮替代）
        // 取号弹窗
        showTakeDialog: function() {
          this.takeForm.phone = ''
          this.takeForm.seatCount = 2
          this.takeForm.dialogVisible = true
        },
        handleTakeClose: function() {
          this.takeForm.dialogVisible = false
          this.$refs.takeFormRef && this.$refs.takeFormRef.resetFields()
        },
        submitTake: function() {
          if (this.takeLoading) return
          var self = this
          self.takeLoading = true
          self.$refs.takeFormRef.validate(function(valid) {
            if (!valid) { self.takeLoading = false; return }
            queueTake({ phone: self.takeForm.phone, seatCount: self.takeForm.seatCount }).then(function(res) {
              self.takeLoading = false
              if (res.code === 1) {
                ReggieUI.success('取号成功！排队号：' + (res.data ? res.data.queueNo : ''))
                self.takeForm.dialogVisible = false
                self.loadStats()
                self.loadTable()
              } else {
                ReggieUI.error(res.msg || '操作失败')
              }
            }).catch(function(err) {
              self.takeLoading = false
              ReggieUI.error('请求失败：' + err)
            })
          })
        },
        // 入座弹窗
        seatHandle: function(row) {
          this.seatForm.queueId = row.id
          this.seatForm.queueNo = row.queueNo || ''
          this.seatForm.phoneDisplay = row.phone ? (row.phone.substring(0,3) + '****' + row.phone.substring(7)) : ''
          this.seatForm.seatCount = row.seatCount || 0
          this.seatForm.createdTimeDisplay = row.createdTime || ''
          this.seatForm.tableId = null
          this.seatForm.dialogVisible = true
        },
        handleSeatClose: function() {
          this.seatForm.dialogVisible = false
        },
        submitSeat: function() {
          if (this.seatLoading) return
          var self = this
          self.seatLoading = true
          var data = { queueId: self.seatForm.queueId }
          if (self.seatForm.tableId) { data.tableId = self.seatForm.tableId }
          queueSeat(data).then(function(res) {
            self.seatLoading = false
            if (res.code === 1) {
              ReggieUI.success('安排入座成功！')
              self.seatForm.dialogVisible = false
              self.loadStats()
              self.loadTable()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          }).catch(function(err) {
            self.seatLoading = false
            ReggieUI.error('请求失败：' + err)
          })
        },
        // CALLED → WAITING（退回等待，用于误叫号纠错）
        recallHandle: function(row) {
          var self = this
          ReggieUI.confirm('确认将 ' + (row.queueNo || '该记录') + ' 退回等待？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              var id = row.id || row.queueId
              if (id) { recallQueue(id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('已退回等待'); self.loadStats(); self.loadTable() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(function(err) { ReggieUI.error('请求失败：' + err) }) }
            })
        },
        // CANCELLED → WAITING（恢复排队，用于误取消纠错）
        reactivateHandle: function(id) {
          var self = this
          ReggieUI.confirm('确认恢复该排队记录？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              reactivateQueue(id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('已恢复排队'); self.loadStats(); self.loadTable() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(function(err) { ReggieUI.error('请求失败：' + err) })
            })
        },
        // 取消排队
        cancelHandle: function(id) {
          var self = this
          ReggieUI.confirm('确认取消该排队记录？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              queueCancel(id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('已取消！'); self.loadStats(); self.loadTable() }
                else { ReggieUI.error(res.msg || '操作失败') }
              }).catch(function(err) { ReggieUI.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
