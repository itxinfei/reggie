<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排队管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/components-stats-card.css" />
</head>
<body>
  <div class="dashboard-container" id="queue-app">
    <div class="container">
      <!-- 数据统计卡片 -->
      <stat-cards
        :cards="statsCards"
        :active-key.sync="activeFilter"
        @card-click="onCardClick"
      ></stat-cards>

      <!-- 搜索 + 操作栏 -->
      <table-bar
        ref="tableBar"
        :search-items="searchConfig"
        :actions="actionConfig"
        @search="onSearch"
        @reset="onReset"
        @action="onAction"
      ></table-bar>

      <!-- 数据表格 -->
      <crud-table
        ref="crudTable"
        :data="tableData"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :show-index="true"
        :show-actions="true"
        :actions-width="200"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="row.status === 'WAITING' ? 'warning' : row.status === 'CALLED' ? 'primary' : row.status === 'SEATED' ? 'success' : 'info'" size="small">
            {{ row.status === 'WAITING' ? '等待中' : row.status === 'CALLED' ? '已叫号' : row.status === 'SEATED' ? '已入座' : '已取消' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="callHandle(row.id)" v-if="row.status === 'WAITING'">叫号</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row.id)" v-if="row.status !== 'SEATED' && row.status !== 'CANCELLED'">取消</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 取号弹窗 -->
    <crud-dialog
      title="取号"
      :visible.sync="dialog.visible"
      width="420px"
      submit-text="确 定"
      @submit="submitTake"
      @close="dialog.visible = false"
    >
      <el-form ref="form" :model="form" label-width="100px">
        <el-form-item label="手机号：">
          <el-input v-model="form.phone" placeholder="请输入手机号" maxlength="11" />
        </el-form-item>
        <el-form-item label="就餐人数：">
          <el-input v-model="form.seatCount" type="number" placeholder="请输入就餐人数" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#queue-app',
      data() {
        return {
          loading: false,
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          // 统计数据
          stats: { totalQueues: 0, waitingCount: 0, calledCount: 0, seatedCount: 0, cancelledCount: 0 },
          activeFilter: '',
          // 搜索配置
          searchConfig: [
            { type: 'input', field: 'phone', placeholder: '请输入手机号', width: '200px' },
            { type: 'select', field: 'status', placeholder: '请选择状态', width: '150px',
              options: [
                { label: '等待中', value: 'WAITING' },
                { label: '已叫号', value: 'CALLED' },
                { label: '已入座', value: 'SEATED' },
                { label: '已取消', value: 'CANCELLED' }
              ] }
          ],
          // 操作按钮配置
          actionConfig: [
            { key: 'take', text: '+ 取号', type: 'primary' }
          ],
          // 表格列配置
          columns: [
            { prop: 'queueNo', label: '排队号' },
            { prop: 'phone', label: '手机号' },
            { prop: 'seatCount', label: '就餐人数', width: 90 },
            { prop: 'status', label: '状态', slot: true, width: 100 },
            { prop: 'createdTime', label: '取号时间' }
          ],
          // 取号弹窗
          dialog: { visible: false },
          form: { phone: '', seatCount: '' },
          lastSearch: {}
        }
      },
      created() {
        this.init()
      },
      computed: {
        statsCards: function() {
          var self = this
          return [
            { key: '', icon: '📋', label: '排队总数', value: self.stats.totalQueues, color: 'primary', clickable: true, active: self.activeFilter === '' },
            { key: 'CALLED', icon: '🔔', label: '已叫号', value: self.stats.calledCount, color: 'info', clickable: true, active: self.activeFilter === 'CALLED' },
            { key: 'SEATED', icon: '✅', label: '已入座', value: self.stats.seatedCount, color: 'success', clickable: true, active: self.activeFilter === 'SEATED' },
            { key: 'CANCELLED', icon: '❌', label: '已取消', value: self.stats.cancelledCount, color: 'danger', clickable: true, active: self.activeFilter === 'CANCELLED' }
          ]
        }
      },
      methods: {
        async init() {
          this.loading = true
          var ls = this.lastSearch || {}
          var params = {
            page: this.page,
            pageSize: this.pageSize,
            phone: ls.phone || undefined,
            status: ls.status || undefined
          }
          var results = await Promise.all([queuePage(params), this.loadQueueStats()])
          var queueRes = results[0]
          var statsRes = results[1]
          if (String(queueRes.code) === '1') {
            this.tableData = queueRes.data.records || []
            this.counts = queueRes.data.total
          } else {
            this.$message.error(queueRes.msg || '操作失败')
          }
          if (statsRes && String(statsRes.code) === '1') {
            this.stats = statsRes.data || this.stats
          }
          this.loading = false
        },
        async loadQueueStats() {
          try {
            var res = await queuePage({ page: 1, pageSize: 1000 })
            if (String(res.code) === '1') {
              var records = res.data.records || []
              return { code: 1, data: {
                totalQueues: res.data.total || 0,
                waitingCount: records.filter(function(r) { return r.status === 'WAITING' }).length,
                calledCount: records.filter(function(r) { return r.status === 'CALLED' }).length,
                seatedCount: records.filter(function(r) { return r.status === 'SEATED' }).length,
                cancelledCount: records.filter(function(r) { return r.status === 'CANCELLED' }).length
              }}
            }
          } catch (err) { console.warn('加载排队统计失败:', err) }
          return { code: 0 }
        },
        // 修改点：stat-cards 点击（payload.activeKey 为 .sync 更新后的值）
        onCardClick: function(payload) {
          this.activeFilter = payload.activeKey
          this.lastSearch = this.activeFilter ? { status: this.activeFilter } : {}
          this.page = 1
          this.init()
        },
        onSearch(searchParams) {
          this.activeFilter = ''
          this.lastSearch = searchParams
          this.page = 1
          this.init()
        },
        onReset() {
          this.activeFilter = ''
          this.lastSearch = {}
          this.page = 1
          this.init()
        },
        onAction(payload) {
          if (payload.key === 'take') {
            this.form.phone = ''
            this.form.seatCount = ''
            this.dialog.visible = true
          }
        },
        onPageChange(payload) {
          this.page = payload.page
          this.init()
        },
        onSizeChange(payload) {
          this.pageSize = payload.pageSize
          this.init()
        },
        submitTake() {
          if (!this.form.phone) { this.$message.error('请输入手机号'); return }
          if (!this.form.seatCount) { this.$message.error('请输入就餐人数'); return }
          var self = this
          queueTake({ phone: this.form.phone, seatCount: this.form.seatCount }).then(res => {
            if (res.code === 1) {
              self.$message.success('取号成功！排队号：' + (res.data ? res.data.queueNo : ''))
              self.dialog.visible = false
              self.init()
            } else {
              self.$message.error(res.msg || '操作失败')
            }
          }).catch(err => { self.$message.error('请求失败：' + err) })
        },
        callHandle(id) {
          var self = this
          this.$confirm('确认叫号该排队记录?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              queueCall({ id: id }).then(res => {
                if (res.code === 1) { self.$message.success('叫号成功！'); self.init() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(err => { self.$message.error('请求失败：' + err) })
            })
        },
        cancelHandle(id) {
          var self = this
          this.$confirm('确认取消该排队?', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
            .then(function() {
              queueCancel(id).then(res => {
                if (res.code === 1) { self.$message.success('已取消！'); self.init() }
                else { self.$message.error(res.msg || '操作失败') }
              }).catch(err => { self.$message.error('请求失败：' + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
