<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>閹烘帡妲﹂崣顐㈠娇 - 閻熺偛鎮忔径鏍у礌缁狅紕鎮婄粩?/title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <style>
    .queue-container { max-width: 1400px; margin: 0 auto; padding: 0 var(--space-5) }

    /* 缁涙盯鈧鐖?*/
    .filter-bar { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap }
    .filter-bar__label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .filter-bar__col { display: flex; flex-direction: column; gap: 4px }
    .filter-bar__input { height: 36px }
    .filter-bar__btn { height: 36px; font-size: var(--font-size-base) }

    /* 缂佺喕顓搁崡锛勫鐞?*/
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-4); margin-bottom: var(--space-6) }
    @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(3, 1fr) } }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 520px) { .stats-grid { grid-template-columns: 1fr } }
    .stat-card { padding: var(--space-4); background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: var(--space-4); transition: box-shadow var(--transition-base) }
    .stat-card:hover { box-shadow: var(--shadow-md);
    .stat-card__icon { font-size: var(--font-size-3xl); line-height: 1 }
    .stat-card__body { flex: 1 }
    .stat-card__label { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 4px }
    .stat-card__value { font-size: var(--font-size-3xl); font-weight: 600; color: var(--text-primary); line-height: 1.2 }
    .stat-card__sub { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 2px }
    .stat-card.danger .stat-card__value { color: var(--color-danger) }
    .stat-card.warning .stat-card__value { color: var(--color-warning) }
    .stat-card.success .stat-card__value { color: var(--color-success) }
    .stat-card.info .stat-card__value { color: var(--text-muted) }
    .stat-card.brand .stat-card__value { color: var(--color-brand-500) }

    /* 閸欘偄褰块幙宥勭稊閺?*/
    .call-bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; padding: var(--space-3) var(--space-4); background: var(--el-bg-ghost); border-radius: var(--radius-md) }
    .call-bar__seat { display: flex; align-items: center; gap: var(--space-2) }
    .call-bar__seat-label { font-size: var(--font-size-base); color: var(--text-primary); font-weight: 500; white-space: nowrap }
    .call-bar__tip { font-size: var(--font-size-xs); color: var(--text-muted) }
    .call-bar__reset { font-size: var(--font-size-xs) }

    /* 閸欐牕褰垮鍦崶 */
    .take-dialog__form { margin-top: var(--space-2) }

    /* 閸忋儱楠囧鍦崶 */
    .seat-detail { padding: var(--space-3); background: var(--el-bg-ghost); border-radius: var(--radius-sm); margin-bottom: var(--space-3) }
    .seat-detail__row { display: flex; justify-content: space-between; padding: var(--space-1) 0; font-size: var(--font-size-base) }
    .seat-detail__label { color: var(--text-muted) }
    .seat-detail__value { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums }

    /* 缁岀儤鈧?*/
    .empty-state { text-align: center; padding: var(--space-15) var(--space-4); color: var(--text-muted); font-size: var(--font-size-base) }
    .empty-state__icon { font-size: var(--font-size-4xl); line-height: 1; margin-bottom: var(--space-4) }
    .empty-state__desc { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: var(--space-2) }

    /* 閻樿埖鈧焦鐖ｇ粵?*/
    .status-tag { font-weight: 500 }

    /* 閸濆秴绨插蹇曠摣闁鐖?*/
    @media (max-width: 768px) {
      .filter-bar { flex-direction: column; align-items: stretch }
      .filter-bar__col { flex: 1 }
      .filter-bar__input { width: 100% }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">鐠哄疇娴嗛崚棰佸瘜閸愬懎顔?/a>
  <div class="dashboard-container" id="queue-app">
    <div class="container queue-container" id="main-content" role="main" aria-label="閹烘帡妲﹂崣顐㈠娇閻婢?>
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">閹烘帡妲﹂崣顐㈠娇</h1>
          <p class="ds-page-header__subtitle">閸倿顥ら幒鎺楁Е閸欐牕褰块妴浣稿建閸欐灚鈧礁鍙嗘惔褍鍙忓ù浣衡柤缁狅紕鎮?/p>
        </div>
      </header>

      <!-- 缁涙盯鈧鐖?-->
      <div class="filter-bar">
        <div class="filter-bar__col">
          <span class="filter-bar__label">閹靛婧€閸欏嚖绱?/span>
          <el-input v-model="searchPhone" class="filter-bar__input" style="width:200px" clearable placeholder="鐠囩柉绶崗銉﹀閺堝搫褰? aria-label="閹靛婧€閸? @keyup.enter.native="onSearch"></el-input>
        </div>
        <div class="filter-bar__col">
          <span class="filter-bar__label">閻樿埖鈧緤绱?/span>
          <el-select v-model="searchStatus" class="filter-bar__input" style="width:150px" clearable aria-label="閻樿埖鈧? placeholder="閸忋劑鍎撮悩鑸碘偓?>
            <el-option value="WAITING" label="缁涘绶熸稉?></el-option>
            <el-option value="CALLED" label="瀹告彃褰ㄩ崣?></el-option>
            <el-option value="SEATED" label="瀹告彃鍙嗘惔?></el-option>
            <el-option value="CANCELLED" label="瀹告彃褰囧☉?></el-option>
          </el-select>
        </div>
        <el-button type="primary" size="small" @click="onSearch" class="filter-bar__btn">閺屻儴顕?/el-button>
        <el-button size="small" @click="onReset">闁插秶鐤?/el-button>
      </div>

      <!-- 缂佺喕顓搁崡锛勫 -->
      <div class="stats-grid" v-loading="statsLoading">
        <div class="stat-card brand">
          <div class="stat-card__icon">棣冩惖</div>
          <div class="stat-card__body">
            <div class="stat-card__label">閹烘帡妲﹂幀缁樻殶</div>
            <div class="stat-card__value">{{ stats.totalQueues || 0 }}</div>
            <div class="stat-card__sub">娴犲﹥妫╃槐顖濐吀</div>
          </div>
        </div>
        <div class="stat-card warning">
          <div class="stat-card__icon">閳?/div>
          <div class="stat-card__body">
            <div class="stat-card__label">缁涘绶熸稉?/div>
            <div class="stat-card__value">{{ stats.waitingCount || 0 }}</div>
            <div class="stat-card__sub">鐏忔碍婀崣顐㈠娇</div>
          </div>
        </div>
        <div class="stat-card danger">
          <div class="stat-card__icon">棣冩晜</div>
          <div class="stat-card__body">
            <div class="stat-card__label">瀹告彃褰ㄩ崣?/div>
            <div class="stat-card__value">{{ stats.calledCount || 0 }}</div>
            <div class="stat-card__sub">瀵板懎鐣ㄩ幒鎺戝弳鎼?/div>
          </div>
        </div>
        <div class="stat-card success">
          <div class="stat-card__icon">閴?/div>
          <div class="stat-card__body">
            <div class="stat-card__label">瀹告彃鍙嗘惔?/div>
            <div class="stat-card__value">{{ stats.seatedCount || 0 }}</div>
            <div class="stat-card__sub">鐎瑰本鍨氱亸鍗為獓</div>
          </div>
        </div>
        <div class="stat-card info">
          <div class="stat-card__icon">閴€?/div>
          <div class="stat-card__body">
            <div class="stat-card__label">瀹告彃褰囧☉?/div>
            <div class="stat-card__value">{{ stats.cancelledCount || 0 }}</div>
            <div class="stat-card__sub">娑撹濮?鐡掑懏妞傞崣鏍ㄧХ</div>
          </div>
        </div>
      </div>

      <!-- 閸欘偄褰块幙宥勭稊閺?-->
      <div class="call-bar" v-if="stats.waitingCount > 0">
        <el-button
          type="primary"
          size="small"
          :loading="callLoading"
          :disabled="callLoading"
          @click="callNext"
        >閸欘偂绗呮稉鈧担?/el-button>
        <div class="call-bar__seat">
          <span class="call-bar__seat-label">閹稿楠囨担宥嗘殶閿?/span>
          <el-select v-model="callSeatCount" style="width:130px" clearable aria-label="閹稿楠囨担宥嗘殶缁涙盯鈧? size="small" placeholder="娑撳秹妾烘禍鐑樻殶">
            <el-option :value="2" label="2娴?></el-option>
            <el-option :value="4" label="4娴?></el-option>
            <el-option :value="6" label="6娴?></el-option>
            <el-option :value="8" label="8娴?></el-option>
            <el-option :value="10" label="10娴?></el-option>
            <el-option :value="12" label="12娴?></el-option>
          </el-select>
        </div>
        <el-button type="text" size="small" @click="showTakeDialog" aria-label="閺傛澘顤冮崣鏍у娇">+ 閸欐牕褰?/el-button>
        <el-button type="text" size="small" class="call-bar__reset" @click="callSeatCount = null">闁插秶鐤嗙粵娑⑩偓?/el-button>
        <span class="call-bar__tip" v-if="callSeatCount">閹?{{ callSeatCount }} 娴滅儤顢戠粵娑⑩偓澶夌瑓娑撯偓娴?/span>
        <span class="call-bar__tip" v-else>閸涚厧褰ㄧ粵澶婄窡闂冪喎鍨稉顓犳畱娑撳绔存担宥夈€愮€?/span>
      </div>

      <!-- 閺佺増宓佺悰銊︾壐 -->
      <crud-table
        ref="crudTable"
        empty-hint="閺嗗倹妫ら幒鎺楁Е鐠佹澘缍?
        :data="tableData"
        :columns="columns"
        :loading="tableLoading"
        :page="page"
        :page-size="pageSize"
        :page-sizes="[10,20,30,40]"
        :total="counts"
        :show-index="true"
        :show-actions="true"
        :actions-width="160"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="statusTagType(row.status)" size="small" class="status-tag">
            {{ statusLabel(row.status) }}
          </el-tag>
        </template>
        <template #col-phone="{ row }">
          <span v-if="row.phone">{{ row.phone.substring(0,3) }}****{{ row.phone.substring(7) }}</span>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" @click="seatHandle(row)" v-if="row.status === 'CALLED'" style="color:var(--color-brand-500)" :aria-label="'鐎瑰甯撻崗銉ラ獓 ' + (row.queueNo || '閹烘帡妲︾拋鏉跨秿')">閸忋儱楠?/el-button>
          <el-button type="text" size="small" @click="recallHandle(row)" v-if="row.status === 'CALLED'" :aria-label="'闁偓閸ョ偟鐡戝?' + (row.queueNo || '')">闁偓閸?/el-button>
          <el-button type="text" size="small" class="btn-delete" @click="cancelHandle(row.id)" v-if="row.status === 'WAITING' || row.status === 'CALLED'" :aria-label="'閸欐牗绉烽幒鎺楁Е ' + (row.queueNo || '')">閸欐牗绉?/el-button>
          <el-button type="text" size="small" @click="reactivateHandle(row.id)" v-if="row.status === 'CANCELLED'" :aria-label="'閹垹顦查幒鎺楁Е ' + (row.queueNo || '')" style="color:var(--color-warning)">閹垹顦?/el-button>
        </template>
      </crud-table>

      <div v-if="counts === 0 && !tableLoading && tableData.length === 0" class="empty-state">
        <div class="empty-state__icon">棣冩惖</div>
        <div>閺嗗倹妫ら幒鎺楁Е鐠佹澘缍?/div>
        <div class="empty-state__desc">閻愮懓鍤稉濠冩煙"閸欐牕褰?娑撴椽銆愮€广垹鍨卞鐑樺笓闂冪喕顔囪ぐ?/div>
      </div>
    </div>

    <!-- 閸欐牕褰垮鍦崶 -->
    <crud-dialog
      title="閸欐牕褰?
      :visible.sync="takeForm.dialogVisible"
      :submit-loading="takeLoading"
      width="420px"
      submit-text="绾?鐎?
      aria-label="閸欐牕褰跨悰銊ュ礋"
      @submit="submitTake"
      @close="handleTakeClose"
    >
      <el-form ref="takeFormRef" :model="takeForm" :rules="takeRules" label-width="80px" class="take-dialog__form">
        <el-form-item label="閹靛婧€閸? prop="phone">
          <el-input v-model="takeForm.phone" placeholder="鐠囩柉绶崗銉┿€愮€广垺澧滈張鍝勫娇" maxlength="11" size="small"></el-input>
        </el-form-item>
        <el-form-item label="鐏忛亶顦垫禍鐑樻殶" prop="seatCount">
          <el-input-number v-model="takeForm.seatCount" :min="1" :max="20" size="small" style="width:180px"></el-input-number>
          <span style="margin-left:8px; font-size: var(--font-size-xs); color:var(--text-muted)">娴?/span>
        </el-form-item>
      </el-form>
    </crud-dialog>

    <!-- 閸忋儱楠囧鍦崶 -->
    <crud-dialog
      title="鐎瑰甯撻崗銉ラ獓"
      :visible.sync="seatForm.dialogVisible"
      :submit-loading="seatLoading"
      width="560px"
      submit-text="绾?鐠?閸?鎼?
      aria-label="鐎瑰甯撻崗銉ラ獓鐞涖劌宕?
      @submit="submitSeat"
      @close="handleSeatClose"
    >
      <div class="seat-detail">
        <div class="seat-detail__row">
          <span class="seat-detail__label">閹烘帡妲﹂崣?/span>
          <span class="seat-detail__value">{{ seatForm.queueNo }}</span>
        </div>
        <div class="seat-detail__row">
          <span class="seat-detail__label">閹靛婧€閸?/span>
          <span class="seat-detail__value">{{ seatForm.phoneDisplay }}</span>
        </div>
        <div class="seat-detail__row">
          <span class="seat-detail__label">鐏忛亶顦垫禍鐑樻殶</span>
          <span class="seat-detail__value">{{ seatForm.seatCount }} 娴?/span>
        </div>
        <div class="seat-detail__row">
          <span class="seat-detail__label">閸欐牕褰块弮鍫曟？</span>
          <span class="seat-detail__value">{{ seatForm.createdTimeDisplay }}</span>
        </div>
      </div>
      <el-form :model="seatForm" label-width="80px">
        <el-form-item label="閸忓疇浠堝灞藉酱">
          <el-select v-model="seatForm.tableId" style="width:240px" clearable placeholder="闁瀚ㄥ灞藉酱閿涘牆褰查柅澶涚礆" size="small">
            <el-option
              v-for="t in tableOptions"
              :key="t.value"
              :label="t.label"
              :value="t.value"
              :disabled="t.disabled"
            ></el-option>
          </el-select>
          <span style="margin-left:8px; font-size: var(--font-size-xs); color:var(--text-muted)">閺堫亪鈧鍨稉宥呭彠閼辨梹顢戦崣?/span>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../api/dining.js"></script>
  <script>
    new Vue({
      el: '#queue-app',
      data: function() {
        return {
          // 缁涙盯鈧?          searchPhone: '',
          searchStatus: '',
          // 缂佺喕顓?          statsLoading: false,
          stats: { totalQueues: 0, waitingCount: 0, calledCount: 0, seatedCount: 0, cancelledCount: 0 },
          // 鐞涖劍鐗?          tableLoading: false,
          page: 1,
          pageSize: 10,
          counts: 0,
          tableData: [],
          columns: [
            { prop: 'queueNo', label: '閹烘帡妲﹂崣?, width: 90, align: 'center' },
            { prop: 'phone', label: '閹靛婧€閸?, slot: true, width: 130, align: 'center' },
            { prop: 'seatCount', label: '娴滅儤鏆?, width: 70, align: 'center', type: 'number' },
            { prop: 'status', label: '閻樿埖鈧?, slot: true, width: 90, align: 'center' },
            { prop: 'createdTime', label: '閸欐牕褰块弮鍫曟？', width: 160, align: 'center' }
          ],
          // 閸欘偄褰?          callLoading: false,
          callSeatCount: null,
          // 閸欐牕褰垮鍦崶
          takeLoading: false,
          takeForm: { dialogVisible: false, phone: '', seatCount: 2 },
          takeRules: {
            phone: [
              { required: true, message: '鐠囩柉绶崗銉﹀閺堝搫褰?, trigger: 'blur' },
              { pattern: /^1[3-9]\d{9}$/, message: '閹靛婧€閸欓攱鐗稿蹇庣瑝濮濓絿鈥?, trigger: 'blur' }
            ],
            seatCount: [{ required: true, message: '鐠囩柉绶崗銉ユ皑妞佹劒姹夐弫?, trigger: 'blur' }]
          },
          // 閸忋儱楠囧鍦崶
          seatLoading: false,
          seatForm: {
            dialogVisible: false,
            queueId: null,
            queueNo: '',
            phoneDisplay: '',
            seatCount: 0,
            createdTimeDisplay: '',
            tableId: null
          },
          tableOptions: []
        }
      },
      created: function() {
        this.loadStats()
        this.loadTable()
        this.loadTableOptions()
      },
      methods: {
        // 閻樿埖鈧焦鐖ｇ粵鐐Ё鐏?        statusTagType: function(status) {
          if (status === 'WAITING') return 'warning'
          if (status === 'CALLED') return 'danger'
          if (status === 'SEATED') return 'success'
          return 'info'
        },
        statusLabel: function(status) {
          var map = { WAITING: '缁涘绶熸稉?, CALLED: '瀹告彃褰ㄩ崣?, SEATED: '瀹告彃鍙嗘惔?, CANCELLED: '瀹告彃褰囧☉? }
          return map[status] || '閺堫亞鐓?
        },
        // 閸旂姾娴囩紒鐔活吀
        loadStats: function() {
          const self = this
          self.statsLoading = true
          queueStats().then(function(res) {
            self.statsLoading = false
            if (res.code === 1 && res.data) {
              self.stats = res.data
            }
          }).catch(function(err) {
            self.statsLoading = false
            console.warn('閸旂姾娴囬幒鎺楁Е缂佺喕顓告径杈Е:', err)
          })
        },
        // 閸旂姾娴囩悰銊︾壐
        loadTable: function() {
          const self = this
          self.tableLoading = true
          var params = {
            page: self.page,
            pageSize: self.pageSize
          }
          if (self.searchPhone && self.searchPhone.trim()) { params.phone = self.searchPhone.trim() }
          if (self.searchStatus) { params.status = self.searchStatus }
          queuePage(params).then(function(res) {
            self.tableLoading = false
            if (res.code === 1) {
              self.tableData = res.data.records || []
              self.counts = res.data.total
            } else {
              ReggieUI.error(res.msg || '閸旂姾娴囨径杈Е')
            }
          }).catch(function(err) {
            self.tableLoading = false
            ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err)
          })
        },
        // 閸旂姾娴囧灞藉酱闁銆嶉敍鍫濆弳鎼囱冭剨缁愭鏁ら敍?        loadTableOptions: function() {
          const self = this
          tablePage({ page: 1, pageSize: 200 }).then(function(res) {
            if (res.code === 1 && res.data && res.data.records) {
              self.tableOptions = res.data.records.map(function(t) {
                return {
                  value: t.id,
                  label: (t.name || '濡楀苯褰?) + '閿? + (t.areaName || '閺堫亞鐓￠崠鍝勭厵') + '閿? + (t.seatCount || 0) + '鎼囱嶇礆',
                  disabled: t.status !== 'FREE'
                }
              })
            }
          }).catch(function() { /* 濡楀苯褰撮崝鐘烘祰婢惰精瑙︽稉宥呭閸濆秳瀵屽ù浣衡柤 */ })
        },
        // 缁涙盯鈧?        onSearch: function() {
          this.page = 1
          this.loadTable()
        },
        onReset: function() {
          this.searchPhone = ''
          this.searchStatus = ''
          this.page = 1
          this.loadTable()
        },
        onPageChange: function(payload) {
          this.page = payload.page
          this.loadTable()
        },
        onSizeChange: function(payload) {
          this.pageSize = (payload && payload.pageSize !== undefined) ? payload.pageSize : payload
          this.page = 1
          this.loadTable()
        },
        // 閸欘偂绗呮稉鈧担?        callNext: function() {
          const self = this
          if (self.callLoading) return
          self.callLoading = true
          var body = {}
          if (self.callSeatCount) { body.seatCount = self.callSeatCount }
          queueCall(body).then(function(res) {
            self.callLoading = false
            if (res.code === 1 && res.data) {
              ReggieUI.success('閸欘偄褰块幋鎰閿涗焦甯撻梼鐔峰娇閿? + res.data.queueNo)
              self.loadStats()
              self.loadTable()
            } else {
              ReggieUI.warning(res.msg || '濞屸剝婀佺粵澶婄窡娑擃厾娈戞い鎯ь吂')
            }
          }).catch(function(err) {
            self.callLoading = false
            ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err)
          })
        },
        // 閸楁洜瀚崣顐㈠娇閿涘牆鍑＄粔濠氭珟鐞涘本鎼锋担婊勫瘻闁筋噯绱濋崗銊ョ湰"閸欘偂绗呮稉鈧担?閹稿鎸抽弴澶稿敩閿?        // 閸欐牕褰垮鍦崶
        showTakeDialog: function() {
          this.takeForm.phone = ''
          this.takeForm.seatCount = 2
          this.takeForm.dialogVisible = true
        },
        handleTakeClose: function() {
          this.takeForm.dialogVisible = false
          this.$refs.takeFormRef && this.$refs.takeFormRef.resetFields()
        },
        submitTake: function() {
          if (this.takeLoading) return
          const self = this
          const passed = false
          self.$refs.takeFormRef.validate(function(valid) { passed = valid })
          if (!passed) return
          self.takeLoading = true
          queueTake({ phone: self.takeForm.phone, seatCount: self.takeForm.seatCount }).then(function(res) {
            self.takeLoading = false
            if (res.code === 1) {
              ReggieUI.success('閸欐牕褰块幋鎰閿涗焦甯撻梼鐔峰娇閿? + (res.data ? res.data.queueNo : ''))
              self.takeForm.dialogVisible = false
              self.loadStats()
              self.loadTable()
            } else {
              ReggieUI.error(res.msg || '閹垮秳缍旀径杈Е')
            }
          }).catch(function(err) {
            self.takeLoading = false
            ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err)
          })
        },
        // 閸忋儱楠囧鍦崶
        seatHandle: function(row) {
          this.seatForm.queueId = row.id
          this.seatForm.queueNo = row.queueNo || ''
          this.seatForm.phoneDisplay = row.phone ? (row.phone.substring(0,3) + '****' + row.phone.substring(7)) : ''
          this.seatForm.seatCount = row.seatCount || 0
          this.seatForm.createdTimeDisplay = row.createdTime || ''
          this.seatForm.tableId = null
          this.seatForm.dialogVisible = true
        },
        handleSeatClose: function() {
          this.seatForm.dialogVisible = false
        },
        submitSeat: function() {
          if (this.seatLoading) return
          const self = this
          self.seatLoading = true
          var data = { queueId: self.seatForm.queueId }
          if (self.seatForm.tableId) { data.tableId = self.seatForm.tableId }
          queueSeat(data).then(function(res) {
            self.seatLoading = false
            if (res.code === 1) {
              ReggieUI.success('鐎瑰甯撻崗銉ラ獓閹存劕濮涢敍?)
              self.seatForm.dialogVisible = false
              self.loadStats()
              self.loadTable()
            } else {
              ReggieUI.error(res.msg || '閹垮秳缍旀径杈Е')
            }
          }).catch(function(err) {
            self.seatLoading = false
            ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err)
          })
        },
        // CALLED 閳?WAITING閿涘牓鈧偓閸ョ偟鐡戝鍜冪礉閻劋绨拠顖氬建閸欓绫傞柨娆欑礆
        recallHandle: function(row) {
          const self = this
          ReggieUI.confirm('绾喛顓荤亸?' + (row.queueNo || '鐠囥儴顔囪ぐ?) + ' 闁偓閸ョ偟鐡戝鍜冪吹', '閹绘劗銇?, { confirmButtonText: '绾喖鐣?, cancelButtonText: '閸欐牗绉?, type: 'warning' })
            .then(function() {
              const id = row.id || row.queueId
              if (id) { recallQueue(id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('瀹告煡鈧偓閸ョ偟鐡戝?); self.loadStats(); self.loadTable() }
                else { ReggieUI.error(res.msg || '閹垮秳缍旀径杈Е') }
              }).catch(function(err) { ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err) }) }
            })
        },
        // CANCELLED 閳?WAITING閿涘牊浠径宥嗗笓闂冪噦绱濋悽銊ょ艾鐠囶垰褰囧☉鍫㈢眰闁挎瑱绱?        reactivateHandle: function(id) {
          const self = this
          ReggieUI.confirm('绾喛顓婚幁銏狀槻鐠囥儲甯撻梼鐔活唶瑜版洩绱?, '閹绘劗銇?, { confirmButtonText: '绾喖鐣?, cancelButtonText: '閸欐牗绉?, type: 'warning' })
            .then(function() {
              reactivateQueue(id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('瀹稿弶浠径宥嗗笓闂?); self.loadStats(); self.loadTable() }
                else { ReggieUI.error(res.msg || '閹垮秳缍旀径杈Е') }
              }).catch(function(err) { ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err) })
            })
        },
        // 閸欐牗绉烽幒鎺楁Е
        cancelHandle: function(id) {
          const self = this
          ReggieUI.confirm('绾喛顓婚崣鏍ㄧХ鐠囥儲甯撻梼鐔活唶瑜版洩绱?, '閹绘劗銇?, { confirmButtonText: '绾喖鐣?, cancelButtonText: '閸欐牗绉?, type: 'warning' })
            .then(function() {
              queueCancel(id).then(function(res) {
                if (res.code === 1) { ReggieUI.success('瀹告彃褰囧☉鍫磼'); self.loadStats(); self.loadTable() }
                else { ReggieUI.error(res.msg || '閹垮秳缍旀径杈Е') }
              }).catch(function(err) { ReggieUI.error('鐠囬攱鐪版径杈Е閿? + err) })
            })
        }
      }
    })
  </script>
</body>
</html>
