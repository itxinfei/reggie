<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政区划管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
</head>
<body>
  <div class="dashboard-container" id="region-app">
    <div class="container">
      <!-- 页头：标题 + 副标题（与全站 ds-page-header 规范一致） -->
      <header class="ds-page-header">
        <div class="ds-page-header__titles">
          <h1 class="ds-page-header__title" id="page-title">行政区划管理</h1>
          <p class="ds-page-header__subtitle">管理配送区域与范围</p>
        </div>
        <div class="ds-page-header__actions"></div>
      </header>
      <!-- 修改点：搜索栏使用 <table-bar> 统一组件 -->
      <table-bar
        :search-items="tableSearchItems"
        :actions="tableActions"
        @search="handleQuery"
        @reset="reset"
        @action="onTableAction">
        <template slot="search-extra">
          <el-select v-model="input.name" placeholder="选择地区名称" class="el-select--narrow-xs" clearable filterable size="small"
            :loading="optionsLoading" :no-data-text="optionsLoadError ? '加载失败，点击下拉框重试' : (optionsLoading ? '加载中...' : '暂无数据')" @change="handleQuery" >
            <el-option v-for="n in filterOptions.names" :key="n" :label="n" :value="n"></el-option>
          </el-select>
          <el-select v-model="input.level" placeholder="层级" clearable class="el-select--wide-xs" @change="handleQuery">
            <el-option label="全部" :value="null"></el-option>
            <el-option label="省份" :value="1"></el-option>
            <el-option label="城市" :value="2"></el-option>
            <el-option label="区/县" :value="3"></el-option>
          </el-select>
        </template>
      </table-bar>

      <!-- 修改点：数据表格改用 <crud-table> 统一组件，列通过 columns 配置 + 插槽自定义 -->
      <crud-table
        :data="tableData"
        :columns="columns"
        :page="page"
        :page-size="pageSize"
        :total="counts"
        :loading="loading"
        :show-actions="true"
        :actions-width="240"
        :page-sizes="[10, 20, 30, 50]"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-level="{ row }">
          <el-tag :type="row.level === 1 ? 'danger' : row.level === 2 ? 'warning' : 'success'" size="small">
            {{ row.level === 1 ? '省份' : row.level === 2 ? '城市' : '区/县' }}
          </el-tag>
        </template>
        <template #actions="{ row }">
          <el-button type="text" size="small" class="btn-view" @click="editHandle(row)">修改</el-button>
          <el-button type="text" size="small" class="btn-delete" @click="deleteHandle(row.id)">删除</el-button>
        </template>
      </crud-table>
    </div>

    <!-- 修改点：新增/编辑弹窗改用 <crud-dialog> 统一组件（内置关闭/重置逻辑，底部按钮统一 medium） -->
    <crud-dialog
      :title="formData.title"
      :visible.sync="formData.dialogVisible"
      width="600px"
      :submit-loading="submitLoading"
      @submit="submitForm"
    >
      <!-- 修改点：移除误导性死 class demo-form-inline（label-width 80 合适，保持不变） -->
      <!-- 修改点：补全 ref/:model/:rules，启用 Element 校验（原仅手写 if 判断，属"假必填"不校验） -->
      <el-form ref="regionForm" :model="formData" :rules="regionRules" label-width="80px" size="small">
        <el-form-item label="地区名称：" prop="name">
          <el-input v-model="formData.name" placeholder="请输入地区名称" maxlength="50" />
        </el-form-item>
        <el-form-item label="区划代码：">
          <el-input v-model="formData.code" placeholder="请输入区划代码，如110000" maxlength="20" />
        </el-form-item>
        <el-form-item label="层级：">
          <el-select v-model="formData.level" placeholder="请选择层级" style="width: 100%">
            <el-option label="省份(1级)" :value="1"></el-option>
            <el-option label="城市(2级)" :value="2"></el-option>
            <el-option label="区/县(3级)" :value="3"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="上级地区：" v-if="formData.level !== 1">
          <el-select v-model="formData.parentId" placeholder="请选择上级地区" style="width: 100%" filterable>
            <el-option v-for="p in parentOptions" :key="p.id" :label="p.name" :value="p.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="排序：">
          <el-input-number v-model="formData.sort" :min="0" :max="9999" placeholder="排序值" style="width: 100%" />
        </el-form-item>
      </el-form>
    </crud-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/accessibility-utils.js"></script>
  <script src="../../js/performance-utils.js"></script>
  <script src="../../api/region.js"></script>
  <script src="../../js/components.js"></script>
<script>
    new Vue({
      el: '#region-app',
      // 修改点：引入列表页通用 Mixin，自动获得 page/pageSize/counts/loading 与翻页处理
      mixins: [window.ReggieListMixin],
      data() {
        return {
          input: { name: '', level: null },
          // 修改点：搜索下拉框动态选项（从数据库加载地区名称）
          filterOptions: { names: [] },
          // 修改点：<table-bar> 统一组件配置
          tableSearchItems: [],
          tableActions: [
            { key: 'add', text: '+ 新增地区', type: 'primary' }
          ],
          optionsLoading: false,
          optionsLoadError: false,
          tableData: [],
          parentOptions: [],
          // 修改点：分页相关字段已改由 ReggieListMixin 提供，此处仅保留业务状态
          submitLoading: false,
          formData: {
            title: '', id: undefined, name: '', code: '', level: 1,
            parentId: null, sort: 0, dialogVisible: false
          },
          // 修改点：地区表单校验规则（配合 el-form :rules + validate()）
          regionRules: {
            name: [{ required: true, whitespace: true, message: '请输入地区名称', trigger: 'blur' }]
          },
          // 修改点：列配置（交给 <crud-table>，避免手写 <el-table-column> 重复）
          columns: [
            { prop: 'id', label: 'ID', width: 60, align: 'center' },
            { prop: 'name', label: '地区名称', width: 120 },
            { prop: 'code', label: '区划代码', width: 100, align: 'center' },
            { prop: 'level', label: '层级', width: 70, align: 'center', slot: true },
            { prop: 'parentId', label: '父级ID', width: 70, align: 'center' },
            { prop: 'sort', label: '排序', width: 60, align: 'center' }
          ]
        }
      },
      created() {
        this.loadFilterOptions()
        this.fetchData()
      },
      watch: {
        'formData.level': function(newVal) {
          // 省份级不需要上级
          if (newVal === 1) {
            this.formData.parentId = null
          } else {
            this.loadParentOptions(newVal)
          }
        }
      },
      methods: {
        // 修改点：<table-bar> 组件统一操作分发
        onTableAction: function(payload) {
          if (payload.key === 'add') { this.addHandle(); }
        },
        // 修改点：通用优化方案 — 加载筛选下拉框选项，区分"空数据"与"加载失败"
        async loadFilterOptions() {
          this.optionsLoading = true
          this.optionsLoadError = false
          try {
            const res = await regionOptions()
            if (String(res.code) === '1' && res.data) {
              this.filterOptions.names = res.data.names || []
            } else {
              this.optionsLoadError = true
              ReggieUI.warning('加载地区选项失败：' + (res.msg || '接口返回异常'))
            }
          } catch (err) {
            // 修改点：NOTLOGIN 错误已在全局拦截器处理（跳转登录页），无需重复提示
            if (err.message === 'NOTLOGIN') {
              return
            }
            this.optionsLoadError = true
            console.error('加载地区选项失败:', err)
            ReggieUI.error('加载筛选选项失败，请刷新页面重试')
          } finally {
            this.optionsLoading = false
          }
        },
        // 下拉框打开时若之前加载失败，自动重试
        onFilterDropdownVisible(visible) {
            if (visible && this.optionsLoadError) {
                this.loadFilterOptions()
            }
        },
        // 修改点：原 init() 重命名为 fetchData()，由 ReggieListMixin 的翻页/改大小自动调用
        async fetchData() {
          this.loading = true
          const params = { page: this.page, pageSize: this.pageSize, name: this.input.name || undefined, level: this.input.level }
          const res = await regionPage(params)
          this.loading = false
          if (res.code === 1) {
            this.tableData = res.data.records || []
            this.counts = res.data.total || 0
          }
        },
        handleQuery() {
          this.page = 1
          this.fetchData()
        },
        // 重置搜索条件，恢复表格初始状态
        reset() {
          this.input.name = ''
          this.input.level = null
          this.page = 1
          this.fetchData()
        },

        // 加载可选的上级地区
        async loadParentOptions(level) {
          // 2级城市需要选省份，3级区县需要选城市
          const parentLevel = level - 1
          // 修改点：改为调用后端 /region/by-level 聚合接口（按层级返回全部），不再用 pageSize:1000 拉全量导致截断
          const res = await regionByLevel(parentLevel)
          if (res.code === 1) {
            this.parentOptions = res.data || []
          }
        },

        addHandle() {
          this.formData = {
            title: '新增地区', id: undefined, name: '', code: '', level: 1,
            parentId: null, sort: 0, dialogVisible: true
          }
          this.parentOptions = []
        },

        editHandle(row) {
          this.formData = {
            title: '修改地区', id: row.id, name: row.name, code: row.code || '',
            level: row.level, parentId: row.parentId, sort: row.sort || 0,
            dialogVisible: true
          }
          if (row.level !== 1) {
            this.loadParentOptions(row.level)
          }
        },

        async submitForm() {
          const self = this
          let passed = false
          self.$refs.regionForm.validate(function(valid) { passed = valid })
          if (!passed) {
            ReggieUI.warning('请完善表单必填项')
            return
          }
          const data = {
            id: self.formData.id,
            name: self.formData.name.trim(),
            code: self.formData.code || null,
            level: self.formData.level,
            parentId: self.formData.level === 1 ? 0 : self.formData.parentId,
            sort: self.formData.sort
          }
          self.submitLoading = true
          let res
          try {
            if (self.formData.id) {
              res = await editRegion(data)
            } else {
              res = await addRegion(data)
            }
            if (res.code === 1) {
              ReggieUI.success(self.formData.id ? '修改成功' : '新增成功')
              self.formData.dialogVisible = false
              self.fetchData()
            } else {
              ReggieUI.error(res.msg || '操作失败')
            }
          } finally {
            self.submitLoading = false
          }
        },

        deleteHandle(id) {
          ReggieUI.confirm('确认删除该地区吗？如有子级则无法删除。', '提示', { type: 'warning' }).then(async () => {
            const res = await deleteRegion(id)
            if (res.code === 1) {
              ReggieUI.success('删除成功')
              this.fetchData()
            } else {
              ReggieUI.error(res.msg || '删除失败')
            }
          }).catch(() => {})
        }
      }
    })
  </script>
</body>
</html>
