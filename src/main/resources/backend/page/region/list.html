<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政区划管理 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
  <div class="dashboard-container" id="region-app">
    <div class="container">
      <!-- 搜索栏 -->
      <div class="tableBar">
        <el-input v-model="input.name" placeholder="地区名称" style="width: 180px" clearable @keyup.enter.native="handleQuery">
          <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
        </el-input>
        <el-select v-model="input.level" placeholder="层级" clearable style="width: 120px; margin-left: 10px" @change="handleQuery">
          <el-option label="全部" :value="null"></el-option>
          <el-option label="省份" :value="1"></el-option>
          <el-option label="城市" :value="2"></el-option>
          <el-option label="区/县" :value="3"></el-option>
        </el-select>
        <el-button type="primary" style="margin-left: 10px" @click="handleQuery">查询</el-button>
        <el-button type="primary" @click="addHandle">+ 新增地区</el-button>
      </div>

      <!-- 数据表格 -->
      <el-table v-loading="loading" :data="tableData" stripe border class="tableBox">
        <el-table-column prop="id" label="ID" width="80" />
        <el-table-column prop="name" label="地区名称" />
        <el-table-column prop="code" label="区划代码" width="120" />
        <el-table-column label="层级" width="80" align="center">
          <template slot-scope="scope">
            <el-tag :type="scope.row.level === 1 ? 'danger' : scope.row.level === 2 ? 'warning' : 'success'" size="small">
              {{ scope.row.level === 1 ? '省份' : scope.row.level === 2 ? '城市' : '区/县' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="parentId" label="父级ID" width="80" />
        <el-table-column prop="sort" label="排序" width="70" />
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button type="text" size="small" class="blueBug" @click="editHandle(scope.row)">修改</el-button>
            <el-button type="text" size="small" class="delBut non" @click="deleteHandle(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- 分页 -->
      <el-pagination class="pageList" :page-sizes="[10,20,30,50]" :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper" :total="counts"
        :current-page.sync="page" @size-change="handleSizeChange" @current-change="handleCurrentChange">
      </el-pagination>
    </div>

    <!-- 新增/编辑弹窗 -->
    <el-dialog :title="formData.title" :visible.sync="formData.dialogVisible" width="40%" :before-close="handleClose">
      <el-form class="demo-form-inline" label-width="100px">
        <el-form-item label="地区名称：">
          <el-input v-model="formData.name" placeholder="请输入地区名称" maxlength="50" />
        </el-form-item>
        <el-form-item label="区划代码：">
          <el-input v-model="formData.code" placeholder="请输入区划代码，如110000" maxlength="20" />
        </el-form-item>
        <el-form-item label="层级：">
          <el-select v-model="formData.level" placeholder="请选择层级" style="width: 100%">
            <el-option label="省份(1级)" :value="1"></el-option>
            <el-option label="城市(2级)" :value="2"></el-option>
            <el-option label="区/县(3级)" :value="3"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="上级地区：" v-if="formData.level !== 1">
          <el-select v-model="formData.parentId" placeholder="请选择上级地区" style="width: 100%" filterable>
            <el-option v-for="p in parentOptions" :key="p.id" :label="p.name" :value="p.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="排序：">
          <el-input-number v-model="formData.sort" :min="0" :max="9999" placeholder="排序值" style="width: 100%" />
        </el-form-item>
      </el-form>
      <span slot="footer" class="dialog-footer">
        <el-button size="medium" @click="formData.dialogVisible = false">取 消</el-button>
        <el-button type="primary" size="medium" @click="submitForm()">确 定</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../api/region.js"></script>
  <script>
    new Vue({
      el: '#region-app',
      data() {
        return {
          input: { name: '', level: null },
          counts: 0,
          page: 1,
          pageSize: 10,
          tableData: [],
          loading: false,
          parentOptions: [],
          formData: {
            title: '', id: undefined, name: '', code: '', level: 1,
            parentId: null, sort: 0, dialogVisible: false
          }
        }
      },
      created() {
        this.init()
      },
      watch: {
        'formData.level': function(newVal) {
          // 省份级不需要上级
          if (newVal === 1) {
            this.formData.parentId = null
          } else {
            this.loadParentOptions(newVal)
          }
        }
      },
      methods: {
        async init() {
          this.loading = true
          const params = { page: this.page, pageSize: this.pageSize, name: this.input.name || undefined, level: this.input.level }
          const res = await regionPage(params)
          this.loading = false
          if (res.code === 1) {
            this.tableData = res.data.records || []
            this.counts = res.data.total || 0
          }
        },
        handleQuery() {
          this.page = 1
          this.init()
        },
        handleSizeChange(val) { this.pageSize = val; this.init() },
        handleCurrentChange(val) { this.page = val; this.init() },

        // 加载可选的上级地区
        async loadParentOptions(level) {
          // 2级城市需要选省份，3级区县需要选城市
          const parentLevel = level - 1
          const res = await regionPage({ page: 1, pageSize: 1000, level: parentLevel })
          if (res.code === 1) {
            this.parentOptions = res.data.records || []
          }
        },

        addHandle() {
          this.formData = {
            title: '新增地区', id: undefined, name: '', code: '', level: 1,
            parentId: null, sort: 0, dialogVisible: true
          }
          this.parentOptions = []
        },

        editHandle(row) {
          this.formData = {
            title: '修改地区', id: row.id, name: row.name, code: row.code || '',
            level: row.level, parentId: row.parentId, sort: row.sort || 0,
            dialogVisible: true
          }
          if (row.level !== 1) {
            this.loadParentOptions(row.level)
          }
        },

        async submitForm() {
          if (!this.formData.name || !this.formData.name.trim()) {
            this.$message.warning('请输入地区名称')
            return
          }
          const data = {
            id: this.formData.id,
            name: this.formData.name.trim(),
            code: this.formData.code || null,
            level: this.formData.level,
            parentId: this.formData.level === 1 ? 0 : this.formData.parentId,
            sort: this.formData.sort
          }
          let res
          if (this.formData.id) {
            res = await editRegion(data)
          } else {
            res = await addRegion(data)
          }
          if (res.code === 1) {
            this.$message.success(this.formData.id ? '修改成功' : '新增成功')
            this.formData.dialogVisible = false
            this.init()
          } else {
            this.$message.error(res.msg || '操作失败')
          }
        },

        deleteHandle(id) {
          this.$confirm('确认删除该地区吗？如有子级则无法删除。', '提示', { type: 'warning' }).then(async () => {
            const res = await deleteRegion(id)
            if (res.code === 1) {
              this.$message.success('删除成功')
              this.init()
            } else {
              this.$message.error(res.msg || '删除失败')
            }
          }).catch(() => {})
        },

        handleClose() {
          this.formData.dialogVisible = false
        }
      }
    })
  </script>
</body>
</html>
