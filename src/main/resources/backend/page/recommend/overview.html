<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>智能推荐概览</title>
    <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/components-stats-card.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fa; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
        .page-header { margin-bottom: 20px; }
        .page-header h2 { font-size: 20px; color: #303133; }
        .page-header p { font-size: 13px; color: #909399; margin-top: 4px; }
        .page-header .header-actions { float: right; margin-top: -24px; display: flex; gap: 8px; }

        /* 图表行 */
        .charts-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        .chart-panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
        .panel-title { font-size: 15px; font-weight: 600; color: #303133; margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid #ebeef5; display: flex; align-items: center; gap: 8px; }
        .panel-title .el-icon { color: #409eff; }
        .chart-box { width: 100%; height: 300px; }

        /* 热门排行 */
        .hot-section { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
        .dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .dish-card { border: 1px solid #ebeef5; border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
        .dish-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .dish-img { width: 100%; height: 120px; object-fit: cover; background: #f5f7fa; }
        .dish-body { padding: 10px 12px; }
        .dish-name { font-size: 14px; font-weight: 500; color: #303133; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dish-price { font-size: 15px; font-weight: 600; color: #e6420e; margin-top: 4px; }
        .dish-desc { font-size: 12px; color: #909399; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dish-sales { font-size: 11px; color: #67c23a; margin-top: 4px; }
        .rank-badge { position: absolute; top: 0; left: 0; padding: 2px 8px; font-size: 11px; font-weight: 700;
            border-radius: 0 0 6px 0; z-index: 1; }
        .rank-badge.r1 { background: #ff4d4f; color: #fff; }
        .rank-badge.r2 { background: #ff7a45; color: #fff; }
        .rank-badge.r3 { background: #ffa940; color: #fff; }

        .loading-wrap { text-align: center; padding: 60px 0; }
        .loading-wrap p { color: #909399; margin-top: 12px; }

        /* 推荐算法标签 */
        .algo-tags { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .algo-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #e4e7ed;
            cursor: pointer; transition: all 0.2s; color: #606266; }
        .algo-tag.active { background: #409eff; color: #fff; border-color: #409eff; }
        .algo-tag:hover:not(.active) { border-color: #409eff; color: #409eff; }

        @media (max-width: 1200px) {
            .stats-cards { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .stats-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="page-header">
        <h2>智能推荐概览</h2>
        <p>基于协同过滤、内容推荐和热门融合的混合推荐算法引擎，实时分析用户偏好</p>
        <div class="header-actions">
            <el-button type="primary" size="small" icon="el-icon-refresh" @click="refreshAll" :loading="loadingAll">刷新数据</el-button>
        </div>
    </div>

    <!-- 修改点：使用 <stat-cards> 统一组件替代手写 stat-card -->
    <stat-cards :cards="statsCards"></stat-cards>

    <!-- 图表行 -->
    <div class="charts-row">
        <!-- 推荐反馈分布 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-data-analysis"></i> 推荐反馈分布（近7天）
            </div>
            <div class="chart-box" id="feedbackChart"></div>
        </div>
        <!-- 用户偏好分布 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-pie-chart"></i> 用户口味偏好分布
            </div>
            <div class="chart-box" id="preferenceChart"></div>
        </div>
    </div>

    <div class="charts-row">
        <!-- 推荐算法效果对比 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-s-data"></i> 推荐算法效果对比
            </div>
            <div class="chart-box" id="algoChart"></div>
        </div>
        <!-- 浏览行为趋势 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-data-line"></i> 用户浏览行为趋势（近7天）
            </div>
            <div class="chart-box" id="browseChart"></div>
        </div>
    </div>

    <!-- 热门排行 -->
    <div class="hot-section">
        <div class="panel-title">
            <i class="el-icon-star-on" style="color:#e6a23c;"></i> 今日热门菜品排行
            <el-button type="primary" size="small" @click="refreshHotRank" :loading="loadingHot">刷新排行</el-button>
        </div>
        <div class="algo-tags">
            <span class="algo-tag" :class="{active: algoType === 'all'}" @click="loadHotByAlgo('all')">全部算法</span>
            <span class="algo-tag" :class="{active: algoType === 'cf'}" @click="loadHotByAlgo('cf')">协同过滤</span>
            <span class="algo-tag" :class="{active: algoType === 'content'}" @click="loadHotByAlgo('content')">内容推荐</span>
            <span class="algo-tag" :class="{active: algoType === 'hot'}" @click="loadHotByAlgo('hot')">热门排行</span>
        </div>
        <div v-if="!loadingHot" class="dish-grid">
            <div class="dish-card" v-for="(dish, idx) in hotDishes" :key="dish.id" style="position:relative;">
                <span v-if="idx < 3" :class="['rank-badge', 'r' + (idx + 1)]">TOP{{ idx + 1 }}</span>
                <img :src="dish.image ? getImageUrl(dish.image) : '../images/noImg.png'" class="dish-img" />
                <div class="dish-body">
                    <div class="dish-name">{{ dish.name }}</div>
                    <div class="dish-price">¥{{ formatPrice(dish.price) }}</div>
                    <div class="dish-desc">{{ dish.description || '暂无描述' }}</div>
                    <div class="dish-sales" v-if="dish.salesCount">📈 销量 {{ dish.salesCount }} 份</div>
                </div>
            </div>
        </div>
        <div v-else class="loading-wrap">
            <i class="el-icon-loading" style="font-size:32px; color:#909399;"></i>
            <p>加载热门数据中...</p>
        </div>
        <div v-if="!loadingHot && hotDishes.length === 0" class="loading-wrap">
            <i class="el-icon-document" style="font-size:32px; color:#c0c4cc;"></i>
            <p>暂无数据，请先确保有订单和浏览数据</p>
        </div>
    </div>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/recommend.js"></script>
<script src="../../js/components.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
        loadingAll: false,
        loadingHot: false,
        algoType: 'all',
        hotDishes: [],
        stats: {
            hybridRate: null, clickRate: null, conversionRate: null,
            recommendGMV: null, ctrTrend: null, cvrTrend: null
        },
        feedbackChart: null,
        preferenceChart: null,
        algoChart: null,
        browseChart: null
    },
    computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards() {
            var self = this;
            return [
                { key: '覆盖率', icon: '🎯', label: '推荐覆盖率', value: (self.stats.hybridRate != null ? self.stats.hybridRate + '%' : '--'), color: 'primary' },
                { key: 'CTR', icon: '👆', label: '推荐点击率 (CTR)', value: (self.stats.clickRate != null ? self.stats.clickRate + '%' : '--'), color: 'success' },
                { key: '转化率', icon: '🔄', label: '推荐转化率', value: (self.stats.conversionRate != null ? self.stats.conversionRate + '%' : '--'), color: 'warning' },
                { key: 'GMV', icon: '💰', label: '推荐贡献GMV', value: '¥' + self.formatValue(self.stats.recommendGMV), color: 'info' }
            ]
        }
    },
    mounted() {
        this.$nextTick(() => {
            this.feedbackChart = echarts.init(document.getElementById('feedbackChart'));
            this.preferenceChart = echarts.init(document.getElementById('preferenceChart'));
            this.algoChart = echarts.init(document.getElementById('algoChart'));
            this.browseChart = echarts.init(document.getElementById('browseChart'));
            window.addEventListener('resize', this.handleResize);
            this.loadAll();
        });
    },
    beforeDestroy() {
        window.removeEventListener('resize', this.handleResize);
        [this.feedbackChart, this.preferenceChart, this.algoChart, this.browseChart].forEach(c => {
            if (c) c.dispose();
        });
    },
    methods: {
        handleResize() {
            [this.feedbackChart, this.preferenceChart, this.algoChart, this.browseChart].forEach(c => {
                if (c) c.resize();
            });
        },
        loadAll() {
            this.loadingAll = true;
            this.loadStats();
            this.loadFeedback();
            this.loadPreferences();
            this.loadAlgoCompare();
            this.loadBrowseTrend();
            this.loadHotRank();
            Promise.all([]).finally(() => { this.loadingAll = false; });
        },
        refreshAll() { this.loadAll(); },

        // 加载推荐统计
        loadStats() {
            recommendBackendApi.getStats().then(res => {
                if (res.code === 1 && res.data) {
                    this.stats = Object.assign(this.stats, res.data);
                }
            }).catch(() => {});
        },

        // 加载反馈分布
        loadFeedback() {
            $axios.get('/recommend/feedback/stats', { params: { days: 7 } }).then(res => {
                if (res.code === 1 && res.data) {
                    this.renderFeedbackChart(res.data);
                } else {
                    this.renderFeedbackEmpty();
                }
            }).catch(() => this.renderFeedbackEmpty());
        },

        renderFeedbackChart(data) {
            if (!this.feedbackChart) return;
            var names = ['点击', '收藏', '加购', '下单', '不感兴趣'];
            var values = [data.click || 0, data.favorite || 0, data.cart || 0, data.order || 0, data.unlike || 0];
            var colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#c0c4cc'];
            this.feedbackChart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: 50, right: 20, top: 10, bottom: 40 },
                xAxis: { type: 'category', data: names, axisLabel: { fontSize: 12 } },
                yAxis: { type: 'value', name: '次数' },
                series: [{
                    type: 'bar', data: values.map((v, i) => ({ value: v, itemStyle: { color: colors[i],
                        borderRadius: [6, 6, 0, 0] } })), barWidth: 30,
                    label: { show: true, position: 'top', fontSize: 12, fontWeight: 600 }
                }]
            }, true);
        },

        renderFeedbackEmpty() {
            if (!this.feedbackChart) return;
            this.feedbackChart.setOption({
                title: { text: '暂无反馈数据', left: 'center', top: 'center',
                    textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true);
        },

        // 加载偏好分布
        loadPreferences() {
            $axios.get('/recommend/preference/distribution').then(res => {
                if (res.code === 1 && res.data && res.data.length > 0) {
                    this.renderPreferenceChart(res.data);
                } else {
                    this.renderPreferenceEmpty();
                }
            }).catch(() => this.renderPreferenceEmpty());
        },

        renderPreferenceChart(data) {
            if (!this.preferenceChart) return;
            var names = data.map(function(d) { return d.name; });
            var values = data.map(function(d) { return d.value; });
            this.preferenceChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                series: [{
                    type: 'pie', radius: ['50%', '75%'], center: ['50%', '50%'],
                    itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                    label: { fontSize: 12, formatter: '{b}\n{d}%' },
                    emphasis: { scaleSize: 8, label: { fontSize: 14, fontWeight: 'bold' } },
                    data: names.map(function(n, i) { return { name: n, value: values[i] }; })
                }]
            }, true);
        },

        renderPreferenceEmpty() {
            if (!this.preferenceChart) return;
            this.preferenceChart.setOption({
                title: { text: '暂无偏好数据，需用户产生浏览/下单行为', left: 'center', top: 'center',
                    textStyle: { color: '#c0c4cc', fontSize: 13, fontWeight: 'normal' } }
            }, true);
        },

        // 算法效果对比
        loadAlgoCompare() {
            $axios.get('/recommend/algo/compare').then(res => {
                if (res.code === 1 && res.data) {
                    this.renderAlgoChart(res.data);
                } else {
                    this.renderAlgoEmpty();
                }
            }).catch(() => this.renderAlgoEmpty());
        },

        renderAlgoChart(data) {
            if (!this.algoChart) return;
            var algos = data.algos || ['协同过滤', '内容推荐', '热门排行', '混合推荐'];
            var ctRates = data.ctRates || [0, 0, 0, 0];
            var cvRates = data.cvRates || [0, 0, 0, 0];
            this.algoChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { data: ['点击率%', '转化率%'], bottom: 0 },
                grid: { left: 50, right: 20, top: 10, bottom: 40 },
                xAxis: { type: 'category', data: algos, axisLabel: { fontSize: 12 } },
                yAxis: { type: 'value', name: '%', max: 100 },
                series: [
                    { name: '点击率%', type: 'bar', data: ctRates, barWidth: 20,
                        itemStyle: { color: '#5470c6', borderRadius: [6, 6, 0, 0] },
                        label: { show: true, position: 'top', fontSize: 11, formatter: '{c}%' } },
                    { name: '转化率%', type: 'bar', data: cvRates, barWidth: 20,
                        itemStyle: { color: '#91cc75', borderRadius: [6, 6, 0, 0] },
                        label: { show: true, position: 'top', fontSize: 11, formatter: '{c}%' } }
                ]
            }, true);
        },

        renderAlgoEmpty() {
            if (!this.algoChart) return;
            this.algoChart.setOption({
                title: { text: '暂无推荐算法数据', left: 'center', top: 'center',
                    textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true);
        },

        // 浏览趋势
        loadBrowseTrend() {
            $axios.get('/recommend/browse/trend', { params: { days: 7 } }).then(res => {
                if (res.code === 1 && res.data) {
                    this.renderBrowseChart(res.data);
                } else {
                    this.renderBrowseEmpty();
                }
            }).catch(() => this.renderBrowseEmpty());
        },

        renderBrowseChart(data) {
            if (!this.browseChart) return;
            var dates = data.dates || [];
            var browseCount = data.browseCount || [];
            var cartCount = data.cartCount || [];
            this.browseChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(255,255,255,0.95)',
                    borderColor: '#e4e7ed',
                    textStyle: { color: '#303133', fontSize: 12 }
                },
                legend: { data: ['浏览次数', '加购次数'], bottom: 0 },
                grid: { left: 50, right: 50, top: 10, bottom: 40 },
                xAxis: { type: 'category', data: dates, boundaryGap: false, axisLabel: { fontSize: 12 } },
                yAxis: { type: 'value', name: '次数' },
                series: [
                    { name: '浏览次数', type: 'line', data: browseCount, smooth: true,
                        symbol: 'circle', symbolSize: 6,
                        lineStyle: { color: '#5470c6', width: 3 },
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(84,112,198,0.25)' },
                            { offset: 1, color: 'rgba(84,112,198,0.02)' }]) } },
                    { name: '加购次数', type: 'line', data: cartCount, smooth: true,
                        symbol: 'circle', symbolSize: 6,
                        lineStyle: { color: '#91cc75', width: 3 },
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(145,204,117,0.25)' },
                            { offset: 1, color: 'rgba(145,204,117,0.02)' }]) } }
                ]
            }, true);
        },

        renderBrowseEmpty() {
            if (!this.browseChart) return;
            this.browseChart.setOption({
                title: { text: '暂无浏览数据', left: 'center', top: 'center',
                    textStyle: { color: '#c0c4cc', fontSize: 14, fontWeight: 'normal' } }
            }, true);
        },

        // 热门排行
        loadHotRank() { this.loadHotByAlgo('all'); },
        loadHotByAlgo(type) {
            this.algoType = type;
            this.loadingHot = true;
            recommendBackendApi.getHotRecommend(12).then(res => {
                if (res.code === 1) {
                    this.hotDishes = res.data || [];
                }
            }).catch(err => {
                console.error('加载热门排行失败:', err);
            }).finally(() => { this.loadingHot = false; });
        },
        refreshHotRank() {
            this.loadHotRank();
            this.$message.success('热门排行已刷新');
        },
        getImageUrl(image) {
            if (!image) return '';
            return image.startsWith('http') ? image : '/common/download?name=' + image;
        },
        formatPrice(price) {
            if (!price && price !== 0) return '0.00';
            if (typeof price !== 'number') price = Number(price)
            if (isNaN(price)) return '0.00'
            return price.toFixed(2);
        },
        formatValue(val) {
            if (val === null || val === undefined) return '--';
            if (typeof val !== 'number') val = Number(val)
            if (isNaN(val)) return '--'
            return val.toFixed(2);
        }
    }
});
</script>
</body>
</html>
