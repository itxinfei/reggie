<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能推荐概览 - 瑞吉外卖管理端</title>
  <link rel="stylesheet" href="../../plugins/remixicon/remixicon.css" />

  <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
    <script src="../../plugins/echarts/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-page); font-family: var(--font-family-base); }

        /* 图表行 */
        .charts-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        .chart-panel { background: var(--bg-surface); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-xs); }
        .panel-title { font-size:var(--font-size-md); font-weight: 600; color: var(--el-text-primary); margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid var(--el-border-light); display: flex; align-items: center; gap: 8px; }
        .panel-title .el-icon { color: var(--el-color-primary); }
        .chart-box { width: 100%; height: 300px; }

        /* 热门排行 */
        .hot-section { background: var(--bg-surface); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-xs); }
        .dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .dish-card { border: 1px solid var(--el-border-light); border-radius: var(--radius-md); overflow: hidden; cursor: pointer; transition: all 0.2s; }
        .dish-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .dish-img { width: 100%; height: 120px; object-fit: cover; background: var(--el-bg-subtle); }
        .dish-body { padding: 10px 12px; }
        .dish-name { font-size:var(--font-size-base); font-weight: 500; color: var(--el-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dish-price { font-size:var(--font-size-md); font-weight: 600; color: var(--color-brand-700); margin-top: 4px; }
        .dish-desc { font-size:var(--font-size-xs); color: var(--color-info); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dish-sales { font-size: var(--font-size-xs); color: var(--color-success); margin-top: 4px; }
        .rank-badge { position: absolute; top: 0; left: 0; padding: 2px 8px; font-size: var(--font-size-xs); font-weight: 700;
            border-radius: var(--radius-sm) 0 var(--radius-md) 0; z-index: 1; }
        .rank-badge.r1 { background: var(--color-danger); color: var(--bg-surface); }
        .rank-badge.r2 { background: var(--color-brand-500); color: var(--text-on-brand); }
        .rank-badge.r3 { background: var(--color-warning); color: var(--bg-surface); }

        .loading-wrap { text-align: center; padding: 60px 0; }
        .loading-wrap p { color: var(--color-info); margin-top: 12px; }

        /* 推荐算法标签 */
        .algo-tags { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .algo-tag { padding: 4px 12px; border-radius: var(--radius-lg); font-size:var(--font-size-xs); border: 1px solid var(--el-border-lighter2);
            cursor: pointer; transition: all 0.2s; color: var(--el-text-regular); }
        .algo-tag.active { background: var(--el-color-primary); color: var(--bg-surface); border-color: var(--el-color-primary); }
        .algo-tag:hover:not(.active) { border-color: var(--el-color-primary); color: var(--el-color-primary); }

        @media (max-width: 1200px) {
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<!-- 键盘用户：跳转到主内容（WCAG 2.4.1） -->
<a href="#main-content" class="skip-link">跳转到主内容</a>
<div class="dashboard-container" id="app">
  <div class="container" id="main-content" role="main" aria-label="页面主要内容">
    <!-- 页头：标题 + 副标题 + 操作（与全站 ds-page-header 规范一致） -->
    <header class="ds-page-header">
      <div class="ds-page-header__titles">
        <h1 class="ds-page-header__title" id="page-title">智能推荐概览</h1>
        <p class="ds-page-header__subtitle">基于销量聚合的菜品热门排行，算法效果对比与浏览行为趋势实时分析</p>
      </div>
      <div class="ds-page-header__actions">
        <el-button type="primary" size="small" icon="el-icon-refresh" @click="refreshAll" :loading="loadingAll">刷新数据</el-button>
      </div>
    </header>

    <!-- 修改点：使用 <stat-cards> 统一组件替代手写 stat-card -->
    <stat-cards :cards="statsCards"></stat-cards>

    <!-- 图表行 -->
    <div class="charts-row">
        <!-- 推荐反馈分布 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-data-analysis"></i> 推荐反馈分布（近7天）
            </div>
            <div class="chart-box" id="feedbackChart"></div>
        </div>
        <!-- 用户偏好分布 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-pie-chart"></i> 用户口味偏好分布
            </div>
            <div class="chart-box" id="preferenceChart"></div>
        </div>
    </div>

    <div class="charts-row">
        <!-- 推荐算法效果对比 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-s-data"></i> 推荐算法效果对比
            </div>
            <div class="chart-box" id="algoChart"></div>
        </div>
        <!-- 浏览行为趋势 -->
        <div class="chart-panel">
            <div class="panel-title">
                <i class="el-icon-data-line"></i> 用户浏览行为趋势（近7天）
            </div>
            <div class="chart-box" id="browseChart"></div>
        </div>
    </div>

    <!-- 热门排行 -->
    <div class="hot-section">
        <div class="panel-title">
            <i class="el-icon-star-on" style="color:var(--color-warning);"></i> 今日热门菜品排行
            <el-button type="primary" size="small" @click="refreshHotRank" :loading="loadingHot">刷新排行</el-button>
        </div>
        <!-- 修改点：后端 /recommend/hot 仅按销量聚合排序，不支持 cf/content 算法维度；
             原「协同过滤/内容推荐」标签与「热门排行」请求同一接口、数据完全相同，属误导性功能，已移除 -->
        <div class="algo-tags">
            <span class="algo-tag" :class="{active: algoType === 'all'}" role="button" tabindex="0" @click="loadHotByAlgo('all')" @keydown.enter="loadHotByAlgo('all')" :aria-pressed="algoType === 'all'">全部算法</span>
            <span class="algo-tag" :class="{active: algoType === 'hot'}" role="button" tabindex="0" @click="loadHotByAlgo('hot')" @keydown.enter="loadHotByAlgo('hot')" :aria-pressed="algoType === 'hot'">热门排行</span>
        </div>
        <div v-if="!loadingHot" class="dish-grid">
            <div class="dish-card" v-for="(dish, idx) in hotDishes" :key="dish.id" style="position:relative;">
                <span v-if="idx < 3" :class="['rank-badge', 'r' + (idx + 1)]">TOP{{ idx + 1 }}</span>
                <img :src="dish.image ? getImageUrl(dish.image) : '../images/noImg.png'" class="dish-img" alt="热销菜品图片" />
                <div class="dish-body">
                    <div class="dish-name">{{ dish.name }}</div>
                    <div class="dish-price">¥{{ formatPrice(dish.price) }}</div>
                    <div class="dish-desc">{{ dish.description || '暂无描述' }}</div>
                    <div class="dish-sales" v-if="dish.salesCount"><i class="ri-line-chart-line" aria-hidden="true"></i> 销量 {{ dish.salesCount }} 份</div>
                </div>
            </div>
        </div>
        <div v-else class="loading-wrap">
            <i class="el-icon-loading" style="font-size:var(--font-size-4xl); color:var(--color-info);"></i>
            <p>加载热门数据中...</p>
        </div>
        <div v-if="!loadingHot && hotDishes.length === 0" class="loading-wrap">
            <i class="el-icon-document" style="font-size:var(--font-size-4xl); color:var(--text-muted);"></i>
            <p>暂无数据，请先确保有订单和浏览数据</p>
        </div>
    </div>
  </div>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/accessibility-utils.js"></script>
<script src="../../js/performance-utils.js"></script>
<script src="../../api/recommend.js"></script>
<script src="../../js/components.js"></script>
<script>
  // 图表语义色统一引用全局 window.RgPalette（components.js 从 tokens.css 运行时解析，
  // canvas 无法使用 CSS 变量，RgPalette 为 JS 侧唯一颜色来源）；多色系列数据色保留图表调色板
  new Vue({
    el: '#app',
    data: {
        loadingAll: false,
        loadingHot: false,
        algoType: 'all',
        hotDishes: [],
        stats: {
            hybridRate: null, clickRate: null, conversionRate: null,
            recommendGMV: null, ctrTrend: null, cvrTrend: null
        },
        feedbackChart: null,
        preferenceChart: null,
        algoChart: null,
        browseChart: null
    },
    computed: {
        // 修改点：statsCards 统一卡片配置（供 <stat-cards> 组件使用）
        statsCards() {
            const self = this;
            return [
                { key: '覆盖率', icon: 'ri-focus-3-line', label: '推荐覆盖率', value: (self.stats.hybridRate != null ? self.stats.hybridRate + '%' : '--'), color: 'primary' },
                { key: 'CTR', icon: 'ri-cursor-line', label: '推荐点击率 (CTR)', value: (self.stats.clickRate != null ? self.stats.clickRate + '%' : '--'), color: 'success' },
                { key: '转化率', icon: 'ri-refresh-line', label: '推荐转化率', value: (self.stats.conversionRate != null ? self.stats.conversionRate + '%' : '--'), color: 'warning' },
                { key: 'GMV', icon: 'ri-money-cny-circle-line', label: '推荐贡献GMV', value: '¥' + self.formatValue(self.stats.recommendGMV), color: 'info' }
            ]
        }
    },
    mounted() {
        this.$nextTick(() => {
            this.feedbackChart = echarts.init(document.getElementById('feedbackChart'));
            this.preferenceChart = echarts.init(document.getElementById('preferenceChart'));
            this.algoChart = echarts.init(document.getElementById('algoChart'));
            this.browseChart = echarts.init(document.getElementById('browseChart'));
            window.addEventListener('resize', this.handleResize);
            this.loadAll();
        });
    },
    beforeDestroy() {
        window.removeEventListener('resize', this.handleResize);
        [this.feedbackChart, this.preferenceChart, this.algoChart, this.browseChart].forEach(c => {
            if (c) c.dispose();
        });
    },
    methods: {
        handleResize() {
            [this.feedbackChart, this.preferenceChart, this.algoChart, this.browseChart].forEach(c => {
                if (c) c.resize();
            });
        },
        loadAll() {
            this.loadingAll = true;
            // 修改点：真实等待全部数据请求完成后再收起「刷新数据」loading，避免 Promise.all([]) 导致 loading 瞬间消失
            Promise.all([
                this.loadStats(),
                this.loadFeedback(),
                this.loadPreferences(),
                this.loadAlgoCompare(),
                this.loadBrowseTrend(),
                this.loadHotRank()
            ]).finally(() => { this.loadingAll = false; });
        },
        refreshAll() { this.loadAll(); },

        // 加载推荐统计
        loadStats() {
            // 修改点：return Promise 链，供 loadAll 的 Promise.all 真实等待
            return recommendBackendApi.getStats().then(res => {
                if (res.code === 1 && res.data) {
                    this.stats = Object.assign(this.stats, res.data);
                }
            }).catch((err) => { console.warn('[推荐] 加载统计数据失败:', err) });
        },

        // 加载反馈分布
        loadFeedback() {
            // 修改点：return Promise 链，供 loadAll 的 Promise.all 真实等待
            return recommendBackendApi.getFeedbackStats({ days: 7 }).then(res => {
                if (res.code === 1 && res.data) {
                    this.renderFeedbackChart(res.data);
                } else {
                    this.renderFeedbackEmpty();
                }
            }).catch(() => this.renderFeedbackEmpty());
        },

        renderFeedbackChart(data) {
            if (!this.feedbackChart) return;
            const names = [];
            const values = [];
            const colors = [];
            this.feedbackChart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: 50, right: 20, top: 10, bottom: 40 },
                xAxis: { type: 'category', data: names, axisLabel: { fontSize: 12 } },
                yAxis: { type: 'value', name: '次数' },
                series: [{
                    type: 'bar', data: values.map((v, i) => ({ value: v, itemStyle: { color: colors[i],
                        borderRadius: [RgPalette.radiusMd, RgPalette.radiusMd, 0, 0] } })), barWidth: 30,
                    label: { show: true, position: 'top', fontSize: 12, fontWeight: 600 }
                }]
            }, true);
        },

        renderFeedbackEmpty() {
            if (!this.feedbackChart) return;
            this.feedbackChart.setOption({
                title: { text: '暂无反馈数据', left: 'center', top: 'center',
                    textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } }
            }, true);
        },

        // 加载偏好分布
        loadPreferences() {
            // 修改点：return Promise 链，供 loadAll 的 Promise.all 真实等待
            return recommendBackendApi.getPreferenceDistribution().then(res => {
                if (res.code === 1 && res.data && res.data.length > 0) {
                    this.renderPreferenceChart(res.data);
                } else {
                    this.renderPreferenceEmpty();
                }
            }).catch(() => this.renderPreferenceEmpty());
        },

        renderPreferenceChart(data) {
            if (!this.preferenceChart) return;
            var names = data.map(function(d) { return d.name; });
            var values = data.map(function(d) { return d.value; });
            this.preferenceChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                series: [{
                    type: 'pie', radius: ['50%', '75%'], center: ['50%', '50%'],
                    itemStyle: { borderRadius: RgPalette.radiusMd, borderColor: RgPalette.white, borderWidth: 2 },
                    label: { fontSize: 12, formatter: '{b}\n{d}%' },
                    emphasis: { scaleSize: 8, label: { fontSize: 14, fontWeight: 'bold' } },
                    data: names.map(function(n, i) { return { name: n, value: values[i] }; })
                }]
            }, true);
        },

        renderPreferenceEmpty() {
            if (!this.preferenceChart) return;
            this.preferenceChart.setOption({
                title: { text: '暂无偏好数据，需用户产生浏览/下单行为', left: 'center', top: 'center',
                    textStyle: { color: RgPalette.textSecondary, fontSize: 13, fontWeight: 'normal' } }
            }, true);
        },

        // 算法效果对比
        loadAlgoCompare() {
            // 修改点：return Promise 链，供 loadAll 的 Promise.all 真实等待
            return recommendBackendApi.getAlgoCompare().then(res => {
                if (res.code === 1 && res.data) {
                    this.renderAlgoChart(res.data);
                } else {
                    this.renderAlgoEmpty();
                }
            }).catch(() => this.renderAlgoEmpty());
        },

        renderAlgoChart(data) {
            if (!this.algoChart) return;
            const algos = data.algos || ['协同过滤', '内容推荐', '热门排行', '混合推荐'];
            const ctRates = data.ctRates || [0, 0, 0, 0];
            const cvRates = data.cvRates || [0, 0, 0, 0];
            this.algoChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { data: ['点击率%', '转化率%'], bottom: 0 },
                grid: { left: 50, right: 20, top: 10, bottom: 40 },
                xAxis: { type: 'category', data: algos, axisLabel: { fontSize: 12 } },
                yAxis: { type: 'value', name: '%', max: 100 },
                series: [
                    { name: '点击率%', type: 'bar', data: ctRates, barWidth: 20,
                        itemStyle: { color: RgPalette.seriesBlue, borderRadius: [RgPalette.radiusMd, RgPalette.radiusMd, 0, 0] },
                        label: { show: true, position: 'top', fontSize: 11, formatter: '{c}%' } },
                    { name: '转化率%', type: 'bar', data: cvRates, barWidth: 20,
                        itemStyle: { color: RgPalette.seriesGreen, borderRadius: [RgPalette.radiusMd, RgPalette.radiusMd, 0, 0] },
                        label: { show: true, position: 'top', fontSize: 11, formatter: '{c}%' } }
                ]
            }, true);
        },

        renderAlgoEmpty() {
            if (!this.algoChart) return;
            this.algoChart.setOption({
                title: { text: '暂无推荐算法数据', left: 'center', top: 'center',
                    textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } }
            }, true);
        },

        // 浏览趋势
        loadBrowseTrend() {
            // 修改点：return Promise 链，供 loadAll 的 Promise.all 真实等待
            return recommendBackendApi.getBrowseTrend({ days: 7 }).then(res => {
                if (res.code === 1 && res.data) {
                    this.renderBrowseChart(res.data);
                } else {
                    this.renderBrowseEmpty();
                }
            }).catch(() => this.renderBrowseEmpty());
        },

        renderBrowseChart(data) {
            if (!this.browseChart) return;
            const dates = data.dates || [];
            const browseCount = data.browseCount || [];
            const cartCount = data.cartCount || [];
            this.browseChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(255,255,255,0.95)',
                    borderColor: RgPalette.borderLighter2,
                    textStyle: { color: RgPalette.textPrimary, fontSize: 12 }
                },
                legend: { data: ['浏览次数', '加购次数'], bottom: 0 },
                grid: { left: 50, right: 50, top: 10, bottom: 40 },
                xAxis: { type: 'category', data: dates, boundaryGap: false, axisLabel: { fontSize: 12 } },
                yAxis: { type: 'value', name: '次数' },
                series: [
                    { name: '浏览次数', type: 'line', data: browseCount, smooth: true,
                        symbol: 'circle', symbolSize: 6,
                        lineStyle: { color: RgPalette.seriesBlue, width: 3 },
                        areaStyle: { color: RgPalette.seriesBlueArea } },
                    { name: '加购次数', type: 'line', data: cartCount, smooth: true,
                        symbol: 'circle', symbolSize: 6,
                        lineStyle: { color: RgPalette.seriesGreen, width: 3 },
                        areaStyle: { color: RgPalette.seriesGreenArea } }
                ]
            }, true);
        },

        renderBrowseEmpty() {
            if (!this.browseChart) return;
            this.browseChart.setOption({
                title: { text: '暂无浏览数据', left: 'center', top: 'center',
                    textStyle: { color: RgPalette.textSecondary, fontSize: 14, fontWeight: 'normal' } }
            }, true);
        },

        // 热门排行
        loadHotRank() { return this.loadHotByAlgo('all'); },
        loadHotByAlgo(type) {
            this.algoType = type;
            this.loadingHot = true;
            // 修改点：return Promise 链，供 loadAll 的 Promise.all 真实等待
            return recommendBackendApi.getHotRecommend(12).then(res => {
                if (res.code === 1) {
                    this.hotDishes = res.data || [];
                }
                return res;
            }).catch(err => {
                ReggieUI.error('加载热门排行失败');
            }).finally(() => { this.loadingHot = false; });
        },
        refreshHotRank() {
            this.loadHotRank();
            ReggieUI.success('热门排行已刷新');
        },
        getImageUrl(image) {
            if (!image) return '';
            return image.startsWith('http') ? image : '/common/download?name=' + image;
        },
        formatPrice(price) {
            if (!price && price !== 0) return '0.00';
            if (typeof price !== 'number') price = Number(price)
            if (isNaN(price)) return '0.00'
            return price.toFixed(2);
        },
        formatValue(val) {
            if (val === null || val === undefined) return '--';
            if (typeof val !== 'number') val = Number(val)
            if (isNaN(val)) return '--'
            return val.toFixed(2);
        }
    }
});
</script>
</body>
</html>
